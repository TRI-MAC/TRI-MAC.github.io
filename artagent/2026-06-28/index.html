<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generative Art 2026-06-28</title>
<style>
  :root{
    --bg1:#eef2df;
    --bg2:#dbe3c9;
    --ink:#1f261d;
    --ink-soft:#4b5448;
    --jade:#6e8f76;
    --moss:#87986f;
    --mist:#f6f7ef;
    --petal:#c96a76;
    --gold:#b58a46;
    --frame:#2c2b22;
    --paper:#f1ead8;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 20%, #f8f6ea 0%, #ebeddc 28%, #d4ddc2 64%, #bcc7aa 100%);
    font-family: Georgia, serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #stage{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(120% 70% at 50% 8%, rgba(255,251,233,.95) 0%, rgba(241,236,214,.8) 28%, rgba(214,223,195,.72) 58%, rgba(191,202,171,.95) 100%),
      linear-gradient(to bottom, #f3efdd 0%, #e5e7d1 34%, #cfd8bf 60%, #b8c4a4 100%);
    box-shadow:0 25px 60px rgba(0,0,0,.22);
  }

  /* Paper / wash */
  #paperTexture, #mistCanvas, #grassCanvas, #frontCanvas, #deerCanvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
  }
  #paperTexture{opacity:.42; mix-blend-mode:multiply;}
  #mistCanvas{opacity:.72;}
  #grassCanvas{opacity:.98;}
  #deerCanvas{opacity:1;}
  #frontCanvas{opacity:.95; pointer-events:none;}

  /* Background washes */
  .wash{
    position:absolute; inset:auto;
    filter:blur(34px);
    border-radius:50%;
    opacity:.55;
    mix-blend-mode:multiply;
    animation: breathe 26s ease-in-out infinite;
  }
  .wash.w1{
    width:58%; height:18%;
    left:10%; top:13%;
    background:radial-gradient(circle, rgba(117,149,117,.46) 0%, rgba(117,149,117,.18) 40%, rgba(117,149,117,0) 76%);
    animation-delay:-5s;
  }
  .wash.w2{
    width:44%; height:20%;
    right:6%; top:24%;
    background:radial-gradient(circle, rgba(177,138,82,.34) 0%, rgba(177,138,82,.12) 44%, rgba(177,138,82,0) 78%);
    animation-duration:30s;
  }
  .wash.w3{
    width:60%; height:26%;
    left:-6%; bottom:20%;
    background:radial-gradient(circle, rgba(101,119,83,.35) 0%, rgba(101,119,83,.1) 44%, rgba(101,119,83,0) 80%);
    animation-duration:32s;
    animation-delay:-12s;
  }

  /* Bamboo silhouettes */
  #bambooLayer{
    position:absolute; inset:0;
    opacity:.3;
    mix-blend-mode:multiply;
  }
  #bambooLayer .stalk{
    position:absolute;
    bottom:-4%;
    width:1.35%;
    background:linear-gradient(to bottom, rgba(49,60,46,.72), rgba(67,86,58,.45));
    border-radius:999px;
    transform-origin:bottom center;
    animation: sway 16s ease-in-out infinite;
  }
  #bambooLayer .stalk:before{
    content:"";
    position:absolute;
    left:-120%;
    top:10%;
    width:340%;
    height:.7%;
    min-height:2px;
    background:rgba(40,52,39,.3);
    box-shadow:
      0 170px 0 rgba(40,52,39,.22),
      0 335px 0 rgba(40,52,39,.24),
      0 510px 0 rgba(40,52,39,.2),
      0 710px 0 rgba(40,52,39,.18),
      0 950px 0 rgba(40,52,39,.15);
  }

  /* Portal zone */
  #portalWrap{
    position:absolute;
    left:11%;
    top:16%;
    width:78%;
    height:49%;
    transform:rotate(-2.8deg);
    z-index:7;
  }
  #portalShadow{
    position:absolute; inset:4% 2% -2% 4%;
    filter:blur(26px);
    background:radial-gradient(ellipse at 50% 50%, rgba(57,53,41,.36), rgba(57,53,41,0) 72%);
    transform:translateY(18px) rotate(1deg);
  }
  #portalFrame{
    position:absolute; inset:0;
    border-radius:4% 6% 5% 5% / 4% 5% 6% 5%;
    background:
      linear-gradient(135deg, rgba(51,47,35,.98), rgba(77,65,45,.96) 48%, rgba(32,29,22,.98)),
      linear-gradient(to bottom, rgba(240,222,182,.18), rgba(0,0,0,0));
    box-shadow:
      inset 0 0 0 18px rgba(53,44,31,.88),
      inset 0 0 0 32px rgba(199,171,111,.3),
      0 18px 30px rgba(0,0,0,.22);
  }
  #frameInk{
    position:absolute; inset:2.6%;
    border-radius:4%;
    pointer-events:none;
    overflow:hidden;
    opacity:.9;
  }
  #frameInk:before, #frameInk:after{
    content:"";
    position:absolute;
    inset:-10%;
    background:
      radial-gradient(circle at 12% 20%, rgba(36,35,28,.65) 0 3%, transparent 4%),
      radial-gradient(circle at 86% 18%, rgba(36,35,28,.58) 0 2.8%, transparent 4%),
      radial-gradient(circle at 12% 84%, rgba(36,35,28,.5) 0 3%, transparent 4%),
      radial-gradient(circle at 84% 86%, rgba(36,35,28,.52) 0 2.4%, transparent 4%);
    filter:blur(2px);
  }
  #frameSvg{
    position:absolute; inset:1.8%;
    width:96.4%; height:96.4%;
    overflow:visible;
  }

  #artPortal{
    position:absolute;
    inset:8.4%;
    overflow:hidden;
    border-radius:2.5%;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.12),
      inset 0 0 30px rgba(255,245,230,.14);
    background:
      radial-gradient(circle at 50% 10%, rgba(255,248,230,.26), rgba(255,248,230,0) 42%),
      linear-gradient(to bottom, rgba(255,255,255,.1), rgba(0,0,0,0));
  }
  #art-image{
    position:absolute;
    inset:-2%;
    width:104%;
    height:104%;
    object-fit:cover;
    opacity:.95;
    filter:saturate(.84) contrast(1.02) brightness(.98) sepia(.12) hue-rotate(-8deg);
    transform:scale(1.03);
  }
  #portalTint{
    position:absolute; inset:0;
    background:
      linear-gradient(to bottom, rgba(248,244,228,.12), rgba(94,122,94,.05) 40%, rgba(43,54,34,.08) 100%),
      radial-gradient(circle at 50% 18%, rgba(255,248,230,.18), rgba(255,248,230,0) 44%);
    mix-blend-mode:multiply;
    pointer-events:none;
  }

  /* plum / nouveau vines around frame */
  .vine{
    position:absolute;
    width:44%;
    height:24%;
    border:9px solid transparent;
    border-top-color:rgba(58,64,47,.76);
    border-right-color:rgba(58,64,47,.58);
    border-radius:60% 40% 60% 40%;
    filter:blur(.2px);
    opacity:.7;
    animation: vineMove 20s ease-in-out infinite;
    z-index:9;
  }
  .vine.v1{ left:2%; top:8%; transform:rotate(-16deg); }
  .vine.v2{ right:2%; top:12%; transform:scaleX(-1) rotate(-10deg); animation-delay:-7s;}
  .vine.v3{ left:3%; bottom:33%; width:38%; height:16%; transform:rotate(12deg); animation-duration:24s; animation-delay:-10s;}
  .blossom{
    position:absolute;
    width:20px; height:20px;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #f5dfd8 0 16%, transparent 17%),
      radial-gradient(circle at 30% 42%, rgba(210,121,133,.92) 0 26%, transparent 27%),
      radial-gradient(circle at 70% 42%, rgba(210,121,133,.92) 0 26%, transparent 27%),
      radial-gradient(circle at 36% 74%, rgba(210,121,133,.92) 0 26%, transparent 27%),
      radial-gradient(circle at 64% 74%, rgba(210,121,133,.92) 0 26%, transparent 27%);
    filter:blur(.2px);
    opacity:.8;
    animation: blossomPulse 10s ease-in-out infinite;
    z-index:10;
  }

  /* Mist bands front/back */
  .mistBand{
    position:absolute;
    left:-8%;
    width:116%;
    height:10%;
    border-radius:50%;
    filter:blur(18px);
    background:
      linear-gradient(to right, rgba(255,255,255,0), rgba(247,246,239,.5) 14%, rgba(248,247,242,.7) 50%, rgba(247,246,239,.5) 86%, rgba(255,255,255,0));
    animation: drift 28s linear infinite;
    z-index:6;
    opacity:.52;
  }
  .mistBand.b1{ top:47%; animation-duration:31s; }
  .mistBand.b2{ top:56%; opacity:.42; animation-duration:38s; animation-delay:-10s;}
  .mistBand.b3{ top:64%; opacity:.34; animation-duration:35s; animation-delay:-18s;}

  /* swallow motif, stylised */
  #swallowSvg{
    position:absolute;
    inset:0;
    z-index:11;
    pointer-events:none;
    opacity:.24;
  }

  /* foreground reeds overlay */
  #foregroundReeds{
    position:absolute;
    left:-4%;
    bottom:-2%;
    width:108%;
    height:34%;
    z-index:12;
    pointer-events:none;
    mask-image:linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,.95) 70%, rgba(0,0,0,0));
  }

  /* Date only */
  #dateStamp{
    position:absolute;
    right:16px;
    bottom:12px;
    color:rgba(23,26,20,.52);
    font-size:13px;
    letter-spacing:.08em;
    z-index:20;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:22px;
    bottom:108px;
    opacity:.58;
    filter:saturate(.6) sepia(.15) hue-rotate(14deg) brightness(.84);
    z-index:13;
    transform:rotate(-6deg);
  }

  @keyframes breathe{
    0%,100%{transform:scale(1) translateY(0)}
    50%{transform:scale(1.08) translateY(-8px)}
  }
  @keyframes sway{
    0%,100%{transform:rotate(-1deg)}
    50%{transform:rotate(1.6deg)}
  }
  @keyframes drift{
    0%{transform:translateX(-5%)}
    50%{transform:translateX(5%)}
    100%{transform:translateX(-5%)}
  }
  @keyframes vineMove{
    0%,100%{filter:blur(.2px); transform-origin:20% 50%}
    50%{filter:blur(.15px)}
  }
  @keyframes blossomPulse{
    0%,100%{transform:scale(.95); opacity:.75}
    50%{transform:scale(1.07); opacity:.9}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="paperTexture" width="1080" height="1920"></canvas>

  <div class="wash w1"></div>
  <div class="wash w2"></div>
  <div class="wash w3"></div>

  <div id="bambooLayer">
    <div class="stalk" style="left:6%;height:86%;transform:rotate(-2deg);animation-delay:-2s"></div>
    <div class="stalk" style="left:11%;height:79%;transform:rotate(1.4deg);animation-delay:-9s"></div>
    <div class="stalk" style="right:8%;height:83%;transform:rotate(2deg);animation-delay:-5s"></div>
    <div class="stalk" style="right:13%;height:74%;transform:rotate(-1deg);animation-delay:-11s"></div>
  </div>

  <canvas id="mistCanvas" width="1080" height="1920"></canvas>

  <div id="portalWrap">
    <div id="portalShadow"></div>
    <div id="portalFrame"></div>
    <div id="frameInk"></div>
    <svg id="frameSvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="softInk">
          <feGaussianBlur stdDeviation="0.15"/>
        </filter>
      </defs>
      <path d="M8 20 C 18 10, 30 10, 38 20 C 45 28, 46 38, 40 47 C 35 55, 22 58, 16 67" fill="none" stroke="rgba(55,62,45,.8)" stroke-width="1.8" stroke-linecap="round" filter="url(#softInk)"/>
      <path d="M92 17 C 82 11, 70 11, 62 20 C 54 29, 53 39, 60 48 C 65 55, 78 56, 84 64" fill="none" stroke="rgba(55,62,45,.8)" stroke-width="1.8" stroke-linecap="round" filter="url(#softInk)"/>
      <path d="M11 82 C 22 72, 30 71, 39 77 C 48 84, 50 90, 48 95" fill="none" stroke="rgba(55,62,45,.78)" stroke-width="1.8" stroke-linecap="round" filter="url(#softInk)"/>
      <path d="M88 77 C 79 70, 68 70, 61 78 C 55 85, 54 91, 55 95" fill="none" stroke="rgba(55,62,45,.78)" stroke-width="1.8" stroke-linecap="round" filter="url(#softInk)"/>
      <g fill="rgba(205,117,129,.84)">
        <circle cx="18" cy="16" r="1.4"/><circle cx="21" cy="13.5" r="1.2"/><circle cx="24" cy="16" r="1.3"/>
        <circle cx="79" cy="14.5" r="1.2"/><circle cx="82" cy="12" r="1"/><circle cx="85" cy="14.8" r="1.2"/>
        <circle cx="20" cy="78" r="1.2"/><circle cx="22.8" cy="75.5" r="1"/><circle cx="26" cy="77.8" r="1.3"/>
      </g>
    </svg>
    <div id="artPortal">
      <img id="art-image" src="art.png" alt="">

  </div>

  <div class="vine v1"></div>
  <div class="vine v2"></div>
  <div class="vine v3"></div>

  <div class="blossom" style="left:106px;top:248px;"></div>
  <div class="blossom" style="left:168px;top:214px;transform:scale(.8);animation-delay:-3s;"></div>
  <div class="blossom" style="right:128px;top:238px;transform:scale(.9);animation-delay:-5s;"></div>
  <div class="blossom" style="left:148px;top:1040px;transform:scale(.72);animation-delay:-7s;"></div>

  <canvas id="grassCanvas" width="1080" height="1920"></canvas>
  <canvas id="deerCanvas" width="1080" height="1920"></canvas>

  <div class="mistBand b1"></div>
  <div class="mistBand b2"></div>
  <div class="mistBand b3"></div>

  <svg id="swallowSvg" viewBox="0 0 1080 1920" aria-hidden="true">
    <defs>
      <filter id="blurSw"><feGaussianBlur stdDeviation="0.8"/></filter>
    </defs>
    <g filter="url(#blurSw)" fill="rgba(30,36,29,.45)">
      <path d="M240 240 C 292 208, 340 206, 392 232 C 360 236, 330 256, 307 288 C 286 264, 264 248, 240 240 Z"/>
      <path d="M392 232 C 446 204, 498 204, 548 244 C 510 242, 474 260, 447 292 C 431 267, 413 247, 392 232 Z"/>
    </g>
  </svg>

  <svg id="foregroundReeds" viewBox="0 0 1080 500" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="reedGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="rgba(69,84,49,.05)"/>
        <stop offset="100%" stop-color="rgba(44,55,33,.92)"/>
      </linearGradient>
    </defs>
    <g fill="url(#reedGrad)">
      <path d="M20 500 L46 160 L74 500 Z"/>
      <path d="M80 500 L108 110 L132 500 Z"/>
      <path d="M132 500 L165 180 L198 500 Z"/>
      <path d="M200 500 L225 128 L251 500 Z"/>
      <path d="M260 500 L284 172 L312 500 Z"/>
      <path d="M322 500 L350 118 L376 500 Z"/>
      <path d="M392 500 L418 200 L446 500 Z"/>
      <path d="M448 500 L476 132 L502 500 Z"/>
      <path d="M520 500 L546 170 L572 500 Z"/>
      <path d="M580 500 L612 100 L644 500 Z"/>
      <path d="M650 500 L674 152 L700 500 Z"/>
      <path d="M716 500 L746 118 L776 500 Z"/>
      <path d="M790 500 L816 186 L842 500 Z"/>
      <path d="M860 500 L886 132 L916 500 Z"/>
      <path d="M928 500 L954 170 L982 500 Z"/>
      <path d="M992 500 L1020 138 L1050 500 Z"/>
    </g>
  </svg>

  <canvas id="frontCanvas" width="1080" height="1920"></canvas>

  <img id="guinea-pig" src="guineapig.png" alt="">

  <div id="dateStamp">2026-06-28</div>

<script>
(() => {
  const W = 1080, H = 1920;
  const seedStr = "2026-06-28";
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = (seed * 131 + seedStr.charCodeAt(i)) >>> 0;
  function rnd(){
    seed = (1664525 * seed + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  function lerp(a,b,t){ return a + (b-a)*t; }

  // Paper texture
  const paper = document.getElementById('paperTexture');
  const pctx = paper.getContext('2d');
  pctx.fillStyle = 'rgba(84,72,52,0.03)';
  for(let i=0;i<7000;i++){
    const x = rnd()*W, y = rnd()*H, r = rnd()*1.1 + 0.2;
    pctx.beginPath();
    pctx.arc(x,y,r,0,Math.PI*2);
    pctx.fill();
  }
  for(let i=0;i<24;i++){
    const y = rnd()*H;
    pctx.fillStyle = `rgba(90,80,60,${0.018 + rnd()*0.018})`;
    pctx.fillRect(0,y,W,1+rnd()*2);
  }
  for(let i=0;i<32;i++){
    const x = rnd()*W, y = rnd()*H;
    const r = 80 + rnd()*180;
    const g = pctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(120,110,90,${0.016+rnd()*0.016})`);
    g.addColorStop(1,'rgba(120,110,90,0)');
    pctx.fillStyle = g;
    pctx.beginPath(); pctx.arc(x,y,r,0,Math.PI*2); pctx.fill();
  }

  // Mist wash
  const mist = document.getElementById('mistCanvas');
  const mctx = mist.getContext('2d');

  // Grass layer
  const grass = document.getElementById('grassCanvas');
  const gctx = grass.getContext('2d');

  // Deer layer
  const deer = document.getElementById('deerCanvas');
  const dctx = deer.getContext('2d');

  // Front layer
  const front = document.getElementById('frontCanvas');
  const fctx = front.getContext('2d');

  const deerHerd = [
    {x:230, y:1130, s:0.9, head:0.08, graze:0.8},
    {x:400, y:1180, s:1.02, head:-0.14, graze:0.2},
    {x:585, y:1118, s:0.82, head:0.2, graze:0.56},
    {x:730, y:1198, s:1.08, head:-0.08, graze:0.35},
    {x:868, y:1148, s:0.88, head:0.12, graze:0.68},
    {x:322, y:1294, s:0.74, head:-0.22, graze:0.44},
    {x:664, y:1328, s:0.78, head:0.18, graze:0.9}
  ];

  function drawInkBlob(ctx, x, y, rx, ry, color, alpha=1){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(rx,ry);
    ctx.beginPath();
    ctx.arc(0,0,1,0,Math.PI*2);
    ctx.fillStyle = color.replace('ALPHA', alpha.toFixed(3));
    ctx.fill();
    ctx.restore();
  }

  function drawGrassBlade(ctx, x, baseY, h, lean, width, color, alpha){
    const topX = x + lean;
    ctx.beginPath();
    ctx.moveTo(x - width, baseY);
    ctx.lineTo(x + width, baseY);
    ctx.lineTo(topX + width*0.28, baseY - h*0.72);
    ctx.lineTo(topX, baseY - h);
    ctx.lineTo(topX - width*0.28, baseY - h*0.72);
    ctx.closePath();
    ctx.fillStyle = color.replace('ALPHA', alpha.toFixed(3));
    ctx.fill();
  }

  function drawDeer(ctx, x, y, s, t, offset){
    const bob = Math.sin(t*0.00055 + offset)*4*s;
    const step = Math.sin(t*0.00065 + offset)*1;
    const graze = (Math.sin(t*0.0004 + offset*1.7)+1)/2;

    const bodyY = y + bob;
    const bodyL = 112*s, bodyH = 42*s;
    const neckA = lerp(-0.95, -0.18, graze);
    const headDrop = lerp(46, 0, graze) * s;

    ctx.save();
    ctx.translate(x + Math.sin(t*0.0003 + offset)*10*s, bodyY);

    // shadow wash
    ctx.fillStyle = 'rgba(58,56,45,0.10)';
    ctx.beginPath();
    ctx.ellipse(0, 44*s, 82*s, 18*s, 0, 0, Math.PI*2);
    ctx.fill();

    // body ink
    ctx.fillStyle = 'rgba(47,44,34,0.88)';
    ctx.beginPath();
    ctx.ellipse(0,0, bodyL*0.52, bodyH*0.5, -0.06, 0, Math.PI*2);
    ctx.fill();

    // belly wash
    ctx.fillStyle = 'rgba(114,105,83,0.22)';
    ctx.beginPath();
    ctx.ellipse(-8*s,8*s, bodyL*0.34, bodyH*0.24, -0.08, 0, Math.PI*2);
    ctx.fill();

    // haunch / chest
    ctx.beginPath();
    ctx.ellipse(-40*s,-2*s, 18*s, 15*s, 0.1, 0, Math.PI*2);
    ctx.ellipse(38*s,-6*s, 16*s, 13*s, -0.1, 0, Math.PI*2);
    ctx.fill();

    // neck
    ctx.save();
    ctx.translate(42*s,-8*s);
    ctx.rotate(neckA);
    ctx.fillStyle='rgba(44,40,31,0.9)';
    ctx.beginPath();
    ctx.moveTo(-8*s,0);
    ctx.lineTo(8*s,0);
    ctx.lineTo(12*s,-58*s);
    ctx.lineTo(-6*s,-56*s);
    ctx.closePath();
    ctx.fill();

    // head
    ctx.translate(8*s, -58*s + headDrop*0.1);
    ctx.rotate(lerp(0.35,-0.2,graze));
    ctx.beginPath();
    ctx.moveTo(-6*s,-4*s);
    ctx.lineTo(20*s,-8*s);
    ctx.lineTo(26*s,4*s);
    ctx.lineTo(4*s,10*s);
    ctx.closePath();
    ctx.fill();

    // ear
    ctx.beginPath();
    ctx.moveTo(4*s,-8*s); ctx.lineTo(12*s,-24*s); ctx.lineTo(14*s,-6*s); ctx.closePath();
    ctx.fill();

    // antlers simplified branch forms
    ctx.strokeStyle = 'rgba(35,33,27,0.62)';
    ctx.lineWidth = 3.2*s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(10*s,-10*s);
    ctx.lineTo(6*s,-34*s);
    ctx.moveTo(6*s,-28*s); ctx.lineTo(-1*s,-40*s);
    ctx.moveTo(6*s,-26*s); ctx.lineTo(15*s,-38*s);
    ctx.moveTo(13*s,-10*s);
    ctx.lineTo(16*s,-30*s);
    ctx.moveTo(16*s,-26*s); ctx.lineTo(24*s,-36*s);
    ctx.stroke();
    ctx.restore();

    // tail
    ctx.fillStyle='rgba(47,44,34,0.85)';
    ctx.beginPath();
    ctx.moveTo(-56*s,-6*s);
    ctx.lineTo(-72*s,-18*s);
    ctx.lineTo(-62*s,-2*s);
    ctx.closePath();
    ctx.fill();

    // legs
    const legColor='rgba(36,34,28,0.78)';
    ctx.fillStyle=legColor;
    const legs = [
      {lx:-28, phase:0},
      {lx:-8, phase:Math.PI},
      {lx:18, phase:Math.PI},
      {lx:38, phase:0}
    ];
    for(const L of legs){
      const stride = Math.sin(t*0.001 + offset + L.phase)*4*s*step;
      ctx.save();
      ctx.translate(L.lx*s, 14*s);
      ctx.beginPath();
      ctx.moveTo(-4*s,0);
      ctx.lineTo(4*s,0);
      ctx.lineTo(7*s+stride,70*s);
      ctx.lineTo(0+stride,70*s);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-1*s,68*s);
      ctx.lineTo(12*s+stride,68*s);
      ctx.lineTo(12*s+stride,72*s);
      ctx.lineTo(-1*s,72*s);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  const blossoms = document.querySelectorAll('.blossom');
  blossoms.forEach((b,i)=>{
    const dx = (i%2?1:-1)*(8+i*3);
    b.animate([
      {transform:`translate(0px,0px) scale(${0.8 + (i%3)*0.12})`},
      {transform:`translate(${dx}px,-6px) scale(${0.86 + (i%3)*0.12})`},
      {transform:`translate(0px,0px) scale(${0.8 + (i%3)*0.12})`}
    ],{duration:12000 + i*1300,iterations:Infinity,easing:'ease-in-out'});
  });

  const vines = document.querySelectorAll('.vine');
  vines.forEach((v,i)=>{
    const base = v.style.transform || "";
    v.animate([
      {transform:base + ' translateY(0px) rotate(0deg)'},
      {transform:base + ` translateY(${-4 - i*2}px) rotate(${i%2?1:-1}deg)`},
      {transform:base + ' translateY(0px) rotate(0deg)'}
    ],{duration:18000 + i*3200,iterations:Infinity,easing:'ease-in-out'});
  });

  function render(t){
    mctx.clearRect(0,0,W,H);
    gctx.clearRect(0,0,W,H);
    dctx.clearRect(0,0,W,H);
    fctx.clearRect(0,0,W,H);

    // moving horizontal mist wash
    for(let i=0;i<6;i++){
      const yy = 620 + i*150 + Math.sin(t*0.00022 + i)*18;
      const xx = W*0.5 + Math.sin(t*0.00012 + i*1.37)*120;
      const rw = 420 + i*90;
      const rh = 48 + i*8;
      const grad = mctx.createRadialGradient(xx,yy,0,xx,yy,rw);
      grad.addColorStop(0,`rgba(248,247,241,${0.12 - i*0.01})`);
      grad.addColorStop(0.5,`rgba(248,247,241,${0.07 - i*0.006})`);
      grad.addColorStop(1,'rgba(248,247,241,0)');
      mctx.fillStyle = grad;
      mctx.beginPath();
      mctx.ellipse(xx,yy,rw,rh,0,0,Math.PI*2);
      mctx.fill();
    }

    // distant hill wash
    const hillY = 1045 + Math.sin(t*0.00015)*10;
    mctx.fillStyle = 'rgba(92,108,80,0.16)';
    mctx.beginPath();
    mctx.moveTo(0, H);
    mctx.lineTo(0, hillY);
    mctx.lineTo(180, hillY-34);
    mctx.lineTo(410, hillY-12);
    mctx.lineTo(690, hillY-52);
    mctx.lineTo(920, hillY-16);
    mctx.lineTo(W, hillY-32);
    mctx.lineTo(W, H);
    mctx.closePath();
    mctx.fill();

    // grass
    for(let layer=0; layer<3; layer++){
      const count = layer===0 ? 90 : layer===1 ? 130 : 180;
      const baseY = layer===0 ? 1340 : layer===1 ? 1490 : 1730;
      for(let i=0;i<count;i++){
        const x = (i/count)*W + ((i*37)%23) + Math.sin(i*12.31)*2;
        const n = (i*17.23)%1;
        const h = (layer===0 ? 90: layer===1 ? 145 : 220) * (0.55 + ( (Math.sin(i*1.71)+1)/2 )*0.8);
        const sway = Math.sin(t*0.00055 + i*0.33 + layer)* (10 + layer*8);
        const lean = sway + (layer===2 ? Math.sin(i)*8 : 0);
        const w = layer===2 ? 7 : layer===1 ? 5 : 3;
        const alpha = layer===2 ? 0.72 : layer===1 ? 0.38 : 0.22;
        const color = layer===2 ? 'rgba(55,67,35,ALPHA)' : layer===1 ? 'rgba(92,112,64,ALPHA)' : 'rgba(126,148,96,ALPHA)';
        drawGrassBlade(gctx, x, baseY + Math.sin(i*0.5 + t*0.0002)*2, h, lean, w, color, alpha);
      }
    }

    // plum petals/spill from portal
    for(let i=0;i<16;i++){
      const px = 150 + (i*61)%760 + Math.sin(t*0.00028 + i)*26;
      const py = 310 + (i*47)%920 + Math.cos(t*0.00022 + i*1.2)*8;
      const s = 5 + (i%4)*2;
      fctx.save();
      fctx.translate(px,py);
      fctx.rotate(Math.sin(t*0.00035+i)*0.7);
      fctx.fillStyle = i%5===0 ? 'rgba(205,117,129,0.28)' : 'rgba(184,102,118,0.22)';
      for(let p=0;p<4;p++){
        fctx.beginPath();
        fctx.ellipse(Math.cos(p*Math.PI/2)*s*0.55, Math.sin(p*Math.PI/2)*s*0.55, s*0.62, s*0.42, p*Math.PI/2, 0, Math.PI*2);
        fctx.fill();
      }
      fctx.restore();
    }

    // deer herd
    deerHerd.forEach((d,i)=>drawDeer(dctx, d.x, d.y, d.s, t, i*0.9+0.3));

    // foreground ink tufts to partially obscure deer and portal bottom
    for(let i=0;i<28;i++){
      const x = i*(W/27) + Math.sin(i*1.3)*8;
      const y = 1480 + (i%4)*42;
      const h = 130 + (i%5)*44 + Math.sin(t*0.0005+i)*10;
      drawGrassBlade(fctx, x, y, h, Math.sin(t*0.0007+i)*18, 10 + (i%3)*2, 'rgba(39,48,27,ALPHA)', 0.26);
    }

    // sparse swallow marks near top, in xieyi style
    fctx.save();
    fctx.globalAlpha = 0.14;
    const swX = 792 + Math.sin(t*0.00018)*18;
    const swY = 260 + Math.cos(t*0.00016)*10;
    fctx.translate(swX, swY);
    fctx.rotate(0.05);
    fctx.fillStyle = 'rgba(30,35,27,0.55)';
    fctx.beginPath();
    fctx.moveTo(-50,0); fctx.lineTo(-4,-26); fctx.lineTo(22,-2); fctx.lineTo(-6,6); fctx.closePath(); fctx.fill();
    fctx.beginPath();
    fctx.moveTo(0,-4); fctx.lineTo(54,-22); fctx.lineTo(18,8); fctx.lineTo(-6,4); fctx.closePath(); fctx.fill();
    fctx.restore();

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  if (window.self === window.top) {
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0.022;
      master.connect(ctx.destination);

      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 680;
      lp.Q.value = 0.2;
      lp.connect(master);

      const osc1 = ctx.createOscillator();
      osc1.type = 'sine';
      osc1.frequency.value = 142.5;

      const osc2 = ctx.createOscillator();
      osc2.type = 'triangle';
      osc2.frequency.value = 214;

      const g1 = ctx.createGain();
      const g2 = ctx.createGain();
      g1.gain.value = 0.22;
      g2.gain.value = 0.08;

      osc1.connect(g1).connect(lp);
      osc2.connect(g2).connect(lp);

      const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * 0.18;
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuf;
      noise.loop = true;

      const nlp = ctx.createBiquadFilter();
      nlp.type = 'bandpass';
      nlp.frequency.value = 520;
      nlp.Q.value = 0.35;
      const ng = ctx.createGain();
      ng.gain.value = 0.012;
      noise.connect(nlp).connect(ng).connect(master);

      const lfo = ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.043;
      const lfoG = ctx.createGain();
      lfoG.gain.value = 46;
      lfo.connect(lfoG).connect(lp.frequency);

      const lfo2 = ctx.createOscillator();
      lfo2.type = 'sine';
      lfo2.frequency.value = 0.027;
      const lfoG2 = ctx.createGain();
      lfoG2.gain.value = 9;
      lfo2.connect(lfoG2).connect(osc1.frequency);

      osc1.start(); osc2.start(); noise.start(); lfo.start(); lfo2.start();

      const startAudio = () => {
        if (ctx.state !== 'running') ctx.resume();
        document.removeEventListener('visibilitychange', startAudio);
      };
      document.addEventListener('visibilitychange', startAudio);
      startAudio();
    }catch(e){}
  }
})();
</script>
</body>
</html>
