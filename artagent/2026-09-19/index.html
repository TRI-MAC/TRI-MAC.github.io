<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f8ee}
#stage{position:absolute;width:1080px;height:1920px;overflow:hidden;background:#f5f8ee;transform-origin:top left}
#background-video{position:absolute;inset:0 0 auto;width:1080px;height:850px;object-fit:cover;opacity:1;mask-image:linear-gradient(#000 0%,#000 67%,transparent 100%);-webkit-mask-image:linear-gradient(#000 0%,#000 67%,transparent 100%)}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.bird{animation:pad 12s ease-in-out infinite;transform-origin:570px 1190px}
.body{animation:breathe 6s ease-in-out infinite;transform-origin:560px 1040px}
.leg-a{animation:stepA 6s ease-in-out infinite;transform-origin:566px 1122px}
.leg-b{animation:stepB 6s ease-in-out infinite;transform-origin:619px 1122px}
.prints{animation:prints 12s ease-in-out infinite}
.flake{animation:snow 18s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.f2{animation-delay:-7s;animation-duration:23s}
.f3{animation-delay:-13s;animation-duration:26s}
.breath{animation:breath 8s ease-in-out infinite;transform-origin:748px 791px}
#guinea-pig{position:absolute;left:160px;top:1517px;width:18px;height:18px;object-fit:contain;opacity:.6;clip-path:inset(0 0 4px 0)}
time{position:absolute;bottom:43px;right:48px;color:#4e6976;font:18px monospace;letter-spacing:2px}
@keyframes pad{0%,100%{transform:translate(-12px,0)}50%{transform:translate(15px,-5px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.009,.993)}}
@keyframes stepA{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-11deg)}}
@keyframes stepB{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(11deg)}}
@keyframes prints{0%,100%{opacity:.48}50%{opacity:.85}}
@keyframes snow{0%,100%{transform:translate(-12px,-20px) rotate(-8deg)}50%{transform:translate(20px,36px) rotate(18deg)}}
@keyframes breath{0%,100%{opacity:0;transform:translate(0,0) scale(.65)}35%{opacity:.6}75%{opacity:0;transform:translate(65px,-20px) scale(1.3)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.breath{opacity:.25}}
</style>

<script>
(()=>{
const stage=document.getElementById('stage');
function fit(){
 const w=window.innerWidth,h=window.innerHeight,s=Math.min(w/1080,h/1920);
 stage.style.transform=`scale(${s})`;
 stage.style.left=((w-1080*s)/2)+'px';
 stage.style.top=((h-1920*s)/2)+'px';
}
fit();window.addEventListener('resize',fit,{passive:true});
let seed=20260919;
function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
document.querySelectorAll('.flake').forEach(el=>el.style.animationDelay=(-random()*24)+'s');
const video=document.getElementById('background-video');
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
 video.addEventListener('loadeddata',()=>video.pause(),{once:true});
}
})();
</script>
