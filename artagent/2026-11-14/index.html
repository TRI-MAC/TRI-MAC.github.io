<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta charset="utf-8">
<title>2026-11-14</title>
<style>
html,body{margin:0;height:100%;background:#e9e1cf;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:top left;background:#f4eedf;overflow:hidden}
#stage svg{position:absolute;left:0;top:0;width:1080px;height:1920px}
#back{z-index:1}#front{z-index:3}
#art-image{position:absolute;left:0;top:0;width:500px;height:auto;z-index:2;display:block;transform-origin:50% 0;filter:contrast(1.06) saturate(1.12);will-change:transform}
#guinea-pig{position:absolute;left:1003px;top:1777px;width:15px;height:auto;z-index:2;opacity:.55}
#date{position:absolute;left:62px;top:1822px;z-index:4;font:500 20px/1 Helvetica,Arial,sans-serif;letter-spacing:.22em;color:#1a1a1a;opacity:.6}
#tri{transform-box:fill-box;transform-origin:50% 50%;animation:twirl 46s ease-in-out infinite alternate}
@keyframes twirl{from{transform:scaleX(1)}to{transform:scaleX(.55)}}
</style>
</head>
<body>
<div id="stage">
<svg id="back" viewBox="0 0 1080 1920">
  <circle cx="600" cy="1180" r="440" fill="#f6c915"/>
  <g id="ticks" stroke="#1a1a1a"></g>
  <rect id="shadow" width="500" height="500" fill="#1d4fb8"/>
</svg>
<img id="art-image" src="art.png" alt="">
<img id="guinea-pig" src="guineapig.png" alt="">
<svg id="front" viewBox="0 0 1080 1920">
  <rect x="60" y="1790" width="960" height="10" fill="#1a1a1a"/>
  <rect x="533" y="0" width="14" height="300" fill="#1a1a1a"/>
  <g stroke="#1a1a1a" stroke-width="4" fill="none">
    <line id="sImg"/><line id="sPen"/><line id="sB2"/><line id="sCir"/><line id="sTri"/>
  </g>
  <line id="beam1" stroke="#1a1a1a" stroke-width="16"/>
  <rect id="slider" x="-34" y="-34" width="68" height="68" fill="#e1251b"/>
  <circle cx="540" cy="300" r="26" fill="#f4eedf" stroke="#1a1a1a" stroke-width="10"/>
  <rect id="clip" x="-90" y="-16" width="180" height="32" fill="#1a1a1a"/>
  <rect id="pend" x="-55" y="0" width="110" height="110" fill="#f6c915" stroke="#1a1a1a" stroke-width="8"/>
  <line id="beam2" stroke="#1a1a1a" stroke-width="12"/>
  <circle id="piv2" r="16" fill="#1d4fb8"/>
  <circle id="cir" r="160" fill="#e1251b"/>
  <g id="triW"><polygon id="tri" points="0,0 75,150 -75,150" fill="#1d4fb8"/></g>
</svg>
<div id="date">2026 · 11 · 14</div>
</div>
<script>
(function(){
var stage=document.getElementById('stage');
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);
 stage.style.transform='scale('+s+')';
 stage.style.left=(innerWidth-1080*s)/2+'px';stage.style.top=(innerHeight-1920*s)/2+'px';}
addEventListener('resize',fit);fit();
var $=function(i){return document.getElementById(i)};
var seed=20261114%997/997*6.283;
// graduated scale around the main pivot
var tk='',i;for(i=-40;i<=40;i++){var a=i*Math.PI/180*1.0,big=i%10===0,r1=400,r2=big?440:418;
 [0,Math.PI].forEach(function(o){var c=Math.cos(a+o),s=Math.sin(a+o);
 tk+='<line x1="'+(540+c*r1)+'" y1="'+(300+s*r1)+'" x2="'+(540+c*r2)+'" y2="'+(300+s*r2)+'" stroke-width="'+(big?6:2)+'"/>';});}
$('ticks').innerHTML=tk;
var img=$('art-image'),ih=500;
function sz(){if(img.naturalWidth){ih=Math.min(760,500*img.naturalHeight/img.naturalWidth);img.style.height=ih+'px';img.style.objectFit='contain';$('shadow').setAttribute('height',ih);}}
img.addEventListener('load',sz);sz();
function L(el,x1,y1,x2,y2){el.setAttribute('x1',x1);el.setAttribute('y1',y1);el.setAttribute('x2',x2);el.setAttribute('y2',y2);}
function T(el,x,y,r){el.setAttribute('transform','translate('+x.toFixed(2)+','+y.toFixed(2)+')'+(r?' rotate('+r.toFixed(2)+')':''));}
var D=180/Math.PI;
function frame(ms){
 var t=ms/1000,S=Math.sin;
 var a1=0.10*S(t*0.21)+0.035*S(t*0.37+seed);
 var sl=30+150*S(t*0.21-1.0);
 var a2=0.13*S(t*0.17+seed+1)+0.04*S(t*0.43);
 var c=Math.cos(a1),s=S(a1),Px=540,Py=300;
 var lx=Px-250*c,ly=Py-250*s,rx=Px+300*c,ry=Py+300*s;
 L($('beam1'),lx-30*c,ly-30*s,rx+30*c,ry+30*s);
 T($('slider'),Px+sl*c,Py+sl*s,a1*D+45);
 // image
 var p1=0.028*S(t*0.83+seed),ix=lx+160*p1,iy=ly+160;
 L($('sImg'),lx,ly,ix,iy+10);
 img.style.transform='translate('+(ix-250).toFixed(2)+'px,'+iy.toFixed(2)+'px) rotate('+(p1*D*0.6).toFixed(3)+'deg)';
 T($('shadow'),ix-250+38+10*p1*30,iy+38,p1*D*0.6);
 T($('clip'),ix,iy,p1*D*0.6);
 var bx=ix-ih*p1*0.6,by=iy+ih,p2=0.04*S(t*0.71+2+seed);
 L($('sPen'),bx,by-20,bx+120*p2,by+120);
 T($('pend'),bx+120*p2,by+120,p2*D);
 // second beam
 var p3=0.012*S(t*0.5+seed*2),qx=rx+560*p3,qy=ry+560;
 L($('sB2'),rx,ry,qx,qy);
 var c2=Math.cos(a2),s2=S(a2);
 var ex=qx-330*c2,ey=qy-330*s2,fx=qx+140*c2,fy=qy+140*s2;
 L($('beam2'),ex-24*c2,ey-24*s2,fx+24*c2,fy+24*s2);
 T($('piv2'),qx,qy);
 var p4=0.02*S(t*0.62+4),cx=ex+250*p4,cy=ey+250;
 L($('sCir'),ex,ey,cx,cy);
 T($('cir'),cx,cy+160);
 var p5=0.05*S(t*0.77+1.3),tx=fx+180*p5,ty=fy+180;
 L($('sTri'),fx,fy,tx,ty);
 T($('triW'),tx,ty,p5*D);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
