<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee8d6}
body{display:grid;place-items:center}
#stage{position:absolute;width:1080px;height:1920px;overflow:hidden;background:#fff2ce;transform-origin:top left}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#art-image{position:absolute;left:164px;top:366px;width:752px;height:1160px;object-fit:cover;filter:saturate(1.12) contrast(1.03);box-shadow:14px 18px 0 #c56440}
.front-left{animation:leftSleeve 22s ease-in-out infinite}
.front-right{animation:rightSleeve 22s ease-in-out infinite}
.fold{animation:fold 22s ease-in-out infinite;transform-origin:540px 1560px}
@keyframes leftSleeve{0%,100%{transform:translateX(0) rotate(0deg)}50%{transform:translateX(-62px) rotate(-2deg)}}
@keyframes rightSleeve{0%,100%{transform:translateX(0) rotate(0deg)}50%{transform:translateX(62px) rotate(2deg)}}
@keyframes fold{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.91)}}
#date{position:absolute;bottom:36px;right:49px;font:18px Georgia,serif;letter-spacing:3px;color:#614738}
#guinea-pig{position:absolute;left:822px;top:1661px;width:18px;height:18px;object-fit:contain;opacity:.56}
@media(prefers-reduced-motion:reduce){.front-left,.front-right,.fold{animation:none}}
</style>

<script>
(()=>{
const stage=document.getElementById('stage');
function fit(){
const w=innerWidth,h=innerHeight,s=Math.min(w/1080,h/1920);
stage.style.transform=`scale(${s})`;
stage.style.left=(w-1080*s)/2+'px';
stage.style.top=(h-1920*s)/2+'px';
}
addEventListener('resize',fit,{passive:true});fit();
const seed=20261018;
stage.style.setProperty('--seed',seed);
})();
</script>
