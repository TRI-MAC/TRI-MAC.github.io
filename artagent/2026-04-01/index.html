<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generative Art</title>
<style>
  :root{
    --bg1:#201126;
    --bg2:#4f2235;
    --wine:#8d2f4f;
    --verm:#c94c3a;
    --ochre:#d18a2d;
    --rose:#e3a2b5;
    --ink:#160d18;
    --paper:#f3dfcf;
    --teal:#3e7d7b;
    --gold:#f0bf66;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#09070b;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw, calc(100vh * 1080 / 1920));
    height:min(100vh, calc(100vw * 1920 / 1080));
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 20% 18%, rgba(227,162,181,.20), transparent 50%),
      radial-gradient(90% 90% at 78% 30%, rgba(209,138,45,.18), transparent 48%),
      radial-gradient(100% 120% at 50% 75%, rgba(201,76,58,.16), transparent 48%),
      linear-gradient(180deg, var(--bg2), var(--bg1) 45%, #120b14 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 20px 80px rgba(0,0,0,.45);
  }

  #background-video{
    position:absolute;
    inset:7% 6% 18% 8%;
    width:86%;
    height:58%;
    object-fit:cover;
    opacity:.8;
    filter:saturate(1.35) contrast(1.15) sepia(.12) hue-rotate(-8deg) brightness(.94);
    mix-blend-mode:screen;
    clip-path:polygon(6% 0%, 96% 5%, 100% 86%, 7% 100%, 0% 15%);
    transform-origin:center;
    animation: videoBreath 38s ease-in-out infinite alternate;
  }

  #portrait-wrap{
    position:absolute;
    left:11%;
    top:18%;
    width:63%;
    height:48%;
    pointer-events:none;
    transform:rotate(-5deg);
    filter:drop-shadow(0 25px 45px rgba(0,0,0,.32));
  }
  #portrait-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.93;
    mix-blend-mode:screen;
    filter:grayscale(.08) contrast(1.2) saturate(1.05) sepia(.08) hue-rotate(-10deg);
    clip-path:polygon(8% 2%, 90% 0%, 100% 18%, 94% 93%, 18% 100%, 0% 80%, 2% 16%);
    animation: portraitSway 31s ease-in-out infinite alternate;
  }

  .wash, .stroke, .field, .veil, .scratch, .charcoal{
    position:absolute;
    pointer-events:none;
  }

  .field.a{
    inset:-8% -10% auto -12%;
    height:48%;
    background:
      radial-gradient(60% 70% at 30% 35%, rgba(201,76,58,.64), transparent 55%),
      radial-gradient(52% 70% at 52% 45%, rgba(227,162,181,.34), transparent 52%),
      radial-gradient(50% 80% at 76% 32%, rgba(209,138,45,.42), transparent 56%);
    mix-blend-mode:screen;
    filter:blur(22px);
    opacity:.88;
    animation: fieldShift 32s ease-in-out infinite alternate;
  }
  .field.b{
    inset:auto -12% -12% -8%;
    height:48%;
    background:
      radial-gradient(55% 70% at 20% 55%, rgba(62,125,123,.32), transparent 58%),
      radial-gradient(56% 75% at 72% 48%, rgba(141,47,79,.48), transparent 58%),
      radial-gradient(70% 80% at 55% 70%, rgba(22,13,24,.7), transparent 60%);
    mix-blend-mode:lighten;
    filter:blur(30px);
    opacity:.75;
    animation: fieldShift2 36s ease-in-out infinite alternate;
  }

  .wash.one{
    left:-6%;
    top:7%;
    width:62%;
    height:28%;
    background:linear-gradient(110deg, rgba(243,223,207,.55), rgba(243,223,207,.08) 42%, rgba(201,76,58,.02));
    filter:blur(10px);
    opacity:.33;
    transform:rotate(-18deg);
    border-radius:47% 53% 38% 62% / 51% 37% 63% 49%;
    animation:washMove1 23s ease-in-out infinite alternate;
    mix-blend-mode:screen;
  }
  .wash.two{
    right:-5%;
    bottom:20%;
    width:56%;
    height:22%;
    background:linear-gradient(20deg, rgba(209,138,45,.46), rgba(227,162,181,.15), rgba(243,223,207,.02));
    filter:blur(16px);
    opacity:.28;
    transform:rotate(16deg);
    border-radius:63% 37% 59% 41% / 42% 59% 41% 58%;
    animation:washMove2 27s ease-in-out infinite alternate;
    mix-blend-mode:screen;
  }

  .stroke{
    border-radius:999px;
    transform-origin:center;
    mix-blend-mode:screen;
    opacity:.9;
  }
  .s1{left:6%; top:13%; width:70%; height:26px; background:linear-gradient(90deg, rgba(243,223,207,.0), rgba(243,223,207,.78), rgba(227,162,181,.0)); filter:blur(2px); transform:rotate(19deg); animation:strokeDrift1 18s ease-in-out infinite alternate;}
  .s2{left:20%; top:34%; width:62%; height:40px; background:linear-gradient(90deg, rgba(201,76,58,.0), rgba(201,76,58,.82), rgba(209,138,45,.1), rgba(201,76,58,.0)); filter:blur(3px); transform:rotate(-26deg); animation:strokeDrift2 21s ease-in-out infinite alternate;}
  .s3{left:-8%; top:48%; width:58%; height:22px; background:linear-gradient(90deg, rgba(243,223,207,.0), rgba(243,223,207,.52), rgba(243,223,207,.0)); filter:blur(1px); transform:rotate(31deg); opacity:.55; animation:strokeDrift3 19s ease-in-out infinite alternate;}
  .s4{right:-2%; top:54%; width:48%; height:58px; background:linear-gradient(90deg, rgba(141,47,79,.0), rgba(141,47,79,.75), rgba(227,162,181,.2), rgba(141,47,79,.0)); filter:blur(5px); transform:rotate(-12deg); opacity:.7; animation:strokeDrift4 26s ease-in-out infinite alternate;}
  .s5{left:16%; bottom:18%; width:72%; height:24px; background:linear-gradient(90deg, rgba(209,138,45,.0), rgba(209,138,45,.84), rgba(243,223,207,.08), rgba(209,138,45,.0)); filter:blur(3px); transform:rotate(8deg); animation:strokeDrift5 28s ease-in-out infinite alternate;}

  .charcoal{
    inset:0;
    opacity:.22;
    mix-blend-mode:multiply;
    background:
      linear-gradient(114deg, transparent 0 25%, rgba(0,0,0,.2) 26% 27%, transparent 28% 100%),
      linear-gradient(96deg, transparent 0 62%, rgba(0,0,0,.16) 63% 64%, transparent 65% 100%),
      linear-gradient(128deg, transparent 0 44%, rgba(0,0,0,.13) 45% 46%, transparent 47% 100%);
    filter:blur(.6px);
    animation: charMove 25s linear infinite alternate;
  }

  #svg-layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    opacity:.88;
  }

  .veil{
    inset:0;
    background:
      linear-gradient(180deg, rgba(15,8,15,.08), rgba(15,8,15,.0) 22%, rgba(15,8,15,.0) 74%, rgba(15,8,15,.18)),
      repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 4px);
    mix-blend-mode:soft-light;
    opacity:.38;
    animation: veilPulse 12s ease-in-out infinite alternate;
  }

  #paint{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:15px;
    bottom:188px;
    opacity:.58;
    filter:brightness(.78) saturate(.9);
    transform:rotate(-7deg);
    z-index:12;
  }

  #date{
    position:absolute;
    right:16px;
    bottom:14px;
    color:rgba(243,223,207,.52);
    font-size:15px;
    letter-spacing:.08em;
    z-index:20;
    user-select:none;
  }

  @keyframes videoBreath{
    0%{transform:scale(1.03) translate(0,0) rotate(-1.2deg)}
    100%{transform:scale(1.09) translate(1.4%, -1.2%) rotate(1.5deg)}
  }
  @keyframes portraitSway{
    0%{transform:translate(-1.2%, 0%) scale(1.01) rotate(-1.2deg)}
    100%{transform:translate(1.1%, 1.4%) scale(1.06) rotate(1.5deg)}
  }
  @keyframes fieldShift{
    0%{transform:translateY(-1.5%) scale(1) rotate(-2deg)}
    100%{transform:translateY(2%) scale(1.06) rotate(2deg)}
  }
  @keyframes fieldShift2{
    0%{transform:translateY(1%) scale(1) rotate(3deg)}
    100%{transform:translateY(-2%) scale(1.04) rotate(-2deg)}
  }
  @keyframes washMove1{
    0%{transform:rotate(-18deg) translate(-2%,0) scale(1)}
    100%{transform:rotate(-14deg) translate(2%,2%) scale(1.08)}
  }
  @keyframes washMove2{
    0%{transform:rotate(16deg) translate(0,0) scale(1)}
    100%{transform:rotate(11deg) translate(-2%,-2%) scale(1.07)}
  }
  @keyframes strokeDrift1{0%{transform:rotate(19deg) translateX(-1%)}100%{transform:rotate(16deg) translateX(3%) scaleX(1.04)}}
  @keyframes strokeDrift2{0%{transform:rotate(-26deg) translateX(0)}100%{transform:rotate(-23deg) translateX(-2%) scaleX(1.05)}}
  @keyframes strokeDrift3{0%{transform:rotate(31deg) translateX(1%)}100%{transform:rotate(28deg) translateX(-2%) scaleX(1.03)}}
  @keyframes strokeDrift4{0%{transform:rotate(-12deg) translateX(0)}100%{transform:rotate(-9deg) translateX(-2%) scaleX(1.06)}}
  @keyframes strokeDrift5{0%{transform:rotate(8deg) translateX(0)}100%{transform:rotate(11deg) translateX(2%) scaleX(1.03)}}
  @keyframes charMove{0%{transform:translateX(0)}100%{transform:translateX(6px)}}
  @keyframes veilPulse{0%{opacity:.28}100%{opacity:.42}}
</style>
</head>
<body>
  <div id="frame">
    <div class="field a"></div>
    <div class="field b"></div>

    <video id="background-video" src="background.mp4" autoplay loop muted playsinline></video>

    <div id="portrait-wrap">
      <img id="portrait-image" src="portrait.png" alt="">
    </div>

    <div class="wash one"></div>
    <div class="wash two"></div>

    <div class="stroke s1"></div>
    <div class="stroke s2"></div>
    <div class="stroke s3"></div>
    <div class="stroke s4"></div>
    <div class="stroke s5"></div>

    <canvas id="paint" width="1080" height="1920"></canvas>

    <svg id="svg-layer" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
        <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
        <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%" stop-color="#f3dfcf" stop-opacity="0.9"/>
          <stop offset="45%" stop-color="#e3a2b5" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#c94c3a" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="g2" x1="1" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#d18a2d" stop-opacity="0.8"/>
          <stop offset="50%" stop-color="#c94c3a" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#3e7d7b" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <path id="curveA" d="M90 470 C 240 320, 420 320, 580 470 S 930 690, 1020 560" fill="none" stroke="url(#g1)" stroke-width="18" stroke-linecap="round" filter="url(#blur8)" opacity="0.72"/>
      <path id="curveB" d="M40 1170 C 220 980, 390 980, 520 1130 S 860 1380, 1040 1300" fill="none" stroke="url(#g2)" stroke-width="28" stroke-linecap="round" filter="url(#blur18)" opacity="0.48"/>
      <path id="curveC" d="M220 1760 C 340 1650, 550 1600, 770 1670 S 990 1810, 1060 1740" fill="none" stroke="#f3dfcf" stroke-opacity=".33" stroke-width="10" stroke-linecap="round" filter="url(#blur8)"/>

      <g opacity=".23" mix-blend-mode="screen">
        <ellipse cx="348" cy="354" rx="160" ry="98" fill="#e3a2b5" filter="url(#blur18)"/>
        <ellipse cx="738" cy="1090" rx="220" ry="130" fill="#c94c3a" filter="url(#blur18)"/>
        <ellipse cx="850" cy="1460" rx="140" ry="82" fill="#d18a2d" filter="url(#blur18)"/>
      </g>
    </svg>

    <div class="charcoal"></div>
    <div class="veil"></div>

    <img id="guinea-pig" src="guineapig.png" alt="">
    <div id="date">2026-03-23</div>
  </div>

<script>
(() => {
  const seedString = "2026-03-23";
  function xmur3(str){for(var i=0,h=1779033703^str.length;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),3432918353),h=h<<13|h>>>19;return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^h>>>16)>>>0}}
  function sfc32(a,b,c,d){return function(){a|=0;b|=0;c|=0;d|=0;var t=(a+b|0)+d|0;d=d+1|0;a=b^b>>>9;b=c+(c<<3)|0;c=(c<<21|c>>>11);c=c+t|0;return (t>>>0)/4294967296}}
  const seed = xmur3(seedString);
  const rand = sfc32(seed(), seed(), seed(), seed());

  const canvas = document.getElementById('paint');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const palette = [
    [243,223,207],[227,162,181],[201,76,58],[209,138,45],[62,125,123],[28,16,28],[141,47,79]
  ];
  const strokes = [];
  const drips = [];
  const scrapeLines = [];

  function r(min,max){ return min + (max-min)*rand(); }
  function pick(arr){ return arr[(rand()*arr.length)|0]; }
  function rgba(c,a){ return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

  for(let i=0;i<24;i++){
    const c = pick(palette);
    strokes.push({
      x:r(-120,W*1.05),
      y:r(120,H-120),
      len:r(220,760),
      thick:r(18,110),
      rot:r(-1.15,1.15),
      alpha:r(.08,.22),
      color:c,
      phase:r(0,Math.PI*2),
      speed:r(.0005,.0014),
      arc:r(.3,1.2)
    });
  }

  for(let i=0;i<18;i++){
    drips.push({
      x:r(60,W-60),
      y:r(0,H*.55),
      len:r(120,380),
      width:r(2,9),
      alpha:r(.06,.18),
      sway:r(8,24),
      phase:r(0,Math.PI*2),
      color:pick([palette[2],palette[3],palette[6],palette[0]])
    });
  }

  for(let i=0;i<36;i++){
    scrapeLines.push({
      x1:r(0,W), y1:r(0,H), x2:r(0,W), y2:r(0,H),
      alpha:r(.03,.09),
      width:r(.6,2.2)
    });
  }

  function brushMark(x,y,len,thick,rot,color,alpha,curve){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(-len*0.5, 0);
    ctx.bezierCurveTo(-len*0.2, -thick*curve, len*0.12, thick*curve*0.75, len*0.5, 0);
    ctx.lineWidth = thick;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = rgba(color,alpha);
    ctx.shadowColor = rgba(color, alpha*0.7);
    ctx.shadowBlur = thick*0.22;
    ctx.stroke();

    ctx.globalCompositeOperation = "lighter";
    ctx.beginPath();
    ctx.moveTo(-len*0.44, -thick*0.08);
    ctx.bezierCurveTo(-len*0.1, -thick*curve*0.3, len*0.2, thick*curve*0.18, len*0.42, -thick*0.05);
    ctx.lineWidth = Math.max(1, thick*0.16);
    ctx.strokeStyle = rgba([255,245,235], alpha*0.18);
    ctx.stroke();
    ctx.restore();
  }

  function drawBackgroundTexture(t){
    ctx.clearRect(0,0,W,H);

    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'rgba(18,10,18,0.0)');
    grad.addColorStop(.45,'rgba(10,6,12,0.08)');
    grad.addColorStop(1,'rgba(0,0,0,0.18)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    for(const s of strokes){
      const k = Math.sin(t*s.speed + s.phase);
      brushMark(
        s.x + k*24,
        s.y + Math.cos(t*s.speed*0.7 + s.phase)*16,
        s.len*(1 + k*0.03),
        s.thick*(1 + Math.sin(t*s.speed*1.2+s.phase)*0.06),
        s.rot + k*0.05,
        s.color,
        s.alpha,
        s.arc + Math.sin(t*s.speed + s.phase)*0.18
      );
    }

    ctx.save();
    for(const d of drips){
      const sw = Math.sin(t*0.001 + d.phase) * d.sway;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.bezierCurveTo(d.x+sw*0.2, d.y+d.len*0.24, d.x-sw, d.y+d.len*0.68, d.x+sw*0.35, d.y+d.len);
      ctx.strokeStyle = rgba(d.color,d.alpha);
      ctx.lineWidth = d.width;
      ctx.lineCap = "round";
      ctx.shadowColor = rgba(d.color,d.alpha*0.6);
      ctx.shadowBlur = 5;
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = "overlay";
    for(const l of scrapeLines){
      ctx.beginPath();
      ctx.moveTo(l.x1,l.y1);
      ctx.lineTo(l.x2,l.y2);
      ctx.strokeStyle = `rgba(255,240,228,${l.alpha})`;
      ctx.lineWidth = l.width;
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = "soft-light";
    for(let i=0;i<140;i++){
      const x = (i*91.7 + Math.sin(i*3.1 + t*0.0002)*120) % W;
      const y = (i*153.3 + Math.cos(i*2.7 + t*0.00023)*170) % H;
      const rr = 1.2 + (i%4)*0.4;
      ctx.fillStyle = `rgba(255,245,240,${0.015 + (i%5)*0.003})`;
      ctx.beginPath();
      ctx.arc(x,y,rr,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  const curveA = document.getElementById('curveA');
  const curveB = document.getElementById('curveB');
  const curveC = document.getElementById('curveC');

  function animate(ms){
    drawBackgroundTexture(ms);

    const t = ms * 0.001;
    const p1 = Math.sin(t*0.18), p2 = Math.sin(t*0.13 + 1.7), p3 = Math.sin(t*0.1 + 3.2);

    curveA.setAttribute('d', `M90 ${470 + p1*20} C ${240 + p2*24} ${320 + p1*24}, ${420 + p3*15} ${320 + p2*30}, ${580 + p1*20} ${470 + p3*28} S ${930 + p2*18} ${690 + p1*18}, 1020 ${560 + p3*26}`);
    curveB.setAttribute('d', `M40 ${1170 + p2*24} C ${220 + p1*18} ${980 + p2*22}, ${390 + p3*22} ${980 + p1*26}, ${520 + p2*20} ${1130 + p3*22} S ${860 + p1*28} ${1380 + p2*18}, 1040 ${1300 + p3*30}`);
    curveC.setAttribute('d', `M220 ${1760 + p3*18} C ${340 + p1*20} ${1650 + p2*20}, ${550 + p2*24} ${1600 + p1*18}, ${770 + p3*20} ${1670 + p2*20} S 990 ${1810 + p1*14}, 1060 ${1740 + p2*16}`);

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
