<!DOCTYPE html>
<html lang="en">

<title>2026-06-16</title>
<style>
  :root{
    --ink:#102847;
    --indigo:#163b62;
    --deep:#0d2140;
    --teal:#2e7b8b;
    --sea:#4aa2a5;
    --foam:#d7e8d7;
    --coral:#d96d53;
    --gold:#c6a25c;
    --paper:#e8d9bb;
    --shadow:#091628;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;background:#09121f;overflow:hidden;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  body{
    display:grid;place-items:center;
  }
  #frame{
    width:min(100vw,56.25vh);
    height:min(177.7778vw,100vh);
    aspect-ratio:9/16;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 8%, rgba(231,215,176,.95), rgba(231,215,176,.18) 14%, rgba(231,215,176,0) 26%),
      linear-gradient(180deg, #8fb8b8 0%, #6ba0a5 13%, #346c79 34%, #1d4768 58%, #112d51 78%, #0b1d39 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 30px 80px rgba(0,0,0,.45);
  }

  /* woodblock grain */
  #frame::before{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(90deg,
        rgba(255,255,255,.025) 0 1px,
        rgba(0,0,0,.02) 1px 2px,
        transparent 2px 7px),
      repeating-linear-gradient(0deg,
        rgba(255,255,255,.018) 0 1px,
        transparent 1px 5px);
    mix-blend-mode:multiply;
    opacity:.45;
    pointer-events:none;
  }
  #frame::after{
    content:"";
    position:absolute; inset:-8%;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(7,17,30,.18) 76%, rgba(7,17,30,.32) 100%);
    pointer-events:none;
  }

  svg, canvas, .layer {position:absolute; inset:0;}
  #plankton{opacity:.95}
  #mist{
    mix-blend-mode:screen;
    opacity:.28;
    filter:blur(12px);
  }

  .date{
    position:absolute;
    right:20px; bottom:16px;
    color:rgba(232,217,187,.6);
    font-size:14px;
    letter-spacing:.08em;
    z-index:30;
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:26px;
    bottom:145px;
    opacity:.58;
    filter:saturate(.7) hue-rotate(170deg) brightness(.9);
    z-index:16;
    transform:rotate(-8deg);
  }

  .maskFade{
    -webkit-mask-image: radial-gradient(ellipse at center, #000 70%, transparent 100%);
            mask-image: radial-gradient(ellipse at center, #000 70%, transparent 100%);
  }

  @keyframes curtainBreath{
    0%,100%{transform:scaleY(1) translateY(0)}
    50%{transform:scaleY(1.02) translateY(-6px)}
  }
  #curtains{
    animation:curtainBreath 18s ease-in-out infinite;
    transform-origin:top center;
  }

  @keyframes lightDrift{
    0%,100%{transform:translateY(0) translateX(0)}
    50%{transform:translateY(16px) translateX(-8px)}
  }
  #light-shafts{
    animation:lightDrift 24s ease-in-out infinite;
    transform-origin:top center;
  }

  @keyframes whaleFloat{
    0%,100%{transform:translateY(0) translateX(0)}
    50%{transform:translateY(-18px) translateX(10px)}
  }
  #whaleGroup{
    animation:whaleFloat 20s ease-in-out infinite;
    transform-origin:50% 50%;
  }

  @keyframes sealPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.035)}
  }
  #sunSeal{
    animation:sealPulse 12s ease-in-out infinite;
    transform-origin:50% 50%;
  }
</style>

<body>

    <div class="date">2026-06-16</div>

<script>
(() => {
  const seed = 20260616;
  function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;}}
  const rand = mulberry32(seed);

  const planktonCanvas = document.getElementById('plankton');
  const pctx = planktonCanvas.getContext('2d');
  const mistCanvas = document.getElementById('mist');
  const mctx = mistCanvas.getContext('2d');

  const W = 1080, H = 1920;

  const specks = [];
  const count = 220;
  for(let i=0;i<count;i++){
    const depth = rand();
    specks.push({
      x: rand()*W,
      y: rand()*H,
      r: 0.8 + rand()*3.5*(1-depth*0.4),
      a: 0.08 + rand()*0.42,
      s: 0.12 + rand()*0.45 + depth*0.35,
      drift: (rand()-.5)*0.12,
      phase: rand()*Math.PI*2,
      hue: rand() < 0.86 ? 48 : 14
    });
  }

  const mistBands = [];
  for(let i=0;i<8;i++){
    mistBands.push({
      y: 180 + i*210 + rand()*80,
      h: 120 + rand()*130,
      x: rand()*W,
      w: 340 + rand()*380,
      dx: (rand()-.5)*0.08,
      phase: rand()*Math.PI*2
    });
  }

  let start = performance.now();

  function draw(t){
    const time = (t - start) * 0.001;

    pctx.clearRect(0,0,W,H);
    for(const s of specks){
      const yy = (s.y + (time*34*s.s)) % (H+40) - 20;
      const xx = s.x + Math.sin(time*0.35 + s.phase + yy*0.002)*18 + time*10*s.drift;
      pctx.beginPath();
      pctx.fillStyle = s.hue === 48
        ? `rgba(234,220,183,${s.a})`
        : `rgba(214,112,88,${s.a*0.7})`;
      pctx.arc(xx, yy, s.r*(0.75 + 0.25*Math.sin(time*0.9+s.phase)), 0, Math.PI*2);
      pctx.fill();
    }

    mctx.clearRect(0,0,W,H);
    for(const b of mistBands){
      b.x += b.dx;
      const x = b.x + Math.sin(time*0.18 + b.phase)*50;
      const y = b.y + Math.sin(time*0.22 + b.phase)*24;
      const grad = mctx.createRadialGradient(x,y,0,x,y,b.w);
      grad.addColorStop(0,'rgba(231,218,186,0.09)');
      grad.addColorStop(0.35,'rgba(171,210,205,0.06)');
      grad.addColorStop(1,'rgba(171,210,205,0)');
      mctx.fillStyle = grad;
      mctx.beginPath();
      mctx.ellipse(x,y,b.w,b.h,0,0,Math.PI*2);
      mctx.fill();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  if (window.self === window.top) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      const ctx = new AudioContext();
      const master = ctx.createGain();
      master.gain.value = 0.018;
      master.connect(ctx.destination);

      const low = ctx.createOscillator();
      low.type = 'sine';
      low.frequency.value = 58;

      const overtone = ctx.createOscillator();
      overtone.type = 'triangle';
      overtone.frequency.value = 87;

      const lfo = ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.047;

      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 6;

      const waveGain = ctx.createGain();
      waveGain.gain.value = 0.0;

      const overtoneGain = ctx.createGain();
      overtoneGain.gain.value = 0.0;

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 340;
      filter.Q.value = 0.4;

      const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i=0;i<data.length;i++) data[i] = (Math.random()*2-1)*0.45;
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;
      noise.loop = true;

      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = 420;
      noiseFilter.Q.value = 0.3;

      const noiseGain = ctx.createGain();
      noiseGain.gain.value = 0.0035;

      lfo.connect(lfoGain);
      lfoGain.connect(low.frequency);

      low.connect(waveGain);
      overtone.connect(overtoneGain);
      waveGain.connect(filter);
      overtoneGain.connect(filter);
      filter.connect(master);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(master);

      const now = ctx.currentTime;
      waveGain.gain.setValueAtTime(0.0001, now);
      overtoneGain.gain.setValueAtTime(0.0001, now);

      function whalePhrase(baseTime){
        const dur = 9.5;
        waveGain.gain.cancelScheduledValues(baseTime);
        overtoneGain.gain.cancelScheduledValues(baseTime);

        waveGain.gain.setValueAtTime(0.0001, baseTime);
        waveGain.gain.linearRampToValueAtTime(0.022, baseTime + 2.8);
        waveGain.gain.linearRampToValueAtTime(0.014, baseTime + 6.2);
        waveGain.gain.linearRampToValueAtTime(0.0001, baseTime + dur);

        overtoneGain.gain.setValueAtTime(0.0001, baseTime);
        overtoneGain.gain.linearRampToValueAtTime(0.008, baseTime + 3.4);
        overtoneGain.gain.linearRampToValueAtTime(0.0001, baseTime + dur);

        low.frequency.setValueAtTime(54, baseTime);
        low.frequency.linearRampToValueAtTime(61, baseTime + 3.8);
        low.frequency.linearRampToValueAtTime(56, baseTime + dur);

        overtone.frequency.setValueAtTime(82, baseTime);
        overtone.frequency.linearRampToValueAtTime(90, baseTime + 4.2);
        overtone.frequency.linearRampToValueAtTime(84, baseTime + dur);

        filter.frequency.setValueAtTime(260, baseTime);
        filter.frequency.linearRampToValueAtTime(420, baseTime + 4.5);
        filter.frequency.linearRampToValueAtTime(290, baseTime + dur);
      }

      let scheduled = now + 0.3;
      for(let i=0;i<8;i++){
        whalePhrase(scheduled);
        scheduled += 12 + (i%2)*1.7;
      }

      setInterval(() => {
        const t = ctx.currentTime + 0.2;
        whalePhrase(t);
      }, 12800);

      const resume = () => { if (ctx.state !== 'running') ctx.resume(); };
      document.addEventListener('visibilitychange', resume);
      low.start();
      overtone.start();
      lfo.start();
      noise.start();
      resume();
    }
  }
})();
</script>
