<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta charset="utf-8">
<title></title>
<style>
@property --fold { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --spin { syntax: '<number>'; inherits: true; initial-value: 0; }

html,body{margin:0;height:100%;background:#efe3c6;overflow:hidden}
#stage{
  position:absolute;left:0;top:0;width:1080px;height:1920px;
  transform-origin:top left;background:#efe3c6;overflow:hidden;
  animation:cycle 48s infinite;
}
@keyframes cycle{
  0%   {--fold:0;--spin:0;animation-timing-function:linear}
  14%  {--fold:0;--spin:0;animation-timing-function:cubic-bezier(.6,0,.4,1)}
  30%  {--fold:1;--spin:0;animation-timing-function:cubic-bezier(.45,0,.55,1)}
  70%  {--fold:1;--spin:360;animation-timing-function:cubic-bezier(.6,0,.4,1)}
  86%  {--fold:0;--spin:360;animation-timing-function:linear}
  100% {--fold:0;--spin:360}
}

#background-video{
  position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;
  opacity:.8;
  -webkit-mask-image:radial-gradient(ellipse 62% 56% at 50% 46%, #000 38%, transparent 100%);
  mask-image:radial-gradient(ellipse 62% 56% at 50% 46%, #000 38%, transparent 100%);
}

/* red formline ground band, continuing the box's language outward */
#ground{position:absolute;left:0;top:0;width:1080px;height:1920px}

.world{position:absolute;left:50%;top:50%;width:0;height:0;perspective:1800px}
.box{
  position:absolute;left:0;top:0;transform-style:preserve-3d;
  transform-origin:125px 200px -125px;
  transform:translate3d(calc(-500px + var(--fold)*375px), -200px, calc(var(--fold)*125px)) rotateY(calc(var(--spin)*1deg));
}
.f{position:absolute;left:0;top:0;width:250px;height:400px;background:#f4e8cf;transform-style:preserve-3d}
.f svg{position:absolute;left:0;top:0;width:250px;height:400px;display:block}
.h{
  position:absolute;left:250px;top:0;width:250px;height:400px;
  transform-origin:left center;transform-style:preserve-3d;
  transform:rotateY(calc(var(--fold)*90deg));
}
.lid{
  position:absolute;left:0;top:0;width:250px;height:250px;background:#ecdcb8;
  transform-origin:top;transform:rotateX(-90deg);opacity:var(--fold);
}
.lid svg{position:absolute;left:0;top:0;width:250px;height:250px}

#date{position:absolute;left:36px;bottom:30px;font:13px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.2em;color:#141210;opacity:.45}
#guinea-pig{position:absolute;right:52px;bottom:34px;width:17px;height:auto;opacity:.55;transform:rotate(-8deg)}
</style>
</head>
<body>
<div id="stage">
  <video id="background-video" src="background.mp4" autoplay loop muted playsinline></video>

  <svg id="ground" viewBox="0 0 1080 1920" aria-hidden="true">
    <!-- horizon band: thick red formline shelf the box rests on -->
    <path d="M0 1385 C 220 1340 860 1340 1080 1385 L1080 1430 C 860 1385 220 1385 0 1430 Z" fill="#b8322a" opacity=".9"/>
    <path d="M90 1470 L990 1470" stroke="#141210" stroke-width="7" stroke-linecap="round"/>
    <!-- sky U-forms, cardinal, red: the medium continuing beyond the box -->
    <path d="M400 300 L400 230 A140 140 0 0 1 680 230 L680 300" fill="none" stroke="#b8322a" stroke-width="30" stroke-linecap="butt"/>
    <path d="M470 300 L470 250 A70 70 0 0 1 610 250 L610 300" fill="none" stroke="#141210" stroke-width="14"/>
  </svg>

  <div class="world">
    <div class="box" id="box">
      <div class="f" id="f1">
        <div class="h"><div class="f" id="f2">
          <div class="h"><div class="f" id="f3">
            <div class="h"><div class="f" id="f4"></div></div>
          </div></div>
        </div></div>
      </div>
      <div class="lid" id="lid"></div>
    </div>
  </div>

  <div id="date">2026 · 10 · 24</div>
  <img id="guinea-pig" src="guineapig.png" alt="">
</div>

<script>
(function(){
  var K='#141210', R='#b8322a', C='#f4e8cf';
  // date seed: small deterministic variation in ovoid proportions
  var seed = 2026*10000+10*100+24, r = ((seed*9301+49297)%233280)/233280;
  var bulge = 1.05 + r*0.12;

  function ov(x,y,w,h,fill){
    var w2=w/2,h2=h/2;
    return '<path fill="'+fill+'" d="M'+(x-w2)+','+(y+h*0.12)+
      ' C'+(x-w2)+','+(y-h2*bulge)+' '+(x+w2)+','+(y-h2*bulge)+' '+(x+w2)+','+(y+h*0.12)+
      ' C'+(x+w2)+','+(y+h2*0.6)+' '+(x-w2)+','+(y+h2*0.6)+' '+(x-w2)+','+(y+h*0.12)+'Z"/>';
  }
  function U(x,y1,y2,w,t,col){ // downward U band
    var hw=w/2;
    return '<path fill="none" stroke="'+col+'" stroke-width="'+t+'" d="M'+(x-hw)+' '+y1+' L'+(x-hw)+' '+(y2-hw)+' A'+hw+' '+hw+' 0 0 0 '+(x+hw)+' '+(y2-hw)+' L'+(x+hw)+' '+y1+'"/>';
  }
  function Uup(x,y1,y2,w,t,col){ // upward U band (opening down)
    var hw=w/2;
    return '<path fill="none" stroke="'+col+'" stroke-width="'+t+'" d="M'+(x-hw)+' '+y1+' L'+(x-hw)+' '+(y2+hw)+' A'+hw+' '+hw+' 0 0 1 '+(x+hw)+' '+(y2+hw)+' L'+(x+hw)+' '+y1+'"/>';
  }
  function svg(inner,vb){ return '<svg viewBox="'+(vb||'0 0 250 400')+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>'; }

  // FRONT: frontal badger head
  function front(){
    var s='';
    s+='<rect x="18" y="52" width="214" height="282" rx="72" fill="none" stroke="'+K+'" stroke-width="14"/>';
    // ears
    s+=Uup(62,54,18,44,12,K)+Uup(62,54,26,20,8,R);
    s+=Uup(188,54,18,44,12,K)+Uup(188,54,26,20,8,R);
    // stripes (black bands over eyes)
    var stripe='<path fill="'+K+'" d="M70,62 C58,130 60,200 82,252 L114,252 C122,200 120,130 106,62 Z"/>';
    s+=stripe+'<g transform="translate(250,0) scale(-1,1)">'+stripe+'</g>';
    // eyes inside stripes
    [90,160].forEach(function(x){
      s+=ov(x,140,46,36,C)+ov(x,142,26,20,K)+'<circle cx="'+(x+4)+'" cy="137" r="4" fill="'+C+'"/>';
      s+=U(x,196,244,22,8,R);
    });
    // nose + mouth
    s+=ov(125,274,74,48,K)+ov(125,278,42,26,R);
    s+='<circle cx="113" cy="280" r="4" fill="'+C+'"/><circle cx="137" cy="280" r="4" fill="'+C+'"/>';
    s+='<path d="M86 312 L164 312" stroke="'+R+'" stroke-width="10" stroke-linecap="round"/>';
    // forepaws with claws
    [70,180].forEach(function(x){
      s+='<rect x="'+(x-34)+'" y="344" width="68" height="30" rx="15" fill="'+K+'"/>';
      s+=ov(x,358,30,14,R);
      [-20,0,20].forEach(function(d){ s+=U(x+d,374,396,12,6,R); });
    });
    return svg(s);
  }

  // SIDES: body in profile, limb and digging claws, small face in the joint
  function side(){
    var s='';
    s+=U(32,20,70,26,10,R)+U(218,20,70,26,10,R);
    s+=ov(125,160,214,172,K)+ov(125,164,172,130,C)+ov(125,168,112,76,R);
    s+=ov(125,166,56,36,C)+'<circle cx="116" cy="164" r="6" fill="'+K+'"/>'+'<path d="M128 176 L144 176" stroke="'+K+'" stroke-width="4"/>';
    s+=U(125,236,312,130,18,K)+U(125,242,300,80,12,R);
    [82,125,168].forEach(function(x){ s+=U(x,328,388,28,12,K)+ov(x,386,12,10,R); });
    return svg(s);
  }

  // BACK: tail and hind design
  function back(){
    var s='';
    s+=ov(125,92,124,92,K)+ov(125,96,86,60,C)+ov(125,100,44,28,R);
    s+=U(125,150,336,100,18,K)+U(125,160,324,50,14,R);
    [35,215].forEach(function(x){ s+=U(x,170,220,24,10,R)+U(x,240,290,24,10,R); });
    s+='<path d="M60 372 L190 372" stroke="'+K+'" stroke-width="10" stroke-linecap="round"/>';
    return svg(s);
  }

  function lid(){
    return svg(ov(125,125,186,124,K)+ov(125,129,140,86,R)+ov(125,133,66,36,C),'0 0 250 250');
  }

  document.getElementById('f1').insertAdjacentHTML('afterbegin',front());
  document.getElementById('f2').insertAdjacentHTML('afterbegin',side());
  document.getElementById('f3').insertAdjacentHTML('afterbegin',back());
  var f4=document.getElementById('f4'); f4.innerHTML=side(); f4.firstChild.style.transform='scaleX(-1)';
  document.getElementById('lid').innerHTML=lid();

  // responsive shell
  var stage=document.getElementById('stage');
  function fit(){
    var iw=window.innerWidth, ih=window.innerHeight;
    var s=Math.min(iw/1080, ih/1920);
    stage.style.transform='translate('+((iw-1080*s)/2)+'px,'+((ih-1920*s)/2)+'px) scale('+s+')';
  }
  fit(); window.addEventListener('resize',fit);
})();
</script>
</body>
</html>
