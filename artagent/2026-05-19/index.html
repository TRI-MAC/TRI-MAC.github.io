<style>
  :root{
    --bg:#f2e3b6;
    --paper:#ead7a2;
    --ochre:#c8822a;
    --rust:#9d4c16;
    --red:#8f231c;
    --char:#111111;
    --ink:#050505;
    --bone:#f4ecd1;
    --tan:#d2b27a;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#1a1209;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw, calc(100vh * 1080 / 1920));
    height:min(100vh, calc(100vw * 1920 / 1080));
    aspect-ratio:9/16;
    background:linear-gradient(180deg,#f0dfae 0%, #e2c98f 55%, #c48a44 100%);
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.2), 0 18px 60px rgba(0,0,0,.45);
  }

  /* background texture and stage */
  #bgSvg, #panelSvg, #overlaySvg, #maskSvg, #symbolsSvg, #frontSvg, #textureCanvas{
    position:absolute; inset:0; width:100%; height:100%;
    display:block;
    pointer-events:none;
  }

  #background-video{
    position:absolute;
    inset:7% 5% 7% 5%;
    width:90%;
    height:86%;
    object-fit:cover;
    opacity:.8;
    filter:saturate(.85) sepia(.35) contrast(1.1) brightness(.92) hue-rotate(-10deg);
    transform:scale(1.05);
    mask-image:linear-gradient(180deg, transparent 0%, black 8%, black 92%, transparent 100%);
    -webkit-mask-image:linear-gradient(180deg, transparent 0%, black 8%, black 92%, transparent 100%);
    z-index:1;
  }

  #videoTint{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 48%, rgba(244,236,209,.08), rgba(244,236,209,0) 34%),
      linear-gradient(180deg, rgba(255,230,170,.15), rgba(130,55,16,.12));
    mix-blend-mode:multiply;
    z-index:2;
    pointer-events:none;
  }

  /* comic panel structure */
  .panel-grid{
    position:absolute;
    inset:4.5%;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1.1fr .9fr 1.05fr;
    gap:20px;
    z-index:4;
    pointer-events:none;
  }
  .panel{
    position:relative;
    overflow:hidden;
    border-radius:20px;
    background:rgba(244,236,209,.05);
    box-shadow:
      inset 0 0 0 10px var(--ink),
      inset 0 0 0 15px rgba(244,236,209,.25);
    mask-image:radial-gradient(circle at center, black 78%, rgba(0,0,0,.85) 88%, transparent 100%);
    -webkit-mask-image:radial-gradient(circle at center, black 78%, rgba(0,0,0,.85) 88%, transparent 100%);
  }
  .panel::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(135deg, rgba(255,240,200,.08), transparent 35%),
      radial-gradient(circle at 50% 50%, transparent 45%, rgba(0,0,0,.1) 100%);
    z-index:0;
  }
  .panel svg{
    position:absolute; inset:0; width:100%; height:100%;
  }
  .panel video{
    position:absolute; inset:0;
    width:100%; height:100%; object-fit:cover;
  }
  .p1{grid-column:1;grid-row:1;}
  .p2{grid-column:2;grid-row:1;}
  .p3{grid-column:1;grid-row:2;}
  .p4{grid-column:2;grid-row:2;}
  .p5{grid-column:1 / span 2;grid-row:3;}

  #date{
    position:absolute;
    right:22px;
    bottom:18px;
    z-index:20;
    color:rgba(0,0,0,.46);
    font-size:15px;
    letter-spacing:.18em;
    text-transform:uppercase;
    mix-blend-mode:multiply;
    user-select:none;
  }

  .driftSlow{ animation:driftSlow 24s ease-in-out infinite; transform-origin:center; }
  .driftSlow2{ animation:driftSlow2 31s ease-in-out infinite; transform-origin:center; }
  .pulseSlow{ animation:pulseSlow 14s ease-in-out infinite; transform-origin:center; }
  .rotateSlow{ animation:rotateSlow 34s linear infinite; transform-origin:center; }
  .rotateReverse{ animation:rotateReverse 42s linear infinite; transform-origin:center; }
  .bob{ animation:bob 11s ease-in-out infinite; transform-origin:center; }
  .shimmer{ animation:shimmer 9s ease-in-out infinite; }
  .panelBreath{ animation:panelBreath 18s ease-in-out infinite; }

  @keyframes driftSlow{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(0,-14px) scale(1.025)}
  }
  @keyframes driftSlow2{
    0%,100%{transform:translate(0,0) rotate(0deg)}
    50%{transform:translate(8px,10px) rotate(1.6deg)}
  }
  @keyframes pulseSlow{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.04)}
  }
  @keyframes rotateSlow{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
  }
  @keyframes rotateReverse{
    from{transform:rotate(360deg)}
    to{transform:rotate(0deg)}
  }
  @keyframes bob{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
  }
  @keyframes shimmer{
    0%,100%{opacity:.3}
    50%{opacity:.52}
  }
  @keyframes panelBreath{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.012)}
  }

  #guinea-pig{
    position:absolute;
    width:17px;
    height:auto;
    left:59px;
    bottom:111px;
    opacity:.58;
    z-index:8;
    filter:saturate(.8) sepia(.2) contrast(1.05) brightness(.86);
    transform:rotate(-8deg);
  }

  #frontHaze{
    position:absolute; inset:-5%;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,241,200,.18), transparent 24%),
      radial-gradient(circle at 20% 76%, rgba(157,76,22,.12), transparent 24%),
      radial-gradient(circle at 81% 68%, rgba(143,35,28,.1), transparent 20%);
    z-index:12;
    pointer-events:none;
    mix-blend-mode:soft-light;
    animation:driftSlow2 40s ease-in-out infinite;
  }
</style>

<script>
(function(){
  const canvas = document.getElementById('textureCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // deterministic PRNG from date
  let seed = 20260519 >>> 0;
  function rnd(){
    seed = (1664525 * seed + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  // painted paper grain
  const img = ctx.createImageData(W, H);
  for(let i=0;i<img.data.length;i+=4){
    const n = 218 + Math.floor((rnd()-.5)*28);
    img.data[i] = n + 10;
    img.data[i+1] = n - 4;
    img.data[i+2] = n - 28;
    img.data[i+3] = 24;
  }
  ctx.putImageData(img,0,0);

  // subtle carved chips and mottling
  ctx.globalCompositeOperation = 'multiply';
  for(let i=0;i<420;i++){
    const x = rnd()*W, y = rnd()*H;
    const w = 8 + rnd()*28, h = 2 + rnd()*10;
    ctx.fillStyle = `rgba(70,35,12,${0.03 + rnd()*0.06})`;
    ctx.fillRect(x,y,w,h);
  }

  // warm wash
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(255,235,180,0.10)');
  g.addColorStop(.5,'rgba(190,110,35,0.05)');
  g.addColorStop(1,'rgba(60,20,8,0.14)');
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // panel echoes in texture
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 4;
  [[49,49,982,1822],[78,616,924,20],[78,1108,924,22],[530,116,20,1014]].forEach(r=>{
    ctx.strokeRect(r[0],r[1],r[2],r[3]);
  });

  if (window.self === window.top) {
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      const ac = new AC();
      const master = ac.createGain();
      master.gain.value = 0.015;
      master.connect(ac.destination);

      const now = ac.currentTime;

      function tone(freq, type, gain, panVal){
        const o = ac.createOscillator();
        const g = ac.createGain();
        const p = ac.createStereoPanner ? ac.createStereoPanner() : null;
        o.type = type;
        o.frequency.value = freq;
        g.gain.value = gain;
        o.connect(g);
        if(p){ g.connect(p); p.pan.value = panVal; p.connect(master); }
        else { g.connect(master); }
        o.start();
        return {o,g};
      }

      const a = tone(82.4,'sine',0.22,-0.15);
      const b = tone(123.47,'triangle',0.12,0.18);
      const c = tone(246.94,'sine',0.05,0);

      function modulate(){
        const t = ac.currentTime;
        a.g.gain.cancelScheduledValues(t);
        b.g.gain.cancelScheduledValues(t);
        c.g.gain.cancelScheduledValues(t);

        a.g.gain.linearRampToValueAtTime(0.018 + 0.006*Math.sin(t/7), t + 6);
        b.g.gain.linearRampToValueAtTime(0.012 + 0.004*Math.cos(t/9), t + 6);
        c.g.gain.linearRampToValueAtTime(0.004 + 0.002*Math.sin(t/5), t + 6);

        a.o.frequency.linearRampToValueAtTime(82.4 + 1.2*Math.sin(t/11), t + 6);
        b.o.frequency.linearRampToValueAtTime(123.47 + 1.6*Math.cos(t/13), t + 6);
        c.o.frequency.linearRampToValueAtTime(246.94 + 2*Math.sin(t/8), t + 6);
      }
      modulate();
      setInterval(modulate, 5000);
    }catch(e){}
  }
})();
</script>
</body>
</html>
