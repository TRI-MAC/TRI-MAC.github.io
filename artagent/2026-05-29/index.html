<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>2026-05-29</title>
<style>
  :root{
    --bg:#02040a;
    --cyan:#31f3ff;
    --mag:#ff2bbd;
    --vio:#7c4dff;
    --lime:#9dff00;
    --amber:#ffc84d;
    --red:#ff3b5f;
    --grid:#0e2038;
    --panel:#08111e;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw, calc(100vh * 1080 / 1920));
    aspect-ratio:9/16;
    background:
      radial-gradient(circle at 50% 18%, rgba(124,77,255,.14), transparent 28%),
      radial-gradient(circle at 70% 38%, rgba(49,243,255,.10), transparent 22%),
      linear-gradient(180deg, #030611 0%, #02040a 100%);
    overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.7), 0 0 120px rgba(49,243,255,.08) inset;
  }
  #game, #fx{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  #hud, #overlays, #date{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  #frame::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.05) 0px,
        rgba(255,255,255,.05) 1px,
        rgba(0,0,0,0) 3px,
        rgba(0,0,0,0) 6px
      );
    opacity:.10;
    mix-blend-mode:screen;
    animation: scanDrift 10s linear infinite;
  }
  #frame::after{
    content:"";
    position:absolute;
    inset:-8%;
    background:
      linear-gradient(90deg, rgba(49,243,255,.03), transparent 18%, transparent 82%, rgba(255,43,189,.03)),
      radial-gradient(circle at center, transparent 58%, rgba(0,0,0,.25) 100%);
    pointer-events:none;
  }

  @keyframes scanDrift{
    from{transform:translateY(0)}
    to{transform:translateY(6px)}
  }

  .hudline{
    position:absolute;
    left:6%;
    right:6%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(49,243,255,.35), transparent);
    opacity:.35;
  }
  .vline{
    position:absolute;
    top:8%;
    bottom:8%;
    width:1px;
    background:linear-gradient(180deg, transparent, rgba(49,243,255,.15), transparent);
    opacity:.3;
  }
  .corner{
    position:absolute;
    width:16%;
    height:9%;
    border:1px solid rgba(49,243,255,.28);
    opacity:.45;
    filter:drop-shadow(0 0 8px rgba(49,243,255,.15));
  }
  .corner.tl{left:3%;top:3%;border-right:none;border-bottom:none}
  .corner.tr{right:3%;top:3%;border-left:none;border-bottom:none}
  .corner.bl{left:3%;bottom:3%;border-right:none;border-top:none}
  .corner.br{right:3%;bottom:3%;border-left:none;border-top:none}

  #date{
    display:flex;
    align-items:flex-end;
    justify-content:flex-start;
    padding:0 18px 12px 18px;
    color:rgba(180,235,255,.58);
    font-size:12px;
    letter-spacing:.18em;
    text-shadow:0 0 8px rgba(49,243,255,.15);
    z-index:30;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:15px;
    bottom:176px;
    opacity:.58;
    filter:saturate(.8) hue-rotate(155deg) brightness(.82) contrast(1.08) drop-shadow(0 0 2px rgba(49,243,255,.18));
    z-index:16;
  }

  .ring{
    position:absolute;
    border:1px solid rgba(49,243,255,.16);
    border-radius:50%;
    filter:drop-shadow(0 0 10px rgba(49,243,255,.08));
    animation: ringPulse 9s ease-in-out infinite;
  }
  .ring.r1{width:52%;height:52%;left:24%;top:8%;opacity:.26}
  .ring.r2{width:66%;height:66%;left:17%;top:2%;opacity:.14;animation-duration:13s}
  @keyframes ringPulse{
    0%,100%{transform:scale(1); opacity:.14}
    50%{transform:scale(1.02); opacity:.28}
  }

  .dataBlock{
    position:absolute;
    border:1px solid rgba(255,43,189,.22);
    background:linear-gradient(180deg, rgba(255,43,189,.06), rgba(49,243,255,.02));
    box-shadow:0 0 18px rgba(255,43,189,.06) inset;
    opacity:.55;
  }
  .d1{left:7%; top:16%; width:13%; height:5%}
  .d2{right:9%; top:25%; width:16%; height:4%}
  .d3{right:11%; bottom:29%; width:12%; height:5%}
  .d4{left:9%; bottom:22%; width:10%; height:4%}
</style>
</head>
<body>
<div id="frame">
  <canvas id="game" width="1080" height="1920"></canvas>
  <canvas id="fx" width="1080" height="1920"></canvas>

  <div id="hud">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="hudline" style="top:9%"></div>
    <div class="hudline" style="top:16%"></div>
    <div class="hudline" style="bottom:28%"></div>
    <div class="hudline" style="bottom:12%"></div>

    <div class="vline" style="left:8%"></div>
    <div class="vline" style="left:50%"></div>
    <div class="vline" style="right:8%"></div>

    <div class="ring r1"></div>
    <div class="ring r2"></div>

    <div class="dataBlock d1"></div>
    <div class="dataBlock d2"></div>
    <div class="dataBlock d3"></div>
    <div class="dataBlock d4"></div>
  </div>

  <img id="guinea-pig" src="guineapig.png" alt="" />
  <div id="date">2026-05-29</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const fx = document.getElementById('fx');
  const fctx = fx.getContext('2d');

  const W = canvas.width, H = canvas.height;
  const DATE = "2026-05-29";

  function hashString(str){
    let h = 2166136261 >>> 0;
    for(let i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
  }
  const rand = mulberry32(hashString(DATE + "-cyber-retro-shooter"));
  function lerp(a,b,t){ return a + (b-a)*t; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  const palette = {
    cyan:'#31f3ff',
    mag:'#ff2bbd',
    vio:'#7c4dff',
    lime:'#9dff00',
    amber:'#ffc84d',
    red:'#ff3b5f',
    bg:'#02040a',
    panel:'#08111e',
    grid:'#0e2038'
  };

  const laneCount = 5;
  const laneXs = [];
  const road = { left:170, right:910, top:220, bottom:1710, laneW:(910-170)/laneCount };
  for(let i=0;i<laneCount;i++) laneXs.push(road.left + road.laneW*(i+.5));

  const player = {
    lane:2,
    x:laneXs[2],
    y:1490,
    w:92,
    h:150,
    pulse:0
  };

  const enemies = [];
  const bullets = [];
  const sparks = [];
  const shards = [];
  const topTraffic = [];
  const sidePanels = [];

  for(let i=0;i<16;i++){
    sidePanels.push({
      x: rand()<.5 ? lerp(40,120,rand()) : lerp(960,1040,rand()),
      y: lerp(260,1680,rand()),
      w: lerp(16,34,rand()),
      h: lerp(60,180,rand()),
      c: rand()<.5 ? palette.cyan : palette.mag,
      a: lerp(.08,.22,rand())
    });
  }

  function spawnEnemy(forceLane){
    const lane = forceLane ?? Math.floor(rand()*laneCount);
    const type = rand()<0.18 ? 'shrimp' : (rand()<0.56 ? 'carA' : 'carB');
    const speed = type==='shrimp' ? lerp(8.5,10.5,rand()) : lerp(10,14,rand());
    enemies.push({
      lane,
      x: laneXs[lane],
      y: -220 - rand()*600,
      w: type==='shrimp' ? 110 : 96,
      h: type==='shrimp' ? 86 : 142,
      type,
      speed,
      hue: rand()<.5 ? palette.mag : palette.cyan,
      alt: rand()<.5 ? palette.amber : palette.red
    });
  }

  for(let i=0;i<8;i++) spawnEnemy(i%laneCount);

  let frame = 0;
  let score = 0;
  let cycleT = 0;

  function chooseTargetLane(){
    let target = player.lane;
    let bestScore = -1e9;
    for(let lane=0; lane<laneCount; lane++){
      let danger = 0;
      let reward = 0;
      for(const e of enemies){
        if(e.lane !== lane) continue;
        const dy = e.y - player.y;
        if(dy > -220 && dy < 360){
          danger += (360 - Math.abs(dy))*2.8;
          if(e.type==='shrimp') reward += 220 - Math.abs(dy)*0.22;
        } else if(e.type==='shrimp' && dy > 360 && dy < 880){
          reward += 90 - dy*0.04;
        }
      }
      const laneCenterBias = -Math.abs(lane-2)*8;
      const shootBias = lane===player.lane ? 12 : 0;
      const s = reward - danger + laneCenterBias + shootBias;
      if(s > bestScore){
        bestScore = s;
        target = lane;
      }
    }
    return target;
  }

  function fire(){
    bullets.push({
      x: player.x,
      y: player.y - player.h*0.42,
      vy: -26,
      life: 80
    });
  }

  function explosion(x,y,c1,c2,count){
    for(let i=0;i<count;i++){
      const a = Math.PI*2*(i/count) + rand()*0.35;
      const sp = lerp(2,10,rand());
      sparks.push({
        x,y,
        vx: Math.cos(a)*sp,
        vy: Math.sin(a)*sp,
        life: lerp(24,58,rand()),
        max: 58,
        color: rand()<.5 ? c1 : c2
      });
    }
    for(let i=0;i<7;i++){
      shards.push({
        x,y,
        vx: lerp(-4,4,rand()),
        vy: lerp(-4,4,rand()),
        s: lerp(14,38,rand()),
        r: rand()*Math.PI,
        vr: lerp(-.09,.09,rand()),
        life: lerp(30,60,rand()),
        color: rand()<.5 ? c1 : c2
      });
    }
  }

  function update(){
    frame++;
    cycleT = (frame % 1080) / 1080;

    if(frame % 36 === 0){
      player.lane = chooseTargetLane();
    }
    player.x += (laneXs[player.lane] - player.x) * 0.18;
    player.pulse = 0.5 + 0.5*Math.sin(frame*0.07);

    let shouldShoot = false;
    for(const e of enemies){
      if(e.lane === player.lane && e.y < player.y - 120 && e.y > player.y - 760){
        shouldShoot = true;
        break;
      }
    }
    if(shouldShoot && frame % 18 === 0) fire();

    if(frame % 28 === 0){
      spawnEnemy();
    }

    for(const b of bullets){
      b.y += b.vy;
      b.life--;
    }
    for(let i=bullets.length-1;i>=0;i--){
      if(bullets[i].life<=0 || bullets[i].y < 160) bullets.splice(i,1);
    }

    for(const e of enemies){
      e.y += e.speed;
    }

    for(let i=enemies.length-1;i>=0;i--){
      const e = enemies[i];
      let removed = false;
      for(let j=bullets.length-1;j>=0;j--){
        const b = bullets[j];
        if(Math.abs(b.x-e.x) < e.w*0.42 && Math.abs(b.y-e.y) < e.h*0.48){
          explosion(e.x, e.y, e.hue, e.alt, e.type==='shrimp' ? 18 : 12);
          score += e.type==='shrimp' ? 29 : 11;
          bullets.splice(j,1);
          enemies.splice(i,1);
          removed = true;
          break;
        }
      }
      if(removed) continue;

      if(e.y > H+220){
        enemies.splice(i,1);
        continue;
      }
    }

    for(const s of sparks){
      s.x += s.vx;
      s.y += s.vy;
      s.vx *= 0.98;
      s.vy *= 0.98;
      s.life--;
    }
    for(let i=sparks.length-1;i>=0;i--) if(sparks[i].life<=0) sparks.splice(i,1);

    for(const sh of shards){
      sh.x += sh.vx;
      sh.y += sh.vy;
      sh.r += sh.vr;
      sh.life--;
    }
    for(let i=shards.length-1;i>=0;i--) if(shards[i].life<=0) shards.splice(i,1);

    if(topTraffic.length < 8 && frame % 22 === 0){
      topTraffic.push({
        lane: Math.floor(rand()*laneCount),
        y: lerp(250,860,rand()),
        z: lerp(.2,.9,rand()),
        c: rand()<.5 ? palette.cyan : palette.mag
      });
    }
    for(const t of topTraffic){
      t.y += 4 + t.z*6;
      if(t.y > 980){
        t.y = lerp(220,420,rand());
        t.lane = Math.floor(rand()*laneCount);
        t.z = lerp(.2,.9,rand());
      }
    }
  }

  function drawBackground(){
    ctx.clearRect(0,0,W,H);

    const glowY = 300 + Math.sin(frame*0.01)*35;
    const bgGrad = ctx.createRadialGradient(W/2, glowY, 0, W/2, glowY, 900);
    bgGrad.addColorStop(0, 'rgba(124,77,255,0.24)');
    bgGrad.addColorStop(0.35, 'rgba(10,18,40,0.34)');
    bgGrad.addColorStop(1, 'rgba(2,4,10,1)');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.translate(W/2, 0);
    ctx.scale(1,1.04);

    const left = road.left, right = road.right, top = road.top, bottom = road.bottom;
    const roadGrad = ctx.createLinearGradient(0,top,0,bottom);
    roadGrad.addColorStop(0,'rgba(4,10,22,.55)');
    roadGrad.addColorStop(.5,'rgba(5,13,28,.88)');
    roadGrad.addColorStop(1,'rgba(3,8,18,.96)');
    ctx.fillStyle = roadGrad;
    ctx.beginPath();
    ctx.moveTo(left-W/2, top);
    ctx.lineTo(right-W/2, top);
    ctx.lineTo(right-W/2+30, bottom);
    ctx.lineTo(left-W/2-30, bottom);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(49,243,255,.24)';
    ctx.lineWidth = 2;
    ctx.stroke();

    for(let i=1;i<laneCount;i++){
      const x = road.left + road.laneW*i - W/2;
      ctx.strokeStyle = i===2 ? 'rgba(255,43,189,.26)' : 'rgba(49,243,255,.18)';
      ctx.setLineDash([18,18]);
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x, bottom);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    for(let y=top; y<bottom; y+=72){
      const d = (frame*9 + y*0.8) % 72;
      const yy = y + d;
      const alpha = 0.06 + 0.08*(1 - (yy-top)/(bottom-top));
      ctx.fillStyle = `rgba(49,243,255,${alpha})`;
      ctx.fillRect(left-W/2+6, yy, right-left-12, 3);
    }

    for(let i=0;i<sidePanels.length;i++){
      const p = sidePanels[i];
      ctx.fillStyle = p.c === palette.cyan ? `rgba(49,243,255,${p.a})` : `rgba(255,43,189,${p.a})`;
      ctx.fillRect(p.x-W/2, p.y, p.w, p.h);
      ctx.strokeStyle = p.c === palette.cyan ? 'rgba(49,243,255,.22)' : 'rgba(255,43,189,.18)';
      ctx.strokeRect(p.x-W/2, p.y, p.w, p.h);
    }

    ctx.restore();

    ctx.save();
    ctx.globalAlpha = .28;
    for(let i=0;i<topTraffic.length;i++){
      const t = topTraffic[i];
      const x = laneXs[t.lane];
      const scale = t.z;
      drawMiniCar(ctx, x, t.y, 28*scale, 42*scale, t.c);
    }
    ctx.restore();
  }

  function drawMiniCar(c,x,y,w,h,color){
    c.save();
    c.translate(x,y);
    c.fillStyle = color===''+palette.cyan ? 'rgba(49,243,255,.25)' : 'rgba(255,43,189,.25)';
    c.fillRect(-w/2,-h/2,w,h);
    c.fillStyle = 'rgba(255,255,255,.18)';
    c.fillRect(-w*0.18,-h*0.18,w*0.36,h*0.18);
    c.restore();
  }

  function drawPlayer(){
    const x = player.x, y = player.y, w = player.w, h = player.h;
    ctx.save();
    ctx.translate(x,y);

    ctx.shadowBlur = 26;
    ctx.shadowColor = 'rgba(49,243,255,.45)';
    ctx.fillStyle = 'rgba(49,243,255,.08)';
    ctx.beginPath();
    ctx.moveTo(0,-h*0.55);
    ctx.lineTo(w*0.42,h*0.34);
    ctx.lineTo(0,h*0.54);
    ctx.lineTo(-w*0.42,h*0.34);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = palette.cyan;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0,-h*0.55);
    ctx.lineTo(w*0.42,h*0.34);
    ctx.lineTo(0,h*0.54);
    ctx.lineTo(-w*0.42,h*0.34);
    ctx.closePath();
    ctx.stroke();

    ctx.strokeStyle = `rgba(255,43,189,${0.55 + player.pulse*0.2})`;
    ctx.beginPath();
    ctx.moveTo(0,-h*0.3);
    ctx.lineTo(w*0.18,h*0.15);
    ctx.lineTo(0,h*0.23);
    ctx.lineTo(-w*0.18,h*0.15);
    ctx.closePath();
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,200,77,.9)';
    ctx.fillRect(-8, h*0.52, 16, 36 + 12*player.pulse);

    ctx.fillStyle = 'rgba(255,43,189,.55)';
    ctx.fillRect(-w*0.14, h*0.36, 10, 22);
    ctx.fillRect(w*0.14-10, h*0.36, 10, 22);

    ctx.restore();
  }

  function drawEnemy(e){
    ctx.save();
    ctx.translate(e.x,e.y);
    if(e.type === 'shrimp'){
      drawShrimpEnemy(ctx, e);
    } else {
      drawCarEnemy(ctx, e);
    }
    ctx.restore();
  }

  function drawCarEnemy(c,e){
    const w=e.w, h=e.h;
    c.shadowBlur = 18;
    c.shadowColor = e.hue === palette.mag ? 'rgba(255,43,189,.25)' : 'rgba(49,243,255,.25)';
    c.fillStyle = 'rgba(8,17,30,.85)';
    c.fillRect(-w/2,-h/2,w,h);
    c.shadowBlur = 0;

    c.strokeStyle = e.hue;
    c.lineWidth = 3;
    c.strokeRect(-w/2,-h/2,w,h);

    c.fillStyle = 'rgba(255,255,255,.14)';
    c.fillRect(-w*0.22,-h*0.18,w*0.44,h*0.22);

    c.fillStyle = e.alt;
    c.fillRect(-w*0.32,-h*0.42,w*0.64,10);
    c.fillRect(-w*0.32,h*0.33,w*0.64,10);

    c.fillStyle = 'rgba(49,243,255,.12)';
    c.fillRect(-w*0.1,-h*0.5,w*0.2,h);
  }

  function drawShrimpEnemy(c,e){
    const t = frame*0.05 + e.y*0.01;
    c.shadowBlur = 20;
    c.shadowColor = 'rgba(255,43,189,.28)';
    c.fillStyle = 'rgba(255,43,189,.12)';
    c.beginPath();
    c.ellipse(0,0,56,40,0,0,Math.PI*2);
    c.fill();
    c.shadowBlur = 0;

    c.strokeStyle = palette.mag;
    c.lineWidth = 4;

    for(let i=0;i<5;i++){
      const r = 16 + i*9;
      const a0 = -1.1 + i*0.06 + Math.sin(t+i)*0.04;
      const a1 = 1.0 + i*0.05 + Math.sin(t*0.7+i)*0.04;
      c.beginPath();
      c.arc(-8 + i*4, 0, r, a0, a1);
      c.stroke();
    }

    c.strokeStyle = palette.cyan;
    c.lineWidth = 3;
    c.beginPath();
    c.arc(24,-2,12,0,Math.PI*2);
    c.stroke();

    c.fillStyle = palette.cyan;
    c.fillRect(20,-6,8,8);

    c.strokeStyle = palette.amber;
    c.lineWidth = 3;
    for(let i=0;i<4;i++){
      const yy = -18 + i*12;
      c.beginPath();
      c.moveTo(-6, yy);
      c.lineTo(-28 - i*6, yy + 8);
      c.stroke();
      c.beginPath();
      c.moveTo(6, yy);
      c.lineTo(30 + i*6, yy + 8);
      c.stroke();
    }

    c.strokeStyle = 'rgba(49,243,255,.75)';
    c.beginPath();
    c.moveTo(26,-14);
    c.lineTo(48,-34);
    c.stroke();
    c.beginPath();
    c.moveTo(22,6);
    c.lineTo(52,18);
    c.stroke();
  }

  function drawBullets(){
    for(const b of bullets){
      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.fillStyle = palette.lime;
      ctx.shadowBlur = 12;
      ctx.shadowColor = 'rgba(157,255,0,.5)';
      ctx.fillRect(-4,-18,8,36);
      ctx.restore();
    }
  }

  function drawSparks(){
    for(const s of sparks){
      const a = s.life / s.max;
      ctx.fillStyle = s.color === palette.mag ? `rgba(255,43,189,${a*.9})` :
                      s.color === palette.cyan ? `rgba(49,243,255,${a*.9})` :
                      `rgba(255,200,77,${a*.9})`;
      ctx.fillRect(s.x-2,s.y-2,4,4);
    }
    for(const sh of shards){
      const a = sh.life/60;
      ctx.save();
      ctx.translate(sh.x,sh.y);
      ctx.rotate(sh.r);
      ctx.fillStyle = sh.color === palette.mag ? `rgba(255,43,189,${a*.5})` : `rgba(49,243,255,${a*.5})`;
      ctx.fillRect(-sh.s/2,-sh.s/8,sh.s,sh.s/4);
      ctx.restore();
    }
  }

  function drawHUDText(){
    const t = (Math.sin(frame*0.012)+1)*.5;
    ctx.save();
    ctx.font = '24px ui-monospace, monospace';
    ctx.textBaseline = 'top';

    ctx.fillStyle = 'rgba(49,243,255,.75)';
    ctx.fillText('AUTO PILOT', 90, 98);

    ctx.fillStyle = 'rgba(180,235,255,.72)';
    ctx.fillText('LANE '+(player.lane+1), 90, 132);
    ctx.fillText('SCORE '+String(score).padStart(4,'0'), 90, 166);

    ctx.fillStyle = `rgba(255,43,189,${0.48+.18*t})`;
    ctx.fillText('THREAT MATRIX', 748, 98);

    for(let i=0;i<laneCount;i++){
      let threat = 0;
      for(const e of enemies){
        if(e.lane===i){
          const dy = e.y-player.y;
          if(dy > -220 && dy < 520) threat += 1 - Math.abs(dy)/520;
        }
      }
      threat = clamp(threat,0,1);
      const bx = 762 + i*38;
      const by = 138;
      ctx.strokeStyle = 'rgba(49,243,255,.35)';
      ctx.strokeRect(bx,by,22,62);
      ctx.fillStyle = i===player.lane ? 'rgba(49,243,255,.28)' : 'rgba(255,43,189,.16)';
      ctx.fillRect(bx+3, by+59 - threat*56, 16, threat*56);
    }

    ctx.fillStyle = 'rgba(255,200,77,.75)';
    ctx.fillText('TARGET: SHRIMP NODE', 676, 164);

    ctx.restore();
  }

  function drawFX(){
    fctx.clearRect(0,0,W,H);

    const sweep = (frame*3) % (H+400) - 200;
    const grad = fctx.createLinearGradient(0,sweep-180,0,sweep+180);
    grad.addColorStop(0,'rgba(49,243,255,0)');
    grad.addColorStop(0.5,'rgba(49,243,255,.06)');
    grad.addColorStop(1,'rgba(49,243,255,0)');
    fctx.fillStyle = grad;
    fctx.fillRect(0,sweep-180,W,360);

    fctx.strokeStyle = 'rgba(255,43,189,.12)';
    fctx.lineWidth = 1;
    for(let i=0;i<9;i++){
      const r = 120 + i*54 + Math.sin(frame*0.008+i)*8;
      fctx.beginPath();
      fctx.arc(W/2, 410, r, Math.PI*0.08, Math.PI*0.92);
      fctx.stroke();
    }

    const vign = fctx.createRadialGradient(W/2,H/2,540,W/2,H/2,1100);
    vign.addColorStop(0,'rgba(0,0,0,0)');
    vign.addColorStop(1,'rgba(0,0,0,.34)');
    fctx.fillStyle = vign;
    fctx.fillRect(0,0,W,H);
  }

  function render(){
    update();
    drawBackground();

    for(const e of enemies) drawEnemy(e);
    drawBullets();
    drawPlayer();
    drawSparks();
    drawHUDText();
    drawFX();

    requestAnimationFrame(render);
  }

  render();

  if (window.self === window.top) {
    try{
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const ac = new AudioContext();

      const master = ac.createGain();
      master.gain.value = 0.018;
      master.connect(ac.destination);

      const low = ac.createOscillator();
      low.type = 'sawtooth';
      low.frequency.value = 46;

      const lowGain = ac.createGain();
      lowGain.gain.value = 0.13;

      const pulse = ac.createOscillator();
      pulse.type = 'square';
      pulse.frequency.value = 92;

      const pulseGain = ac.createGain();
      pulseGain.gain.value = 0.0;

      const filter = ac.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 680;
      filter.Q.value = 1.2;

      const lfo = ac.createOscillator();
      lfo.frequency.value = 0.07;
      const lfoGain = ac.createGain();
      lfoGain.gain.value = 120;
      lfo.connect(lfoGain).connect(filter.frequency);

      low.connect(lowGain).connect(filter);
      pulse.connect(pulseGain).connect(filter);
      filter.connect(master);

      low.start();
      pulse.start();
      lfo.start();

      let seq = 0;
      const notes = [92, 123, 110, 138, 92, 146, 110, 123];
      setInterval(()=>{
        const n = notes[seq % notes.length];
        pulse.frequency.setTargetAtTime(n, ac.currentTime, 0.03);
        pulseGain.gain.cancelScheduledValues(ac.currentTime);
        pulseGain.gain.setValueAtTime(0.0, ac.currentTime);
        pulseGain.gain.linearRampToValueAtTime(0.022, ac.currentTime + 0.05);
        pulseGain.gain.linearRampToValueAtTime(0.0, ac.currentTime + 0.42);

        low.frequency.setTargetAtTime(n/2, ac.currentTime, 0.12);
        seq++;
      }, 900);
    }catch(e){}
  }
})();
</script>
