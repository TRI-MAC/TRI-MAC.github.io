<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="utf-8">
<title>Formica Gloriosa — 2026-08-28</title>
<style>
  html,body{margin:0;padding:0;background:#e8dcc0;overflow:hidden;}
  #stage{
    position:relative;
    width:min(100vw, calc(100vh * 0.5625));
    height:min(100vh, calc(100vw / 0.5625));
    margin:0 auto;
    background:#f2e6c9;
    overflow:hidden;
  }
  /* ---- painterly ground that continues the image outward ---- */
  #ground{
    position:absolute; inset:0;
    background:
      radial-gradient(120% 70% at 22% 12%, #fdf6e0 0%, rgba(253,246,224,0) 62%),
      radial-gradient(90% 60% at 84% 88%, #f6dfa6 0%, rgba(246,223,166,0) 66%),
      linear-gradient(178deg, #fbf1d6 0%, #f3e2b8 42%, #e9cf9c 74%, #dcbd86 100%);
  }
  #scene-image{
    position:absolute;
    left:-2%; top:-2%; width:104%; height:104%;
    object-fit:cover;
    object-position:50% 42%;
    opacity:0.98;
    animation:breathe 68s ease-in-out infinite;
    will-change:transform;
  }
  @keyframes breathe{
    0%   {transform:scale(1.000) translate3d(0,0,0);}
    50%  {transform:scale(1.026) translate3d(-0.6%,-0.5%,0);}
    100% {transform:scale(1.000) translate3d(0,0,0);}
  }
  /* single blend layer: warm light + soft shadow shoulders, dissolving the rectangle */
  #chiaro{
    position:absolute; inset:-6%;
    mix-blend-mode:soft-light;
    background:
      radial-gradient(58% 42% at 46% 30%, rgba(255,246,214,0.92) 0%, rgba(255,246,214,0) 70%),
      radial-gradient(70% 40% at 8% 100%, rgba(96,60,32,0.55) 0%, rgba(96,60,32,0) 72%),
      radial-gradient(70% 40% at 96% 4%, rgba(84,52,28,0.42) 0%, rgba(84,52,28,0) 70%);
    pointer-events:none;
  }
  #bands, #trails, #ants{position:absolute; inset:0;}
  #trails, #ants{width:100%; height:100%;}
  #bands{pointer-events:none;}
  .drift{animation:drift 96s ease-in-out infinite; transform-origin:50% 50%;}
  @keyframes drift{
    0%{transform:translate3d(0,0,0) rotate(0deg);}
    50%{transform:translate3d(0.8%,-1.1%,0) rotate(0.5deg);}
    100%{transform:translate3d(0,0,0) rotate(0deg);}
  }
  .drift2{animation:drift2 124s ease-in-out infinite; transform-origin:50% 50%;}
  @keyframes drift2{
    0%{transform:translate3d(0,0,0) rotate(0deg);}
    50%{transform:translate3d(-1%,0.9%,0) rotate(-0.6deg);}
    100%{transform:translate3d(0,0,0) rotate(0deg);}
  }
  #guinea-pig{
    position:absolute;
    left:7.4%; bottom:5.1%;
    width:17px;
    opacity:0.62;
    transform:rotate(-9deg);
    pointer-events:none;
  }
  #date{
    position:absolute; left:3.4%; bottom:2.2%;
    font:400 12px/1 Georgia, 'Times New Roman', serif;
    letter-spacing:0.22em;
    color:#4a2f16; opacity:0.5;
    pointer-events:none; user-select:none;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="ground"></div>
  <img id="scene-image" src="scene.png" alt="">

  <!-- large style-native strokes that begin inside the image and continue past its edges -->
  <svg id="bands" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f7e2a4" stop-opacity="0"/>
        <stop offset="0.28" stop-color="#f4d287" stop-opacity="0.72"/>
        <stop offset="0.72" stop-color="#e8ae5a" stop-opacity="0.62"/>
        <stop offset="1" stop-color="#c8843a" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gB" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5b3a1c" stop-opacity="0"/>
        <stop offset="0.35" stop-color="#6b421d" stop-opacity="0.5"/>
        <stop offset="0.75" stop-color="#3f2510" stop-opacity="0.42"/>
        <stop offset="1" stop-color="#3f2510" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gC" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#a83a24" stop-opacity="0"/>
        <stop offset="0.4" stop-color="#b8452a" stop-opacity="0.5"/>
        <stop offset="1" stop-color="#e08a4a" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gD" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff8dd" stop-opacity="0"/>
        <stop offset="0.5" stop-color="#fff8dd" stop-opacity="0.66"/>
        <stop offset="1" stop-color="#fff8dd" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- broad diagonal light band, enters top-left of frame, exits bottom-right beyond image -->
    <g class="drift">
      <polygon points="-160,520 520,-180 900,-40 -160,900" fill="url(#gA)"/>
      <polygon points="1240,1180 520,1980 180,1980 1240,860" fill="url(#gA)" opacity="0.75"/>
    </g>
    <!-- deep umber shoulder crossing the lower boundary -->
    <g class="drift2">
      <polygon points="1240,1320 300,1980 -160,1980 -160,1720 1240,1000" fill="url(#gB)"/>
      <polygon points="-160,180 340,-160 700,-160 -160,460" fill="url(#gB)" opacity="0.7"/>
    </g>
    <!-- vermilion counter-stroke -->
    <g class="drift">
      <polygon points="1240,300 640,1080 780,1180 1240,540" fill="url(#gC)"/>
    </g>
    <!-- thin chalk highlight raking across -->
    <g class="drift2">
      <polygon points="-160,1080 1240,760 1240,806 -160,1132" fill="url(#gD)" opacity="0.55"/>
    </g>
  </svg>

  <!-- emergent pheromone trails (drawn once per frame, low-res, accumulating) -->
  <canvas id="trails"></canvas>
  <!-- the colony itself -->
  <canvas id="ants"></canvas>

  <img id="guinea-pig" src="guineapig.png" alt="">
  <div id="date">2026 · 08 · 28</div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- date seed ---------------- */
  var DATE = "2026-08-28";
  var seed = 0;
  for (var i=0;i<DATE.length;i++) seed = (seed*131 + DATE.charCodeAt(i)) >>> 0;
  seed = (seed ^ 0x9e3779b9) >>> 0;
  function rnd(){
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >>> 17;
    seed ^= seed << 5;  seed >>>= 0;
    return seed / 4294967296;
  }
  function rr(a,b){ return a + (b-a)*rnd(); }

  /* ---------------- canvases (half-res backing store) ---------------- */
  var W = 540, H = 960;
  var tc = document.getElementById('trails');
  var ac = document.getElementById('ants');
  [tc,ac].forEach(function(c){
    c.width = W; c.height = H;
    c.style.width='100%'; c.style.height='100%';
    c.style.position='absolute'; c.style.left='0'; c.style.top='0';
  });
  var T = tc.getContext('2d');
  var A = ac.getContext('2d');

  /* ---------------- colony geometry ---------------- */
  // Nest and a few food caches. Ants shuttle between them; the trails they
  // wear into the ground are the artwork.
  var nest = { x: W*rr(0.24,0.34), y: H*rr(0.80,0.86) };
  var foods = [];
  var FN = 4;
  for (var f=0; f<FN; f++){
    var ang = (-Math.PI*0.92) + f*(Math.PI*0.62/FN) + rr(-0.12,0.12);
    var dist = H*rr(0.34,0.62);
    var fx = nest.x + Math.cos(ang)*dist*0.62;
    var fy = nest.y + Math.sin(ang)*dist;
    fx = Math.max(W*0.10, Math.min(W*0.92, fx));
    fy = Math.max(H*0.10, Math.min(H*0.72, fy));
    foods.push({x:fx, y:fy, r: rr(9,15), amount: rr(0.6,1.0)});
  }

  /* ---------------- ants ---------------- */
  // Baroque: warm carmine-umber bodies, a raking highlight on each thorax.
  var ANTS = [];
  var N = 26;
  for (var k=0;k<N;k++){
    ANTS.push(makeAnt());
  }
  function makeAnt(){
    var a = {
      x: nest.x + rr(-14,14),
      y: nest.y + rr(-10,10),
      heading: rr(0, Math.PI*2),
      speed: rr(0.34, 0.62),
      carrying: false,
      target: foods[(rnd()*foods.length)|0],
      wobble: rr(0,6.28),
      wobRate: rr(0.02,0.05),
      scale: rr(0.82,1.28),
      stuck: 0,
      lastD: 1e9,
      hue: rr(0,1),
      leg: rr(0,6.28)
    };
    return a;
  }

  function retarget(a){
    if (a.carrying){ a.target = nest; }
    else {
      // prefer richer caches, but wander choices so trails braid
      var best = null, bs = -1;
      for (var i=0;i<foods.length;i++){
        var fd = foods[i];
        var d = Math.hypot(fd.x-a.x, fd.y-a.y)+1;
        var s = (fd.amount+0.25) / d * (0.6 + rnd()*0.9);
        if (s>bs){ bs=s; best=fd; }
      }
      a.target = best;
    }
    a.stuck = 0; a.lastD = 1e9;
  }

  /* ---------------- trail layer ---------------- */
  T.fillStyle = 'rgba(0,0,0,0)';
  var fadeTick = 0;

  function depositTrail(a){
    var s = a.scale;
    if (a.carrying){
      // laden ants lay a warm ochre-carmine track
      T.fillStyle = 'rgba(150,58,30,0.055)';
      T.beginPath(); T.arc(a.x, a.y, 1.9*s, 0, 6.2832); T.fill();
      T.fillStyle = 'rgba(255,232,176,0.05)';
      T.beginPath(); T.arc(a.x - 0.7, a.y - 0.9, 0.9*s, 0, 6.2832); T.fill();
    } else {
      T.fillStyle = 'rgba(72,44,22,0.032)';
      T.beginPath(); T.arc(a.x, a.y, 1.5*s, 0, 6.2832); T.fill();
    }
  }

  /* ---------------- ant rendering ---------------- */
  function drawAnt(a){
    var s = 1.5 * a.scale;
    A.save();
    A.translate(a.x, a.y);
    A.rotate(a.heading);

    // cast shadow — chiaroscuro grounding
    A.fillStyle = 'rgba(70,40,18,0.20)';
    A.beginPath();
    A.ellipse(-0.6*s, 1.5*s, 3.2*s, 1.5*s, 0, 0, 6.2832);
    A.fill();

    // legs: six short hard strokes, phase-shifted gait
    A.strokeStyle = 'rgba(52,28,14,0.85)';
    A.lineWidth = 0.55*s;
    A.lineCap = 'round';
    for (var i=-1;i<=1;i++){
      var ph = a.leg + i*2.1;
      var sw = Math.sin(ph)*1.5*s;
      var bx = i*1.5*s;
      A.beginPath();
      A.moveTo(bx, -0.6*s); A.lineTo(bx + sw, -3.0*s);
      A.moveTo(bx,  0.6*s); A.lineTo(bx - sw,  3.0*s);
      A.stroke();
    }

    // gaster (rear), thorax, head — three filled beads, dark carmine-umber
    var deep = 'rgb(' + (58 + a.hue*22|0) + ',' + (26 + a.hue*14|0) + ',12)';
    A.fillStyle = deep;
    A.beginPath(); A.ellipse(-3.1*s, 0, 2.5*s, 1.9*s, 0, 0, 6.2832); A.fill();
    A.beginPath(); A.ellipse(-0.2*s, 0, 1.5*s, 1.2*s, 0, 0, 6.2832); A.fill();
    A.beginPath(); A.ellipse( 2.3*s, 0, 1.6*s, 1.4*s, 0, 0, 6.2832); A.fill();

    // raking highlight from upper-left, as in the painting
    A.fillStyle = 'rgba(255,226,160,0.55)';
    A.beginPath(); A.ellipse(-3.4*s, -0.8*s, 1.15*s, 0.6*s, -0.5, 0, 6.2832); A.fill();
    A.fillStyle = 'rgba(255,238,190,0.7)';
    A.beginPath(); A.ellipse( 2.1*s, -0.6*s, 0.6*s, 0.42*s, -0.4, 0, 6.2832); A.fill();

    // antennae
    A.strokeStyle = 'rgba(48,26,12,0.8)';
    A.lineWidth = 0.42*s;
    A.beginPath();
    A.moveTo(3.2*s, -0.5*s); A.lineTo(5.2*s, -2.0*s + Math.sin(a.leg*0.9)*0.5*s);
    A.moveTo(3.2*s,  0.5*s); A.lineTo(5.2*s,  2.0*s + Math.sin(a.leg*0.9+1.1)*0.5*s);
    A.stroke();

    // the burden: a bright crumb, the piece's small blaze of gold
    if (a.carrying){
      A.fillStyle = 'rgba(246,206,104,0.98)';
      A.beginPath(); A.ellipse(5.6*s, 0, 2.0*s, 1.7*s, 0, 0, 6.2832); A.fill();
      A.fillStyle = 'rgba(255,247,214,0.95)';
      A.beginPath(); A.ellipse(5.1*s, -0.6*s, 0.85*s, 0.65*s, 0, 0, 6.2832); A.fill();
      A.strokeStyle = 'rgba(120,60,20,0.5)';
      A.lineWidth = 0.4*s;
      A.beginPath(); A.ellipse(5.6*s, 0, 2.0*s, 1.7*s, 0, 0, 6.2832); A.stroke();
    }
    A.restore();
  }

  function drawFood(fd){
    if (fd.amount <= 0.01) return;
    var r = fd.r * (0.35 + 0.65*fd.amount);
    A.save();
    A.translate(fd.x, fd.y);
    A.fillStyle = 'rgba(84,48,20,0.22)';
    A.beginPath(); A.ellipse(1.5, 2.4, r*1.1, r*0.5, 0, 0, 6.2832); A.fill();
    // a heaped cache of golden grain: filled shapes, no outlines-as-filler
    A.fillStyle = 'rgba(200,140,52,0.95)';
    A.beginPath(); A.ellipse(0, 0, r, r*0.78, 0, 0, 6.2832); A.fill();
    A.fillStyle = 'rgba(238,190,96,0.95)';
    A.beginPath(); A.ellipse(-r*0.18, -r*0.22, r*0.66, r*0.5, 0, 0, 6.2832); A.fill();
    A.fillStyle = 'rgba(255,240,196,0.9)';
    A.beginPath(); A.ellipse(-r*0.3, -r*0.36, r*0.3, r*0.22, 0, 0, 6.2832); A.fill();
    A.restore();
  }

  function drawNest(){
    A.save();
    A.translate(nest.x, nest.y);
    // a low mound with a dark mouth — the deepest dark on the page, small
    A.fillStyle = 'rgba(150,104,50,0.5)';
    A.beginPath(); A.ellipse(0, 3, 26, 10, 0, 0, 6.2832); A.fill();
    A.fillStyle = 'rgba(196,146,78,0.62)';
    A.beginPath(); A.ellipse(-2, -1, 20, 8, 0, 0, 6.2832); A.fill();
    A.fillStyle = 'rgba(46,24,10,0.86)';
    A.beginPath(); A.ellipse(0, 0, 7.5, 4.4, 0, 0, 6.2832); A.fill();
    A.fillStyle = 'rgba(255,232,168,0.5)';
    A.beginPath(); A.ellipse(-8, -4.6, 7, 2.2, -0.2, 0, 6.2832); A.fill();
    A.restore();
  }

  /* ---------------- simulation ---------------- */
  function step(a){
    var t = a.target;
    if (!t){ retarget(a); t = a.target; }
    var dx = t.x - a.x, dy = t.y - a.y;
    var d = Math.hypot(dx,dy);

    // escape hatch: no progress for a while -> pick something else
    if (d > a.lastD - 0.02) a.stuck++; else a.stuck = 0;
    a.lastD = Math.min(a.lastD, d);
    if (a.stuck > 420){ a.carrying = !a.carrying && false; retarget(a); }

    var want = Math.atan2(dy,dx);
    a.wobble += a.wobRate;
    want += Math.sin(a.wobble)*0.55 + Math.sin(a.wobble*2.3)*0.22;

    var diff = Math.atan2(Math.sin(want-a.heading), Math.cos(want-a.heading));
    a.heading += diff * 0.09;

    a.x += Math.cos(a.heading)*a.speed;
    a.y += Math.sin(a.heading)*a.speed;
    a.leg += 0.34 + a.speed*0.3;

    // stay on the painted ground
    if (a.x < 8){ a.x = 8; a.heading = Math.PI - a.heading; }
    if (a.x > W-8){ a.x = W-8; a.heading = Math.PI - a.heading; }
    if (a.y < 8){ a.y = 8; a.heading = -a.heading; }
    if (a.y > H-8){ a.y = H-8; a.heading = -a.heading; }

    depositTrail(a);

    var reach = (t === nest) ? 11 : (t.r + 4);
    if (d < reach){
      if (a.carrying){
        a.carrying = false;
      } else if (t.amount > 0.01){
        t.amount -= 0.004;
        a.carrying = true;
      }
      retarget(a);
      a.speed = rr(0.34,0.62);
    }
  }

  // caches slowly replenish so the colony loops forever
  function replenish(){
    for (var i=0;i<foods.length;i++){
      var fd = foods[i];
      if (fd.amount < 1) fd.amount = Math.min(1, fd.amount + 0.00016);
      if (fd.amount <= 0.02){
        // exhausted cache relocates: composition slowly redraws itself
        fd.x = Math.max(W*0.10, Math.min(W*0.92, fd.x + rr(-80,80)));
        fd.y = Math.max(H*0.10, Math.min(H*0.72, fd.y + rr(-90,90)));
        fd.amount = 0.5;
      }
    }
  }

  /* ---------------- loop ---------------- */
  var acc = 0, last = performance.now();
  var STEP = 1000/60;

  function frame(now){
    var dt = now - last; last = now;
    if (dt > 200) dt = 200;
    acc += dt;
    var steps = 0;
    while (acc >= STEP && steps < 2){ acc -= STEP; steps++; }
    if (steps === 0){ requestAnimationFrame(frame); return; }
    acc = 0;

    for (var s=0; s<steps; s++){
      for (var i=0;i<ANTS.length;i++) step(ANTS[i]);
      replenish();
    }

    // trails weather away very slowly so the record breathes and loops
    fadeTick++;
    if (fadeTick % 26 === 0){
      T.globalCompositeOperation = 'destination-out';
      T.fillStyle = 'rgba(0,0,0,0.012)';
      T.fillRect(0,0,W,H);
      T.globalCompositeOperation = 'source-over';
    }

    A.clearRect(0,0,W,H);
    drawNest();
    for (var q=0;q<foods.length;q++) drawFood(foods[q]);
    for (var p=0;p<ANTS.length;p++) drawAnt(ANTS[p]);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------------- procedural audio: a low continuo drone ---------------- */
  if (window.self === window.top){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC){
        var ctx = new AC();
        var out = ctx.createGain(); out.gain.value = 0.0; out.connect(ctx.destination);
        var lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=0.6;
        lp.connect(out);
        var base = 55 * Math.pow(2, ((seed % 5) / 12));
        [1, 1.5, 2, 3.0].forEach(function(m, idx){
          var o = ctx.createOscillator();
          o.type = idx % 2 ? 'triangle' : 'sine';
          o.frequency.value = base * m;
          var g = ctx.createGain(); g.gain.value = 0.22 / (idx+1);
          var lfo = ctx.createOscillator(); lfo.frequency.value = 0.03 + idx*0.017;
          var lg = ctx.createGain(); lg.gain.value = 0.09 / (idx+1);
          lfo.connect(lg); lg.connect(g.gain);
          o.connect(g); g.connect(lp);
          o.start(); lfo.start();
        });
        var t0 = ctx.currentTime;
        out.gain.setValueAtTime(0, t0);
        out.gain.linearRampToValueAtTime(0.05, t0 + 14);
        var resume = function(){ if (ctx.state === 'suspended') ctx.resume(); };
        resume();
        setTimeout(resume, 1200);
      }
    }catch(e){}
  }
})();
</script>
</body>
</html>
