<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generative Artwork 2026-07-10</title>
<style>
  :root{
    --bg:#060606;
    --gold:#caa24a;
    --gold2:#f3d37d;
    --ivory:#efe7d2;
    --crimson:#9f1717;
    --red:#c92a20;
    --ink:#090909;
    --ash:#2b2318;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family: Georgia, "Times New Roman", serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  .frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7778vw,100vh);
    aspect-ratio:9/16;
    background:
      radial-gradient(1200px 1800px at 50% 45%, #0d0c0b 0%, #050505 58%, #000 100%);
    overflow:hidden;
  }

  /* Vast emptiness */
  .void{
    position:absolute; inset:0;
    background:
      radial-gradient(900px 1100px at 50% 48%, rgba(35,27,17,.18), rgba(0,0,0,0) 42%),
      radial-gradient(600px 900px at 50% 50%, rgba(202,162,74,.06), rgba(0,0,0,0) 38%),
      linear-gradient(180deg, #040404, #090909 50%, #020202);
  }
  .void:after{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 48%, rgba(255,248,235,.03) 0, rgba(255,248,235,0) 24%),
      radial-gradient(circle at 50% 48%, rgba(202,162,74,.035) 0, rgba(202,162,74,0) 34%);
    animation: breathe 28s ease-in-out infinite;
  }

  .shrine{
    position:absolute;
    left:50%;
    top:49%;
    width:29%;
    height:24%;
    transform:translate(-50%,-50%);
    filter: drop-shadow(0 18px 24px rgba(0,0,0,.45)) drop-shadow(0 0 25px rgba(202,162,74,.08));
    animation: shrineFloat 24s ease-in-out infinite;
  }

  .fade-edge{
    mask-image: radial-gradient(circle at 50% 50%, #000 0 66%, transparent 92%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0 66%, transparent 92%);
  }

  #ornament-svg, #overlay-svg, #paper-svg{
    position:absolute; inset:0; width:100%; height:100%;
    overflow:visible;
  }

  .video-wrap{
    position:absolute;
    left:50%;
    top:52%;
    width:46%;
    height:52%;
    transform:translate(-50%,-50%);
    overflow:hidden;
    border-radius:38% 38% 43% 43% / 30% 30% 52% 52%;
    clip-path:ellipse(46% 48% at 50% 51%);
    box-shadow:
      inset 0 0 0 2px rgba(243,211,125,.55),
      inset 0 0 0 10px rgba(20,12,8,.7),
      0 0 24px rgba(0,0,0,.45);
  }
  #background-video{
    position:absolute; inset:-8%;
    width:116%; height:116%;
    object-fit:cover;
    opacity:.78;
    filter:saturate(.9) contrast(1.08) brightness(.9) sepia(.18) hue-rotate(-8deg);
  }
  .videoPatina{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(255,245,220,.08), rgba(0,0,0,.05)),
      repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 2px, rgba(0,0,0,0) 2px 7px),
      radial-gradient(circle at 50% 45%, rgba(201,42,32,.12), rgba(0,0,0,0) 50%);
    mix-blend-mode:screen;
    opacity:.8;
    animation: patinaShift 22s ease-in-out infinite;
  }

  #portrait-image{
    position:absolute;
    left:49%;
    top:59%;
    width:38%;
    transform:translate(-50%,-50%);
    z-index:8;
    filter:
      saturate(.82)
      contrast(1.02)
      brightness(.97)
      sepia(.16)
      drop-shadow(0 12px 12px rgba(0,0,0,.38))
      drop-shadow(0 0 14px rgba(243,211,125,.14));
    animation: portraitDrift 26s ease-in-out infinite;
    transform-origin:50% 70%;
    pointer-events:none;
  }

  .portrait-rim{
    position:absolute;
    left:49%;
    top:59%;
    width:39%;
    height:44%;
    transform:translate(-50%,-50%);
    z-index:7;
    background:
      radial-gradient(circle at 50% 34%, rgba(243,211,125,.18), rgba(243,211,125,0) 42%),
      radial-gradient(circle at 50% 60%, rgba(201,42,32,.09), rgba(201,42,32,0) 46%);
    filter:blur(12px);
    opacity:.8;
    animation: portraitDrift 26s ease-in-out infinite;
    pointer-events:none;
  }

  .date{
    position:absolute;
    right:18px;
    bottom:14px;
    color:rgba(239,231,210,.42);
    font-size:14px;
    letter-spacing:.08em;
    z-index:30;
  }

  #guinea-pig{
    position:absolute;
    width:17px;
    right:522px;
    top:953px;
    opacity:.58;
    filter:sepia(.5) saturate(.55) brightness(.88);
    z-index:16;
    transform:rotate(-8deg);
  }

  .grain, .vignette{
    position:absolute; inset:0; pointer-events:none;
  }
  .grain{
    opacity:.14;
    mix-blend-mode:soft-light;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.18) 0 0.7px, transparent 1px),
      radial-gradient(circle at 80% 40%, rgba(255,255,255,.11) 0 0.8px, transparent 1.1px),
      radial-gradient(circle at 60% 70%, rgba(255,255,255,.08) 0 0.8px, transparent 1px),
      radial-gradient(circle at 30% 85%, rgba(255,255,255,.1) 0 0.7px, transparent 1px);
    background-size: 7px 7px, 11px 11px, 13px 13px, 17px 17px;
    animation: grainMove 8s steps(8) infinite;
  }
  .vignette{
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 0 55%, rgba(0,0,0,.35) 84%, rgba(0,0,0,.62) 100%);
  }

  @keyframes shrineFloat{
    0%,100%{transform:translate(-50%,-50%) scale(1) rotate(0deg)}
    50%{transform:translate(-50%,-50%) scale(1.018) rotate(.25deg)}
  }
  @keyframes portraitDrift{
    0%,100%{transform:translate(-50%,-50%) rotate(-1.2deg)}
    50%{transform:translate(-50%,-49.4%) rotate(.8deg)}
  }
  @keyframes breathe{
    0%,100%{transform:scale(1); opacity:.95}
    50%{transform:scale(1.04); opacity:1}
  }
  @keyframes patinaShift{
    0%,100%{transform:translateY(0%) scale(1)}
    50%{transform:translateY(-2%) scale(1.02)}
  }
  @keyframes grainMove{
    0%{transform:translate(0,0)}
    25%{transform:translate(-1px,1px)}
    50%{transform:translate(1px,-1px)}
    75%{transform:translate(1px,1px)}
    100%{transform:translate(0,0)}
  }
</style>
</head>
<body>
<div class="frame">
  <div class="void"></div>

  <div class="shrine fade-edge" id="shrine">
    <svg id="ornament-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f3d37d"/>
          <stop offset="40%" stop-color="#caa24a"/>
          <stop offset="70%" stop-color="#8d6421"/>
          <stop offset="100%" stop-color="#f6dfa4"/>
        </linearGradient>
        <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#cf3428"/>
          <stop offset="100%" stop-color="#7f120f"/>
        </linearGradient>
        <filter id="softGlow">
          <feGaussianBlur stdDeviation="7" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
        </filter>
        <clipPath id="innerMask">
          <ellipse cx="500" cy="520" rx="230" ry="260"/>
        </clipPath>
      </defs>

      <!-- outer Beaux-Arts frame -->
      <g opacity="0.98">
        <ellipse cx="500" cy="500" rx="420" ry="446" fill="#120d09" stroke="url(#goldGrad)" stroke-width="18"/>
        <ellipse cx="500" cy="500" rx="384" ry="410" fill="#17120d" stroke="#8e6a2b" stroke-width="4"/>
        <ellipse cx="500" cy="500" rx="350" ry="372" fill="#0d0a08" stroke="#f0d593" stroke-width="2.5" opacity=".9"/>
      </g>

      <!-- baroque rays -->
      <g opacity=".88" filter="url(#softGlow)">
        <g id="raysA"></g>
      </g>

      <!-- Haida/Tlingit formline body -->
      <g>
        <ellipse cx="500" cy="518" rx="252" ry="286" fill="#111"/>
        <ellipse cx="500" cy="518" rx="238" ry="272" fill="#c8b07c"/>
        <ellipse cx="500" cy="518" rx="228" ry="262" fill="#0d0b0a"/>
        <g id="formline"></g>
      </g>

      <!-- tiny bee glyph -->
      <g transform="translate(500 165)" opacity=".92">
        <ellipse cx="0" cy="0" rx="44" ry="26" fill="#111" stroke="#f2d27c" stroke-width="4"/>
        <ellipse cx="-26" cy="-22" rx="20" ry="14" fill="#efe7d2" opacity=".8"/>
        <ellipse cx="26" cy="-22" rx="20" ry="14" fill="#efe7d2" opacity=".8"/>
        <rect x="-24" y="-20" width="12" height="40" fill="#c92a20"/>
        <rect x="-6" y="-24" width="12" height="48" fill="#efe7d2"/>
        <rect x="12" y="-20" width="12" height="40" fill="#c92a20"/>
      </g>
    </svg>

    <div class="video-wrap" aria-hidden="true">
      <video id="background-video" src="background.mp4" autoplay loop muted playsinline></video>
      <div class="videoPatina"></div>
    </div>

    <div class="portrait-rim"></div>
    <img id="portrait-image" src="portrait.png" alt="" />

    <svg id="paper-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <filter id="tapeShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".25"/>
        </filter>
      </defs>

      <!-- collage papers behind portrait -->
      <g opacity=".94" filter="url(#paperShadow)">
        <path d="M292 615 L385 572 L467 628 L389 703 L301 680 Z" fill="#d4c49c"/>
        <path d="M540 562 L664 528 L706 607 L601 669 L515 626 Z" fill="#8d1414"/>
        <path d="M355 730 L521 705 L548 791 L390 824 Z" fill="#e5dcc6"/>
      </g>

      <!-- tape strips -->
      <g opacity=".58" filter="url(#tapeShadow)">
        <rect x="322" y="574" width="92" height="34" rx="6" fill="#ddd1ab" transform="rotate(-21 368 591)"/>
        <rect x="587" y="546" width="94" height="30" rx="6" fill="#ddd1ab" transform="rotate(19 634 561)"/>
      </g>

      <!-- in-front collage crossing portrait but not cropping whole person -->
      <g opacity=".9" filter="url(#paperShadow)">
        <path d="M300 770 L438 744 L472 787 L340 814 Z" fill="#111"/>
        <path d="M560 748 L674 731 L705 773 L592 793 Z" fill="#c92a20"/>
      </g>
    </svg>

    <svg id="overlay-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <g id="movingOverlays"></g>
    </svg>
  </div>

  <canvas id="canvas"></canvas>
  <img id="guinea-pig" src="guineapig.png" alt="" />
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="date">2026-07-10</div>
</div>

<script>
(() => {
  const seedStr = "2026-07-10";
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = (seed * 131 + seedStr.charCodeAt(i)) >>> 0;
  function rnd() {
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >> 17; seed >>>= 0;
    seed ^= seed << 5;  seed >>>= 0;
    return (seed >>> 0) / 4294967296;
  }

  const raysA = document.getElementById('raysA');
  const formline = document.getElementById('formline');
  const movingOverlays = document.getElementById('movingOverlays');

  // Rays
  for(let i=0;i<18;i++){
    const a = (Math.PI*2/18)*i;
    const spread = 0.085;
    const r1 = 328, r2 = 450;
    const p1x = 500 + Math.cos(a-spread)*r1, p1y = 500 + Math.sin(a-spread)*r1;
    const p2x = 500 + Math.cos(a+spread)*r1, p2y = 500 + Math.sin(a+spread)*r1;
    const p3x = 500 + Math.cos(a)*r2, p3y = 500 + Math.sin(a)*r2;
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d", `M ${p1x} ${p1y} L ${p3x} ${p3y} L ${p2x} ${p2y} Z`);
    path.setAttribute("fill", i%2===0 ? "rgba(201,42,32,0.28)" : "rgba(243,211,125,0.22)");
    path.setAttribute("transform-origin","500px 500px");
    path.style.animation = `raySpin ${38 + i*1.4}s ease-in-out infinite`;
    raysA.appendChild(path);
  }

  // Haida/Tlingit inspired symmetrical ovoids and U-forms
  function add(el){ formline.appendChild(el); }
  const pieces = [
    ['ellipse', {cx:500, cy:375, rx:118, ry:94, fill:'#c92a20', stroke:'#111', sw:24}],
    ['ellipse', {cx:500, cy:375, rx:58, ry:46, fill:'#efe7d2', stroke:'#111', sw:18}],
    ['ellipse', {cx:372, cy:470, rx:78, ry:110, fill:'#c92a20', stroke:'#111', sw:22}],
    ['ellipse', {cx:628, cy:470, rx:78, ry:110, fill:'#c92a20', stroke:'#111', sw:22}],
    ['ellipse', {cx:372, cy:470, rx:34, ry:48, fill:'#efe7d2', stroke:'#111', sw:14}],
    ['ellipse', {cx:628, cy:470, rx:34, ry:48, fill:'#efe7d2', stroke:'#111', sw:14}],
    ['ellipse', {cx:500, cy:580, rx:150, ry:72, fill:'#c92a20', stroke:'#111', sw:24}],
    ['ellipse', {cx:500, cy:580, rx:72, ry:30, fill:'#efe7d2', stroke:'#111', sw:14}],
  ];
  pieces.forEach(p=>{
    const e = document.createElementNS("http://www.w3.org/2000/svg", p[0]);
    Object.entries(p[1]).forEach(([k,v])=>{
      if(k==='sw') e.setAttribute('stroke-width',v); else e.setAttribute(k,v);
    });
    e.setAttribute('stroke','#111');
    add(e);
  });

  // Bold U-forms / split forms
  const paths = [
    "M300 346 Q372 314 430 346 L430 406 Q372 384 300 406 Z",
    "M700 346 Q628 314 570 346 L570 406 Q628 384 700 406 Z",
    "M302 532 Q376 598 446 554 L446 626 Q374 664 302 626 Z",
    "M698 532 Q624 598 554 554 L554 626 Q626 664 698 626 Z",
    "M432 664 L568 664 L610 726 L500 796 L390 726 Z"
  ];
  paths.forEach((d,idx)=>{
    const p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d", d);
    p.setAttribute("fill", idx===4 ? "#efe7d2" : "#111");
    p.setAttribute("stroke", idx===4 ? "#c92a20" : "#efe7d2");
    p.setAttribute("stroke-width", idx===4 ? "12" : "6");
    p.style.opacity = idx===4 ? ".92" : ".78";
    add(p);
  });

  // Moving overlays crossing figure and video
  for(let i=0;i<6;i++){
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    const side = i<3 ? -1 : 1;
    const baseX = side<0 ? 285 : 715;
    const y = 310 + (i%3)*140;
    const p = document.createElementNS("http://www.w3.org/2000/svg","path");
    const dir = side<0 ? 1 : -1;
    const d = `
      M ${baseX} ${y}
      L ${baseX + dir*90} ${y-34}
      L ${baseX + dir*184} ${y+14}
      L ${baseX + dir*130} ${y+68}
      L ${baseX + dir*36} ${y+42} Z`;
    p.setAttribute("d", d);
    p.setAttribute("fill", i%2 ? "rgba(239,231,210,.82)" : "rgba(201,42,32,.82)");
    p.setAttribute("stroke", "rgba(17,17,17,.85)");
    p.setAttribute("stroke-width", "5");
    g.appendChild(p);
    g.style.animation = `overlaySway ${19 + i*2.7}s ease-in-out infinite`;
    g.style.transformOrigin = "500px 500px";
    movingOverlays.appendChild(g);
  }

  // SVG keyframes
  const style = document.createElement('style');
  style.textContent = `
    @keyframes raySpin{
      0%,100%{transform:rotate(0deg) scale(1)}
      50%{transform:rotate(7deg) scale(1.02)}
    }
    @keyframes overlaySway{
      0%,100%{transform:translateY(0px) rotate(0deg)}
      50%{transform:translateY(-7px) rotate(1.3deg)}
    }
  `;
  document.head.appendChild(style);

  // Canvas for drifting dust motes / subtle gold leaf flecks near object only
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const frame = document.querySelector('.frame');

  function resize(){
    canvas.width = frame.clientWidth;
    canvas.height = frame.clientHeight;
    canvas.style.position = 'absolute';
    canvas.style.inset = '0';
  }
  resize();
  window.addEventListener('resize', resize);

  const flecks = Array.from({length:56}, (_,i)=>({
    a:rnd()*Math.PI*2,
    r:40 + rnd()*160,
    s:1 + rnd()*3,
    o:.08 + rnd()*.18,
    t:rnd()*Math.PI*2,
    c:i%3===0 ? '242,214,135' : (i%3===1 ? '201,42,32' : '239,231,210')
  }));

  function draw(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const cx = canvas.width*0.5;
    const cy = canvas.height*0.49;
    const scale = Math.min(canvas.width/1080, canvas.height/1920);
    for(const f of flecks){
      const rr = f.r * scale * (1 + 0.04*Math.sin(t*0.0004 + f.t));
      const x = cx + Math.cos(f.a + t*0.00008*(0.2 + f.s)) * rr;
      const y = cy + Math.sin(f.a*1.15 + t*0.00011*(0.2 + f.s)) * rr*0.84;
      const rad = f.s * scale * 1.9;
      const g = ctx.createRadialGradient(x,y,0,x,y,rad*4);
      g.addColorStop(0, `rgba(${f.c},${f.o})`);
      g.addColorStop(1, `rgba(${f.c},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x,y,rad*4,0,Math.PI*2);
      ctx.fill();
    }

    // central soft cast shadow below tiny object
    const shadow = ctx.createRadialGradient(cx, canvas.height*0.61, 0, cx, canvas.height*0.61, 180*scale);
    shadow.addColorStop(0, 'rgba(0,0,0,0.32)');
    shadow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = shadow;
    ctx.beginPath();
    ctx.ellipse(cx, canvas.height*0.61, 175*scale, 58*scale, 0, 0, Math.PI*2);
    ctx.fill();

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // gentle audio only if top-level
  if (window.self === window.top) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      const ac = new AudioCtx();
      const master = ac.createGain();
      master.gain.value = 0.012;
      master.connect(ac.destination);

      const low = ac.createOscillator();
      low.type = 'triangle';
      low.frequency.value = 108;

      const high = ac.createOscillator();
      high.type = 'sine';
      high.frequency.value = 216.2;

      const lfo = ac.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.047;

      const lfoGain = ac.createGain();
      lfoGain.gain.value = 10;

      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 650;
      lp.Q.value = 0.4;

      const drift = ac.createGain();
      drift.gain.value = 0.4;

      lfo.connect(lfoGain).connect(low.frequency);
      low.connect(drift).connect(lp).connect(master);
      high.connect(lp);

      const now = ac.currentTime;
      drift.gain.setValueAtTime(0.22, now);
      drift.gain.linearRampToValueAtTime(0.28, now + 12);
      drift.gain.linearRampToValueAtTime(0.22, now + 24);

      low.start();
      high.start();
      lfo.start();
    }
  }
})();
</script>
</body>
</html>
