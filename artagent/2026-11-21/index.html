<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta charset="utf-8">
<title>2026-11-21</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fbe9c9}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:top left;background:#fde6b0}
#field{position:absolute;left:0;top:0;width:100%;height:100%}
.veil{position:absolute;border-radius:50%;will-change:transform,opacity}
/* behind the image */
#glow{left:20px;top:250px;width:860px;height:1100px;
  background:radial-gradient(ellipse at center,rgba(255,250,232,.85) 0%,rgba(255,244,214,.45) 40%,rgba(255,240,205,0) 70%);
  animation:breathe 48s ease-in-out infinite}
#back1{left:-60px;top:900px;width:1060px;height:760px;
  background:radial-gradient(ellipse at center,rgba(255,112,84,.55) 0%,rgba(255,130,110,.25) 45%,rgba(255,140,120,0) 70%);
  animation:driftA 120s ease-in-out infinite}
#back2{left:200px;top:60px;width:900px;height:640px;
  background:radial-gradient(ellipse at center,rgba(255,214,48,.6) 0%,rgba(255,220,80,.25) 45%,rgba(255,224,96,0) 70%);
  animation:driftB 150s ease-in-out infinite}
#art-image{position:absolute;left:130px;top:400px;width:590px;height:840px;object-fit:cover;opacity:.96;
  filter:saturate(1.12) brightness(1.06) contrast(.96);
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 13%,#000 87%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 11%,#000 89%,transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent 0,#000 13%,#000 87%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 11%,#000 89%,transparent 100%);
  mask-composite:intersect}
/* in front of the image, crossing its edges */
#front1{left:40px;top:1010px;width:1040px;height:560px;
  background:radial-gradient(ellipse at center,rgba(64,214,196,.62) 0%,rgba(96,222,206,.3) 42%,rgba(120,228,214,0) 70%);
  animation:driftC 96s ease-in-out infinite}
#front2{left:440px;top:210px;width:700px;height:600px;
  background:radial-gradient(ellipse at center,rgba(255,96,140,.5) 0%,rgba(255,120,156,.24) 44%,rgba(255,140,170,0) 70%);
  animation:driftD 132s ease-in-out infinite}
#front3{left:-220px;top:520px;width:560px;height:700px;
  background:radial-gradient(ellipse at center,rgba(255,226,70,.5) 0%,rgba(255,230,100,.22) 45%,rgba(255,232,120,0) 70%);
  animation:driftE 110s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes driftA{0%,100%{transform:translate(0,0);opacity:.75}50%{transform:translate(70px,-150px);opacity:1}}
@keyframes driftB{0%,100%{transform:translate(0,0);opacity:1}50%{transform:translate(-120px,130px);opacity:.6}}
@keyframes driftC{0%,100%{transform:translate(0,60px) scale(1);opacity:.55}50%{transform:translate(-50px,-150px) scale(1.08);opacity:1}}
@keyframes driftD{0%,100%{transform:translate(0,0);opacity:.9}50%{transform:translate(-150px,110px);opacity:.5}}
@keyframes driftE{0%,100%{transform:translate(0,0);opacity:.5}50%{transform:translate(140px,90px);opacity:.95}}
#date{position:absolute;right:44px;bottom:40px;font:300 20px/1 Helvetica,Arial,sans-serif;letter-spacing:.22em;color:#7a2a3c;opacity:.45}
#guinea-pig{position:absolute;left:118px;top:1228px;width:15px;height:auto;opacity:.5}
</style>
</head>
<body>
<div id="stage">
  <canvas id="field" width="108" height="192"></canvas>
  <div class="veil" id="back2"></div>
  <div class="veil" id="back1"></div>
  <div class="veil" id="glow"></div>
  <img id="art-image" src="art.png" alt="">
  <img id="guinea-pig" src="guineapig.png" alt="">
  <div class="veil" id="front3"></div>
  <div class="veil" id="front2"></div>
  <div class="veil" id="front1"></div>
  <div id="date">2026-11-21</div>
</div>
<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){
    var w=window.innerWidth,h=window.innerHeight,s=Math.min(w/1080,h/1920);
    stage.style.transform='scale('+s+')';
    stage.style.left=((w-1080*s)/2)+'px';
    stage.style.top=((h-1920*s)/2)+'px';
  }
  window.addEventListener('resize',fit);fit();

  // date-seeded PRNG
  var seed=20261121;
  function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
  // four high-key hues: chrome yellow, warm rose, vermilion, pale turquoise
  var base=[48,342,10,172], bands=[];
  for(var i=0;i<4;i++){
    bands.push({h:base[i]+(rnd()-.5)*10,amp:14+rnd()*14,per:70+rnd()*80,ph:rnd()*6.283,
                l:[80,78,74,80][i],pp:90+rnd()*60,pph:rnd()*6.283});
  }
  var blooms=[];
  for(i=0;i<2;i++)blooms.push({px:60+rnd()*50,py:80+rnd()*60,ph:rnd()*6.283,h:i?186:28});

  var c=document.getElementById('field'),x=c.getContext('2d'),W=108,H=192;
  function col(h,s,l,a){return 'hsla('+(((h%360)+360)%360).toFixed(1)+','+s+'%,'+l.toFixed(1)+'%,'+a+')'}
  function frame(ms){
    var t=ms/1000;
    var g=x.createLinearGradient(0,0,W*0.18*Math.sin(t/97),H);
    var pos=[0,.34,.66,1];
    for(var i=0;i<4;i++){
      var b=bands[i];
      var h=b.h+b.amp*Math.sin(t*6.283/b.per+b.ph);
      var l=b.l+4*Math.sin(t*6.283/(b.per*1.7)+b.ph*2);
      var p=pos[i];
      if(i==1||i==2)p+=.09*Math.sin(t*6.283/b.pp+b.pph);
      g.addColorStop(p,col(h,96,l,1));
    }
    x.fillStyle=g;x.fillRect(0,0,W,H);
    for(i=0;i<2;i++){
      var m=blooms[i];
      var cx=W*(.5+.38*Math.sin(t*6.283/m.px+m.ph));
      var cy=H*(.5+.4*Math.cos(t*6.283/m.py+m.ph*1.3));
      var r=x.createRadialGradient(cx,cy,0,cx,cy,H*.6);
      var hh=m.h+20*Math.sin(t/53+m.ph);
      r.addColorStop(0,col(hh,100,82,.5));
      r.addColorStop(1,col(hh,100,82,0));
      x.fillStyle=r;x.fillRect(0,0,W,H);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
