<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Generative Art 2026-04-24</title>
<style>
  :root{
    --bg1:#d6b07a;
    --bg2:#a56539;
    --bg3:#6a3b22;
    --earth:#8f4d2e;
    --clay:#b96b3d;
    --sand:#e3c38f;
    --char:#2b1d15;
    --bone:#f3e4c1;
    --turq:#3ba9a3;
    --turq2:#6fd0c7;
    --ox:#6c2417;
    --gold:#c89d56;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(circle at 50% 20%, #f0d7aa 0%, #ddb782 25%, #b56e42 58%, #7a4327 80%, #4b2b1b 100%);
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      linear-gradient(180deg, rgba(248,228,186,0.92), rgba(214,158,96,0.96) 24%, rgba(164,95,53,1) 60%, rgba(86,48,29,1) 100%);
    box-shadow:0 0 0 1px rgba(40,20,10,.25), 0 30px 80px rgba(0,0,0,.35);
  }

  /* woven textile ground */
  #textile{
    position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(255,240,208,.08) 0 1px, transparent 1px 20px),
      linear-gradient(0deg, rgba(60,32,18,.10) 0 1px, transparent 1px 18px),
      repeating-linear-gradient(90deg,
        rgba(98,52,29,.18) 0 4px,
        rgba(205,155,101,.12) 4px 8px,
        rgba(120,65,38,.14) 8px 12px,
        rgba(235,210,163,.08) 12px 16px),
      linear-gradient(180deg, rgba(255,246,225,.14), rgba(0,0,0,.08));
    opacity:.82;
    mix-blend-mode:multiply;
    animation: loom 26s ease-in-out infinite alternate;
  }
  @keyframes loom{
    from{transform:scale(1) translateY(0)}
    to{transform:scale(1.03) translateY(-1.2%)}
  }

  #haloFade{
    position:absolute; inset:-8%;
    pointer-events:none;
    background:
      radial-gradient(circle at 50% 50%, transparent 0 64%, rgba(74,40,22,.18) 74%, rgba(51,29,17,.34) 92%, rgba(35,18,11,.45) 100%);
    opacity:.9;
  }

  #illusionCanvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
  }

  /* central optical construct */
  .illusion-wrap{
    position:absolute;
    inset:11% 9% 18% 9%;
    display:grid;
    place-items:center;
    filter: drop-shadow(0 18px 28px rgba(39,20,12,.25));
    mask-image: radial-gradient(circle at 50% 48%, black 0 68%, transparent 92%);
    -webkit-mask-image: radial-gradient(circle at 50% 48%, black 0 68%, transparent 92%);
  }

  #art-image{
    position:absolute;
    width:46%;
    left:27%;
    top:31%;
    z-index:6;
    opacity:.96;
    object-fit:cover;
    clip-path:polygon(50% 0%, 88% 18%, 100% 50%, 82% 86%, 50% 100%, 14% 82%, 0% 50%, 18% 14%);
    border:8px solid rgba(243,228,193,.85);
    outline:2px solid rgba(59,169,163,.55);
    box-shadow:
      0 0 0 14px rgba(109,52,26,.25),
      0 24px 50px rgba(43,29,21,.28);
    transform:translateZ(0);
    filter:saturate(1.02) contrast(1.08) sepia(.16) hue-rotate(-8deg);
    animation: artBreath 19s ease-in-out infinite;
  }
  @keyframes artBreath{
    0%,100%{transform:scale(1) rotate(-1deg)}
    50%{transform:scale(1.03) rotate(1deg)}
  }

  #portrait-image{
    position:absolute;
    left:22%;
    top:20%;
    width:56%;
    height:44%;
    object-fit:cover;
    z-index:5;
    opacity:.82;
    filter: sepia(.42) saturate(.9) contrast(1.12) hue-rotate(-12deg);
    mix-blend-mode:multiply;
    clip-path:polygon(50% 0%, 78% 6%, 92% 24%, 96% 50%, 90% 79%, 74% 94%, 50% 100%, 24% 94%, 10% 80%, 4% 50%, 10% 22%, 24% 7%);
    mask-image:radial-gradient(circle at 50% 45%, black 0 60%, rgba(0,0,0,.7) 74%, transparent 100%);
    -webkit-mask-image:radial-gradient(circle at 50% 45%, black 0 60%, rgba(0,0,0,.7) 74%, transparent 100%);
    animation: portraitShift 23s ease-in-out infinite;
  }
  @keyframes portraitShift{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(1.2%) scale(1.025)}
  }

  .diamond-lattice{
    position:absolute; inset:17% 12% 24% 12%;
    z-index:7;
    opacity:.9;
    mask-image:radial-gradient(circle at 50% 48%, black 0 70%, transparent 95%);
    -webkit-mask-image:radial-gradient(circle at 50% 48%, black 0 70%, transparent 95%);
  }
  .diamond-lattice svg{width:100%;height:100%;display:block}

  /* impossible stair / Penrose-inspired bands */
  .triband{
    position:absolute;
    width:54%;
    height:54%;
    left:23%;
    top:21%;
    z-index:8;
    transform-origin:50% 50%;
    animation: rotateSlow 36s ease-in-out infinite alternate;
    mask-image:radial-gradient(circle at 50% 50%, black 0 72%, transparent 95%);
    -webkit-mask-image:radial-gradient(circle at 50% 50%, black 0 72%, transparent 95%);
  }
  @keyframes rotateSlow{
    from{transform:rotate(-8deg) scale(1)}
    to{transform:rotate(8deg) scale(1.02)}
  }
  .face{
    position:absolute;
    clip-path:polygon(0 0,100% 0,76% 100%,0 100%);
    box-shadow: inset 0 0 0 2px rgba(43,29,21,.16);
  }
  .f1{
    left:22%; top:4%; width:58%; height:21%;
    background:
      repeating-linear-gradient(90deg, rgba(243,228,193,.45) 0 8px, rgba(182,111,66,.24) 8px 16px),
      linear-gradient(180deg, var(--bone), #d6ab73);
    transform:skewX(-30deg);
  }
  .f2{
    right:3%; top:28%; width:21%; height:51%;
    background:
      repeating-linear-gradient(0deg, rgba(243,228,193,.4) 0 7px, rgba(128,75,45,.22) 7px 14px),
      linear-gradient(180deg, #b4673d, #7d4328);
    clip-path:polygon(0 0,100% 24%,100% 100%,0 76%);
  }
  .f3{
    left:1%; bottom:11%; width:57%; height:22%;
    background:
      repeating-linear-gradient(90deg, rgba(66,163,157,.33) 0 10px, rgba(227,195,143,.18) 10px 20px),
      linear-gradient(180deg, #7ec8be, var(--turq));
    transform:skewX(-30deg);
  }
  .f4{
    left:4%; top:27%; width:21%; height:50%;
    background:
      repeating-linear-gradient(0deg, rgba(243,228,193,.24) 0 7px, rgba(91,47,28,.18) 7px 14px),
      linear-gradient(180deg, #8f4d2e, #5a301f);
    clip-path:polygon(0 24%,100% 0,100% 76%,0 100%);
  }
  .f5{
    left:22%; bottom:2%; width:58%; height:21%;
    background:
      repeating-linear-gradient(90deg, rgba(90,47,28,.15) 0 9px, rgba(243,228,193,.22) 9px 18px),
      linear-gradient(180deg, #d49f67, #a35a35);
    transform:skewX(-30deg);
  }
  .f6{
    right:1%; top:28%; width:21%; height:50%;
    background:
      repeating-linear-gradient(0deg, rgba(59,169,163,.22) 0 8px, rgba(255,235,200,.12) 8px 16px),
      linear-gradient(180deg, #6bc1b9, #2f8b84);
    clip-path:polygon(0 0,100% 24%,100% 100%,0 76%);
    mix-blend-mode:multiply;
    opacity:.7;
  }

  .stepMarks{
    position:absolute; inset:0;
  }
  .stepMarks::before,.stepMarks::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(90deg, rgba(43,29,21,.18) 0 2px, transparent 2px 42px);
    opacity:.38;
    mask-image:radial-gradient(circle at 50% 50%, black 0 70%, transparent 95%);
    -webkit-mask-image:radial-gradient(circle at 50% 50%, black 0 70%, transparent 95%);
  }
  .stepMarks::after{
    transform:rotate(120deg);
    opacity:.2;
  }

  /* side motifs */
  .side{
    position:absolute;
    top:15%;
    bottom:16%;
    width:16%;
    z-index:4;
    opacity:.95;
  }
  .side.left{left:2.6%}
  .side.right{right:2.6%; transform:scaleX(-1)}
  .pillar{
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(180deg,
      rgba(243,228,193,.58) 0 20px,
      rgba(110,59,34,.08) 20px 40px),
      linear-gradient(90deg, rgba(92,49,29,.9), rgba(227,195,143,.96) 18%, rgba(169,97,58,.95) 52%, rgba(83,42,24,.92) 100%);
    clip-path:polygon(50% 0%, 82% 8%, 82% 27%, 100% 27%, 100% 73%, 82% 73%, 82% 92%, 50% 100%, 18% 92%, 18% 73%, 0% 73%, 0% 27%, 18% 27%, 18% 8%);
    box-shadow: inset 0 0 0 2px rgba(43,29,21,.18);
    animation: pillarPulse 18s ease-in-out infinite alternate;
  }
  @keyframes pillarPulse{
    from{transform:translateY(0)}
    to{transform:translateY(1.2%)}
  }
  .glyph{
    position:absolute;
    left:14%; right:14%;
    height:12%;
    background:linear-gradient(180deg,var(--char),var(--ox));
    clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    opacity:.84;
  }
  .g1{top:8%}
  .g2{top:28%; background:linear-gradient(180deg,var(--turq),#246966)}
  .g3{top:48%}
  .g4{top:68%; background:linear-gradient(180deg,var(--turq2),#267a73)}

  /* top and bottom ceremonial bands */
  .band{
    position:absolute;
    left:0; right:0;
    height:13%;
    z-index:9;
    opacity:.95;
  }
  .band.top{top:0}
  .band.bottom{bottom:0; transform:scaleY(-1)}
  .band::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(243,228,193,.18), rgba(43,29,21,.1)),
      repeating-linear-gradient(90deg,
        var(--char) 0 4%,
        var(--sand) 4% 8%,
        var(--clay) 8% 12%,
        var(--turq) 12% 16%,
        var(--bone) 16% 20%,
        var(--earth) 20% 24%);
    clip-path:polygon(
      0 0,100% 0,100% 34%,
      94% 34%,90% 58%,86% 34%,80% 34%,76% 58%,72% 34%,66% 34%,62% 58%,58% 34%,
      52% 34%,48% 58%,44% 34%,38% 34%,34% 58%,30% 34%,24% 34%,20% 58%,16% 34%,10% 34%,6% 58%,0 34%);
    box-shadow: inset 0 -2px 0 rgba(43,29,21,.22);
  }

  /* foreground soft edge geometry */
  .feather{
    position:absolute;
    border-radius:50%;
    filter:blur(18px);
    opacity:.24;
    pointer-events:none;
  }
  .feather.a{
    width:52%; height:18%;
    left:-6%; top:8%;
    background:radial-gradient(circle at 60% 50%, rgba(243,228,193,.85), rgba(243,228,193,0));
  }
  .feather.b{
    width:46%; height:20%;
    right:-8%; bottom:8%;
    background:radial-gradient(circle at 40% 40%, rgba(59,169,163,.6), rgba(59,169,163,0));
  }

  #date{
    position:absolute;
    right:18px;
    bottom:14px;
    z-index:20;
    color:rgba(243,228,193,.66);
    font-size:14px;
    letter-spacing:.08em;
    text-shadow:0 1px 0 rgba(0,0,0,.18);
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:18px;
    bottom:124px;
    z-index:10;
    opacity:.58;
    filter:saturate(.9) contrast(1.02);
    transform:rotate(-8deg);
  }
</style>
</head>
<body>
<div id="frame">
  <div id="textile"></div>
  <canvas id="illusionCanvas" width="1080" height="1920"></canvas>

  <div class="band top"></div>
  <div class="band bottom"></div>

  <div class="side left">
    <div class="pillar"></div>
    <div class="glyph g1"></div>
    <div class="glyph g2"></div>
    <div class="glyph g3"></div>
    <div class="glyph g4"></div>
  </div>
  <div class="side right">
    <div class="pillar"></div>
    <div class="glyph g1"></div>
    <div class="glyph g2"></div>
    <div class="glyph g3"></div>
    <div class="glyph g4"></div>
  </div>

  <img id="portrait-image" src="portrait.png" alt="" />
  <img id="art-image" src="art.png" alt="" />

  <div class="illusion-wrap">
    <div class="triband">
      <div class="face f1"></div>
      <div class="face f2"></div>
      <div class="face f3"></div>
      <div class="face f4"></div>
      <div class="face f5"></div>
      <div class="face f6"></div>
      <div class="stepMarks"></div>
    </div>
  </div>

  <div class="diamond-lattice">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="p" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="10" height="10" fill="none"></rect>
          <rect x="0" y="0" width="4" height="4" fill="rgba(43,29,21,.18)"></rect>
          <rect x="6" y="6" width="4" height="4" fill="rgba(59,169,163,.18)"></rect>
        </pattern>
      </defs>
      <g opacity="0.75">
        <polygon points="50,2 74,18 86,50 74,82 50,98 26,82 14,50 26,18" fill="none" stroke="rgba(43,29,21,.38)" stroke-width="1.5"/>
        <polygon points="50,10 68,22 78,50 68,78 50,90 32,78 22,50 32,22" fill="url(#p)" opacity="0.52"/>
        <polygon points="50,18 62,28 70,50 62,72 50,82 38,72 30,50 38,28" fill="none" stroke="rgba(243,228,193,.38)" stroke-width="1"/>
        <polygon points="50,28 57,34 62,50 57,66 50,72 43,66 38,50 43,34" fill="none" stroke="rgba(59,169,163,.52)" stroke-width="1.2"/>
      </g>
    </svg>
  </div>

  <div class="feather a"></div>
  <div class="feather b"></div>
  <div id="haloFade"></div>

  <img id="guinea-pig" src="guineapig.png" alt="" />
  <div id="date">2026-04-24</div>
</div>

<script>
(() => {
  const seedString = "2026-04-24";
  let seed = 0;
  for (let i = 0; i < seedString.length; i++) seed = (seed * 131 + seedString.charCodeAt(i)) >>> 0;
  function rand() {
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >> 17; seed >>>= 0;
    seed ^= seed << 5; seed >>>= 0;
    return (seed >>> 0) / 4294967296;
  }

  const canvas = document.getElementById('illusionCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const palette = {
    char:"#2b1d15", bone:"#f3e4c1", sand:"#e3c38f", clay:"#b96b3d",
    earth:"#8f4d2e", turq:"#3ba9a3", turq2:"#6fd0c7", ox:"#6c2417", gold:"#c89d56"
  };

  const shards = [];
  for(let i=0;i<28;i++){
    const side = i % 2 === 0 ? -1 : 1;
    shards.push({
      x: W/2 + side*(240 + rand()*340),
      y: 260 + rand()*1320,
      s: 38 + rand()*110,
      r: rand()*Math.PI,
      drift: (rand()-.5)*0.0007,
      type: Math.floor(rand()*3),
      color: [palette.sand,palette.clay,palette.turq,palette.earth,palette.bone][Math.floor(rand()*5)],
      a: 0.15 + rand()*0.18
    });
  }

  const discs = [];
  for(let i=0;i<9;i++){
    discs.push({
      r: 130 + i*38,
      phase: rand()*Math.PI*2,
      speed: 0.00035 + i*0.00004
    });
  }

  function drawDiamond(x,y,w,h,fill,alpha=1){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x, y-h/2);
    ctx.lineTo(x+w/2, y);
    ctx.lineTo(x, y+h/2);
    ctx.lineTo(x-w/2, y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawStepMotif(x,y,w,h,c1,c2){
    const sw = w/5;
    for(let i=0;i<5;i++){
      ctx.fillStyle = i%2===0 ? c1 : c2;
      ctx.fillRect(x+i*sw, y+(4-i)*(h/5), sw, h-(4-i)*(h/5));
    }
  }

  function paint(t){
    ctx.clearRect(0,0,W,H);

    // underpainting: symmetrical earth wedges
    ctx.save();
    ctx.globalAlpha = .28;
    for(let i=0;i<6;i++){
      const yy = 280 + i*230;
      const ww = 360 + i*36;
      ctx.fillStyle = i%2 ? palette.ox : palette.clay;
      ctx.beginPath();
      ctx.moveTo(W/2, yy-72);
      ctx.lineTo(W/2-ww, yy+18);
      ctx.lineTo(W/2, yy+84);
      ctx.lineTo(W/2+ww, yy+18);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // optical illusion rings with woven feel
    const cx = W/2, cy = H*0.48;
    discs.forEach((d, idx) => {
      const rot = d.phase + t*d.speed;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      ctx.globalAlpha = 0.14 + idx*0.02;
      ctx.strokeStyle = idx % 2 ? palette.char : (idx % 3 ? palette.turq : palette.bone);
      ctx.lineWidth = 18 - idx*1.2;
      ctx.setLineDash([26, 16, 7, 16]);
      ctx.beginPath();
      ctx.ellipse(0, 0, d.r*1.08, d.r*0.76, 0, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    });

    // central nested diamonds for figure/ground ambiguity
    for(let i=0;i<12;i++){
      const s = 420 - i*28;
      const alpha = 0.05 + (12-i)*0.025;
      drawDiamond(cx, cy, s, s*1.12, i%2===0 ? palette.bone : (i%3===0?palette.turq:palette.char), alpha*0.75);
    }

    // side ceremonial fragments
    shards.forEach((sh, idx) => {
      ctx.save();
      ctx.translate(sh.x, sh.y);
      ctx.rotate(sh.r + Math.sin(t*0.00035 + idx)*0.12 + t*sh.drift);
      ctx.globalAlpha = sh.a;
      ctx.fillStyle = sh.color;
      if(sh.type===0){
        ctx.beginPath();
        ctx.moveTo(0,-sh.s*0.58);
        ctx.lineTo(sh.s*0.48,0);
        ctx.lineTo(0,sh.s*0.58);
        ctx.lineTo(-sh.s*0.48,0);
        ctx.closePath();
        ctx.fill();
      }else if(sh.type===1){
        drawStepMotif(-sh.s*0.5,-sh.s*0.42,sh.s,sh.s*0.84,palette.char,sh.color);
      }else{
        ctx.beginPath();
        ctx.moveTo(-sh.s*0.5,-sh.s*0.45);
        ctx.lineTo(sh.s*0.5,0);
        ctx.lineTo(-sh.s*0.5,sh.s*0.45);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    });

    // top and lower nested chevrons
    const chevronY = [175, 1510];
    chevronY.forEach((yy, index)=>{
      ctx.save();
      ctx.translate(cx, yy);
      if(index===1) ctx.scale(1,-1);
      for(let i=0;i<7;i++){
        const ww = 740 - i*78;
        const hh = 130 - i*11;
        ctx.globalAlpha = 0.55 - i*0.055;
        ctx.fillStyle = [palette.char,palette.sand,palette.turq,palette.clay,palette.bone,palette.earth,palette.turq2][i%7];
        ctx.beginPath();
        ctx.moveTo(0, hh*0.5);
        ctx.lineTo(ww*0.5, -hh*0.35);
        ctx.lineTo(ww*0.36, -hh*0.35);
        ctx.lineTo(0, hh*0.16);
        ctx.lineTo(-ww*0.36, -hh*0.35);
        ctx.lineTo(-ww*0.5, -hh*0.35);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    });

    // subtle grain
    const img = ctx.getImageData(0,0,W,H);
    const data = img.data;
    for(let i=0;i<data.length;i+=4*10){
      const n = (rand()-0.5)*20;
      data[i] += n; data[i+1] += n; data[i+2] += n;
    }
    ctx.putImageData(img,0,0);
  }

  let start = performance.now();
  function loop(now){
    paint(now-start);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  if (window.self === window.top) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      const ctxA = new AudioCtx();
      const master = ctxA.createGain();
      master.gain.value = 0.014;
      master.connect(ctxA.destination);

      const low = ctxA.createOscillator();
      low.type = "triangle";
      low.frequency.value = 72;

      const high = ctxA.createOscillator();
      high.type = "sine";
      high.frequency.value = 216;

      const lGain = ctxA.createGain();
      const hGain = ctxA.createGain();
      lGain.gain.value = 0.45;
      hGain.gain.value = 0.18;

      const filter = ctxA.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 580;
      filter.Q.value = 0.8;

      const lfo = ctxA.createOscillator();
      lfo.type = "sine";
      lfo.frequency.value = 0.041;
      const lfoGain = ctxA.createGain();
      lfoGain.gain.value = 90;
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      low.connect(lGain); high.connect(hGain);
      lGain.connect(filter); hGain.connect(filter);
      filter.connect(master);

      low.start(); high.start(); lfo.start();

      const base = [72, 81, 96, 108];
      let k = 0;
      setInterval(() => {
        const f = base[k % base.length];
        const t = ctxA.currentTime;
        low.frequency.cancelScheduledValues(t);
        high.frequency.cancelScheduledValues(t);
        low.frequency.linearRampToValueAtTime(f, t + 4.8);
        high.frequency.linearRampToValueAtTime(f * 3, t + 4.8);
        k++;
      }, 5200);

      const resume = () => {
        if (ctxA.state !== "running") ctxA.resume();
      };
      document.addEventListener("visibilitychange", resume);
      setTimeout(resume, 400);
    }
  }
})();
</script>
