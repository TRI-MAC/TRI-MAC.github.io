  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 20%, #4a2916 0%, #1a0c0d 38%, #070607 100%);
    font-family: Georgia, serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 30%, rgba(244,220,162,.18), rgba(0,0,0,0) 30%),
      linear-gradient(180deg, #3c2415 0%, #1b0d0e 35%, #0b0809 100%);

  #background-video{
    position:absolute;
    inset:4.5% 7% 8% 7%;
    width:86%;
    height:84%;
    object-fit:cover;
    opacity:.78;
    filter:saturate(.9) contrast(1.08) brightness(.95) sepia(.25) hue-rotate(-12deg);
    mix-blend-mode:soft-light;
    border-radius:42% 42% 8% 8% / 28% 28% 6% 6%;
    mask-image:radial-gradient(circle at 50% 32%, black 0 57%, rgba(0,0,0,.88) 66%, transparent 88%);
    -webkit-mask-image:radial-gradient(circle at 50% 32%, black 0 57%, rgba(0,0,0,.88) 66%, transparent 88%);
    transform:scale(1.02);
  }

  .gold-ground, .mosaic-overlay, .lantern-glow, .architecture, .moths, .halo-rings, .vignette, .date, #guinea-pig, .tile-svg{
    position:absolute; inset:0;
  }

  .gold-ground{
    background:
      radial-gradient(circle at 50% 30%, rgba(255,235,180,.17), rgba(255,205,120,.05) 22%, rgba(0,0,0,0) 45%),

    mix-blend-mode:screen;
    opacity:.75;
  }

  .mosaic-overlay{
    background-image:
      linear-gradient(rgba(82,52,16,.22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(92,57,18,.22) 1px, transparent 1px),
      linear-gradient(rgba(255,221,146,.045) 0, rgba(255,221,146,.045) 50%, rgba(88,48,12,.04) 50%, rgba(88,48,12,.04) 100%);

    opacity:.45;
    mix-blend-mode:overlay;
    transform:translateZ(0);
  }

  .lantern-glow{

  .moth{

    height:120px;

    animation-timing-function:linear;
    animation-iteration-count:infinite;

  .moth svg{width:100%; height:100%; display:block}
  .moth .wingL, .moth .wingR{

  }
  .moth .body{

  .moth .gold{

  .moth.a{left:50%; top:33%; margin-left:-90px; animation:orbitA 34s linear infinite}
  .moth.b{left:50%; top:33%; margin-left:-72px; width:144px; height:96px; animation:orbitB 28s linear infinite reverse}
  .moth.c{left:50%; top:33%; margin-left:-64px; width:128px; height:86px; animation:orbitC 22s linear infinite}

<script>
(function(){
  const seedStr = "2026-06-26";
  let s = 0;
  for(let i=0;i<seedStr.length;i++) s = (s * 131 + seedStr.charCodeAt(i)) >>> 0;
  function rand(){
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17; s >>>= 0;
    s ^= s << 5;  s >>>= 0;
    return (s >>> 0) / 4294967296;
  }

  const canvas = document.getElementById('sparkCanvas');
  const ctx = canvas.getContext('2d');
  const sparks = [];
  const W = canvas.width, H = canvas.height;
  const cx = 540, cy = 610;

  for(let i=0;i<46;i++){
    const a = rand() * Math.PI * 2;
    const r = 50 + rand() * 420;
    sparks.push({
      orbit:r,
      angle:a,
      speed:0.00065 + rand()*0.0011,
      size:1.5 + rand()*5.5,
      phase:rand()*Math.PI*2,
      hue:rand() < 0.6 ? 44 : (rand()<0.5?350:210),
      alpha:0.16 + rand()*0.28
    });
  }

  function drawMosaicDot(x,y,r,color,alpha){
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }

  function frame(t){
    ctx.clearRect(0,0,W,H);

    for(const p of sparks){
      p.angle += p.speed * 16;
      const pulse = 0.85 + 0.15*Math.sin(t*0.0012 + p.phase);
      const wob = 12*Math.sin(t*0.0007 + p.phase*1.7);
      const x = cx + Math.cos(p.angle) * (p.orbit + wob);
      const y = cy + Math.sin(p.angle) * (p.orbit*0.52 + wob*0.45);

      const tile = p.size * pulse;
      const c = p.hue === 44
        ? `rgba(240,214,143,1)`
        : p.hue === 350
        ? `rgba(145,23,50,1)`
        : `rgba(29,63,122,1)`;

      drawMosaicDot(x, y, tile, c, p.alpha);
      drawMosaicDot(x+1.5, y-1, tile*0.44, 'rgba(255,246,208,1)', p.alpha*0.58);
    }

    const grad = ctx.createRadialGradient(cx, cy, 8, cx, cy, 220);
    grad.addColorStop(0, 'rgba(255,246,210,.28)');
    grad.addColorStop(.25, 'rgba(244,214,128,.12)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, 220, 0, Math.PI*2);
    ctx.fill();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if (window.self === window.top) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      const audioCtx = new AudioCtx();
      const master = audioCtx.createGain();
      master.gain.value = 0.018;
      master.connect(audioCtx.destination);

      const low = audioCtx.createOscillator();
      low.type = 'triangle';
      low.frequency.value = 146.83;

      const high = audioCtx.createOscillator();
      high.type = 'sine';
      high.frequency.value = 293.66;

      const lGain = audioCtx.createGain();
      const hGain = audioCtx.createGain();
      lGain.gain.value = 0.25;
      hGain.gain.value = 0.12;

      const lfo = audioCtx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.041;

      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 0.05;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 950;
      filter.Q.value = 0.6;

      low.connect(lGain).connect(filter);
      high.connect(hGain).connect(filter);
      filter.connect(master);
      lfo.connect(lfoGain).connect(master.gain);

      low.start();
      high.start();
      lfo.start();

      function breathe(){
        const now = audioCtx.currentTime;
        hGain.gain.cancelScheduledValues(now);
        lGain.gain.cancelScheduledValues(now);
        hGain.gain.linearRampToValueAtTime(0.08 + rand()*0.08, now + 6);
        lGain.gain.linearRampToValueAtTime(0.18 + rand()*0.12, now + 6);
        high.frequency.linearRampToValueAtTime(220 + rand()*120, now + 8);
        low.frequency.linearRampToValueAtTime(110 + rand()*60, now + 8);
      }
      breathe();
      setInterval(breathe, 7000);
    }
  }
})();
</script>
