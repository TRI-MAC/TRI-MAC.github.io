<!DOCTYPE html>
<html lang="en">

<title>2026-06-12</title>
<style>
  :root{
    --bg1:#f2e1b2;
    --bg2:#d5b56a;
    --bg3:#6c4317;
    --gold1:#f8e9a6;
    --gold2:#d7b15a;
    --gold3:#8c6220;
    --ink:#24160b;
    --crimson:#7c1720;
    --ruby:#b02934;
    --ivory:#fbf2dc;
    --shadow:#120b05;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:
      radial-gradient(circle at 50% 20%, #e7c878 0%, #c79b47 26%, #7e541f 58%, #3b210a 100%);
    overflow:hidden;
    font-family: Georgia, "Times New Roman", serif;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 12%, rgba(255,246,208,.95), rgba(239,214,145,.88) 18%, rgba(191,141,63,.65) 42%, rgba(86,47,16,.95) 100%);
    box-shadow:
      0 0 0 1px rgba(255,240,200,.28),
      0 0 40px rgba(0,0,0,.32),
      inset 0 0 160px rgba(40,18,6,.24);
  }

  #frame::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(255,242,214,.14), transparent 10%, transparent 90%, rgba(58,27,7,.16)),
      linear-gradient(180deg, rgba(255,247,230,.18), transparent 16%, transparent 84%, rgba(44,19,6,.18));
    pointer-events:none;
  }

  .panel-ornament{
    position:absolute; inset:0;
    pointer-events:none;
    opacity:.92;
    mix-blend-mode:multiply;
  }

  #record-wrap{
    position:absolute;
    left:50%;
    top:54%;
    width:90%;
    aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 24px 20px rgba(50,20,6,.22));
  }

  #halo{
    position:absolute;
    inset:-6%;
    border-radius:50%;
    background:
      radial-gradient(circle, rgba(255,245,210,.0) 58%, rgba(247,218,132,.22) 67%, rgba(144,92,27,.22) 74%, rgba(0,0,0,0) 82%);
    animation: breathe 16s ease-in-out infinite;
    mask-image: radial-gradient(circle, black 0%, black 72%, transparent 88%);
    -webkit-mask-image: radial-gradient(circle, black 0%, black 72%, transparent 88%);
  }

  canvas, svg{display:block}

  #recordCanvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    border-radius:50%;
    animation: spin 24s linear infinite;
  }

  #label{
    position:absolute;
    left:50%; top:50%;
    width:25.4%;
    height:25.4%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 42%, rgba(255,244,210,.88), rgba(236,206,127,.92) 46%, rgba(150,98,34,.96) 78%, rgba(93,54,17,1) 100%);
    box-shadow:
      inset 0 0 0 2px rgba(253,235,172,.7),
      inset 0 0 16px rgba(93,48,9,.28),
      0 0 12px rgba(255,216,120,.10);
    animation: spin 24s linear infinite reverse;
  }

  #label::before{
    content:"";
    position:absolute; inset:11%;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 36%, rgba(153,16,26,.94), rgba(123,16,25,.97) 64%, rgba(68,10,16,1) 100%);
    box-shadow: inset 0 0 0 1px rgba(255,214,145,.45);
  }

  #spindle{
    position:absolute;
    left:50%; top:50%;
    width:2.6%;
    height:2.6%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #fff7cf 0%, #f0d06b 45%, #7d561f 90%);
    box-shadow:0 0 0 2px rgba(86,49,15,.5);
    z-index:5;
  }

  #tonearm{
    position:absolute;
    left:67%;
    top:13%;
    width:28%;
    height:56%;
    transform-origin:14% 7%;
    animation: armTrace 24s ease-in-out infinite;
    filter:drop-shadow(0 8px 8px rgba(37,18,5,.25));
  }

  #arm-pivot{
    position:absolute;
    left:6%;
    top:0%;
    width:14%;
    height:8%;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 35%, #fff1be 0%, #d9b35d 42%, #70491a 88%);
    box-shadow: inset 0 0 0 2px rgba(255,231,170,.45);
  }

  #arm-bar{
    position:absolute;
    left:11.5%;
    top:5%;
    width:11%;
    height:70%;
    border-radius:14px;
    background:
      linear-gradient(90deg, #7d521e 0%, #f1d58a 18%, #f7e6aa 46%, #bb8d3e 76%, #6c4316 100%);
    transform:rotate(17deg);
    transform-origin:top center;
    box-shadow: inset 0 0 0 1px rgba(255,245,199,.22);
  }

  #arm-head{
    position:absolute;
    right:16%;
    bottom:15.5%;
    width:18%;
    height:10%;
    background:
      linear-gradient(180deg, #f4db93, #9a6a25 72%, #6b4417);
    clip-path:polygon(8% 0, 100% 0, 86% 100%, 0 100%);
    transform:rotate(17deg);
    box-shadow: inset 0 0 0 1px rgba(255,244,210,.2);
  }

  #needle{
    position:absolute;
    right:21%;
    bottom:10.8%;
    width:1.1%;
    height:10.5%;
    background:linear-gradient(180deg, #efd37f, #5d3a13);
    transform:rotate(17deg);
    border-radius:1px;
  }

  #reveal{
    position:absolute; inset:0;
    width:100%; height:100%;
    border-radius:50%;
    pointer-events:none;
    animation: spin 24s linear infinite;
    mix-blend-mode:screen;
    opacity:.55;
  }

  #front-vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 50% 54%, rgba(0,0,0,0) 40%, rgba(58,26,7,.08) 56%, rgba(31,12,4,.22) 76%, rgba(18,8,2,.48) 100%);
  }

  #date{
    position:absolute;
    right:22px;
    bottom:16px;
    color:rgba(255,241,198,.58);
    font-size:13px;
    letter-spacing:1.6px;
    z-index:20;
    text-shadow:0 1px 0 rgba(60,28,8,.5);
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:111px;
    bottom:243px;
    opacity:.58;
    filter:saturate(.8) contrast(1.02) brightness(.82);
    z-index:3;
    transform:rotate(-6deg);
  }

  @keyframes spin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
  }
  @keyframes armTrace{
    0%,100%{transform:rotate(-12deg)}
    50%{transform:rotate(7deg)}
  }
  @keyframes breathe{
    0%,100%{transform:scale(1); opacity:.62}
    50%{transform:scale(1.03); opacity:.82}
  }
</style>
</head>
<body>
  <div id="frame">
    <svg class="panel-ornament" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff0b0"/>

        <g transform="translate(150 1778)">

          <path d="M-70 0H70M0 -70V70" stroke="url(#goldStroke)" stroke-width="10" stroke-linecap="round"/>
          <path d="M-50 -50L50 50M50 -50L-50 50" stroke="#a06b27" stroke-width="6" stroke-linecap="round"/>
        </g>
        <g transform="translate(930 1778)">
          <circle r="30" fill="url(#medallion)"/>
          <path d="M-70 0H70M0 -70V70" stroke="url(#goldStroke)" stroke-width="10" stroke-linecap="round"/>
          <path d="M-50 -50L50 50M50 -50L-50 50" stroke="#a06b27" stroke-width="6" stroke-linecap="round"/>

      <g opacity=".45">
        <path d="M140 210H940" stroke="#f1d891" stroke-width="2"/>

        <path d="M160 230H920" stroke="#8d5d22" stroke-width="4"/>
        <path d="M160 1690H920" stroke="#f5dd97" stroke-width="1.5"/>

      <g opacity=".52">
        <path d="M128 960H952" stroke="#8f5c22" stroke-width="3"/>
        <path d="M150 930H930" stroke="rgba(255,239,179,.35)" stroke-width="1.5"/>
        <path d="M150 990H930" stroke="rgba(255,239,179,.35)" stroke-width="1.5"/>
      </g>

      <g opacity=".76">
        <g transform="translate(540 232)">
          <circle r="62" fill="none" stroke="url(#goldStroke)" stroke-width="8"/>
          <circle r="39" fill="none" stroke="#8a5c1f" stroke-width="6"/>
          <polygon points="0,-84 18,-18 84,0 18,18 0,84 -18,18 -84,0 -18,-18" fill="url(#medallion)"/>
        </g>
        <g transform="translate(540 1688)">
          <circle r="62" fill="none" stroke="url(#goldStroke)" stroke-width="8"/>
          <circle r="39" fill="none" stroke="#8a5c1f" stroke-width="6"/>
          <polygon points="0,-84 18,-18 84,0 18,18 0,84 -18,18 -84,0 -18,-18" fill="url(#medallion)"/>
        </g>
      </g>
    </svg>

    <div id="record-wrap">
      <div id="halo"></div>
      <canvas id="recordCanvas" width="900" height="900"></canvas>
      <canvas id="reveal" width="900" height="900"></canvas>
      <div id="label"></div>

      <div id="tonearm" aria-hidden="true">

    <div id="date">2026-06-12</div>

<script>
(function(){
  const dateSeed = "2026-06-12";
  function xmur3(str){
    let h = 1779033703 ^ str.length;
    for(let i=0;i<str.length;i++){
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = h << 13 | h >>> 19;
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    }
  }
  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
  }
  const seedFn = xmur3(dateSeed + "-beaux-record");
  const rand = mulberry32(seedFn());

  const canvas = document.getElementById("recordCanvas");
  const ctx = canvas.getContext("2d");
  const reveal = document.getElementById("reveal");
  const rctx = reveal.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const R = 430;
  const labelR = 115;
  const palettes = [
    ["#f7e8ad","#d6a94c","#8b5c1f","#6b1220","#f4f0dc"],
    ["#f5d88b","#c68f2a","#7d4c1c","#8f1e2b","#fff3d1"],
    ["#f6e2a1","#d8b45d","#9b6823","#6f1521","#f9eec8"]
  ];
  const pal = palettes[Math.floor(rand()*palettes.length)];

  function ringArcPattern(ctx, radius, width, phase, mode){
    const segs = 24;
    for(let i=0;i<segs;i++){
      const a0 = phase + i*Math.PI*2/segs;
      const arcLen = (Math.PI*2/segs) * (0.45 + 0.35*Math.sin(i*0.8 + phase*2 + mode));
      ctx.beginPath();
      ctx.lineWidth = width;
      ctx.strokeStyle = i%2===0 ? "rgba(248,230,166,.15)" : "rgba(105,22,30,.14)";
      ctx.arc(cx, cy, radius, a0, a0+arcLen);
      ctx.stroke();
    }
  }

  function drawRecordTexture(t){
    ctx.clearRect(0,0,W,H);

    const bg = ctx.createRadialGradient(cx, cy, R*0.12, cx, cy, R);
    bg.addColorStop(0, "#3a2211");
    bg.addColorStop(0.4, "#25160b");
    bg.addColorStop(0.78, "#120b06");
    bg.addColorStop(1, "#050302");
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.fillStyle = bg;
    ctx.fill();

    for(let i=0;i<110;i++){
      const rr = labelR + 10 + i*(R-labelR-16)/110;
      const alpha = 0.12 + 0.12*Math.sin(i*0.75 + t*0.00025);
      ctx.beginPath();
      ctx.lineWidth = (i%5===0?2.4:1.2);
      ctx.strokeStyle = `rgba(220,186,100,${alpha*0.28})`;
      ctx.arc(cx,cy,rr,0,Math.PI*2);
      ctx.stroke();
    }

    for(let band=0; band<8; band++){
      ringArcPattern(ctx, labelR + 36 + band*34, 8 + band%2*2, t*0.00013 + band*0.21, band*0.7);
    }

    for(let k=0;k<18;k++){
      const baseR = labelR + 48 + k*16.5;
      const teeth = 8 + (k%5)*2;
      for(let i=0;i<teeth;i++){
        const a = (i/teeth)*Math.PI*2 + k*0.13;
        const rr = baseR;
        const x = cx + Math.cos(a)*rr;
        const y = cy + Math.sin(a)*rr;
        const w = 10 + (k%3)*4;
        const h = 22 + (i%3)*6;
        ctx.save();
        ctx.translate(x,y);
        ctx.rotate(a + Math.PI/2);
        const grad = ctx.createLinearGradient(0,-h/2,0,h/2);
        grad.addColorStop(0, "rgba(248,232,170,.2)");
        grad.addColorStop(0.5, k%2===0 ? "rgba(125,20,30,.18)" : "rgba(220,175,87,.16)");
        grad.addColorStop(1, "rgba(72,40,12,.08)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.rect(-w/2,-h/2,w,h);
        ctx.fill();
        ctx.restore();
      }
    }

    for(let i=0;i<14;i++){
      const a = (i/14)*Math.PI*2 + t*0.00004;
      const r1 = 175 + (i%3)*38;
      const r2 = 370 - (i%4)*18;
      ctx.beginPath();
      ctx.lineWidth = 16;
      ctx.strokeStyle = i%2 ? "rgba(133,19,29,.12)" : "rgba(248,227,161,.10)";
      ctx.arc(cx, cy, (r1+r2)/2, a, a+0.24);
      ctx.stroke();
    }

    ctx.save();
    ctx.globalCompositeOperation = "overlay";
    const sheen = ctx.createRadialGradient(cx-40, cy-70, 20, cx, cy, R);
    sheen.addColorStop(0, "rgba(255,236,160,.13)");
    sheen.addColorStop(0.35, "rgba(255,236,160,.07)");
    sheen.addColorStop(1, "rgba(255,236,160,0)");
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.fillStyle = sheen;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(cx,cy,R+1,0,Math.PI*2);
    ctx.lineWidth = 7;
    ctx.strokeStyle = "rgba(249,224,144,.18)";
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx,cy,labelR+2,0,Math.PI*2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(253,232,165,.28)";
    ctx.stroke();
  }

  function drawReveal(t){
    rctx.clearRect(0,0,W,H);
    const cycle = (t % 24000) / 24000;
    const armAngle = (-12 + Math.sin(cycle*Math.PI*2)*19) * Math.PI/180;
    const pivotX = cx + 235;
    const pivotY = cy - 290;
    const len = 410;
    const tipX = pivotX + Math.sin(armAngle) * len;
    const tipY = pivotY + Math.cos(armAngle) * len;

    rctx.save();
    rctx.translate(cx,cy);
    rctx.rotate(t*0.000261799);
    rctx.translate(-cx,-cy);

    const grad = rctx.createRadialGradient(tipX, tipY, 10, tipX, tipY, 125);
    grad.addColorStop(0,"rgba(255,243,204,.72)");
    grad.addColorStop(0.33,"rgba(241,211,125,.28)");
    grad.addColorStop(0.7,"rgba(168,34,46,.14)");
    grad.addColorStop(1,"rgba(0,0,0,0)");

    rctx.beginPath();
    rctx.arc(tipX, tipY, 125, 0, Math.PI*2);
    rctx.fillStyle = grad;
    rctx.fill();

    const motifs = 12;
    for(let i=0;i<motifs;i++){
      const a = i*Math.PI*2/motifs + cycle*Math.PI*2;
      const rr = 190 + (i%4)*54;
      const mx = cx + Math.cos(a)*rr;
      const my = cy + Math.sin(a)*rr;
      rctx.save();
      rctx.translate(mx,my);
      rctx.rotate(a + cycle*2);
      rctx.globalAlpha = 0.38;
      rctx.fillStyle = i%2===0 ? pal[3] : pal[0];
      rctx.beginPath();
      rctx.moveTo(0,-28);
      rctx.lineTo(18,0);
      rctx.lineTo(0,28);
      rctx.lineTo(-18,0);
      rctx.closePath();
      rctx.fill();
      rctx.fillStyle = i%2===0 ? "rgba(250,232,170,.35)" : "rgba(122,18,28,.28)";
      rctx.fillRect(-7,-44,14,88);
      rctx.restore();
    }

    for(let i=0;i<5;i++){
      const rr = 160 + i*58;
      rctx.beginPath();
      rctx.arc(cx,cy,rr,0,Math.PI*2);
      rctx.lineWidth = 10;
      rctx.strokeStyle = i%2===0 ? "rgba(250,234,176,.08)" : "rgba(113,22,31,.08)";
      rctx.stroke();
    }
    rctx.restore();
  }

  let start = performance.now();
  function animate(now){
    const t = now - start;
    drawRecordTexture(t);
    drawReveal(t);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  if (window.self === window.top) {
    try{
      const ctxA = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctxA.createGain();
      master.gain.value = 0.018;
      master.connect(ctxA.destination);

      const osc1 = ctxA.createOscillator();
      const osc2 = ctxA.createOscillator();
      const osc3 = ctxA.createOscillator();
      const gain1 = ctxA.createGain();
      const gain2 = ctxA.createGain();
      const gain3 = ctxA.createGain();
      const lfo = ctxA.createOscillator();
      const lfoGain = ctxA.createGain();
      const filter = ctxA.createBiquadFilter();

      osc1.type = "triangle";
      osc2.type = "sine";
      osc3.type = "sawtooth";
      osc1.frequency.value = 110;
      osc2.frequency.value = 164.81;
      osc3.frequency.value = 82.41;

      gain1.gain.value = 0.22;
      gain2.gain.value = 0.12;
      gain3.gain.value = 0.05;

      filter.type = "lowpass";
      filter.frequency.value = 950;
      filter.Q.value = 0.6;

      lfo.type = "sine";
      lfo.frequency.value = 0.07;
      lfoGain.gain.value = 10;

      lfo.connect(lfoGain);
      lfoGain.connect(osc2.detune);

      osc1.connect(gain1); osc2.connect(gain2); osc3.connect(gain3);
      gain1.connect(filter); gain2.connect(filter); gain3.connect(filter);
      filter.connect(master);

      const nowA = ctxA.currentTime;
      osc1.start(nowA); osc2.start(nowA); osc3.start(nowA); lfo.start(nowA);

      function breatheAudio(){
        const t = ctxA.currentTime;
        filter.frequency.cancelScheduledValues(t);
        filter.frequency.linearRampToValueAtTime(700, t + 6);
        filter.frequency.linearRampToValueAtTime(1100, t + 12);
        gain1.gain.linearRampToValueAtTime(0.18, t + 6);
        gain1.gain.linearRampToValueAtTime(0.24, t + 12);
        gain2.gain.linearRampToValueAtTime(0.09, t + 6);
        gain2.gain.linearRampToValueAtTime(0.13, t + 12);
      }
      breatheAudio();
      setInterval(breatheAudio, 12000);

      const resume = ()=>ctxA.resume().catch(()=>{});
      document.addEventListener("visibilitychange", resume);
      setTimeout(resume, 300);
    }catch(e){}
  }
})();
</script>
