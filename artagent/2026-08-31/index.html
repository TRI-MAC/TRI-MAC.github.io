<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="utf-8">
<title>2026-08-31</title>
<style>
  html,body{margin:0;padding:0;background:#efe6cf;overflow:hidden;}
  #stage{
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    margin:0 auto;
    background:#f4ead1;
    overflow:hidden;
  }
  body{display:flex;align-items:center;justify-content:center;height:100vh;}

  /* ---- the cloth field: the single background plane, woven in place ---- */
  #cloth{
    position:absolute;inset:0;
    width:100%;height:100%;
    display:block;
  }

  #scene-image{
    position:absolute;
    left:-2%;top:-1%;
    width:104%;height:102%;
    object-fit:cover;
    object-position:50% 42%;
    opacity:1;
    animation:breathe 64s ease-in-out infinite;
    transform-origin:52% 44%;
  }
  @keyframes breathe{
    0%{transform:scale(1.005) translate3d(0,0,0);}
    50%{transform:scale(1.028) translate3d(-0.5%,-0.7%,0);}
    100%{transform:scale(1.005) translate3d(0,0,0);}
  }

  /* bands that cross the image boundary, in front */
  #bands-front{position:absolute;inset:0;width:100%;height:100%;}
  #bands-back{position:absolute;inset:0;width:100%;height:100%;}

  .slow-a{animation:slideA 46s ease-in-out infinite;}
  .slow-b{animation:slideB 58s ease-in-out infinite;}
  .slow-c{animation:slideC 72s ease-in-out infinite;}
  @keyframes slideA{
    0%{transform:translate3d(0,0,0);}
    50%{transform:translate3d(-2.2%,0.9%,0);}
    100%{transform:translate3d(0,0,0);}
  }
  @keyframes slideB{
    0%{transform:translate3d(0,0,0);}
    50%{transform:translate3d(1.8%,-1.1%,0);}
    100%{transform:translate3d(0,0,0);}
  }
  @keyframes slideC{
    0%{transform:translate3d(0,0,0) scale(1);}
    50%{transform:translate3d(0,1.6%,0) scale(1.012);}
    100%{transform:translate3d(0,0,0) scale(1);}
  }

  #datestamp{
    position:absolute;left:22px;bottom:18px;
    font:500 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.22em;
    color:#3a2a18;opacity:.42;
    z-index:40;
  }
</style>
</head>
<body>
<div id="stage">

  <!-- ============ WOVEN GROUND (canvas, drawn once, animated weft via 2nd canvas) ============ -->
  <canvas id="cloth" width="540" height="960"></canvas>

  <!-- ============ BANDS BEHIND THE IMAGE ============ -->
  <svg id="bands-back" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
    <g class="slow-c">
      <!-- broad emerald weft plane, runs off both edges -->
      <path d="M-80 1180 L1160 1052 L1160 1300 L-80 1428 Z" fill="#0f7a5f" opacity="0.92"/>
      <!-- vermilion plane under it -->
      <path d="M-80 1428 L1160 1300 L1160 1408 L-80 1536 Z" fill="#cf3418" opacity="0.95"/>
    </g>
  </svg>

  <!-- ============ THE FIGURE / SCENE ============ -->
  <img id="scene-image" src="scene.png" alt="">

  <!-- ============ BANDS CROSSING IN FRONT ============ -->
  <svg id="bands-front" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <!-- feather masks so nothing terminates hard at the frame -->
      <linearGradient id="fadeH" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
        <stop offset="0.14" stop-color="#fff" stop-opacity="1"/>
        <stop offset="0.86" stop-color="#fff" stop-opacity="1"/>
        <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <mask id="mFadeH"><rect x="-120" y="0" width="1320" height="1920" fill="url(#fadeH)"/></mask>

      <linearGradient id="fadeV" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
        <stop offset="0.10" stop-color="#fff" stop-opacity="1"/>
        <stop offset="0.88" stop-color="#fff" stop-opacity="1"/>
        <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <mask id="mFadeV"><rect x="0" y="-120" width="1080" height="2160" fill="url(#fadeV)"/></mask>
    </defs>

    <!-- BAND 1 : wide chrome-yellow warp band, vertical, crosses top edge and bottom -->
    <g class="slow-a" mask="url(#mFadeV)">
      <path d="M118 -140 L318 -140 L268 2060 L74 2060 Z" fill="#f0b81d" opacity="0.94"/>
      <path d="M300 -140 L352 -140 L306 2060 L256 2060 Z" fill="#1b1710" opacity="0.9"/>
    </g>

    <!-- BAND 2 : cobalt weft crossing the shoulders, left->right, off both sides -->
    <g class="slow-b" mask="url(#mFadeH)">
      <path d="M-140 742 L1220 636 L1220 742 L-140 848 Z" fill="#17458f" opacity="0.93"/>
      <path d="M-140 848 L1220 742 L1220 776 L-140 882 Z" fill="#f4ead1" opacity="0.9"/>
    </g>

    <!-- BAND 3 : narrow vermilion warp on the right, top to bottom -->
    <g class="slow-c" mask="url(#mFadeV)">
      <path d="M898 -140 L1002 -140 L1042 2060 L936 2060 Z" fill="#cf3418" opacity="0.9"/>
      <path d="M866 -140 L898 -140 L936 2060 L900 2060 Z" fill="#0f7a5f" opacity="0.88"/>
    </g>

    <!-- BAND 4 : low emerald weft, thick, right->left, crosses out of frame -->
    <g class="slow-a" mask="url(#mFadeH)">
      <path d="M-140 1596 L1220 1520 L1220 1626 L-140 1702 Z" fill="#0f7a5f" opacity="0.9"/>
      <path d="M-140 1702 L1220 1626 L1220 1660 L-140 1736 Z" fill="#1b1710" opacity="0.82"/>
    </g>

    <!-- the tiny guinea pig, tucked in the shadow line of band 4, colour-matched -->
    <g opacity="0.5" transform="translate(742,1651) rotate(-4)">
      <ellipse cx="0" cy="0" rx="8.4" ry="5.2" fill="#221a10"/>
      <circle cx="7.2" cy="-1.6" r="3.5" fill="#221a10"/>
      <circle cx="9.9" cy="-2.6" r="0.7" fill="#f4ead1" opacity="0.55"/>
      <ellipse cx="6.0" cy="-4.4" rx="1.5" ry="1.1" fill="#2c2113" transform="rotate(-24 6 -4.4)"/>
      <rect x="-4" y="4.2" width="1.6" height="2" fill="#221a10"/>
      <rect x="2" y="4.2" width="1.6" height="2" fill="#221a10"/>
    </g>
  </svg>

  <div id="datestamp">2026·08·31</div>
</div>

<script>
(function(){
  "use strict";

  /* ===========================================================
     ONE IDEA: A LOOM THAT IS STILL WEAVING THE PICTURE.
     The whole page is a single strip of cloth on a loom. The
     figure is woven INTO it. The weft advances shed by shed,
     travelling across the width and laying down one new pick of
     thread at a time, so the cloth is visibly being made — the
     lower edge of the field is unfinished warp, still bare.
     Nothing else is on the page.
     =========================================================== */

  // ---- date seed ----
  const SEED_STR = "2026-08-31";
  let h = 2166136261;
  for (let i=0;i<SEED_STR.length;i++){ h ^= SEED_STR.charCodeAt(i); h = Math.imul(h,16777619); }
  let s = h >>> 0;
  function rnd(){ s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; }

  const cv = document.getElementById('cloth');
  const ctx = cv.getContext('2d', {alpha:false});
  const W = cv.width, H = cv.height;

  const GROUND = '#f4ead1';
  const PAL = ['#cf3418','#f0b81d','#0f7a5f','#17458f','#1b1710','#f4ead1'];

  // warp threads: vertical, spaced, colour-blocked in Kente stripes
  const WARP_W = 9;                        // pixels per warp thread
  const NW = Math.ceil(W / WARP_W);
  const warpCol = new Array(NW);
  {
    // build stripe blocks deterministically
    let x = 0;
    while (x < NW){
      const run = 2 + Math.floor(rnd()*7);
      const c = PAL[Math.floor(rnd()*5)];
      for (let i=0;i<run && x<NW;i++,x++) warpCol[x] = c;
    }
  }

  // weft picks: horizontal rows, colour chosen per pick in blocks
  const PICK_H = 9;
  const NP = Math.ceil(H / PICK_H);
  const weftCol = new Array(NP);
  {
    let y = 0;
    while (y < NP){
      const run = 3 + Math.floor(rnd()*9);
      const c = PAL[Math.floor(rnd()*5)];
      for (let i=0;i<run && y<NP;i++,y++) weftCol[y] = c;
    }
  }

  // ---- static layer: bare warp on the whole field (drawn once) ----
  const bare = document.createElement('canvas');
  bare.width = W; bare.height = H;
  {
    const b = bare.getContext('2d');
    b.fillStyle = GROUND; b.fillRect(0,0,W,H);
    for (let i=0;i<NW;i++){
      b.fillStyle = warpCol[i];
      b.globalAlpha = 0.85;
      b.fillRect(i*WARP_W, 0, WARP_W-2, H);
    }
    b.globalAlpha = 1;
  }

  // ---- woven layer: accumulates picks; persistent, only appended to ----
  const woven = document.createElement('canvas');
  woven.width = W; woven.height = H;
  const wc = woven.getContext('2d');

  function clearWoven(){ wc.clearRect(0,0,W,H); }

  // draw one pick row from x0 to x1 (in warp indices), interlacing over/under
  function drawPickSegment(pickIdx, i0, i1){
    const y = pickIdx*PICK_H;
    const wcol = weftCol[pickIdx];
    const over = pickIdx % 2;            // plain weave shed
    for (let i=i0;i<=i1;i++){
      if (i<0 || i>=NW) continue;
      const x = i*WARP_W;
      if (((i+over) & 1) === 0){
        // weft passes OVER this warp -> weft colour visible
        wc.fillStyle = wcol;
        wc.fillRect(x, y, WARP_W-1, PICK_H-1);
      } else {
        // weft passes UNDER -> warp shows, but weft edge glints at the sides
        wc.fillStyle = warpCol[i];
        wc.fillRect(x, y, WARP_W-2, PICK_H-1);
        wc.fillStyle = wcol;
        wc.globalAlpha = 0.5;
        wc.fillRect(x, y+PICK_H-3, WARP_W-2, 2);
        wc.globalAlpha = 1;
      }
    }
  }

  // ---- loom state ----
  // The cloth is complete from the top down to `pick`, and pick `pick`
  // is currently being laid across by the shuttle.
  let pick = 0;
  let shuttle = 0;         // warp index the shuttle has reached
  let dir = 1;
  const SPEED = 46;        // warp threads per second (slow, methodical)
  const TOTAL = NP;

  function prefill(){
    clearWoven();
    // start with the top ~62% already woven so the figure reads immediately,
    // leaving the lower field as bare warp still to be filled
    const start = Math.floor(TOTAL*0.62);
    for (let p=0;p<start;p++) drawPickSegment(p, 0, NW-1);
    pick = start;
    shuttle = 0; dir = 1;
  }
  prefill();

  // ---- shuttle sprite: a small manta-ray-shaped boat-shuttle carrying the weft ----
  function drawShuttle(g, cx, cy, facing){
    g.save();
    g.translate(cx, cy);
    g.scale(facing, 1);
    g.fillStyle = '#1b1710';
    g.beginPath();
    // flattened diamond wing, manta silhouette
    g.moveTo(-13, 0);
    g.lineTo(-3, -7);
    g.lineTo(11, -3.2);
    g.lineTo(15, 0);
    g.lineTo(11, 3.2);
    g.lineTo(-3, 7);
    g.closePath();
    g.fill();
    g.fillStyle = '#f0b81d';
    g.fillRect(-2, -1.2, 8, 2.4);
    g.strokeStyle = '#1b1710';
    g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(-13,0); g.lineTo(-22,-1.4); g.stroke();
    g.restore();
  }

  let last = performance.now();
  let acc = 0;
  const STEP = 1/60;

  function frame(now){
    let dt = (now - last)/1000; last = now;
    if (dt > 0.25) dt = 0.25;
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 2){ advance(STEP); acc -= STEP; steps++; }
    if (acc > STEP) acc = 0;
    render();
    requestAnimationFrame(frame);
  }

  function advance(dt){
    const prev = shuttle;
    shuttle += dir * SPEED * dt;
    let a = Math.floor(Math.min(prev, shuttle));
    let b = Math.ceil(Math.max(prev, shuttle));
    drawPickSegment(pick, a, b);

    if (dir > 0 && shuttle >= NW-1){
      drawPickSegment(pick, 0, NW-1);
      pick++; dir = -1; shuttle = NW-1;
    } else if (dir < 0 && shuttle <= 0){
      drawPickSegment(pick, 0, NW-1);
      pick++; dir = 1; shuttle = 0;
    }

    if (pick >= TOTAL){
      // cloth complete -> the loom is re-warped and begins again (seamless loop)
      clearWoven();
      pick = 0; shuttle = 0; dir = 1;
    }
  }

  function render(){
    ctx.drawImage(bare, 0, 0);
    ctx.drawImage(woven, 0, 0);

    // the beater / fell of the cloth: a single dark reed line at the working edge
    const y = pick*PICK_H;
    ctx.fillStyle = '#1b1710';
    ctx.globalAlpha = 0.85;
    ctx.fillRect(0, y + PICK_H + 1, W, 2);
    ctx.globalAlpha = 1;

    drawShuttle(ctx, shuttle*WARP_W + WARP_W*0.5, y + PICK_H*0.5, dir>=0 ? 1 : -1);
  }

  requestAnimationFrame(frame);

  // ---- the loom's sound: a low drone plus the beat of the beater ----
  if (window.self === window.top){
    let ac = null;
    function startAudio(){
      if (ac) return;
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e){ return; }
      const master = ac.createGain();
      master.gain.value = 0.055;
      master.connect(ac.destination);

      // drone: two detuned low tones, the tension of the warp
      [98.0, 147.0].forEach(function(f, i){
        const o = ac.createOscillator();
        o.type = 'triangle';
        o.frequency.value = f;
        const g = ac.createGain();
        g.gain.value = i ? 0.16 : 0.3;
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 620;
        o.connect(g); g.connect(lp); lp.connect(master);
        o.start();
      });

      // beater: soft wooden knock each time a pick completes
      let lastPick = pick;
      setInterval(function(){
        if (!ac || ac.state !== 'running') return;
        if (pick === lastPick) return;
        lastPick = pick;
        const t = ac.currentTime;
        const o = ac.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(190, t);
        o.frequency.exponentialRampToValueAtTime(72, t+0.14);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5, t+0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t+0.26);
      }, 90);
    }
    // autoplay attempt; browsers may keep it suspended, which is fine
    startAudio();
    if (ac && ac.state === 'suspended'){ ac.resume().catch(function(){}); }
  }
})();
</script>
</body>
</html>
