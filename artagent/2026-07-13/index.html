<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>2026-07-13</title>
<style>
  :root{
    --bg:#111116;
    --paper:#f0e1cf;
    --ink:#161418;
    --rose:#d94162;
    --crimson:#b11d39;
    --amber:#ff9b32;
    --ochre:#c78022;
    --cobalt:#1f4ea6;
    --ultra:#3b2e9f;
    --teal:#2ca89f;
    --acid:#d2da3a;
    --chalk:#f6efe5;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#0c0c11;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #stage{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.777778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 52%, rgba(245,189,66,.22), rgba(245,189,66,0) 18%),
      radial-gradient(circle at 38% 33%, rgba(217,65,98,.2), rgba(217,65,98,0) 24%),
      radial-gradient(circle at 62% 66%, rgba(44,168,159,.16), rgba(44,168,159,0) 22%),
      linear-gradient(180deg, #15131a 0%, #201920 22%, #1a171d 48%, #120f15 100%);
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    isolation:isolate;
  }

  .layer{
    position:absolute; inset:0;
    pointer-events:none;
  }

  #background-video{
    position:absolute;
    inset:-8%;
    width:116%;
    height:116%;
    object-fit:cover;
    opacity:.82;
    filter:saturate(1.35) contrast(1.08) brightness(.94) hue-rotate(-6deg);
    mix-blend-mode:screen;
    transform-origin:50% 52%;
    animation: videoBreath 46s ease-in-out infinite;
    mask-image: radial-gradient(circle at 50% 52%, rgba(0,0,0,1) 0 44%, rgba(0,0,0,.96) 52%, rgba(0,0,0,.7) 66%, rgba(0,0,0,.15) 82%, transparent 100%);
    -webkit-mask-image: radial-gradient(circle at 50% 52%, rgba(0,0,0,1) 0 44%, rgba(0,0,0,.96) 52%, rgba(0,0,0,.7) 66%, rgba(0,0,0,.15) 82%, transparent 100%);
  }

  #videoTint{
    background:
      radial-gradient(circle at 50% 52%, rgba(255,210,120,.18) 0 14%, rgba(255,120,70,.15) 18%, rgba(25,20,35,.05) 38%, rgba(10,9,15,.42) 70%, rgba(9,8,12,.8) 100%),
      radial-gradient(circle at 50% 52%, rgba(31,78,166,.22), rgba(31,78,166,0) 58%);
    mix-blend-mode:multiply;
    opacity:.9;
  }

  #paintCanvas, #ringCanvas, #speckCanvas{
    width:100%; height:100%; display:block;
  }

  #ringSvg{
    width:100%; height:100%;
    overflow:visible;
    filter: drop-shadow(0 0 18px rgba(0,0,0,.18));
  }

  .haloWrap{
    mask-image: radial-gradient(circle at 50% 52%, black 0 73%, transparent 100%);
    -webkit-mask-image: radial-gradient(circle at 50% 52%, black 0 73%, transparent 100%);
  }

  .centerGlow{
    position:absolute;
    left:50%; top:52%;
    width:76%;
    height:76%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
      radial-gradient(circle, rgba(248,233,203,.42) 0 3%, rgba(255,157,50,.32) 8%, rgba(217,65,98,.14) 17%, rgba(17,17,22,0) 52%);
    filter:blur(18px);
    opacity:.8;
    animation:centerPulse 18s ease-in-out infinite;
  }

  .field{
    position:absolute; inset:-12%;
    background:
      radial-gradient(circle at 50% 52%, rgba(255,227,171,.07), transparent 17%),
      radial-gradient(circle at 50% 52%, rgba(177,29,57,.15) 0 24%, rgba(177,29,57,0) 25% 100%),
      radial-gradient(circle at 50% 52%, rgba(44,168,159,.14) 0 35%, rgba(44,168,159,0) 36% 100%),
      radial-gradient(circle at 50% 52%, rgba(31,78,166,.13) 0 48%, rgba(31,78,166,0) 49% 100%),
      radial-gradient(circle at 50% 52%, rgba(255,155,50,.11) 0 60%, rgba(255,155,50,0) 61% 100%);
    filter:blur(24px) saturate(1.2);
    opacity:.82;
    transform-origin:50% 52%;
    animation: fieldRotate 80s linear infinite;
  }

  #impasto{
    mix-blend-mode:screen;
    opacity:.55;
  }

  #date{
    position:absolute;
    right:18px;
    bottom:13px;
    color:rgba(246,239,229,.55);
    font-size:12px;
    letter-spacing:.18em;
    z-index:30;
    text-shadow:0 1px 1px rgba(0,0,0,.35);
  }

  #guinea-pig{
    position:absolute;
    width:17px;
    height:auto;
    left:14px;
    bottom:112px;
    opacity:.58;
    filter:saturate(.7) hue-rotate(18deg) brightness(.86) contrast(.95);
    transform:rotate(-8deg);
    z-index:12;
  }

  .edgeVignette{
    background:
      radial-gradient(circle at 50% 52%, rgba(0,0,0,0) 58%, rgba(0,0,0,.13) 74%, rgba(0,0,0,.34) 100%),
      linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,0) 12%, rgba(0,0,0,0) 88%, rgba(0,0,0,.22));
    mix-blend-mode:multiply;
  }

  .grain{
    opacity:.08;
    mix-blend-mode:soft-light;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 1px, transparent 1px 5px);
    transform:scale(1.2);
  }

  @keyframes videoBreath{
    0%,100%{transform:scale(1.04) translateY(0px)}
    50%{transform:scale(1.10) translateY(-12px)}
  }
  @keyframes centerPulse{
    0%,100%{transform:translate(-50%,-50%) scale(.96)}
    50%{transform:translate(-50%,-50%) scale(1.05)}
  }
  @keyframes fieldRotate{
    from{transform:rotate(0deg) scale(1)}
    50%{transform:rotate(180deg) scale(1.035)}
    to{transform:rotate(360deg) scale(1)}
  }
</style>
</head>
<body>
  <div id="stage">
    <video id="background-video" src="background.mp4" autoplay loop muted playsinline></video>

    <div id="videoTint" class="layer"></div>
    <canvas id="paintCanvas" class="layer"></canvas>
    <div class="layer haloWrap"><div class="field"></div></div>
    <svg id="ringSvg" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <radialGradient id="fadeEdge" cx="50%" cy="52%" r="48%">
          <stop offset="0%" stop-color="rgba(255,255,255,1)"/>
          <stop offset="72%" stop-color="rgba(255,255,255,1)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </radialGradient>
        <mask id="edgeMask">
          <rect width="1080" height="1920" fill="black"/>
          <circle cx="540" cy="998" r="770" fill="url(#fadeEdge)"/>
        </mask>
      </defs>
      <g id="svgRings" mask="url(#edgeMask)"></g>
      <g id="frogMarks" mask="url(#edgeMask)"></g>
    </svg>
    <div class="centerGlow layer"></div>
    <canvas id="ringCanvas" class="layer"></canvas>
    <canvas id="speckCanvas" class="layer"></canvas>
    <div id="impasto" class="layer"></div>
    <div class="grain layer"></div>
    <img id="guinea-pig" src="guineapig.png" alt="" />
    <div class="edgeVignette layer"></div>
    <div id="date">2026-07-13</div>
  </div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const paintCanvas = document.getElementById('paintCanvas');
  const ringCanvas = document.getElementById('ringCanvas');
  const speckCanvas = document.getElementById('speckCanvas');
  const impasto = document.getElementById('impasto');
  const svgRings = document.getElementById('svgRings');
  const frogMarks = document.getElementById('frogMarks');

  const W = 1080, H = 1920, CX = 540, CY = 998;
  const seedString = "2026-07-13";
  function hashString(str){
    let h = 2166136261 >>> 0;
    for(let i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
  }
  const rand = mulberry32(hashString(seedString));

  function resizeCanvas(c){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = W * dpr;
    c.height = H * dpr;
    c.style.width = "100%";
    c.style.height = "100%";
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return ctx;
  }

  const pctx = resizeCanvas(paintCanvas);
  const rctx = resizeCanvas(ringCanvas);
  const sctx = resizeCanvas(speckCanvas);

  const palette = ["#d94162","#ff9b32","#f6efe5","#1f4ea6","#2ca89f","#c78022","#b11d39","#d2da3a"];

  function paintBackground(){
    pctx.clearRect(0,0,W,H);
    pctx.globalCompositeOperation = 'source-over';

    const g1 = pctx.createRadialGradient(CX, CY, 20, CX, CY, 720);
    g1.addColorStop(0, "rgba(245,225,195,.75)");
    g1.addColorStop(.08, "rgba(255,149,80,.45)");
    g1.addColorStop(.24, "rgba(217,65,98,.24)");
    g1.addColorStop(.42, "rgba(31,78,166,.18)");
    g1.addColorStop(.68, "rgba(44,168,159,.10)");
    g1.addColorStop(1, "rgba(17,17,22,0)");
    pctx.fillStyle = g1;
    pctx.fillRect(0,0,W,H);

    for(let ring = 0; ring < 14; ring++){
      const radius = 120 + ring * 52 + rand()*16;
      const strokes = 14 + Math.floor(rand()*14);
      for(let i=0;i<strokes;i++){
        const a = (Math.PI*2/strokes)*i + rand()*0.2;
        const len = 150 + rand()*180;
        const thick = 18 + rand()*52;
        const hueColor = palette[(ring+i)%palette.length];
        const x = CX + Math.cos(a) * radius;
        const y = CY + Math.sin(a) * radius * 1.02;
        pctx.save();
        pctx.translate(x,y);
        pctx.rotate(a + Math.PI/2 + (rand()-.5)*0.35);
        pctx.fillStyle = hueColor;
        pctx.globalAlpha = 0.08 + rand()*0.08;
        roundedRect(pctx, -thick*.55, -len*.45, thick, len, thick*0.48);
        pctx.restore();
      }
    }

    for(let i=0;i<36;i++){
      const a = rand()*Math.PI*2;
      const rr = 70 + Math.pow(rand(), .75) * 600;
      const x = CX + Math.cos(a) * rr;
      const y = CY + Math.sin(a) * rr * 1.08;
      const rw = 90 + rand()*220;
      const rh = 70 + rand()*220;
      pctx.save();
      pctx.translate(x,y);
      pctx.rotate(a + rand()*1.8);
      pctx.globalAlpha = 0.12;
      pctx.fillStyle = palette[i % palette.length];
      pctx.beginPath();
      pctx.ellipse(0,0,rw,rh,0,0,Math.PI*2);
      pctx.fill();
      pctx.restore();
    }

    // Central thick spiral bands
    for(let i=0;i<4;i++){
      drawSpiralBand(pctx, {
        turns: 2.8 + i*0.35,
        width: 44 - i*6,
        startR: 40 + i*22,
        endR: 420 + i*64,
        color: palette[(i*2+1)%palette.length],
        alpha: 0.13 - i*0.018,
        phase: i*0.7
      });
    }
  }

  function roundedRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r);
    ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h);
    ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r);
    ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
    ctx.fill();
  }

  function drawSpiralBand(ctx, opt){
    const pts = [];
    const total = 300;
    for(let i=0;i<=total;i++){
      const t = i/total;
      const ang = opt.phase + t * Math.PI * 2 * opt.turns;
      const r = opt.startR + (opt.endR-opt.startR)*t;
      pts.push([CX + Math.cos(ang)*r, CY + Math.sin(ang)*r*1.04]);
    }
    ctx.save();
    ctx.strokeStyle = opt.color;
    ctx.globalAlpha = opt.alpha;
    ctx.lineWidth = opt.width;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    ctx.restore();
  }

  function buildSVG(){
    svgRings.innerHTML = '';
    frogMarks.innerHTML = '';

    const rings = 18;
    for(let i=0;i<rings;i++){
      const r = 88 + i * 38;
      const circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
      circle.setAttribute("cx", CX);
      circle.setAttribute("cy", CY);
      circle.setAttribute("r", r.toFixed(1));
      circle.setAttribute("fill", "none");
      circle.setAttribute("stroke", palette[i % palette.length]);
      circle.setAttribute("stroke-width", (8 + (i%4)*7).toString());
      circle.setAttribute("stroke-linecap", "round");
      circle.setAttribute("stroke-dasharray", `${120 + (i%5)*40} ${45 + (i%4)*36}`);
      circle.setAttribute("opacity", (0.17 + (i%5)*0.025).toString());
      circle.style.transformOrigin = "540px 998px";
      circle.style.animation = `spin${i} ${36 + i*6}s linear infinite`;
      svgRings.appendChild(circle);

      const style = document.createElement('style');
      style.textContent = `
      @keyframes spin${i}{
        from{transform:rotate(${i%2===0?0:360}deg) scale(${1 - i*0.002})}
        to{transform:rotate(${i%2===0?360:0}deg) scale(${1 - i*0.002})}
      }`;
      document.head.appendChild(style);
    }

    // Abstract frog motif: subtle radial totems using circles/ellipses only
    for(let k=0;k<6;k++){
      const ang = (Math.PI*2/6)*k - Math.PI/2;
      const rr = 570;
      const x = CX + Math.cos(ang)*rr;
      const y = CY + Math.sin(ang)*rr*1.05;
      const g = document.createElementNS("http://www.w3.org/2000/svg","g");
      g.setAttribute("transform", `translate(${x} ${y}) rotate(${ang*180/Math.PI+90})`);
      g.setAttribute("opacity", "0.14");

      const body = document.createElementNS("http://www.w3.org/2000/svg","ellipse");
      body.setAttribute("cx","0"); body.setAttribute("cy","0");
      body.setAttribute("rx","44"); body.setAttribute("ry","64");
      body.setAttribute("fill", k%2? "#2ca89f":"#f6efe5");

      const eye1 = document.createElementNS("http://www.w3.org/2000/svg","circle");
      eye1.setAttribute("cx","-22"); eye1.setAttribute("cy","-58");
      eye1.setAttribute("r","14"); eye1.setAttribute("fill", "#ff9b32");

      const eye2 = document.createElementNS("http://www.w3.org/2000/svg","circle");
      eye2.setAttribute("cx","22"); eye2.setAttribute("cy","-58");
      eye2.setAttribute("r","14"); eye2.setAttribute("fill", "#ff9b32");

      const leg1 = document.createElementNS("http://www.w3.org/2000/svg","ellipse");
      leg1.setAttribute("cx","-40"); leg1.setAttribute("cy","34");
      leg1.setAttribute("rx","18"); leg1.setAttribute("ry","42");
      leg1.setAttribute("fill", "#d94162");

      const leg2 = document.createElementNS("http://www.w3.org/2000/svg","ellipse");
      leg2.setAttribute("cx","40"); leg2.setAttribute("cy","34");
      leg2.setAttribute("rx","18"); leg2.setAttribute("ry","42");
      leg2.setAttribute("fill", "#d94162");

      const belly = document.createElementNS("http://www.w3.org/2000/svg","ellipse");
      belly.setAttribute("cx","0"); belly.setAttribute("cy","12");
      belly.setAttribute("rx","26"); belly.setAttribute("ry","30");
      belly.setAttribute("fill", "#1f4ea6");

      [body, eye1, eye2, leg1, leg2, belly].forEach(el => g.appendChild(el));
      frogMarks.appendChild(g);
    }
  }

  const dust = [];
  for(let i=0;i<280;i++){
    const a = rand()*Math.PI*2;
    const r = Math.pow(rand(),0.6)*780;
    dust.push({
      a,
      r,
      size: 1 + rand()*4.5,
      c: palette[Math.floor(rand()*palette.length)],
      p: rand()*Math.PI*2
    });
  }

  function drawSpecks(t){
    sctx.clearRect(0,0,W,H);
    for(const d of dust){
      const rr = d.r + Math.sin(t*0.00035 + d.p)*16;
      const x = CX + Math.cos(d.a + t*0.00003*(0.2 + d.size*0.15))*rr;
      const y = CY + Math.sin(d.a + t*0.00003*(0.2 + d.size*0.15))*rr*1.06;
      sctx.globalAlpha = 0.07 + d.size*0.018;
      sctx.fillStyle = d.c;
      sctx.beginPath();
      sctx.arc(x,y,d.size,0,Math.PI*2);
      sctx.fill();
    }
  }

  function drawRings(t){
    rctx.clearRect(0,0,W,H);
    rctx.globalCompositeOperation = "source-over";

    for(let i=0;i<11;i++){
      const pulse = Math.sin(t*0.00022 + i*0.7)*0.5 + 0.5;
      const radius = 130 + i*82 + pulse*22;
      const lw = 26 - i*1.6;
      const grad = rctx.createLinearGradient(CX-radius, CY-radius, CX+radius, CY+radius);
      grad.addColorStop(0, palette[(i+1)%palette.length]);
      grad.addColorStop(.5, palette[(i+4)%palette.length]);
      grad.addColorStop(1, palette[(i+2)%palette.length]);

      rctx.save();
      rctx.translate(CX,CY);
      rctx.rotate(t*0.000045*(i%2?1:-1) + i*0.16);
      rctx.globalAlpha = 0.11 + pulse*0.06;
      rctx.strokeStyle = grad;
      rctx.lineWidth = lw;
      rctx.setLineDash([150 + i*18, 60 + i*10, 90 + i*8, 72 + i*9]);
      rctx.lineDashOffset = t*0.02*(i%2?1:-1);
      rctx.beginPath();
      rctx.ellipse(0,0,radius,radius*(1.02 + 0.02*Math.sin(i+t*0.0003)),0,0,Math.PI*2);
      rctx.stroke();
      rctx.restore();
    }

    // thick radial wedges, painterly
    for(let i=0;i<18;i++){
      const ang = (Math.PI*2/18)*i + t*0.00002*(i%2?1:-1);
      const inner = 110 + 24*Math.sin(t*0.0003+i);
      const outer = 700 + 40*Math.sin(t*0.00018+i*0.7);
      const spread = 0.1 + (i%3)*0.03;
      rctx.save();
      rctx.translate(CX,CY);
      rctx.rotate(ang);
      rctx.globalAlpha = 0.042;
      rctx.fillStyle = palette[(i+3)%palette.length];
      rctx.beginPath();
      rctx.moveTo(Math.cos(-spread)*inner, Math.sin(-spread)*inner);
      rctx.lineTo(Math.cos(spread)*inner, Math.sin(spread)*inner);
      rctx.lineTo(Math.cos(spread*0.55)*outer, Math.sin(spread*0.55)*outer);
      rctx.lineTo(Math.cos(-spread*0.55)*outer, Math.sin(-spread*0.55)*outer);
      rctx.closePath();
      rctx.fill();
      rctx.restore();
    }

    const core = rctx.createRadialGradient(CX,CY,12,CX,CY,170);
    core.addColorStop(0,"rgba(246,239,229,.95)");
    core.addColorStop(.18,"rgba(255,155,50,.78)");
    core.addColorStop(.42,"rgba(217,65,98,.32)");
    core.addColorStop(1,"rgba(217,65,98,0)");
    rctx.fillStyle = core;
    rctx.globalAlpha = 0.75;
    rctx.beginPath();
    rctx.arc(CX,CY,178,0,Math.PI*2);
    rctx.fill();

    rctx.globalAlpha = .28;
    rctx.fillStyle = "#f6efe5";
    rctx.beginPath();
    rctx.arc(CX,CY,28 + Math.sin(t*0.0005)*5,0,Math.PI*2);
    rctx.fill();
  }

  function buildImpasto(){
    const layers = [];
    for(let i=0;i<18;i++){
      const size = 34 + Math.floor(rand()*120);
      const x = 8 + rand()*84;
      const y = 8 + rand()*84;
      const rot = -50 + rand()*100;
      const c = palette[Math.floor(rand()*palette.length)];
      layers.push(`<div style="
        position:absolute;
        left:${x}%; top:${y}%;
        width:${size*1.8}px; height:${size}px;
        background:${c};
        opacity:${0.06 + rand()*0.05};
        border-radius:55% 45% 48% 52% / 58% 42% 60% 40%;
        transform:translate(-50%,-50%) rotate(${rot}deg);
        filter:blur(${6 + rand()*12}px);
      "></div>`);
    }
    impasto.innerHTML = layers.join('');
  }

  paintBackground();
  buildSVG();
  buildImpasto();

  function animate(t){
    drawRings(t);
    drawSpecks(t);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  if (window.self === window.top) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      const ctx = new AudioCtx();
      const master = ctx.createGain();
      master.gain.value = 0.018;
      master.connect(ctx.destination);

      const now = ctx.currentTime;
      const freqs = [146.83, 220, 293.66, 440];
      freqs.forEach((f, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        osc.type = i % 2 ? 'triangle' : 'sine';
        osc.frequency.value = f * (1 + i*0.001);
        gain.gain.value = 0.0;
        lfo.type = 'sine';
        lfo.frequency.value = 0.02 + i*0.007;
        lfoGain.gain.value = 3 + i*1.5;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        osc.connect(gain);
        gain.connect(master);
        gain.gain.setValueAtTime(0.003 + i*0.002, now);
        osc.start(now);
        lfo.start(now);
      });

      const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.2;
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;
      noise.loop = true;
      const nFilter = ctx.createBiquadFilter();
      nFilter.type = 'bandpass';
      nFilter.frequency.value = 540;
      nFilter.Q.value = 0.6;
      const nGain = ctx.createGain();
      nGain.gain.value = 0.0035;
      noise.connect(nFilter);
      nFilter.connect(nGain);
      nGain.connect(master);
      noise.start();
    }
  }
})();
