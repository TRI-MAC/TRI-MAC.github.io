<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generative Art 2026-07-26</title>
<style>
  :root{
    --bg1:#071a3d;
    --bg2:#173d7a;
    --bg3:#f05b2c;
    --gold:#f0c96c;
    --cream:#f6e3ba;
    --red:#d8432e;
    --teal:#54c6cf;
    --navy:#0b1837;
    --ink:#151515;
    --paper:#f4d7a9;
    --rose:#ff7893;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#0a1022;
    overflow:hidden;
    font-family:Georgia, "Times New Roman", serif;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7777778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,230,155,.85) 0%, rgba(255,201,108,.4) 10%, rgba(255,201,108,0) 22%),
      linear-gradient(180deg, #5fa9db 0%, #2b5ea5 24%, #102854 51%, #120f28 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 25px 60px rgba(0,0,0,.45);
  }

  #bgCanvas, #dustCanvas, #collageCanvas{
    position:absolute; inset:0; width:100%; height:100%;
  }
  #bgCanvas{ z-index:1; }
  #collageCanvas{ z-index:4; mix-blend-mode:normal; opacity:.9; }
  #dustCanvas{ z-index:11; pointer-events:none; opacity:.2; }

  .layer{ position:absolute; inset:0; pointer-events:none; }

  #skyGlow{
    z-index:2;
    background:
      radial-gradient(ellipse at 50% 14%, rgba(255,243,197,.65) 0%, rgba(255,220,130,.33) 16%, rgba(255,220,130,0) 34%),
      radial-gradient(ellipse at 20% 28%, rgba(255,114,147,.18) 0%, rgba(255,114,147,0) 26%),
      radial-gradient(ellipse at 80% 36%, rgba(84,198,207,.16) 0%, rgba(84,198,207,0) 24%);
    animation: breatheGlow 24s ease-in-out infinite;
  }

  #perspectiveHall{
    z-index:3;
    opacity:.72;
    background:
      linear-gradient(180deg, rgba(255,243,210,.08), rgba(255,243,210,0) 16%),
      linear-gradient(90deg,
        rgba(255,240,210,.0) 0%,
        rgba(255,240,210,.0) 17%,
        rgba(255,240,210,.1) 17.3%,
        rgba(255,240,210,.0) 17.7%,
        rgba(255,240,210,.0) 32%,
        rgba(255,240,210,.12) 32.3%,
        rgba(255,240,210,.0) 32.7%,
        rgba(255,240,210,.0) 50%,
        rgba(255,240,210,.13) 50.35%,
        rgba(255,240,210,.0) 50.7%,
        rgba(255,240,210,.0) 68%,
        rgba(255,240,210,.12) 68.3%,
        rgba(255,240,210,.0) 68.7%,
        rgba(255,240,210,.0) 83%,
        rgba(255,240,210,.1) 83.3%,
        rgba(255,240,210,.0) 83.7%,
        rgba(255,240,210,.0) 100%);
    mask-image:linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.9) 30%, rgba(0,0,0,.95) 100%);
  }

  #architecture{
    z-index:5;
    opacity:.95;
    mix-blend-mode:screen;
    animation: architectureShift 32s ease-in-out infinite;
  }

  #art-image{
    position:absolute;
    z-index:6;
    width:66%;
    left:18%;
    top:31%;
    opacity:.95;
    transform:rotate(-5deg);
    filter:
      sepia(.32)
      saturate(1.2)
      contrast(1.08)
      hue-rotate(-8deg)
      brightness(1.02)
      drop-shadow(0 16px 24px rgba(10,10,30,.34))
      drop-shadow(0 0 24px rgba(240,201,108,.18));
    box-shadow:0 0 0 1px rgba(255,236,186,.16);
    animation: imageDrift 26s ease-in-out infinite;
  }

  #paperAura{
    z-index:5;
    background:
      radial-gradient(ellipse at 49% 48%, rgba(246,227,186,.15) 0%, rgba(246,227,186,.08) 18%, rgba(246,227,186,0) 34%);
    animation: auraMove 30s ease-in-out infinite;
  }

  .ribbon{
    position:absolute;
    z-index:7;
    border-radius:999px;
    filter:blur(.2px);
    opacity:.95;
    transform-origin:center;
    mask-image:radial-gradient(circle at center, black 0 58%, rgba(0,0,0,.75) 72%, rgba(0,0,0,0) 100%);
  }
  .r1{
    left:-12%; top:42%;
    width:70%; height:14%;
    background:
      linear-gradient(90deg, rgba(216,67,46,0) 0%, rgba(216,67,46,.9) 18%, rgba(240,201,108,.95) 54%, rgba(240,201,108,0) 100%);
    transform:rotate(-20deg);
    animation:ribbon1 18s ease-in-out infinite;
  }
  .r2{
    right:-14%; top:53%;
    width:76%; height:16%;
    background:
      linear-gradient(90deg, rgba(84,198,207,0) 0%, rgba(84,198,207,.92) 22%, rgba(246,227,186,.94) 58%, rgba(246,227,186,0) 100%);
    transform:rotate(16deg);
    animation:ribbon2 20s ease-in-out infinite;
  }
  .r3{
    left:22%; bottom:13%;
    width:52%; height:11%;
    background:
      linear-gradient(90deg, rgba(255,120,147,0) 0%, rgba(255,120,147,.85) 20%, rgba(240,201,108,.9) 62%, rgba(240,201,108,0) 100%);
    transform:rotate(8deg);
    opacity:.72;
    animation:ribbon3 24s ease-in-out infinite;
  }

  #foregroundShapes{
    z-index:8;
    mix-blend-mode:normal;
    animation: fgShift 28s ease-in-out infinite;
  }

  #svgOverlay{
    position:absolute; inset:0;
    z-index:9;
    width:100%; height:100%;
    overflow:visible;
  }

  #vignette{
    z-index:12;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(10,8,18,.12) 74%, rgba(4,4,8,.35) 100%);
    pointer-events:none;
  }

  #date{
    position:absolute;
    z-index:20;
    right:20px;
    bottom:14px;
    color:rgba(255,245,220,.65);
    font-size:16px;
    letter-spacing:.08em;
    text-shadow:0 1px 0 rgba(0,0,0,.3);
  }

  #guinea-pig{
    position:absolute;
    z-index:10;
    width:17px;
    right:118px;
    bottom:212px;
    opacity:.58;
    filter:saturate(.7) contrast(.95) brightness(.72);
    transform:rotate(-8deg);
  }

  @keyframes breatheGlow{
    0%,100%{transform:scale(1) translateY(0)}
    50%{transform:scale(1.04) translateY(-1.2%)}
  }
  @keyframes architectureShift{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(1.2%) scale(1.01)}
  }
  @keyframes imageDrift{
    0%,100%{transform:translate(0,0) rotate(-5deg) scale(1)}
    50%{transform:translate(-1.4%,1.2%) rotate(-3.7deg) scale(1.018)}
  }
  @keyframes auraMove{
    0%,100%{transform:translateX(0) scale(1)}
    50%{transform:translateX(1.5%) scale(1.03)}
  }
  @keyframes ribbon1{
    0%,100%{transform:rotate(-20deg) translateX(0) scaleX(1)}
    50%{transform:rotate(-17deg) translateX(4%) scaleX(1.05)}
  }
  @keyframes ribbon2{
    0%,100%{transform:rotate(16deg) translateX(0) scaleX(1)}
    50%{transform:rotate(13deg) translateX(-3%) scaleX(1.04)}
  }
  @keyframes ribbon3{
    0%,100%{transform:rotate(8deg) translateY(0)}
    50%{transform:rotate(10deg) translateY(-6%)}
  }
  @keyframes fgShift{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(1.1%)}
  }

  .grain{
    position:absolute; inset:-10%;
    z-index:13;
    opacity:.085;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.8) .4px, transparent .8px),
      radial-gradient(circle at 70% 45%, rgba(0,0,0,.8) .5px, transparent .9px),
      radial-gradient(circle at 40% 80%, rgba(255,255,255,.55) .4px, transparent .8px);
    background-size:9px 9px, 11px 11px, 13px 13px;
    mix-blend-mode:overlay;
    animation:grainShift 7s steps(4) infinite;
  }
  @keyframes grainShift{
    0%{transform:translate(0,0)}
    25%{transform:translate(-1%,.6%)}
    50%{transform:translate(.8%,-.5%)}
    75%{transform:translate(-.6%,.8%)}
    100%{transform:translate(0,0)}
  }
</style>
</head>
<body>
  <div id="frame">
    <canvas id="bgCanvas" width="1080" height="1920"></canvas>
    <div id="skyGlow" class="layer"></div>
    <div id="perspectiveHall" class="layer"></div>
    <canvas id="collageCanvas" width="1080" height="1920"></canvas>
    <div id="paperAura" class="layer"></div>

    <img id="art-image" src="art.png" alt="" />

    <svg id="architecture" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="archGold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff0bf" stop-opacity=".9"/>
          <stop offset="45%" stop-color="#f0c96c" stop-opacity=".75"/>
          <stop offset="100%" stop-color="#c07a3f" stop-opacity=".18"/>
        </linearGradient>
        <linearGradient id="roseGold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff9fb3" stop-opacity=".75"/>
          <stop offset="100%" stop-color="#f0c96c" stop-opacity=".45"/>
        </linearGradient>
        <radialGradient id="halo" cx="50%" cy="20%" r="45%">
          <stop offset="0%" stop-color="#fff3cf" stop-opacity=".95"/>
          <stop offset="28%" stop-color="#f0c96c" stop-opacity=".42"/>
          <stop offset="65%" stop-color="#f0c96c" stop-opacity="0"/>
        </radialGradient>
        <mask id="fadeTop">
          <rect width="1080" height="1920" fill="url(#maskGrad)"/>
        </mask>
        <linearGradient id="maskGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="black" stop-opacity="0"/>
          <stop offset="12%" stop-color="black" stop-opacity=".9"/>
          <stop offset="88%" stop-color="black" stop-opacity=".95"/>
          <stop offset="100%" stop-color="black" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <g opacity=".78" mask="url(#fadeTop)">
        <circle cx="540" cy="335" r="260" fill="url(#halo)"/>
        <path d="M540 210 L600 330 L735 345 L628 430 L660 565 L540 495 L420 565 L452 430 L345 345 L480 330 Z"
              fill="url(#archGold)" opacity=".82"/>
        <g opacity=".52">
          <path d="M190 730 L540 220 L890 730" fill="none" stroke="url(#archGold)" stroke-width="18"/>
          <path d="M280 730 L540 350 L800 730" fill="none" stroke="url(#roseGold)" stroke-width="10"/>
          <path d="M120 880 L540 280 L960 880" fill="none" stroke="url(#archGold)" stroke-width="7" opacity=".8"/>
        </g>
        <g opacity=".55">
          <rect x="198" y="730" width="30" height="580" fill="url(#archGold)"/>
          <rect x="852" y="730" width="30" height="580" fill="url(#archGold)"/>
          <rect x="332" y="638" width="26" height="730" fill="url(#roseGold)"/>
          <rect x="722" y="638" width="26" height="730" fill="url(#roseGold)"/>
        </g>
        <g opacity=".32">
          <polygon points="540,560 620,700 460,700" fill="#f6e3ba"/>
          <polygon points="540,640 655,840 425,840" fill="#ff7893" opacity=".5"/>
        </g>
      </g>
    </svg>

    <div class="ribbon r1"></div>
    <div class="ribbon r2"></div>
    <div class="ribbon r3"></div>

    <svg id="svgOverlay" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="sunRay" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff2c6" stop-opacity=".85"/>
          <stop offset="55%" stop-color="#f0c96c" stop-opacity=".42"/>
          <stop offset="100%" stop-color="#f0c96c" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="rocketGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff3d3"/>
          <stop offset="60%" stop-color="#f1c65a"/>
          <stop offset="100%" stop-color="#d74f35"/>
        </linearGradient>
        <filter id="soften">
          <feGaussianBlur stdDeviation="1.4"/>
        </filter>
      </defs>

      <g opacity=".7">
        <polygon points="540,240 560,820 520,820" fill="url(#sunRay)"/>
        <polygon points="540,240 670,800 630,808" fill="url(#sunRay)" opacity=".6"/>
        <polygon points="540,240 450,800 410,790" fill="url(#sunRay)" opacity=".55"/>
      </g>

      <g id="foregroundShapes">
        <path d="M64 1455 L325 1245 L410 1300 L178 1548 Z" fill="#d8432e" opacity=".94"/>
        <path d="M755 1188 L1030 1325 L952 1495 L682 1354 Z" fill="#54c6cf" opacity=".82"/>
        <path d="M188 1640 L548 1445 L785 1540 L406 1758 Z" fill="#f0c96c" opacity=".88"/>
        <path d="M580 1035 L754 925 L890 1038 L710 1162 Z" fill="#f6e3ba" opacity=".64"/>
        <path d="M810 370 L910 538 L798 608 L710 446 Z" fill="#ff7893" opacity=".52"/>
        <g transform="translate(738,682) rotate(23)">
          <ellipse cx="0" cy="0" rx="56" ry="132" fill="url(#rocketGrad)" />
          <circle cx="0" cy="-72" r="22" fill="#fff3d3"/>
          <rect x="-14" y="-14" width="28" height="40" rx="14" fill="#1d487e"/>
          <polygon points="-56,24 -104,84 -44,74" fill="#d8432e"/>
          <polygon points="56,24 104,84 44,74" fill="#d8432e"/>
          <polygon points="-18,124 0,196 18,124" fill="#f6e3ba" opacity=".86" filter="url(#soften)"/>
        </g>
        <g transform="translate(298,930) rotate(-19) scale(.82)">
          <ellipse cx="0" cy="0" rx="46" ry="112" fill="url(#rocketGrad)" />
          <circle cx="0" cy="-62" r="18" fill="#fff3d3"/>
          <rect x="-11" y="-12" width="22" height="34" rx="11" fill="#1d487e"/>
          <polygon points="-46,18 -84,66 -36,58" fill="#54c6cf"/>
          <polygon points="46,18 84,66 36,58" fill="#54c6cf"/>
          <polygon points="-14,106 0,165 14,106" fill="#f6e3ba" opacity=".74" filter="url(#soften)"/>
        </g>
      </g>
    </svg>

    <img id="guinea-pig" src="guineapig.png" alt="" />
    <canvas id="dustCanvas" width="1080" height="1920"></canvas>
    <div class="grain"></div>
    <div id="vignette" class="layer"></div>
    <div id="date">2026-07-26</div>
  </div>

<script>
(() => {
  const SEED = 20260726;
  function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;}}
  const rand = mulberry32(SEED);

  const bg = document.getElementById('bgCanvas');
  const bctx = bg.getContext('2d');
  const collage = document.getElementById('collageCanvas');
  const cctx = collage.getContext('2d');
  const dust = document.getElementById('dustCanvas');
  const dctx = dust.getContext('2d');
  const W = bg.width, H = bg.height;

  const stars = [];
  for(let i=0;i<180;i++){
    stars.push({
      x: rand()*W,
      y: rand()*H*0.62,
      r: rand()*2.4 + 0.3,
      a: rand()*0.7 + 0.2,
      hue: rand() < 0.18 ? 190 : (rand() < 0.36 ? 345 : 45),
      phase: rand()*Math.PI*2
    });
  }

  const dots = [];
  for(let i=0;i<950;i++){
    const band = Math.floor(rand()*6);
    dots.push({
      x: rand()*W,
      y: 250 + band*235 + rand()*180,
      r: rand()*5+2,
      c: ["#f0c96c","#ff7893","#54c6cf","#f6e3ba","#d8432e"][Math.floor(rand()*5)],
      o: rand()*0.16 + 0.04
    });
  }

  const paperBits = [];
  for(let i=0;i<22;i++){
    paperBits.push({
      x: rand()*W,
      y: 220 + rand()*(H-380),
      w: 120 + rand()*260,
      h: 60 + rand()*180,
      rot: (rand()*2-1)*0.55,
      color: ["rgba(244,215,169,0.18)","rgba(255,120,147,0.12)","rgba(84,198,207,0.12)","rgba(240,201,108,0.16)"][Math.floor(rand()*4)]
    });
  }

  function drawGeckoStamp(ctx, x, y, s, rot, alpha){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.scale(s,s);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#1a274c";
    ctx.beginPath();
    ctx.ellipse(0,0,38,16,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(40,-2,10,0,Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-28,-10); ctx.lineTo(-58,-28); ctx.lineTo(-52,-36); ctx.lineTo(-18,-14); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-20,12); ctx.lineTo(-48,36); ctx.lineTo(-42,44); ctx.lineTo(-8,18); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(8,-11); ctx.lineTo(36,-34); ctx.lineTo(44,-28); ctx.lineTo(18,-10); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(18,11); ctx.lineTo(50,30); ctx.lineTo(42,38); ctx.lineTo(8,16); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-38,-2); ctx.lineTo(-98,-16); ctx.lineTo(-108,-8); ctx.lineTo(-58,2); ctx.lineTo(-100,18); ctx.lineTo(-90,25); ctx.lineTo(-40,8); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawBackground(t){
    bctx.clearRect(0,0,W,H);

    const g1 = bctx.createLinearGradient(0,0,0,H);
    g1.addColorStop(0,"#67b4e2");
    g1.addColorStop(.23,"#2c62aa");
    g1.addColorStop(.54,"#122f64");
    g1.addColorStop(1,"#130e25");
    bctx.fillStyle = g1;
    bctx.fillRect(0,0,W,H);

    const rg = bctx.createRadialGradient(W*0.5, 300 + Math.sin(t*0.00015)*20, 40, W*0.5, 300, 480);
    rg.addColorStop(0,"rgba(255,245,214,0.95)");
    rg.addColorStop(.16,"rgba(255,213,122,0.62)");
    rg.addColorStop(.38,"rgba(255,120,147,0.18)");
    rg.addColorStop(1,"rgba(255,120,147,0)");
    bctx.fillStyle = rg;
    bctx.fillRect(0,0,W,H);

    for(const s of stars){
      const a = s.a * (0.75 + 0.25*Math.sin(t*0.0004 + s.phase));
      bctx.fillStyle = `hsla(${s.hue}, 90%, 80%, ${a})`;
      bctx.beginPath();
      bctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      bctx.fill();
    }

    bctx.save();
    bctx.translate(W/2,H*0.66);
    bctx.scale(1,0.78);
    for(let i=0;i<12;i++){
      const r = 120 + i*78 + Math.sin(t*0.00018 + i)*8;
      bctx.strokeStyle = i%2===0 ? `rgba(240,201,108,${0.2-i*0.012})` : `rgba(246,227,186,${0.13-i*0.01})`;
      bctx.lineWidth = i<2 ? 8 : 4;
      bctx.beginPath();
      bctx.arc(0,0,r,Math.PI*1.03,Math.PI*1.97);
      bctx.stroke();
    }
    bctx.restore();

    bctx.fillStyle = "rgba(14,18,34,.72)";
    bctx.beginPath();
    bctx.moveTo(0,H);
    bctx.lineTo(0,1320);
    bctx.lineTo(180,1260);
    bctx.lineTo(320,1310);
    bctx.lineTo(470,1228);
    bctx.lineTo(650,1298);
    bctx.lineTo(810,1205);
    bctx.lineTo(1080,1315);
    bctx.lineTo(1080,H);
    bctx.closePath();
    bctx.fill();

    const floorG = bctx.createLinearGradient(0,1220,0,H);
    floorG.addColorStop(0,"rgba(244,215,169,0.03)");
    floorG.addColorStop(1,"rgba(244,215,169,0.22)");
    bctx.fillStyle = floorG;
    bctx.beginPath();
    bctx.moveTo(0,H);
    bctx.lineTo(0,1380);
    bctx.lineTo(W/2,1120);
    bctx.lineTo(W,1380);
    bctx.lineTo(W,H);
    bctx.closePath();
    bctx.fill();

    bctx.strokeStyle = "rgba(255,240,210,.18)";
    bctx.lineWidth = 2;
    for(let i=0;i<=10;i++){
      const y = 1220 + i*70;
      bctx.beginPath();
      bctx.moveTo(140 + i*8, y);
      bctx.lineTo(W-140 - i*8, y);
      bctx.stroke();
    }
    for(let i=0;i<=8;i++){
      const x = 190 + i*87;
      bctx.beginPath();
      bctx.moveTo(x,1230);
      bctx.lineTo(W/2 + (x-W/2)*0.25, H);
      bctx.stroke();
    }

    bctx.save();
    bctx.globalAlpha = .22;
    drawGeckoStamp(bctx, 870, 1430, 1.4, -0.33, 1);
    drawGeckoStamp(bctx, 214, 1512, 1.05, 0.18, 1);
    bctx.restore();
  }

  function drawCollage(t){
    cctx.clearRect(0,0,W,H);
    cctx.save();

    for(const p of paperBits){
      cctx.save();
      const drift = Math.sin(t*0.00014 + p.x*0.01)*9;
      cctx.translate(p.x + drift, p.y);
      cctx.rotate(p.rot + Math.sin(t*0.0001 + p.y*0.01)*0.02);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      cctx.strokeStyle = "rgba(255,245,220,0.12)";
      cctx.lineWidth = 2;
      cctx.strokeRect(-p.w/2,-p.h/2,p.w,p.h);
      cctx.restore();
    }

    for(const d of dots){
      cctx.fillStyle = d.c;
      cctx.globalAlpha = d.o;
      cctx.beginPath();
      cctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
      cctx.fill();
    }

    cctx.globalAlpha = .75;
    cctx.fillStyle = "rgba(246,227,186,0.18)";
    cctx.beginPath();
    cctx.moveTo(82,900);
    cctx.lineTo(258,830);
    cctx.lineTo(362,960);
    cctx.lineTo(184,1048);
    cctx.closePath();
    cctx.fill();

    cctx.fillStyle = "rgba(216,67,46,0.24)";
    cctx.beginPath();
    cctx.moveTo(694,836);
    cctx.lineTo(1008,878);
    cctx.lineTo(952,1070);
    cctx.lineTo(660,1015);
    cctx.closePath();
    cctx.fill();

    cctx.fillStyle = "rgba(84,198,207,0.17)";
    cctx.beginPath();
    cctx.moveTo(362,1422);
    cctx.lineTo(662,1280);
    cctx.lineTo(860,1438);
    cctx.lineTo(520,1560);
    cctx.closePath();
    cctx.fill();

    cctx.restore();
  }

  const dustPoints = [];
  for(let i=0;i<90;i++){
    dustPoints.push({
      x: rand()*W,
      y: rand()*H,
      r: rand()*2.5+0.5,
      vy: 0.08 + rand()*0.22,
      phase: rand()*6.28
    });
  }

  function drawDust(t){
    dctx.clearRect(0,0,W,H);
    for(const p of dustPoints){
      let y = (p.y + (t*0.02*p.vy)) % (H+20);
      dctx.fillStyle = `rgba(255,235,190,${0.12 + 0.08*Math.sin(t*0.001+p.phase)})`;
      dctx.beginPath();
      dctx.arc(p.x + Math.sin(t*0.0007+p.phase)*6, y, p.r, 0, Math.PI*2);
      dctx.fill();
    }
  }

  let start;
  function frame(ts){
    if(!start) start = ts;
    const t = ts - start;
    drawBackground(t);
    drawCollage(t);
    drawDust(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if (window.self === window.top) {
    try{
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioContext();
      const master = ctx.createGain();
      master.gain.value = 0.018;
      master.connect(ctx.destination);

      const now = ctx.currentTime;

      function makeVoice(freq, type, gainVal, lfoRate){
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();

        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = gainVal;

        lfo.type = "sine";
        lfo.frequency.value = lfoRate;
        lfoGain.gain.value = freq * 0.015;

        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        osc.connect(gain);
        gain.connect(master);

        osc.start(now);
        lfo.start(now);
      }

      makeVoice(110, "sine", 0.25, 0.03);
      makeVoice(164.81, "triangle", 0.16, 0.05);
      makeVoice(247.2, "sine", 0.08, 0.02);

      const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1)*0.14;
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;
      noise.loop = true;

      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = "bandpass";
      noiseFilter.frequency.value = 900;
      noiseFilter.Q.value = 0.9;

      const noiseGain = ctx.createGain();
      noiseGain.gain.value = 0.003;

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(master);
      noise.start(now);

      const sweep = () => {
        const t0 = ctx.currentTime;
        noiseFilter.frequency.cancelScheduledValues(t0);
        noiseFilter.frequency.linearRampToValueAtTime(650, t0 + 8);
        noiseFilter.frequency.linearRampToValueAtTime(1200, t0 + 18);
        noiseFilter.frequency.linearRampToValueAtTime(800, t0 + 30);
      };
      sweep();
      setInterval(sweep, 30000);
    }catch(e){}
  }
})();
</script>
