<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>2026-03-27</title>
<style>
  :root{
    --bg:#0f0f12;
    --ink:#111114;
    --hot1:#ff5a1f;
    --hot2:#ffd22e;
    --hot3:#00d8ff;
    --hot4:#ff2aa3;
    --acid:#9cff2f;
    --paper:#f5ead2;
    --concrete:#c3b8aa;
    --shadow:#1a1a20;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#08090b;
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7777778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(120% 80% at 20% 10%, rgba(255,90,31,.12), transparent 40%),
      radial-gradient(90% 70% at 80% 22%, rgba(0,216,255,.10), transparent 45%),
      linear-gradient(180deg, #3b332d 0%, #231f21 28%, #131418 58%, #0d0f12 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 40px 120px rgba(0,0,0,.6);
  }

  .layer, canvas, svg, .wall, .paint, .tape, .date, #guinea-pig { position:absolute; inset:0; }

  .wall{
    background:
      linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.08)),
      repeating-linear-gradient(90deg,
        rgba(255,255,255,.018) 0 1px,
        transparent 1px 90px,
        rgba(0,0,0,.022) 90px 91px,
        transparent 91px 182px),
      repeating-linear-gradient(180deg,
        rgba(255,255,255,.012) 0 1px,
        transparent 1px 68px,
        rgba(0,0,0,.022) 68px 69px,
        transparent 69px 138px);
    filter:contrast(1.05) saturate(.95);
  }

  #murals{
    mix-blend-mode:screen;
    opacity:.96;
  }

  #texture{
    opacity:.3;
    mix-blend-mode:overlay;
  }

  #drips{
    opacity:.95;
  }

  .sticker{
    position:absolute;
    background:var(--paper);
    box-shadow:
      0 8px 24px rgba(0,0,0,.26),
      0 1px 0 rgba(255,255,255,.18) inset;
    border-radius:3px;
    overflow:hidden;
    transform-origin:center;
  }
  .sticker::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.22), transparent 25%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.018) 0 1px, transparent 1px 6px);
    opacity:.45;
    pointer-events:none;
  }
  .sticker::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(140deg, transparent 0 64%, rgba(0,0,0,.08) 72%, transparent 83%);
    pointer-events:none;
    opacity:.6;
  }

  .cut{
    position:absolute;
    inset:10%;
    background:transparent;
  }

  .s1{
    left:8%;
    top:10%;
    width:39%;
    height:28%;
    transform:rotate(-8deg);
    animation:posterShift1 33s ease-in-out infinite;
  }
  .s2{
    right:7%;
    top:22%;
    width:34%;
    height:20%;
    transform:rotate(6deg);
    animation:posterShift2 27s ease-in-out infinite;
  }
  .s3{
    left:13%;
    bottom:18%;
    width:30%;
    height:18%;
    transform:rotate(10deg);
    animation:posterShift3 38s ease-in-out infinite;
  }
  .s4{
    right:11%;
    bottom:12%;
    width:42%;
    height:24%;
    transform:rotate(-5deg);
    animation:posterShift4 31s ease-in-out infinite;
  }

  @keyframes posterShift1{
    0%,100%{transform:rotate(-8deg) translateY(0) scale(1)}
    50%{transform:rotate(-6deg) translateY(-8px) scale(1.015)}
  }
  @keyframes posterShift2{
    0%,100%{transform:rotate(6deg) translateX(0)}
    50%{transform:rotate(4deg) translateX(-7px)}
  }
  @keyframes posterShift3{
    0%,100%{transform:rotate(10deg) translateY(0)}
    50%{transform:rotate(12deg) translateY(6px)}
  }
  @keyframes posterShift4{
    0%,100%{transform:rotate(-5deg) scale(1)}
    50%{transform:rotate(-3deg) scale(1.02)}
  }

  .tape{
    width:72px;
    height:20px;
    background:rgba(215,205,165,.22);
    border:1px solid rgba(255,255,255,.06);
    backdrop-filter:blur(1px);
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    position:absolute;
    inset:auto;
    transform:rotate(var(--r));
  }
  .tape.t1{ left:12px; top:8px; --r:-11deg; }
  .tape.t2{ right:14px; top:10px; --r:14deg; }
  .tape.t3{ left:18px; bottom:12px; --r:8deg; opacity:.65;}
  .tape.t4{ right:20px; bottom:16px; --r:-9deg; opacity:.55;}

  .date{
    inset:auto 18px 14px auto;
    color:rgba(255,255,255,.36);
    font-size:13px;
    letter-spacing:.14em;
    z-index:20;
    mix-blend-mode:screen;
    user-select:none;
  }

  #guinea-pig{
    inset:auto;
    width:18px;
    height:auto;
    left:14px;
    bottom:210px;
    opacity:.56;
    filter:brightness(.76) saturate(.85);
    z-index:9;
    transform:rotate(-2deg);
  }

  .shadow-edge{
    position:absolute;
    left:0; right:0; bottom:0; height:34%;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,.28) 35%, rgba(0,0,0,.5));
    pointer-events:none;
    z-index:8;
  }

  .top-fog{
    position:absolute;
    left:0; right:0; top:0; height:24%;
    background:linear-gradient(180deg, rgba(255,235,160,.05), transparent);
    mix-blend-mode:screen;
    opacity:.5;
    pointer-events:none;
  }
</style>
</head>
<body>
  <div id="frame">
    <div class="wall"></div>
    <canvas id="murals" width="1080" height="1920"></canvas>
    <canvas id="texture" width="1080" height="1920"></canvas>

    <div class="sticker s1">
      <div class="tape t1"></div><div class="tape t2"></div>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="cut">
        <rect width="100" height="100" fill="#efe1c2"/>
        <path d="M10 62 C24 20, 52 10, 82 22 C70 30, 64 42, 66 52 C69 70, 52 82, 26 80 Z"
          fill="#ff4d27"/>
        <path d="M7 60 C26 34, 52 30, 88 18" stroke="#121212" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M18 72 C42 67, 56 58, 76 35" stroke="#00d8ff" stroke-width="5" fill="none" opacity=".9"/>
        <circle cx="34" cy="44" r="8" fill="#111"/>
        <circle cx="34" cy="44" r="3" fill="#ffd22e"/>
        <path d="M4 86 L96 86" stroke="#111" stroke-width="7" opacity=".13"/>
      </svg>
    </div>

    <div class="sticker s2">
      <div class="tape t1"></div><div class="tape t2"></div>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="cut">
        <rect width="100" height="100" fill="#f3e8d3"/>
        <path d="M8 34 L47 14 L87 34 L52 56 Z" fill="#111"/>
        <path d="M18 72 C20 48, 44 42, 59 55 C70 64, 77 74, 86 78" stroke="#ff2aa3" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M10 25 L90 25" stroke="#00d8ff" stroke-width="3" opacity=".65"/>
        <path d="M12 82 L92 16" stroke="#ffd22e" stroke-width="7" opacity=".8"/>
      </svg>
    </div>

    <div class="sticker s3">
      <div class="tape t1"></div>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="cut">
        <rect width="100" height="100" fill="#ede2c8"/>
        <path d="M16 20 C38 10, 70 12, 83 33 C63 30, 48 42, 45 59 C42 75, 26 84, 14 78 Z" fill="#9cff2f"/>
        <path d="M14 18 C33 26, 42 42, 44 59" stroke="#111" stroke-width="5" fill="none"/>
        <path d="M56 18 C72 26, 84 44, 90 70" stroke="#ff5a1f" stroke-width="7" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="sticker s4">
      <div class="tape t2"></div><div class="tape t4"></div>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="cut">
        <rect width="100" height="100" fill="#efe4cf"/>
        <path d="M10 50 C22 20, 54 8, 88 24 C72 32, 60 48, 56 72 C38 71, 19 65, 10 50 Z" fill="#00d8ff"/>
        <path d="M18 64 C38 46, 56 42, 82 30" stroke="#111114" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M16 78 C34 80, 55 73, 82 56" stroke="#ff2aa3" stroke-width="8" fill="none" opacity=".9"/>
        <circle cx="72" cy="24" r="7" fill="#ffd22e"/>
      </svg>
    </div>

    <svg id="drips" viewBox="0 0 1080 1920" preserveAspectRatio="none">
      <defs>
        <linearGradient id="dripA" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff5a1f" stop-opacity=".95"/>
          <stop offset="100%" stop-color="#ff2a6c" stop-opacity=".25"/>
        </linearGradient>
        <linearGradient id="dripB" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#00d8ff" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#004e73" stop-opacity=".12"/>
        </linearGradient>
        <filter id="blurSoft"><feGaussianBlur stdDeviation="1.8"/></filter>
      </defs>

      <g opacity=".78">
        <path id="d1" d="M138 250 C150 340, 138 438, 148 560 C154 624, 170 730, 168 820 C167 900, 126 934, 124 992 C121 1060, 154 1114, 150 1170"
              stroke="url(#dripA)" stroke-width="14" fill="none" stroke-linecap="round" filter="url(#blurSoft)"/>
        <path id="d2" d="M880 178 C898 270, 894 374, 904 508 C911 600, 946 720, 943 820 C940 932, 910 980, 917 1096"
              stroke="url(#dripB)" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#blurSoft)"/>
        <path id="d3" d="M520 112 C522 210, 542 320, 548 442 C554 560, 517 602, 522 700"
              stroke="url(#dripA)" stroke-width="9" fill="none" stroke-linecap="round" opacity=".65"/>
        <path id="d4" d="M286 1060 C292 1140, 312 1204, 312 1286 C312 1396, 272 1445, 276 1538"
              stroke="url(#dripB)" stroke-width="10" fill="none" stroke-linecap="round" opacity=".62"/>
      </g>
    </svg>

    <div class="top-fog"></div>
    <div class="shadow-edge"></div>
    <img id="guinea-pig" src="img/guineapig.adca729e.png" alt="" />
    <div class="date">2026-03-27</div>
  </div>

<script>
(() => {
  const seedStr = "2026-03-27";
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = ((seed * 131) + seedStr.charCodeAt(i)) >>> 0;
  function rand() {
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >> 17; seed >>>= 0;
    seed ^= seed << 5; seed >>>= 0;
    return (seed >>> 0) / 4294967296;
  }
  function lerp(a,b,t){ return a+(b-a)*t; }

  const mural = document.getElementById('murals');
  const mctx = mural.getContext('2d');

  const tex = document.getElementById('texture');
  const tctx = tex.getContext('2d');

  const W = mural.width, H = mural.height;
  const palette = ["#ff5a1f","#ffd22e","#00d8ff","#ff2aa3","#9cff2f","#fff1d4","#111114"];

  const arcs = [];
  const ribbons = [];
  const sprays = [];
  const blocks = [];

  for(let i=0;i<11;i++){
    arcs.push({
      x: rand()*W,
      y: rand()*H*.86 + H*.04,
      r: lerp(120,430,rand()),
      start: rand()*Math.PI*2,
      len: lerp(.6,1.7,rand()),
      width: lerp(16,62,rand()),
      color: palette[(i+Math.floor(rand()*palette.length))%palette.length],
      alpha: lerp(.16,.72,rand()),
      speed: lerp(.0008,.0022,rand()) * (rand()>.5?1:-1)
    });
  }

  for(let i=0;i<8;i++){
    ribbons.push({
      x: rand()*W,
      y: rand()*H,
      h: lerp(280,760,rand()),
      w: lerp(90,220,rand()),
      tilt: lerp(-.45,.45,rand()),
      color: palette[Math.floor(rand()*5)],
      alpha: lerp(.08,.18,rand()),
      phase: rand()*Math.PI*2
    });
  }

  for(let i=0;i<9;i++){
    blocks.push({
      x: rand()*W*.92,
      y: rand()*H*.92,
      w: lerp(120,340,rand()),
      h: lerp(60,180,rand()),
      rot: lerp(-.5,.5,rand()),
      color: palette[Math.floor(rand()*palette.length)],
      alpha: lerp(.06,.12,rand())
    });
  }

  for(let i=0;i<18;i++){
    sprays.push({
      x: rand()*W,
      y: rand()*H,
      r: lerp(30,130,rand()),
      color: palette[Math.floor(rand()*6)],
      alpha: lerp(.06,.18,rand()),
      drift: lerp(-12,12,rand()),
      phase: rand()*Math.PI*2
    });
  }

  function drawTexture(time){
    tctx.clearRect(0,0,W,H);
    tctx.fillStyle = "rgba(255,255,255,0.028)";
    for(let i=0;i<1800;i++){
      const x = rand()*W, y = rand()*H;
      const s = rand()*2+0.4;
      tctx.fillRect(x,y,s,s);
    }

    for(let i=0;i<34;i++){
      const y = (i/34)*H + Math.sin(time*0.00014+i)*8;
      tctx.fillStyle = i%2 ? "rgba(255,255,255,0.024)" : "rgba(0,0,0,0.03)";
      tctx.fillRect(0,y,W,2);
    }

    for(let i=0;i<90;i++){
      const x = rand()*W;
      const y = rand()*H;
      const w = rand()*140+40;
      const h = rand()*6+1;
      tctx.fillStyle = "rgba(255,255,255,0.028)";
      tctx.fillRect(x,y,w,h);
    }
  }

  function drawMural(time){
    mctx.clearRect(0,0,W,H);

    const grad = mctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,"rgba(255,180,60,.06)");
    grad.addColorStop(.3,"rgba(255,80,0,.03)");
    grad.addColorStop(.65,"rgba(0,0,0,0)");
    grad.addColorStop(1,"rgba(0,0,0,.08)");
    mctx.fillStyle = grad;
    mctx.fillRect(0,0,W,H);

    blocks.forEach((b,idx)=>{
      mctx.save();
      mctx.translate(b.x,b.y);
      mctx.rotate(b.rot + Math.sin(time*0.00015 + idx)*0.05);
      mctx.fillStyle = hexToRgba(b.color, b.alpha);
      mctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      mctx.restore();
    });

    ribbons.forEach((r,idx)=>{
      const sway = Math.sin(time*0.00018 + r.phase)*18;
      mctx.save();
      mctx.translate(r.x + sway, r.y);
      mctx.rotate(r.tilt + Math.sin(time*0.00009 + idx)*0.03);
      const g = mctx.createLinearGradient(0,-r.h/2,0,r.h/2);
      g.addColorStop(0, hexToRgba(r.color,0));
      g.addColorStop(.2, hexToRgba(r.color,r.alpha*.8));
      g.addColorStop(.5, hexToRgba(r.color,r.alpha));
      g.addColorStop(1, hexToRgba(r.color,0));
      mctx.fillStyle = g;
      mctx.beginPath();
      mctx.moveTo(-r.w*.35,-r.h*.5);
      mctx.quadraticCurveTo(r.w*.65, -r.h*.15, 0, r.h*.5);
      mctx.quadraticCurveTo(-r.w*.75, r.h*.08, -r.w*.35,-r.h*.5);
      mctx.closePath();
      mctx.fill();
      mctx.restore();
    });

    arcs.forEach((a,idx)=>{
      mctx.save();
      mctx.translate(a.x,a.y);
      mctx.rotate(Math.sin(time*a.speed + idx)*0.2);
      mctx.strokeStyle = hexToRgba(a.color, a.alpha);
      mctx.lineWidth = a.width;
      mctx.lineCap = "round";
      mctx.beginPath();
      mctx.arc(0,0,a.r, a.start + Math.sin(time*0.00009+idx)*0.2, a.start+a.len);
      mctx.stroke();

      mctx.strokeStyle = hexToRgba("#111114", a.alpha*.18);
      mctx.lineWidth = Math.max(2,a.width*.12);
      mctx.beginPath();
      mctx.arc(0,0,a.r + a.width*.22, a.start+.1, a.start+a.len-.08);
      mctx.stroke();
      mctx.restore();
    });

    sprays.forEach((s,idx)=>{
      const pulse = 0.72 + 0.28*Math.sin(time*0.0005 + s.phase);
      const x = s.x + Math.sin(time*0.00013 + idx)*s.drift;
      const y = s.y + Math.cos(time*0.00011 + idx)*s.drift*.4;
      const rg = mctx.createRadialGradient(x,y,0,x,y,s.r);
      rg.addColorStop(0, hexToRgba(s.color,s.alpha*pulse));
      rg.addColorStop(.32, hexToRgba(s.color,s.alpha*.45*pulse));
      rg.addColorStop(1, hexToRgba(s.color,0));
      mctx.fillStyle = rg;
      mctx.beginPath();
      mctx.arc(x,y,s.r,0,Math.PI*2);
      mctx.fill();

      for(let j=0;j<18;j++){
        const ang = j * 0.349 + idx;
        const rr = s.r*(0.35 + ((j*13)%10)/10);
        const px = x + Math.cos(ang)*rr*(0.6+0.5*Math.sin(time*0.0002+idx));
        const py = y + Math.sin(ang)*rr;
        mctx.fillStyle = hexToRgba(s.color, s.alpha*.22);
        mctx.fillRect(px,py,2+(j%3),2+(j%3));
      }
    });

    // tag-like strokes
    mctx.save();
    mctx.globalAlpha = .18;
    mctx.strokeStyle = "#f7ead5";
    mctx.lineWidth = 7;
    mctx.lineCap = "round";
    mctx.beginPath();
    mctx.moveTo(120,1460);
    mctx.bezierCurveTo(260,1380,320,1500,420,1440);
    mctx.bezierCurveTo(500,1390,620,1330,790,1400);
    mctx.bezierCurveTo(860,1430,930,1490,1000,1470);
    mctx.stroke();

    mctx.beginPath();
    mctx.moveTo(100,690);
    mctx.bezierCurveTo(220,630,270,760,410,700);
    mctx.bezierCurveTo(500,660,610,580,780,640);
    mctx.stroke();
    mctx.restore();
  }

  function hexToRgba(hex,a){
    const h = hex.replace("#","");
    const n = parseInt(h,16);
    const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    return `rgba(${r},${g},${b},${a})`;
  }

  const dripEls = [
    document.getElementById('d1'),
    document.getElementById('d2'),
    document.getElementById('d3'),
    document.getElementById('d4')
  ];

  function animate(t){
    drawMural(t);
    if((t|0)%1200 < 20) drawTexture(t);

    dripEls.forEach((el,i)=>{
      const offset = Math.sin(t*0.00018 + i)*18 + Math.cos(t*0.00011 + i*2)*10;
      el.style.transform = `translateY(${offset}px)`;
    });

    requestAnimationFrame(animate);
  }

  drawTexture(0);
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
