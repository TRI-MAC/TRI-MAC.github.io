<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="utf-8">
<title>Web, Strand by Strand</title>
<style>
  html,body{margin:0;padding:0;background:#0b0f1c;overflow:hidden;}
  #stage{
    position:relative;
    width:1080px;height:1920px;
    margin:0 auto;
    background:#141033;
    overflow:hidden;
    transform-origin:top center;
  }
  /* ---- painted DOM sky: flat Bauhaus fields, indigo ground ---- */
  #sky{
    position:absolute;left:0;top:0;width:1080px;height:1000px;
    background:
      linear-gradient(180deg,#0f0d2b 0%,#191540 46%,#20194a 72%,#2a1c46 100%);
  }
  /* three hard-edged colour planes continuing the image palette upward */
  .plane{position:absolute;}
  #plane-red{
    left:-60px;top:-40px;width:520px;height:520px;
    background:#c62a1c;
    clip-path:polygon(0 0,100% 0,100% 42%,0 100%);
    opacity:.92;
  }
  #plane-yellow{
    right:-40px;top:120px;width:420px;height:420px;
    background:#e8b21a;
    clip-path:polygon(100% 0,100% 100%,0 34%);
    opacity:.9;
  }
  #plane-blue{
    left:120px;top:430px;width:900px;height:300px;
    background:#1b3ea8;
    clip-path:polygon(0 62%,100% 0,100% 100%,0 100%);
    opacity:.78;
  }
  /* broad overlapping strokes in the image's own colours, hiding the seam */
  #seam{
    position:absolute;left:0;top:820px;width:1080px;height:420px;
    background:
      linear-gradient(180deg,rgba(20,16,51,0) 0%,rgba(30,22,60,.55) 40%,rgba(35,24,58,0) 100%);
  }
  .stroke{position:absolute;transform-origin:center;}
  /* ---- the scene image, full bleed to bottom two-thirds ---- */
  #scene-image{
    position:absolute;left:0;bottom:0;
    width:1080px;height:1300px;
    object-fit:cover;object-position:center top;
    opacity:.98;
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0px,rgba(0,0,0,.35) 60px,rgba(0,0,0,.85) 150px,#000 260px,#000 100%);
    mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0px,rgba(0,0,0,.35) 60px,rgba(0,0,0,.85) 150px,#000 260px,#000 100%);
    animation:drift 96s ease-in-out infinite;
    will-change:transform;
  }
  @keyframes drift{
    0%{transform:scale(1.02) translate3d(0,0,0);}
    50%{transform:scale(1.045) translate3d(0,-8px,0);}
    100%{transform:scale(1.02) translate3d(0,0,0);}
  }
  /* ---- web canvas: the artwork ---- */
  #web{
    position:absolute;left:0;top:0;width:1080px;height:1920px;
  }
  /* single blended overlay: soft indigo haze + gentle vignette, one pass */
  #haze{
    position:absolute;left:0;top:0;width:1080px;height:1920px;
    mix-blend-mode:soft-light;
    background:
      radial-gradient(ellipse 70% 45% at 50% 30%, rgba(232,178,26,.22), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 90% 70% at 50% 88%, rgba(27,62,168,.28), rgba(0,0,0,0) 75%);
    pointer-events:none;
  }
  #anchors{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;}
  #guinea-pig{
    position:absolute;left:112px;top:1188px;width:17px;
    opacity:.62;transform:rotate(-7deg);pointer-events:none;
  }
  #date{
    position:absolute;left:26px;bottom:20px;
    font:400 13px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;
    letter-spacing:.28em;color:#f2ead6;opacity:.42;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="sky">
    <div class="plane" id="plane-red"></div>
    <div class="plane" id="plane-yellow"></div>
    <div class="plane" id="plane-blue"></div>
  </div>

  <!-- broad flat strokes in the image palette, drifting slowly, crossing the seam -->
  <svg id="anchors" viewBox="0 0 1080 1920" preserveAspectRatio="none">
    <g id="strokeGroup">
      <g transform="translate(0,0)">
        <rect x="-40" y="700" width="1180" height="46" fill="#c62a1c" opacity="0.5"
              transform="rotate(-6 540 720)"/>
        <rect x="-40" y="900" width="1180" height="80" fill="#1b3ea8" opacity="0.42"
              transform="rotate(4 540 940)"/>
        <rect x="-60" y="1010" width="1200" height="30" fill="#e8b21a" opacity="0.34"
              transform="rotate(-3 540 1025)"/>
      </g>
    </g>
    <!-- three heavy anchor bars: the web's structural supports, Bauhaus-flat -->
    <g id="bars">
      <rect x="-10" y="150" width="150" height="1160" fill="#0d0b24" opacity="0.92"/>
      <rect x="960" y="60" width="130" height="1240" fill="#0d0b24" opacity="0.92"/>
      <rect x="-10" y="150" width="150" height="26" fill="#c62a1c" opacity="0.9"/>
      <rect x="960" y="60" width="130" height="26" fill="#e8b21a" opacity="0.9"/>
    </g>
  </svg>

  <img id="scene-image" src="scene.png" alt="">
  <canvas id="web" width="540" height="960"></canvas>
  <div id="haze"></div>
  <img id="guinea-pig" src="guineapig.png" alt="">
  <div id="date">2026 · 09 · 03</div>
</div>

<script>
(function(){
  /* ---------- fit ---------- */
  const stage=document.getElementById('stage');
  function fit(){
    const s=Math.min(window.innerWidth/1080, window.innerHeight/1920);
    stage.style.transform='scale('+s+')';
    stage.style.marginLeft=((window.innerWidth-1080*s)/2)+'px';
  }
  fit(); window.addEventListener('resize',fit);

  /* ---------- date seed ---------- */
  const D=new Date(2026,8,3);
  let seed=(D.getFullYear()*10000+(D.getMonth()+1)*100+D.getDate())%2147483647;
  function rnd(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }

  /* ---------- geometry: an orb web, built strand by strand ---------- */
  const W=540,H=960;
  const cvs=document.getElementById('web');
  const ctx=cvs.getContext('2d');
  cvs.style.width='1080px'; cvs.style.height='1920px';

  const CX=W*0.5 + (rnd()-0.5)*30;
  const CY=H*0.36;
  const SPOKES=12 + Math.floor(rnd()*3);      // 12–14
  const RINGS=9;
  const RMAX=W*0.62;

  // radial hub angles, slightly irregular (hand-built feel, still geometric)
  const ang=[];
  for(let i=0;i<SPOKES;i++){
    ang.push(-Math.PI/2 + i*(Math.PI*2/SPOKES) + (rnd()-0.5)*0.10);
  }
  // spoke lengths reach out to the frame bars / edges
  const spokeLen=[];
  for(let i=0;i<SPOKES;i++){
    spokeLen.push(RMAX*(0.72+rnd()*0.42));
  }
  // ring radii
  const ringR=[];
  for(let r=0;r<RINGS;r++){
    const t=(r+1)/RINGS;
    ringR.push(RMAX*(0.14 + 0.86*Math.pow(t,1.22)));
  }

  function pt(i,rad){
    return [CX+Math.cos(ang[i])*rad, CY+Math.sin(ang[i])*rad];
  }

  /* ---------- build the strand list (drawing order = build order) ---------- */
  // 1) frame chords  2) radial spokes  3) spiral segments outward
  const strands=[];

  // frame: bold chords between spoke tips
  for(let i=0;i<SPOKES;i++){
    const a=pt(i,spokeLen[i]), b=pt((i+1)%SPOKES, spokeLen[(i+1)%SPOKES]);
    strands.push({a:a,b:b,kind:'frame'});
  }
  // spokes
  for(let i=0;i<SPOKES;i++){
    strands.push({a:[CX,CY],b:pt(i,spokeLen[i]),kind:'spoke'});
  }
  // spiral: for each ring, walk the spokes
  const dewSpots=[];
  for(let r=0;r<RINGS;r++){
    for(let i=0;i<SPOKES;i++){
      const j=(i+1)%SPOKES;
      const ra=Math.min(ringR[r],spokeLen[i]*0.97);
      const rb=Math.min(ringR[r],spokeLen[j]*0.97);
      const A=pt(i,ra), B=pt(j,rb);
      const s={a:A,b:B,kind:'spiral',ring:r};
      strands.push(s);
      if(rnd()<0.13){
        const t=0.25+rnd()*0.5;
        dewSpots.push({
          x:A[0]+(B[0]-A[0])*t, y:A[1]+(B[1]-A[1])*t,
          r:1.3+rnd()*2.6, idx:strands.length-1,
          hue:rnd(), ph:rnd()*Math.PI*2
        });
      }
    }
  }
  const TOTAL=strands.length;

  /* ---------- static hub disc drawn once to offscreen ---------- */
  const off=document.createElement('canvas'); off.width=W; off.height=H;
  const octx=off.getContext('2d');
  (function hub(){
    // three concentric flat Bauhaus discs at the hub — the spider's platform
    octx.fillStyle='#e8b21a'; octx.beginPath();
    octx.arc(CX,CY,26,0,Math.PI*2); octx.fill();
    octx.fillStyle='#c62a1c'; octx.beginPath();
    octx.arc(CX,CY,15,0,Math.PI*2); octx.fill();
    octx.fillStyle='#12102c'; octx.beginPath();
    octx.arc(CX,CY,6,0,Math.PI*2); octx.fill();
  })();

  const COL={
    frame:'#f4ecd8',
    spoke:'#f4ecd8',
    spiral:'#dcd2bb'
  };
  const DEW=['#e8b21a','#f4ecd8','#5c8fe0','#c62a1c'];

  /* ---------- owl: flat geometric silhouette perched on the left bar ---------- */
  function drawOwl(t){
    const ox=68, oy=210;
    const blink=(Math.sin(t*0.35)>0.985)?1:0;
    octx; // noop
    ctx.save();
    ctx.translate(ox,oy);
    ctx.fillStyle='#0d0b24';
    // body: rounded slab
    ctx.beginPath();
    ctx.moveTo(-17,34); ctx.lineTo(-17,4);
    ctx.arc(0,4,17,Math.PI,0);
    ctx.lineTo(17,34); ctx.closePath(); ctx.fill();
    // ear tufts (triangles)
    ctx.beginPath(); ctx.moveTo(-17,-6); ctx.lineTo(-6,-22); ctx.lineTo(-3,-8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(17,-6); ctx.lineTo(6,-22); ctx.lineTo(3,-8); ctx.closePath(); ctx.fill();
    // eyes: yellow discs
    if(!blink){
      ctx.fillStyle='#e8b21a';
      ctx.beginPath(); ctx.arc(-7,2,5.4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(7,2,5.4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#12102c';
      ctx.beginPath(); ctx.arc(-7,2,2.1,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(7,2,2.1,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle='#e8b21a';
      ctx.fillRect(-12.4,1,10.8,1.8);
      ctx.fillRect(1.6,1,10.8,1.8);
    }
    // beak triangle
    ctx.fillStyle='#c62a1c';
    ctx.beginPath(); ctx.moveTo(0,6); ctx.lineTo(-3.4,12); ctx.lineTo(3.4,12); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* ---------- spider: small flat geometry, rides the strand under construction ---------- */
  function drawSpider(x,y,dir){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(dir);
    ctx.strokeStyle='#12102c'; ctx.lineWidth=1.5; ctx.lineCap='round';
    for(let k=0;k<4;k++){
      const a=0.5+k*0.45;
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*7, Math.sin(a)*6.5);
      ctx.moveTo(0,0); ctx.lineTo(Math.cos(-a)*7, Math.sin(-a)*6.5);
      ctx.stroke();
    }
    ctx.fillStyle='#12102c';
    ctx.beginPath(); ctx.ellipse(0,0,5.2,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#c62a1c';
    ctx.beginPath(); ctx.arc(-1.2,0,1.7,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  /* ---------- loop ---------- */
  const BUILD=104;   // seconds to complete the web
  const HOLD=16;     // seconds admiring it
  const FADE=9;      // dissolve back to nothing
  const CYCLE=BUILD+HOLD+FADE;

  let start=null, acc=0, last=0;
  function frame(ts){
    if(start===null){start=ts; last=ts;}
    let dt=(ts-last)/1000; last=ts;
    if(dt>1/24) dt=1/24;         // clamp
    acc+=dt;
    const t=acc%CYCLE;
    const tGlobal=acc;

    ctx.clearRect(0,0,W,H);

    // progress
    let built, fadeA=1;
    if(t<BUILD){ built=Math.pow(t/BUILD,0.92)*TOTAL; }
    else if(t<BUILD+HOLD){ built=TOTAL; }
    else { built=TOTAL; fadeA=1-((t-BUILD-HOLD)/FADE); }
    const nBuilt=Math.floor(built);
    const partial=built-nBuilt;

    ctx.globalAlpha=fadeA;

    // hub platform
    ctx.drawImage(off,0,0);

    // strands
    ctx.lineCap='round';
    for(let i=0;i<Math.min(nBuilt,TOTAL);i++){
      const s=strands[i];
      ctx.strokeStyle=COL[s.kind];
      ctx.lineWidth = s.kind==='frame'?2.6 : s.kind==='spoke'?1.7 : 1.05;
      ctx.globalAlpha = fadeA*(s.kind==='spiral'?0.72:0.92);
      ctx.beginPath();
      ctx.moveTo(s.a[0],s.a[1]); ctx.lineTo(s.b[0],s.b[1]);
      ctx.stroke();
    }

    // the strand currently being spun
    let sx=CX, sy=CY, sdir=0;
    if(nBuilt<TOTAL){
      const s=strands[nBuilt];
      const px=s.a[0]+(s.b[0]-s.a[0])*partial;
      const py=s.a[1]+(s.b[1]-s.a[1])*partial;
      ctx.strokeStyle=COL[s.kind];
      ctx.lineWidth=s.kind==='frame'?2.6:s.kind==='spoke'?1.7:1.05;
      ctx.globalAlpha=fadeA*0.95;
      ctx.beginPath(); ctx.moveTo(s.a[0],s.a[1]); ctx.lineTo(px,py); ctx.stroke();
      sx=px; sy=py; sdir=Math.atan2(s.b[1]-s.a[1], s.b[0]-s.a[0]);
    } else {
      // resting at the hub
      sx=CX+Math.cos(tGlobal*0.12)*3; sy=CY+Math.sin(tGlobal*0.12)*3; sdir=tGlobal*0.05;
    }

    // dew drops: flat discs, appear once their strand exists, breathing slowly
    for(let k=0;k<dewSpots.length;k++){
      const d=dewSpots[k];
      if(d.idx>=nBuilt) continue;
      const age=Math.min(1,(nBuilt-d.idx)/26);
      const pulse=0.72+0.28*Math.sin(tGlobal*0.5+d.ph);
      ctx.globalAlpha=fadeA*age*pulse;
      ctx.fillStyle=DEW[Math.floor(d.hue*DEW.length)];
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=fadeA*age*pulse*0.5;
      ctx.fillStyle='#f4ecd8';
      ctx.beginPath(); ctx.arc(d.x-d.r*0.3,d.y-d.r*0.3,d.r*0.4,0,Math.PI*2); ctx.fill();
    }

    ctx.globalAlpha=fadeA;
    drawSpider(sx,sy,sdir);
    drawOwl(tGlobal);
    ctx.globalAlpha=1;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- slow structural drift of the painted strokes ---------- */
  const sg=document.getElementById('strokeGroup');
  let sa=0, slast=0;
  function strokeLoop(ts){
    if(!slast) slast=ts;
    let dt=(ts-slast)/1000; slast=ts;
    if(dt>1/24) dt=1/24;
    sa+=dt;
    const y=Math.sin(sa*0.06)*14;
    const x=Math.cos(sa*0.041)*10;
    sg.setAttribute('transform','translate('+x.toFixed(2)+','+y.toFixed(2)+')');
    requestAnimationFrame(strokeLoop);
  }
  requestAnimationFrame(strokeLoop);

  /* ---------- procedural audio: a low indigo drone, silent when embedded ---------- */
  if(window.self===window.top){
    let started=false;
    const boot=function(){
      if(started) return; started=true;
      try{
        const AC=window.AudioContext||window.webkitAudioContext;
        if(!AC) return;
        const ac=new AC();
        const master=ac.createGain(); master.gain.value=0.0;
        master.connect(ac.destination);
        const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
        lp.connect(master);
        [73.42,110.0,146.83,220.0].forEach(function(f,i){
          const o=ac.createOscillator(); o.type=i===3?'triangle':'sine';
          o.frequency.value=f;
          const g=ac.createGain(); g.gain.value=(i===3?0.05:0.16);
          const lfo=ac.createOscillator(); lfo.frequency.value=0.031+i*0.017;
          const lg=ac.createGain(); lg.gain.value=(i===3?0.03:0.08);
          lfo.connect(lg); lg.connect(g.gain);
          o.connect(g); g.connect(lp);
          o.start(); lfo.start();
        });
        master.gain.linearRampToValueAtTime(0.075, ac.currentTime+14);
        if(ac.state==='suspended') ac.resume();
      }catch(e){}
    };
    boot();
    document.addEventListener('visibilitychange',boot);
  }
})();
</script>
</body>
</html>
