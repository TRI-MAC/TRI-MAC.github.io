<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026-03-30</title>
<style>
  :root{
    --bg1:#22122a;
    --bg2:#5c214f;
    --bg3:#f06b4a;
    --bg4:#f4b35d;
    --ink:#120d18;
    --paper:#f7e6cf;
    --rose:#d03c6f;
    --cyan:#2e9faa;
    --gold:#d9a54a;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#0b0710;
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  .frame{
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 20% 10%, rgba(240,107,74,.35), transparent 40%),
      radial-gradient(80% 70% at 78% 25%, rgba(208,60,111,.28), transparent 42%),
      radial-gradient(80% 80% at 50% 80%, rgba(244,179,93,.22), transparent 50%),
      linear-gradient(180deg, #1c1022 0%, #311430 30%, #5c214f 60%, #2a1625 100%);
    box-shadow:0 0 50px rgba(0,0,0,.45);
    isolation:isolate;
  }

  #background-video{
    position:absolute;
    inset:7% 8% 8% 8%;
    width:84%;
    height:84%;
    object-fit:cover;
    opacity:.82;
    filter:saturate(1.35) contrast(1.12) hue-rotate(-8deg) brightness(.95);
    mix-blend-mode:screen;
    border-radius:40% 26% 36% 30% / 20% 32% 24% 28%;
    transform:rotate(-4deg) scale(1.08);
    animation:videoPulse 34s ease-in-out infinite alternate;
    z-index:2;
  }

  #portrait-image{
    position:absolute;
    left:16%;
    top:18%;
    width:66%;
    height:52%;
    object-fit:cover;
    object-position:center 20%;
    opacity:.78;
    filter:saturate(1.15) contrast(1.1) sepia(.08) hue-rotate(-10deg);
    mix-blend-mode:lighten;
    clip-path:ellipse(41% 47% at 51% 49%);
    transform:rotate(6deg) scale(1.06);
    z-index:5;
    animation:portraitBreath 22s ease-in-out infinite;
  }

  .wash, .stroke, .veil, .smear, .edge-burn, .date, .pig-wrap, svg, canvas{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  .wash{
    z-index:1;
    background:
      radial-gradient(40% 24% at 28% 18%, rgba(247,230,207,.16), transparent 65%),
      radial-gradient(36% 22% at 70% 26%, rgba(244,179,93,.15), transparent 72%),
      radial-gradient(58% 35% at 44% 58%, rgba(208,60,111,.16), transparent 67%),
      radial-gradient(55% 30% at 52% 82%, rgba(46,159,170,.12), transparent 72%);
    mix-blend-mode:screen;
    animation:washShift 28s ease-in-out infinite alternate;
  }

  .veil{
    z-index:6;
    background:
      linear-gradient(115deg, transparent 0 17%, rgba(247,230,207,.1) 22%, transparent 28% 100%),
      linear-gradient(14deg, transparent 0 52%, rgba(17,9,15,.22) 57%, transparent 63% 100%),
      radial-gradient(80% 50% at 50% 50%, transparent 50%, rgba(11,7,16,.14) 100%);
    mix-blend-mode:overlay;
    opacity:.85;
    animation:veilMove 36s ease-in-out infinite alternate;
  }

  .smear{
    z-index:7;
    background:
      radial-gradient(24% 8% at 26% 36%, rgba(240,107,74,.34), transparent 70%),
      radial-gradient(28% 9% at 60% 61%, rgba(244,179,93,.28), transparent 70%),
      radial-gradient(20% 7% at 75% 28%, rgba(46,159,170,.25), transparent 70%),
      radial-gradient(35% 10% at 44% 76%, rgba(208,60,111,.26), transparent 72%);
    filter:blur(12px);
    mix-blend-mode:screen;
    animation:smearDrift 25s ease-in-out infinite alternate;
  }

  .edge-burn{
    z-index:11;
    background:
      radial-gradient(120% 100% at 50% 50%, transparent 56%, rgba(13,8,14,.18) 72%, rgba(0,0,0,.46) 100%),
      linear-gradient(180deg, rgba(0,0,0,.10), transparent 10%, transparent 90%, rgba(0,0,0,.18));
  }

  #paint{
    z-index:8;
    mix-blend-mode:source-over;
  }

  #scratches{
    z-index:9;
    opacity:.75;
    mix-blend-mode:overlay;
  }

  #vectors{
    z-index:4;
    overflow:visible;
  }

  .date{
    z-index:20;
    inset:auto 20px 16px auto;
    width:auto;
    height:auto;
    color:rgba(247,230,207,.5);
    font-size:14px;
    letter-spacing:.16em;
    text-transform:none;
    mix-blend-mode:screen;
  }

  .pig-wrap{
    z-index:12;
    overflow:hidden;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    right:13px;
    bottom:117px;
    opacity:.62;
    filter:saturate(.9) brightness(.78) contrast(1.02);
    transform:rotate(-8deg);
  }

  @keyframes videoPulse{
    0%{transform:rotate(-5deg) scale(1.05) translateY(-1%); border-radius:40% 26% 36% 30% / 20% 32% 24% 28%;}
    50%{transform:rotate(-2deg) scale(1.1) translateY(1.2%); border-radius:34% 30% 40% 26% / 28% 20% 32% 24%;}
    100%{transform:rotate(-6deg) scale(1.07) translateY(-.6%); border-radius:38% 22% 42% 24% / 22% 36% 20% 30%;}
  }
  @keyframes portraitBreath{
    0%{transform:rotate(6deg) scale(1.06) translate(0,0); filter:saturate(1.1) contrast(1.08) sepia(.08) hue-rotate(-10deg);}
    50%{transform:rotate(4deg) scale(1.09) translate(1.2%,-.6%); filter:saturate(1.22) contrast(1.12) sepia(.05) hue-rotate(-2deg);}
    100%{transform:rotate(7deg) scale(1.05) translate(-.8%,.8%); filter:saturate(1.14) contrast(1.09) sepia(.1) hue-rotate(-14deg);}
  }
  @keyframes washShift{
    0%{transform:translateY(-1.5%) scale(1.02) rotate(0deg)}
    100%{transform:translateY(1.5%) scale(1.05) rotate(2deg)}
  }
  @keyframes veilMove{
    0%{transform:translateX(-2%) rotate(-1deg)}
    100%{transform:translateX(2%) rotate(1deg)}
  }
  @keyframes smearDrift{
    0%{transform:translate(-1.5%,0) scale(1)}
    100%{transform:translate(1.2%,-1%) scale(1.04)}
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="wash"></div>

    <video id="background-video" src="background.mp4" autoplay loop muted playsinline></video>

    <svg id="vectors" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="blur12"><feGaussianBlur stdDeviation="8"/></filter>
        <filter id="blur24"><feGaussianBlur stdDeviation="16"/></filter>
        <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f4b35d" stop-opacity="0.9"/>
          <stop offset="45%" stop-color="#f06b4a" stop-opacity="0.72"/>
          <stop offset="100%" stop-color="#d03c6f" stop-opacity="0.25"/>
        </linearGradient>
        <linearGradient id="gradB" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#2e9faa" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#f7e6cf" stop-opacity="0.1"/>
        </linearGradient>
      </defs>

      <path id="gesture1" d="M120,460 C220,220 450,180 590,320 C710,440 770,670 925,740"
            fill="none" stroke="url(#gradA)" stroke-linecap="round" stroke-width="42" opacity="0.78" filter="url(#blur12)"/>
      <path id="gesture2" d="M182,1190 C310,1010 500,940 676,1018 C822,1082 862,1260 946,1450"
            fill="none" stroke="#f7e6cf" stroke-linecap="round" stroke-width="24" opacity="0.22" filter="url(#blur24)"/>
      <path id="gesture3" d="M90,1510 C280,1370 498,1360 640,1494 C720,1570 786,1670 948,1708"
            fill="none" stroke="url(#gradB)" stroke-linecap="round" stroke-width="36" opacity="0.58" filter="url(#blur12)"/>

      <g opacity="0.33" filter="url(#blur12)">
        <ellipse cx="350" cy="410" rx="160" ry="84" fill="#f4b35d"/>
        <ellipse cx="715" cy="1080" rx="220" ry="130" fill="#d03c6f"/>
        <ellipse cx="532" cy="1440" rx="240" ry="110" fill="#2e9faa"/>
      </g>

      <g id="charcoal" opacity="0.38">
        <path d="M152,308 C320,250 440,236 610,348" stroke="#130d14" stroke-width="11" stroke-linecap="round" fill="none"/>
        <path d="M748,214 C882,394 892,560 846,724" stroke="#130d14" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M232,884 C390,828 582,826 814,918" stroke="#130d14" stroke-width="13" stroke-linecap="round" fill="none"/>
        <path d="M144,1618 C410,1546 650,1554 878,1662" stroke="#130d14" stroke-width="10" stroke-linecap="round" fill="none"/>
      </g>
    </svg>

    <img id="portrait-image" src="portrait.png" alt="" />

    <canvas id="paint" width="1080" height="1920"></canvas>
    <canvas id="scratches" width="1080" height="1920"></canvas>

    <div class="veil"></div>
    <div class="smear"></div>

    <div class="pig-wrap">
      <img id="guinea-pig" src="guineapig.png" alt="" />
    </div>

    <div class="edge-burn"></div>
    <div class="date">2026-03-30</div>
  </div>

<script>
(() => {
  const seedStr = "2026-03-30";
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = ((seed * 131) + seedStr.charCodeAt(i)) >>> 0;
  function rand() {
    seed = (1664525 * seed + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  function lerp(a,b,t){ return a + (b-a)*t; }

  const paint = document.getElementById('paint');
  const ctx = paint.getContext('2d');
  const scratch = document.getElementById('scratches');
  const sctx = scratch.getContext('2d');

  const W = paint.width, H = paint.height;
  const palette = [
    [240,107,74],
    [244,179,93],
    [208,60,111],
    [46,159,170],
    [247,230,207],
    [30,16,34]
  ];

  const ribbons = [];
  for(let i=0;i<11;i++){
    ribbons.push({
      cx: rand()*W,
      cy: rand()*H,
      rx: 160 + rand()*300,
      ry: 40 + rand()*120,
      rot: rand()*Math.PI*2,
      speed: 0.0008 + rand()*0.0015,
      phase: rand()*Math.PI*2,
      color: palette[(i + Math.floor(rand()*palette.length)) % palette.length],
      alpha: 0.08 + rand()*0.12,
      width: 26 + rand()*52,
      arc: 0.9 + rand()*1.6
    });
  }

  const drags = [];
  for(let i=0;i<28;i++){
    drags.push({
      x1: rand()*W,
      y1: rand()*H,
      x2: rand()*W,
      y2: rand()*H,
      bend: (rand()-.5)*320,
      width: 6 + rand()*22,
      alpha: 0.05 + rand()*0.12,
      color: palette[Math.floor(rand()*palette.length)]
    });
  }

  function drawBackgroundTexture(t){
    ctx.clearRect(0,0,W,H);

    for(let i=0;i<ribbons.length;i++){
      const r = ribbons[i];
      const wob = Math.sin(t*r.speed + r.phase);
      const x = r.cx + wob * 80;
      const y = r.cy + Math.cos(t*r.speed*0.8 + r.phase) * 60;
      const rot = r.rot + wob * 0.18;

      ctx.save();
      ctx.translate(x,y);
      ctx.rotate(rot);
      ctx.globalAlpha = r.alpha;
      const g = ctx.createLinearGradient(-r.rx,0,r.rx,0);
      g.addColorStop(0, `rgba(${r.color[0]},${r.color[1]},${r.color[2]},0)`);
      g.addColorStop(0.25, `rgba(${r.color[0]},${r.color[1]},${r.color[2]},${r.alpha*1.5})`);
      g.addColorStop(0.7, `rgba(${r.color[0]},${r.color[1]},${r.color[2]},${r.alpha})`);
      g.addColorStop(1, `rgba(${r.color[0]},${r.color[1]},${r.color[2]},0)`);
      ctx.strokeStyle = g;
      ctx.lineWidth = r.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.ellipse(0,0,r.rx,r.ry,0,-r.arc*Math.PI*0.5,r.arc*Math.PI*0.5);
      ctx.stroke();
      ctx.restore();
    }

    ctx.globalCompositeOperation = 'multiply';
    for(let i=0;i<drags.length;i++){
      const d = drags[i];
      const tt = t*0.00018 + i*0.3;
      const mx = Math.sin(tt)*d.bend;
      const my = Math.cos(tt*1.4)*d.bend*0.3;
      ctx.strokeStyle = `rgba(${d.color[0]},${d.color[1]},${d.color[2]},${d.alpha})`;
      ctx.lineWidth = d.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(d.x1, d.y1);
      ctx.bezierCurveTo(
        lerp(d.x1,d.x2,.3)+mx, lerp(d.y1,d.y2,.3)+my,
        lerp(d.x1,d.x2,.7)-mx*0.6, lerp(d.y1,d.y2,.7)-my*0.6,
        d.x2, d.y2
      );
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';

    const bloom = ctx.createRadialGradient(W*0.46, H*0.42, 60, W*0.46, H*0.42, W*0.52);
    bloom.addColorStop(0, 'rgba(247,230,207,0.09)');
    bloom.addColorStop(0.25, 'rgba(240,107,74,0.08)');
    bloom.addColorStop(0.6, 'rgba(208,60,111,0.03)');
    bloom.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bloom;
    ctx.fillRect(0,0,W,H);
  }

  function drawScratches(t){
    sctx.clearRect(0,0,W,H);
    sctx.globalAlpha = 0.32;

    for(let i=0;i<18;i++){
      const x = (i/18)*W + Math.sin(t*0.00008 + i)*18;
      sctx.strokeStyle = i%3===0 ? 'rgba(247,230,207,0.18)' : 'rgba(20,10,18,0.16)';
      sctx.lineWidth = 1 + (i%4===0 ? 1 : 0);
      sctx.beginPath();
      sctx.moveTo(x,0);
      sctx.lineTo(x + Math.sin(i*7.2+t*0.0002)*24,H);
      sctx.stroke();
    }

    for(let i=0;i<120;i++){
      const x = (rand()*W)|0;
      const y = (rand()*H)|0;
      const w = 20 + rand()*120;
      const a = 0.01 + rand()*0.03;
      sctx.fillStyle = `rgba(247,230,207,${a})`;
      sctx.fillRect(x,y,w,1);
    }
  }

  const g1 = document.getElementById('gesture1');
  const g2 = document.getElementById('gesture2');
  const g3 = document.getElementById('gesture3');
  const charcoal = document.getElementById('charcoal');

  function animate(t){
    drawBackgroundTexture(t);
    drawScratches(t);

    const a = Math.sin(t*0.00022);
    const b = Math.cos(t*0.00017);
    g1.setAttribute('d',
      `M120,460 C${220+80*a},${220+50*b} ${450+60*b},${180+40*a} ${590+50*a},${320+30*b} C${710+20*b},${440+80*a} ${770+30*a},${670+20*b} ${925-20*a},${740+30*b}`);
    g2.setAttribute('d',
      `M182,1190 C${310+40*b},${1010+50*a} ${500+55*a},${940+40*b} ${676+35*b},${1018+50*a} C${822+25*a},${1082+30*b} ${862+20*b},${1260+70*a} ${946-10*a},${1450+20*b}`);
    g3.setAttribute('d',
      `M90,1510 C${280+65*a},${1370+40*b} ${498+50*b},${1360+25*a} ${640+45*a},${1494+45*b} C${720+30*b},${1570+30*a} ${786+15*a},${1670+15*b} ${948-25*b},${1708+30*a}`);

    charcoal.setAttribute('transform', `translate(${a*10} ${b*14}) rotate(${a*0.8} 540 960)`);

    requestAnimationFrame(animate);
  }
  drawScratches(0);
  requestAnimationFrame(animate);

  if (window.self === window.top) {

  // Ambient audio, very subtle and self-starting where permitted
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC){
      const ac = new AC();
      const master = ac.createGain();
      master.gain.value = 0.00001;
      master.connect(ac.destination);

      const osc1 = ac.createOscillator();
      const osc2 = ac.createOscillator();
      const lfo = ac.createOscillator();
      const lfoGain = ac.createGain();
      const filter = ac.createBiquadFilter();

      osc1.type = 'sine';
      osc2.type = 'triangle';
      osc1.frequency.value = 98;
      osc2.frequency.value = 147;
      lfo.frequency.value = 0.031;

      lfoGain.gain.value = 18;
      lfo.connect(lfoGain);
      lfoGain.connect(osc2.frequency);

      filter.type = 'lowpass';
      filter.frequency.value = 520;
      filter.Q.value = 0.4;

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(master);

      osc1.start();
      osc2.start();
      lfo.start();

      const fadeIn = () => {
        const now = ac.currentTime;
        master.gain.cancelScheduledValues(now);
        master.gain.setValueAtTime(master.gain.value, now);
        master.gain.linearRampToValueAtTime(0.018, now + 6);
      };

      if(ac.state === 'running') fadeIn();
      else {
        const tryResume = () => {
          ac.resume().then(fadeIn).catch(()=>{});
          document.removeEventListener('visibilitychange', tryResume);
        };
        document.addEventListener('visibilitychange', tryResume);
      }
    }
  }catch(e){}
  } // end iframe audio check
})();
</script>
</body>
</html>
