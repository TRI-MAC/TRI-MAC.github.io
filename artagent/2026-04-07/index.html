<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generative Art</title>
<style>
  :root{
    --bg1:#07142e;
    --bg2:#120a2f;
    --bg3:#2b0d55;
    --gold:#ffd45c;
    --hot:#ff5a7a;
    --cyan:#4ef2ff;
    --mint:#8cffd1;
    --red:#ff3b30;
    --cream:#fff4cb;
    --navy:#09101f;
    --ink:#02050d;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.777778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,142,58,.22), transparent 20%),
      radial-gradient(circle at 20% 25%, rgba(78,242,255,.12), transparent 24%),
      radial-gradient(circle at 80% 32%, rgba(255,90,122,.11), transparent 20%),
      linear-gradient(180deg, #192554 0%, #140f3c 24%, #0c1736 50%, #090f25 74%, #040710 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 30px 100px rgba(0,0,0,.6);
  }

  #bgCanvas, #fxCanvas, #orbitCanvas{
    position:absolute; inset:0; width:100%; height:100%;
    display:block;
  }
  #bgCanvas{opacity:.96}
  #orbitCanvas{opacity:.95; mix-blend-mode:screen}
  #fxCanvas{opacity:.78; mix-blend-mode:screen}

  .layer{position:absolute; inset:0; pointer-events:none;}

  #rings{
    position:absolute; inset:0;
    filter:drop-shadow(0 0 22px rgba(255,213,92,.18));
    opacity:.9;
    transform-origin:50% 50%;
    animation: wholeBreath 28s ease-in-out infinite;
  }

  #rays{
    position:absolute; left:50%; top:22%;
    width:1400px; height:1400px;
    transform:translate(-50%,-50%) rotate(0deg);
    transform-origin:50% 50%;
    opacity:.52;
    mix-blend-mode:screen;
    animation: spinSlow 120s linear infinite;
  }

  .planet{
    position:absolute;
    border-radius:50%;
    box-shadow:
      inset -25px -35px 60px rgba(0,0,0,.35),
      inset 18px 20px 36px rgba(255,255,255,.18),
      0 0 40px rgba(255,112,61,.22);
  }
  #planetA{
    width:260px;height:260px;left:-72px;top:138px;
    background:
      radial-gradient(circle at 35% 32%, #fff5c8 0 8%, #ffd45c 9%, #ff9f46 32%, #ff5b54 58%, #a3164d 78%, #4c1038 100%);
    animation: driftA 24s ease-in-out infinite;
  }
  #planetB{
    width:174px;height:174px;right:-38px;top:1012px;
    background:
      radial-gradient(circle at 30% 28%, #d6ffff 0 8%, #6df3ff 10%, #2571ff 46%, #102d87 72%, #081637 100%);
    box-shadow:
      inset -20px -24px 38px rgba(0,0,0,.4),
      inset 12px 14px 24px rgba(255,255,255,.12),
      0 0 32px rgba(78,242,255,.18);
    animation: driftB 31s ease-in-out infinite;
  }

  #portrait-wrap{
    position:absolute;
    left:138px;
    top:380px;
    width:790px;
    height:1120px;
    transform:rotate(-5deg);
    filter:drop-shadow(0 20px 40px rgba(0,0,0,.48));
    animation: portraitFloat 22s ease-in-out infinite;
  }

  #portrait-halo{
    position:absolute; inset:70px 120px 240px 120px;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,232,147,.95) 0%, rgba(255,196,78,.85) 15%, rgba(255,110,76,.45) 28%, rgba(255,90,122,.16) 42%, transparent 62%);
    filter:blur(10px);
    mix-blend-mode:screen;
    opacity:.9;
    animation: haloPulse 14s ease-in-out infinite;
  }

  #portrait-orbital-mask{
    position:absolute;
    inset:40px 55px 140px 70px;
    clip-path:ellipse(38% 44% at 51% 44%);
    overflow:hidden;
    border-radius:42% 42% 46% 46% / 40% 40% 48% 48%;
  }

  #portrait-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 18%;
    filter:saturate(1.35) contrast(1.18) brightness(.98) sepia(.08) hue-rotate(-8deg);
    mix-blend-mode:screen;
    opacity:.94;
    transform:scale(1.08);
  }

  #portrait-color-wash{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 48% 30%, rgba(255,227,128,.22), transparent 24%),
      radial-gradient(circle at 60% 46%, rgba(255,90,122,.20), transparent 34%),
      linear-gradient(180deg, rgba(56,122,255,.16), rgba(255,94,124,.1) 46%, rgba(255,211,90,.2) 100%);
    mix-blend-mode:color;
    opacity:.86;
  }

  #portrait-grid{
    position:absolute;
    inset:40px 55px 140px 70px;
    border-radius:50%;
    opacity:.3;
    mix-blend-mode:screen;
    background:
      repeating-linear-gradient(90deg, transparent 0 26px, rgba(255,255,255,.12) 26px 28px),
      repeating-linear-gradient(0deg, transparent 0 26px, rgba(255,255,255,.08) 26px 28px);
    clip-path:ellipse(38% 44% at 51% 44%);
    transform:perspective(900px) rotateX(70deg) translateY(220px) scale(1.2);
  }

  #portrait-frame{
    position:absolute;
    inset:40px 55px 140px 70px;
    clip-path:ellipse(39% 45.5% at 51% 44%);
  }
  #portrait-frame::before,
  #portrait-frame::after{
    content:"";
    position:absolute; inset:0; border-radius:50%;
  }
  #portrait-frame::before{
    border:10px solid rgba(255,212,92,.88);
    box-shadow:0 0 0 6px rgba(9,16,31,.88) inset, 0 0 24px rgba(255,212,92,.34);
  }
  #portrait-frame::after{
    inset:18px;
    border:2px solid rgba(255,247,205,.58);
  }

  .decoArc{
    position:absolute;
    border-radius:50%;
    border-style:solid;
    mix-blend-mode:screen;
    opacity:.85;
  }
  #arc1{
    width:620px;height:620px;left:255px;top:320px;
    border-width:20px;
    border-color:rgba(255,212,92,.9) transparent transparent transparent;
    transform:rotate(20deg);
    animation: arcShift1 26s ease-in-out infinite;
  }
  #arc2{
    width:710px;height:710px;left:160px;top:270px;
    border-width:9px;
    border-color:transparent rgba(78,242,255,.8) transparent transparent;
    transform:rotate(-12deg);
    animation: arcShift2 33s ease-in-out infinite;
  }
  #arc3{
    width:500px;height:500px;left:340px;top:450px;
    border-width:18px;
    border-color:transparent transparent rgba(255,90,122,.82) transparent;
    transform:rotate(10deg);
    animation: arcShift3 21s ease-in-out infinite;
  }

  #rocket{
    position:absolute;
    width:190px;height:530px;
    left:725px; top:1010px;
    transform-origin:50% 78%;
    animation: rocketHover 16s ease-in-out infinite;
    filter:drop-shadow(0 0 24px rgba(255,208,99,.22));
  }

  #badge{
    position:absolute;
    left:76px; top:1080px;
    width:270px; height:270px;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.08) 0 46%, transparent 47%),
      radial-gradient(circle at 50% 50%, rgba(255,212,92,.18), transparent 68%);
    box-shadow:0 0 0 2px rgba(255,212,92,.42), inset 0 0 0 8px rgba(255,255,255,.04);
    opacity:.85;
    animation: badgePulse 18s ease-in-out infinite;
  }
  #badge svg{position:absolute; inset:0}

  .panel{
    position:absolute;
    border:2px solid rgba(255,255,255,.12);
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.01));
    backdrop-filter:blur(1px);
  }
  #panel1{
    left:-70px; top:720px; width:360px; height:500px;
    transform:rotate(-18deg);
    box-shadow:0 0 0 1px rgba(255,212,92,.1) inset;
    animation: panelLean 20s ease-in-out infinite;
  }
  #panel2{
    right:-80px; top:240px; width:320px; height:430px;
    transform:rotate(17deg);
    box-shadow:0 0 0 1px rgba(78,242,255,.1) inset;
    animation: panelLean2 24s ease-in-out infinite;
  }
  #panel3{
    left:220px; bottom:-130px; width:760px; height:340px;
    transform:rotate(7deg);
    box-shadow:0 0 0 1px rgba(255,90,122,.09) inset;
  }

  #scanlines{
    position:absolute; inset:0;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 1px, transparent 1px 4px);
    opacity:.07;
    mix-blend-mode:screen;
  }

  #grain{
    position:absolute; inset:-20%;
    opacity:.12;
    background:
      radial-gradient(circle, rgba(255,255,255,.15) 0 1px, transparent 1.5px) 0 0/10px 10px,
      radial-gradient(circle, rgba(255,212,92,.08) 0 1px, transparent 1.5px) 5px 5px/14px 14px;
    mix-blend-mode:overlay;
    animation: grainDrift 22s linear infinite;
  }

  #date{
    position:absolute;
    right:18px;
    bottom:14px;
    color:rgba(255,255,255,.48);
    font-size:16px;
    letter-spacing:2px;
    z-index:50;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:18px;
    top:1708px;
    opacity:.58;
    filter:brightness(.76) saturate(.9);
    transform:rotate(-7deg);
    z-index:9;
  }

  @keyframes spinSlow { from{transform:translate(-50%,-50%) rotate(0deg)} to{transform:translate(-50%,-50%) rotate(360deg)} }
  @keyframes wholeBreath { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
  @keyframes driftA { 0%,100%{transform:translate(0,0)} 50%{transform:translate(18px,-20px)} }
  @keyframes driftB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-16px,18px)} }
  @keyframes portraitFloat { 0%,100%{transform:rotate(-5deg) translateY(0)} 50%{transform:rotate(-3deg) translateY(-10px)} }
  @keyframes haloPulse { 0%,100%{transform:scale(1);opacity:.84} 50%{transform:scale(1.06);opacity:1} }
  @keyframes arcShift1 { 0%,100%{transform:rotate(20deg) scale(1)} 50%{transform:rotate(33deg) scale(1.03)} }
  @keyframes arcShift2 { 0%,100%{transform:rotate(-12deg) scale(1)} 50%{transform:rotate(-2deg) scale(.98)} }
  @keyframes arcShift3 { 0%,100%{transform:rotate(10deg) scale(1)} 50%{transform:rotate(-6deg) scale(1.05)} }
  @keyframes rocketHover { 0%,100%{transform:rotate(15deg) translateY(0)} 50%{transform:rotate(11deg) translateY(-18px)} }
  @keyframes badgePulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  @keyframes panelLean { 0%,100%{transform:rotate(-18deg) translateX(0)} 50%{transform:rotate(-15deg) translateX(14px)} }
  @keyframes panelLean2 { 0%,100%{transform:rotate(17deg) translateX(0)} 50%{transform:rotate(13deg) translateX(-10px)} }
  @keyframes grainDrift { from{transform:translate(0,0)} to{transform:translate(-30px,-24px)} }
</style>
</head>

<script>
(() => {
  const seedStr = "2026-04-07";
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = ((seed * 131) + seedStr.charCodeAt(i)) >>> 0;
  function rnd() {
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >> 17; seed >>>= 0;
    seed ^= seed << 5;  seed >>>= 0;
    return (seed >>> 0) / 4294967295;
  }

  const W = 1080, H = 1920;

  // Background stars and nebula dots
  const bg = document.getElementById('bgCanvas');
  const bctx = bg.getContext('2d');

  function drawBackground() {
    bctx.clearRect(0,0,W,H);

    const grad = bctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#192554');
    grad.addColorStop(.25,'#140f3c');
    grad.addColorStop(.55,'#0b1532');
    grad.addColorStop(1,'#040710');
    bctx.fillStyle = grad;
    bctx.fillRect(0,0,W,H);

    for(let i=0;i<7;i++){
      const x = rnd()*W, y = rnd()*H*0.82;
      const r = 140 + rnd()*260;
      const g = bctx.createRadialGradient(x,y,0,x,y,r);
      const c = i%3===0 ? '255,93,122' : i%3===1 ? '78,242,255' : '255,195,89';
      g.addColorStop(0,`rgba(${c},${0.12 + rnd()*0.09})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
      bctx.fillStyle = g;
      bctx.beginPath();
      bctx.arc(x,y,r,0,Math.PI*2);
      bctx.fill();
    }

    for(let i=0;i<1100;i++){
      const x = rnd()*W;
      const y = rnd()*H;
      const r = rnd()<0.9 ? rnd()*1.9+0.25 : rnd()*3+1;
      const a = 0.18 + rnd()*0.75;
      const hue = rnd()<0.72 ? [255,244,203] : (rnd()<0.5 ? [78,242,255] : [255,120,98]);
      bctx.fillStyle = `rgba(${hue[0]},${hue[1]},${hue[2]},${a})`;
      bctx.beginPath();
      bctx.arc(x,y,r,0,Math.PI*2);
      bctx.fill();
    }

    for(let i=0;i<130;i++){
      const x = rnd()*W;
      const y = rnd()*H*.7;
      const len = 10+rnd()*28;
      const ang = (-0.3 + rnd()*0.6);
      bctx.strokeStyle = `rgba(255,255,255,${0.08+rnd()*0.18})`;
      bctx.lineWidth = 1+rnd()*1.2;
      bctx.beginPath();
      bctx.moveTo(x,y);
      bctx.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len);
      bctx.stroke();
    }

    // lower horizon bands
    bctx.save();
    bctx.translate(W/2, 1540);
    for(let i=0;i<6;i++){
      const ry = 80 + i*42;
      bctx.strokeStyle = i%2===0 ? 'rgba(255,212,92,.26)' : 'rgba(78,242,255,.17)';
      bctx.lineWidth = i===0 ? 5 : 2;
      bctx.beginPath();
      bctx.ellipse(0, 0, 540 - i*20, ry, 0, Math.PI*.08, Math.PI*.92);
      bctx.stroke();
    }
    bctx.restore();
  }
  drawBackground();

  // Orbit canvas: satellites, dots, structural motion
  const orbit = document.getElementById('orbitCanvas');
  const octx = orbit.getContext('2d');
  const satellites = Array.from({length: 14}, (_,i)=>({
    radius: 250 + i*22 + rnd()*18,
    angle: rnd()*Math.PI*2,
    speed: 0.0009 + rnd()*0.0012,
    size: 4 + rnd()*9,
    color: i%3===0 ? '#ffd45c' : i%3===1 ? '#4ef2ff' : '#ff5a7a',
    tilt: -0.18 + rnd()*0.36
  }));

  // FX canvas: halftone and glows
  const fx = document.getElementById('fxCanvas');
  const fctx = fx.getContext('2d');

  const burstShapes = Array.from({length: 18}, (_,i)=>({
    x: 140 + rnd()*800,
    y: 180 + rnd()*1400,
    r: 18 + rnd()*70,
    sides: 3 + ((rnd()*5)|0),
    rot: rnd()*Math.PI*2,
    speed: (rnd()-.5)*0.0008,
    color: i%4===0 ? '255,212,92' : i%4===1 ? '78,242,255' : i%4===2 ? '255,90,122' : '255,244,203',
    alpha: .05 + rnd()*.08
  }));

  function polygon(ctx,x,y,r,sides,rot){
    ctx.beginPath();
    for(let i=0;i<sides;i++){
      const a = rot + i * Math.PI*2/sides;
      const px = x + Math.cos(a)*r;
      const py = y + Math.sin(a)*r;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
  }

  function animate(t){
    octx.clearRect(0,0,W,H);
    fctx.clearRect(0,0,W,H);

    const cx = 540 + Math.sin(t*0.00018)*12;
    const cy = 840 + Math.cos(t*0.00014)*8;

    // orbital structures
    octx.save();
    octx.translate(cx, cy);
    octx.rotate(Math.sin(t*0.00007)*0.06);

    for(let i=0;i<satellites.length;i++){
      const s = satellites[i];
      const a = s.angle + t*s.speed;
      const x = Math.cos(a)*s.radius;
      const y = Math.sin(a)*(s.radius*0.56);
      octx.save();
      octx.translate(x,y);
      octx.rotate(a + Math.PI/2);
      octx.fillStyle = s.color;
      octx.globalAlpha = .7;
      octx.fillRect(-s.size*1.2, -1.3, s.size*2.4, 2.6);
      octx.beginPath();
      octx.arc(0,0,s.size,0,Math.PI*2);
      octx.fill();
      octx.globalAlpha = .22;
      octx.strokeStyle = s.color;
      octx.lineWidth = 1.4;
      octx.beginPath();
      octx.arc(0,0,s.size*2.1,0,Math.PI*2);
      octx.stroke();
      octx.restore();
    }

    octx.restore();

    // geometric cosmic decals
    for(const b of burstShapes){
      const rot = b.rot + t*b.speed;
      fctx.save();
      fctx.globalAlpha = b.alpha;
      polygon(fctx,b.x,b.y,b.r,b.sides,rot);
      fctx.fillStyle = `rgba(${b.color},1)`;
      fctx.fill();
      fctx.restore();
    }

    // halftone sun behind portrait
    const sx = 540, sy = 625 + Math.sin(t*0.00025)*8;
    for(let yy=-180; yy<=180; yy+=16){
      for(let xx=-180; xx<=180; xx+=16){
        const d = Math.hypot(xx,yy);
        if(d<185){
          const rr = (1 - d/185) * 5.5;
          fctx.fillStyle = d<90 ? 'rgba(255,244,203,.12)' : d<150 ? 'rgba(255,212,92,.095)' : 'rgba(255,90,122,.07)';
          fctx.beginPath();
          fctx.arc(sx+xx, sy+yy, Math.max(0.6,rr), 0, Math.PI*2);
          fctx.fill();
        }
      }
    }

    // lower perspective grid
    fctx.save();
    fctx.translate(540, 1520);
    fctx.strokeStyle = 'rgba(78,242,255,.18)';
    fctx.lineWidth = 1;
    for(let i=-8;i<=8;i++){
      fctx.beginPath();
      fctx.moveTo(i*48, 0);
      fctx.lineTo(i*120, 360);
      fctx.stroke();
    }
    for(let j=0;j<10;j++){
      const y = j*j*4.2;
      fctx.beginPath();
      fctx.moveTo(-760 + j*12, y);
      fctx.quadraticCurveTo(0, y-16, 760 - j*12, y);
      fctx.stroke();
    }
    fctx.restore();

    // glows
    let glow = fctx.createRadialGradient(540, 850, 0, 540, 850, 420);
    glow.addColorStop(0,'rgba(255,212,92,.10)');
    glow.addColorStop(.5,'rgba(255,90,122,.05)');
    glow.addColorStop(1,'rgba(0,0,0,0)');
    fctx.fillStyle = glow;
    fctx.fillRect(0,0,W,H);

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  // Gentle procedural audio, unattended-safe
  let started = false;
  function startAudio(){
    if(started) return;
    started = true;
    if (window.self === window.top) {
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain();
      master.gain.value = 0.012;
      master.connect(ctx.destination);

      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc1.type = 'sine';
      osc2.type = 'triangle';
      osc1.frequency.value = 110;
      osc2.frequency.value = 164.81;
      filter.type = 'lowpass';
      filter.frequency.value = 520;
      filter.Q.value = 0.5;

      lfo.type = 'sine';
      lfo.frequency.value = 0.06;
      lfoGain.gain.value = 18;
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      const g1 = ctx.createGain();
      const g2 = ctx.createGain();
      g1.gain.value = 0.16;
      g2.gain.value = 0.09;

      osc1.connect(g1).connect(filter);
      osc2.connect(g2).connect(filter);
      filter.connect(master);

      osc1.start();
      osc2.start();
      lfo.start();
    }catch(e){}
  } // end iframe audio check
  }
  startAudio();
})();
</script>
