<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta charset="utf-8">
<title>Deco Arcade</title>
<style>
  html,body{margin:0;padding:0;background:#8a5a2b;overflow:hidden;}
  #wrap{position:fixed;inset:0;background:#8a5a2b;}
  #stage{
    position:absolute;top:0;left:0;width:1080px;height:1920px;
    transform-origin:top left;
    background:#a9703a;
    overflow:hidden;
  }
  /* base field — mid-key ochre / terracotta plane, single field */
  #field{
    position:absolute;inset:0;
    background:
      radial-gradient(120% 70% at 50% 34%, #c98d45 0%, #b0763a 42%, #96602f 74%, #7e4f28 100%);
  }
  #scene-image{
    position:absolute;left:0;top:0;width:1080px;height:1920px;
    object-fit:cover;object-position:50% 38%;
    -webkit-mask-image:radial-gradient(115% 78% at 50% 40%, #000 52%, rgba(0,0,0,0.85) 68%, rgba(0,0,0,0.35) 84%, rgba(0,0,0,0) 100%);
            mask-image:radial-gradient(115% 78% at 50% 40%, #000 52%, rgba(0,0,0,0.85) 68%, rgba(0,0,0,0.35) 84%, rgba(0,0,0,0) 100%);
    animation:drift 64s ease-in-out infinite;
    will-change:transform;
  }
  @keyframes drift{
    0%{transform:scale(1.035) translate3d(0,0,0);}
    50%{transform:scale(1.055) translate3d(0,-10px,0);}
    100%{transform:scale(1.035) translate3d(0,0,0);}
  }
  /* soft feather blooms sampled from the palette — dissolve the rectangle */
  .bloom{position:absolute;border-radius:50%;will-change:transform;}
  #b1{left:-360px;top:-300px;width:900px;height:820px;
      background:radial-gradient(circle at 50% 50%, rgba(206,143,66,0.95) 0%, rgba(184,120,54,0.55) 46%, rgba(184,120,54,0) 72%);
      animation:breathe 46s ease-in-out infinite;}
  #b2{right:-380px;top:120px;width:880px;height:900px;
      background:radial-gradient(circle at 50% 50%, rgba(160,96,44,0.9) 0%, rgba(146,86,40,0.5) 48%, rgba(146,86,40,0) 74%);
      animation:breathe 58s ease-in-out infinite reverse;}
  #b3{left:-280px;bottom:-420px;width:1100px;height:1000px;
      background:radial-gradient(circle at 50% 50%, rgba(120,66,32,0.95) 0%, rgba(120,66,32,0.5) 50%, rgba(120,66,32,0) 76%);
      animation:breathe 52s ease-in-out infinite;}
  #b4{right:-320px;bottom:-360px;width:960px;height:900px;
      background:radial-gradient(circle at 50% 50%, rgba(186,124,58,0.85) 0%, rgba(170,110,50,0.45) 48%, rgba(170,110,50,0) 74%);
      animation:breathe 68s ease-in-out infinite reverse;}
  @keyframes breathe{
    0%{transform:scale(1);} 50%{transform:scale(1.09);} 100%{transform:scale(1);}
  }

  /* the game surface — chunky pixels scaled up */
  #game{
    position:absolute;left:90px;top:1052px;width:900px;height:520px;
    image-rendering:pixelated;
    animation:gameglow 22s ease-in-out infinite;
    will-change:opacity;
  }
  @keyframes gameglow{0%{opacity:0.94}50%{opacity:1}100%{opacity:0.94}}

  #sun{position:absolute;left:0;top:0;width:1080px;height:1920px;}

  #guinea-pig{
    position:absolute;left:126px;top:1536px;width:17px;
    opacity:0.62;
    transform:rotate(-5deg);
  }

  #date{
    position:absolute;left:56px;bottom:40px;
    font:400 15px/1 "Futura","Century Gothic",Helvetica,Arial,sans-serif;
    letter-spacing:0.42em;color:#f0d49a;opacity:0.42;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="field"></div>
    <img id="scene-image" src="scene.png" alt="">
    <div class="bloom" id="b1"></div>
    <div class="bloom" id="b2"></div>
    <div class="bloom" id="b3"></div>
    <div class="bloom" id="b4"></div>

    <svg id="sun" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <radialGradient id="rayFade" cx="0.5" cy="0.62" r="0.5">
          <stop offset="0" stop-color="#f4d99e" stop-opacity="0.30"/>
          <stop offset="0.55" stop-color="#f4d99e" stop-opacity="0.16"/>
          <stop offset="1" stop-color="#f4d99e" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="rayMask" cx="0.5" cy="0.62" r="0.5">
          <stop offset="0" stop-color="#fff" stop-opacity="1"/>
          <stop offset="0.62" stop-color="#fff" stop-opacity="0.7"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <mask id="mFade">
          <rect x="0" y="0" width="1080" height="1920" fill="url(#rayMask)"/>
        </mask>
      </defs>
      <g mask="url(#mFade)">
        <g id="rays" transform="translate(540,1190)"></g>
      </g>
    </svg>

    <canvas id="game" width="450" height="260"></canvas>
    <img id="guinea-pig" src="guineapig.png" alt="">
    <div id="date">2026 · 09 · 06</div>
  </div>
</div>

<script>
(function(){
  /* ---------- scaling shell ---------- */
  const stage=document.getElementById('stage');
  function fit(){
    const w=window.innerWidth,h=window.innerHeight;
    const s=Math.min(w/1080,h/1920);
    stage.style.transform='translate('+((w-1080*s)/2)+'px,'+((h-1920*s)/2)+'px) scale('+s+')';
  }
  fit();window.addEventListener('resize',fit);

  /* ---------- date seed ---------- */
  const SEED=(2026*10000+9*100+6);
  let s=SEED>>>0;
  function rnd(){s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;}

  /* ---------- deco sunburst rays behind the game field ---------- */
  const rg=document.getElementById('rays');
  const N=24;
  let paths='';
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2;
    const wid=0.028+ (i%2?0.012:0);
    const R=1450;
    const x1=Math.cos(a-wid)*R, y1=Math.sin(a-wid)*R;
    const x2=Math.cos(a+wid)*R, y2=Math.sin(a+wid)*R;
    paths+='<path d="M0 0 L'+x1.toFixed(1)+' '+y1.toFixed(1)+' L'+x2.toFixed(1)+' '+y2.toFixed(1)+' Z" fill="url(#rayFade)"/>';
  }
  rg.innerHTML=paths;
  rg.style.transformOrigin='0 0';
  rg.animate(
    [{transform:'rotate(0deg)'},{transform:'rotate(15deg)'}],
    {duration:120000,iterations:Infinity,easing:'ease-in-out',direction:'alternate'}
  );

  /* ---------- the game: autonomous Deco breakout/paddle ---------- */
  const cv=document.getElementById('game'),g=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  const P=5; // pixel block size

  const GOLD='#f2d79b', BRASS='#c99a4e', DEEP='#5d3218', JADE='#3f7a63',
        LAC='#b3402c', CREAM='#f7ead0', SHADOW='#79461f';

  // brick wall (Deco stepped ziggurat arrangement) in block coords
  const COLS=18, ROWS=5;
  const ox=(W/P - COLS*4)/2|0;
  let bricks=[];
  function buildWall(){
    bricks=[];
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        // stepped ziggurat silhouette
        const inset=Math.max(0, r-1);
        if(c<inset || c>=COLS-inset) continue;
        const t=(c<COLS/2? c : COLS-1-c);
        bricks.push({c:c,r:r,alive:true,
          col:(r%2===0)? ((t%3===0)?LAC:GOLD) : ((t%3===0)?JADE:BRASS)});
      }
    }
  }
  buildWall();

  const brickW=4,brickH=2, wallTop=6;

  // ball & paddle in pixel-block float coords
  const GW=W/P, GH=H/P;
  let ball={x:GW/2,y:GH*0.62,vx:0.34,vy:-0.30,r:1.1};
  let pad={x:GW/2,w:12,y:GH-4};
  let stuck=0, lastY=ball.y, resetT=0;

  function reset(full){
    ball.x=GW/2; ball.y=GH*0.60;
    const dir=rnd()<0.5?-1:1;
    ball.vx=0.30*dir; ball.vy=-0.30;
    if(full) buildWall();
  }

  function step(){
    // AI paddle: predict, ease toward target
    let target=ball.x;
    if(ball.vy>0){
      // simple lead prediction
      const dt=(pad.y-1-ball.y)/ball.vy;
      target=ball.x+ball.vx*dt;
      const span=GW;
      // reflect prediction off walls
      while(target<1||target>span-1){
        if(target<1) target=2-target;
        if(target>span-1) target=2*(span-1)-target;
      }
    }else{
      target=GW/2+(ball.x-GW/2)*0.45;
    }
    pad.x+=(target-pad.x)*0.10;
    pad.x=Math.max(pad.w/2+1,Math.min(GW-pad.w/2-1,pad.x));

    ball.x+=ball.vx; ball.y+=ball.vy;
    if(ball.x<1){ball.x=1;ball.vx=Math.abs(ball.vx);}
    if(ball.x>GW-1){ball.x=GW-1;ball.vx=-Math.abs(ball.vx);}
    if(ball.y<1){ball.y=1;ball.vy=Math.abs(ball.vy);}

    // brick collisions
    for(let i=0;i<bricks.length;i++){
      const b=bricks[i]; if(!b.alive) continue;
      const bx=ox+b.c*brickW, by=wallTop+b.r*brickH;
      if(ball.x>bx-0.6 && ball.x<bx+brickW-0.4 && ball.y>by-0.6 && ball.y<by+brickH+0.2){
        b.alive=false;
        ball.vy=Math.abs(ball.vy);
        break;
      }
    }

    // paddle
    if(ball.y>pad.y-1 && ball.y<pad.y+1.6 && Math.abs(ball.x-pad.x)<pad.w/2+0.8){
      ball.y=pad.y-1;
      ball.vy=-Math.abs(ball.vy);
      ball.vx+=(ball.x-pad.x)*0.045;
      ball.vx=Math.max(-0.5,Math.min(0.5,ball.vx));
    }
    // miss
    if(ball.y>GH+2) reset(false);

    // anti-stall: if vertical motion nearly nil for long, nudge
    if(Math.abs(ball.y-lastY)<0.02) stuck++; else stuck=0;
    lastY=ball.y;
    if(stuck>240){ ball.vy=-0.32; stuck=0; }

    // seamless loop: rebuild wall when cleared
    let alive=0; for(const b of bricks) if(b.alive) alive++;
    if(alive===0){
      resetT++;
      if(resetT>90){ resetT=0; reset(true); }
    } else resetT=0;
  }

  function blk(x,y,w,h,c){ g.fillStyle=c; g.fillRect(Math.round(x)*P,Math.round(y)*P,w*P,h*P); }

  function draw(){
    g.clearRect(0,0,W,H);

    // playfield plane — a single flat lacquer field, no filler texture
    g.fillStyle=DEEP; g.fillRect(0,0,W,H);
    g.fillStyle='#6d3c1c'; g.fillRect(P,P,W-2*P,H-2*P);

    // stepped deco border, two blocks, part of the same field
    g.fillStyle=BRASS;
    g.fillRect(0,0,W,P); g.fillRect(0,H-P,W,P);
    g.fillRect(0,0,P,H); g.fillRect(W-P,0,P,H);

    // bricks
    for(const b of bricks){
      if(!b.alive) continue;
      const bx=ox+b.c*brickW, by=wallTop+b.r*brickH;
      blk(bx,by,brickW,brickH,b.col);
      blk(bx,by,brickW,1,'rgba(255,240,205,0.16)');
      blk(bx,by+brickH-1,brickW,1,'rgba(60,28,10,0.28)');
    }

    // ball — chunky diamond
    const bxr=Math.round(ball.x), byr=Math.round(ball.y);
    blk(bxr-1,byr,3,1,CREAM);
    blk(bxr,byr-1,1,3,CREAM);
    blk(bxr,byr,1,1,GOLD);

    // paddle — stepped deco form
    const px=Math.round(pad.x-pad.w/2);
    blk(px,pad.y,pad.w,2,GOLD);
    blk(px+2,pad.y-1,pad.w-4,1,CREAM);
    blk(px,pad.y+2,pad.w,1,SHADOW);
  }

  let acc=0,last=performance.now();
  const STEP=1000/60;
  function loop(t){
    let dt=t-last; last=t;
    if(dt>STEP*2) dt=STEP*2;
    acc+=dt;
    let n=0;
    while(acc>=STEP && n<2){ step(); acc-=STEP; n++; }
    if(acc>STEP) acc=0;
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- procedural audio: slow brass drone, arcade-tuned ---------- */
  if(window.self===window.top){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){
        const ac=new AC();
        const master=ac.createGain(); master.gain.value=0.0; master.connect(ac.destination);
        const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700; lp.connect(master);
        const base=[110,164.81,220,329.63];
        base.forEach(function(f,i){
          const o=ac.createOscillator(); o.type=i<2?'triangle':'sine'; o.frequency.value=f;
          const gn=ac.createGain(); gn.gain.value=(i<2?0.16:0.06);
          const lfo=ac.createOscillator(); lfo.frequency.value=0.03+i*0.017;
          const lg=ac.createGain(); lg.gain.value=(i<2?0.07:0.035);
          lfo.connect(lg); lg.connect(gn.gain);
          o.connect(gn); gn.connect(lp); o.start(); lfo.start();
        });
        master.gain.linearRampToValueAtTime(0.11, ac.currentTime+14);
        const go=function(){ if(ac.state==='suspended') ac.resume(); };
        go(); setTimeout(go,1200);
      }
    }catch(e){}
  }
})();
</script>
</body>
</html>
