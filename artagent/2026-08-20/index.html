<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="utf-8">
<title>Ma</title>
<style>
  html,body{
    margin:0;padding:0;
    background:#8a5a34;
    height:100%;
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:1080px;height:1920px;
    max-width:100vw;
    max-height:100vh;
    aspect-ratio:1080/1920;
    margin:0 auto;
    overflow:hidden;
    background:#b06a35;
  }
  /* scale to viewport while keeping 9:16 */
  @media (max-aspect-ratio:1080/1920){
    #stage{width:100vw;height:calc(100vw * 1920 / 1080);}
  }
  @media (min-aspect-ratio:1080/1920){
    #stage{height:100vh;width:calc(100vh * 1080 / 1920);}
  }
  #ground, #ink, #svgLayer{
    position:absolute;inset:0;width:100%;height:100%;
    display:block;
  }
  #svgLayer{pointer-events:none}

  /* the great mark: kabuki actor silhouette, slow breath */
  #actor{
    position:absolute;
    left:6%;
    bottom:2%;
    width:66%;
    transform-origin:50% 100%;
    animation:breathe 26s ease-in-out infinite;
    will-change:transform;
  }
  @keyframes breathe{
    0%   {transform:translate3d(0,0,0) scale(1.000) rotate(0deg);}
    50%  {transform:translate3d(0,-0.7%,0) scale(1.008) rotate(-0.35deg);}
    100% {transform:translate3d(0,0,0) scale(1.000) rotate(0deg);}
  }

  /* the far small mark: the swan crest, drifting at maximum interval */
  #crest{
    position:absolute;
    right:9%;
    top:8%;
    width:15%;
    transform-origin:50% 50%;
    animation:drift 44s ease-in-out infinite;
    will-change:transform;
  }
  @keyframes drift{
    0%   {transform:translate3d(0,0,0) rotate(0deg);}
    50%  {transform:translate3d(-1.6%,2.2%,0) rotate(3deg);}
    100% {transform:translate3d(0,0,0) rotate(0deg);}
  }

  /* the seal: third mark, low right */
  #seal{
    position:absolute;
    right:11%;
    bottom:13%;
    width:7.2%;
    transform-origin:50% 50%;
    animation:seal 34s ease-in-out infinite;
    will-change:transform,opacity;
  }
  @keyframes seal{
    0%,100%{transform:scale(1);opacity:.94;}
    50%    {transform:scale(1.05);opacity:1;}
  }

  #guinea-pig{
    position:absolute;
    left:4.1%;
    bottom:3.4%;
    width:17px;
    opacity:.6;
    filter:sepia(.5) saturate(.7) brightness(.78);
    transform:rotate(-6deg);
    pointer-events:none;
  }

  #date{
    position:absolute;
    left:26px;bottom:20px;
    font:400 13px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;
    letter-spacing:.24em;
    color:rgba(46,22,12,.42);
    user-select:none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="ground" width="540" height="960"></canvas>

  <!-- ONE moving canvas: slow ink bloom in the interval -->
  <canvas id="ink" width="540" height="960"></canvas>

  <svg id="svgLayer" viewBox="0 0 1080 1920" preserveAspectRatio="none">
    <defs>
      <linearGradient id="robe" x1="0" y1="0" x2="0.4" y2="1">
        <stop offset="0" stop-color="#1d2b4a"/>
        <stop offset="0.55" stop-color="#152039"/>
        <stop offset="1" stop-color="#0e1729"/>
      </linearGradient>
      <linearGradient id="sash" x1="0" y1="0" x2="1" y2="0.3">
        <stop offset="0" stop-color="#d8332c"/>
        <stop offset="1" stop-color="#a41f22"/>
      </linearGradient>
      <pattern id="kimonoPat" width="86" height="86" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
        <rect width="86" height="86" fill="none"/>
        <circle cx="22" cy="22" r="12.5" fill="#e8dcc0" opacity="0.86"/>
        <circle cx="22" cy="22" r="5.5" fill="#152039"/>
        <rect x="55" y="8" width="26" height="26" fill="#2f7d6e" opacity="0.9"/>
        <circle cx="66" cy="64" r="9" fill="#d8332c" opacity="0.85"/>
      </pattern>
      <radialGradient id="crestGlow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0.55" stop-color="#f2e6c8" stop-opacity="0.5"/>
        <stop offset="1" stop-color="#f2e6c8" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- MARK 1 : the actor (large) -->
    <g transform="translate(15.64,359.57) scale(0.945358)">
    <g id="actor">
      <g transform="translate(0,0)">
        <!-- outer robe : broad theatrical wedge -->
        <path d="M352 1240
                 C300 1120 296 1010 330 906
                 C356 826 402 770 452 742
                 L556 742
                 C614 776 662 848 686 940
                 C712 1040 706 1150 664 1258
                 L722 1560
                 L640 1596 L520 1610 L392 1596 L300 1562 Z"
              fill="url(#robe)"/>
        <path d="M352 1240
                 C300 1120 296 1010 330 906
                 C356 826 402 770 452 742
                 L556 742
                 C614 776 662 848 686 940
                 C712 1040 706 1150 664 1258
                 L722 1560
                 L640 1596 L520 1610 L392 1596 L300 1562 Z"
              fill="url(#kimonoPat)" opacity="0.5"/>

        <!-- sleeve : huge outstretched plane, the gesture -->
        <path d="M470 800
                 C388 792 268 828 176 916
                 C104 986 62 1064 52 1132
                 C126 1176 214 1188 296 1170
                 C300 1096 336 1010 400 946
                 C432 914 456 892 486 876 Z"
              fill="url(#robe)"/>
        <path d="M470 800
                 C388 792 268 828 176 916
                 C104 986 62 1064 52 1132
                 C126 1176 214 1188 296 1170
                 C300 1096 336 1010 400 946
                 C432 914 456 892 486 876 Z"
              fill="url(#kimonoPat)" opacity="0.42"/>

        <!-- sash : the one saturated accent -->
        <path d="M336 1176 C424 1216 588 1218 678 1178
                 L688 1256 C592 1300 424 1298 330 1252 Z"
              fill="url(#sash)"/>
        <path d="M678 1214 L806 1288 L790 1338 L664 1268 Z" fill="#a41f22"/>

        <!-- collar planes -->
        <path d="M452 742 L520 866 L556 742 Z" fill="#f0e5c8"/>
        <path d="M452 742 L520 866 L556 742 Z" fill="none" stroke="#0e1729" stroke-width="7"/>

        <!-- head : flat mask, turned in profile, no features that read as portrait -->
        <path d="M470 588 C470 528 496 492 540 492 C588 492 614 532 612 592
                 C610 646 586 690 540 692 C494 694 470 648 470 588 Z"
              fill="#f2e6c8"/>
        <!-- wig : bold black mass -->
        <path d="M456 596 C440 512 486 452 546 452 C616 452 652 508 640 584
                 C632 552 604 520 552 520 C500 520 470 552 468 604 Z"
              fill="#0d1220"/>
        <path d="M624 560 C672 566 700 604 690 646 C676 640 652 626 636 606 Z" fill="#0d1220"/>
        <!-- kumadori : two red brushed strokes, the kabuki signature -->
        <path d="M492 566 C516 552 546 552 570 562 L566 578 C544 570 518 570 496 582 Z" fill="#c8302a"/>
        <path d="M500 626 C524 640 552 642 576 634 L572 650 C548 660 520 656 498 642 Z" fill="#c8302a"/>
        <!-- ink contour line -->
        <path d="M470 588 C470 528 496 492 540 492 C588 492 614 532 612 592
                 C610 646 586 690 540 692 C494 694 470 648 470 588 Z"
              fill="none" stroke="#0d1220" stroke-width="6"/>
      </g>
    </g>
    </g>

    <!-- MARK 2 : the crest, far away, top right -->
    <g transform="translate(808.74,141.54) scale(0.172340)">
    <g id="crest">
      <circle cx="540" cy="540" r="470" fill="url(#crestGlow)"/>
      <circle cx="540" cy="540" r="352" fill="#f2e6c8"/>
      <circle cx="540" cy="540" r="352" fill="none" stroke="#0d1220" stroke-width="18"/>
      <!-- swan mon: bold filled formal crest, no thin curves -->
      <path d="M470 700
               C420 660 404 592 434 540
               C462 490 526 476 566 508
               C592 528 596 560 578 578
               C560 596 536 590 528 572
               C556 566 560 542 542 530
               C512 510 470 528 462 566
               C452 612 486 654 540 668
               C596 682 646 664 672 630
               L698 648
               C666 704 578 730 470 700 Z"
            fill="#0d1220"/>
      <path d="M600 630 C640 640 668 636 692 620 L700 646 C666 664 628 664 596 652 Z" fill="#c8302a"/>
    </g>
    </g>

    <!-- MARK 3 : the seal -->
    <g transform="translate(872.33,1581.53) scale(0.092571)">
    <g id="seal">
      <rect x="120" y="120" width="840" height="840" rx="34" fill="#c8302a"/>
      <rect x="216" y="216" width="648" height="648" fill="none" stroke="#f2e6c8" stroke-width="46"/>
      <rect x="216" y="470" width="648" height="46" fill="#f2e6c8"/>
      <rect x="516" y="216" width="46" height="648" fill="#f2e6c8"/>
    </g>
    </g>
  </svg>

  <img id="guinea-pig" src="guineapig.png" alt="">
  <div id="date">2026 · 08 · 20</div>
</div>

<script>
(function(){
  /* ---------- date seed ---------- */
  const DATE = "2026-08-20";
  let h = 2166136261;
  for (let i=0;i<DATE.length;i++){ h ^= DATE.charCodeAt(i); h = Math.imul(h,16777619); }
  function rng(){ h ^= h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)/4294967296); }
  for(let i=0;i<7;i++) rng();

  /* ---------- STATIC GROUND — drawn once ---------- */
  const g = document.getElementById('ground');
  const gc = g.getContext('2d');
  const W = g.width, H = g.height;

  // mid-key ground: one field of saturated terracotta, a single warm plane.
  const hueShift = Math.floor(rng()*14) - 7;
  const base = `hsl(${22+hueShift} 56% 46%)`;
  const upper = `hsl(${28+hueShift} 60% 52%)`;
  const lower = `hsl(${16+hueShift} 52% 40%)`;

  const grd = gc.createLinearGradient(0,0,W*0.25,H);
  grd.addColorStop(0, upper);
  grd.addColorStop(0.48, base);
  grd.addColorStop(1, lower);
  gc.fillStyle = grd;
  gc.fillRect(0,0,W,H);

  // paper tooth: fine, even, integral to the field (single pass, static)
  const img = gc.getImageData(0,0,W,H);
  const d = img.data;
  for (let i=0;i<d.length;i+=4){
    const n = (rng()-0.5)*17;
    d[i]   = Math.max(0,Math.min(255,d[i]  +n*1.1));
    d[i+1] = Math.max(0,Math.min(255,d[i+1]+n));
    d[i+2] = Math.max(0,Math.min(255,d[i+2]+n*0.8));
  }
  gc.putImageData(img,0,0);

  /* ---------- MOVING LAYER: the interval breathing ----------
     A single wide horizontal band of ink-wash that swells and recedes
     across the empty ground between the actor and the crest.
     Filled shape, no strokes, no scatter.                              */
  const ik = document.getElementById('ink');
  const kc = ik.getContext('2d');
  const IW = ik.width, IH = ik.height;

  // band anchored in the interval — the great emptiness at mid-page
  const bandY = IH*0.415;
  const seedA = rng()*Math.PI*2, seedB = rng()*Math.PI*2;

  function drawBand(t){
    kc.clearRect(0,0,IW,IH);

    // wash: a broad filled wedge, edge defined by two slow sine envelopes
    const breath = 0.5 + 0.5*Math.sin(t*0.055 + seedA);
    const height = IH*(0.055 + 0.075*breath);
    const alpha  = 0.10 + 0.16*breath;

    const gr = kc.createLinearGradient(0,bandY-height,0,bandY+height);
    gr.addColorStop(0,  `rgba(18,26,44,0)`);
    gr.addColorStop(0.5,`rgba(18,26,44,${alpha.toFixed(3)})`);
    gr.addColorStop(1,  `rgba(18,26,44,0)`);
    kc.fillStyle = gr;

    kc.beginPath();
    kc.moveTo(0, bandY - height);
    const steps = 10;
    for (let i=0;i<=steps;i++){
      const x = IW*i/steps;
      const y = bandY - height + Math.sin(i*0.9 + t*0.04 + seedB)*height*0.22;
      kc.lineTo(x,y);
    }
    for (let i=steps;i>=0;i--){
      const x = IW*i/steps;
      const y = bandY + height + Math.sin(i*0.7 - t*0.035 + seedA)*height*0.20;
      kc.lineTo(x,y);
    }
    kc.closePath();
    kc.fill();

    // one solid tonal plane rising from the base — the actor's ground shadow
    const rise = IH*(0.075 + 0.018*Math.sin(t*0.03 + seedB));
    const gr2 = kc.createLinearGradient(0,IH-rise,0,IH);
    gr2.addColorStop(0,'rgba(58,20,10,0)');
    gr2.addColorStop(1,'rgba(58,20,10,0.30)');
    kc.fillStyle = gr2;
    kc.fillRect(0,IH-rise,IW,rise);
  }

  let last = 0, acc = 0, T = 0;
  function frame(ms){
    if(!last) last = ms;
    let dt = (ms-last)/1000; last = ms;
    if (dt > 0.05) dt = 0.05;      // clamp
    acc += dt;
    if (acc >= 1/24){              // 24fps is plenty for a slow wash
      T += acc; acc = 0;
      drawBand(T);
    }
    requestAnimationFrame(frame);
  }
  drawBand(0);
  requestAnimationFrame(frame);

  /* ---------- procedural audio: single low shamisen-adjacent drone ---------- */
  if (window.self === window.top){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC){
        const ac = new AC();
        const out = ac.createGain();
        out.gain.value = 0.0;
        out.connect(ac.destination);

        const lp = ac.createBiquadFilter();
        lp.type='lowpass'; lp.frequency.value=460; lp.Q.value=0.6;
        lp.connect(out);

        const roots = [110, 123.47, 146.83];
        const root = roots[Math.floor(rng()*roots.length)];
        [1, 1.5, 2.005].forEach((m,i)=>{
          const o = ac.createOscillator();
          o.type = i===0 ? 'sine':'triangle';
          o.frequency.value = root*m;
          const gn = ac.createGain();
          gn.gain.value = [0.28,0.11,0.055][i];
          o.connect(gn); gn.connect(lp);
          o.start();
          // slow amplitude breath, matched to the visual band
          const lfo = ac.createOscillator();
          lfo.frequency.value = 0.0085 + i*0.0031;
          const lg = ac.createGain(); lg.gain.value = [0.11,0.05,0.024][i];
          lfo.connect(lg); lg.connect(gn.gain); lfo.start();
        });

        out.gain.linearRampToValueAtTime(0.0, ac.currentTime);
        out.gain.linearRampToValueAtTime(0.11, ac.currentTime + 14);

        const resume = ()=>{ if(ac.state==='suspended') ac.resume(); };
        resume();
        document.addEventListener('visibilitychange', resume);
      }
    }catch(e){}
  }
})();
</script>
</body>
</html>
