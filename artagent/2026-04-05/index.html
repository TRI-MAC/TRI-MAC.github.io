<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026-04-06</title>
<style>
  :root{
    --bg1:#06193a;
    --bg2:#112d66;
    --bg3:#ff6b7a;
    --gold:#ffd25a;
    --cream:#ffe9b8;
    --teal:#5ef0da;
    --orange:#ff9c42;
    --red:#ff4c57;
    --ink:#091427;
    --white:#f7f6f0;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(circle at 50% 20%, #2147a8 0%, #0a1d46 35%, #050b1c 75%, #02040a 100%);
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  .frame{
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 16%, #376be8 0%, #214cae 18%, #13295f 38%, #081437 60%, #030816 100%);
    box-shadow:0 0 60px rgba(0,0,0,.45), inset 0 0 180px rgba(255,255,255,.04);
  }

  .skyGlow, .sunAura, .nebula, .scan, .vignette, .halftone, .grain, .orbitLayer, .ringsSvg, .portraitWrap, .date, .rocketField, .stars, .grid, .sunburst {
    position:absolute; inset:0;
    pointer-events:none;
  }

  .skyGlow{
    background:
      radial-gradient(circle at 50% 22%, rgba(255,155,98,.65) 0%, rgba(255,125,78,.35) 13%, rgba(255,95,120,.14) 24%, rgba(0,0,0,0) 45%),
      radial-gradient(circle at 16% 24%, rgba(94,240,218,.12) 0%, transparent 28%),
      radial-gradient(circle at 85% 16%, rgba(255,210,90,.15) 0%, transparent 26%);
    mix-blend-mode:screen;
    animation: driftGlow 28s ease-in-out infinite alternate;
  }

  .sunAura{
    top:160px; left:50%; transform:translateX(-50%);
    width:620px; height:620px; inset:auto;
    border-radius:50%;
    background:
      radial-gradient(circle, rgba(255,236,167,.95) 0 16%, rgba(255,177,86,.95) 16% 28%, rgba(255,102,116,.92) 28% 44%, rgba(255,102,116,.0) 66%);
    filter:blur(0.5px);
    opacity:.92;
    animation: breathe 14s ease-in-out infinite;
  }

  .sunburst svg, .ringsSvg svg { width:100%; height:100%; display:block; }

  .sunburst{
    opacity:.55;
    mix-blend-mode:screen;
    transform-origin:50% 18%;
    animation: slowSpin 90s linear infinite;
  }

  .grid{
    top:58%;
    background:
      linear-gradient(to top, rgba(4,8,20,0.96) 0%, rgba(4,8,20,0.65) 15%, rgba(4,8,20,0.06) 40%, rgba(4,8,20,0) 60%);
  }
  .grid::before{
    content:"";
    position:absolute; left:-12%; right:-12%; bottom:-5%; height:48%;
    transform-origin:50% 100%;
    transform:perspective(900px) rotateX(74deg);
    background:
      repeating-linear-gradient(to right, rgba(94,240,218,.32) 0 2px, transparent 2px 68px),
      repeating-linear-gradient(to bottom, rgba(94,240,218,.22) 0 2px, transparent 2px 62px);
    opacity:.7;
    filter:drop-shadow(0 0 10px rgba(94,240,218,.18));
    animation: gridPulse 16s ease-in-out infinite;
  }

  .rocketField{
    z-index:8;
  }

  .rocket{
    position:absolute;
    width:150px;
    height:420px;
    left:50%;
    top:57%;
    transform:translate(-50%,-50%) rotate(-2deg);
    filter: drop-shadow(0 18px 24px rgba(0,0,0,.35));
    animation: rocketHover 9s ease-in-out infinite;
  }
  .rocket .body{
    position:absolute;
    left:50%; top:38px;
    width:104px; height:250px;
    transform:translateX(-50%);
    background:
      linear-gradient(90deg, #d7263d 0 12%, #ffecc3 12% 30%, #fff7df 30% 70%, #ffd872 70% 88%, #d7263d 88% 100%);
    clip-path:polygon(50% 0%, 84% 12%, 96% 46%, 96% 88%, 50% 100%, 4% 88%, 4% 46%, 16% 12%);
    border:4px solid #10192d;
  }
  .rocket .window{
    position:absolute; left:50%; top:112px; transform:translateX(-50%);
    width:46px; height:46px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff 0 12%, #79e8ff 13% 40%, #2a8dbc 41% 68%, #14345f 69% 100%);
    border:5px solid #10192d;
    box-shadow:0 0 0 6px #ffe28a;
  }
  .rocket .band{
    position:absolute; left:50%; top:182px; transform:translateX(-50%);
    width:110px; height:24px; background:#ff4c57; border:4px solid #10192d;
  }
  .rocket .finL, .rocket .finR{
    position:absolute; bottom:82px; width:46px; height:92px; background:#ff9c42; border:4px solid #10192d;
  }
  .rocket .finL{
    left:14px; clip-path:polygon(100% 0, 100% 100%, 0 84%, 14% 28%);
    transform:skewY(6deg);
  }
  .rocket .finR{
    right:14px; clip-path:polygon(0 0, 100% 28%, 86% 84%, 0 100%);
    transform:skewY(-6deg);
  }
  .rocket .flame{
    position:absolute; left:50%; bottom:24px; transform:translateX(-50%);
    width:58px; height:122px;
    background:linear-gradient(to bottom, #fff8cf 0%, #ffd25a 25%, #ff9c42 52%, #ff5f60 78%, rgba(255,95,96,0) 100%);
    clip-path:polygon(50% 0%, 72% 18%, 88% 48%, 72% 78%, 50% 100%, 28% 78%, 12% 48%, 28% 18%);
    filter:blur(.2px);
    animation: flame 1.7s ease-in-out infinite;
  }
  .rocket .flare{
    position:absolute; left:50%; bottom:-18px; transform:translateX(-50%);
    width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,227,129,.9) 0%, rgba(255,140,66,.5) 22%, rgba(255,92,94,.2) 42%, rgba(255,92,94,0) 66%);
    animation: flarePulse 2.2s ease-in-out infinite;
  }
  .rocket .stripe{
    position:absolute; left:50%; top:66px; transform:translateX(-50%);
    width:20px; height:220px; background:#1c4fd1; border-left:4px solid #10192d; border-right:4px solid #10192d;
  }

  .portraitWrap{
    z-index:7;
    overflow:hidden;
  }

  #portrait-image{
    position:absolute;
    width:560px;
    height:auto;
    left:50%;
    top:44%;
    transform:translate(-50%,-50%) scale(1.02);
    opacity:.92;
    filter:saturate(1.35) contrast(1.1) hue-rotate(-6deg) sepia(.08);
    mix-blend-mode:screen;
    clip-path:ellipse(31% 24% at 50% 43%);
    animation: portraitFloat 18s ease-in-out infinite;
  }

  .portraitHalo{
    position:absolute;
    left:50%; top:43%;
    width:540px; height:700px;
    transform:translate(-50%,-50%);
    background:
      radial-gradient(ellipse at 50% 38%, rgba(255,235,176,.56) 0%, rgba(255,176,93,.30) 24%, rgba(255,92,102,.18) 38%, rgba(255,92,102,0) 62%);
    filter:blur(10px);
    mix-blend-mode:screen;
    animation: haloShift 20s ease-in-out infinite alternate;
  }

  .orbitalMask{
    position:absolute;
    left:50%; top:43%;
    width:640px; height:760px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
      radial-gradient(ellipse at center, rgba(255,255,255,.02) 0 45%, rgba(255,255,255,0) 46%),
      conic-gradient(from 0deg, rgba(255,210,90,.0) 0 12%, rgba(255,210,90,.65) 12% 14%, rgba(255,210,90,0) 14% 37%, rgba(94,240,218,.45) 37% 39%, rgba(0,0,0,0) 39% 63%, rgba(255,108,122,.5) 63% 65%, rgba(0,0,0,0) 65% 100%);
    opacity:.8;
    filter:blur(1px);
    mix-blend-mode:screen;
    animation: orbitRotate 34s linear infinite;
    mask: radial-gradient(ellipse at center, transparent 0 31%, #000 37% 52%, transparent 59%);
    -webkit-mask: radial-gradient(ellipse at center, transparent 0 31%, #000 37% 52%, transparent 59%);
  }

  .planet, .planet2, .planet3{
    position:absolute;
    border-radius:50%;
    z-index:6;
    mix-blend-mode:screen;
  }
  .planet{
    width:170px; height:170px; left:90px; top:235px;
    background:
      radial-gradient(circle at 35% 30%, #fff6d8 0 8%, #ffe07e 9% 34%, #ff8e54 35% 67%, #ff5f6c 68% 100%);
    box-shadow:0 0 40px rgba(255,169,90,.25);
    animation: planetDrift1 20s ease-in-out infinite alternate;
  }
  .planet::after{
    content:"";
    position:absolute; inset:-22px;
    border-radius:50%;
    border:8px solid rgba(255,240,176,.75);
    transform:rotate(-18deg) scaleY(.42);
    top:58px;
  }
  .planet2{
    width:88px; height:88px; right:150px; top:340px;
    background:radial-gradient(circle at 35% 35%, #fff 0 12%, #7df3de 13% 40%, #1caea1 41% 70%, #0e5866 71% 100%);
    opacity:.9;
    animation: planetDrift2 24s ease-in-out infinite alternate;
  }
  .planet3{
    width:56px; height:56px; left:160px; top:700px;
    background:radial-gradient(circle at 35% 35%, #fff 0 10%, #ffd67a 11% 44%, #ff7f5d 45% 100%);
    opacity:.85;
    animation: planetDrift3 26s ease-in-out infinite alternate;
  }

  .nebula{
    background:
      radial-gradient(ellipse at 24% 36%, rgba(255,122,102,.14) 0%, transparent 20%),
      radial-gradient(ellipse at 72% 30%, rgba(94,240,218,.11) 0%, transparent 18%),
      radial-gradient(ellipse at 42% 72%, rgba(255,210,90,.08) 0%, transparent 24%);
    filter:blur(24px);
    animation: driftNebula 36s ease-in-out infinite alternate;
  }

  .halftone{
    opacity:.16;
    background-image: radial-gradient(circle, rgba(255,255,255,.85) 0.8px, transparent 1px);
    background-size: 8px 8px;
    mix-blend-mode:overlay;
    mask: radial-gradient(circle at 50% 34%, #000 0 36%, transparent 63%);
    -webkit-mask: radial-gradient(circle at 50% 34%, #000 0 36%, transparent 63%);
  }

  .scan{
    opacity:.08;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.6) 0 1px, transparent 1px 4px);
    mix-blend-mode:soft-light;
  }

  .grain{
    opacity:.08;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,255,255,.7) 0 0.8px, transparent 1px),
      radial-gradient(circle at 80% 40%, rgba(255,255,255,.55) 0 0.7px, transparent 1px),
      radial-gradient(circle at 35% 75%, rgba(255,255,255,.5) 0 0.7px, transparent 1px),
      radial-gradient(circle at 60% 60%, rgba(255,255,255,.45) 0 0.7px, transparent 1px);
    background-size: 18px 18px, 22px 22px, 19px 19px, 17px 17px;
    mix-blend-mode:screen;
    animation: grainShift .8s steps(2) infinite;
  }

  .vignette{
    background:
      linear-gradient(to bottom, rgba(255,255,255,.03), rgba(255,255,255,0) 16%, rgba(0,0,0,0) 78%, rgba(0,0,0,.28)),
      radial-gradient(circle at center, rgba(0,0,0,0) 52%, rgba(0,0,0,.18) 82%, rgba(0,0,0,.38) 100%);
  }

  .date{
    inset:auto 20px 16px auto;
    z-index:20;
    color:rgba(255,246,219,.58);
    font-size:16px;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    right:130px;
    bottom:257px;
    opacity:.58;
    filter:saturate(.9) hue-rotate(18deg) brightness(.72);
    z-index:9;
    transform:rotate(-3deg);
  }

  canvas#starsCanvas{
    position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none;
  }

  @keyframes slowSpin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes orbitRotate { from{transform:translate(-50%,-50%) rotate(0deg)} to{transform:translate(-50%,-50%) rotate(360deg)} }
  @keyframes breathe { 0%,100%{transform:translateX(-50%) scale(1)} 50%{transform:translateX(-50%) scale(1.035)} }
  @keyframes rocketHover { 0%,100%{transform:translate(-50%,-50%) rotate(-2deg)} 50%{transform:translate(-50%,-52%) rotate(1.2deg)} }
  @keyframes portraitFloat { 0%,100%{transform:translate(-50%,-50%) scale(1.02)} 50%{transform:translate(-50%,-49%) scale(1.045)} }
  @keyframes haloShift { 0%{transform:translate(-50%,-50%) scale(1)} 100%{transform:translate(-50%,-50%) scale(1.08)} }
  @keyframes flame { 0%,100%{height:122px; filter:blur(.2px)} 50%{height:142px; filter:blur(1px)} }
  @keyframes flarePulse { 0%,100%{transform:translateX(-50%) scale(.92); opacity:.72} 50%{transform:translateX(-50%) scale(1.08); opacity:.92} }
  @keyframes driftGlow { 0%{transform:translateY(0)} 100%{transform:translateY(-16px)} }
  @keyframes driftNebula { 0%{transform:translateX(-10px) translateY(0)} 100%{transform:translateX(12px) translateY(-10px)} }
  @keyframes planetDrift1 { 0%{transform:translate(0,0)} 100%{transform:translate(8px,-12px)} }
  @keyframes planetDrift2 { 0%{transform:translate(0,0)} 100%{transform:translate(-10px,8px)} }
  @keyframes planetDrift3 { 0%{transform:translate(0,0)} 100%{transform:translate(7px,-9px)} }
  @keyframes gridPulse { 0%,100%{opacity:.66} 50%{opacity:.88} }
  @keyframes grainShift { 0%{transform:translate(0,0)} 100%{transform:translate(1px,-1px)} }

  @media (max-width: 700px){
    .date{font-size:12px}
  }
</style>
</head>
<body>
  <div class="frame">
    <canvas id="starsCanvas" width="1080" height="1920"></canvas>

    <div class="skyGlow"></div>
    <div class="nebula"></div>

    <div class="sunAura"></div>

    <div class="sunburst">
      <svg viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
        <g transform="translate(540 360)">
          <g opacity="0.85">
            <polygon points="0,-250 18,-80 -18,-80" fill="#ffd25a"/>
            <polygon points="0,250 18,80 -18,80" fill="#ffd25a"/>
            <polygon points="250,0 80,18 80,-18" fill="#ff9c42"/>
            <polygon points="-250,0 -80,18 -80,-18" fill="#ff9c42"/>
            <polygon points="177,-177 62,-42 42,-62" fill="#ffe9b8"/>
            <polygon points="-177,177 -62,42 -42,62" fill="#ffe9b8"/>
            <polygon points="-177,-177 -42,-62 -62,-42" fill="#ff6b7a"/>
            <polygon points="177,177 42,62 62,42" fill="#ff6b7a"/>
          </g>
          <g opacity="0.6" transform="rotate(22.5)">
            <polygon points="0,-300 16,-110 -16,-110" fill="#5ef0da"/>
            <polygon points="0,300 16,110 -16,110" fill="#5ef0da"/>
            <polygon points="300,0 110,16 110,-16" fill="#ffd25a"/>
            <polygon points="-300,0 -110,16 -110,-16" fill="#ffd25a"/>
            <polygon points="212,-212 66,-44 44,-66" fill="#ff9c42"/>
            <polygon points="-212,212 -66,44 -44,66" fill="#ff9c42"/>
            <polygon points="-212,-212 -44,-66 -66,-44" fill="#ffe9b8"/>
            <polygon points="212,212 44,66 66,44" fill="#ffe9b8"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="planet"></div>
    <div class="planet2"></div>
    <div class="planet3"></div>

    <div class="portraitWrap">
      <div class="portraitHalo"></div>
      <img id="portrait-image" src="portrait.png" alt="" />
      <div class="orbitalMask"></div>
    </div>

    <div class="ringsSvg">
      <svg viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
        <g fill="none" stroke-linecap="round">
          <ellipse cx="540" cy="825" rx="300" ry="112" stroke="rgba(255,226,138,.7)" stroke-width="9" transform="rotate(-5 540 825)"/>
          <ellipse cx="540" cy="825" rx="362" ry="144" stroke="rgba(94,240,218,.45)" stroke-width="4" stroke-dasharray="4 18" transform="rotate(7 540 825)"/>
          <ellipse cx="540" cy="825" rx="246" ry="90" stroke="rgba(255,111,124,.44)" stroke-width="3" stroke-dasharray="2 12" transform="rotate(-14 540 825)"/>
          <path d="M160 1120 C 330 1070, 750 1070, 920 1120" stroke="rgba(255,210,90,.6)" stroke-width="10"/>
          <path d="M200 1160 C 360 1120, 720 1120, 880 1160" stroke="rgba(94,240,218,.35)" stroke-width="4" stroke-dasharray="3 16"/>
        </g>
      </svg>
    </div>

    <div class="rocketField">
      <div class="rocket">
        <div class="flare"></div>
        <div class="body"></div>
        <div class="stripe"></div>
        <div class="window"></div>
        <div class="band"></div>
        <div class="finL"></div>
        <div class="finR"></div>
        <div class="flame"></div>
      </div>
    </div>

    <div class="grid"></div>
    <div class="halftone"></div>
    <div class="scan"></div>
    <div class="grain"></div>
    <div class="vignette"></div>

    <img id="guinea-pig" src="guineapig.png" alt="" />
    <div class="date">2026-04-06</div>
  </div>

<script>
(() => {
  const seedStr = "2026-04-06";
  function xmur3(str){
    let h = 1779033703 ^ str.length;
    for(let i=0;i<str.length;i++){
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = h << 13 | h >>> 19;
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    }
  }
  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
  }
  const seed = xmur3(seedStr)();
  const rand = mulberry32(seed);

  const canvas = document.getElementById('starsCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const stars = [];
  const starCount = 220;
  for(let i=0;i<starCount;i++){
    const band = rand();
    const y = band < 0.7 ? rand()*900 : rand()*H;
    stars.push({
      x: rand()*W,
      y,
      r: rand()*1.9 + 0.3,
      a: rand()*0.8 + 0.15,
      tw: rand()*Math.PI*2,
      speed: 0.003 + rand()*0.012,
      hue: rand() < 0.14 ? 48 : (rand() < 0.28 ? 175 : 0)
    });
  }

  const rays = [];
  for(let i=0;i<16;i++){
    rays.push({
      ang:(Math.PI*2/16)*i + rand()*0.06,
      len: 300 + rand()*140,
      w: 10 + rand()*16,
      c: i%3===0 ? '255,210,90' : (i%3===1 ? '255,156,66' : '94,240,218')
    });
  }

  let t = 0;
  function draw(){
    t += 1/60;
    ctx.clearRect(0,0,W,H);

    for(const s of stars){
      const pulse = 0.65 + 0.35*Math.sin(t*s.speed*60 + s.tw);
      let color = '255,255,255';
      if(s.hue===48) color='255,227,145';
      if(s.hue===175) color='122,243,224';
      ctx.beginPath();
      ctx.fillStyle = `rgba(${color},${s.a * pulse})`;
      ctx.arc(s.x, s.y, s.r * (0.8 + pulse*0.45), 0, Math.PI*2);
      ctx.fill();
      if(s.r > 1.25 && pulse > 0.75){
        ctx.strokeStyle = `rgba(${color},${0.12 * pulse})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(s.x - 6, s.y);
        ctx.lineTo(s.x + 6, s.y);
        ctx.moveTo(s.x, s.y - 6);
        ctx.lineTo(s.x, s.y + 6);
        ctx.stroke();
      }
    }

    const cx = W/2, cy = 360;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t*0.01);
    for(const r of rays){
      ctx.save();
      ctx.rotate(r.ang);
      const grad = ctx.createLinearGradient(0, -30, 0, -r.len);
      grad.addColorStop(0, `rgba(${r.c},0.0)`);
      grad.addColorStop(0.16, `rgba(${r.c},0.2)`);
      grad.addColorStop(1, `rgba(${r.c},0.0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-r.w/2, -80);
      ctx.lineTo(r.w/2, -80);
      ctx.lineTo(r.w*0.18, -r.len);
      ctx.lineTo(-r.w*0.18, -r.len);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    const horizonY = 1160;
    for(let i=0;i<7;i++){
      const yy = horizonY + i*22 + Math.sin(t*0.6 + i)*2;
      ctx.strokeStyle = `rgba(94,240,218,${0.09 - i*0.008})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(110, yy);
      ctx.quadraticCurveTo(W/2, yy - 18 + i*1.5, W-110, yy);
      ctx.stroke();
    }

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
