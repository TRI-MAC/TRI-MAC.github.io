<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generative Art 2026-04-26</title>
<style>
  :root{
    --bg:#efe6d1;
    --paper:#f5edd8;
    --ink:#111111;
    --red:#d43a2f;
    --blue:#2457d7;
    --yellow:#f1c43a;
    --green:#4d7a42;
    --cream:#f9f3e6;
    --threadDark:#1b1a17;
    --threadLight:#ead9b8;
    --metal:#b89f66;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:
      radial-gradient(circle at 20% 20%, #fff7e5 0%, #f1e6cf 28%, #dfd1b5 65%, #cbbd9f 100%);
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #stage{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7777778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      linear-gradient(180deg, rgba(255,247,228,.96), rgba(233,220,195,.98)),
      radial-gradient(circle at 30% 20%, rgba(212,58,47,.12), transparent 28%),
      radial-gradient(circle at 80% 66%, rgba(36,87,215,.10), transparent 25%);
    box-shadow:0 20px 70px rgba(0,0,0,.28);
  }

  #paperGrain, #weaveCanvas, #cutsCanvas, #dustCanvas, #typeCanvas, #maskCanvas, #audioViz {
    position:absolute; inset:0; width:100%; height:100%;
    display:block;
    pointer-events:none;
  }

  #paperGrain{
    opacity:.23;
    mix-blend-mode:multiply;
  }

  #weaveLayer{
    position:absolute; inset:0;
    filter:saturate(1.08) contrast(1.05);
    mask-image:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.95) 6%, rgba(0,0,0,.98) 94%, transparent 100%);
    -webkit-mask-image:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.95) 6%, rgba(0,0,0,.98) 94%, transparent 100%);
  }

  .rip{
    position:absolute;
    background:var(--cream);
    border:2px solid rgba(17,17,17,.8);
    box-shadow:0 7px 0 rgba(17,17,17,.12), 0 16px 30px rgba(0,0,0,.14);
    transform-origin:center;
    mix-blend-mode:multiply;
    opacity:.92;
  }

  #rip1{ width:180px; height:280px; left:36px; top:210px; transform:rotate(-7deg); clip-path:polygon(0 7%, 96% 0, 100% 91%, 7% 100%);}
  #rip2{ width:210px; height:160px; right:60px; top:120px; transform:rotate(6deg); clip-path:polygon(7% 0, 100% 9%, 93% 100%, 0 88%);}
  #rip3{ width:190px; height:240px; right:54px; bottom:220px; transform:rotate(-12deg); clip-path:polygon(0 14%, 88% 0, 100% 86%, 9% 100%);}
  #rip4{ width:160px; height:130px; left:120px; bottom:330px; transform:rotate(8deg); clip-path:polygon(0 0, 100% 13%, 86% 100%, 10% 90%);}

  #portrait-wrap{
    position:absolute;
    left:132px;
    top:365px;
    width:430px;
    height:615px;
    padding:18px;
    background:
      linear-gradient(135deg, rgba(22,22,22,.92), rgba(52,52,52,.82)),
      linear-gradient(180deg, rgba(255,255,255,.14), rgba(0,0,0,.18));
    border:5px solid rgba(20,20,20,.9);
    border-radius:28px 84px 41px 73px / 57px 29px 76px 34px;
    box-shadow:
      0 0 0 2px rgba(242,196,58,.35) inset,
      0 18px 40px rgba(0,0,0,.34);
    transform:rotate(-3.8deg);
    overflow:hidden;
    z-index:6;
    animation:portraitShift 24s ease-in-out infinite;
  }
  #portrait-wrap::before{
    content:"";
    position:absolute; inset:-10px;
    background:
      repeating-linear-gradient(90deg,
        rgba(241,196,58,.20) 0 3px,
        transparent 3px 18px),
      linear-gradient(180deg, transparent 0%, rgba(212,58,47,.15) 100%);
    mix-blend-mode:screen;
    opacity:.75;
    pointer-events:none;
  }
  #portrait-wrap::after{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 18%, rgba(241,196,58,.22), transparent 18%),
      linear-gradient(180deg, transparent 70%, rgba(0,0,0,.28) 100%);
    pointer-events:none;
  }
  #portrait-image{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    filter:grayscale(1) contrast(1.35) brightness(.88) sepia(.18);
    mix-blend-mode:screen;
    opacity:.92;
    transform:scale(1.06) translateY(2%);
  }

  #art-wrap{
    position:absolute;
    width:360px;
    height:360px;
    right:86px;
    top:915px;
    z-index:5;
    transform:rotate(7deg);
    animation:artTilt 20s ease-in-out infinite;
  }
  #art-wrap::before{
    content:"";
    position:absolute; inset:-20px;
    background:
      radial-gradient(circle, rgba(212,58,47,.17), transparent 62%),
      radial-gradient(circle at 70% 30%, rgba(36,87,215,.14), transparent 35%);
    filter:blur(16px);
    opacity:.8;
    pointer-events:none;
  }
  #art-image{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    position:relative;
    z-index:2;
    opacity:.97;
    border:4px solid rgba(17,17,17,.92);
    clip-path:polygon(12% 0, 100% 11%, 88% 100%, 0 89%);
    filter:contrast(1.16) saturate(1.08) sepia(.08);
    box-shadow:0 18px 35px rgba(0,0,0,.28);
  }
  #art-wrap .threadMask{
    position:absolute; inset:-8px;
    z-index:3;
    background:
      repeating-linear-gradient(0deg,
        rgba(17,17,17,.08) 0 8px,
        rgba(255,255,255,.02) 8px 14px),
      repeating-linear-gradient(90deg,
        transparent 0 24px,
        rgba(241,196,58,.28) 24px 31px,
        transparent 31px 54px);
    mix-blend-mode:multiply;
    clip-path:polygon(12% 0, 100% 11%, 88% 100%, 0 89%);
    animation:weftDrift 18s ease-in-out infinite;
    pointer-events:none;
  }

  #svgOverlay{
    position:absolute; inset:0;
    z-index:8;
    pointer-events:none;
    overflow:visible;
  }

  .stamp{
    fill:none;
    stroke:var(--ink);
    stroke-width:8;
    opacity:.95;
  }
  .stamp.red{ stroke:var(--red);}
  .stamp.blue{ stroke:var(--blue);}
  .stamp.yellow{ stroke:var(--yellow);}
  .stampFill{ opacity:.2; }

  .band{
    position:absolute;
    left:-10%;
    width:120%;
    height:170px;
    z-index:4;
    mix-blend-mode:multiply;
    filter:drop-shadow(0 7px 14px rgba(0,0,0,.16));
    opacity:.9;
    mask-image:linear-gradient(90deg, transparent 0%, rgba(0,0,0,.96) 12%, rgba(0,0,0,.96) 88%, transparent 100%);
    -webkit-mask-image:linear-gradient(90deg, transparent 0%, rgba(0,0,0,.96) 12%, rgba(0,0,0,.96) 88%, transparent 100%);
  }
  #band1{
    top:130px;
    background:
      repeating-linear-gradient(90deg,
        var(--red) 0 32px,
        #f1e5c0 32px 46px,
        var(--blue) 46px 82px,
        #181818 82px 95px,
        var(--yellow) 95px 116px,
        #f1e5c0 116px 134px);
    transform:rotate(-8deg) translateX(-6%);
    animation:bandSlide1 28s ease-in-out infinite;
  }
  #band2{
    top:820px;
    background:
      repeating-linear-gradient(90deg,
        #181818 0 18px,
        #f1e5c0 18px 31px,
        var(--yellow) 31px 60px,
        var(--red) 60px 81px,
        #f1e5c0 81px 97px,
        var(--blue) 97px 133px);
    transform:rotate(10deg) translateX(4%);
    animation:bandSlide2 34s ease-in-out infinite;
  }
  #band3{
    bottom:90px;
    background:
      repeating-linear-gradient(90deg,
        var(--blue) 0 29px,
        #f1e5c0 29px 43px,
        #181818 43px 72px,
        var(--red) 72px 97px,
        #f1e5c0 97px 111px,
        var(--yellow) 111px 138px);
    transform:rotate(-5deg) translateX(-2%);
    animation:bandSlide3 32s ease-in-out infinite;
  }

  #date{
    position:absolute;
    right:20px;
    bottom:14px;
    z-index:20;
    color:rgba(17,17,17,.55);
    font-size:15px;
    letter-spacing:.16em;
    mix-blend-mode:multiply;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:29px;
    bottom:246px;
    z-index:7;
    opacity:.58;
    filter:brightness(.74) contrast(1.02) sepia(.08);
    transform:rotate(-8deg);
  }

  @keyframes bandSlide1{
    0%,100%{ transform:rotate(-8deg) translateX(-6%) translateY(0);}
    50%{ transform:rotate(-6deg) translateX(1%) translateY(-10px);}
  }
  @keyframes bandSlide2{
    0%,100%{ transform:rotate(10deg) translateX(4%) translateY(0);}
    50%{ transform:rotate(12deg) translateX(-3%) translateY(8px);}
  }
  @keyframes bandSlide3{
    0%,100%{ transform:rotate(-5deg) translateX(-2%) translateY(0);}
    50%{ transform:rotate(-7deg) translateX(4%) translateY(-8px);}
  }
  @keyframes portraitShift{
    0%,100%{ transform:rotate(-3.8deg) translateY(0) scale(1);}
    50%{ transform:rotate(-2deg) translateY(-10px) scale(1.012);}
  }
  @keyframes artTilt{
    0%,100%{ transform:rotate(7deg) translateY(0) scale(1);}
    50%{ transform:rotate(4deg) translateY(8px) scale(1.02);}
  }
  @keyframes weftDrift{
    0%,100%{ transform:translateY(0);}
    50%{ transform:translateY(6px);}
  }
</style>
</head>
<body>
  <div id="stage" aria-label="Generative collage textile artwork">
    <canvas id="paperGrain" width="1080" height="1920"></canvas>

    <div id="weaveLayer">
      <canvas id="weaveCanvas" width="1080" height="1920"></canvas>
    </div>

    <div class="band" id="band1"></div>
    <div class="band" id="band2"></div>
    <div class="band" id="band3"></div>

    <div class="rip" id="rip1"></div>
    <div class="rip" id="rip2"></div>
    <div class="rip" id="rip3"></div>
    <div class="rip" id="rip4"></div>

    <div id="portrait-wrap">
      <img id="portrait-image" src="portrait.png" alt="" />
    </div>

    <div id="art-wrap">
      <img id="art-image" src="art.png" alt="" />
      <div class="threadMask"></div>
    </div>

    <canvas id="cutsCanvas" width="1080" height="1920"></canvas>

    <svg id="svgOverlay" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="fadeBand" x1="0" x2="1">
          <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
          <stop offset="12%" stop-color="rgba(0,0,0,1)"/>
          <stop offset="88%" stop-color="rgba(0,0,0,1)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
        </linearGradient>
      </defs>

      <g opacity="0.9">
        <rect x="92" y="82" width="262" height="90" fill="#f1c43a" stroke="#111" stroke-width="9" transform="rotate(-8 92 82)"/>
        <circle cx="249" cy="136" r="50" class="stamp blue"/>
        <rect x="742" y="168" width="215" height="74" fill="#2457d7" stroke="#111" stroke-width="8" transform="rotate(6 742 168)"/>
        <circle cx="868" cy="210" r="38" class="stamp red"/>
        <polygon points="770,1450 950,1390 990,1570 790,1608" fill="#d43a2f" stroke="#111" stroke-width="8" opacity="0.9"/>
        <polygon points="124,1455 318,1500 280,1666 100,1600" fill="#2457d7" stroke="#111" stroke-width="8" opacity="0.88"/>
      </g>

      <g opacity="0.8">
        <circle cx="208" cy="1040" r="108" fill="none" stroke="#111" stroke-width="16"/>
        <circle cx="208" cy="1040" r="75" fill="#f1c43a" stroke="#111" stroke-width="10"/>
        <circle cx="208" cy="1040" r="18" fill="#111"/>
      </g>

      <g id="movingMarks">
        <rect x="650" y="530" width="280" height="40" fill="#111" opacity="0.9" transform="rotate(-17 650 530)"/>
        <rect x="666" y="596" width="250" height="22" fill="#d43a2f" opacity="0.9" transform="rotate(-17 666 596)"/>
        <rect x="178" y="1280" width="330" height="50" fill="#111" opacity="0.9" transform="rotate(13 178 1280)"/>
        <rect x="210" y="1366" width="270" height="26" fill="#f1c43a" opacity="0.95" transform="rotate(13 210 1366)"/>
      </g>

      <g opacity="0.85">
        <path d="M105 1845 L345 1710 L372 1765 L132 1900 Z" fill="#111"/>
        <path d="M735 104 L980 36 L1007 102 L762 170 Z" fill="#111"/>
      </g>
    </svg>

    <canvas id="typeCanvas" width="1080" height="1920"></canvas>
    <canvas id="dustCanvas" width="1080" height="1920"></canvas>
    <img id="guinea-pig" src="guineapig.png" alt="" />
    <div id="date">2026-04-26</div>
    <canvas id="audioViz" width="1080" height="1920"></canvas>
  </div>

<script>
(function(){
  const W = 1080, H = 1920;
  const dateSeed = "2026-04-26";
  function hashString(str){
    let h = 1779033703 ^ str.length;
    for(let i=0;i<str.length;i++){
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = h << 13 | h >>> 19;
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    }
  }
  const seedGen = hashString(dateSeed + "-dada-textile");
  let seed = seedGen();
  function rnd(){
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  function pick(arr){ return arr[Math.floor(rnd()*arr.length)] }

  const grain = document.getElementById('paperGrain');
  const gctx = grain.getContext('2d');
  const img = gctx.createImageData(W,H);
  for(let i=0;i<img.data.length;i+=4){
    const v = 220 + Math.floor(rnd()*35);
    img.data[i]=v; img.data[i+1]=v-4; img.data[i+2]=v-10; img.data[i+3]=26 + Math.floor(rnd()*26);
  }
  gctx.putImageData(img,0,0);
  for(let i=0;i<1600;i++){
    gctx.fillStyle = `rgba(80,60,20,${0.02 + rnd()*0.03})`;
    const x = rnd()*W, y = rnd()*H, w = rnd()*2+1, h = rnd()*2+1;
    gctx.fillRect(x,y,w,h);
  }

  const weaveCanvas = document.getElementById('weaveCanvas');
  const wctx = weaveCanvas.getContext('2d');

  const palette = ["#111111","#d43a2f","#2457d7","#f1c43a","#efe2c2"];
  const cols = 40;
  const rows = 66;
  const cw = W/cols;
  const ch = H/rows;

  const pattern = [];
  for(let y=0;y<rows;y++){
    pattern[y]=[];
    for(let x=0;x<cols;x++){
      const cx = x-cols/2, cy = y-rows/2;
      const radial = Math.sqrt(cx*cx + cy*cy);
      let idx = 0;
      const a = Math.atan2(cy,cx);
      const motif = Math.sin(x*0.48 + y*0.31) + Math.cos(radial*0.55) + Math.sin(a*6);
      if ((x+y)%7===0) idx = 3;
      if (motif > 1.3) idx = 1;
      else if (motif < -0.9) idx = 2;
      else if (Math.abs(cx) < 6 || Math.abs(cy) < 8) idx = 4;
      if ((x>11&&x<28&&y>20&&y<44) && ((x+y)%3===0)) idx = (idx+1)%palette.length;
      pattern[y][x]=idx;
    }
  }

  function drawWeave(t){
    wctx.clearRect(0,0,W,H);
    wctx.fillStyle = "#eadfc8";
    wctx.fillRect(0,0,W,H);

    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        const px = x*cw;
        const py = y*ch;
        const over = ((x + y + Math.floor(t*0.35)) % 2) === 0;
        const color = palette[pattern[y][x]];
        wctx.fillStyle = color;

        const padX = cw*0.08;
        const padY = ch*0.10;
        const bulge = 1.5 + Math.sin((x*0.4+y*0.3)+t*0.25)*0.7;

        if(over){
          wctx.globalAlpha = .94;
          wctx.fillRect(px+padX, py+ch*0.2-bulge, cw-padX*2, ch*0.6+bulge*2);
          wctx.fillStyle = "rgba(255,255,255,0.09)";
          wctx.fillRect(px+padX+2, py+ch*0.22-bulge, cw-padX*2-4, 3);
          wctx.fillStyle = "rgba(0,0,0,0.14)";
          wctx.fillRect(px+padX+3, py+ch*0.74+bulge*0.2, cw-padX*2-6, 4);
        } else {
          wctx.globalAlpha = .90;
          wctx.fillRect(px+cw*0.22-bulge, py+padY, cw*0.56+bulge*2, ch-padY*2);
          wctx.fillStyle = "rgba(255,255,255,0.08)";
          wctx.fillRect(px+cw*0.24-bulge, py+padY+2, 3, ch-padY*2-4);
          wctx.fillStyle = "rgba(0,0,0,0.16)";
          wctx.fillRect(px+cw*0.72+bulge*0.2, py+padY+3, 4, ch-padY*2-6);
        }

        wctx.globalAlpha = 1;
      }
    }

    wctx.save();
    wctx.globalAlpha = .11;
    for(let x=0;x<cols;x++){
      wctx.fillStyle = (x%5===0) ? "#000" : "#fff";
      wctx.fillRect(x*cw,0,1,H);
    }
    for(let y=0;y<rows;y++){
      wctx.fillStyle = (y%4===0) ? "#000" : "#fff";
      wctx.fillRect(0,y*ch,W,1);
    }
    wctx.restore();

    wctx.save();
    const grad = wctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,"rgba(255,255,255,0.16)");
    grad.addColorStop(0.4,"rgba(255,255,255,0)");
    grad.addColorStop(1,"rgba(0,0,0,0.12)");
    wctx.fillStyle = grad;
    wctx.fillRect(0,0,W,H);
    wctx.restore();
  }

  const cutsCanvas = document.getElementById('cutsCanvas');
  const cctx = cutsCanvas.getContext('2d');
  function drawCuts(t){
    cctx.clearRect(0,0,W,H);
    cctx.save();
    cctx.globalCompositeOperation = "multiply";

    const scraps = [
      {x:120,y:130,w:250,h:210,rot:-0.22,col:"#f1c43a"},
      {x:760,y:260,w:220,h:260,rot:0.19,col:"#2457d7"},
      {x:85,y:1490,w:270,h:220,rot:0.14,col:"#d43a2f"},
      {x:675,y:1315,w:280,h:240,rot:-0.17,col:"#111111"},
      {x:380,y:980,w:130,h:340,rot:0.07,col:"#efe2c2"}
    ];

    scraps.forEach((s,i)=>{
      cctx.save();
      cctx.translate(s.x+s.w/2, s.y+s.h/2 + Math.sin(t*0.3+i)*6);
      cctx.rotate(s.rot + Math.sin(t*0.15+i*2)*0.02);
      cctx.fillStyle = s.col;
      cctx.strokeStyle = "#111";
      cctx.lineWidth = 5;
      cctx.beginPath();
      cctx.moveTo(-s.w*0.48, -s.h*0.42);
      cctx.lineTo(s.w*0.42, -s.h*0.48);
      cctx.lineTo(s.w*0.48, s.h*0.38);
      cctx.lineTo(-s.w*0.36, s.h*0.48);
      cctx.closePath();
      cctx.fill();
      cctx.stroke();

      cctx.globalAlpha = 0.15;
      cctx.fillStyle = "#fff";
      for(let k=0;k<6;k++) cctx.fillRect(-s.w/2+10, -s.h/2+18+k*18, s.w*(0.55+rnd()*0.2), 4);
      cctx.restore();
    });

    cctx.restore();
  }

  const typeCanvas = document.getElementById('typeCanvas');
  const tctx = typeCanvas.getContext('2d');
  const chars = "AEROTEXTILECUTPASTEWEFTWARP2626042026XQZ".split("");
  function drawType(t){
    tctx.clearRect(0,0,W,H);
    tctx.save();
    tctx.textBaseline = "top";
    for(let i=0;i<80;i++){
      const x = (i*127 + 90) % 1200 - 60;
      const y = (i*211) % 1850 + Math.sin(t*0.25+i)*10;
      const rot = ((i%2===0)?-1:1) * (0.05 + (i%7)*0.012) + Math.sin(t*0.1+i)*0.015;
      tctx.save();
      tctx.translate(x,y);
      tctx.rotate(rot);
      tctx.font = `${18 + (i%6)*8}px Arial Black, Arial, sans-serif`;
      tctx.fillStyle = i%5===0 ? "rgba(212,58,47,0.72)" :
                       i%5===1 ? "rgba(36,87,215,0.72)" :
                       i%5===2 ? "rgba(17,17,17,0.78)" :
                       i%5===3 ? "rgba(241,196,58,0.78)" :
                                 "rgba(255,248,230,0.75)";
      const word = chars[(i*3)%chars.length] + chars[(i*5+2)%chars.length] + chars[(i*7+3)%chars.length];
      tctx.fillText(word,0,0);
      tctx.restore();
    }
    tctx.restore();
  }

  const dustCanvas = document.getElementById('dustCanvas');
  const dctx = dustCanvas.getContext('2d');
  const specks = Array.from({length:120}, (_,i)=>({
    x:rnd()*W,y:rnd()*H,r:1+rnd()*2.4,dx:(rnd()-.5)*0.06,dy:(rnd()-.5)*0.06,a:0.04+rnd()*0.08
  }));
  function drawDust(t){
    dctx.clearRect(0,0,W,H);
    for(const s of specks){
      s.x += s.dx; s.y += s.dy;
      if(s.x<0) s.x=W; if(s.x>W) s.x=0;
      if(s.y<0) s.y=H; if(s.y>H) s.y=0;
      dctx.fillStyle = `rgba(60,40,20,${s.a})`;
      dctx.beginPath();
      dctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      dctx.fill();
    }
  }

  const audioViz = document.getElementById('audioViz');
  const avctx = audioViz.getContext('2d');
  function drawAudioRings(t, level){
    avctx.clearRect(0,0,W,H);
    avctx.save();
    avctx.globalCompositeOperation = "multiply";
    const cx = 785, cy = 425;
    for(let i=0;i<4;i++){
      const r = 70 + i*30 + Math.sin(t*0.4+i)*4 + level*18;
      avctx.strokeStyle = i%2===0 ? "rgba(212,58,47,0.22)" : "rgba(36,87,215,0.18)";
      avctx.lineWidth = 10 - i*1.5;
      avctx.beginPath();
      avctx.arc(cx,cy,r,0,Math.PI*2);
      avctx.stroke();
    }
    avctx.restore();
  }

  let analyser = null, audioData = null, audioLevel = 0;
  if (window.self === window.top) {
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0.018;

      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      analyser = ctx.createAnalyser();
      analyser.fftSize = 128;
      audioData = new Uint8Array(analyser.frequencyBinCount);

      osc1.type = "triangle";
      osc2.type = "sawtooth";
      osc1.frequency.value = 92;
      osc2.frequency.value = 138;
      filter.type = "bandpass";
      filter.frequency.value = 540;
      filter.Q.value = 0.6;
      lfo.type = "sine";
      lfo.frequency.value = 0.07;
      lfoGain.gain.value = 70;

      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);
      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(master);
      master.connect(analyser);
      analyser.connect(ctx.destination);

      osc1.start();
      osc2.start();
      lfo.start();

      const now = ctx.currentTime;
      master.gain.setValueAtTime(0.0001, now);
      master.gain.linearRampToValueAtTime(0.018, now + 4.5);
    }catch(e){}
  }

  const movingMarks = document.getElementById('movingMarks');
  function animate(ms){
    const t = ms * 0.001;
    drawWeave(t);
    drawCuts(t);
    drawType(t);
    drawDust(t);

    if(analyser && audioData){
      analyser.getByteFrequencyData(audioData);
      let sum = 0;
      for(let i=0;i<audioData.length;i++) sum += audioData[i];
      audioLevel = (sum / audioData.length) / 255;
    } else {
      audioLevel = 0.12 + 0.08*Math.sin(t*0.5);
    }
    drawAudioRings(t, audioLevel);

    const y1 = 530 + Math.sin(t*0.34)*18;
    const y2 = 1280 + Math.sin(t*0.28+1.4)*22;
    movingMarks.setAttribute("transform", `translate(${Math.sin(t*0.22)*16} ${Math.sin(t*0.19)*10})`);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
