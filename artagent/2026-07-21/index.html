<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generative Art 2026-07-21</title>
<style>
  :root{
    --bg1:#08142e;
    --bg2:#15104a;
    --bg3:#ff5a22;
    --gold:#ffd45b;
    --cream:#fff1cc;
    --teal:#33e0d0;
    --pink:#ff4ca0;
    --blue:#59a9ff;
    --ink:#09101d;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050814;
    font-family:Arial, Helvetica, sans-serif;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 14%, rgba(255,170,80,.75) 0 9%, rgba(255,145,40,.5) 9%, rgba(255,145,40,0) 22%),
      linear-gradient(180deg, #1a2460 0%, #0d1640 34%, #190f4d 57%, #ff5d24 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 26px 80px rgba(0,0,0,.5);
  }

  #bgCanvas, #mazeCanvas, #particleCanvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
  }
  #bgCanvas{z-index:0}
  #mazeCanvas{z-index:3; opacity:.98}
  #particleCanvas{z-index:8; pointer-events:none}

  #space-overlay{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0) 18%, rgba(255,255,255,0) 80%, rgba(255,180,80,.08)),
      repeating-linear-gradient(180deg, rgba(255,255,255,.04) 0 1px, rgba(255,255,255,0) 1px 7px);
    opacity:.4;
    mix-blend-mode:screen;
  }

  .sunburst{
    position:absolute;
    left:50%; top:11%;
    width:72%; height:72%;
    transform:translate(-50%,-50%);
    z-index:2; pointer-events:none;
    border-radius:50%;
    opacity:.78;
    filter:blur(.2px);
    mask-image:radial-gradient(circle, rgba(0,0,0,1) 0 52%, rgba(0,0,0,.65) 66%, rgba(0,0,0,0) 84%);
    -webkit-mask-image:radial-gradient(circle, rgba(0,0,0,1) 0 52%, rgba(0,0,0,.65) 66%, rgba(0,0,0,0) 84%);
    animation:slowRotate 80s linear infinite;
  }
  .sunburst::before{
    content:"";
    position:absolute; inset:-6%;
    border-radius:50%;
    background:
      conic-gradient(from 0deg,
        rgba(255,212,91,.95) 0deg 7deg,
        rgba(255,212,91,0) 7deg 15deg,
        rgba(255,241,204,.9) 15deg 20deg,
        rgba(255,241,204,0) 20deg 30deg,
        rgba(255,128,56,.85) 30deg 37deg,
        rgba(255,128,56,0) 37deg 45deg,
        rgba(255,212,91,.92) 45deg 52deg,
        rgba(255,212,91,0) 52deg 60deg,
        rgba(255,241,204,.85) 60deg 68deg,
        rgba(255,241,204,0) 68deg 75deg,
        rgba(255,95,80,.85) 75deg 82deg,
        rgba(255,95,80,0) 82deg 90deg,
        rgba(255,212,91,.95) 90deg 97deg,
        rgba(255,212,91,0) 97deg 105deg,
        rgba(255,241,204,.92) 105deg 112deg,
        rgba(255,241,204,0) 112deg 120deg,
        rgba(255,128,56,.85) 120deg 127deg,
        rgba(255,128,56,0) 127deg 135deg,
        rgba(255,212,91,.92) 135deg 142deg,
        rgba(255,212,91,0) 142deg 150deg,
        rgba(255,241,204,.85) 150deg 158deg,
        rgba(255,241,204,0) 158deg 165deg,
        rgba(255,95,80,.85) 165deg 172deg,
        rgba(255,95,80,0) 172deg 180deg,
        rgba(255,212,91,.95) 180deg 187deg,
        rgba(255,212,91,0) 187deg 195deg,
        rgba(255,241,204,.9) 195deg 202deg,
        rgba(255,241,204,0) 202deg 210deg,
        rgba(255,128,56,.85) 210deg 217deg,
        rgba(255,128,56,0) 217deg 225deg,
        rgba(255,212,91,.92) 225deg 232deg,
        rgba(255,212,91,0) 232deg 240deg,
        rgba(255,241,204,.85) 240deg 248deg,
        rgba(255,241,204,0) 248deg 255deg,
        rgba(255,95,80,.85) 255deg 262deg,
        rgba(255,95,80,0) 262deg 270deg,
        rgba(255,212,91,.95) 270deg 277deg,
        rgba(255,212,91,0) 277deg 285deg,
        rgba(255,241,204,.9) 285deg 292deg,
        rgba(255,241,204,0) 292deg 300deg,
        rgba(255,128,56,.85) 300deg 307deg,
        rgba(255,128,56,0) 307deg 315deg,
        rgba(255,212,91,.92) 315deg 322deg,
        rgba(255,212,91,0) 322deg 330deg,
        rgba(255,241,204,.85) 330deg 338deg,
        rgba(255,241,204,0) 338deg 345deg,
        rgba(255,95,80,.85) 345deg 352deg,
        rgba(255,95,80,0) 352deg 360deg
      );
  }

  #planetBand{
    position:absolute;
    inset:auto -8% 16% -8%;
    height:30%;
    z-index:4;
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    background:
      linear-gradient(180deg, rgba(255,170,84,.1), rgba(255,102,34,.0) 22%),
      linear-gradient(180deg, #ff8938 0%, #ff652a 40%, #dc3c25 100%);
    box-shadow:
      inset 0 16px 30px rgba(255,220,170,.22),
      inset 0 -26px 40px rgba(125,20,10,.25);
    transform-origin:center bottom;
    animation:horizonBreathe 20s ease-in-out infinite;
    mask-image:linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,.9) 18%, rgba(0,0,0,1) 100%);
    -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,.9) 18%, rgba(0,0,0,1) 100%);
  }

  #portrait-backglow{
    position:absolute;
    left:50%;
    top:53%;
    width:54%;
    height:44%;
    transform:translate(-50%,-50%);
    z-index:5;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 46%, rgba(255,231,165,.96) 0 8%, rgba(255,186,87,.85) 18%, rgba(255,123,54,.55) 34%, rgba(255,82,122,.24) 52%, rgba(255,82,122,0) 72%);
    filter:blur(18px);
    opacity:.9;
    animation:haloPulse 14s ease-in-out infinite;
    mask-image:radial-gradient(circle, rgba(0,0,0,1) 0 55%, rgba(0,0,0,.35) 70%, rgba(0,0,0,0) 86%);
    -webkit-mask-image:radial-gradient(circle, rgba(0,0,0,1) 0 55%, rgba(0,0,0,.35) 70%, rgba(0,0,0,0) 86%);
  }

  #portrait-image{
    position:absolute;
    left:47%;
    bottom:15%;
    width:49%;
    z-index:6;
    transform:translateX(-50%);
    filter:
      saturate(1.15)
      contrast(1.05)
      hue-rotate(-8deg)
      drop-shadow(0 18px 20px rgba(8,7,18,.35))
      drop-shadow(0 0 20px rgba(255,216,120,.26));
    animation:portraitDrift 18s ease-in-out infinite;
  }

  #rocketSvg{
    position:absolute;
    right:8%;
    top:26%;
    width:24%;
    height:auto;
    z-index:7;
    overflow:visible;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,.28));
    animation:rocketArc 22s ease-in-out infinite;
  }

  #foregroundArcs{
    position:absolute; inset:0; z-index:7; pointer-events:none;
    opacity:.9;
  }

  #date{
    position:absolute;
    right:18px;
    bottom:14px;
    z-index:20;
    color:rgba(255,245,220,.62);
    font-size:13px;
    letter-spacing:.12em;
    text-transform:none;
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    left:17px;
    bottom:129px;
    width:18px;
    height:auto;
    z-index:9;
    opacity:.58;
    filter:saturate(.9) brightness(.8) drop-shadow(0 1px 2px rgba(0,0,0,.35));
  }

  @keyframes slowRotate{
    from{transform:translate(-50%,-50%) rotate(0deg)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
  }
  @keyframes haloPulse{
    0%,100%{transform:translate(-50%,-50%) scale(1); opacity:.82}
    50%{transform:translate(-50%,-50%) scale(1.05); opacity:.98}
  }
  @keyframes portraitDrift{
    0%,100%{transform:translateX(-50%) translateY(0px)}
    50%{transform:translateX(-50%) translateY(-8px)}
  }
  @keyframes rocketArc{
    0%,100%{transform:translate(0,0) rotate(-18deg)}
    50%{transform:translate(-16px,10px) rotate(-12deg)}
  }
  @keyframes horizonBreathe{
    0%,100%{transform:scaleX(1) scaleY(1)}
    50%{transform:scaleX(1.03) scaleY(1.02)}
  }
</style>
</head>
<body>
<div id="frame">
  <canvas id="bgCanvas"></canvas>
  <div id="space-overlay"></div>
  <div class="sunburst"></div>
  <div id="portrait-backglow"></div>

  <canvas id="mazeCanvas"></canvas>

  <div id="planetBand"></div>

  <img id="portrait-image" src="portrait.png" alt="" />

  <svg id="rocketSvg" viewBox="0 0 220 360" aria-hidden="true">
    <g>
      <ellipse cx="110" cy="322" rx="18" ry="20" fill="rgba(255,130,40,.35)"/>
      <path d="M110 24
               C144 58, 162 102, 162 170
               L162 234
               L110 270
               L58 234
               L58 170
               C58 102, 76 58, 110 24Z"
            fill="#fff1cc" stroke="#101632" stroke-width="8"/>
      <path d="M110 24
               C132 48, 146 82, 150 128
               L70 128
               C74 82, 88 48, 110 24Z"
            fill="#ff5a22"/>
      <circle cx="110" cy="158" r="28" fill="#59a9ff" stroke="#101632" stroke-width="8"/>
      <path d="M58 198 L24 236 L58 242 Z" fill="#33e0d0" stroke="#101632" stroke-width="8"/>
      <path d="M162 198 L196 236 L162 242 Z" fill="#ff4ca0" stroke="#101632" stroke-width="8"/>
      <path d="M80 252 L70 318 L104 286 Z" fill="#ffd45b" stroke="#101632" stroke-width="8"/>
      <path d="M140 252 L150 318 L116 286 Z" fill="#ffd45b" stroke="#101632" stroke-width="8"/>
      <path d="M96 286 L110 352 L124 286 Z" fill="#ff7d2e" stroke="#101632" stroke-width="8"/>
      <path d="M102 314 L110 352 L118 314 Z" fill="#fff1cc" opacity=".75"/>
      <circle cx="110" cy="158" r="10" fill="#dff9ff"/>
    </g>
  </svg>

  <svg id="foregroundArcs" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="arcFade" x1="0" x2="1">
        <stop offset="0" stop-color="rgba(255,255,255,0)"/>
        <stop offset=".18" stop-color="rgba(255,214,91,.96)"/>
        <stop offset=".82" stop-color="rgba(255,76,160,.92)"/>
        <stop offset="1" stop-color="rgba(255,255,255,0)"/>
      </linearGradient>
      <linearGradient id="tealFade" x1="0" x2="1">
        <stop offset="0" stop-color="rgba(255,255,255,0)"/>
        <stop offset=".15" stop-color="rgba(51,224,208,.95)"/>
        <stop offset=".85" stop-color="rgba(255,241,204,.9)"/>
        <stop offset="1" stop-color="rgba(255,255,255,0)"/>
      </linearGradient>
      <filter id="softBlur"><feGaussianBlur stdDeviation="4"/></filter>
    </defs>
    <path d="M-120 1330 A760 760 0 0 1 720 820" fill="none" stroke="url(#arcFade)" stroke-width="54" stroke-linecap="round" opacity=".72" filter="url(#softBlur)">
      <animate attributeName="d" dur="18s" repeatCount="indefinite"
        values="M-120 1330 A760 760 0 0 1 720 820;
                M-80 1320 A790 790 0 0 1 760 810;
                M-120 1330 A760 760 0 0 1 720 820"/>
    </path>
    <path d="M300 1560 A670 670 0 0 1 1210 1110" fill="none" stroke="url(#tealFade)" stroke-width="34" stroke-linecap="round" opacity=".74">
      <animate attributeName="d" dur="20s" repeatCount="indefinite"
        values="M300 1560 A670 670 0 0 1 1210 1110;
                M260 1575 A700 700 0 0 1 1180 1090;
                M300 1560 A670 670 0 0 1 1210 1110"/>
    </path>
    <rect x="160" y="1220" width="300" height="22" rx="11" fill="#ffd45b" opacity=".9" transform="rotate(-21 160 1220)">
      <animateTransform attributeName="transform" type="rotate" values="-21 160 1220;-18 160 1220;-21 160 1220" dur="14s" repeatCount="indefinite"/>
    </rect>
    <rect x="690" y="1320" width="240" height="18" rx="9" fill="#33e0d0" opacity=".82" transform="rotate(17 690 1320)">
      <animateTransform attributeName="transform" type="rotate" values="17 690 1320;14 690 1320;17 690 1320" dur="16s" repeatCount="indefinite"/>
    </rect>
  </svg>

  <canvas id="particleCanvas"></canvas>
  <img id="guinea-pig" src="guineapig.png" alt="" />
  <div id="date">2026-07-21</div>
</div>

<script>
(() => {
  const frame = document.getElementById('frame');
  const bgCanvas = document.getElementById('bgCanvas');
  const mazeCanvas = document.getElementById('mazeCanvas');
  const particleCanvas = document.getElementById('particleCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  const mazeCtx = mazeCanvas.getContext('2d');
  const pCtx = particleCanvas.getContext('2d');

  const seedString = "2026-07-21";
  let seed = 0;
  for (let i = 0; i < seedString.length; i++) seed = (seed * 131 + seedString.charCodeAt(i)) >>> 0;
  function rnd() {
    seed = (1664525 * seed + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  function pick(arr){ return arr[Math.floor(rnd()*arr.length)] }

  let W=1080, H=1920, DPR=1;
  function resize(){
    const r = frame.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    [bgCanvas, mazeCanvas, particleCanvas].forEach(c=>{
      c.width = Math.round(r.width * DPR);
      c.height = Math.round(r.height * DPR);
      c.style.width = r.width + 'px';
      c.style.height = r.height + 'px';
    });
    bgCtx.setTransform(DPR,0,0,DPR,0,0);
    mazeCtx.setTransform(DPR,0,0,DPR,0,0);
    pCtx.setTransform(DPR,0,0,DPR,0,0);
    W = r.width; H = r.height;
    initMaze();
    initParticles();
    drawBackground(0);
  }
  window.addEventListener('resize', resize);

  const stars = [];
  const constellations = [];
  function initBackgroundData(){
    stars.length = 0;
    for(let i=0;i<180;i++){
      stars.push({
        x:rnd()*1080, y:rnd()*1250,
        r: rnd()*2.1 + .4,
        a: rnd()*0.8 + .2,
        c: pick(["#fff1cc","#ffd45b","#59a9ff","#ff8c59"])
      });
    }
    constellations.length = 0;
    for(let i=0;i<7;i++){
      const cx = 140 + rnd()*800;
      const cy = 180 + rnd()*520;
      constellations.push({
        x:cx, y:cy,
        s:70 + rnd()*70,
        rot:rnd()*Math.PI
      });
    }
  }

  function drawStarShape(ctx,x,y,r,rot,color){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const a = i * Math.PI/4;
      const rr = i%2===0 ? r : r*0.45;
      ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
    }
    ctx.closePath();
    ctx.fillStyle=color;
    ctx.fill();
    ctx.restore();
  }

  function drawBackground(t){
    bgCtx.clearRect(0,0,W,H);

    const g = bgCtx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#1d2e74");
    g.addColorStop(.33,"#141d57");
    g.addColorStop(.63,"#281b63");
    g.addColorStop(1,"#ff6228");
    bgCtx.fillStyle = g;
    bgCtx.fillRect(0,0,W,H);

    const rg = bgCtx.createRadialGradient(W*.5,H*.17,20,W*.5,H*.17,W*.33);
    rg.addColorStop(0,"rgba(255,240,188,.98)");
    rg.addColorStop(.12,"rgba(255,213,91,.88)");
    rg.addColorStop(.27,"rgba(255,157,66,.4)");
    rg.addColorStop(.6,"rgba(255,132,50,0)");
    bgCtx.fillStyle = rg;
    bgCtx.fillRect(0,0,W,H);

    bgCtx.save();
    for(const s of stars){
      const x = s.x/1080*W;
      const y = s.y/1920*H;
      bgCtx.globalAlpha = s.a * (0.9 + 0.1*Math.sin(t*0.0002 + s.x));
      if(s.r > 1.7){
        drawStarShape(bgCtx, x, y, s.r*1.8, t*0.00008 + s.y, s.c);
      }else{
        bgCtx.fillStyle = s.c;
        bgCtx.beginPath();
        bgCtx.arc(x,y,s.r,0,Math.PI*2);
        bgCtx.fill();
      }
    }
    bgCtx.restore();

    bgCtx.save();
    bgCtx.lineWidth = Math.max(2, W/540);
    bgCtx.globalAlpha = .25;
    for(const c of constellations){
      const x = c.x/1080*W, y = c.y/1920*H, s = c.s/1080*W;
      bgCtx.strokeStyle = pick(["#ffd45b","#59a9ff","#fff1cc"]);
      bgCtx.beginPath();
      bgCtx.moveTo(x-s*.4, y);
      bgCtx.lineTo(x+s*.4, y);
      bgCtx.moveTo(x, y-s*.4);
      bgCtx.lineTo(x, y+s*.4);
      bgCtx.stroke();
      bgCtx.beginPath();
      bgCtx.arc(x,y,s*.28,0,Math.PI*2);
      bgCtx.stroke();
    }
    bgCtx.restore();

    bgCtx.save();
    bgCtx.translate(W*.5, H*.82);
    bgCtx.scale(1.18, .22);
    const g2 = bgCtx.createRadialGradient(0,0,10,0,0,W*.42);
    g2.addColorStop(0,"rgba(255,244,208,.16)");
    g2.addColorStop(.5,"rgba(255,196,90,.10)");
    g2.addColorStop(1,"rgba(255,120,40,0)");
    bgCtx.fillStyle = g2;
    bgCtx.beginPath();
    bgCtx.arc(0,0,W*.42,0,Math.PI*2);
    bgCtx.fill();
    bgCtx.restore();
  }

  const particles = [];
  function initParticles(){
    particles.length=0;
    for(let i=0;i<28;i++){
      particles.push({
        x: W*0.28 + rnd()*W*0.38,
        y: H*0.26 + rnd()*H*0.55,
        s: 1 + rnd()*4,
        vx: -0.08 + rnd()*0.16,
        vy: -0.18 - rnd()*0.12,
        hue: pick([45,190,330,210,20]),
        phase: rnd()*Math.PI*2
      });
    }
  }
  function drawParticles(t){
    pCtx.clearRect(0,0,W,H);
    for(const p of particles){
      p.x += p.vx;
      p.y += p.vy + Math.sin(t*0.001 + p.phase)*0.04;
      if(p.y < H*0.16){ p.y = H*0.82; p.x = W*0.28 + rnd()*W*0.42; }
      if(p.x < W*0.18) p.x = W*0.72;
      if(p.x > W*0.78) p.x = W*0.22;
      pCtx.fillStyle = `hsla(${p.hue}, 95%, 72%, 0.68)`;
      pCtx.beginPath();
      pCtx.arc(p.x,p.y,p.s,0,Math.PI*2);
      pCtx.fill();

      if(p.s > 2.2){
        pCtx.fillStyle = `hsla(${p.hue}, 100%, 84%, 0.28)`;
        pCtx.fillRect(p.x-p.s*2.8,p.y-.9,p.s*5.6,1.8);
        pCtx.fillRect(p.x-.9,p.y-p.s*2.8,1.8,p.s*5.6);
      }
    }
  }

  const cols = 17;
  let rows, cell, grid, stack, carveOrder, solverPath, solutionAnim, carveIndex, solveIndex;
  const marginX = 88, marginTop = 280, marginBottom = 380;
  let loopState = "carve";
  let holdTimer = 0;

  function initMaze(){
    cell = Math.floor((W - marginX*2) / cols);
    rows = Math.floor((H - marginTop - marginBottom) / cell);
    grid = [];
    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        grid.push({
          x,y, visited:false,
          walls:[1,1,1,1],
          parent:-1
        });
      }
    }
    stack = [];
    carveOrder = [];
    solverPath = [];
    solutionAnim = [];
    carveIndex = 0;
    solveIndex = 0;
    loopState = "carve";
    holdTimer = 0;

    const start = 0;
    grid[start].visited = true;
    stack.push(start);
    carveOrder.push(start);
    while(stack.length){
      const current = stack[stack.length-1];
      const cellObj = grid[current];
      const dirs = [];
      const {x,y} = cellObj;
      if(y>0 && !grid[current-cols].visited) dirs.push([0,-1,current-cols,0,2]);
      if(x<cols-1 && !grid[current+1].visited) dirs.push([1,0,current+1,1,3]);
      if(y<rows-1 && !grid[current+cols].visited) dirs.push([0,1,current+cols,2,0]);
      if(x>0 && !grid[current-1].visited) dirs.push([-1,0,current-1,3,1]);
      if(dirs.length){
        const d = dirs[Math.floor(rnd()*dirs.length)];
        grid[current].walls[d[3]] = 0;
        grid[d[2]].walls[d[4]] = 0;
        grid[d[2]].visited = true;
        grid[d[2]].parent = current;
        stack.push(d[2]);
        carveOrder.push(d[2]);
      }else{
        stack.pop();
      }
    }

    for(const c of grid) c.visited = false;

    const startIdx = 0;
    const endIdx = cols*rows - 1;
    const q = [startIdx];
    const prev = new Array(grid.length).fill(-1);
    const seen = new Array(grid.length).fill(false);
    seen[startIdx] = true;
    while(q.length){
      const i = q.shift();
      if(i === endIdx) break;
      const c = grid[i];
      const nbs = [];
      if(!c.walls[0]) nbs.push(i-cols);
      if(!c.walls[1]) nbs.push(i+1);
      if(!c.walls[2]) nbs.push(i+cols);
      if(!c.walls[3]) nbs.push(i-1);
      for(const n of nbs){
        if(n>=0 && n<grid.length && !seen[n]){
          seen[n]=true; prev[n]=i; q.push(n);
        }
      }
    }
    let p = endIdx;
    const rev = [];
    while(p !== -1){ rev.push(p); p = prev[p]; }
    solverPath = rev.reverse();
  }

  function cellPos(i){
    const c = grid[i];
    return {
      x: marginX + c.x*cell + cell/2,
      y: marginTop + c.y*cell + cell/2
    };
  }

  function drawMaze(t){
    mazeCtx.clearRect(0,0,W,H);

    const mazeX = marginX;
    const mazeY = marginTop;
    const mazeW = cols*cell;
    const mazeH = rows*cell;

    const bg = mazeCtx.createLinearGradient(mazeX,mazeY,mazeX,mazeY+mazeH);
    bg.addColorStop(0,"rgba(255,236,192,.07)");
    bg.addColorStop(.5,"rgba(255,115,55,.06)");
    bg.addColorStop(1,"rgba(17,17,39,.10)");
    mazeCtx.fillStyle = bg;
    mazeCtx.fillRect(mazeX-12, mazeY-12, mazeW+24, mazeH+24);

    mazeCtx.save();
    mazeCtx.shadowBlur = 0;
    mazeCtx.lineCap = "square";
    mazeCtx.lineWidth = Math.max(3, cell*0.12);

    // grid pips
    mazeCtx.globalAlpha = .12;
    for(let y=0;y<=rows;y++){
      for(let x=0;x<=cols;x++){
        mazeCtx.fillStyle = ((x+y)%2===0) ? "#fff1cc" : "#ffd45b";
        mazeCtx.beginPath();
        mazeCtx.arc(marginX + x*cell, marginTop + y*cell, Math.max(1.4,cell*0.04),0,Math.PI*2);
        mazeCtx.fill();
      }
    }

    const carvedCount = loopState === "carve" ? carveIndex : carveOrder.length;
    for(let n=0;n<carvedCount;n++){
      const i = carveOrder[n];
      const c = grid[i];
      const x = marginX + c.x*cell;
      const y = marginTop + c.y*cell;
      const colorMix = n / carveOrder.length;
      mazeCtx.fillStyle = colorMix < .5 ? `rgba(255,${180+Math.floor(50*colorMix)},95,.17)` : `rgba(${Math.floor(90+100*colorMix)},${180+Math.floor(40*colorMix)},255,.14)`;
      mazeCtx.fillRect(x+2,y+2,cell-4,cell-4);

      mazeCtx.globalAlpha = 1;
      mazeCtx.strokeStyle = "#fff0c7";
      if(c.walls[0]){ mazeCtx.beginPath(); mazeCtx.moveTo(x,y); mazeCtx.lineTo(x+cell,y); mazeCtx.stroke(); }
      mazeCtx.strokeStyle = "#59a9ff";
      if(c.walls[1]){ mazeCtx.beginPath(); mazeCtx.moveTo(x+cell,y); mazeCtx.lineTo(x+cell,y+cell); mazeCtx.stroke(); }
      mazeCtx.strokeStyle = "#ff4ca0";
      if(c.walls[2]){ mazeCtx.beginPath(); mazeCtx.moveTo(x+cell,y+cell); mazeCtx.lineTo(x,y+cell); mazeCtx.stroke(); }
      mazeCtx.strokeStyle = "#ffd45b";
      if(c.walls[3]){ mazeCtx.beginPath(); mazeCtx.moveTo(x,y+cell); mazeCtx.lineTo(x,y); mazeCtx.stroke(); }
    }

    // frame
    mazeCtx.globalAlpha = .9;
    mazeCtx.strokeStyle = "#101632";
    mazeCtx.lineWidth = Math.max(8, cell*0.18);
    mazeCtx.strokeRect(mazeX-10, mazeY-10, mazeW+20, mazeH+20);
    mazeCtx.lineWidth = Math.max(3, cell*0.08);
    mazeCtx.strokeStyle = "#fff1cc";
    mazeCtx.strokeRect(mazeX-10, mazeY-10, mazeW+20, mazeH+20);

    // Start/end pop marks
    const s0 = cellPos(0), s1 = cellPos(grid.length-1);
    mazeCtx.fillStyle = "#33e0d0";
    mazeCtx.beginPath(); mazeCtx.arc(s0.x,s0.y,cell*.16,0,Math.PI*2); mazeCtx.fill();
    mazeCtx.fillStyle = "#ff4ca0";
    mazeCtx.beginPath(); mazeCtx.arc(s1.x,s1.y,cell*.16,0,Math.PI*2); mazeCtx.fill();

    // solver
    if(loopState !== "carve"){
      mazeCtx.save();
      mazeCtx.lineCap = "round";
      mazeCtx.lineJoin = "round";
      mazeCtx.shadowColor = "rgba(255,220,120,.45)";
      mazeCtx.shadowBlur = 12;
      mazeCtx.strokeStyle = "#fff4ca";
      mazeCtx.lineWidth = Math.max(8, cell*0.19);
      mazeCtx.beginPath();
      for(let i=0;i<solveIndex;i++){
        const p = cellPos(solverPath[i]);
        if(i===0) mazeCtx.moveTo(p.x,p.y);
        else mazeCtx.lineTo(p.x,p.y);
      }
      mazeCtx.stroke();

      mazeCtx.strokeStyle = "#ff5a22";
      mazeCtx.lineWidth = Math.max(3, cell*0.09);
      mazeCtx.beginPath();
      for(let i=0;i<solveIndex;i++){
        const p = cellPos(solverPath[i]);
        if(i===0) mazeCtx.moveTo(p.x,p.y);
        else mazeCtx.lineTo(p.x,p.y);
      }
      mazeCtx.stroke();

      const headIdx = Math.max(0, solveIndex-1);
      const hp = cellPos(solverPath[headIdx] || 0);
      mazeCtx.fillStyle = "#ffd45b";
      mazeCtx.beginPath();
      mazeCtx.arc(hp.x, hp.y, cell*.24 + Math.sin(t*0.005)*1.5, 0, Math.PI*2);
      mazeCtx.fill();
      mazeCtx.restore();
    }

    // decorative badges
    mazeCtx.save();
    const topY = mazeY - cell*1.05;
    for(let i=0;i<cols;i++){
      const cx = marginX + i*cell + cell/2;
      drawBadge(cx, topY, i, t);
    }
    mazeCtx.restore();
    mazeCtx.restore();
  }

  function drawBadge(cx, cy, i, t){
    const r = cell*.18;
    mazeCtx.save();
    mazeCtx.translate(cx,cy);
    mazeCtx.rotate((i%2?1:-1) * Math.sin(t*0.0007 + i)*0.15);
    mazeCtx.fillStyle = i%3===0 ? "#ffd45b" : i%3===1 ? "#59a9ff" : "#ff4ca0";
    if(i%4===0){
      mazeCtx.fillRect(-r,-r,r*2,r*2);
    } else if(i%4===1){
      mazeCtx.beginPath(); mazeCtx.arc(0,0,r,0,Math.PI*2); mazeCtx.fill();
    } else if(i%4===2){
      mazeCtx.beginPath(); mazeCtx.moveTo(0,-r*1.2); mazeCtx.lineTo(r*1.1,r); mazeCtx.lineTo(-r*1.1,r); mazeCtx.closePath(); mazeCtx.fill();
    } else {
      for(let k=0;k<8;k++){
        const a = k*Math.PI/4;
        const rr = k%2===0 ? r*1.2 : r*.55;
        if(k===0) mazeCtx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr);
        else mazeCtx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
      }
      mazeCtx.closePath(); mazeCtx.fill();
    }
    mazeCtx.restore();
  }

  let last = 0;
  function animate(ts){
    if(!last) last = ts;
    drawBackground(ts);
    drawMaze(ts);
    drawParticles(ts);

    if(loopState === "carve"){
      carveIndex += 3;
      if(carveIndex >= carveOrder.length){
        carveIndex = carveOrder.length;
        holdTimer++;
        if(holdTimer > 45){ loopState = "solve"; holdTimer = 0; }
      }
    } else if(loopState === "solve"){
      solveIndex += 1.15;
      if(solveIndex >= solverPath.length){
        solveIndex = solverPath.length;
        holdTimer++;
        if(holdTimer > 120){ loopState = "fade"; holdTimer = 0; }
      }
    } else if(loopState === "fade"){
      holdTimer++;
      mazeCanvas.style.opacity = String(Math.max(0.25, 0.98 - holdTimer/120 * 0.73));
      if(holdTimer > 120){
        mazeCanvas.style.opacity = "0.98";
        initMaze();
      }
    }

    requestAnimationFrame(animate);
  }

  initBackgroundData();
  resize();
  requestAnimationFrame(animate);

  if (window.self === window.top) {
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain();
      master.gain.value = 0.026;
      master.connect(ctx.destination);

      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const osc3 = ctx.createOscillator();
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      const g1 = ctx.createGain();
      const g2 = ctx.createGain();
      const g3 = ctx.createGain();

      osc1.type = "sine";   osc1.frequency.value = 146.83;
      osc2.type = "triangle"; osc2.frequency.value = 220.0;
      osc3.type = "sine";   osc3.frequency.value = 293.66;
      lfo.type = "sine";    lfo.frequency.value = 0.043;

      g1.gain.value = 0.23;
      g2.gain.value = 0.11;
      g3.gain.value = 0.08;
      lfoGain.gain.value = 120;

      filter.type = "lowpass";
      filter.frequency.value = 520;
      filter.Q.value = 0.7;

      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      osc1.connect(g1); osc2.connect(g2); osc3.connect(g3);
      g1.connect(filter); g2.connect(filter); g3.connect(filter);
      filter.connect(master);

      osc1.start(); osc2.start(); osc3.start(); lfo.start();

      setInterval(()=>{
        const now = ctx.currentTime;
        const freqs = [
          [146.83,220.0,293.66],
          [164.81,246.94,329.63],
          [130.81,196.0,261.63],
          [174.61,233.08,349.23]
        ];
        const f = freqs[Math.floor((Date.now()/8000)%freqs.length)];
        osc1.frequency.linearRampToValueAtTime(f[0], now + 4);
        osc2.frequency.linearRampToValueAtTime(f[1], now + 4);
        osc3.frequency.linearRampToValueAtTime(f[2], now + 4);
      }, 8000);

      const resume = () => ctx.resume().catch(()=>{});
      document.addEventListener('visibilitychange', resume);
      resume();
    }catch(e){}
  }
})();
</script>
</body>
</html>
