</style></head><body>
<div id="stage">
<canvas id="tile" width="540" height="960"></canvas>

<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d77a"/><stop offset=".5" stop-color="#b7832c"/><stop offset="1" stop-color="#f2cd6a"/></linearGradient></defs>

</svg>

<script>
const st=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);st.style.transform=`translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
let seed=20261019;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const ph=R()*6.28;
const c=document.getElementById('tile').getContext('2d');
const sp=document.getElementById('spill').getContext('2d');
const S=90;// half-res tile
// Escher-ish interlocking: square tiles with edge bulges (tab in/out)
function tilePath(x,y,s,b){c.beginPath();c.moveTo(x,y);
c.lineTo(x+s*.35,y);c.arc(x+s*.5,y,s*.15*b,Math.PI,0,false);c.lineTo(x+s,y);
c.lineTo(x+s,y+s*.35);c.arc(x+s,y+s*.5,s*.15*b,-Math.PI/2,Math.PI/2,false);c.lineTo(x+s,y+s);
c.lineTo(x+s*.65,y+s);c.arc(x+s*.5,y+s,s*.15*b,0,Math.PI,false);c.lineTo(x,y+s);
c.lineTo(x,y+s*.65);c.arc(x,y+s*.5,s*.15*b,Math.PI/2,-Math.PI/2,false);c.closePath()}
function draw(t){
c.fillStyle='#f3ead6';c.fillRect(0,0,540,960);
const b=Math.sin(t*.00025+ph);
for(let j=-1;j<12;j++)for(let i=-1;i<7;i++){
const x=i*S,y=j*S,odd=(i+j)&1;
const dx=270-x-S/2,dy=480-y-S/2,d=Math.hypot(dx,dy);
const fade=Math.max(0,Math.min(1,(d-140)/60))*Math.max(0,1-(d-300)/260);
if(fade<=0)continue;
const w=Math.sin(t*.0004-d*.012+ph)*.5+.5;
c.globalAlpha=fade*.9;
tilePath(x,y,S,odd?b:-b);
c.fillStyle=odd?`hsl(${42+w*6},${70}%,${70-w*8}%)`:`hsl(${160+w*10},38%,${80-w*6}%)`;
c.fill();c.lineWidth=2;c.strokeStyle='#9a6a22';c.stroke();
c.beginPath();c.arc(x+S/2,y+S/2,S*.12,0,7);c.fillStyle=odd?'#c0392b':'#fff6dc';c.fill();
}
c.globalAlpha=1;
// spilling gilded tiles
sp.clearRect(0,0,540,960);
for(let k=0;k<7;k++){
const p=((t*.00003+k/7)%1);
const a=k*0.9+ph,r=180+p*260;
const x=270+Math.cos(a)*r*.75,y=480+Math.sin(a)*r;
sp.save();sp.translate(x,y);sp.rotate(p*3+k);sp.globalAlpha=Math.sin(p*Math.PI);
sp.fillStyle=k%2?'#d9a740':'#1f7a5a';sp.strokeStyle='#7a4f14';sp.lineWidth=1.5;
const s=22;sp.beginPath();sp.moveTo(-s,-s);sp.arc(0,-s,s*.3,Math.PI,0);sp.lineTo(s,-s);sp.lineTo(s,s);sp.arc(0,s,s*.3,0,Math.PI);sp.lineTo(-s,s);sp.closePath();sp.fill();sp.stroke();
sp.restore()}
requestAnimationFrame(draw)}
requestAnimationFrame(draw);
</script></body></html>
