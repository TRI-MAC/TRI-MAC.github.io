<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generative Artwork 2026-05-31</title>
<style>
  :root{
    --bg0:#06070b;
    --bg1:#111318;
    --gold:#d6b15a;
    --gold2:#ffde8a;
    --teal:#00d6c7;
    --cyan:#7ff7ff;
    --amber:#ff9b2f;
    --crimson:#d63f57;
    --ink:#0d0f14;
    --ivory:#efe7d2;
    --black:#050506;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family: Georgia, "Times New Roman", serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7777778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 35%, #26304a 0%, #12151d 26%, #090a0d 58%, #020203 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 20px 80px rgba(0,0,0,.65);
  }

  .layer{position:absolute; inset:0;}
  #bgGradient{
    background:
      radial-gradient(circle at 50% 42%, rgba(255,188,70,.22) 0%, rgba(255,188,70,.12) 18%, rgba(14,16,20,0) 36%),
      radial-gradient(circle at 34% 60%, rgba(0,214,199,.18) 0%, rgba(0,214,199,0) 34%),
      radial-gradient(circle at 78% 28%, rgba(214,63,87,.16) 0%, rgba(214,63,87,0) 28%),
      linear-gradient(180deg, #1a2133 0%, #0d1017 36%, #08090c 100%);
    filter:saturate(1.25) contrast(1.1);
  }

  #sunburst{
    opacity:.85;
    mix-blend-mode:screen;
    mask-image:radial-gradient(circle at 50% 42%, rgba(0,0,0,1) 0 52%, rgba(0,0,0,.6) 66%, rgba(0,0,0,0) 88%);
    -webkit-mask-image:radial-gradient(circle at 50% 42%, rgba(0,0,0,1) 0 52%, rgba(0,0,0,.6) 66%, rgba(0,0,0,0) 88%);
    animation: rotateSlow 54s linear infinite;
  }

  #moireTop, #moireBottom{
    opacity:.5;
    mix-blend-mode:screen;
    filter:contrast(1.2) saturate(1.1);
  }
  #moireTop{
    mask-image:linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,.5) 70%, rgba(0,0,0,0));
    -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,.5) 70%, rgba(0,0,0,0));
    animation: breathe 18s ease-in-out infinite;
  }
  #moireBottom{
    mask-image:linear-gradient(0deg, rgba(0,0,0,.8), rgba(0,0,0,.45) 72%, rgba(0,0,0,0));
    -webkit-mask-image:linear-gradient(0deg, rgba(0,0,0,.8), rgba(0,0,0,.45) 72%, rgba(0,0,0,0));
    animation: breathe2 24s ease-in-out infinite;
  }

  #decoSvg{
    opacity:.95;
    mix-blend-mode:screen;
  }

  #fluidCanvas, #particleCanvas, #grainCanvas{
    width:100%; height:100%;
    display:block;
  }

  #art-image{
    position:absolute;
    width:48%;
    left:11%;
    top:30%;
    transform:rotate(-6deg);
    opacity:.98;
    z-index:8;
    filter:
      saturate(1.18)
      contrast(1.12)
      brightness(.94)
      hue-rotate(-10deg)
      drop-shadow(0 12px 26px rgba(0,0,0,.45))
      drop-shadow(0 0 26px rgba(255,191,73,.14));
    animation: artFloat 16s ease-in-out infinite;
  }

  #artBackGlow{
    position:absolute;
    left:7%;
    top:28%;
    width:56%;
    height:28%;
    z-index:7;
    background:
      radial-gradient(circle at 52% 50%, rgba(255,191,73,.22), rgba(0,214,199,.11) 42%, rgba(0,0,0,0) 74%);
    filter:blur(18px);
    transform:rotate(-5deg);
    opacity:.9;
  }

  #portraitField{
    position:absolute;
    right:-10%;
    top:12%;
    width:66%;
    height:62%;
    z-index:9;
    border-radius:50%;
    background:
      radial-gradient(circle at 42% 46%, rgba(255,180,60,.9) 0%, rgba(255,137,36,.82) 22%, rgba(211,67,86,.68) 48%, rgba(23,18,26,0) 78%);
    filter:blur(8px) saturate(1.15);
    mask-image:radial-gradient(circle at 42% 46%, rgba(0,0,0,.95) 0 44%, rgba(0,0,0,.52) 62%, rgba(0,0,0,0) 84%);
    -webkit-mask-image:radial-gradient(circle at 42% 46%, rgba(0,0,0,.95) 0 44%, rgba(0,0,0,.52) 62%, rgba(0,0,0,0) 84%);
    animation: fieldPulse 20s ease-in-out infinite;
  }

  #portrait-image{
    position:absolute;
    right:7%;
    bottom:14%;
    width:43%;
    z-index:12;
    filter:
      saturate(.92)
      contrast(1.06)
      brightness(.88)
      drop-shadow(0 22px 22px rgba(0,0,0,.45))
      drop-shadow(0 0 18px rgba(255,208,120,.28))
      drop-shadow(0 0 40px rgba(0,220,220,.14));
    transform-origin:50% 85%;
    animation: portraitShift 17s ease-in-out infinite;
  }

  #portraitRim{
    position:absolute;
    right:5%;
    bottom:13%;
    width:46%;
    height:49%;
    z-index:11;
    background:
      radial-gradient(circle at 58% 38%, rgba(255,240,189,.8), rgba(255,204,104,.32) 28%, rgba(0,221,224,.18) 54%, rgba(0,0,0,0) 74%);
    filter:blur(22px);
    mask-image:radial-gradient(circle at 58% 42%, rgba(0,0,0,.85) 0 36%, rgba(0,0,0,.38) 57%, rgba(0,0,0,0) 78%);
    -webkit-mask-image:radial-gradient(circle at 58% 42%, rgba(0,0,0,.85) 0 36%, rgba(0,0,0,.38) 57%, rgba(0,0,0,0) 78%);
    opacity:.95;
    animation: fieldPulse 18s ease-in-out infinite reverse;
  }

  .frontBand{
    position:absolute;
    z-index:13;
    opacity:.95;
    mix-blend-mode:screen;
    filter:blur(.1px);
  }
  #band1{
    left:-8%;
    top:56%;
    width:82%;
    height:18%;
    background:
      linear-gradient(90deg, rgba(0,0,0,0), rgba(255,194,82,.88) 14%, rgba(13,18,24,.0) 26%, rgba(0,224,212,.92) 42%, rgba(13,18,24,0) 56%, rgba(245,233,202,.86) 70%, rgba(0,0,0,0) 100%);
    transform:rotate(-16deg);
    mask-image:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,1) 10%, rgba(0,0,0,1) 88%, rgba(0,0,0,0));
    -webkit-mask-image:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,1) 10%, rgba(0,0,0,1) 88%, rgba(0,0,0,0));
    animation: bandMove1 20s ease-in-out infinite;
  }
  #band2{
    right:-16%;
    top:34%;
    width:68%;
    height:12%;
    background:
      linear-gradient(90deg, rgba(0,0,0,0), rgba(255,153,53,.88) 22%, rgba(0,0,0,0) 43%, rgba(255,228,150,.85) 58%, rgba(0,0,0,0) 84%);
    transform:rotate(28deg);
    mask-image:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,1) 14%, rgba(0,0,0,1) 86%, rgba(0,0,0,0));
    -webkit-mask-image:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,1) 14%, rgba(0,0,0,1) 86%, rgba(0,0,0,0));
    animation: bandMove2 23s ease-in-out infinite;
  }
  #band3{
    left:26%;
    bottom:18%;
    width:58%;
    height:16%;
    background:
      linear-gradient(90deg, rgba(0,0,0,0), rgba(8,10,14,0) 8%, rgba(0,211,193,.75) 24%, rgba(0,0,0,0) 44%, rgba(212,177,87,.92) 62%, rgba(0,0,0,0) 88%);
    transform:rotate(10deg);
    mask-image:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,1) 12%, rgba(0,0,0,1) 86%, rgba(0,0,0,0));
    -webkit-mask-image:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,1) 12%, rgba(0,0,0,1) 86%, rgba(0,0,0,0));
    animation: bandMove3 17s ease-in-out infinite;
  }

  #decoMaskTop, #decoMaskBottom{
    position:absolute;
    left:0; width:100%; z-index:14; pointer-events:none;
    mix-blend-mode:screen;
  }
  #decoMaskTop{
    top:0; height:22%;
    background:
      linear-gradient(180deg, rgba(255,214,130,.9), rgba(255,214,130,.25) 52%, rgba(255,214,130,0));
    mask-image:linear-gradient(180deg, rgba(0,0,0,.95), rgba(0,0,0,.75) 42%, rgba(0,0,0,0));
    -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.95), rgba(0,0,0,.75) 42%, rgba(0,0,0,0));
    opacity:.22;
  }
  #decoMaskBottom{
    bottom:0; height:24%;
    background:
      linear-gradient(0deg, rgba(0,210,205,.4), rgba(255,185,70,.18) 52%, rgba(0,0,0,0));
    mask-image:linear-gradient(0deg, rgba(0,0,0,.95), rgba(0,0,0,.75) 42%, rgba(0,0,0,0));
    -webkit-mask-image:linear-gradient(0deg, rgba(0,0,0,.95), rgba(0,0,0,.75) 42%, rgba(0,0,0,0));
    opacity:.2;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    left:18px;
    bottom:112px;
    z-index:15;
    opacity:.58;
    filter:saturate(.85) brightness(.78);
    transform:rotate(-7deg);
  }

  #date{
    position:absolute;
    right:18px;
    bottom:16px;
    z-index:20;
    color:rgba(255,240,210,.58);
    font-size:14px;
    letter-spacing:.12em;
    text-shadow:0 1px 0 rgba(0,0,0,.35);
    user-select:none;
  }

  @keyframes rotateSlow{
    from{transform:rotate(0deg) scale(1)}
    to{transform:rotate(360deg) scale(1)}
  }
  @keyframes artFloat{
    0%,100%{transform:translateY(0px) rotate(-6deg) scale(1)}
    50%{transform:translateY(-14px) rotate(-4deg) scale(1.018)}
  }
  @keyframes portraitShift{
    0%,100%{transform:translateY(0px) rotate(0deg) scale(1)}
    50%{transform:translateY(-10px) rotate(1deg) scale(1.012)}
  }
  @keyframes bandMove1{
    0%,100%{transform:translateX(0) rotate(-16deg) scaleX(1)}
    50%{transform:translateX(2.5%) rotate(-14deg) scaleX(1.04)}
  }
  @keyframes bandMove2{
    0%,100%{transform:translateX(0) rotate(28deg) scaleX(1)}
    50%{transform:translateX(-2%) rotate(30deg) scaleX(1.05)}
  }
  @keyframes bandMove3{
    0%,100%{transform:translateX(0) rotate(10deg)}
    50%{transform:translateX(2%) rotate(8deg)}
  }
  @keyframes breathe{
    0%,100%{transform:scale(1) translateY(0)}
    50%{transform:scale(1.025) translateY(-6px)}
  }
  @keyframes breathe2{
    0%,100%{transform:scale(1) translateY(0)}
    50%{transform:scale(1.02) translateY(8px)}
  }
  @keyframes fieldPulse{
    0%,100%{transform:scale(1); opacity:.9}
    50%{transform:scale(1.04); opacity:1}
  }
</style>
</head>
<body>
  <div id="frame">
    <div id="bgGradient" class="layer"></div>

    <svg id="sunburst" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <radialGradient id="goldFade" cx="50%" cy="42%" r="48%">
          <stop offset="0%" stop-color="#fff2c5" stop-opacity="0.95"/>
          <stop offset="24%" stop-color="#ffcf70" stop-opacity="0.55"/>
          <stop offset="54%" stop-color="#d39b37" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g transform="translate(540,810)">
        <circle r="360" fill="url(#goldFade)"/>
        <g id="rays"></g>
      </g>
    </svg>

    <canvas id="moireTop" class="layer" width="1080" height="1920"></canvas>
    <canvas id="moireBottom" class="layer" width="1080" height="1920"></canvas>
    <canvas id="fluidCanvas" class="layer" width="1080" height="1920"></canvas>

    <div id="artBackGlow"></div>
    <img id="art-image" src="art.png" alt="">

    <svg id="decoSvg" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="decoGold" x1="0" x2="1">
          <stop offset="0%" stop-color="#f9efc7"/>
          <stop offset="35%" stop-color="#d6b15a"/>
          <stop offset="70%" stop-color="#8b6726"/>
          <stop offset="100%" stop-color="#f5db8f"/>
        </linearGradient>
        <linearGradient id="decoTeal" x1="0" x2="1">
          <stop offset="0%" stop-color="#003f44"/>
          <stop offset="50%" stop-color="#4ef7ef"/>
          <stop offset="100%" stop-color="#003f44"/>
        </linearGradient>
        <filter id="softGlow">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <g opacity="0.82">
        <path d="M120 1820 L540 1450 L960 1820" fill="none" stroke="url(#decoGold)" stroke-width="10"/>
        <path d="M180 1820 L540 1504 L900 1820" fill="none" stroke="url(#decoGold)" stroke-width="4" opacity="0.8"/>
        <path d="M270 1820 L540 1580 L810 1820" fill="none" stroke="url(#decoTeal)" stroke-width="3" opacity="0.6"/>
      </g>

      <g opacity="0.75" filter="url(#softGlow)">
        <circle cx="834" cy="610" r="186" fill="none" stroke="url(#decoGold)" stroke-width="8"/>
        <circle cx="834" cy="610" r="222" fill="none" stroke="rgba(255,226,151,.3)" stroke-width="2"/>
        <circle cx="834" cy="610" r="260" fill="none" stroke="rgba(0,235,220,.24)" stroke-width="2"/>
      </g>

      <g opacity="0.86">
        <path d="M0 1320 L260 1180 L520 1320 L780 1180 L1080 1320 L1080 1920 L0 1920 Z"
              fill="rgba(7,9,12,.72)"/>
        <path d="M0 1400 L220 1288 L430 1388 L650 1252 L880 1368 L1080 1286 L1080 1920 L0 1920 Z"
              fill="rgba(18,21,28,.55)"/>
      </g>

      <g opacity="0.68">
        <rect x="70" y="188" width="240" height="6" fill="url(#decoGold)"/>
        <rect x="770" y="188" width="240" height="6" fill="url(#decoGold)"/>
        <rect x="126" y="212" width="128" height="2" fill="#f1d487"/>
        <rect x="826" y="212" width="128" height="2" fill="#f1d487"/>
      </g>
    </svg>

    <div id="portraitField"></div>
    <div id="portraitRim"></div>
    <img id="portrait-image" src="portrait.png" alt="">

    <canvas id="particleCanvas" class="layer" width="1080" height="1920"></canvas>

    <div id="band1" class="frontBand"></div>
    <div id="band2" class="frontBand"></div>
    <div id="band3" class="frontBand"></div>

    <div id="decoMaskTop"></div>
    <div id="decoMaskBottom"></div>

    <canvas id="grainCanvas" class="layer" width="1080" height="1920"></canvas>

    <img id="guinea-pig" src="guineapig.png" alt="">
    <div id="date">2026-05-31</div>
  </div>

<script>
(() => {
  const seedStr = "2026-05-31";
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = ((seed * 131) + seedStr.charCodeAt(i)) >>> 0;
  function rand(){
    seed = (1664525 * seed + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  function lerp(a,b,t){ return a + (b-a)*t; }

  const raysGroup = document.getElementById('rays');
  const cx = 0, cy = 0;
  const rayCount = 48;
  for(let i=0;i<rayCount;i++){
    const a0 = (Math.PI*2/rayCount) * i;
    const a1 = a0 + (Math.PI*2/rayCount) * 0.52;
    const r0 = 130;
    const r1 = 560 + (i%3)*26;
    const x1 = Math.cos(a0)*r0, y1 = Math.sin(a0)*r0;
    const x2 = Math.cos((a0+a1)/2)*r1, y2 = Math.sin((a0+a1)/2)*r1;
    const x3 = Math.cos(a1)*r0, y3 = Math.sin(a1)*r0;
    const p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d", `M ${x1} ${y1} L ${x2} ${y2} L ${x3} ${y3} Z`);
    p.setAttribute("fill", i%2===0 ? "rgba(255,211,120,0.18)" : "rgba(0,240,225,0.08)");
    raysGroup.appendChild(p);
  }

  const mTop = document.getElementById('moireTop');
  const mBot = document.getElementById('moireBottom');
  const mt = mTop.getContext('2d');
  const mb = mBot.getContext('2d');

  function drawMoire(ctx, mode){
    const w = ctx.canvas.width, h = ctx.canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.save();
    ctx.globalAlpha = mode===0 ? 0.8 : 0.7;
    const stripeW = mode===0 ? 12 : 10;
    for(let i=-120;i<w+120;i+=stripeW){
      ctx.fillStyle = (Math.floor(i/stripeW)%2===0) ? "rgba(255,225,160,0.12)" : "rgba(5,10,16,0)";
      ctx.fillRect(i,0,stripeW*0.5,h);
    }
    ctx.globalCompositeOperation = "screen";
    for(let y=0;y<h;y+=16){
      const a = 0.07 + 0.04*Math.sin(y*0.015 + (mode?2.1:0.5));
      ctx.fillStyle = mode===0 ? `rgba(0,235,220,${a})` : `rgba(255,173,71,${a})`;
      ctx.fillRect(0,y,w,2);
    }
    ctx.restore();
  }
  drawMoire(mt,0);
  drawMoire(mb,1);

  const fluidCanvas = document.getElementById('fluidCanvas');
  const fctx = fluidCanvas.getContext('2d');
  const W = fluidCanvas.width, H = fluidCanvas.height;

  const blobs = [];
  const palette = [
    [214,177,87],[255,155,47],[0,214,199],[214,63,87],[239,231,210]
  ];
  for(let i=0;i<18;i++){
    blobs.push({
      x: lerp(160,920,rand()),
      y: lerp(260,1560,rand()),
      r: lerp(110,280,rand()),
      vx: lerp(-0.08,0.08,rand()),
      vy: lerp(-0.05,0.05,rand()),
      wobble: rand()*Math.PI*2,
      c: palette[(i + Math.floor(rand()*palette.length))%palette.length],
      a: lerp(0.08,0.24,rand())
    });
  }

  const particles = [];
  for(let i=0;i<44;i++){
    particles.push({
      x: 780 + rand()*220,
      y: 420 + rand()*920,
      r: lerp(1.6,4.6,rand()),
      vy: lerp(-0.08,-0.22,rand()),
      vx: lerp(-0.04,0.03,rand()),
      phase: rand()*Math.PI*2,
      hue: rand()>0.5 ? 'gold' : 'teal'
    });
  }

  const pCanvas = document.getElementById('particleCanvas');
  const pctx = pCanvas.getContext('2d');

  const gCanvas = document.getElementById('grainCanvas');
  const gctx = gCanvas.getContext('2d');
  const grain = gctx.createImageData(W,H);
  for(let i=0;i<grain.data.length;i+=4){
    const v = 12 + Math.floor(rand()*22);
    grain.data[i]=grain.data[i+1]=grain.data[i+2]=v;
    grain.data[i+3]=22;
  }

  let start = performance.now();

  function drawFluid(t){
    fctx.clearRect(0,0,W,H);
    fctx.globalCompositeOperation = 'source-over';

    for(let i=0;i<blobs.length;i++){
      const b = blobs[i];
      const x = b.x + Math.sin(t*0.00022 + b.wobble)*44;
      const y = b.y + Math.cos(t*0.00017 + b.wobble*0.7)*38;
      const rr = b.r * (0.92 + 0.08*Math.sin(t*0.00035 + b.wobble));
      const grad = fctx.createRadialGradient(x, y, rr*0.1, x, y, rr);
      grad.addColorStop(0, `rgba(${b.c[0]},${b.c[1]},${b.c[2]},${b.a*1.4})`);
      grad.addColorStop(0.45, `rgba(${b.c[0]},${b.c[1]},${b.c[2]},${b.a})`);
      grad.addColorStop(1, `rgba(${b.c[0]},${b.c[1]},${b.c[2]},0)`);
      fctx.fillStyle = grad;
      fctx.beginPath();
      fctx.arc(x,y,rr,0,Math.PI*2);
      fctx.fill();
    }

    fctx.globalCompositeOperation = 'screen';
    for(let j=0;j<6;j++){
      const yy = 260 + j*240 + Math.sin(t*0.0002 + j)*18;
      const grad = fctx.createLinearGradient(0,yy, W, yy+120);
      grad.addColorStop(0, "rgba(0,0,0,0)");
      grad.addColorStop(0.25, j%2===0 ? "rgba(255,192,90,0.0)" : "rgba(0,220,210,0.0)");
      grad.addColorStop(0.5, j%2===0 ? "rgba(255,192,90,0.14)" : "rgba(0,220,210,0.13)");
      grad.addColorStop(0.75, "rgba(0,0,0,0)");
      fctx.fillStyle = grad;
      fctx.save();
      fctx.translate(W/2,yy);
      fctx.rotate(-0.2 + j*0.06);
      fctx.fillRect(-W*0.58,-44,W*1.16,88);
      fctx.restore();
    }

    fctx.globalCompositeOperation = 'overlay';
    for(let i=0;i<4;i++){
      const x = 150 + i*220 + Math.sin(t*0.00019+i)*40;
      const y = 420 + i*220;
      const grad = fctx.createRadialGradient(x,y,20,x,y,180);
      grad.addColorStop(0,"rgba(255,240,180,0.14)");
      grad.addColorStop(1,"rgba(0,0,0,0)");
      fctx.fillStyle = grad;
      fctx.fillRect(x-190,y-190,380,380);
    }
  }

  function drawParticles(t){
    pctx.clearRect(0,0,W,H);
    for(const p of particles){
      const x = p.x + Math.sin(t*0.0011 + p.phase)*12 + p.vx*(t*0.05);
      let y = p.y + p.vy*(t*0.05) + Math.cos(t*0.001 + p.phase)*8;
      y = ((y + H + 40) % (H + 80)) - 40;
      pctx.fillStyle = p.hue === 'gold'
        ? 'rgba(255,221,158,0.72)'
        : 'rgba(122,255,244,0.6)';
      pctx.beginPath();
      pctx.arc(x,y,p.r,0,Math.PI*2);
      pctx.fill();

      pctx.fillStyle = p.hue === 'gold'
        ? 'rgba(255,165,74,0.12)'
        : 'rgba(0,224,214,0.12)';
      pctx.beginPath();
      pctx.arc(x,y,p.r*3.2,0,Math.PI*2);
      pctx.fill();
    }

    pctx.save();
    pctx.globalAlpha = 0.2;
    for(let i=0;i<8;i++){
      const x = 720 + i*26 + Math.sin(t*0.0005+i)*8;
      const y = 460 + i*102;
      pctx.fillStyle = i%2===0 ? 'rgba(255,214,130,0.26)' : 'rgba(0,240,225,0.22)';
      pctx.fillRect(x,y,38,4);
    }
    pctx.restore();
  }

  function drawGrain(t){
    gctx.clearRect(0,0,W,H);
    gctx.putImageData(grain,0,0);
    gctx.globalCompositeOperation = "soft-light";
    gctx.globalAlpha = 0.08;
    for(let y=0;y<H;y+=4){
      gctx.fillStyle = y%8===0 ? "rgba(255,255,255,0.12)" : "rgba(0,0,0,0.12)";
      gctx.fillRect(0,y,W,1);
    }
    gctx.globalAlpha = 0.06;
    gctx.fillStyle = "rgba(255,210,120,1)";
    gctx.fillRect(0,0,W,140);
    gctx.fillStyle = "rgba(0,220,210,1)";
    gctx.fillRect(0,H-150,W,150);
  }

  function animate(now){
    const t = now - start;
    drawFluid(t);
    drawParticles(t);
    drawGrain(t);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  if (window.self === window.top) {
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      const master = ctx.createGain();
      master.gain.value = 0.018;
      master.connect(ctx.destination);

      const lfo = ctx.createOscillator();
      lfo.type = "sine";
      lfo.frequency.value = 0.031;

      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 7;

      const osc1 = ctx.createOscillator();
      osc1.type = "triangle";
      osc1.frequency.value = 108;

      const osc2 = ctx.createOscillator();
      osc2.type = "sine";
      osc2.frequency.value = 161.8;

      const g1 = ctx.createGain();
      const g2 = ctx.createGain();
      g1.gain.value = 0.018;
      g2.gain.value = 0.012;

      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 520;
      filter.Q.value = 0.7;

      const convolver = ctx.createConvolver();
      const ir = ctx.createBuffer(2, ctx.sampleRate * 2.2, ctx.sampleRate);
      for(let c=0;c<2;c++){
        const data = ir.getChannelData(c);
        for(let i=0;i<data.length;i++){
          const decay = Math.pow(1 - i/data.length, 2.8);
          data[i] = (Math.random()*2-1) * decay * 0.18;
        }
      }
      convolver.buffer = ir;

      osc1.connect(g1);
      osc2.connect(g2);
      g1.connect(filter);
      g2.connect(filter);
      filter.connect(convolver);
      convolver.connect(master);
      filter.connect(master);

      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      osc1.start();
      osc2.start();
      lfo.start();

      const wake = () => ctx.resume();
      window.addEventListener('load', wake, {once:true});
    }catch(e){}
  }
})();
</script>
