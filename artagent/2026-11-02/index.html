<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee9dd}
#stage{position:absolute;width:1080px;height:1920px;overflow:hidden;transform-origin:top left;background:#f4efdf}
svg{position:absolute;inset:0;width:100%;height:100%}
#art-image{position:absolute;left:166px;top:391px;width:766px;height:1150px;object-fit:cover;opacity:1;filter:saturate(.65) sepia(.18) contrast(1.08);clip-path:polygon(9% 0,100% 6%,95% 81%,73% 100%,0 91%,3% 22%)}
.shaft{transform-origin:540px 100px;animation:light 24s ease-in-out infinite alternate}
.shaft.second{animation-delay:-12s;animation-duration:31s}
@keyframes light{from{transform:rotate(-3deg);opacity:.62}to{transform:rotate(4deg);opacity:.94}}
.bubble{animation:rise var(--duration) linear infinite;animation-delay:var(--delay)}
@keyframes rise{0%{transform:translate(0,120px);opacity:0}12%{opacity:.75}85%{opacity:.75}100%{transform:translate(65px,-690px);opacity:0}}
.colony{animation:breathe 9s ease-in-out infinite alternate;animation-delay:var(--delay)}
@keyframes breathe{from{opacity:.52}to{opacity:1}}
#guinea-pig{position:absolute;left:936px;top:1692px;width:18px;height:18px;object-fit:contain;opacity:.6}
.date{position:absolute;bottom:35px;left:45px;font:18px monospace;letter-spacing:3px;color:#6c5146}
@media(prefers-reduced-motion:reduce){.shaft,.bubble,.colony{animation:none}}
</style>

<body>

<script>
(()=>{
const stage=document.getElementById('stage');
function resize(){
const s=Math.min(innerWidth/1080,innerHeight/1920);
stage.style.transform=`scale(${s})`;
stage.style.left=((innerWidth-1080*s)/2)+'px';
stage.style.top=((innerHeight-1920*s)/2)+'px';
}
resize();addEventListener('resize',resize);
let seed=20261102;
function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
const ns='http://www.w3.org/2000/svg';
function element(tag,attrs,parent){let e=document.createElementNS(ns,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
const rocks=document.getElementById('rear-rocks');
for(let side=0;side<2;side++){
for(let i=0;i<24;i++){
let y=36+i*78,x=side?1038:42;
let depth=45+random()*75;
element('path',{d:side?`M1080 ${y} L${x-depth} ${y+28} L${x-depth*.3} ${y+72} L1080 ${y+83}Z`:`M0 ${y} L${x+depth} ${y+20} L${x+depth*.3} ${y+71} L0 ${y+83}Z`,fill:['#e67957','#f4e9d3','#ab3027'][i%3]},rocks);
}}
const colonies=document.getElementById('organisms');
for(let side=0;side<2;side++){
for(let i=0;i<23;i++){
let y=245+i*64+random()*20;
let x=side?969+Math.sin(y*.008)*42:103+Math.sin(y*.009)*43;
let g=element('g',{class:'colony',style:`--delay:${-random()*9}s`},colonies);
let count=3+Math.floor(random()*5);
for(let j=0;j<count;j++){
let px=x+(j%3)*12,py=y+Math.floor(j/3)*13;
element('path',{d:`M${px} ${py-7}l6 7-6 7-6-7Z`,fill:'#fff7c8',stroke:'#729b87','stroke-width':1.5},g);
}
}}
let bubbles=document.getElementById('bubbles');
for(let i=0;i<24;i++){
let x=340+random()*400,y=900+random()*830,r=5+random()*12;
let g=element('g',{class:'bubble',style:`--duration:${22+random()*20}s;--delay:${-random()*42}s`},bubbles);
element('circle',{cx:x,cy:y,r:r},g);
element('path',{d:`M${x-r*.4} ${y-r*.45}l${r*.4} ${-r*.15}`,stroke:'#d9573f','stroke-width':2},g);
}
})();
</script>
