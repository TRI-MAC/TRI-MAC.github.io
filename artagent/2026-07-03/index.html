<head>

<title>2026-07-03</title>
<style>
  :root{
    --bg1:#14081f;
    --bg2:#2a0d33;
    --bg3:#5a1648;
    --gold:#f5b92f;
    --amber:#ff8c2b;
    --teal:#17d0c3;
    --cyan:#7ef3ff;
    --violet:#7b34ff;
    --rose:#ff4d7a;
    --ink:#120914;
    --sand:#f1d388;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#06040a;
    overflow:hidden;
    font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    width:min(100vw,56.25vh);
    height:min(177.7777778vw,100vh);
    aspect-ratio:9/16;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 8%, rgba(255,198,74,.24), transparent 24%),
      radial-gradient(circle at 20% 22%, rgba(23,208,195,.18), transparent 28%),
      radial-gradient(circle at 78% 28%, rgba(123,52,255,.16), transparent 26%),
      linear-gradient(180deg, #2a0f34 0%, #160a22 34%, #2d1032 68%, #120813 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 30px 90px rgba(0,0,0,.55);
    isolation:isolate;
  }

  .layer{position:absolute; inset:0;}

  #bgsvg, #weaveSvg, #overlaySvg{
    width:100%; height:100%; display:block;
  }

  .fadeEdge{
    -webkit-mask-image:radial-gradient(circle at center, black 72%, transparent 98%);
            mask-image:radial-gradient(circle at center, black 72%, transparent 98%);
  }

  #starCanvas, #threadCanvas, #dustCanvas{
    position:absolute; inset:0; width:100%; height:100%;
  }

  #starCanvas{opacity:.5; mix-blend-mode:screen;}
  #threadCanvas{opacity:.88;}
  #dustCanvas{opacity:.18; mix-blend-mode:screen;}

  .glowField{
    position:absolute; inset:-8%;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,185,47,.18), transparent 22%),
      radial-gradient(circle at 28% 55%, rgba(23,208,195,.12), transparent 22%),
      radial-gradient(circle at 72% 65%, rgba(255,77,122,.12), transparent 22%);
    filter:blur(26px) saturate(130%);
    animation:breathe 24s ease-in-out infinite;
    pointer-events:none;
  }

  .loomWrap{
    position:absolute;
    inset:8% 6% 7% 6%;
    opacity:.9;
    filter:drop-shadow(0 8px 30px rgba(0,0,0,.28));
  }

  #art-image{
    position:absolute;
    left:18%;
    top:24%;
    width:58%;
    height:auto;
    aspect-ratio:4/5;
    object-fit:cover;
    opacity:.96;
    filter:
      saturate(1.15)
      contrast(1.06)
      brightness(1.02)
      hue-rotate(-8deg)
      drop-shadow(0 16px 36px rgba(10,4,18,.55))
      drop-shadow(0 0 22px rgba(255,185,47,.18));
    transform:translateZ(0) rotate(-3.5deg) scale(1.02);
    border:none;
    z-index:12;
    animation:imageDrift 22s ease-in-out infinite;
  }

  .imageBackAura{
    position:absolute;
    left:10%;
    top:18%;
    width:70%;
    height:44%;
    background:
      radial-gradient(circle at 55% 45%, rgba(255,185,47,.28), transparent 34%),
      radial-gradient(circle at 38% 52%, rgba(23,208,195,.2), transparent 36%),
      radial-gradient(circle at 68% 40%, rgba(123,52,255,.18), transparent 40%);
    filter:blur(30px);
    z-index:10;
    animation:breathe 18s ease-in-out infinite;
  }

  .warpShadow{
    position:absolute;
    left:14%;
    top:20%;
    width:66%;
    height:50%;
    background:
      linear-gradient(90deg,
        rgba(0,0,0,.0) 0%,
        rgba(0,0,0,.08) 12%,
        rgba(0,0,0,.04) 22%,
        rgba(255,185,47,.06) 28%,
        rgba(0,0,0,.05) 45%,
        rgba(23,208,195,.06) 56%,
        rgba(0,0,0,.05) 70%,
        rgba(255,77,122,.05) 84%,
        rgba(0,0,0,.0) 100%);
    transform:rotate(-3.5deg);
    z-index:13;
    opacity:.65;
    mix-blend-mode:soft-light;
    animation:panelShift 20s ease-in-out infinite;
  }

  .foregroundBands{
    position:absolute;
    inset:0;
    z-index:18;
    pointer-events:none;
  }
  .band{
    position:absolute;
    border-radius:999px;
    filter:blur(.2px) drop-shadow(0 8px 20px rgba(0,0,0,.22));
    transform-origin:center;
  }
  .band.a{
    left:-8%;
    top:57%;
    width:84%;
    height:5.3%;
    background:linear-gradient(90deg, rgba(10,6,18,0), rgba(245,185,47,.95) 18%, rgba(255,140,43,.98) 42%, rgba(123,52,255,.88) 72%, rgba(10,6,18,0));
    opacity:.9;
    transform:rotate(-13deg);
    animation:band1 18s ease-in-out infinite;
  }
  .band.b{
    right:-14%;
    top:33%;
    width:74%;
    height:4.7%;
    background:linear-gradient(90deg, rgba(10,6,18,0), rgba(23,208,195,.95) 18%, rgba(126,243,255,.92) 48%, rgba(245,185,47,.8) 76%, rgba(10,6,18,0));
    opacity:.88;
    transform:rotate(22deg);
    animation:band2 20s ease-in-out infinite;
  }
  .band.c{
    left:4%;
    bottom:18%;
    width:92%;
    height:6.1%;
    background:linear-gradient(90deg, rgba(10,6,18,0), rgba(255,77,122,.86) 12%, rgba(123,52,255,.86) 35%, rgba(23,208,195,.84) 68%, rgba(245,185,47,.8) 88%, rgba(10,6,18,0));
    opacity:.72;
    transform:rotate(8deg);
    animation:band3 24s ease-in-out infinite;
  }

  .maskBand{
    position:absolute;
    inset:0;
    z-index:17;
    background:
      linear-gradient(180deg, transparent 0%, transparent 64%, rgba(18,9,20,.12) 76%, rgba(18,9,20,.3) 100%);
    pointer-events:none;
  }

  .date{
    position:absolute;
    right:18px;
    bottom:12px;
    font-size:14px;
    letter-spacing:.12em;
    color:rgba(255,235,195,.58);
    z-index:40;
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    right:96px;
    bottom:144px;
    opacity:.58;
    z-index:19;
    filter:saturate(.75) hue-rotate(22deg) brightness(.82) contrast(1.02);
    transform:rotate(-8deg);
  }

  .grain{
    position:absolute; inset:0;
    background-image:
      radial-gradient(rgba(255,255,255,.05) .45px, transparent .6px);
    background-size:4px 4px;
    opacity:.09;
    mix-blend-mode:soft-light;
    z-index:30;
    pointer-events:none;
  }

  .veil{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(255,200,90,.04), transparent 18%, transparent 84%, rgba(0,0,0,.18)),
      radial-gradient(circle at 50% 40%, transparent 56%, rgba(8,5,12,.22) 100%);
    z-index:31;
    pointer-events:none;
  }

  @keyframes breathe{
    0%,100%{transform:scale(1) translateY(0)}
    50%{transform:scale(1.04) translateY(-1.3%)}
  }
  @keyframes imageDrift{
    0%,100%{transform:rotate(-3.5deg) translateY(0) scale(1.02)}
    50%{transform:rotate(-2.1deg) translateY(-1.2%) scale(1.035)}
  }
  @keyframes panelShift{
    0%,100%{transform:rotate(-3.5deg) translateX(0)}
    50%{transform:rotate(-2.5deg) translateX(1.2%)}
  }
  @keyframes band1{
    0%,100%{transform:rotate(-13deg) translateX(0) scaleX(1)}
    50%{transform:rotate(-10deg) translateX(2.3%) scaleX(1.03)}
  }
  @keyframes band2{
    0%,100%{transform:rotate(22deg) translateX(0) scaleX(1)}
    50%{transform:rotate(18deg) translateX(-2%) scaleX(1.02)}
  }
  @keyframes band3{
    0%,100%{transform:rotate(8deg) translateX(0) scaleX(1)}
    50%{transform:rotate(11deg) translateX(1.2%) scaleX(1.015)}
  }
</style>

<script>
(() => {
  const seedStr = "2026-07-03";
  function hashString(str){
    let h = 1779033703 ^ str.length;
    for(let i=0;i<str.length;i++){
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = h << 13 | h >>> 19;
    }
    return function() {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    }
  }
  const seedFn = hashString(seedStr);
  let s = seedFn();
  function rand(){
    s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
    return ((s >>> 0) / 4294967296);
  }
  function lerp(a,b,t){ return a + (b-a)*t; }

  const frame = document.getElementById('frame');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  function setupCanvas(canvas){
    const rect = frame.getBoundingClientRect();
    canvas.width = rect.width * DPR;
    canvas.height = rect.height * DPR;
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
    const ctx = canvas.getContext('2d');
    ctx.setTransform(DPR,0,0,DPR,0,0);
    return {ctx, w:rect.width, h:rect.height};
  }

  const starC = document.getElementById('starCanvas');
  const threadC = document.getElementById('threadCanvas');
  const dustC = document.getElementById('dustCanvas');

  let starCtx, threadCtx, dustCtx, W, H;

  const starField = [];
  const dustRects = [];

  function initStars(){
    starField.length = 0;
    const n = 110;
    for(let i=0;i<n;i++){
      starField.push({
        x: rand()*W,
        y: rand()*H*0.68,
        r: rand()*1.8 + 0.3,
        a: rand()*0.55 + 0.15,
        t: rand()*Math.PI*2
      });
    }
  }

  function initDust(){
    dustRects.length = 0;
    for(let i=0;i<85;i++){
      dustRects.push({
        x: rand()*W,
        y: rand()*H,
        w: rand()*28 + 12,
        h: rand()*4 + 1.5,
        a: rand()*0.05 + 0.02,
        hue: rand()<0.5 ? 44 : (rand()<0.5 ? 176 : 330),
        rot: rand()*Math.PI
      });
    }
  }

  function drawStars(t){
    starCtx.clearRect(0,0,W,H);
    for(const st of starField){
      const pulse = 0.8 + 0.2*Math.sin(t*0.00045 + st.t);
      starCtx.beginPath();
      starCtx.fillStyle = `rgba(255,${220 + (st.r*8)|0},${160 + (st.r*12)|0},${st.a*pulse})`;
      starCtx.arc(st.x, st.y, st.r*pulse, 0, Math.PI*2);
      starCtx.fill();
    }
  }

  function drawDust(t){
    dustCtx.clearRect(0,0,W,H);
    for(let i=0;i<dustRects.length;i++){
      const d = dustRects[i];
      const yy = d.y + Math.sin(t*0.00022 + i)*8;
      dustCtx.save();
      dustCtx.translate(d.x, yy);
      dustCtx.rotate(d.rot + Math.sin(t*0.00012 + i)*0.03);
      dustCtx.fillStyle = `hsla(${d.hue},85%,70%,${d.a})`;
      dustCtx.fillRect(-d.w/2,-d.h/2,d.w,d.h);
      dustCtx.restore();
    }
  }

  function buildWeaveSVG(){
    const svg = document.getElementById('weaveSvg');
    const NS = "http://www.w3.org/2000/svg";
    while(svg.firstChild) svg.removeChild(svg.firstChild);

    const defs = document.createElementNS(NS,'defs');
    const pat = document.createElementNS(NS,'pattern');
    pat.setAttribute('id','microWeft');
    pat.setAttribute('width','18');
    pat.setAttribute('height','18');
    pat.setAttribute('patternUnits','userSpaceOnUse');
    const r1 = document.createElementNS(NS,'rect');
    r1.setAttribute('width','18');
    r1.setAttribute('height','18');
    r1.setAttribute('fill','rgba(255,255,255,0.015)');
    const r2 = document.createElementNS(NS,'rect');
    r2.setAttribute('x','0'); r2.setAttribute('y','8');
    r2.setAttribute('width','18'); r2.setAttribute('height','2');
    r2.setAttribute('fill','rgba(0,0,0,0.08)');
    const r3 = document.createElementNS(NS,'rect');
    r3.setAttribute('x','8'); r3.setAttribute('y','0');
    r3.setAttribute('width','2'); r3.setAttribute('height','18');
    r3.setAttribute('fill','rgba(255,255,255,0.06)');
    pat.append(r1,r2,r3);
    defs.appendChild(pat);

    const mask = document.createElementNS(NS,'mask');
    mask.setAttribute('id','weaveFade');
    const mrect = document.createElementNS(NS,'rect');
    mrect.setAttribute('width','1080');
    mrect.setAttribute('height','1920');
    mrect.setAttribute('fill','white');
    const mell = document.createElementNS(NS,'ellipse');
    mell.setAttribute('cx','540');
    mell.setAttribute('cy','960');
    mell.setAttribute('rx','530');
    mell.setAttribute('ry','930');
    mell.setAttribute('fill','white');
    mask.append(mrect,mell);
    defs.appendChild(mask);
    svg.appendChild(defs);

    const group = document.createElementNS(NS,'g');
    group.setAttribute('mask','url(#weaveFade)');
    group.setAttribute('opacity','0.95');

    const yStart = 210, yEnd = 1640;
    const xStart = 80, xEnd = 1000;
    const cellW = 64, cellH = 56;
    const cols = Math.floor((xEnd-xStart)/cellW);
    const rows = Math.floor((yEnd-yStart)/cellH);

    const palettes = [
      ['#f5b92f','#ff8c2b','#7b34ff','#17d0c3'],
      ['#ff4d7a','#f1d388','#17d0c3','#5d2ef2'],
      ['#f5b92f','#17d0c3','#120914','#ff8c2b']
    ];

    const pal = palettes[1];

    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const x = xStart + c*cellW + ((r%2)*8);
        const y = yStart + r*cellH;
        const type = (r + c + (seedFn()%3)) % 4;
        let fill = pal[type];
        if((r>5 && r<17) && (c>2 && c<11)){
          const dx = c-6.5;
          const dy = r-11;
          if(Math.abs(dx)+Math.abs(dy*0.8) < 5.2) fill = '#f5b92f';
          if(Math.abs(dx)+Math.abs(dy*0.8) < 3.4) fill = '#17d0c3';
          if(Math.abs(dx)+Math.abs(dy*0.8) < 1.8) fill = '#f1d388';
        }

        const rect = document.createElementNS(NS,'rect');
        rect.setAttribute('x',x);
        rect.setAttribute('y',y);
        rect.setAttribute('rx',14);
        rect.setAttribute('ry',14);
        rect.setAttribute('width',cellW-10);
        rect.setAttribute('height',cellH-12);
        rect.setAttribute('fill',fill);
        rect.setAttribute('opacity','0.93');
        group.appendChild(rect);

        const hl = document.createElementNS(NS,'rect');
        hl.setAttribute('x',x+6);
        hl.setAttribute('y',y+6);
        hl.setAttribute('width',cellW-22);
        hl.setAttribute('height','6');
        hl.setAttribute('rx','3');
        hl.setAttribute('fill','rgba(255,255,255,0.16)');
        group.appendChild(hl);

        const sh = document.createElementNS(NS,'rect');
        sh.setAttribute('x',x+4);
        sh.setAttribute('y',y+cellH-20);
        sh.setAttribute('width',cellW-18);
        sh.setAttribute('height','8');
        sh.setAttribute('rx','4');
        sh.setAttribute('fill','rgba(0,0,0,0.14)');
        group.appendChild(sh);
      }
    }

    const tex = document.createElementNS(NS,'rect');
    tex.setAttribute('x','58');
    tex.setAttribute('y','190');
    tex.setAttribute('width','964');
    tex.setAttribute('height','1480');
    tex.setAttribute('fill','url(#microWeft)');
    tex.setAttribute('opacity','0.9');
    group.appendChild(tex);

    const framePolys = [
      {pts:'126,170 954,170 910,214 170,214', fill:'#f5b92f'},
      {pts:'104,170 126,170 170,214 146,214', fill:'#17d0c3'},
      {pts:'954,170 976,170 934,214 910,214', fill:'#ff4d7a'},
      {pts:'126,1670 954,1670 910,1626 170,1626', fill:'#f5b92f'},
      {pts:'104,1670 126,1670 170,1626 146,1626', fill:'#17d0c3'},
      {pts:'954,1670 976,1670 934,1626 910,1626', fill:'#ff4d7a'}
    ];
    framePolys.forEach(f=>{
      const p = document.createElementNS(NS,'polygon');
      p.setAttribute('points',f.pts);
      p.setAttribute('fill',f.fill);
      p.setAttribute('opacity','0.92');
      group.appendChild(p);
    });

    svg.appendChild(group);
  }

  function resizeAll(){
    ({ctx:starCtx,w:W,h:H} = setupCanvas(starC));
    ({ctx:threadCtx} = setupCanvas(threadC));
    ({ctx:dustCtx} = setupCanvas(dustC));
    initStars();
    initDust();
    buildWeaveSVG();
  }

  function drawThreadBands(t){
    threadCtx.clearRect(0,0,W,H);

    const bands = [
      {x:W*0.18, y:H*0.58, len:W*0.66, th:H*0.026, rot:-0.24, c1:'#f5b92f', c2:'#ff8c2b'},
      {x:W*0.60, y:H*0.38, len:W*0.58, th:H*0.022, rot:0.36, c1:'#17d0c3', c2:'#7ef3ff'},
      {x:W*0.52, y:H*0.80, len:W*0.82, th:H*0.028, rot:0.14, c1:'#ff4d7a', c2:'#7b34ff'}
    ];

    bands.forEach((b, i)=>{
      const sway = Math.sin(t*0.00025 + i*1.7) * 0.03;
      threadCtx.save();
      threadCtx.translate(b.x, b.y + Math.sin(t*0.00033+i)*8);
      threadCtx.rotate(b.rot + sway);

      const grad = threadCtx.createLinearGradient(-b.len/2,0,b.len/2,0);
      grad.addColorStop(0,'rgba(0,0,0,0)');
      grad.addColorStop(0.15,b.c1);
      grad.addColorStop(0.5,b.c2);
      grad.addColorStop(0.85,b.c1);
      grad.addColorStop(1,'rgba(0,0,0,0)');
      threadCtx.fillStyle = grad;

      const h = b.th;
      const r = h/2;
      threadCtx.beginPath();
      threadCtx.moveTo(-b.len/2+r,-h/2);
      threadCtx.lineTo(b.len/2-r,-h/2);
      threadCtx.arc(b.len/2-r,0,r,-Math.PI/2,Math.PI/2);
      threadCtx.lineTo(-b.len/2+r,h/2);
      threadCtx.arc(-b.len/2+r,0,r,Math.PI/2,-Math.PI/2);
      threadCtx.closePath();
      threadCtx.fill();

      for(let n=0;n<11;n++){
        const xx = lerp(-b.len*0.36,b.len*0.36,n/10);
        threadCtx.fillStyle = 'rgba(255,255,255,0.12)';
        threadCtx.fillRect(xx,-h*0.18,b.len*0.028,h*0.12);
      }

      threadCtx.fillStyle = 'rgba(0,0,0,0.12)';
      threadCtx.fillRect(-b.len*0.42,h*0.13,b.len*0.84,h*0.16);
      threadCtx.restore();
    });

    // small raccoon motif integrated into textile logic
    const cx = W*0.77, cy = H*0.19;
    threadCtx.save();
    threadCtx.translate(cx, cy + Math.sin(t*0.0004)*4);
    threadCtx.scale(W/1080, H/1920);
    threadCtx.globalAlpha = 0.72;

    const motifCols = ['#120914','#f1d388','#17d0c3','#ff4d7a'];
    const unit = 18;
    const cells = [
      [-2,0,motifCols[0]],[-1,-1,motifCols[0]],[1,-1,motifCols[0]],[0,0,motifCols[1]],[1,0,motifCols[1]],[-1,0,motifCols[1]],
      [-1,1,motifCols[0]],[0,1,motifCols[0]],[1,1,motifCols[0]],
      [-2,-1,motifCols[2]],[2,-1,motifCols[2]],
      [-3,0,motifCols[3]],[3,0,motifCols[3]],
      [-1,2,motifCols[0]],[1,2,motifCols[0]],[0,3,motifCols[0]],
      [3,2,motifCols[0]],[4,2,motifCols[0]],[5,3,motifCols[0]],[4,4,motifCols[1]],[3,4,motifCols[0]]
    ];
    for(const c of cells){
      threadCtx.fillStyle = c[2];
      threadCtx.fillRect(c[0]*unit, c[1]*unit, unit-2, unit-2);
    }
    threadCtx.restore();
  }

  function animate(ts){
    drawStars(ts);
    drawThreadBands(ts);
    drawDust(ts);
    requestAnimationFrame(animate);
  }

  resizeAll();
  window.addEventListener('resize', resizeAll);
  requestAnimationFrame(animate);

  if (window.self === window.top) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      const ctx = new AudioCtx();
      const master = ctx.createGain();
      master.gain.value = 0.018;
      master.connect(ctx.destination);

      const now = ctx.currentTime + 0.05;

      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      const lp = ctx.createBiquadFilter();
      const g1 = ctx.createGain();
      const g2 = ctx.createGain();

      osc1.type = 'triangle';
      osc2.type = 'sine';
      lfo.type = 'sine';

      osc1.frequency.value = 96;
      osc2.frequency.value = 144.5;
      lfo.frequency.value = 0.052;

      lfoGain.gain.value = 9;
      g1.gain.value = 0.18;
      g2.gain.value = 0.14;

      lp.type = 'lowpass';
      lp.frequency.value = 720;
      lp.Q.value = 0.6;

      lfo.connect(lfoGain);
      lfoGain.connect(osc2.frequency);

      osc1.connect(g1);
      osc2.connect(g2);
      g1.connect(lp);
      g2.connect(lp);
      lp.connect(master);

      master.gain.setValueAtTime(0.0001, now);
      master.gain.linearRampToValueAtTime(0.018, now + 4.0);

      osc1.start(now);
      osc2.start(now);
      lfo.start(now);

      const chords = [96, 108, 96, 128, 96, 108, 86, 96];
      let idx = 0;
      setInterval(() => {
        if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
        const t = ctx.currentTime + 0.1;
        const f = chords[idx % chords.length];
        osc1.frequency.cancelScheduledValues(t);
        osc2.frequency.cancelScheduledValues(t);
        osc1.frequency.linearRampToValueAtTime(f, t + 5.5);
        osc2.frequency.linearRampToValueAtTime(f * 1.503, t + 6.0);
        lp.frequency.cancelScheduledValues(t);
        lp.frequency.linearRampToValueAtTime(580 + (idx % 3) * 120, t + 5.0);
        idx++;
      }, 6000);
    }
  }
})();
</script>
