<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>2026-05-14</title>
<style>
  :root{
    --w:1080;
    --h:1920;
    --date:"2026-05-14";
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050608;
    font-family:Arial,Helvetica,sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw,calc(100vh * 9 / 16));
    height:min(100vh,calc(100vw * 16 / 9));
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 20%, rgba(255,255,255,.02), transparent 55%),
      linear-gradient(180deg,#020203,#06070a 40%, #050507 100%);
    isolation:isolate;
  }

  /* Core colour field layers */
  .layer{
    position:absolute;
    inset:-10%;
    pointer-events:none;
  }

  #background-video{
    position:absolute;
    inset:-6%;
    width:112%;
    height:112%;
    object-fit:cover;
    opacity:.78;
    filter:
      saturate(1.45)
      contrast(1.12)
      hue-rotate(-8deg)
      brightness(.88)
      blur(18px);
    mix-blend-mode:soft-light;
    transform-origin:50% 50%;
    animation: videoDrift 46s ease-in-out infinite alternate;
  }

  .fieldA{
    background:
      radial-gradient(115% 80% at 19% 17%, rgba(255,70,155,.98) 0%, rgba(255,70,155,.72) 18%, rgba(255,70,155,0) 42%),
      radial-gradient(90% 90% at 84% 26%, rgba(65,255,188,.86) 0%, rgba(65,255,188,.45) 18%, rgba(65,255,188,0) 41%),
      radial-gradient(120% 110% at 48% 72%, rgba(255,190,38,.88) 0%, rgba(255,190,38,.48) 20%, rgba(255,190,38,0) 46%),
      radial-gradient(100% 85% at 56% 47%, rgba(98,71,255,.92) 0%, rgba(98,71,255,.56) 20%, rgba(98,71,255,0) 44%),
      conic-gradient(from 220deg at 52% 45%, #14031f, #4a123d, #0b4e59, #31214c, #71240b, #14031f);
    filter: saturate(1.32) contrast(1.16) blur(22px);
    animation: fieldShiftA 34s ease-in-out infinite;
    transform-origin:47% 53%;
  }

  .fieldB{
    background:
      radial-gradient(85% 105% at 72% 83%, rgba(0,255,242,.35) 0%, rgba(0,255,242,.15) 24%, rgba(0,255,242,0) 50%),
      radial-gradient(78% 92% at 22% 76%, rgba(255,36,92,.34) 0%, rgba(255,36,92,.18) 22%, rgba(255,36,92,0) 48%),
      radial-gradient(68% 70% at 50% 18%, rgba(255,255,255,.12) 0%, rgba(255,255,255,.03) 24%, rgba(255,255,255,0) 55%),
      linear-gradient(145deg, rgba(35,0,61,.72), rgba(0,20,48,.16), rgba(70,10,0,.28), rgba(0,40,29,.18));
    mix-blend-mode:screen;
    filter: blur(32px) saturate(1.45);
    opacity:.86;
    animation: fieldShiftB 41s ease-in-out infinite;
  }

  .fieldC{
    background:
      radial-gradient(58% 52% at 49% 48%, rgba(255,255,255,.26), rgba(255,255,255,.04) 34%, rgba(255,255,255,0) 62%),
      radial-gradient(44% 48% at 61% 56%, rgba(17,8,56,.55), rgba(17,8,56,0) 68%),
      radial-gradient(48% 42% at 40% 40%, rgba(6,52,54,.34), rgba(6,52,54,0) 68%);
    opacity:.48;
    filter: blur(55px) contrast(1.15);
    animation: breathing 19s ease-in-out infinite;
  }

  /* Non-shape textures integral to the field */
  .veil{
    background:
      repeating-linear-gradient(
        97deg,
        rgba(255,255,255,.028) 0px,
        rgba(255,255,255,.028) 2px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,0) 17px,
        rgba(255,255,255,.02) 17px,
        rgba(255,255,255,.02) 18px,
        rgba(0,0,0,0) 18px,
        rgba(0,0,0,0) 31px
      ),
      repeating-linear-gradient(
        183deg,
        rgba(0,0,0,.022) 0px,
        rgba(0,0,0,.022) 3px,
        rgba(255,255,255,0) 3px,
        rgba(255,255,255,0) 27px
      );
    mix-blend-mode:overlay;
    opacity:.48;
    filter: blur(.2px);
    animation: veilTurn 44s linear infinite;
  }

  .grain{
    inset:0;
    opacity:.11;
    mix-blend-mode:soft-light;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.7) 0 0.7px, transparent 1px),
      radial-gradient(circle at 80% 60%, rgba(255,255,255,.55) 0 0.7px, transparent 1px),
      radial-gradient(circle at 40% 80%, rgba(255,255,255,.45) 0 0.6px, transparent 1px),
      radial-gradient(circle at 60% 15%, rgba(0,0,0,.75) 0 0.9px, transparent 1.1px);
    background-size: 13px 13px, 17px 17px, 11px 11px, 19px 19px;
    animation: grainShift 1.9s steps(2,end) infinite;
  }

  .interference{
    inset:-4%;
    background:
      radial-gradient(140% 120% at 50% 50%, rgba(255,255,255,.08), rgba(255,255,255,0) 52%),
      conic-gradient(from 0deg at 50% 50%,
        rgba(255,255,255,.04),
        rgba(255,255,255,0) 12%,
        rgba(0,0,0,.04) 26%,
        rgba(255,255,255,0) 38%,
        rgba(255,255,255,.05) 53%,
        rgba(0,0,0,.02) 68%,
        rgba(255,255,255,0) 82%,
        rgba(255,255,255,.03)
      );
    mix-blend-mode:soft-light;
    filter: blur(26px);
    opacity:.38;
    animation: precess 52s linear infinite;
  }

  .fog{
    inset:-8%;
    background:
      radial-gradient(48% 36% at 50% 14%, rgba(255,255,255,.18), rgba(255,255,255,0) 70%),
      radial-gradient(64% 42% at 52% 88%, rgba(0,0,0,.24), rgba(0,0,0,0) 70%);
    opacity:.42;
    filter: blur(40px);
    animation: fogBreath 23s ease-in-out infinite;
  }

  /* edge feather to avoid cutoffs */
  .edgeMask{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(180deg, rgba(4,5,8,.58), rgba(4,5,8,0) 11%, rgba(4,5,8,0) 89%, rgba(4,5,8,.62)),
      linear-gradient(90deg, rgba(4,5,8,.4), rgba(4,5,8,0) 8%, rgba(4,5,8,0) 92%, rgba(4,5,8,.42));
    mix-blend-mode:multiply;
  }

  .vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(110% 88% at 50% 50%, rgba(0,0,0,0) 54%, rgba(0,0,0,.22) 75%, rgba(0,0,0,.44) 100%);
  }

  .date{
    position:absolute;
    right:18px;
    bottom:14px;
    color:rgba(255,255,255,.55);
    font-size:14px;
    letter-spacing:.18em;
    font-weight:500;
    z-index:20;
    mix-blend-mode:screen;
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:13px;
    bottom:38px;
    opacity:.58;
    filter: saturate(.9) brightness(.82) blur(.15px) drop-shadow(0 0 2px rgba(255,220,180,.15));
    z-index:8;
    transform: rotate(-8deg);
  }

  @keyframes fieldShiftA{
    0%,100%{ transform:scale(1.06) rotate(0deg) translate3d(0%,0%,0); filter:saturate(1.3) contrast(1.15) blur(22px) hue-rotate(0deg);}
    25%{ transform:scale(1.11) rotate(8deg) translate3d(-2.2%,1.2%,0); filter:saturate(1.44) contrast(1.2) blur(26px) hue-rotate(12deg);}
    50%{ transform:scale(1.08) rotate(-7deg) translate3d(2.3%,-1.7%,0); filter:saturate(1.56) contrast(1.12) blur(24px) hue-rotate(-11deg);}
    75%{ transform:scale(1.13) rotate(5deg) translate3d(-1.2%,-2.6%,0); filter:saturate(1.38) contrast(1.18) blur(28px) hue-rotate(8deg);}
  }
  @keyframes fieldShiftB{
    0%,100%{ transform:scale(1.1) rotate(0deg) translate3d(0,0,0);}
    33%{ transform:scale(1.16) rotate(-9deg) translate3d(2.5%,-1.5%,0);}
    66%{ transform:scale(1.13) rotate(7deg) translate3d(-2.8%,2.2%,0);}
  }
  @keyframes breathing{
    0%,100%{ transform:scale(1) translateY(0%); opacity:.42;}
    50%{ transform:scale(1.08) translateY(-1.2%); opacity:.58;}
  }
  @keyframes veilTurn{
    0%{ transform:scale(1.03) rotate(0deg) translateX(0);}
    50%{ transform:scale(1.04) rotate(.6deg) translateX(1.1%);}
    100%{ transform:scale(1.03) rotate(0deg) translateX(0);}
  }
  @keyframes grainShift{
    0%{transform:translate(0,0)}
    50%{transform:translate(-1px,1px)}
    100%{transform:translate(1px,-1px)}
  }
  @keyframes precess{
    from{transform:rotate(0deg) scale(1.06)}
    to{transform:rotate(360deg) scale(1.06)}
  }
  @keyframes fogBreath{
    0%,100%{transform:scale(1.02) translateY(0); opacity:.36}
    50%{transform:scale(1.08) translateY(-1.2%); opacity:.48}
  }
  @keyframes videoDrift{
    0%,100%{ transform:scale(1.06) translate3d(0,0,0);}
    50%{ transform:scale(1.12) translate3d(0,-1.2%,0);}
  }

  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:7;
    mix-blend-mode:soft-light;
    opacity:.75;
  }

  svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:9;
    opacity:.5;
  }
</style>
</head>
<body>
  <div id="frame">
    <video id="background-video" src="background.mp4" autoplay loop muted playsinline></video>

    <div class="layer fieldA"></div>
    <div class="layer fieldB"></div>
    <div class="layer fieldC"></div>
    <div class="layer interference"></div>
    <div class="layer veil"></div>

    <canvas id="texture"></canvas>

    <svg viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="soften">
          <feGaussianBlur stdDeviation="28"/>
        </filter>
        <radialGradient id="g1" cx="50%" cy="48%" r="58%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
          <stop offset="38%" stop-color="rgba(255,255,255,0.06)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </radialGradient>
        <radialGradient id="g2" cx="18%" cy="76%" r="34%">
          <stop offset="0%" stop-color="rgba(255,80,150,0.14)"/>
          <stop offset="100%" stop-color="rgba(255,80,150,0)"/>
        </radialGradient>
        <radialGradient id="g3" cx="86%" cy="24%" r="32%">
          <stop offset="0%" stop-color="rgba(30,255,210,0.12)"/>
          <stop offset="100%" stop-color="rgba(30,255,210,0)"/>
        </radialGradient>
      </defs>
      <rect x="-80" y="-80" width="1240" height="2080" fill="url(#g1)" filter="url(#soften)">
        <animate attributeName="opacity" values="0.32;0.5;0.32" dur="18s" repeatCount="indefinite"/>
      </rect>
      <ellipse cx="180" cy="1510" rx="300" ry="220" fill="url(#g2)" filter="url(#soften)">
        <animate attributeName="cx" values="180;250;180" dur="31s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="1510;1460;1510" dur="31s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="900" cy="380" rx="280" ry="220" fill="url(#g3)" filter="url(#soften)">
        <animate attributeName="cx" values="900;840;900" dur="29s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="380;440;380" dur="29s" repeatCount="indefinite"/>
      </ellipse>
    </svg>

    <div class="layer fog"></div>
    <div class="layer grain"></div>
    <div class="edgeMask"></div>
    <div class="vignette"></div>

    <img id="guinea-pig" src="guineapig.png" alt="">
    <div class="date">2026-05-14</div>
  </div>

<script>
(() => {
  const seedStr = "2026-05-14";
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = ((seed * 131) + seedStr.charCodeAt(i)) >>> 0;
  function rand() {
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >> 17; seed >>>= 0;
    seed ^= seed << 5;  seed >>>= 0;
    return (seed >>> 0) / 4294967296;
  }

  const canvas = document.getElementById('texture');
  const ctx = canvas.getContext('2d');
  const frame = document.getElementById('frame');

  function resize(){
    const r = frame.getBoundingClientRect();
    canvas.width = Math.round(r.width * devicePixelRatio);
    canvas.height = Math.round(r.height * devicePixelRatio);
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  resize();
  addEventListener('resize', resize);

  const bands = [];
  const count = 13;
  for(let i=0;i<count;i++){
    bands.push({
      y: rand(),
      h: 0.05 + rand()*0.12,
      phase: rand()*Math.PI*2,
      speed: 0.15 + rand()*0.45,
      alpha: 0.022 + rand()*0.038,
      hue: rand()*360,
      blur: 18 + rand()*70
    });
  }

  let start = performance.now();
  function draw(now){
    const t = (now - start) * 0.001;
    const w = canvas.width / devicePixelRatio;
    const h = canvas.height / devicePixelRatio;

    ctx.clearRect(0,0,w,h);

    // Broad translucent strata for anti-pattern texture language:
    // not discrete shapes, but field discontinuities.
    for(const b of bands){
      const yy = (b.y + Math.sin(t*b.speed + b.phase)*0.045) * h;
      const hh = b.h * h * (0.9 + 0.15*Math.sin(t*b.speed*0.8 + b.phase*1.7));

      const g = ctx.createLinearGradient(0, yy-hh, 0, yy+hh);
      const c1 = `hsla(${(b.hue + t*7)%360}, 88%, 66%, 0)`;
      const c2 = `hsla(${(b.hue + 30*Math.sin(t*0.2+b.phase)+360)%360}, 92%, 62%, ${b.alpha})`;
      const c3 = `hsla(${(b.hue + 110)%360}, 88%, 50%, ${b.alpha*0.7})`;
      g.addColorStop(0, c1);
      g.addColorStop(0.35, c2);
      g.addColorStop(0.65, c3);
      g.addColorStop(1, c1);

      ctx.save();
      ctx.filter = `blur(${b.blur}px)`;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = g;
      ctx.fillRect(-w*0.05, yy-hh, w*1.1, hh*2);
      ctx.restore();
    }

    // Gentle chromatic membrane
    const cx = w*(0.5 + Math.sin(t*0.11)*0.04);
    const cy = h*(0.47 + Math.cos(t*0.13)*0.03);
    const rg = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*0.62);
    rg.addColorStop(0, 'rgba(255,255,255,0.08)');
    rg.addColorStop(0.35, 'rgba(255,255,255,0.03)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = rg;
    ctx.fillRect(0,0,w,h);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  if (window.self === window.top) {
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ac = new AudioCtx();

      const master = ac.createGain();
      master.gain.value = 0.018;
      master.connect(ac.destination);

      const low = ac.createOscillator();
      low.type = 'sine';
      low.frequency.value = 54;

      const high = ac.createOscillator();
      high.type = 'triangle';
      high.frequency.value = 161.9;

      const lfo = ac.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.041;

      const lfo2 = ac.createOscillator();
      lfo2.type = 'sine';
      lfo2.frequency.value = 0.067;

      const lowGain = ac.createGain();
      lowGain.gain.value = 0.42;

      const highGain = ac.createGain();
      highGain.gain.value = 0.08;

      const filter = ac.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 700;
      filter.Q.value = 0.4;

      const modGain = ac.createGain();
      modGain.gain.value = 22;
      lfo.connect(modGain).connect(low.frequency);

      const modGain2 = ac.createGain();
      modGain2.gain.value = 38;
      lfo2.connect(modGain2).connect(high.frequency);

      const ampLfo = ac.createOscillator();
      ampLfo.type = 'sine';
      ampLfo.frequency.value = 0.053;
      const ampDepth = ac.createGain();
      ampDepth.gain.value = 0.012;
      ampLfo.connect(ampDepth).connect(master.gain);

      low.connect(lowGain).connect(filter);
      high.connect(highGain).connect(filter);
      filter.connect(master);

      low.start();
      high.start();
      lfo.start();
      lfo2.start();
      ampLfo.start();

      const resume = () => {
        if (ac.state !== 'running') ac.resume();
      };
      document.addEventListener('visibilitychange', resume, {passive:true});
      resume();
    }catch(e){}
  }
})();
</script>
</body>
</html>
