<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026-06-01</title>
<style>
  :root{
    --bg:#120c07;
    --stone1:#2a1d14;
    --stone2:#4a3525;
    --stone3:#6a4a30;
    --ochre:#b66a22;
    --ochre2:#d2872d;
    --clay:#8a4a22;
    --char:#140f0b;
    --bone:#d6bf95;
    --ash:#9a8266;
    --red:#8c2a18;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#050403;
    overflow:hidden;
    font-family: Georgia, serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 8%, rgba(214,191,149,0.06), transparent 25%),
      radial-gradient(circle at 20% 80%, rgba(178,106,34,0.08), transparent 35%),
      linear-gradient(180deg, #191109 0%, #23170d 26%, #1a120b 56%, #0e0906 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,0.03), 0 30px 80px rgba(0,0,0,0.6);
  }

  #background-video{
    position:absolute;
    inset:6% 7% 8% 7%;
    width:86%;
    height:84%;
    object-fit:cover;
    opacity:.78;
    filter: sepia(1) saturate(1.7) hue-rotate(-14deg) contrast(1.25) brightness(.6) blur(.25px);
    mix-blend-mode:screen;
    clip-path: polygon(8% 3%, 92% 5%, 97% 19%, 95% 80%, 88% 95%, 13% 96%, 4% 78%, 2% 16%);
    mask-image: radial-gradient(circle at 50% 50%, black 55%, rgba(0,0,0,.75) 76%, transparent 95%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, black 55%, rgba(0,0,0,.75) 76%, transparent 95%);
    animation: videoBreath 28s ease-in-out infinite;
  }

  @keyframes videoBreath{
    0%,100%{transform:scale(1) translateY(0)}
    50%{transform:scale(1.04) translateY(-1.1%)}
  }

  .layer{position:absolute; inset:0; pointer-events:none;}

  #stoneTexture{
    opacity:.95;
    mix-blend-mode:multiply;
  }

  #particleCanvas{
    position:absolute;
    inset:0;
    opacity:.9;
  }

  #dustCanvas{
    position:absolute;
    inset:0;
    opacity:.75;
    mix-blend-mode:screen;
  }

  #svgOverlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .vignette{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at center, transparent 44%, rgba(7,5,4,0.18) 64%, rgba(7,5,4,.58) 82%, rgba(4,3,2,.88) 100%);
    pointer-events:none;
  }

  .edge-shadow{
    position:absolute; inset:-6%;
    background:
      radial-gradient(circle at 50% -10%, rgba(214,191,149,0.06), transparent 30%),
      radial-gradient(circle at 50% 110%, rgba(0,0,0,.6), transparent 28%),
      radial-gradient(circle at -10% 50%, rgba(0,0,0,.46), transparent 26%),
      radial-gradient(circle at 110% 50%, rgba(0,0,0,.46), transparent 26%);
    filter: blur(18px);
  }

  .smoke{
    position:absolute;
    border-radius:50%;
    filter: blur(28px);
    mix-blend-mode:screen;
    opacity:.16;
    background:radial-gradient(circle, rgba(210,141,52,.9) 0%, rgba(130,70,22,.5) 42%, transparent 72%);
    animation: drift 26s ease-in-out infinite;
  }
  .smoke.s1{width:34%;height:18%;left:9%;top:16%;animation-delay:-4s}
  .smoke.s2{width:42%;height:22%;right:8%;top:40%;animation-duration:32s}
  .smoke.s3{width:36%;height:20%;left:21%;bottom:12%;animation-delay:-10s;animation-duration:29s}

  @keyframes drift{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    33%{transform:translate3d(2%,-3%,0) scale(1.08)}
    66%{transform:translate3d(-2%,2%,0) scale(.95)}
  }

  .date{
    position:absolute;
    right:18px;
    bottom:12px;
    color:rgba(214,191,149,.48);
    font-size:13px;
    letter-spacing:.12em;
    text-shadow:0 1px 0 rgba(0,0,0,.4);
    z-index:30;
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    right:72px;
    bottom:146px;
    opacity:.58;
    filter: sepia(1) saturate(.8) brightness(.86) contrast(.95);
    transform: rotate(-8deg);
    z-index:16;
  }
</style>
</head>
<body>
  <div id="frame">
    <video id="background-video" src="background.mp4" autoplay loop muted playsinline></video>

    <canvas id="particleCanvas" width="1080" height="1920" class="layer"></canvas>
    <canvas id="dustCanvas" width="1080" height="1920" class="layer"></canvas>

    <svg id="svgOverlay" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="roughen">
          <feTurbulence type="fractalNoise" baseFrequency="0.013 0.028" numOctaves="2" seed="601" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
        </filter>
        <filter id="soft">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
        <radialGradient id="pigmentGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(214,191,149,0.7)"/>
          <stop offset="55%" stop-color="rgba(178,106,34,0.25)"/>
          <stop offset="100%" stop-color="rgba(178,106,34,0)"/>
        </radialGradient>
        <linearGradient id="charFade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#000" stop-opacity="0"/>
          <stop offset="12%" stop-color="#000" stop-opacity=".85"/>
          <stop offset="88%" stop-color="#000" stop-opacity=".85"/>
          <stop offset="100%" stop-color="#000" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <rect x="0" y="0" width="1080" height="1920" fill="transparent"/>

      <g opacity=".22" filter="url(#soft)">
        <ellipse cx="545" cy="980" rx="390" ry="580" fill="url(#pigmentGlow)">
          <animate attributeName="rx" values="380;410;380" dur="24s" repeatCount="indefinite"/>
          <animate attributeName="ry" values="560;600;560" dur="24s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <g filter="url(#roughen)" opacity=".82">
        <path d="M162 1440 L252 1250 L454 1188 L620 1036 L776 1126 L900 1352 L872 1624 L686 1736 L442 1700 L220 1600 Z"
              fill="#120d09" opacity=".92"/>
        <path d="M94 414 L200 304 L336 318 L438 246 L602 286 L774 230 L914 352 L970 516 L860 664 L700 718 L544 664 L336 710 L188 626 Z"
              fill="#2a1b12" opacity=".55"/>
      </g>

      <g opacity=".5">
        <ellipse cx="542" cy="974" rx="426" ry="676" fill="none" stroke="#7a4b24" stroke-width="8" stroke-dasharray="2 18" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 542 974" to="360 542 974" dur="160s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <g opacity=".74" filter="url(#roughen)">
        <!-- crane cave motif -->
        <path d="M731 617 L789 562 L839 552 L858 520 L875 515 L863 549 L887 579 L914 602 L903 617 L871 596 L849 575 L827 585 L793 649 L797 732 L780 777 L761 783 L767 731 L757 663 L740 643 Z"
              fill="#24160f"/>
        <path d="M765 655 L708 687 L634 706 L610 692 L649 672 L708 651 L748 630 Z" fill="#24160f" opacity=".96"/>
        <path d="M800 783 L791 871 L781 957 L767 956 L770 865 L782 783 Z" fill="#24160f"/>
        <path d="M772 783 L748 870 L719 949 L703 944 L733 859 L755 781 Z" fill="#24160f"/>
        <circle cx="877" cy="515" r="7" fill="#d6bf95" opacity=".55"/>
      </g>

      <g opacity=".23" filter="url(#soft)">
        <path d="M731 617 L789 562 L839 552 L858 520 L875 515 L863 549 L887 579 L914 602 L903 617 L871 596 L849 575 L827 585 L793 649 L797 732 L780 777 L761 783 L767 731 L757 663 L740 643 Z"
              fill="#d2872d"/>
      </g>

      <!-- hand stencils -->
      <g opacity=".18" filter="url(#roughen)">
        <g transform="translate(135 210) rotate(-12)">
          <ellipse cx="40" cy="80" rx="55" ry="70" fill="#d6bf95"/>
          <rect x="18" y="8" width="12" height="56" rx="5" fill="#d6bf95"/>
          <rect x="34" y="-2" width="12" height="66" rx="5" fill="#d6bf95"/>
          <rect x="50" y="0" width="12" height="62" rx="5" fill="#d6bf95"/>
          <rect x="66" y="10" width="12" height="52" rx="5" fill="#d6bf95"/>
          <rect x="78" y="42" width="12" height="36" rx="5" fill="#d6bf95"/>
        </g>
        <g transform="translate(826 266) rotate(18) scale(.9)">
          <ellipse cx="40" cy="80" rx="55" ry="70" fill="#d6bf95"/>
          <rect x="18" y="8" width="12" height="56" rx="5" fill="#d6bf95"/>
          <rect x="34" y="-2" width="12" height="66" rx="5" fill="#d6bf95"/>
          <rect x="50" y="0" width="12" height="62" rx="5" fill="#d6bf95"/>
          <rect x="66" y="10" width="12" height="52" rx="5" fill="#d6bf95"/>
          <rect x="78" y="42" width="12" height="36" rx="5" fill="#d6bf95"/>
        </g>
        <g transform="translate(186 1450) rotate(10) scale(1.12)">
          <ellipse cx="40" cy="80" rx="55" ry="70" fill="#8c2a18"/>
          <rect x="18" y="8" width="12" height="56" rx="5" fill="#8c2a18"/>
          <rect x="34" y="-2" width="12" height="66" rx="5" fill="#8c2a18"/>
          <rect x="50" y="0" width="12" height="62" rx="5" fill="#8c2a18"/>
          <rect x="66" y="10" width="12" height="52" rx="5" fill="#8c2a18"/>
          <rect x="78" y="42" width="12" height="36" rx="5" fill="#8c2a18"/>
        </g>
      </g>

      <!-- charcoal framing marks -->
      <g opacity=".42" filter="url(#roughen)">
        <rect x="70" y="142" width="940" height="12" fill="#140f0b"/>
        <rect x="88" y="1772" width="900" height="14" fill="#140f0b"/>
        <rect x="90" y="310" width="18" height="1240" fill="#140f0b"/>
        <rect x="972" y="316" width="18" height="1220" fill="#140f0b"/>
      </g>

      <rect x="0" y="0" width="1080" height="1920" fill="url(#charFade)" opacity=".34"/>
    </svg>

    <canvas id="stoneTexture" width="1080" height="1920" class="layer"></canvas>

    <div class="smoke s1"></div>
    <div class="smoke s2"></div>
    <div class="smoke s3"></div>
    <div class="edge-shadow"></div>
    <div class="vignette"></div>

    <img id="guinea-pig" src="guineapig.png" alt="" />
    <div class="date">2026-06-01</div>
  </div>

<script>
(() => {
  const seedStr = "2026-06-01";
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = (seed * 131 + seedStr.charCodeAt(i)) >>> 0;
  function rand() {
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >> 17; seed >>>= 0;
    seed ^= seed << 5; seed >>>= 0;
    return (seed >>> 0) / 4294967296;
  }

  const W = 1080, H = 1920;
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  const dust = document.getElementById('dustCanvas');
  const dtx = dust.getContext('2d');
  const stone = document.getElementById('stoneTexture');
  const stx = stone.getContext('2d');

  // Stone texture
  const img = stx.createImageData(W, H);
  for (let i = 0; i < img.data.length; i += 4) {
    const x = ((i / 4) % W);
    const y = Math.floor((i / 4) / W);
    const n = (rand() * 0.6 + ((x * 0.013 + y * 0.021) % 1) * 0.4);
    const bands = Math.sin(y * 0.018 + Math.sin(x * 0.01) * 3.2) * 0.5 + 0.5;
    const v = 28 + n * 40 + bands * 24;
    img.data[i] = v * 1.2;
    img.data[i + 1] = v * 0.9;
    img.data[i + 2] = v * 0.68;
    img.data[i + 3] = 48;
  }
  stx.putImageData(img, 0, 0);
  stx.globalCompositeOperation = 'multiply';
  for (let i = 0; i < 180; i++) {
    const x = rand() * W, y = rand() * H;
    const rw = 80 + rand() * 260, rh = 18 + rand() * 70;
    const a = rand() * Math.PI;
    stx.save();
    stx.translate(x, y);
    stx.rotate(a);
    stx.fillStyle = `rgba(20,15,11,${0.02 + rand() * 0.035})`;
    stx.beginPath();
    stx.ellipse(0, 0, rw, rh, 0, 0, Math.PI * 2);
    stx.fill();
    stx.restore();
  }
  stx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 110; i++) {
    const x = rand() * W, y = rand() * H;
    const rw = 30 + rand() * 120, rh = 8 + rand() * 40;
    stx.save();
    stx.translate(x, y);
    stx.rotate(rand() * Math.PI);
    stx.fillStyle = `rgba(214,191,149,${0.015 + rand() * 0.03})`;
    stx.beginPath();
    stx.ellipse(0, 0, rw, rh, 0, 0, Math.PI * 2);
    stx.fill();
    stx.restore();
  }

  const centers = [
    {x: W * 0.49, y: H * 0.47, q: 1.18},
    {x: W * 0.38, y: H * 0.60, q: 0.82},
    {x: W * 0.63, y: H * 0.38, q: 0.74},
    {x: W * 0.54, y: H * 0.69, q: -0.35}
  ];

  const particles = [];
  const COUNT = 1800;
  const palette = [
    [182,106,34],
    [210,135,45],
    [140,74,34],
    [214,191,149],
    [120,61,26]
  ];

  for (let i = 0; i < COUNT; i++) {
    const a = rand() * Math.PI * 2;
    const r = 40 + Math.pow(rand(), 0.55) * 430;
    const cx = W * 0.52 + Math.cos(a) * r * (0.72 + rand() * 0.32);
    const cy = H * 0.52 + Math.sin(a) * r * (1.02 + rand() * 0.22);
    const pcol = palette[(rand() * palette.length) | 0];
    particles.push({
      x: cx,
      y: cy,
      vx: (rand() - 0.5) * 0.5,
      vy: (rand() - 0.5) * 0.5,
      px: cx,
      py: cy,
      size: 0.8 + rand() * 2.3,
      mass: 0.5 + rand() * 1.6,
      tone: pcol,
      alpha: 0.15 + rand() * 0.45
    });
  }

  // cave dust
  const dustMotes = [];
  for (let i = 0; i < 170; i++) {
    dustMotes.push({
      x: rand() * W,
      y: rand() * H,
      r: 1 + rand() * 4,
      a: 0.02 + rand() * 0.05,
      s: 0.08 + rand() * 0.22,
      p: rand() * Math.PI * 2
    });
  }

  function drawDust(t){
    dtx.clearRect(0,0,W,H);
    for (const m of dustMotes){
      const yy = (m.y + Math.sin(t*0.00022 + m.p) * 12 + t * m.s * 0.01) % (H + 20);
      const xx = m.x + Math.cos(t*0.00017 + m.p) * 10;
      dtx.fillStyle = `rgba(214,191,149,${m.a})`;
      dtx.beginPath();
      dtx.arc(xx, yy, m.r, 0, Math.PI * 2);
      dtx.fill();
    }
  }

  let last = 0;
  function frame(ts){
    if (!last) last = ts;
    const dt = Math.min(1.2, (ts - last) / 16.666);
    last = ts;

    ctx.fillStyle = 'rgba(18,12,7,0.09)';
    ctx.fillRect(0,0,W,H);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.px = p.x;
      p.py = p.y;

      let ax = 0, ay = 0;
      for (let j = 0; j < centers.length; j++) {
        const c = centers[j];
        let dx = c.x + Math.sin(ts*0.00011 + j*2.3) * 30 - p.x;
        let dy = c.y + Math.cos(ts*0.00009 + j*1.9) * 38 - p.y;
        const d2 = Math.max(1800, dx*dx + dy*dy);
        const f = c.q * 26 / d2;
        ax += dx * f;
        ay += dy * f;
      }

      // broad rotational drift
      const dx0 = p.x - W * 0.51;
      const dy0 = p.y - H * 0.51;
      ax += -dy0 * 0.000018;
      ay += dx0 * 0.000018;

      // mild repulsion from crane motif zone so composition keeps focal separation
      const cdx = p.x - 802;
      const cdy = p.y - 652;
      const cd2 = cdx*cdx + cdy*cdy;
      if (cd2 < 180000) {
        const rf = 14 / Math.max(3000, cd2);
        ax += cdx * rf;
        ay += cdy * rf;
      }

      p.vx = (p.vx + ax * dt) * 0.9935;
      p.vy = (p.vy + ay * dt) * 0.9935;
      p.x += p.vx * dt * 2.2;
      p.y += p.vy * dt * 2.2;

      // soft contain within painted chamber
      if (p.x < 90 || p.x > W - 90) p.vx *= -0.96;
      if (p.y < 140 || p.y > H - 140) p.vy *= -0.96;
      p.x = Math.max(90, Math.min(W - 90, p.x));
      p.y = Math.max(140, Math.min(H - 140, p.y));

      const col = p.tone;
      ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${p.alpha})`;
      ctx.lineWidth = p.size;
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();

      if ((i & 7) === 0) {
        ctx.fillStyle = `rgba(${Math.min(255,col[0]+18)},${Math.min(255,col[1]+18)},${Math.min(255,col[2]+10)},${p.alpha * 0.7})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.75, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // charcoal fog passes
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    const g = ctx.createRadialGradient(W*0.54, H*0.5, 140, W*0.54, H*0.5, 760);
    g.addColorStop(0, 'rgba(20,15,11,0)');
    g.addColorStop(0.68, 'rgba(20,15,11,0.04)');
    g.addColorStop(1, 'rgba(20,15,11,0.18)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    ctx.restore();

    drawDust(ts);
    requestAnimationFrame(frame);
  }

  ctx.fillStyle = '#120c07';
  ctx.fillRect(0,0,W,H);
  requestAnimationFrame(frame);

  if (window.self === window.top) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      const ac = new AudioCtx();
      const master = ac.createGain();
      master.gain.value = 0.015;
      master.connect(ac.destination);

      const low = ac.createOscillator();
      low.type = 'triangle';
      low.frequency.value = 54;

      const high = ac.createOscillator();
      high.type = 'sine';
      high.frequency.value = 109;

      const lGain = ac.createGain();
      const hGain = ac.createGain();
      lGain.gain.value = 0.18;
      hGain.gain.value = 0.08;

      const filter = ac.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 620;
      filter.Q.value = 0.4;

      const noiseBuffer = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.14;
      const noise = ac.createBufferSource();
      noise.buffer = noiseBuffer;
      noise.loop = true;

      const nFilter = ac.createBiquadFilter();
      nFilter.type = 'bandpass';
      nFilter.frequency.value = 280;
      nFilter.Q.value = 0.7;
      const nGain = ac.createGain();
      nGain.gain.value = 0.028;

      low.connect(lGain).connect(filter);
      high.connect(hGain).connect(filter);
      noise.connect(nFilter).connect(nGain).connect(filter);
      filter.connect(master);

      low.start();
      high.start();
      noise.start();

      let t0 = ac.currentTime;
      function modulate() {
        const t = ac.currentTime;
        low.frequency.setTargetAtTime(50 + 8 * Math.sin(t * 0.18), t, 2.5);
        high.frequency.setTargetAtTime(102 + 18 * Math.sin(t * 0.11 + 1), t, 2.8);
        filter.frequency.setTargetAtTime(460 + 120 * (0.5 + 0.5 * Math.sin(t * 0.09)), t, 3.5);
        nGain.gain.setTargetAtTime(0.02 + 0.01 * (0.5 + 0.5 * Math.sin(t * 0.13 + 0.4)), t, 4);
        setTimeout(modulate, 4000);
      }
      if (ac.state === 'suspended') ac.resume().catch(()=>{});
      modulate();
    }
  }
})();
</script>
</body>
