<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta charset="utf-8">
<title>Backlit</title>
<style>
  html,body{margin:0;padding:0;background:#cfd4cf;overflow:hidden;}
  #wrap{position:fixed;inset:0;background:
      radial-gradient(120% 80% at 50% 20%, #f2efe4 0%, #dfe2d8 45%, #c8cec6 100%);}
  #stage{
    position:absolute;top:0;left:0;width:1080px;height:1920px;
    transform-origin:top left;
    background:#e8e6d8;
    overflow:hidden;
    box-shadow:0 0 90px rgba(60,70,72,.35);
  }

  /* ---------- the screen (backlit cloth) ---------- */
  #screen{
    position:absolute;left:56px;top:190px;width:968px;height:1290px;
    background:
      radial-gradient(72% 52% at 50% 40%, #fdfbef 0%, #f4f1df 38%, #dfe0cd 72%, #c9ccbb 100%);
    overflow:hidden;
  }
  /* cloth weave + faint stains, one composited layer, no blend mode */
  #cloth{
    position:absolute;inset:0;pointer-events:none;
    background-image:
      repeating-linear-gradient(90deg, rgba(120,130,124,.10) 0 1px, rgba(0,0,0,0) 1px 4px),
      repeating-linear-gradient(0deg,  rgba(120,130,124,.09) 0 1px, rgba(0,0,0,0) 1px 4px),
      radial-gradient(38% 26% at 22% 74%, rgba(150,140,110,.16), rgba(0,0,0,0) 70%),
      radial-gradient(30% 20% at 82% 22%, rgba(120,140,140,.14), rgba(0,0,0,0) 70%),
      radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 52%, rgba(88,98,98,.28) 100%);
  }

  /* video = rain running down the lit cloth, seen from behind */
  #background-video{
    position:absolute;left:-4%;top:-4%;width:108%;height:108%;
    object-fit:cover;opacity:.78;
  }

  /* canvas: hazy city plates behind the cloth (drawn once) + puppet shadows (animated) */
  #plates,#puppets{position:absolute;inset:0;width:100%;height:100%;}
  #puppets{mix-blend-mode:multiply;}

  /* ---------- frame: lacquer proscenium, drawn as solid geometry ---------- */
  #frame{position:absolute;inset:0;pointer-events:none;}

  #date{
    position:absolute;left:64px;bottom:34px;
    font:400 15px/1 ui-monospace,Menlo,Consolas,monospace;
    letter-spacing:.32em;color:#4d5a5c;opacity:.55;
  }
  #guinea-pig{
    position:absolute;left:126px;bottom:454px;width:15px;height:auto;
    opacity:.6;transform:rotate(-7deg);
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">

    <!-- back plane: city plates in haze -->
    <div id="screen">
      <canvas id="plates" width="484" height="645"></canvas>
      <video id="background-video" src="background.mp4" autoplay loop muted playsinline></video>
      <canvas id="puppets" width="484" height="645"></canvas>
      <div id="cloth"></div>
    </div>

    <!-- proscenium / rig -->
    <svg id="frame" viewBox="0 0 1080 1920" preserveAspectRatio="none">
      <defs>
        <linearGradient id="lac" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5c6a6b"/>
          <stop offset=".55" stop-color="#3d4a4c"/>
          <stop offset="1" stop-color="#2c3739"/>
        </linearGradient>
        <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#b39a62"/>
          <stop offset=".5" stop-color="#e0cf9c"/>
          <stop offset="1" stop-color="#9c8551"/>
        </linearGradient>
        <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <mask id="topFade"><rect x="0" y="0" width="1080" height="190" fill="url(#fade)"/></mask>
      </defs>

      <!-- outer mat: light ground, dark only as edges -->
      <rect x="0" y="0" width="1080" height="190" fill="#e7e4d6"/>
      <rect x="0" y="1480" width="1080" height="440" fill="#e2e0d1"/>
      <rect x="0" y="190" width="56" height="1290" fill="#e5e2d3"/>
      <rect x="1024" y="190" width="56" height="1290" fill="#e5e2d3"/>

      <!-- lacquer inner border, thin and dark: the drawn mark -->
      <rect x="40" y="174" width="1000" height="1322" fill="none" stroke="url(#lac)" stroke-width="16"/>
      <rect x="56" y="190" width="968" height="1290" fill="none" stroke="#222c2e" stroke-width="4"/>

      <!-- head rail with brass conduit and hanging pipes (rig above the screen) -->
      <g mask="url(#topFade)">
        <rect x="0" y="96" width="1080" height="26" fill="#3b4749"/>
        <rect x="0" y="122" width="1080" height="6" fill="url(#brass)" opacity=".85"/>
        <g fill="#3b4749">
          <rect x="150" y="122" width="14" height="52"/><rect x="146" y="168" width="22" height="8"/>
          <rect x="392" y="122" width="10" height="34"/><rect x="388" y="152" width="18" height="7"/>
          <rect x="660" y="122" width="16" height="44"/><rect x="655" y="162" width="26" height="8"/>
          <rect x="902" y="122" width="11" height="60"/><rect x="897" y="178" width="21" height="8"/>
        </g>
        <!-- lamp cans, brass, no glow flashing -->
        <g>
          <rect x="286" y="118" width="54" height="30" rx="4" fill="#2f3a3c"/>
          <rect x="292" y="146" width="42" height="10" rx="3" fill="url(#brass)" opacity=".8"/>
          <rect x="762" y="118" width="54" height="30" rx="4" fill="#2f3a3c"/>
          <rect x="768" y="146" width="42" height="10" rx="3" fill="url(#brass)" opacity=".8"/>
        </g>
      </g>

      <!-- floor rail and ballast blocks below the screen -->
      <rect x="0" y="1496" width="1080" height="10" fill="url(#brass)" opacity=".7"/>
      <rect x="0" y="1506" width="1080" height="30" fill="#3b4749"/>
      <g fill="#4a5658">
        <rect x="88" y="1536" width="150" height="34"/>
        <rect x="470" y="1536" width="210" height="26"/>
        <rect x="842" y="1536" width="130" height="42"/>
      </g>
      <!-- puppeteer rods reaching in from below, dark marks on the light mat -->
      <g id="rods" stroke="#2b3537" stroke-linecap="round">
        <line x1="300" y1="1920" x2="392" y2="1520" stroke-width="9"/>
        <line x1="470" y1="1920" x2="512" y2="1530" stroke-width="7"/>
        <line x1="760" y1="1920" x2="686" y2="1524" stroke-width="10"/>
        <line x1="880" y1="1920" x2="828" y2="1560" stroke-width="6"/>
      </g>
      <circle cx="392" cy="1520" r="10" fill="#2b3537"/>
      <circle cx="512" cy="1530" r="8" fill="#2b3537"/>
      <circle cx="686" cy="1524" r="11" fill="#2b3537"/>
      <circle cx="828" cy="1560" r="7" fill="#2b3537"/>
    </svg>

    <img id="guinea-pig" src="guineapig.png" alt="">
    <div id="date">2026 · 09 · 07</div>
  </div>
</div>

<script>
(function(){
  /* ---------- scale stage ---------- */
  const stage=document.getElementById('stage');
  function fit(){
    const s=Math.min(innerWidth/1080, innerHeight/1920);
    stage.style.transform='translate('+((innerWidth-1080*s)/2)+'px,'+((innerHeight-1920*s)/2)+'px) scale('+s+')';
  }
  addEventListener('resize',fit); fit();

  /* ---------- date seed ---------- */
  const D=[2026,9,7];
  let seed=(D[0]*10000+D[1]*100+D[2])>>>0;
  function rnd(){ seed^=seed<<13;seed>>>=0;seed^=seed>>17;seed^=seed<<5;seed>>>=0;return seed/4294967296; }

  /* ---------- static plate layer: hazy city seen through the cloth ---------- */
  const pc=document.getElementById('plates'), pg=pc.getContext('2d');
  const W=pc.width, H=pc.height;
  (function drawPlates(){
    pg.clearRect(0,0,W,H);
    // four separated planes, palest at the back
    const planes=[
      {y:0.62,h:0.30,a:0.07,c:'#7d8c8a',n:7,w:[26,74]},
      {y:0.70,h:0.26,a:0.11,c:'#68797a',n:6,w:[34,88]},
      {y:0.78,h:0.22,a:0.16,c:'#55666a',n:5,w:[48,104]},
    ];
    planes.forEach(p=>{
      pg.globalAlpha=p.a; pg.fillStyle=p.c;
      let x=-20;
      for(let i=0;i<p.n+3;i++){
        const bw=p.w[0]+rnd()*(p.w[1]-p.w[0]);
        const bh=H*p.h*(0.45+rnd()*0.75);
        const by=H*p.y-bh*0.2;
        pg.fillRect(x,by,bw,H-by);
        // roof boxes / tanks: hard geometry, no squiggles
        if(rnd()>0.45) pg.fillRect(x+bw*0.25,by-10-rnd()*14,bw*0.3,14+rnd()*14);
        // signage plate
        if(rnd()>0.55){
          pg.globalAlpha=p.a*1.5;
          pg.fillRect(x+bw*0.12,by+18+rnd()*40,bw*0.7,7);
          pg.globalAlpha=p.a;
        }
        x+=bw+4+rnd()*22;
      }
    });
    // pipe run: thick straight bands, one bold structural gesture
    pg.globalAlpha=0.16; pg.strokeStyle='#4d5f63'; pg.lineCap='butt';
    const py=H*0.545;
    pg.lineWidth=13; pg.beginPath(); pg.moveTo(-10,py); pg.lineTo(W*0.63,py); pg.lineTo(W*0.63,H*0.80); pg.stroke();
    pg.lineWidth=7;  pg.beginPath(); pg.moveTo(-10,py+22); pg.lineTo(W*0.42,py+22); pg.lineTo(W*0.42,H); pg.stroke();
    // flanges
    pg.globalAlpha=0.2; pg.fillStyle='#405256';
    for(let i=0;i<5;i++){ const fx=30+i*(W*0.63-30)/5; pg.fillRect(fx,py-9,6,18); }
    // pale haze band, atmospheric perspective
    const hz=pg.createLinearGradient(0,H*0.42,0,H);
    hz.addColorStop(0,'rgba(250,248,236,0.75)');
    hz.addColorStop(0.45,'rgba(246,244,232,0.30)');
    hz.addColorStop(1,'rgba(228,230,216,0.00)');
    pg.globalAlpha=1; pg.fillStyle=hz; pg.fillRect(0,H*0.42,W,H*0.58);
  })();

  /* ---------- puppet shadows: the subject ---------- */
  const cc=document.getElementById('puppets'), g=cc.getContext('2d');
  const CW=cc.width, CH=cc.height;
  const GROUND=CH*0.90;

  // helpers: solid silhouette bodies only
  function limb(x1,y1,x2,y2,w1,w2){
    const a=Math.atan2(y2-y1,x2-x1), n=a+Math.PI/2;
    g.beginPath();
    g.moveTo(x1+Math.cos(n)*w1, y1+Math.sin(n)*w1);
    g.lineTo(x2+Math.cos(n)*w2, y2+Math.sin(n)*w2);
    g.lineTo(x2-Math.cos(n)*w2, y2-Math.sin(n)*w2);
    g.lineTo(x1-Math.cos(n)*w1, y1-Math.sin(n)*w1);
    g.closePath(); g.fill();
  }
  function ell(x,y,rx,ry,rot){ g.beginPath(); g.ellipse(x,y,rx,ry,rot||0,0,6.2832); g.fill(); }

  // A figure: head, torso plate, two arms, two legs, jointed. Gesture-driven.
  function figure(t, cx, scale, phase, gestureMix, flip){
    const s=scale, f=flip?-1:1;
    const hipY=GROUND-64*s;
    const sh=hipY-58*s;
    const sway=Math.sin(t*0.55+phase)*3*s;
    const lean=Math.sin(t*0.34+phase)*0.09;
    // torso as a tapered plate
    const tx=cx+sway, hx=cx+sway*0.4;
    g.save();
    // legs (stance shifts slowly, weight transfer)
    const w=Math.sin(t*0.55+phase);
    const kneeSpread=10*s+6*s*Math.abs(w);
    limb(hx-6*s*f, hipY, hx-kneeSpread*f-2*s, hipY+34*s, 8.5*s, 6*s);
    limb(hx-kneeSpread*f-2*s, hipY+34*s, hx-kneeSpread*f-6*s*f, GROUND, 6*s, 4.6*s);
    limb(hx+7*s*f, hipY, hx+(kneeSpread*0.55)*f, hipY+34*s, 8.5*s, 6*s);
    limb(hx+(kneeSpread*0.55)*f, hipY+34*s, hx+(kneeSpread*0.6)*f, GROUND, 6*s, 4.6*s);
    // feet
    ell(hx-kneeSpread*f-7*s*f, GROUND-1*s, 9*s, 3.2*s, 0);
    ell(hx+(kneeSpread*0.6)*f+5*s*f, GROUND-1*s, 9*s, 3.2*s, 0);
    // torso
    g.translate(tx,sh); g.rotate(lean*f); g.translate(-tx,-sh);
    g.beginPath();
    g.moveTo(tx-15*s, sh);
    g.quadraticCurveTo(tx-13*s, hipY-6*s, tx-9*s, hipY+2*s);
    g.lineTo(tx+9*s, hipY+2*s);
    g.quadraticCurveTo(tx+13*s, hipY-6*s, tx+15*s, sh);
    g.closePath(); g.fill();
    // neck + head with a hard profile (nose, chin, nape)
    limb(tx, sh, tx+1.5*s*f, sh-11*s, 5*s, 4.6*s);
    const hy=sh-22*s, hr=11.5*s;
    g.beginPath();
    g.moveTo(tx+1.5*s*f - hr*f*0.2, hy+hr*0.9);
    g.bezierCurveTo(tx-hr*1.0*f, hy+hr*0.4, tx-hr*0.95*f, hy-hr*0.9, tx+hr*0.15*f, hy-hr*1.05);
    g.bezierCurveTo(tx+hr*1.05*f, hy-hr*0.95, tx+hr*1.15*f, hy-hr*0.1, tx+hr*0.95*f, hy+hr*0.15);
    g.lineTo(tx+hr*1.35*f, hy+hr*0.34);   // nose
    g.lineTo(tx+hr*0.78*f, hy+hr*0.52);
    g.lineTo(tx+hr*0.86*f, hy+hr*0.9);    // chin
    g.closePath(); g.fill();

    // arms: gesture. gestureMix 0 = reach across, 1 = raise overhead
    const ga=(-0.35 + gestureMix*1.9) + Math.sin(t*0.7+phase)*0.16;
    const gb=(0.55 - gestureMix*1.4) + Math.sin(t*0.7+phase+2.1)*0.14;
    function arm(ang,len,wd){
      const ex=tx+Math.cos(ang)*len*f, ey=sh+6*s - Math.sin(ang)*len;
      const fa=ang + (0.7 - gestureMix*1.2) + Math.sin(t*0.9+phase)*0.2;
      const wx=ex+Math.cos(fa)*len*0.92*f, wy=ey-Math.sin(fa)*len*0.92;
      limb(tx, sh+6*s, ex, ey, wd, wd*0.72);
      limb(ex, ey, wx, wy, wd*0.72, wd*0.42);
      ell(wx,wy,3.4*s,2.4*s,0);
      return [wx,wy];
    }
    const hand=arm(ga, 26*s, 6.6*s);
    arm(gb, 25*s, 6.2*s);
    g.restore();
    return hand;
  }

  // The badger puppet: a solid low silhouette with the blaze read as a notch.
  function badger(t, cx, scale, phase){
    const s=scale, y=GROUND;
    const bob=Math.sin(t*1.1+phase)*1.6*s;
    const bx=cx;
    g.save();
    // body: heavy filled wedge
    g.beginPath();
    g.moveTo(bx-30*s, y-1*s);
    g.bezierCurveTo(bx-34*s, y-20*s, bx-16*s, y-26*s+bob, bx+4*s, y-25*s+bob);
    g.bezierCurveTo(bx+20*s, y-24*s+bob, bx+27*s, y-17*s, bx+30*s, y-8*s);
    g.lineTo(bx+30*s, y-1*s);
    g.closePath(); g.fill();
    // head wedge + snout
    const hx=bx+31*s, hy=y-16*s+bob*0.6;
    g.beginPath();
    g.moveTo(hx-6*s, hy-8*s);
    g.lineTo(hx+16*s, hy-2*s);
    g.lineTo(hx+17*s, hy+3*s);
    g.lineTo(hx-4*s, hy+9*s);
    g.closePath(); g.fill();
    // ear
    ell(hx-3*s, hy-9*s, 3.4*s, 3.0*s, 0);
    // legs
    limb(bx-18*s, y-12*s, bx-19*s, y, 4.4*s, 3.4*s);
    limb(bx+16*s, y-12*s, bx+18*s, y, 4.4*s, 3.4*s);
    // tail
    limb(bx-30*s, y-14*s, bx-40*s, y-9*s, 4.2*s, 2.0*s);
    g.restore();
  }

  /* story: two figures pass an object between them, the badger crosses, repeat. 48s loop */
  const LOOP=48;
  function draw(now){
    const T=(now/1000)%LOOP, t=now/1000;
    g.clearRect(0,0,CW,CH);

    // shadow density: puppets pressed near/far from the cloth
    const near=0.62+0.10*Math.sin(T/LOOP*6.2832);

    // ---- far pair: small, pale, high on the screen (depth plane) ----
    g.fillStyle='rgba(66,80,84,'+(0.24).toFixed(3)+')';
    g.save(); g.translate(0,-CH*0.115); g.scale(1,1);
    figure(t*0.6, CW*0.20, 0.62, 4.1, 0.15, false);
    figure(t*0.6, CW*0.80, 0.60, 1.2, 0.75, true);
    g.restore();

    // ---- badger crossing, ground plane, slow ----
    const bt=((T)/LOOP);
    const bx=-70 + (CW+150)*((bt*1.0)%1);
    g.fillStyle='rgba(40,52,56,0.80)';
    badger(t, bx, 0.9, 0.0);

    // ---- principals ----
    // gesture arc: A raises, offers; B receives, raises in turn
    const ph=(T/LOOP)*6.2832;
    const gA=0.5+0.5*Math.sin(ph);
    const gB=0.5+0.5*Math.sin(ph+Math.PI);
    const drift=Math.sin(ph)*26;

    g.fillStyle='rgba(31,42,46,'+near.toFixed(3)+')';
    const hA=figure(t, CW*0.34 + drift*0.5, 1.55, 0.0, gA, false);
    g.fillStyle='rgba(24,34,38,'+(near+0.10).toFixed(3)+')';
    const hB=figure(t, CW*0.70 - drift*0.5, 1.72, 3.14, gB, true);

    // the passed object: a solid disc, the one bright thing the shadows share
    const pass=0.5+0.5*Math.sin(ph - Math.PI/2);
    const ox=hA[0]+(hB[0]-hA[0])*pass;
    const oy=hA[1]+(hB[1]-hA[1])*pass - Math.sin(pass*Math.PI)*30;
    g.fillStyle='rgba(20,30,34,0.86)';
    g.beginPath(); g.arc(ox,oy,7.5,0,6.2832); g.fill();
    // rod holding the object
    g.fillStyle='rgba(28,38,42,0.55)';
    g.fillRect(ox-1.2, oy, 2.4, CH-oy);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ---------- procedural rain-hall drone (direct view only) ---------- */
  if(window.self===window.top){
    let started=false;
    const boot=()=>{
      if(started) return; started=true;
      try{
        const A=new (window.AudioContext||window.webkitAudioContext)();
        const out=A.createGain(); out.gain.value=0.0; out.connect(A.destination);
        out.gain.linearRampToValueAtTime(0.055, A.currentTime+8);
        // rain: filtered noise
        const n=A.createBufferSource(), buf=A.createBuffer(1, A.sampleRate*4, A.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.5;
        n.buffer=buf; n.loop=true;
        const bp=A.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1400; bp.Q.value=0.6;
        const ng=A.createGain(); ng.gain.value=0.35;
        n.connect(bp); bp.connect(ng); ng.connect(out); n.start();
        // low drone, two detuned sines
        [55, 82.5].forEach((f,i)=>{
          const o=A.createOscillator(); o.type='sine'; o.frequency.value=f;
          const gg=A.createGain(); gg.gain.value=i?0.10:0.16;
          const lfo=A.createOscillator(); lfo.frequency.value=0.045+i*0.017;
          const lg=A.createGain(); lg.gain.value=i?0.05:0.07;
          lfo.connect(lg); lg.connect(gg.gain);
          o.connect(gg); gg.connect(out); o.start(); lfo.start();
        });
      }catch(e){}
    };
    addEventListener('pointerdown',boot,{once:true});
    addEventListener('keydown',boot,{once:true});
    setTimeout(boot,600);
  }
})();
</script>
</body>
</html>
