<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta charset="utf-8">
<title>2026-10-10</title>
<style>
  html,body{margin:0;height:100%;background:#0f1434;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:top left;
    background:linear-gradient(180deg,#1b2566 0%,#172057 35%,#121847 62%,#0f1434 100%);overflow:hidden}
  #scene-image{position:absolute;left:-40px;top:-40px;width:1160px;height:1700px;object-fit:cover;
    -webkit-mask-image:radial-gradient(ellipse 78% 70% at 50% 38%,#000 46%,rgba(0,0,0,.6) 70%,transparent 100%);
    mask-image:radial-gradient(ellipse 78% 70% at 50% 38%,#000 46%,rgba(0,0,0,.6) 70%,transparent 100%);
    animation:drift 60s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(18px,12px) scale(1.025)}}
  #loom{position:absolute;left:0;top:0;width:1080px;height:1920px;
    -webkit-mask-image:linear-gradient(to bottom,transparent 46%,#000 62%);
    mask-image:linear-gradient(to bottom,transparent 46%,#000 62%)}
  .heddle{position:absolute;left:70px;width:940px;height:12px;background:#7a1a1a}
  #h1{top:1140px;animation:hed 4.8s ease-in-out infinite}
  #h2{top:1176px;animation:hed 4.8s ease-in-out infinite reverse}
  @keyframes hed{0%,15%{transform:translateY(0)}45%,65%{transform:translateY(-22px)}95%,100%{transform:translateY(0)}}
  .post{position:absolute;top:1100px;width:26px;height:820px;background:#0a0d26}
  #p1{left:44px}#p2{left:1010px}
  #beam{position:absolute;left:44px;top:1884px;width:992px;height:36px;background:#0a0d26}
  #guinea-pig{position:absolute;left:52px;top:1862px;width:18px;height:18px;opacity:.6;transform:rotate(-8deg)}
  #date{position:absolute;right:28px;bottom:14px;font:500 15px/1 Helvetica,Arial,sans-serif;letter-spacing:.14em;color:#ece6d4;opacity:.4}
</style>
</head>
<body>
<div id="stage">
  <img id="scene-image" src="scene.png" alt="">
  <div class="post" id="p1"></div><div class="post" id="p2"></div>
  <canvas id="loom" width="540" height="960"></canvas>
  <div class="heddle" id="h1"></div><div class="heddle" id="h2"></div>
  <div id="beam"></div>
  <img id="guinea-pig" src="guineapig.png" alt="">
  <div id="date">2026 · 10 · 10</div>
</div>
<script>
(function(){
  // responsive shell
  var st=document.getElementById('stage');
  function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);
    st.style.transform='translate('+((innerWidth-1080*s)/2)+'px,'+((innerHeight-1920*s)/2)+'px) scale('+s+')';}
  addEventListener('resize',fit);fit();

  // date seed
  var seed=20261010;
  function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
  function hash(a,b){var h=(a*73856093)^(b*19349663)^20261010;h=Math.imul(h^h>>>13,0x5bd1e995);h^=h>>>15;return (h>>>0);}

  var PAL=['#d7281e','#f2c021','#1f4fbf','#ece6d4','#0f1434'];
  // seeded column design
  var X0=90,X1=990,W=X1-X0,NW=36,SP=W/NW;
  var ncol=3+Math.floor(rnd()*3),bounds=[0];
  for(var i=1;i<ncol;i++)bounds.push(bounds[i-1]+(W-bounds[i-1])/(ncol-i+1)*(0.6+rnd()*0.8));
  bounds.push(W);
  var period=[];for(i=0;i<ncol;i++)period.push(4+Math.floor(rnd()*14));
  function colColor(c,row){return PAL[hash(c,Math.floor(row/period[c]))%5];}

  var cv=document.getElementById('loom'),ctx=cv.getContext('2d');
  ctx.scale(0.5,0.5);
  var ROWH=14,FELL=1320,T=2.4,BOT=1884;

  // static warp drawn once
  var warp=document.createElement('canvas');warp.width=540;warp.height=960;
  var wc=warp.getContext('2d');wc.scale(0.5,0.5);
  wc.fillStyle='rgba(236,230,212,0.5)';
  for(i=0;i<NW;i++)wc.fillRect(X0+i*SP+SP/2-1.5,900,3,1020);

  var t0=performance.now();
  function frame(now){
    var t=(now-t0)/1000;
    var idx=Math.floor(t/T),frac=t/T-idx;
    ctx.clearRect(0,0,1080,1920);
    ctx.drawImage(warp,0,0,1080,1920);
    // shuttle progress
    var p=Math.min(1,frac/0.75);p=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    var ltr=idx%2===0;
    var sx=ltr?X0+W*p:X1-W*p;
    // rows: i=0 current
    for(i=0;;i++){
      var top=FELL-2*ROWH+(frac+i)*ROWH;
      if(top>BOT)break;
      var row=idx-i;if(row<0)break;
      var h=Math.min(ROWH,BOT-top);
      for(var c=0;c<ncol;c++){
        var a=X0+bounds[c],b=X0+bounds[c+1];
        if(i===0){ if(ltr){b=Math.min(b,sx);} else {a=Math.max(a,sx);} if(b<=a)continue; }
        ctx.fillStyle=colColor(c,row);ctx.fillRect(a,top,b-a,h);
      }
      // over-threads of warp on this row
      ctx.fillStyle='rgba(236,230,212,0.85)';
      var lim=i===0?(ltr?sx:X1):X1,lo=i===0?(ltr?X0:sx):X0;
      for(var k=row%2;k<NW;k+=2){var x=X0+k*SP+SP/2-1.5;if(x>lo&&x<lim)ctx.fillRect(x,top,3,h);}
    }
    // fell bar
    ctx.fillStyle='#0a0d26';ctx.fillRect(X0-20,FELL-2*ROWH-6,W+40,6);
    // shuttle
    var cy=FELL-2*ROWH+frac*ROWH+ROWH/2;
    ctx.fillStyle='#7a1a1a';ctx.fillRect(sx-70,cy-13,140,26);
    ctx.fillStyle='#f2c021';ctx.fillRect(ltr?sx+52:sx-70,cy-13,18,26);
    ctx.fillStyle='#1f4fbf';ctx.fillRect(sx-14,cy-7,28,14);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // quiet loom audio
  if(window.self===window.top){
    try{
      var AC=window.AudioContext||window.webkitAudioContext,ac=new AC();
      var g=ac.createGain();g.gain.value=0.05;g.connect(ac.destination);
      var o=ac.createOscillator();o.type='sine';o.frequency.value=55;o.connect(g);o.start();
      function thump(){var n=ac.createOscillator(),e=ac.createGain();n.type='triangle';n.frequency.setValueAtTime(140,ac.currentTime);
        n.frequency.exponentialRampToValueAtTime(50,ac.currentTime+0.18);e.gain.setValueAtTime(0.08,ac.currentTime);
        e.gain.exponentialRampToValueAtTime(0.0005,ac.currentTime+0.25);n.connect(e);e.connect(ac.destination);n.start();n.stop(ac.currentTime+0.3);}
      setInterval(thump,T*1000);
      if(ac.state==='suspended'){ac.resume();}
    }catch(e){}
  }
})();
</script>
</body>
</html>
