<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>2026-04-09</title>
<style>
  :root{
    --bg:#120d08;
    --deep:#1e130b;
    --gold:#d6b25a;
    --gold2:#f1db97;
    --bronze:#9c6c27;
    --ivory:#f6ead0;
    --crimson:#8f1f1a;
    --wine:#4c1010;
    --jade:#2f6d66;
    --shadow:#070403;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:
      radial-gradient(circle at 50% 50%, #2b1a0e 0%, #130d07 45%, #050303 100%);
    overflow:hidden;
    font-family: Georgia, "Times New Roman", serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 42%, rgba(255,235,185,.16), transparent 22%),
      linear-gradient(180deg, #2a190f 0%, #140d08 18%, #090605 100%);
    box-shadow:
      0 0 0 1px rgba(255,220,150,.18),
      0 0 40px rgba(0,0,0,.45),
      inset 0 0 80px rgba(0,0,0,.45);
  }

  #glow{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 50%, rgba(245,215,120,.12) 0%, rgba(245,215,120,.06) 18%, transparent 40%),
      radial-gradient(circle at 50% 15%, rgba(255,244,205,.08), transparent 28%);
    mix-blend-mode:screen;
    pointer-events:none;
    animation: breathe 18s ease-in-out infinite;
  }

  #tessellation, #ornament, #overlay, #dust, #vignette{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    pointer-events:none;
  }

  #tessellation{
    opacity:.98;
    filter: saturate(1.15) contrast(1.08);
  }

  #art-image{
    position:absolute;
    left:50%;
    top:50%;
    width:57%;
    height:auto;
    transform:translate(-50%,-50%);
    opacity:.95;
    z-index:4;
    object-fit:cover;
    filter:
      sepia(.28)
      saturate(1.08)
      contrast(1.12)
      brightness(1.02)
      drop-shadow(0 10px 30px rgba(0,0,0,.45));
    clip-path:ellipse(41% 49% at 50% 50%);
    border-radius:50%;
    animation: imageFloat 22s ease-in-out infinite;
  }

  #artHalo{
    position:absolute;
    left:50%;
    top:50%;
    width:63%;
    aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    z-index:3;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,243,202,.28) 0%, rgba(255,224,146,.14) 28%, rgba(214,178,90,.12) 42%, rgba(0,0,0,0) 64%);
    filter:blur(10px);
    animation: haloPulse 14s ease-in-out infinite;
    pointer-events:none;
  }

  #medallion{
    position:absolute;
    left:50%;
    top:50%;
    width:70%;
    aspect-ratio:1/1;
    transform:translate(-50%,-50%) rotate(45deg);
    z-index:2;
    border:2px solid rgba(232,206,127,.44);
    box-shadow:
      inset 0 0 0 2px rgba(99,58,20,.55),
      0 0 24px rgba(0,0,0,.2);
    background:
      linear-gradient(135deg, rgba(255,240,180,.05), rgba(0,0,0,0) 35%, rgba(255,220,140,.06) 65%, rgba(0,0,0,0)),
      linear-gradient(135deg, rgba(125,78,23,.32), rgba(54,28,10,.18));
    animation: medallionTurn 36s ease-in-out infinite;
    pointer-events:none;
  }

  .frame-border{
    position:absolute; inset:14px;
    z-index:8;
    border:2px solid rgba(214,178,90,.72);
    box-shadow:
      inset 0 0 0 2px rgba(86,49,12,.9),
      inset 0 0 0 7px rgba(214,178,90,.18),
      inset 0 0 40px rgba(255,228,154,.08);
    pointer-events:none;
  }
  .frame-border::before,
  .frame-border::after{
    content:"";
    position:absolute; inset:18px;
    border:1px solid rgba(244,223,160,.35);
  }
  .frame-border::after{
    inset:34px;
    border-color:rgba(120,78,23,.55);
  }

  .column{
    position:absolute;
    top:8%;
    bottom:8%;
    width:8.4%;
    z-index:5;
    opacity:.82;
    background:
      linear-gradient(90deg, rgba(75,43,15,.95) 0%, rgba(192,154,72,.85) 18%, rgba(255,227,151,.95) 38%, rgba(142,92,30,.92) 58%, rgba(70,40,15,.98) 100%);
    box-shadow: inset 0 0 18px rgba(0,0,0,.45), 0 0 12px rgba(0,0,0,.22);
  }
  .column.left{ left:4.2%;}
  .column.right{ right:4.2%;}
  .column::before, .column::after{
    content:"";
    position:absolute; left:-12%; width:124%;
    height:7.4%;
    background:
      linear-gradient(180deg, rgba(255,237,179,.9), rgba(145,95,29,.95));
    border:1px solid rgba(247,221,149,.45);
    box-shadow: inset 0 0 10px rgba(0,0,0,.3);
  }
  .column::before{ top:-1.2%; }
  .column::after{ bottom:-1.2%; }

  .curtain{
    position:absolute;
    top:0;
    width:20%;
    height:36%;
    z-index:1;
    background:
      repeating-linear-gradient(90deg,
        rgba(56,8,12,.92) 0 12%,
        rgba(121,22,25,.96) 12% 24%,
        rgba(73,10,13,.92) 24% 36%);
    filter: drop-shadow(0 10px 20px rgba(0,0,0,.4));
    opacity:.9;
  }
  .curtain.left{
    left:-2%;
    clip-path:polygon(0 0, 100% 0, 84% 100%, 8% 100%);
    animation: curtainSlow 21s ease-in-out infinite;
  }
  .curtain.right{
    right:-2%;
    clip-path:polygon(0 0, 100% 0, 92% 100%, 16% 100%);
    animation: curtainSlow 24s ease-in-out infinite reverse;
  }

  #overlay{
    z-index:6;
    mix-blend-mode:screen;
    opacity:.9;
  }

  #dust{
    z-index:7;
    opacity:.18;
    mix-blend-mode:screen;
  }

  #vignette{
    z-index:9;
    background:
      radial-gradient(circle at 50% 50%, transparent 52%, rgba(0,0,0,.16) 69%, rgba(0,0,0,.55) 100%),
      linear-gradient(180deg, rgba(255,240,180,.04), transparent 10%, transparent 90%, rgba(0,0,0,.24));
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    right:82px;
    bottom:152px;
    z-index:5;
    opacity:.58;
    filter: sepia(.35) saturate(.8) brightness(.88);
    transform:rotate(-8deg);
  }

  #date{
    position:absolute;
    right:22px;
    bottom:16px;
    z-index:10;
    font-size:14px;
    letter-spacing:.12em;
    color:rgba(244,226,182,.44);
    text-shadow:0 1px 0 rgba(0,0,0,.35);
    user-select:none;
  }

  @keyframes breathe{
    0%,100%{transform:scale(1);opacity:.88}
    50%{transform:scale(1.03);opacity:1}
  }
  @keyframes imageFloat{
    0%,100%{transform:translate(-50%,-50%) scale(1) rotate(-1deg)}
    50%{transform:translate(-50%,-50.8%) scale(1.018) rotate(1deg)}
  }
  @keyframes haloPulse{
    0%,100%{transform:translate(-50%,-50%) scale(1); opacity:.8}
    50%{transform:translate(-50%,-50%) scale(1.04); opacity:1}
  }
  @keyframes medallionTurn{
    0%,100%{transform:translate(-50%,-50%) rotate(45deg) scale(1)}
    50%{transform:translate(-50%,-50%) rotate(47.5deg) scale(1.015)}
  }
  @keyframes curtainSlow{
    0%,100%{transform:translateY(0) scaleY(1)}
    50%{transform:translateY(-1.2%) scaleY(1.02)}
  }
</style>
</head>
<body>
  <div id="frame">
    <div class="curtain left"></div>
    <div class="curtain right"></div>
    <div class="column left"></div>
    <div class="column right"></div>

    <canvas id="tessellation" width="1080" height="1920"></canvas>
    <svg id="ornament" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true"></svg>

    <div id="medallion"></div>
    <div id="artHalo"></div>
    <img id="art-image" src="img/art.efd7d2a0.png" alt="" />
    <canvas id="overlay" width="1080" height="1920"></canvas>
    <canvas id="dust" width="1080" height="1920"></canvas>

    <img id="guinea-pig" src="img/guineapig.efd7d2a0.png" alt="" />

    <div id="glow"></div>
    <div class="frame-border"></div>
    <div id="vignette"></div>
    <div id="date">2026-04-09</div>
  </div>

<script>
(() => {
  const DATE = "2026-04-09";
  function xmur3(str){
    let h = 1779033703 ^ str.length;
    for(let i=0;i<str.length;i++){
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = h << 13 | h >>> 19;
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    }
  }
  function sfc32(a,b,c,d){
    return function(){
      a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
      let t = (a + b) | 0;
      a = b ^ b >>> 9;
      b = c + (c << 3) | 0;
      c = (c << 21 | c >>> 11);
      d = d + 1 | 0;
      t = t + d | 0;
      c = c + t | 0;
      return (t >>> 0) / 4294967296;
    }
  }
  const seed = xmur3("beaux-arts-tessellation-" + DATE);
  const rand = sfc32(seed(), seed(), seed(), seed());
  const TAU = Math.PI * 2;

  const tess = document.getElementById('tessellation');
  const tctx = tess.getContext('2d');
  const over = document.getElementById('overlay');
  const octx = over.getContext('2d');
  const dust = document.getElementById('dust');
  const dctx = dust.getContext('2d');
  const svg = document.getElementById('ornament');

  const W = 1080, H = 1920, CX = W/2, CY = H/2;

  function buildOrnament(){
    const ns = "http://www.w3.org/2000/svg";
    const make = (tag, attrs={}) => {
      const el = document.createElementNS(ns, tag);
      for(const k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    };

    const defs = make('defs');
    const rg = make('radialGradient',{id:'goldGrad',cx:'50%',cy:'50%',r:'65%'});
    rg.append(
      make('stop',{offset:'0%','stop-color':'#fff3c5','stop-opacity':'1'}),
      make('stop',{offset:'36%','stop-color':'#e9ca78','stop-opacity':'1'}),
      make('stop',{offset:'72%','stop-color':'#a36a24','stop-opacity':'1'}),
      make('stop',{offset:'100%','stop-color':'#5c330d','stop-opacity':'1'})
    );
    const lg = make('linearGradient',{id:'metal',x1:'0%',y1:'0%',x2:'100%',y2:'0%'});
    lg.append(
      make('stop',{offset:'0%','stop-color':'#5b3410'}),
      make('stop',{offset:'18%','stop-color':'#f6dda0'}),
      make('stop',{offset:'42%','stop-color':'#b57b28'}),
      make('stop',{offset:'65%','stop-color':'#ffeab4'}),
      make('stop',{offset:'100%','stop-color':'#6b3a11'})
    );
    defs.append(rg, lg);
    svg.append(defs);

    const g = make('g',{opacity:'0.94'});
    svg.append(g);

    const top = make('g');
    const bottom = make('g',{transform:'translate(0 1920) scale(1 -1)'});
    const left = make('g',{transform:'translate(0 0) rotate(-90 120 960)'});
    const right = make('g',{transform:'translate(1080 0) rotate(90 960 960)'});

    function flourishGroup(yBase){
      const grp = make('g');
      for(let i=0;i<8;i++){
        const x = 140 + i*114;
        const p = make('path',{
          d:`M ${x-30} ${yBase+30}
             C ${x-12} ${yBase-24}, ${x+12} ${yBase-24}, ${x+30} ${yBase+30}
             C ${x+10} ${yBase+18}, ${x-10} ${yBase+18}, ${x-30} ${yBase+30} Z`,
          fill:'url(#goldGrad)',
          opacity: i%2?'.85':'.7'
        });
        const c = make('circle',{
          cx:x, cy:yBase+2, r:(i%2?15:11),
          fill:'url(#metal)', opacity:'.9'
        });
        grp.append(p,c);
      }
      return grp;
    }

    [top,bottom,left,right].forEach((side,idx)=>{
      side.appendChild(make('rect',{
        x: idx<2?82:900, y: idx<2?54:510,
        width: idx<2?916:160, height: idx<2?86:900,
        rx:'5', fill:'rgba(50,25,8,.18)', stroke:'url(#metal)', 'stroke-width':'2'
      }));
      side.appendChild(flourishGroup(92));
      side.appendChild(make('path',{
        d:'M 130 152 C 220 120, 320 120, 410 152 S 600 184, 680 152 S 850 120, 950 152',
        fill:'none', stroke:'url(#metal)', 'stroke-width':'6', 'stroke-linecap':'round', opacity:'.7'
      }));
      for(let i=0;i<5;i++){
        const x = 180 + i*180;
        side.appendChild(make('circle',{cx:x, cy:136, r:9 + (i%2)*4, fill:'url(#goldGrad)', opacity:'.92'}));
      }
    });

    g.append(top,bottom,left,right);

    const center = make('g',{opacity:'.9'});
    center.append(
      make('circle',{cx:540, cy:960, r:338, fill:'none', stroke:'rgba(239,213,131,.3)','stroke-width':'4'}),
      make('circle',{cx:540, cy:960, r:356, fill:'none', stroke:'rgba(106,63,20,.7)','stroke-width':'10'}),
      make('circle',{cx:540, cy:960, r:374, fill:'none', stroke:'rgba(245,224,161,.28)','stroke-width':'2'})
    );
    for(let i=0;i<24;i++){
      const a = i/24 * TAU;
      const x1 = CX + Math.cos(a)*390, y1 = CY + Math.sin(a)*390;
      const x2 = CX + Math.cos(a)*430, y2 = CY + Math.sin(a)*430;
      center.appendChild(make('line',{
        x1,y1,x2,y2,
        stroke:'rgba(240,216,144,.28)','stroke-width': (i%2?2:4)
      }));
    }
    svg.append(center);
  }

  buildOrnament();

  const rows = 16;
  const cols = 8;
  const tileW = W / cols;
  const tileH = H / rows;

  const palette = [
    "#f3da93","#ddb45c","#ae7329","#6c3d14",
    "#8a2018","#4d1010","#2f6d66","#ecdcb8"
  ];

  const tiles = [];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const type = Math.floor(rand()*4);
      tiles.push({
        r,c,type,
        phase: rand()*TAU,
        phase2: rand()*TAU,
        hueShift: rand()*0.6,
        inset: 6 + rand()*18,
        level: Math.floor(rand()*3),
        rotBase: (Math.floor(rand()*4) * Math.PI/2),
      });
    }
  }

  function lerp(a,b,t){ return a + (b-a)*t; }
  function ease(x){ return .5 - .5*Math.cos(x*Math.PI); }

  function drawTile(x,y,w,h,type,t,level){
    const s = Math.min(w,h);
    const m = 4 + level*4;
    const inner = s*0.17 + Math.sin(t*0.7)*s*0.03;
    const outer = s*0.5 - m;

    tctx.save();
    tctx.translate(x+w/2, y+h/2);

    if(type===0){
      tctx.beginPath();
      tctx.moveTo(0,-outer);
      tctx.lineTo(outer,0);
      tctx.lineTo(0,outer);
      tctx.lineTo(-outer,0);
      tctx.closePath();
      tctx.fill();
      tctx.stroke();

      tctx.beginPath();
      tctx.moveTo(0,-inner);
      tctx.lineTo(inner,0);
      tctx.lineTo(0,inner);
      tctx.lineTo(-inner,0);
      tctx.closePath();
      tctx.fillStyle = "rgba(40,16,7,.28)";
      tctx.fill();

      tctx.beginPath();
      tctx.arc(0,0,inner*0.42,0,TAU);
      tctx.fillStyle = "rgba(255,244,208,.38)";
      tctx.fill();
    } else if(type===1){
      for(let k=0;k<4;k++){
        const a0 = k*Math.PI/2;
        tctx.beginPath();
        tctx.moveTo(0,0);
        tctx.arc(0,0,outer,a0+0.08, a0+Math.PI/2-0.08);
        tctx.closePath();
        tctx.fill();
        tctx.stroke();
      }
      tctx.beginPath();
      tctx.arc(0,0,inner,0,TAU);
      tctx.fillStyle = "rgba(82,26,15,.22)";
      tctx.fill();
    } else if(type===2){
      const rr = outer*0.92;
      tctx.beginPath();
      for(let i=0;i<8;i++){
        const a = i*TAU/8 + Math.PI/8;
        const rad = i%2===0 ? rr : rr*0.55;
        const px = Math.cos(a)*rad;
        const py = Math.sin(a)*rad;
        if(i===0) tctx.moveTo(px,py); else tctx.lineTo(px,py);
      }
      tctx.closePath();
      tctx.fill();
      tctx.stroke();

      tctx.beginPath();
      for(let i=0;i<4;i++){
        const a = i*TAU/4 + Math.PI/4;
        const px = Math.cos(a)*inner;
        const py = Math.sin(a)*inner;
        if(i===0) tctx.moveTo(px,py); else tctx.lineTo(px,py);
      }
      tctx.closePath();
      tctx.fillStyle = "rgba(255,241,193,.26)";
      tctx.fill();
    } else {
      tctx.beginPath();
      tctx.roundRect(-outer,-outer,outer*2,outer*2,outer*0.2);
      tctx.fill();
      tctx.stroke();

      tctx.beginPath();
      tctx.moveTo(-outer,0);
      tctx.lineTo(0,-outer);
      tctx.lineTo(outer,0);
      tctx.lineTo(0,outer);
      tctx.closePath();
      tctx.fillStyle = "rgba(31,10,6,.25)";
      tctx.fill();

      tctx.beginPath();
      tctx.roundRect(-inner*0.9,-inner*0.9,inner*1.8,inner*1.8,inner*0.25);
      tctx.fillStyle = "rgba(247,232,182,.21)";
      tctx.fill();
    }
    tctx.restore();
  }

  function paintBackdrop(time){
    const g = tctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#382114");
    g.addColorStop(.22,"#573116");
    g.addColorStop(.5,"#2a170d");
    g.addColorStop(.78,"#4c1613");
    g.addColorStop(1,"#1b0c08");
    tctx.fillStyle = g;
    tctx.fillRect(0,0,W,H);

    tctx.globalCompositeOperation = "screen";
    for(let i=0;i<10;i++){
      const r = 120 + i*55;
      const alpha = .015 + i*.003;
      tctx.strokeStyle = `rgba(249,226,157,${alpha})`;
      tctx.lineWidth = i%2?2:1;
      tctx.beginPath();
      tctx.arc(CX, CY, r + Math.sin(time*0.25+i)*8, 0, TAU);
      tctx.stroke();
    }
    tctx.globalCompositeOperation = "source-over";
  }

  function renderTessellation(ms){
    const time = ms*0.001;
    tctx.clearRect(0,0,W,H);
    paintBackdrop(time);

    for(const tile of tiles){
      const x = tile.c*tileW;
      const y = tile.r*tileH;

      const centerX = x + tileW/2;
      const centerY = y + tileH/2;
      const dx = centerX - CX;
      const dy = centerY - CY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const focus = Math.max(0,1 - dist/860);

      const swing = Math.sin(time*0.45 + tile.phase);
      const swing2 = Math.cos(time*0.33 + tile.phase2);
      const rot = tile.rotBase + swing*0.18 + focus*0.22*Math.sin(time*0.28 + dist*0.01);
      const pulse = 0.92 + 0.09*Math.sin(time*0.72 + tile.phase2);
      const w = tileW * pulse;
      const h = tileH * pulse;

      tctx.save();
      tctx.translate(centerX, centerY);
      tctx.rotate(rot);
      tctx.translate(-centerX, -centerY);

      const idx = (tile.r + tile.c + tile.level) % palette.length;
      const idx2 = (idx + 2 + Math.floor((swing2+1)*1.5)) % palette.length;

      const grad = tctx.createLinearGradient(x,y,x+tileW,y+tileH);
      grad.addColorStop(0, palette[idx]);
      grad.addColorStop(.45, palette[idx2]);
      grad.addColorStop(1, tile.r%2 ? "#5e3510" : "#261108");
      tctx.fillStyle = grad;
      tctx.strokeStyle = `rgba(255,235,177,${0.14 + focus*0.22})`;
      tctx.lineWidth = 2 + tile.level;

      drawTile(centerX-w/2, centerY-h/2, w, h, tile.type, time + tile.phase, tile.level);

      tctx.restore();

      if(tile.r < rows-1){
        tctx.strokeStyle = "rgba(255,233,169,.08)";
        tctx.lineWidth = 1;
        tctx.beginPath();
        tctx.moveTo(x, y+tileH);
        tctx.lineTo(x+tileW, y+tileH);
        tctx.stroke();
      }
      if(tile.c < cols-1){
        tctx.beginPath();
        tctx.moveTo(x+tileW, y);
        tctx.lineTo(x+tileW, y+tileH);
        tctx.stroke();
      }
    }

    tctx.save();
    tctx.globalCompositeOperation = "multiply";
    const rg = tctx.createRadialGradient(CX,CY,180,CX,CY,760);
    rg.addColorStop(0,"rgba(0,0,0,0)");
    rg.addColorStop(.58,"rgba(35,12,6,.12)");
    rg.addColorStop(1,"rgba(0,0,0,.46)");
    tctx.fillStyle = rg;
    tctx.fillRect(0,0,W,H);
    tctx.restore();
  }

  function renderOverlay(ms){
    const time = ms*0.001;
    octx.clearRect(0,0,W,H);

    octx.save();
    octx.translate(CX,CY);

    for(let i=0;i<36;i++){
      const a = i/36 * TAU + time*0.04;
      const len = 350 + (i%3)*42 + Math.sin(time*0.8+i)*10;
      const inner = 292 + Math.cos(time*0.6+i)*8;
      octx.strokeStyle = i%2===0 ? "rgba(255,230,156,.22)" : "rgba(130,80,23,.24)";
      octx.lineWidth = i%3===0 ? 4 : 2;
      octx.beginPath();
      octx.moveTo(Math.cos(a)*inner, Math.sin(a)*inner);
      octx.lineTo(Math.cos(a)*len, Math.sin(a)*len);
      octx.stroke();
    }

    for(let ring=0; ring<4; ring++){
      const rad = 285 + ring*38 + Math.sin(time*0.5+ring)*4;
      octx.strokeStyle = ring%2===0 ? "rgba(244,219,144,.24)" : "rgba(90,50,15,.35)";
      octx.lineWidth = ring%2===0 ? 3 : 7;
      octx.beginPath();
      octx.arc(0,0,rad,0,TAU);
      octx.stroke();
    }

    for(let i=0;i<18;i++){
      const a = i/18*TAU - time*0.06;
      const r = 430;
      const x = Math.cos(a)*r;
      const y = Math.sin(a)*r;
      octx.fillStyle = i%2 ? "rgba(255,241,196,.35)" : "rgba(173,114,35,.3)";
      octx.beginPath();
      octx.moveTo(x, y-20);
      octx.lineTo(x+20, y);
      octx.lineTo(x, y+20);
      octx.lineTo(x-20, y);
      octx.closePath();
      octx.fill();
    }
    octx.restore();

    const sweep = octx.createLinearGradient(0,0,W,H);
    sweep.addColorStop(0,"rgba(255,230,167,.035)");
    sweep.addColorStop(.5,"rgba(255,245,218,0)");
    sweep.addColorStop(1,"rgba(115,62,18,.06)");
    octx.fillStyle = sweep;
    octx.fillRect(0,0,W,H);
  }

  const specks = [];
  for(let i=0;i<140;i++){
    specks.push({
      x: rand()*W,
      y: rand()*H,
      r: rand()*1.8 + .3,
      a: rand()*TAU,
      s: .1 + rand()*.25
    });
  }

  function renderDust(ms){
    const time = ms*0.001;
    dctx.clearRect(0,0,W,H);
    for(const p of specks){
      const x = p.x + Math.cos(time*p.s + p.a)*6;
      const y = p.y + Math.sin(time*p.s*0.8 + p.a)*6;
      dctx.fillStyle = `rgba(255,238,188,${0.08 + p.r*0.03})`;
      dctx.beginPath();
      dctx.arc(x,y,p.r,0,TAU);
      dctx.fill();
    }
    for(let y=0;y<H;y+=6){
      dctx.fillStyle = `rgba(255,244,210,${(Math.sin(y*0.03+time*0.5)*0.5+0.5)*0.01})`;
      dctx.fillRect(0,y,W,1);
    }
  }

  let audioStarted = false;
  function startAudio(){
    if(audioStarted) return;
    audioStarted = true;
    try{
      const actx = new (window.AudioContext || window.webkitAudioContext)();
      const master = actx.createGain();
      master.gain.value = 0.012;
      master.connect(actx.destination);

      const freqs = [110, 164.81, 220, 329.63];
      freqs.forEach((f,i)=>{
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        const lfo = actx.createOscillator();
        const lfoGain = actx.createGain();
        osc.type = i%2 ? "triangle" : "sine";
        osc.frequency.value = f;
        gain.gain.value = 0.0028;
        lfo.frequency.value = 0.025 + i*0.008;
        lfoGain.gain.value = 0.0014 + i*0.0005;
        lfo.connect(lfoGain);
        lfoGain.connect(gain.gain);
        osc.connect(gain);
        gain.connect(master);
        osc.start();
        lfo.start();
      });

      const noiseBuf = actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i] = (rand()*2-1)*0.22;
      const noise = actx.createBufferSource();
      noise.buffer = noiseBuf;
      noise.loop = true;
      const nf = actx.createBiquadFilter();
      nf.type = "bandpass";
      nf.frequency.value = 1200;
      nf.Q.value = 0.3;
      const ng = actx.createGain();
      ng.gain.value = 0.002;
      noise.connect(nf); nf.connect(ng); ng.connect(master);
      noise.start();
    }catch(e){}
  }
  setTimeout(startAudio, 300);

  function frame(ms){
    renderTessellation(ms);
    renderOverlay(ms);
    renderDust(ms);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
