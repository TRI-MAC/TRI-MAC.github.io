<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>2026-04-01</title>
<style>
  :root{
    --bg:#efe2c6;
    --cream:#f4ead6;
    --sand:#d8b98b;
    --mustard:#c89b2d;
    --rust:#b65a32;
    --teal:#4d8a87;
    --deepteal:#245a5a;
    --olive:#7d7b4d;
    --charcoal:#44362d;
    --ink:#2f241d;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#d9ceb5;
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(1200px 900px at 20% 15%, rgba(255,255,255,.45), transparent 50%),
      radial-gradient(700px 600px at 80% 85%, rgba(77,138,135,.18), transparent 60%),
      linear-gradient(180deg, #f2e7d1 0%, #ead9b8 48%, #d9c093 100%);
    box-shadow:0 20px 60px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.25);
  }

  #paperGrain,
  #overlaySvg,
  #haloCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  #paperGrain{
    opacity:.14;
    mix-blend-mode:multiply;
  }

  .sun{
    position:absolute;
    left:50%;
    top:12%;
    width:43%;
    aspect-ratio:1/1;
    border-radius:50%;
    transform:translateX(-50%);
    background:
      radial-gradient(circle at 35% 35%, rgba(255,244,211,.95), rgba(255,219,138,.78) 42%, rgba(200,155,45,.8) 70%, rgba(182,90,50,.72) 100%);
    box-shadow:
      0 0 0 18px rgba(200,155,45,.08),
      0 0 0 48px rgba(200,155,45,.05),
      0 0 80px rgba(200,155,45,.15);
    animation:sunPulse 28s ease-in-out infinite;
    filter:saturate(1.06);
  }

  .sun:before,
  .sun:after{
    content:"";
    position:absolute;
    inset:-10%;
    border-radius:50%;
    border:10px solid rgba(255,245,220,.18);
    transform:scale(1.04);
    animation:ringDrift 32s ease-in-out infinite;
  }
  .sun:after{
    inset:-23%;
    border-width:4px;
    border-color:rgba(77,138,135,.18);
    animation-duration:44s;
    animation-direction:reverse;
  }

  .rayField{
    position:absolute;
    inset:0;
    opacity:.38;
    transform-origin:50% 26%;
    animation:slowSpin 90s linear infinite;
  }
  .ray{
    position:absolute;
    left:50%;
    top:26%;
    width:2.1%;
    height:28%;
    transform-origin:50% 0%;
    border-radius:999px;
    background:linear-gradient(180deg, rgba(200,155,45,.8), rgba(200,155,45,.05));
    filter:blur(.4px);
  }

  .arch{
    position:absolute;
    left:50%;
    top:16%;
    width:78%;
    height:49%;
    transform:translateX(-50%);
    border-radius:55% 55% 10% 10% / 42% 42% 8% 8%;
    background:linear-gradient(180deg, rgba(77,138,135,.18), rgba(77,138,135,.04));
    box-shadow:
      inset 0 0 0 16px rgba(36,90,90,.14),
      inset 0 0 0 42px rgba(244,234,214,.38),
      inset 0 0 0 66px rgba(184,117,61,.10);
    opacity:.72;
    animation:archBreath 26s ease-in-out infinite;
  }

  #artWrap{
    position:absolute;
    left:50%;
    top:27%;
    width:62%;
    height:40%;
    transform:translateX(-50%) rotate(-2.5deg);
    z-index:4;
    filter:drop-shadow(0 18px 30px rgba(68,54,45,.22));
  }

  #artWrap::before{
    content:"";
    position:absolute;
    inset:-4.4%;
    background:var(--cream);
    border-radius:48% 44% 42% 46% / 34% 41% 36% 40%;
    transform:rotate(3deg);
    box-shadow:
      0 0 0 2px rgba(68,54,45,.05),
      0 10px 26px rgba(68,54,45,.12);
  }

  #artWrap::after{
    content:"";
    position:absolute;
    inset:-8% -3% auto -3%;
    height:20%;
    background:radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.42), rgba(255,255,255,0) 70%);
    transform:rotate(-4deg);
    opacity:.65;
    pointer-events:none;
  }

  #art-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.97;
    border-radius:46% 42% 40% 44% / 33% 40% 35% 39%;
    clip-path:ellipse(46% 42% at 50% 50%);
    transform:translateY(0) scale(1.03);
    filter:saturate(1.05) contrast(1.02) sepia(.06);
    animation:imageFloat 24s ease-in-out infinite;
    z-index:2;
  }

  .imageBand,
  .imageBand2{
    position:absolute;
    z-index:5;
    pointer-events:none;
    border-radius:999px;
    mix-blend-mode:multiply;
  }
  .imageBand{
    left:-10%;
    top:41%;
    width:120%;
    height:7%;
    background:linear-gradient(90deg, rgba(77,138,135,.0), rgba(77,138,135,.26) 18%, rgba(244,234,214,.2) 48%, rgba(182,90,50,.22) 82%, rgba(182,90,50,0));
    transform:rotate(-10deg);
    animation:bandSlide 18s ease-in-out infinite;
    opacity:.8;
  }
  .imageBand2{
    left:6%;
    top:18%;
    width:88%;
    height:4%;
    background:linear-gradient(90deg, rgba(200,155,45,.0), rgba(200,155,45,.26) 20%, rgba(255,255,255,.25) 48%, rgba(200,155,45,.0));
    transform:rotate(18deg);
    animation:bandSlide2 23s ease-in-out infinite;
    opacity:.65;
  }

  .pedestal{
    position:absolute;
    left:50%;
    bottom:20%;
    width:76%;
    height:8%;
    transform:translateX(-50%);
    background:
      linear-gradient(180deg, rgba(68,54,45,.18), rgba(68,54,45,.05)),
      linear-gradient(90deg, rgba(216,185,139,.95), rgba(244,234,214,.9), rgba(216,185,139,.95));
    border-radius:24px;
    box-shadow:0 16px 26px rgba(68,54,45,.16), inset 0 1px 0 rgba(255,255,255,.45);
    z-index:3;
  }

  .groundArc{
    position:absolute;
    left:50%;
    bottom:10%;
    width:130%;
    height:22%;
    transform:translateX(-50%);
    border-radius:50%;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(77,138,135,.10), rgba(77,138,135,0) 58%),
      radial-gradient(ellipse at 50% 10%, rgba(68,54,45,.14), rgba(68,54,45,0) 66%);
    z-index:1;
    animation:groundShift 30s ease-in-out infinite;
  }

  .blob{
    position:absolute;
    border-radius:50% 50% 44% 56% / 60% 42% 58% 40%;
    opacity:.92;
    z-index:2;
    filter:drop-shadow(0 12px 18px rgba(68,54,45,.1));
  }
  .blob.a{
    left:-6%;
    bottom:16%;
    width:36%;
    height:19%;
    background:var(--teal);
    animation:blobMorphA 22s ease-in-out infinite;
  }
  .blob.b{
    right:-5%;
    bottom:13%;
    width:34%;
    height:17%;
    background:var(--rust);
    border-radius:56% 44% 52% 48% / 42% 58% 40% 60%;
    animation:blobMorphB 26s ease-in-out infinite;
  }
  .blob.c{
    left:21%;
    bottom:9%;
    width:25%;
    height:11%;
    background:var(--mustard);
    opacity:.82;
    animation:blobMorphC 18s ease-in-out infinite;
  }

  .column{
    position:absolute;
    bottom:0;
    width:12%;
    border-radius:60px 60px 0 0;
    z-index:2;
    opacity:.88;
  }
  .column.left{
    left:8%;
    height:46%;
    background:linear-gradient(180deg, rgba(77,138,135,.16), rgba(77,138,135,.55));
  }
  .column.mid{
    left:28%;
    height:32%;
    background:linear-gradient(180deg, rgba(200,155,45,.18), rgba(200,155,45,.56));
  }
  .column.right{
    right:11%;
    height:41%;
    background:linear-gradient(180deg, rgba(182,90,50,.15), rgba(182,90,50,.52));
  }

  .mobile{
    position:absolute;
    top:16%;
    right:10%;
    width:22%;
    height:22%;
    z-index:5;
    opacity:.92;
    animation:mobileSway 17s ease-in-out infinite;
    transform-origin:12% 0%;
  }
  .mobile .wire{
    position:absolute;
    left:10%;
    top:0;
    width:2px;
    height:30%;
    background:rgba(68,54,45,.45);
  }
  .mobile .arm1,
  .mobile .arm2,
  .mobile .arm3{
    position:absolute;
    height:2px;
    background:rgba(68,54,45,.45);
    transform-origin:left center;
    border-radius:999px;
  }
  .mobile .arm1{left:10%; top:30%; width:58%; transform:rotate(8deg)}
  .mobile .arm2{left:38%; top:49%; width:44%; transform:rotate(-10deg)}
  .mobile .arm3{left:8%; top:65%; width:48%; transform:rotate(6deg)}
  .mobile .disc,
  .mobile .oval,
  .mobile .dot{
    position:absolute;
    border-radius:50%;
  }
  .mobile .disc{left:56%; top:19%; width:19%; height:19%; background:var(--mustard)}
  .mobile .oval{left:75%; top:41%; width:18%; height:13%; background:var(--teal); border-radius:50% / 40%}
  .mobile .dot{left:49%; top:58%; width:14%; height:14%; background:var(--rust)}

  .stairs{
    position:absolute;
    left:50%;
    bottom:0;
    width:82%;
    height:19%;
    transform:translateX(-50%);
    z-index:1;
    opacity:.44;
  }
  .step{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    height:16%;
    border-radius:18px 18px 0 0;
    background:rgba(255,255,255,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
  }

  .date{
    position:absolute;
    right:18px;
    bottom:14px;
    z-index:20;
    font-size:14px;
    letter-spacing:.18em;
    color:rgba(47,36,29,.46);
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:15px;
    bottom:356px;
    opacity:.58;
    z-index:6;
    transform:rotate(-7deg);
    filter:sepia(.2) saturate(.75) hue-rotate(-12deg) brightness(.88);
  }

  @keyframes sunPulse{
    0%,100%{transform:translateX(-50%) scale(1)}
    50%{transform:translateX(-50%) scale(1.04)}
  }
  @keyframes ringDrift{
    0%,100%{transform:scale(1.02) rotate(0deg)}
    50%{transform:scale(1.08) rotate(10deg)}
  }
  @keyframes slowSpin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
  }
  @keyframes archBreath{
    0%,100%{transform:translateX(-50%) scale(1)}
    50%{transform:translateX(-50%) scale(1.02,1.015)}
  }
  @keyframes imageFloat{
    0%,100%{transform:translateY(0px) scale(1.03)}
    50%{transform:translateY(-10px) scale(1.045)}
  }
  @keyframes bandSlide{
    0%,100%{transform:rotate(-10deg) translateX(-2%)}
    50%{transform:rotate(-7deg) translateX(2%)}
  }
  @keyframes bandSlide2{
    0%,100%{transform:rotate(18deg) translateX(1%)}
    50%{transform:rotate(14deg) translateX(-2%)}
  }
  @keyframes groundShift{
    0%,100%{transform:translateX(-50%) scaleX(1)}
    50%{transform:translateX(-50%) scaleX(1.04)}
  }
  @keyframes blobMorphA{
    0%,100%{transform:translateY(0) scale(1); border-radius:50% 50% 44% 56% / 60% 42% 58% 40%}
    50%{transform:translateY(-8px) scale(1.03); border-radius:58% 42% 48% 52% / 46% 56% 44% 54%}
  }
  @keyframes blobMorphB{
    0%,100%{transform:translateY(0) scale(1); border-radius:56% 44% 52% 48% / 42% 58% 40% 60%}
    50%{transform:translateY(6px) scale(1.025); border-radius:48% 52% 44% 56% / 58% 42% 60% 40%}
  }
  @keyframes blobMorphC{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-5px) scale(1.04)}
  }
  @keyframes mobileSway{
    0%,100%{transform:rotate(-2deg)}
    50%{transform:rotate(2.5deg)}
  }
</style>
</head>
<body>
  <div id="frame">
    <canvas id="paperGrain"></canvas>
    <canvas id="haloCanvas"></canvas>

    <div class="sun"></div>

    <div class="rayField" id="rayField"></div>

    <div class="arch"></div>

    <div id="artWrap">
      <img id="art-image" src="img/art.045b14d9.png" alt="">
      <div class="imageBand"></div>
      <div class="imageBand2"></div>
    </div>

    <div class="mobile" aria-hidden="true">
      <div class="wire"></div>
      <div class="arm1"></div>
      <div class="arm2"></div>
      <div class="arm3"></div>
      <div class="disc"></div>
      <div class="oval"></div>
      <div class="dot"></div>
    </div>

    <div class="column left"></div>
    <div class="column mid"></div>
    <div class="column right"></div>

    <div class="pedestal"></div>
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>
    <div class="groundArc"></div>

    <div class="stairs" id="stairs"></div>

    <svg id="overlaySvg" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="tealFade" x1="0" x2="1">
          <stop offset="0%" stop-color="rgba(77,138,135,0)" />
          <stop offset="50%" stop-color="#4d8a87" stop-opacity=".18" />
          <stop offset="100%" stop-color="rgba(77,138,135,0)" />
        </linearGradient>
        <linearGradient id="rustFade" x1="0" x2="1">
          <stop offset="0%" stop-color="rgba(182,90,50,0)" />
          <stop offset="50%" stop-color="#b65a32" stop-opacity=".16" />
          <stop offset="100%" stop-color="rgba(182,90,50,0)" />
        </linearGradient>
      </defs>
      <g opacity=".7">
        <path d="M120 1240 C300 1160, 460 1180, 620 1300 S950 1450, 1040 1360" fill="none" stroke="url(#tealFade)" stroke-width="42" stroke-linecap="round"/>
        <path d="M40 1480 C230 1380, 430 1420, 640 1560 S930 1690, 1040 1600" fill="none" stroke="url(#rustFade)" stroke-width="54" stroke-linecap="round"/>
      </g>
      <g opacity=".22">
        <ellipse cx="540" cy="340" rx="300" ry="160" fill="none" stroke="#245a5a" stroke-width="10"/>
        <ellipse cx="540" cy="340" rx="370" ry="210" fill="none" stroke="#c89b2d" stroke-width="5"/>
      </g>
    </svg>

    <img id="guinea-pig" src="img/guineapig.045b14d9.png" alt="">

    <div class="date">2026-04-01</div>
  </div>

<script>
(() => {
  const seedStr = "2026-04-01";
  function xmur3(str){for(var i=0,h=1779033703^str.length;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),3432918353),h=h<<13|h>>>19;return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^h>>>16)>>>0}}
  function sfc32(a,b,c,d){return function(){a|=0;b|=0;c|=0;d|=0;var t=(a+b|0)+d|0;d=d+1|0;a=b^b>>>9;b=c+(c<<3)|0;c=c<<21|c>>>11;c=c+t|0;return (t>>>0)/4294967296}}
  const seed = xmur3(seedStr);
  const rand = sfc32(seed(), seed(), seed(), seed());

  const rayField = document.getElementById('rayField');
  const rayCount = 18;
  for(let i=0;i<rayCount;i++){
    const r = document.createElement('div');
    r.className = 'ray';
    const angle = (360/rayCount)*i + (rand()*8-4);
    const h = 21 + rand()*12;
    const w = 1.4 + rand()*2.4;
    r.style.height = h + '%';
    r.style.width = w + '%';
    r.style.transform = `translateX(-50%) rotate(${angle}deg)`;
    r.style.opacity = 0.18 + rand()*0.36;
    rayField.appendChild(r);
  }

  const stairs = document.getElementById('stairs');
  for(let i=0;i<6;i++){
    const s = document.createElement('div');
    s.className = 'step';
    s.style.width = (18 + i*11) + '%';
    s.style.bottom = (i*12) + '%';
    s.style.opacity = (0.13 + i*0.04).toFixed(2);
    stairs.appendChild(s);
  }

  const grain = document.getElementById('paperGrain');
  const gctx = grain.getContext('2d');
  function resizeGrain(){
    const r = grain.getBoundingClientRect();
    grain.width = Math.max(1, Math.floor(r.width/2));
    grain.height = Math.max(1, Math.floor(r.height/2));
    const img = gctx.createImageData(grain.width, grain.height);
    for(let i=0;i<img.data.length;i+=4){
      const v = 210 + Math.floor(rand()*45);
      img.data[i] = v;
      img.data[i+1] = v-6;
      img.data[i+2] = v-16;
      img.data[i+3] = 28 + Math.floor(rand()*24);
    }
    gctx.putImageData(img,0,0);
  }
  resizeGrain();

  const halo = document.getElementById('haloCanvas');
  const hctx = halo.getContext('2d');
  let w=0,h=0,t=0;
  function resizeHalo(){
    const r = halo.getBoundingClientRect();
    w = halo.width = Math.floor(r.width);
    h = halo.height = Math.floor(r.height);
  }
  resizeHalo();
  addEventListener('resize', ()=>{resizeGrain(); resizeHalo();});

  const palette = [
    [200,155,45,0.10],
    [77,138,135,0.09],
    [182,90,50,0.08],
    [244,234,214,0.10]
  ];
  const halos = Array.from({length:7}, (_,i)=>({
    x: w*(0.2 + rand()*0.6),
    y: h*(0.15 + rand()*0.7),
    r: 80 + rand()*220,
    dx: (rand()-.5)*0.06,
    dy: (rand()-.5)*0.06,
    c: palette[i%palette.length]
  }));

  function draw(ts){
    t = ts*0.001;
    hctx.clearRect(0,0,w,h);
    for(const p of halos){
      p.x += p.dx;
      p.y += p.dy;
      if(p.x < -100) p.x = w+100;
      if(p.x > w+100) p.x = -100;
      if(p.y < -100) p.y = h+100;
      if(p.y > h+100) p.y = -100;
      const pulse = 1 + Math.sin(t*0.25 + p.r)*0.06;
      const rad = p.r*pulse;
      const grad = hctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);
      grad.addColorStop(0, `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${p.c[3]})`);
      grad.addColorStop(0.65, `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${p.c[3]*0.35})`);
      grad.addColorStop(1, `rgba(${p.c[0]},${p.c[1]},${p.c[2]},0)`);
      hctx.fillStyle = grad;
      hctx.beginPath();
      hctx.arc(p.x,p.y,rad,0,Math.PI*2);
      hctx.fill();
    }

    hctx.globalAlpha = 0.16;
    for(let i=0;i<10;i++){
      const yy = h*(0.08 + i*0.085) + Math.sin(t*0.18 + i)*4;
      hctx.fillStyle = i%2 ? 'rgba(255,255,255,.07)' : 'rgba(68,54,45,.04)';
      hctx.fillRect(0, yy, w, 2);
    }
    hctx.globalAlpha = 1;

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
