<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026-04-09</title>
<style>
  :root{
    --bg:#020403;
    --ink:#050706;
    --ink2:#0b120d;
    --matrix:#00ff41;
    --matrix-dim:#0c6b29;
    --blossom:#ffd8e8;
    --blossom2:#fff6fb;
    --rose:#f7b5cb;
    --paper:#ece8de;
    --branch:#17110e;
    --branch-hi:#33211a;
    --gold:#9cc9ab;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    background:#000;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family: "Courier New", monospace;
  }
  body{
    display:grid;
    place-items:center;
  }
  #stage{
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(1200px 900px at 18% 22%, rgba(31,46,35,0.28), transparent 56%),
      radial-gradient(900px 1200px at 80% 78%, rgba(8,28,15,0.45), transparent 60%),
      radial-gradient(700px 500px at 56% 18%, rgba(18,22,19,0.2), transparent 70%),
      linear-gradient(180deg, #030504 0%, #020302 28%, #060907 52%, #010201 100%);
    box-shadow:0 0 60px rgba(0,0,0,0.75), inset 0 0 180px rgba(0,0,0,0.55);
  }

  canvas, svg, img, .layer, .overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  #washCanvas{ opacity:.9; }
  #mazeCanvas{ opacity:.98; mix-blend-mode:screen; }
  #codeCanvas{ opacity:.82; }
  #petalCanvas{ opacity:.95; }

  #portrait-image{
    position:absolute;
    right:-4%;
    bottom:10%;
    width:44%;
    height:auto;
    object-fit:cover;
    opacity:.33;
    filter: grayscale(1) contrast(1.22) brightness(.8) sepia(.2) hue-rotate(85deg) saturate(.8) blur(.2px);
    mix-blend-mode:screen;
    transform: scale(1.06) translateY(0);
    clip-path: ellipse(41% 47% at 52% 48%);
    animation: portraitBreath 24s ease-in-out infinite;
    pointer-events:none;
  }

  @keyframes portraitBreath{
    0%,100%{ transform:scale(1.06) translateY(0px) rotate(-1deg); opacity:.31; }
    50%{ transform:scale(1.09) translateY(-10px) rotate(1deg); opacity:.38; }
  }

  #ornament{
    opacity:.22;
    mix-blend-mode:screen;
  }

  .mist{
    position:absolute;
    inset:auto;
    border-radius:50%;
    filter:blur(36px);
    pointer-events:none;
    mix-blend-mode:screen;
  }
  .mist.a{
    width:48%;
    height:12%;
    left:6%;
    top:14%;
    background:radial-gradient(circle, rgba(180,190,180,.18), rgba(80,110,88,.06) 42%, transparent 72%);
    animation: driftA 26s ease-in-out infinite;
  }
  .mist.b{
    width:52%;
    height:18%;
    right:0%;
    top:34%;
    background:radial-gradient(circle, rgba(44,88,52,.12), rgba(15,40,20,.05) 42%, transparent 72%);
    animation: driftB 32s ease-in-out infinite;
  }
  .mist.c{
    width:58%;
    height:16%;
    left:18%;
    bottom:9%;
    background:radial-gradient(circle, rgba(30,120,54,.1), rgba(9,28,15,.04) 50%, transparent 75%);
    animation: driftC 29s ease-in-out infinite;
  }
  @keyframes driftA{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(20px,-16px) scale(1.08)}
  }
  @keyframes driftB{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(-26px,18px) scale(1.1)}
  }
  @keyframes driftC{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(10px,-24px) scale(1.05)}
  }

  #date{
    position:absolute;
    right:16px;
    bottom:12px;
    color:rgba(215,255,226,.45);
    font-size:12px;
    letter-spacing:1.6px;
    z-index:20;
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    width:17px;
    height:auto;
    left:9px;
    bottom:142px;
    opacity:.58;
    filter: hue-rotate(80deg) saturate(.6) brightness(.84);
    transform:rotate(-8deg);
    z-index:8;
    pointer-events:none;
  }

  .vignette{
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 50% 45%, transparent 42%, rgba(0,0,0,0.14) 65%, rgba(0,0,0,0.48) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.20), transparent 18%, transparent 82%, rgba(0,0,0,0.28));
    pointer-events:none;
  }

  .grain{
    position:absolute;
    inset:-20%;
    opacity:.065;
    background-image:
      radial-gradient(circle at 20% 30%, #fff 0.7px, transparent 1px),
      radial-gradient(circle at 80% 70%, #fff 0.7px, transparent 1px),
      radial-gradient(circle at 60% 20%, #fff 0.6px, transparent 1px),
      radial-gradient(circle at 30% 80%, #fff 0.8px, transparent 1px);
    background-size: 18px 18px, 23px 23px, 29px 29px, 31px 31px;
    mix-blend-mode:screen;
    animation: grainShift 10s steps(6) infinite;
    pointer-events:none;
  }
  @keyframes grainShift{
    0%{transform:translate(0,0)}
    25%{transform:translate(-1%,-1%)}
    50%{transform:translate(1%,0.5%)}
    75%{transform:translate(-0.5%,1%)}
    100%{transform:translate(0,0)}
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="washCanvas" width="1080" height="1920"></canvas>
    <svg id="ornament" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#d7ffde" stop-opacity=".12"/>
          <stop offset="45%" stop-color="#00ff41" stop-opacity=".05"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M120 230 C 260 190, 360 260, 510 220 S 820 160, 980 240" fill="none" stroke="url(#g1)" stroke-width="4"/>
      <path d="M140 248 C 310 230, 390 310, 545 270 S 830 210, 950 275" fill="none" stroke="url(#g1)" stroke-width="2"/>
      <g stroke="#b9ffd0" stroke-opacity=".13" fill="none">
        <path d="M850 1280 q40 35 10 70 q-26 28 -60 8 q-30 -16 -32 -48 q-3 -34 28 -56 q33 -20 54 3z" stroke-width="2"/>
        <path d="M280 1580 q30 28 4 62 q-20 22 -49 8 q-28 -12 -29 -42 q-1 -31 22 -52 q26 -21 52 0z" stroke-width="2"/>
      </g>
    </svg>

    <div class="mist a"></div>
    <div class="mist b"></div>
    <div class="mist c"></div>

    <img id="portrait-image" src="img/portrait.d2709125.png" alt="" />
    <canvas id="mazeCanvas" width="1080" height="1920"></canvas>
    <canvas id="codeCanvas" width="1080" height="1920"></canvas>
    <canvas id="petalCanvas" width="1080" height="1920"></canvas>

    <img id="guinea-pig" src="img/guineapig.d2709125.png" alt="" />
    <div class="grain"></div>
    <div class="vignette"></div>
    <div id="date">2026-04-09</div>
  </div>

<script>
(() => {
  const seedStr = "2026-04-09";
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = (seed * 131 + seedStr.charCodeAt(i)) >>> 0;
  function rand() {
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >>> 17; seed >>>= 0;
    seed ^= seed << 5; seed >>>= 0;
    return (seed >>> 0) / 4294967296;
  }
  function r(min, max){ return min + rand() * (max - min); }
  function pick(arr){ return arr[(rand() * arr.length) | 0]; }

  const W = 1080, H = 1920;

  const washCanvas = document.getElementById('washCanvas');
  const wash = washCanvas.getContext('2d');

  const mazeCanvas = document.getElementById('mazeCanvas');
  const mctx = mazeCanvas.getContext('2d');

  const codeCanvas = document.getElementById('codeCanvas');
  const cctx = codeCanvas.getContext('2d');

  const petalCanvas = document.getElementById('petalCanvas');
  const pctx = petalCanvas.getContext('2d');

  function drawWashBackground(){
    wash.clearRect(0,0,W,H);

    const g = wash.createLinearGradient(0,0,0,H);
    g.addColorStop(0, "#030403");
    g.addColorStop(0.35, "#08100b");
    g.addColorStop(0.7, "#020402");
    g.addColorStop(1, "#010201");
    wash.fillStyle = g;
    wash.fillRect(0,0,W,H);

    for(let i=0;i<18;i++){
      const x = r(-100, W+100), y = r(-60, H+60);
      const rx = r(180, 520), ry = r(80, 240);
      const grad = wash.createRadialGradient(x,y,10,x,y,rx);
      const alpha = r(0.03,0.12);
      const hueGreen = rand() > 0.55;
      grad.addColorStop(0, hueGreen ? `rgba(10,70,24,${alpha})` : `rgba(255,255,255,${alpha*0.38})`);
      grad.addColorStop(0.5, hueGreen ? `rgba(8,30,15,${alpha*0.38})` : `rgba(80,88,80,${alpha*0.16})`);
      grad.addColorStop(1, "rgba(0,0,0,0)");
      wash.fillStyle = grad;
      wash.beginPath();
      wash.ellipse(x,y,rx,ry,r(-1,1),0,Math.PI*2);
      wash.fill();
    }

    wash.save();
    wash.globalAlpha = 0.16;
    for(let i=0;i<140;i++){
      wash.strokeStyle = `rgba(${20 + (rand()*30|0)},${20 + (rand()*40|0)},${20 + (rand()*24|0)},${r(0.02,0.09)})`;
      wash.lineWidth = r(1,4);
      wash.beginPath();
      const sx = r(0,W), sy = r(0,H);
      wash.moveTo(sx, sy);
      wash.bezierCurveTo(
        sx+r(-80,80), sy+r(-40,40),
        sx+r(-80,80), sy+r(-40,40),
        sx+r(-20,20), sy+r(-20,20)
      );
      wash.stroke();
    }
    wash.restore();
  }

  drawWashBackground();

  const branchPoints = [];
  function buildBranch(){
    branchPoints.length = 0;
    let x = -80, y = 390 + r(-40, 30);
    branchPoints.push({x,y,w:30});
    for(let i=0;i<13;i++){
      x += r(65,110);
      y += r(-55, 35) + Math.sin(i*0.6)*8;
      branchPoints.push({x,y,w: Math.max(9, 30 - i*1.6)});
    }
  }
  buildBranch();

  function drawInkBranch(ctx, t){
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    for(let pass=0; pass<2; pass++){
      ctx.beginPath();
      ctx.moveTo(branchPoints[0].x, branchPoints[0].y);
      for(let i=1;i<branchPoints.length;i++){
        const p = branchPoints[i];
        const prev = branchPoints[i-1];
        const cx = (prev.x + p.x) / 2;
        const cy = (prev.y + p.y) / 2 + Math.sin(t*0.0002 + i)*4;
        ctx.quadraticCurveTo(prev.x, prev.y, cx, cy);
      }
      ctx.strokeStyle = pass===0 ? "rgba(10,8,7,0.95)" : "rgba(54,34,26,0.32)";
      ctx.lineWidth = pass===0 ? 28 : 10;
      ctx.stroke();
    }

    const twigs = [
      {idx:2,len:200,ang:-1.1},
      {idx:3,len:140,ang:0.92},
      {idx:5,len:170,ang:-0.8},
      {idx:6,len:130,ang:0.85},
      {idx:8,len:160,ang:-1.0},
      {idx:10,len:120,ang:0.75},
      {idx:11,len:90,ang:-0.95}
    ];

    twigs.forEach((tw, k)=>{
      const p = branchPoints[tw.idx];
      const angle = tw.ang + Math.sin(t*0.00015 + k)*0.05;
      const x2 = p.x + Math.cos(angle) * tw.len;
      const y2 = p.y + Math.sin(angle) * tw.len;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      const mx = (p.x+x2)/2 + Math.sin(k*2.1)*18;
      const my = (p.y+y2)/2 + Math.cos(k*1.7)*20;
      ctx.quadraticCurveTo(mx, my, x2, y2);
      ctx.strokeStyle = "rgba(12,10,8,0.96)";
      ctx.lineWidth = Math.max(4, p.w*0.34);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(p.x+4, p.y-2);
      ctx.quadraticCurveTo(mx+10, my-6, x2+6, y2-4);
      ctx.strokeStyle = "rgba(68,42,28,0.24)";
      ctx.lineWidth = Math.max(1.5, p.w*0.12);
      ctx.stroke();
    });

    ctx.restore();
  }

  const blossomAnchors = [];
  function setupBlossoms(){
    const twigTips = [
      [branchPoints[2].x+90, branchPoints[2].y-170],
      [branchPoints[3].x+84, branchPoints[3].y+118],
      [branchPoints[5].x+122, branchPoints[5].y-122],
      [branchPoints[6].x+92, branchPoints[6].y+98],
      [branchPoints[8].x+112, branchPoints[8].y-132],
      [branchPoints[10].x+84, branchPoints[10].y+84],
      [branchPoints[11].x+60, branchPoints[11].y-72],
      [branchPoints[7].x-10, branchPoints[7].y-18],
      [branchPoints[9].x+6, branchPoints[9].y+14]
    ];
    blossomAnchors.length = 0;
    twigTips.forEach((tip, i)=>{
      const n = 4 + (rand()*5|0);
      for(let j=0;j<n;j++){
        blossomAnchors.push({
          x: tip[0] + r(-34,34),
          y: tip[1] + r(-34,34),
          s: r(12,24),
          rot: r(0,Math.PI*2),
          pulse: r(0,Math.PI*2),
          cluster:i
        });
      }
    });
  }
  setupBlossoms();

  function drawBlossom(ctx, x, y, s, rot, glow=1){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.globalCompositeOperation = "source-over";

    const halo = ctx.createRadialGradient(0,0,2,0,0,s*1.6);
    halo.addColorStop(0, `rgba(255,240,248,${0.12*glow})`);
    halo.addColorStop(0.55, `rgba(255,185,210,${0.08*glow})`);
    halo.addColorStop(1, `rgba(255,180,220,0)`);
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0,0,s*1.5,0,Math.PI*2);
    ctx.fill();

    for(let i=0;i<5;i++){
      ctx.save();
      ctx.rotate(i * Math.PI * 2 / 5);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.ellipse(0, -s*0.56, s*0.44, s*0.72, 0, 0, Math.PI*2);
      const pg = ctx.createLinearGradient(0,-s*1.2,0,0);
      pg.addColorStop(0,"rgba(255,247,252,0.98)");
      pg.addColorStop(0.65,"rgba(255,213,230,0.92)");
      pg.addColorStop(1,"rgba(246,164,197,0.88)");
      ctx.fillStyle = pg;
      ctx.fill();
      ctx.restore();
    }

    ctx.fillStyle = "rgba(97,62,24,0.95)";
    ctx.beginPath();
    ctx.arc(0,0,s*0.18,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.lineWidth = 1;
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.moveTo(0,0);
      const a = rot + i*Math.PI*2/5;
      ctx.lineTo(Math.cos(a)*s*0.35, Math.sin(a)*s*0.35);
      ctx.stroke();
    }
    ctx.restore();
  }

  const petalStreams = [];
  function spawnPetalStreams(){
    petalStreams.length = 0;
    for(let i=0;i<blossomAnchors.length;i++){
      if(rand() < 0.72){
        const b = blossomAnchors[i];
        petalStreams.push({
          x:b.x + r(-4,4),
          y:b.y + r(-4,4),
          startX:b.x,
          startY:b.y,
          delay:r(0,1),
          speed:r(0.55,1.15),
          sway:r(14,42),
          phase:r(0,Math.PI*2),
          len:140 + (rand()*420|0),
          petalSize:r(7,14),
          char: pick("01アイウエオカキクケコサシスセソタチツテトナニヌネノ".split("")),
          splitAt:r(0.18,0.42)
        });
      }
    }
  }
  spawnPetalStreams();

  const codeCols = [];
  function setupCodeRain(){
    const step = 28;
    for(let x=0; x<W+step; x+=step){
      codeCols.push({
        x: x + r(-6,6),
        y: r(-H, 0),
        speed: r(38, 74),
        len: 6 + (rand()*18|0),
        alpha: r(0.18,0.42)
      });
    }
  }
  setupCodeRain();

  const maze = {
    cols: 18,
    rows: 28,
    cell: 48,
    ox: 108,
    oy: 520,
    grid: [],
    stack: [],
    solverPath: [],
    visitOrder: [],
    generated: false,
    solved: false,
    carveTimer: 0,
    solveTimer: 0,
    current: null,
    solveIndex: 0
  };

  function initMaze(){
    seed = (Date.now() * 9301 + 49297) >>> 0;
    maze.grid = [];
    maze.stack = [];
    maze.visitOrder = [];
    maze.solverPath = [];
    maze.generated = false;
    maze.solved = false;
    maze.solveIndex = 0;
    for(let y=0;y<maze.rows;y++){
      for(let x=0;x<maze.cols;x++){
        maze.grid.push({
          x,y,
          walls:[1,1,1,1],
          visited:false,
          parent:null,
          inPath:false
        });
      }
    }
    maze.current = maze.grid[0];
    maze.current.visited = true;
    maze.visitOrder.push(maze.current);
  }
  initMaze();

  function cellAt(x,y){
    if(x<0||y<0||x>=maze.cols||y>=maze.rows) return null;
    return maze.grid[y*maze.cols + x];
  }

  function unvisitedNeighbors(c){
    const dirs = [
      [0,-1,0,2],
      [1,0,1,3],
      [0,1,2,0],
      [-1,0,3,1]
    ];
    const out = [];
    for(const d of dirs){
      const n = cellAt(c.x+d[0], c.y+d[1]);
      if(n && !n.visited) out.push({cell:n, wall:d[2], opp:d[3]});
    }
    return out;
  }

  function carveStep(){
    if(maze.generated) return;
    const c = maze.current;
    const ns = unvisitedNeighbors(c);
    if(ns.length){
      const n = pick(ns);
      c.walls[n.wall] = 0;
      n.cell.walls[n.opp] = 0;
      maze.stack.push(c);
      n.cell.visited = true;
      n.cell.parent = c;
      maze.current = n.cell;
      maze.visitOrder.push(n.cell);
    } else if(maze.stack.length){
      maze.current = maze.stack.pop();
    } else {
      maze.generated = true;
      computeSolver();
    }
  }

  function computeSolver(){
    const start = cellAt(0,0);
    const end = cellAt(maze.cols-1, maze.rows-1);
    const q = [start];
    const seen = new Set([start]);
    const prev = new Map();
    while(q.length){
      const c = q.shift();
      if(c === end) break;
      const dirs = [
        [0,-1,0],
        [1,0,1],
        [0,1,2],
        [-1,0,3]
      ];
      for(const [dx,dy,wi] of dirs){
        if(c.walls[wi]) continue;
        const n = cellAt(c.x+dx, c.y+dy);
        if(n && !seen.has(n)){
          seen.add(n);
          prev.set(n,c);
          q.push(n);
        }
      }
    }
    const path = [];
    let cur = end;
    while(cur){
      path.push(cur);
      cur = prev.get(cur);
    }
    path.reverse();
    maze.solverPath = path;
  }

  function solverStep(){
    if(!maze.generated || maze.solved) return;
    if(maze.solveIndex < maze.solverPath.length){
      maze.solverPath[maze.solveIndex].inPath = true;
      maze.solveIndex++;
    } else {
      maze.solved = true;
    }
  }

  function drawMaze(time){
    mctx.clearRect(0,0,W,H);

    drawInkBranch(mctx, time);

    mctx.save();
    mctx.translate(maze.ox, maze.oy);

    mctx.strokeStyle = "rgba(0,255,65,0.72)";
    mctx.lineWidth = 3;
    mctx.shadowColor = "rgba(0,255,65,0.24)";
    mctx.shadowBlur = 8;

    const reveal = Math.min(maze.visitOrder.length, maze.generated ? maze.grid.length : maze.visitOrder.length);
    for(let i=0;i<reveal;i++){
      const c = maze.visitOrder[i];
      const x = c.x * maze.cell;
      const y = c.y * maze.cell;

      const glow = 0.03 + 0.04*Math.sin(time*0.003 + i*0.2);
      mctx.fillStyle = `rgba(0,255,65,${0.035 + glow})`;
      mctx.fillRect(x+6, y+6, maze.cell-12, maze.cell-12);

      if(c.walls[0]){ mctx.beginPath(); mctx.moveTo(x,y); mctx.lineTo(x+maze.cell,y); mctx.stroke(); }
      if(c.walls[1]){ mctx.beginPath(); mctx.moveTo(x+maze.cell,y); mctx.lineTo(x+maze.cell,y+maze.cell); mctx.stroke(); }
      if(c.walls[2]){ mctx.beginPath(); mctx.moveTo(x+maze.cell,y+maze.cell); mctx.lineTo(x,y+maze.cell); mctx.stroke(); }
      if(c.walls[3]){ mctx.beginPath(); mctx.moveTo(x,y+maze.cell); mctx.lineTo(x,y); mctx.stroke(); }
    }

    if(maze.current && !maze.generated){
      const x = maze.current.x * maze.cell + maze.cell/2;
      const y = maze.current.y * maze.cell + maze.cell/2;
      const rg = mctx.createRadialGradient(x,y,2,x,y,28);
      rg.addColorStop(0,"rgba(255,244,250,0.85)");
      rg.addColorStop(0.4,"rgba(255,200,230,0.45)");
      rg.addColorStop(1,"rgba(255,180,220,0)");
      mctx.fillStyle = rg;
      mctx.beginPath(); mctx.arc(x,y,26,0,Math.PI*2); mctx.fill();

      drawBlossom(mctx, x, y, 15 + 2*Math.sin(time*0.004), time*0.0013, 1.1);
    }

    mctx.lineWidth = 8;
    mctx.strokeStyle = "rgba(255,230,241,0.82)";
    mctx.shadowColor = "rgba(255,205,226,0.34)";
    mctx.shadowBlur = 16;
    mctx.beginPath();
    let started = false;
    for(let i=0;i<maze.solveIndex;i++){
      const c = maze.solverPath[i];
      const px = c.x * maze.cell + maze.cell/2;
      const py = c.y * maze.cell + maze.cell/2;
      if(!started){ mctx.moveTo(px,py); started = true; }
      else mctx.lineTo(px,py);
    }
    mctx.stroke();

    if(maze.generated && maze.solveIndex > 0){
      const c = maze.solverPath[Math.min(maze.solveIndex-1, maze.solverPath.length-1)];
      const px = c.x * maze.cell + maze.cell/2;
      const py = c.y * maze.cell + maze.cell/2;
      drawBlossom(mctx, px, py, 18, time*0.0017, 1.25);
    }

    mctx.restore();

    blossomAnchors.forEach((b,i)=>{
      drawBlossom(
        mctx,
        b.x + Math.sin(time*0.0007 + b.pulse)*1.8,
        b.y + Math.cos(time*0.0008 + b.pulse)*1.4,
        b.s,
        b.rot + Math.sin(time*0.0005 + i)*0.1,
        .95
      );
    });

    mctx.save();
    mctx.globalCompositeOperation = "screen";
    for(let i=0;i<blossomAnchors.length;i++){
      const b = blossomAnchors[i];
      mctx.strokeStyle = `rgba(190,255,210,${0.05 + 0.04*Math.sin(time*0.001+i)})`;
      mctx.lineWidth = 1;
      mctx.beginPath();
      mctx.moveTo(b.x, b.y);
      mctx.lineTo(b.x + Math.sin(i)*10, b.y + 24 + (i%3)*7);
      mctx.stroke();
    }
    mctx.restore();
  }

  function drawCodeRain(time){
    cctx.clearRect(0,0,W,H);
    cctx.save();
    cctx.font = "22px monospace";
    cctx.textAlign = "center";
    cctx.textBaseline = "middle";

    for(const col of codeCols){
      const yBase = (col.y + (time*0.03*col.speed)) % (H + 520) - 260;
      for(let i=0;i<col.len;i++){
        const y = yBase - i*24;
        if(y < -40 || y > H+40) continue;
        const a = col.alpha * (1 - i/col.len);
        cctx.fillStyle = i===0 ? `rgba(214,255,224,${a*0.95})` : `rgba(0,255,65,${a})`;
        cctx.fillText(pick(["0","1","ア","カ","サ","タ","ナ","ホ","マ","ヤ","ラ"]), col.x, y);
      }
    }

    cctx.restore();
  }

  function drawPetalCode(time){
    pctx.clearRect(0,0,W,H);

    petalStreams.forEach((ps, i)=>{
      const local = (time*0.00018*ps.speed + ps.delay) % 1;
      const fallY = ps.startY + local * ps.len * 2.4;
      const driftX = ps.startX + Math.sin(local*7 + ps.phase) * ps.sway + local*18;

      if(local < ps.splitAt){
        const phase = local / ps.splitAt;
        drawBlossom(
          pctx,
          driftX,
          fallY,
          ps.petalSize * (1 - phase*0.28),
          ps.phase + phase,
          .65
        );
      } else {
        const phase = (local - ps.splitAt) / (1 - ps.splitAt);
        pctx.save();
        pctx.font = `${16 + ps.petalSize*0.65}px monospace`;
        pctx.textAlign = "center";
        pctx.textBaseline = "middle";
        for(let k=0;k<5;k++){
          const yy = fallY + k*18;
          const xx = driftX + Math.sin(phase*10 + k + ps.phase)*5;
          const alpha = Math.max(0, 0.9 - k*0.16 - phase*0.35);
          pctx.fillStyle = k===0
            ? `rgba(215,255,225,${alpha})`
            : `rgba(0,255,65,${alpha*0.9})`;
          pctx.fillText(k===0 ? ps.char : pick(["0","1","ヌ","ネ","ノ","コ","ト","+" ]), xx, yy);
        }
        pctx.restore();

        pctx.strokeStyle = `rgba(0,255,65,${0.15*(1-phase)})`;
        pctx.lineWidth = 1.2;
        pctx.beginPath();
        pctx.moveTo(ps.startX, ps.startY);
        pctx.lineTo(driftX, fallY);
        pctx.stroke();
      }
    });
  }

  let last = 0;
  function animate(ts){
    if(ts - last > 34) last = ts;
    for(let i=0;i<4;i++) carveStep();
    if(maze.generated && (ts % 28 < 16)) solverStep();

    drawMaze(ts);
    drawCodeRain(ts*0.65);
    drawPetalCode(ts);

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  // Restart the maze animation every 2 minutes
  setInterval(function(){ initMaze(); }, 120000);
})();
</script>
