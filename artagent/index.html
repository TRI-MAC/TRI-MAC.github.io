<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026-04-09</title>
<style>
  :root{
    --bg:#000000;
    --ink:#050505;
    --paper:#f4f7f2;
    --green:#00FF41;
    --green-dim:#0c4f1f;
    --green-soft:#67ff91;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#050505;
    overflow:hidden;
    font-family: "Courier New", monospace;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    aspect-ratio:9 / 16;
    background:#000;
    overflow:hidden;
  }

  /* Pure field layers */
  .field, .wash, .fog, .grain, .vignette, .codeGlow, #glyphCanvas, #inkCanvas, svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  .field{
    background:
      radial-gradient(120% 80% at 50% 34%, rgba(0,255,65,0.055), transparent 52%),
      radial-gradient(90% 75% at 48% 66%, rgba(255,255,255,0.028), transparent 45%),
      linear-gradient(180deg, #000 0%, #020302 20%, #021006 46%, #000 100%);
    filter: contrast(120%) saturate(110%);
    animation: breatheField 36s ease-in-out infinite alternate;
  }

  .wash{
    mix-blend-mode:screen;
    opacity:.9;
    background:
      radial-gradient(85% 50% at 53% 44%, rgba(255,255,255,0.06), transparent 44%),
      radial-gradient(60% 32% at 50% 48%, rgba(0,255,65,0.08), transparent 45%),
      radial-gradient(120% 85% at 50% 50%, rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.18) 64%, rgba(0,0,0,0.42) 100%);
    filter: blur(18px);
    animation: washShift 42s ease-in-out infinite alternate;
  }

  .fog{
    opacity:.32;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0)),
      radial-gradient(75% 25% at 52% 42%, rgba(255,255,255,0.05), transparent 55%),
      radial-gradient(50% 18% at 50% 55%, rgba(0,255,65,0.06), transparent 60%);
    filter: blur(28px);
    animation: fogDrift 26s ease-in-out infinite alternate;
  }

  .grain{
    opacity:.09;
    background-image:
      repeating-linear-gradient(
        180deg,
        rgba(255,255,255,.08) 0px,
        rgba(255,255,255,.08) 1px,
        transparent 2px,
        transparent 4px
      );
    mix-blend-mode:soft-light;
  }

  .vignette{
    background:
      radial-gradient(130% 95% at 50% 50%, transparent 48%, rgba(0,0,0,0.25) 70%, rgba(0,0,0,0.72) 100%);
  }

  .codeGlow{
    opacity:.16;
    background:
      linear-gradient(180deg, transparent 0%, rgba(0,255,65,0.06) 25%, transparent 55%, rgba(255,255,255,0.03) 100%);
    mix-blend-mode:screen;
    animation: scanPulse 18s linear infinite;
  }

  svg{
    overflow:visible;
  }

  #date{
    position:absolute;
    right:18px;
    bottom:14px;
    color:rgba(220,255,230,0.52);
    font-size:14px;
    letter-spacing:.12em;
    opacity:.6;
    z-index:20;
    text-shadow:0 0 8px rgba(0,255,65,.12);
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    width:17px;
    height:auto;
    left:9px;
    bottom:32px;
    opacity:.56;
    filter:saturate(.85) brightness(.8) contrast(1.05) blur(.15px);
    z-index:6;
  }

  @keyframes breatheField{
    0%{
      transform:scale(1) translateY(0px);
      filter:contrast(120%) saturate(100%) brightness(.92);
    }
    100%{
      transform:scale(1.035) translateY(-10px);
      filter:contrast(132%) saturate(122%) brightness(1.05);
    }
  }

  @keyframes washShift{
    0%{ transform:translateY(0) scale(1) rotate(0deg); opacity:.72; }
    100%{ transform:translateY(-20px) scale(1.04) rotate(-1.1deg); opacity:.95; }
  }

  @keyframes fogDrift{
    0%{ transform:translateY(0px) scale(1); opacity:.22; }
    100%{ transform:translateY(18px) scale(1.08); opacity:.36; }
  }

  @keyframes scanPulse{
    0%{ transform:translateY(-25%); opacity:.08; }
    50%{ opacity:.2; }
    100%{ transform:translateY(25%); opacity:.08; }
  }
</style>
</head>
<body>
  <div id="frame">
    <div class="field"></div>
    <canvas id="inkCanvas" width="1080" height="1920"></canvas>
    <canvas id="glyphCanvas" width="1080" height="1920"></canvas>
    <svg viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="soften">
          <feGaussianBlur stdDeviation="14"/>
        </filter>
        <filter id="glow">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <linearGradient id="fadeStroke" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(255,255,255,0.0)"/>
          <stop offset="20%" stop-color="rgba(255,255,255,0.08)"/>
          <stop offset="50%" stop-color="rgba(0,255,65,0.35)"/>
          <stop offset="100%" stop-color="rgba(0,255,65,0.0)"/>
        </linearGradient>
      </defs>
      <g opacity="0.25" filter="url(#soften)">
        <ellipse cx="545" cy="820" rx="210" ry="320" fill="rgba(255,255,255,0.035)"/>
      </g>
      <g opacity="0.35" filter="url(#glow)">
        <line x1="540" y1="700" x2="540" y2="1160" stroke="url(#fadeStroke)" stroke-width="2"/>
      </g>
    </svg>
    <div class="wash"></div>
    <div class="fog"></div>
    <div class="grain"></div>
    <div class="codeGlow"></div>

    <img id="guinea-pig" src="img/guineapig.6a784387.png" alt=""/>

    <div id="date">2026-04-09</div>
    <div class="vignette"></div>
  </div>

<script>
(() => {
  const dateSeedStr = "2026-04-09";
  function hashString(str){
    let h = 2166136261 >>> 0;
    for(let i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  let seed = hashString(dateSeedStr);
  function rand(){
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >> 17; seed >>>= 0;
    seed ^= seed << 5;  seed >>>= 0;
    return (seed >>> 0) / 4294967296;
  }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  const W = 1080, H = 1920;
  const inkCanvas = document.getElementById('inkCanvas');
  const glyphCanvas = document.getElementById('glyphCanvas');
  const ictx = inkCanvas.getContext('2d');
  const gctx = glyphCanvas.getContext('2d');

  const brush = {
    x0: lerp(410, 500, rand()),
    y0: lerp(430, 560, rand()),
    x1: lerp(670, 740, rand()),
    y1: lerp(840, 980, rand()),
    x2: lerp(360, 500, rand()),
    y2: lerp(1160, 1360, rand()),
    widthA: lerp(210, 290, rand()),
    widthB: lerp(30, 65, rand()),
    tilt: lerp(-0.26, 0.18, rand())
  };

  const cols = [];
  const glyphSets = [
    "アイウエオカキクケコサシスセソタチツテトナニヌネノ",
    "0123456789",
    "ﾊﾐﾑﾒﾓﾜｦﾝ",
    "ﾔﾕﾖﾗﾘﾙﾚﾛ",
    "abcdefghijklmnopqrstuvwxyz",
    "░▒▓|¦!^~<>+=-:*"
  ];
  const allGlyphs = glyphSets.join("");

  const centerBand = 540;
  for(let i=0;i<38;i++){
    const spread = Math.pow(rand(), 1.6);
    const side = rand() < 0.6 ? -1 : 1;
    const x = centerBand + side * lerp(10, 255, spread) + lerp(-12, 12, rand());
    cols.push({
      x,
      y: lerp(560, 1310, rand()),
      speed: lerp(0.8, 2.1, rand()),
      len: Math.floor(lerp(10, 48, rand())),
      size: lerp(13, 23, rand()),
      alpha: lerp(0.14, 0.82, rand()),
      phase: rand() * Math.PI * 2,
      drift: lerp(-0.12, 0.12, rand()),
      jitter: lerp(0.2, 1.5, rand()),
      greenBias: rand()
    });
  }

  function drawBackground(t){
    ictx.clearRect(0,0,W,H);

    const cycle = t * 0.00004;
    const greenPulse = 0.05 + 0.05 * (0.5 + 0.5*Math.sin(cycle*7.2));
    const whitePulse = 0.02 + 0.02 * (0.5 + 0.5*Math.cos(cycle*5.1));

    const grad = ictx.createRadialGradient(
      W*0.52 + Math.sin(cycle*2.2)*30,
      H*0.47 + Math.cos(cycle*1.8)*40,
      40,
      W*0.50,
      H*0.50,
      H*0.7
    );
    grad.addColorStop(0, `rgba(255,255,255,${(0.03 + whitePulse).toFixed(3)})`);
    grad.addColorStop(0.22, `rgba(0,255,65,${(0.05 + greenPulse).toFixed(3)})`);
    grad.addColorStop(0.42, `rgba(5,12,7,0.16)`);
    grad.addColorStop(1, `rgba(0,0,0,0.0)`);
    ictx.fillStyle = grad;
    ictx.fillRect(0,0,W,H);

    const mist = ictx.createLinearGradient(0,0,0,H);
    mist.addColorStop(0, "rgba(255,255,255,0.015)");
    mist.addColorStop(0.28, "rgba(255,255,255,0)");
    mist.addColorStop(0.64, "rgba(0,255,65,0.02)");
    mist.addColorStop(1, "rgba(0,0,0,0.06)");
    ictx.fillStyle = mist;
    ictx.fillRect(0,0,W,H);
  }

  function drawBrushStroke(t){
    const drift = Math.sin(t*0.00011)*24;
    const breathe = 0.96 + 0.05*Math.sin(t*0.00008);
    ictx.save();
    ictx.translate(W*0.5, H*0.52);
    ictx.rotate(brush.tilt + Math.sin(t*0.00009)*0.02);
    ictx.scale(1.0, breathe);
    ictx.translate(-W*0.5, -H*0.52);

    const p0 = {x:brush.x0, y:brush.y0 + drift*0.3};
    const p1 = {x:brush.x1, y:brush.y1 + drift*0.7};
    const p2 = {x:brush.x2, y:brush.y2 + drift};

    for(let layer=0; layer<18; layer++){
      const frac = layer/17;
      const wob = (Math.sin(t*0.00035 + layer*0.6) * 9) + (rand()-0.5)*8;
      ictx.beginPath();
      ictx.moveTo(p0.x + wob*0.6, p0.y - 60*frac);
      ictx.quadraticCurveTo(
        p1.x + wob,
        p1.y + 35*Math.sin(frac*Math.PI),
        p2.x - wob*0.8,
        p2.y + 38*frac
      );
      ictx.strokeStyle = layer < 13
        ? `rgba(4,4,4,${0.11 + (1-frac)*0.07})`
        : `rgba(255,255,255,${0.013 + frac*0.018})`;
      ictx.lineCap = "round";
      ictx.lineJoin = "round";
      ictx.lineWidth = lerp(brush.widthA, brush.widthB, frac) + Math.sin(frac*8+t*0.0002)*5;
      ictx.stroke();
    }

    // Edge bleed / dry brush.
    for(let i=0;i<240;i++){
      const tt = i/239;
      const x = (1-tt)*(1-tt)*p0.x + 2*(1-tt)*tt*p1.x + tt*tt*p2.x;
      const y = (1-tt)*(1-tt)*p0.y + 2*(1-tt)*tt*p1.y + tt*tt*p2.y;
      const w = lerp(brush.widthA*0.42, brush.widthB*0.72, tt);
      const ang = Math.sin(tt*12 + t*0.001 + i)*0.7;
      const count = Math.floor(lerp(2,6,rand()));
      for(let j=0;j<count;j++){
        const rr = w * (0.55 + rand()*0.5);
        const dx = Math.cos(ang + j*1.7) * rr * (0.06 + rand()*0.06);
        const dy = Math.sin(ang + j*1.7) * rr * (0.12 + rand()*0.12);
        const r = lerp(0.8, 4.8, rand()) * (1-tt*0.6);
        ictx.beginPath();
        ictx.arc(x + dx, y + dy, r, 0, Math.PI*2);
        const a = 0.018 + rand()*0.04;
        ictx.fillStyle = rand() < 0.9 ? `rgba(8,8,8,${a})` : `rgba(0,255,65,${a*0.55})`;
        ictx.fill();
      }
    }

    ictx.restore();
  }

  function drawGlyphRain(t){
    gctx.clearRect(0,0,W,H);
    gctx.save();

    // subtle vertical blur by layering offset draws
    for(let pass=0; pass<2; pass++){
      for(let i=0;i<cols.length;i++){
        const c = cols[i];
        const localT = t * c.speed * 0.032 + c.phase*100;
        const flow = (localT * 22) % (H + c.len*c.size*1.35);
        const baseY = flow - c.len*c.size*1.35;
        const x = c.x + Math.sin(t*0.0004 + c.phase)*10 + Math.sin(localT*0.07)*6;
        for(let j=0;j<c.len;j++){
          const y = baseY + j*c.size*1.16;
          if(y < 350 || y > 1560) continue;

          const distToField = Math.abs(x - centerBand);
          const fieldMask = clamp(1 - distToField/290, 0, 1);
          const head = j === c.len-1;
          const tailF = j / c.len;
          const blink = 0.65 + 0.35*Math.sin(localT*0.13 + j*0.7 + c.phase*4);
          const greenA = c.alpha * (0.07 + 0.93*(1-tailF)) * fieldMask * blink;
          if(greenA < 0.02) continue;

          const glyph = allGlyphs[(Math.floor(localT*3 + j*11 + i*7)) % allGlyphs.length];
          const px = x + Math.sin(j*0.33 + t*0.001 + c.phase)*c.jitter + (pass===1?0.6:0);
          const py = y + Math.cos(j*0.21 + t*0.0009)*1.2 + (pass===1?1.4:0);

          gctx.font = `${c.size}px monospace`;
          gctx.textAlign = "center";
          gctx.textBaseline = "middle";

          if(pass===1){
            gctx.fillStyle = `rgba(0,255,65,${greenA*0.13})`;
            gctx.fillText(glyph, px, py);
          } else {
            if(head){
              gctx.fillStyle = `rgba(230,255,238,${0.16 + greenA*0.35})`;
              gctx.fillText(glyph, px, py);
            }
            gctx.fillStyle = c.greenBias > 0.22
              ? `rgba(0,255,65,${greenA*0.62})`
              : `rgba(195,255,214,${greenA*0.42})`;
            gctx.fillText(glyph, px, py);
          }
        }
      }
    }

    // sparse falling trace lines to merge code into wash
    gctx.globalCompositeOperation = "screen";
    for(let i=0;i<10;i++){
      const xx = centerBand + Math.sin(t*0.00015 + i*0.7) * lerp(20,170,(i+1)/10);
      const yy = 520 + ((t*0.04 + i*190) % 920);
      const lg = gctx.createLinearGradient(xx, yy-120, xx, yy+180);
      lg.addColorStop(0, "rgba(255,255,255,0)");
      lg.addColorStop(.3, "rgba(255,255,255,0.045)");
      lg.addColorStop(.55, "rgba(0,255,65,0.2)");
      lg.addColorStop(1, "rgba(0,255,65,0)");
      gctx.strokeStyle = lg;
      gctx.lineWidth = 1.2;
      gctx.beginPath();
      gctx.moveTo(xx, yy-120);
      gctx.lineTo(xx + Math.sin(i+t*0.0003)*12, yy+180);
      gctx.stroke();
    }

    gctx.restore();
  }

  function frame(t){
    drawBackground(t);
    drawBrushStroke(t);
    drawGlyphRain(t);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  // Procedural audio: nearly silent ambient digital-ink drone
  let audioStarted = false;
  function startAudio(){
    if(audioStarted) return;
    audioStarted = true;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      const ctx = new AC();

      const master = ctx.createGain();
      master.gain.value = 0.008;
      master.connect(ctx.destination);

      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      const filt = ctx.createBiquadFilter();
      const noiseGain = ctx.createGain();

      // noise
      const buffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<data.length;i++){
        data[i] = (rand()*2-1) * 0.28;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;

      osc1.type = "sine";
      osc2.type = "triangle";
      osc1.frequency.value = 43.5;
      osc2.frequency.value = 87;

      lfo.type = "sine";
      lfo.frequency.value = 0.031;
      lfoGain.gain.value = 5.5;

      filt.type = "bandpass";
      filt.Q.value = 0.6;
      filt.frequency.value = 410;

      noiseGain.gain.value = 0.0045;

      lfo.connect(lfoGain);
      lfoGain.connect(filt.frequency);

      osc1.connect(filt);
      osc2.connect(filt);
      noise.connect(noiseGain);
      noiseGain.connect(filt);
      filt.connect(master);

      osc1.start();
      osc2.start();
      lfo.start();
      noise.start();

      // subtle deterministic modulation
      let step = 0;
      setInterval(() => {
        if(ctx.state === "suspended") return;
        const now = ctx.currentTime;
        const base = 300 + 180 * (0.5 + 0.5*Math.sin(step*0.7));
        filt.frequency.linearRampToValueAtTime(base, now + 6);
        master.gain.linearRampToValueAtTime(0.006 + 0.003*(0.5+0.5*Math.sin(step*0.31)), now + 6);
        step++;
      }, 6000);

      if(ctx.state === "suspended"){
        ctx.resume().catch(()=>{});
      }
    }catch(e){}
  }

  // unattended-safe: attempt start after load; browser may ignore if blocked
  window.addEventListener('load', () => {
    setTimeout(startAudio, 300);
  }, {once:true});
})();
</script>
</body>
</html>
