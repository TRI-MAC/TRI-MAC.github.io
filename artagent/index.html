<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generative Art</title>
<style>
  :root{
    --bg:#0d0b12;
    --ink:#f5efe6;
    --orange:#ff7a00;
    --amber:#ffb000;
    --red:#ff4a1f;
    --court:#d98a2b;
    --wood1:#7a3d12;
    --wood2:#a85a1b;
    --blue:#1247d6;
    --cream:#f7f0df;
    --shadow:#07060a;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 50%, #21111a 0%, #0a0910 55%, #000 100%);
    font-family: Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      linear-gradient(180deg, #130d10 0%, #22110a 35%, #120b0d 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.05),
      0 0 60px rgba(0,0,0,.65),
      inset 0 0 120px rgba(0,0,0,.35);
  }

  #background-video{
    position:absolute;
    inset:6% 7% 10% 7%;
    width:86%;
    height:84%;
    object-fit:cover;
    opacity:.82;
    filter:saturate(1.25) contrast(1.15) brightness(.98) hue-rotate(-10deg);
    clip-path:polygon(6% 0,94% 0,100% 8%,100% 92%,94% 100%,6% 100%,0 92%,0 8%);
    z-index:2;
  }

  .layer{position:absolute; inset:0; pointer-events:none}
  #bgGrad{
    background:
      radial-gradient(circle at 50% 12%, rgba(255,167,27,.26), transparent 22%),
      radial-gradient(circle at 50% 80%, rgba(16,62,180,.25), transparent 28%),
      linear-gradient(180deg, rgba(255,134,25,.16), rgba(0,0,0,0) 20%, rgba(0,0,0,0) 78%, rgba(255,98,0,.16));
    z-index:1;
  }

  #sunburst{
    z-index:3;
    mix-blend-mode:screen;
    opacity:.55;
    transform-origin:50% 42%;
    animation: slowRotate 90s linear infinite;
  }

  #courtLines{
    z-index:5;
    opacity:.95;
    mix-blend-mode:screen;
  }

  #deco{
    z-index:6;
    opacity:.95;
  }

  #halftone{
    z-index:7;
    opacity:.22;
    mix-blend-mode:soft-light;
  }

  #canvasPaint{
    position:absolute;
    inset:0;
    z-index:4;
    opacity:.95;
  }

  #overlay{
    z-index:8;
    background:
      linear-gradient(180deg, rgba(0,0,0,.42), rgba(0,0,0,0) 18%, rgba(0,0,0,0) 75%, rgba(0,0,0,.5)),
      linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,0) 14%, rgba(0,0,0,0) 86%, rgba(0,0,0,.28)),
      repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 2px, rgba(0,0,0,.01) 2px 4px);
    mix-blend-mode:multiply;
  }

  .panel{
    position:absolute;
    border:4px solid rgba(246,225,187,.8);
    box-shadow:
      0 0 0 1px rgba(0,0,0,.3) inset,
      0 0 30px rgba(255,148,31,.18);
    z-index:6;
  }
  .panel.a{
    left:-6%;
    top:14%;
    width:55%;
    height:21%;
    background:
      linear-gradient(135deg, rgba(255,119,0,.8), rgba(125,30,0,.15)),
      linear-gradient(90deg, transparent 0 84%, rgba(255,235,200,.75) 84% 88%, transparent 88%);
    transform:rotate(-14deg);
    animation: swayA 18s ease-in-out infinite;
  }
  .panel.b{
    right:-8%;
    top:28%;
    width:50%;
    height:18%;
    background:
      linear-gradient(135deg, rgba(22,77,214,.88), rgba(7,10,24,.08)),
      linear-gradient(0deg, transparent 0 72%, rgba(255,255,255,.6) 72% 76%, transparent 76%);
    transform:rotate(12deg);
    animation: swayB 22s ease-in-out infinite;
  }
  .panel.c{
    left:-4%;
    bottom:18%;
    width:48%;
    height:16%;
    background:
      linear-gradient(135deg, rgba(255,68,20,.8), rgba(32,5,10,.05));
    transform:rotate(11deg);
    animation: swayC 20s ease-in-out infinite;
  }
  .panel.d{
    right:-2%;
    bottom:9%;
    width:58%;
    height:19%;
    background:
      linear-gradient(135deg, rgba(255,176,0,.7), rgba(73,18,0,.1));
    transform:rotate(-8deg);
    animation: swayD 24s ease-in-out infinite;
  }

  .scoreArc{
    position:absolute;
    border:8px solid rgba(255,241,214,.82);
    border-color:rgba(255,241,214,.82) transparent transparent transparent;
    border-radius:50%;
    z-index:6;
    filter:drop-shadow(0 0 8px rgba(255,164,45,.15));
  }
  .arc1{
    width:70%;
    height:28%;
    left:15%;
    top:5%;
    transform:rotate(180deg);
    animation: pulseArc 14s ease-in-out infinite;
  }
  .arc2{
    width:88%;
    height:46%;
    left:6%;
    bottom:2%;
    animation: pulseArc 16s ease-in-out infinite reverse;
  }

  .ball{
    position:absolute;
    width:34%;
    aspect-ratio:1;
    left:33%;
    top:35%;
    border-radius:50%;
    z-index:9;
    background:
      radial-gradient(circle at 35% 28%, rgba(255,208,116,.95) 0 10%, rgba(255,159,39,.9) 10% 18%, rgba(255,122,0,.95) 18% 55%, rgba(166,64,10,1) 82%, rgba(76,23,4,1) 100%);
    box-shadow:
      0 0 0 6px rgba(255,188,85,.08),
      0 28px 65px rgba(0,0,0,.42),
      inset -18px -24px 38px rgba(72,16,0,.45),
      inset 14px 14px 30px rgba(255,192,91,.22);
    transform-origin:50% 50%;
    animation: ballBob 12s ease-in-out infinite;
  }
  .ball:before,
  .ball:after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
  }
  .ball:before{
    background:
      radial-gradient(circle at 50% 50%, transparent 0 49%, rgba(34,10,2,.95) 49.5% 51%, transparent 51.5%),
      linear-gradient(90deg, transparent 0 48.5%, rgba(34,10,2,.95) 48.8% 51.2%, transparent 51.5%),
      linear-gradient(0deg, transparent 0 48.5%, rgba(34,10,2,.95) 48.8% 51.2%, transparent 51.5%);
    transform:rotate(18deg);
  }
  .ball:after{
    inset:8% 18%;
    border-left:6px solid rgba(34,10,2,.95);
    border-right:6px solid rgba(34,10,2,.95);
    border-radius:50%;
    transform:rotate(18deg);
  }

  .rim{
    position:absolute;
    left:34%;
    top:15%;
    width:32%;
    height:1.2%;
    z-index:10;
    background:linear-gradient(180deg, #ffb344, #d14d00);
    border-radius:999px;
    box-shadow:0 0 18px rgba(255,120,0,.35);
    animation: rimGlow 8s ease-in-out infinite;
  }
  .net{
    position:absolute;
    left:37%;
    top:16.2%;
    width:26%;
    height:13%;
    z-index:9;
    clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);
    opacity:.75;
    background:
      repeating-linear-gradient(78deg, rgba(255,243,220,.85) 0 3px, transparent 3px 19px),
      repeating-linear-gradient(-78deg, rgba(255,243,220,.85) 0 3px, transparent 3px 19px);
    animation: netBreath 6s ease-in-out infinite;
  }

  .stripes{
    position:absolute;
    inset:-10%;
    z-index:3;
    opacity:.18;
    mix-blend-mode:screen;
    background:
      repeating-linear-gradient(117deg,
        transparent 0 62px,
        rgba(255,128,0,.9) 62px 86px,
        transparent 86px 172px,
        rgba(26,74,223,.95) 172px 198px,
        transparent 198px 292px);
    transform:translateY(0) scale(1.05);
    animation: stripeShift 28s ease-in-out infinite;
  }

  #date{
    position:absolute;
    right:18px;
    bottom:14px;
    z-index:20;
    color:rgba(255,244,224,.55);
    font-size:15px;
    letter-spacing:.12em;
    text-transform:uppercase;
    mix-blend-mode:screen;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:14px;
    bottom:134px;
    opacity:.58;
    z-index:12;
    filter:brightness(.78) saturate(.9);
    transform:rotate(-8deg);
  }

  @keyframes slowRotate{
    from{transform:rotate(0deg) scale(1)}
    50%{transform:rotate(4deg) scale(1.03)}
    to{transform:rotate(0deg) scale(1)}
  }
  @keyframes swayA{
    0%,100%{transform:rotate(-14deg) translate(0,0)}
    50%{transform:rotate(-10deg) translate(2%,1%)}
  }
  @keyframes swayB{
    0%,100%{transform:rotate(12deg) translate(0,0)}
    50%{transform:rotate(15deg) translate(-2%,1%)}
  }
  @keyframes swayC{
    0%,100%{transform:rotate(11deg) translate(0,0)}
    50%{transform:rotate(8deg) translate(2%,-1%)}
  }
  @keyframes swayD{
    0%,100%{transform:rotate(-8deg) translate(0,0)}
    50%{transform:rotate(-5deg) translate(-2%,-1%)}
  }
  @keyframes pulseArc{
    0%,100%{transform:scale(1); opacity:.85}
    50%{transform:scale(1.03); opacity:1}
  }
  @keyframes ballBob{
    0%,100%{transform:translateY(0) rotate(-3deg) scale(1)}
    50%{transform:translateY(-2.5%) rotate(3deg) scale(1.02)}
  }
  @keyframes rimGlow{
    0%,100%{box-shadow:0 0 18px rgba(255,120,0,.35)}
    50%{box-shadow:0 0 30px rgba(255,170,60,.55)}
  }
  @keyframes netBreath{
    0%,100%{transform:scaleY(1)}
    50%{transform:scaleY(1.06)}
  }
  @keyframes stripeShift{
    0%,100%{transform:translateY(-1%) scale(1.05)}
    50%{transform:translateY(1.5%) scale(1.08)}
  }
</style>
</head>
<body>
  <div id="frame">
    <div id="bgGrad" class="layer"></div>
    <div class="stripes"></div>

    <video id="background-video" src="video/background.e777952e.mp4" autoplay loop muted playsinline></video>

    <canvas id="canvasPaint" width="1080" height="1920"></canvas>

    <svg id="sunburst" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <g transform="translate(540 820)">
        <g id="rays"></g>
      </g>
    </svg>

    <svg id="courtLines" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="goldLine" x1="0" x2="1">
          <stop offset="0%" stop-color="#fff0c5"/>
          <stop offset="50%" stop-color="#ffb341"/>
          <stop offset="100%" stop-color="#fff0c5"/>
        </linearGradient>
      </defs>
      <rect x="76" y="118" width="928" height="1668" rx="18" ry="18" fill="none" stroke="url(#goldLine)" stroke-width="8" opacity="0.78"/>
      <circle cx="540" cy="960" r="178" fill="none" stroke="url(#goldLine)" stroke-width="8" opacity="0.7"/>
      <circle cx="540" cy="960" r="58" fill="none" stroke="url(#goldLine)" stroke-width="8" opacity="0.9"/>
      <path d="M540,118 L540,1786" stroke="url(#goldLine)" stroke-width="8" opacity="0.68"/>
      <path d="M250,118 h580 v220 h-580z" fill="none" stroke="url(#goldLine)" stroke-width="8" opacity="0.72"/>
      <path d="M250,1786 h580 v-220 h-580z" fill="none" stroke="url(#goldLine)" stroke-width="8" opacity="0.72"/>
      <path d="M190,338 A350,350 0 0 1 890,338" fill="none" stroke="url(#goldLine)" stroke-width="8" opacity="0.78"/>
      <path d="M190,1582 A350,350 0 0 0 890,1582" fill="none" stroke="url(#goldLine)" stroke-width="8" opacity="0.78"/>
      <path d="M422,338 A118,118 0 0 0 658,338" fill="none" stroke="url(#goldLine)" stroke-width="8" opacity="0.82"/>
      <path d="M422,1582 A118,118 0 0 1 658,1582" fill="none" stroke="url(#goldLine)" stroke-width="8" opacity="0.82"/>
    </svg>

    <div class="panel a"></div>
    <div class="panel b"></div>
    <div class="panel c"></div>
    <div class="panel d"></div>

    <div class="scoreArc arc1"></div>
    <div class="scoreArc arc2"></div>

    <div class="rim"></div>
    <div class="net"></div>
    <div class="ball"></div>

    <svg id="deco" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="orangeBand" x1="0" x2="1">
          <stop offset="0%" stop-color="#ff4a1f"/>
          <stop offset="50%" stop-color="#ffb000"/>
          <stop offset="100%" stop-color="#ff6e00"/>
        </linearGradient>
        <linearGradient id="blueBand" x1="0" x2="1">
          <stop offset="0%" stop-color="#1a4ee8"/>
          <stop offset="100%" stop-color="#6ec7ff"/>
        </linearGradient>
      </defs>

      <polygon points="0,220 240,120 350,320 120,470" fill="url(#orangeBand)" opacity=".78"/>
      <polygon points="840,220 1080,140 1080,430 930,510" fill="url(#blueBand)" opacity=".82"/>
      <polygon points="0,1420 190,1320 320,1510 80,1660" fill="url(#blueBand)" opacity=".72"/>
      <polygon points="760,1490 1080,1360 1080,1780 900,1850" fill="url(#orangeBand)" opacity=".76"/>

      <g opacity=".7">
        <circle cx="180" cy="720" r="40" fill="#fff0c5"/>
        <circle cx="900" cy="1130" r="24" fill="#fff0c5"/>
        <rect x="860" y="720" width="120" height="16" fill="#fff0c5" transform="rotate(-22 860 720)"/>
        <rect x="140" y="1180" width="160" height="16" fill="#fff0c5" transform="rotate(18 140 1180)"/>
      </g>
    </svg>

    <svg id="halftone" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="6" cy="6" r="3" fill="white"/>
          <circle cx="18" cy="18" r="2.2" fill="white"/>
        </pattern>
        <radialGradient id="fadeDot" cx="50%" cy="50%" r="70%">
          <stop offset="0%" stop-color="white" stop-opacity="1"/>
          <stop offset="100%" stop-color="white" stop-opacity="0"/>
        </radialGradient>
        <mask id="dotMask">
          <rect width="1080" height="1920" fill="black"/>
          <circle cx="540" cy="760" r="460" fill="url(#fadeDot)"/>
          <circle cx="540" cy="1360" r="320" fill="url(#fadeDot)" opacity=".75"/>
        </mask>
      </defs>
      <rect width="1080" height="1920" fill="url(#dots)" mask="url(#dotMask)"/>
    </svg>

    <div id="overlay" class="layer"></div>

    <img id="guinea-pig" src="img/guineapig.e777952e.png" alt="">

    <div id="date">2026-04-07</div>
  </div>

<script>
(() => {
  const seedStr = "2026-04-07";
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = (seed * 131 + seedStr.charCodeAt(i)) >>> 0;
  function rnd() {
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >> 17; seed >>>= 0;
    seed ^= seed << 5;  seed >>>= 0;
    return (seed >>> 0) / 4294967296;
  }

  const rays = document.getElementById('rays');
  const rayCount = 30;
  for(let i=0;i<rayCount;i++){
    const a = (Math.PI * 2 * i / rayCount) + rnd()*0.08;
    const inner = 110 + rnd()*70;
    const outer = 720 + rnd()*240;
    const spread = 0.07 + rnd()*0.045;
    const x1 = Math.cos(a-spread)*inner;
    const y1 = Math.sin(a-spread)*inner;
    const x2 = Math.cos(a+spread)*inner;
    const y2 = Math.sin(a+spread)*inner;
    const x3 = Math.cos(a+spread*0.45)*outer;
    const y3 = Math.sin(a+spread*0.45)*outer;
    const x4 = Math.cos(a-spread*0.45)*outer;
    const y4 = Math.sin(a-spread*0.45)*outer;
    const color = i % 3 === 0 ? "rgba(255,176,0,0.42)" : (i % 3 === 1 ? "rgba(255,84,31,0.35)" : "rgba(43,112,255,0.24)");
    const p = document.createElementNS("http://www.w3.org/2000/svg","polygon");
    p.setAttribute("points", `${x1},${y1} ${x2},${y2} ${x3},${y3} ${x4},${y4}`);
    p.setAttribute("fill", color);
    rays.appendChild(p);
  }

  const canvas = document.getElementById('canvasPaint');
  const ctx = canvas.getContext('2d');

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // woodgrain inspired energetic bands
    for(let i=0;i<24;i++){
      const y = 100 + i*74 + rnd()*24;
      const h = 32 + rnd()*30;
      const alpha = 0.05 + rnd()*0.07;
      const grad = ctx.createLinearGradient(0,y,canvas.width,y+h);
      grad.addColorStop(0, `rgba(255,155,60,${alpha*0.4})`);
      grad.addColorStop(0.35, `rgba(116,48,10,${alpha})`);
      grad.addColorStop(0.65, `rgba(206,111,34,${alpha*0.7})`);
      grad.addColorStop(1, `rgba(60,18,5,${alpha*0.35})`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0,y);
      ctx.bezierCurveTo(
        canvas.width*0.22, y + (rnd()*50-25),
        canvas.width*0.7, y + (rnd()*60-30),
        canvas.width, y + (rnd()*40-20)
      );
      ctx.lineTo(canvas.width, y+h);
      ctx.bezierCurveTo(
        canvas.width*0.75, y+h + (rnd()*50-25),
        canvas.width*0.25, y+h + (rnd()*50-25),
        0, y+h + (rnd()*50-25)
      );
      ctx.closePath();
      ctx.fill();
    }

    // aggressive paint slashes / motion vectors
    for(let i=0;i<18;i++){
      const x = rnd()*1080;
      const y = rnd()*1920;
      const len = 180 + rnd()*420;
      const ang = (-0.8 + rnd()*1.6);
      ctx.save();
      ctx.translate(x,y);
      ctx.rotate(ang);
      const g = ctx.createLinearGradient(-len/2,0,len/2,0);
      const c1 = i%2===0 ? `rgba(255,118,0,${0.09+rnd()*0.12})` : `rgba(39,92,255,${0.08+rnd()*0.11})`;
      const c2 = `rgba(255,240,220,${0.03+rnd()*0.05})`;
      g.addColorStop(0,c1);
      g.addColorStop(.5,c2);
      g.addColorStop(1,c1);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-len/2, -18-rnd()*20);
      ctx.lineTo(len/2, -4-rnd()*10);
      ctx.lineTo(len/2, 18+rnd()*20);
      ctx.lineTo(-len/2, 4+rnd()*12);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // dripped enamel circles as pop/deco accents
    for(let i=0;i<12;i++){
      const x = 120 + rnd()*840;
      const y = 180 + rnd()*1500;
      const r = 18 + rnd()*52;
      ctx.fillStyle = i%3===0 ? "rgba(255,240,210,0.11)" : i%3===1 ? "rgba(255,178,0,0.09)" : "rgba(35,88,255,0.09)";
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fill();
    }
  }
  draw();

  // subtle deterministic breathing on video and central forms
  const vid = document.getElementById('background-video');
  let t0 = performance.now();
  function animate(t){
    const s = (t - t0) * 0.001;
    const pulse = Math.sin(s*0.35)*0.5 + 0.5;
    vid.style.transform = `scale(${1.02 + pulse*0.025}) translateY(${Math.sin(s*0.21)*8}px)`;
    vid.style.filter = `saturate(${1.18 + pulse*0.18}) contrast(1.15) brightness(${0.95 + pulse*0.07}) hue-rotate(${-10 + pulse*4}deg)`;

    const ball = document.querySelector('.ball');
    ball.style.boxShadow = `
      0 0 0 6px rgba(255,188,85,.08),
      0 28px 65px rgba(0,0,0,.42),
      inset -18px -24px 38px rgba(72,16,0,.45),
      inset 14px 14px 30px rgba(255,192,91,${0.18 + pulse*0.12})
    `;
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  // procedural audio drone / arena hum
  let started = false;
  function startAudio(){
    if(started) return;
    started = true;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      const ac = new AC();

      const master = ac.createGain();
      master.gain.value = 0.016;
      master.connect(ac.destination);

      const low = ac.createOscillator();
      low.type = "sine";
      low.frequency.value = 48;

      const mid = ac.createOscillator();
      mid.type = "triangle";
      mid.frequency.value = 96;

      const high = ac.createOscillator();
      high.type = "sine";
      high.frequency.value = 192;

      const lGain = ac.createGain(); lGain.gain.value = 0.45;
      const mGain = ac.createGain(); mGain.gain.value = 0.16;
      const hGain = ac.createGain(); hGain.gain.value = 0.08;

      const filter = ac.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 850;
      filter.Q.value = 0.7;

      const lfo = ac.createOscillator();
      lfo.type = "sine";
      lfo.frequency.value = 0.06;
      const lfoGain = ac.createGain();
      lfoGain.gain.value = 110;
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      const trem = ac.createOscillator();
      trem.type = "sine";
      trem.frequency.value = 0.11;
      const tremGain = ac.createGain();
      tremGain.gain.value = 0.005;
      trem.connect(tremGain);
      tremGain.connect(master.gain);

      low.connect(lGain); mid.connect(mGain); high.connect(hGain);
      lGain.connect(filter); mGain.connect(filter); hGain.connect(filter);
      filter.connect(master);

      low.start(); mid.start(); high.start(); lfo.start(); trem.start();
    }catch(e){}
  }

  startAudio();
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) startAudio();
  });
})();
</script>
