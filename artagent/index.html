<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026-04-02</title>
<style>
  :root{
    --bg:#09111f;
    --gold:#f8c65a;
    --amber:#ff9f43;
    --cream:#f8efd6;
    --red:#ff5a36;
    --teal:#6ee7ff;
    --deep:#07101b;
    --steel:#6f89b5;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#02060d;
    overflow:hidden;
    font-family:system-ui, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7777778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 10%, #17355f 0%, #0c1830 35%, #050914 72%, #02050b 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 20px 60px rgba(0,0,0,.45);
  }

  #background-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.84;
    filter:saturate(1.25) contrast(1.08) hue-rotate(-8deg) brightness(.92);
    transform:scale(1.08);
    animation:videoDrift 40s ease-in-out infinite alternate;
  }

  .overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  .skyGlow{
    background:
      radial-gradient(70% 35% at 50% 0%, rgba(110,231,255,.18), transparent 70%),
      radial-gradient(55% 26% at 50% 14%, rgba(248,198,90,.18), transparent 70%),
      linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.12) 50%, rgba(0,0,0,.35));
    mix-blend-mode:screen;
  }

  .vignette{
    background:
      radial-gradient(120% 75% at 50% 20%, transparent 45%, rgba(0,0,0,.1) 66%, rgba(0,0,0,.45) 100%),
      linear-gradient(180deg, rgba(8,12,22,.05), rgba(8,12,22,.0) 25%, rgba(8,12,22,.16) 75%, rgba(8,12,22,.35));
  }

  .scan{
    opacity:.08;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.5) 0 1px, transparent 1px 4px);
    mix-blend-mode:overlay;
  }

  #hud{
    position:absolute;
    inset:0;
    opacity:.85;
  }
  #canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .date{
    position:absolute;
    right:18px;
    bottom:14px;
    font-size:12px;
    letter-spacing:.18em;
    color:rgba(248,239,214,.55);
    z-index:20;
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:28px;
    bottom:286px;
    opacity:.56;
    filter:brightness(.72) saturate(.9);
    z-index:8;
    transform:rotate(-8deg);
  }

  .sunburst{
    position:absolute;
    left:50%;
    top:27%;
    width:880px;
    height:880px;
    transform:translate(-50%,-50%) rotate(0deg);
    opacity:.42;
    mix-blend-mode:screen;
    animation:burstTurn 90s linear infinite;
  }

  .sunburst::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
      repeating-conic-gradient(
        from 0deg,
        rgba(248,198,90,.52) 0 3deg,
        rgba(255,159,67,.08) 3deg 9deg,
        transparent 9deg 18deg
      );
    mask: radial-gradient(circle at center, transparent 0 17%, rgba(0,0,0,1) 20% 55%, transparent 62%);
    -webkit-mask: radial-gradient(circle at center, transparent 0 17%, rgba(0,0,0,1) 20% 55%, transparent 62%);
    filter: blur(1px);
  }

  .launchAura{
    position:absolute;
    left:50%;
    bottom:20%;
    width:60%;
    height:30%;
    transform:translateX(-50%);
    background:
      radial-gradient(ellipse at 50% 80%, rgba(255,90,54,.35), transparent 45%),
      radial-gradient(ellipse at 50% 88%, rgba(248,198,90,.25), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(255,255,255,.16), transparent 70%);
    filter:blur(18px);
    opacity:.95;
    animation:breath 7s ease-in-out infinite;
  }

  .orbital-rings{
    position:absolute;
    inset:0;
    opacity:.52;
    mix-blend-mode:screen;
    animation:driftRotate 60s ease-in-out infinite alternate;
  }

  .moonCut{
    position:absolute;
    right:7.5%;
    top:9%;
    width:26%;
    aspect-ratio:1;
    border-radius:50%;
    background:
      radial-gradient(circle at 38% 34%, rgba(255,255,255,.95), rgba(227,232,242,.82) 38%, rgba(154,170,197,.65) 68%, rgba(91,107,133,.35) 100%);
    box-shadow:
      0 0 40px rgba(173,203,255,.2),
      inset -18px -12px 30px rgba(55,73,100,.35),
      inset 8px 6px 16px rgba(255,255,255,.55);
    opacity:.92;
  }

  .moonCut::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
      radial-gradient(circle at 30% 34%, rgba(90,108,138,.22) 0 7%, transparent 8%),
      radial-gradient(circle at 58% 44%, rgba(90,108,138,.2) 0 10%, transparent 11%),
      radial-gradient(circle at 42% 68%, rgba(90,108,138,.16) 0 8%, transparent 9%),
      radial-gradient(circle at 70% 30%, rgba(90,108,138,.12) 0 5%, transparent 6%);
    mix-blend-mode:multiply;
  }

  .decoFrame{
    position:absolute;
    inset:20px;
    border:1px solid rgba(248,198,90,.22);
    clip-path:polygon(0 4%, 4% 0, 96% 0, 100% 4%, 100% 96%, 96% 100%, 4% 100%, 0 96%);
    opacity:.6;
  }
  .decoFrame::before,
  .decoFrame::after{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(248,239,214,.12);
    clip-path:polygon(0 5%, 5% 0, 95% 0, 100% 5%, 100% 95%, 95% 100%, 5% 100%, 0 95%);
  }

  @keyframes videoDrift{
    from{transform:scale(1.08) translateY(-1.5%)}
    to{transform:scale(1.13) translateY(1.5%)}
  }
  @keyframes burstTurn{
    from{transform:translate(-50%,-50%) rotate(0deg)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
  }
  @keyframes breath{
    0%,100%{transform:translateX(-50%) scale(1)}
    50%{transform:translateX(-50%) scale(1.06)}
  }
  @keyframes driftRotate{
    from{transform:rotate(-3deg) scale(1)}
    to{transform:rotate(3deg) scale(1.03)}
  }
</style>
</head>
<body>
  <div id="frame">
    <video id="background-video" src="video/background.85f9b815.mp4" autoplay loop muted playsinline></video>

    <div class="sunburst"></div>
    <div class="launchAura"></div>
    <div class="moonCut"></div>

    <svg id="hud" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="goldLine" x1="0" x2="1">
          <stop offset="0%" stop-color="rgba(248,198,90,0)" />
          <stop offset="20%" stop-color="#f8c65a" />
          <stop offset="80%" stop-color="#f8efd6" />
          <stop offset="100%" stop-color="rgba(248,239,214,0)" />
        </linearGradient>
        <linearGradient id="redGold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff5a36"/>
          <stop offset="45%" stop-color="#f8c65a"/>
          <stop offset="100%" stop-color="#fff4d0"/>
        </linearGradient>
        <filter id="softGlow">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="grainy">
          <feTurbulence baseFrequency="0.95" numOctaves="2" seed="20260402" type="fractalNoise"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer>
            <feFuncA type="table" tableValues="0 0 .06 .09"/>
          </feComponentTransfer>
        </filter>
      </defs>

      <g opacity=".38">
        <path d="M160,280 L540,70 L920,280" fill="none" stroke="url(#goldLine)" stroke-width="4"/>
        <path d="M220,360 L540,180 L860,360" fill="none" stroke="url(#goldLine)" stroke-width="2"/>
        <path d="M120,420 L540,190 L960,420" fill="none" stroke="rgba(248,198,90,.18)" stroke-width="2"/>
      </g>

      <g class="orbital-rings">
        <ellipse cx="530" cy="820" rx="330" ry="112" fill="none" stroke="rgba(110,231,255,.38)" stroke-width="3"/>
        <ellipse cx="542" cy="838" rx="422" ry="148" fill="none" stroke="rgba(248,198,90,.28)" stroke-width="2" stroke-dasharray="7 10"/>
        <ellipse cx="534" cy="820" rx="250" ry="84" fill="none" stroke="rgba(248,239,214,.26)" stroke-width="2"/>
      </g>

      <g opacity=".78" filter="url(#softGlow)">
        <path d="M540 610
                 C566 720, 590 845, 590 955
                 L590 1260
                 C590 1324, 618 1398, 646 1460
                 L434 1460
                 C462 1398, 490 1324, 490 1260
                 L490 955
                 C490 845, 514 720, 540 610Z"
              fill="url(#redGold)"/>
        <path d="M540 650
                 C560 742, 574 848, 574 960
                 L574 1248
                 C574 1290, 590 1356, 604 1396
                 L476 1396
                 C490 1356, 506 1290, 506 1248
                 L506 960
                 C506 848, 520 742, 540 650Z"
              fill="rgba(11,23,39,.76)"/>
        <path d="M485 1410 L595 1410 L650 1505 L430 1505Z" fill="rgba(248,239,214,.75)"/>
        <path d="M468 735 L502 808 L472 838 L430 776Z" fill="rgba(248,198,90,.72)"/>
        <path d="M612 735 L650 776 L608 838 L578 808Z" fill="rgba(248,198,90,.72)"/>
        <circle cx="540" cy="866" r="20" fill="rgba(110,231,255,.85)"/>
        <circle cx="540" cy="866" r="9" fill="rgba(255,255,255,.9)"/>
      </g>

      <g opacity=".7">
        <path d="M520 1490 C490 1570, 458 1630, 430 1725
                 C486 1690, 516 1678, 540 1668
                 C564 1678, 594 1690, 650 1725
                 C622 1630, 590 1570, 560 1490Z"
              fill="rgba(255,160,80,.5)" filter="url(#softGlow)"/>
        <path d="M532 1490 C515 1575, 505 1650, 494 1760
                 C520 1710, 530 1690, 540 1678
                 C550 1690, 560 1710, 586 1760
                 C575 1650, 565 1575, 548 1490Z"
              fill="rgba(255,245,220,.82)" filter="url(#softGlow)"/>
      </g>

      <g opacity=".28">
        <rect x="0" y="1500" width="1080" height="420" fill="url(#redGold)" />
      </g>

      <g opacity=".45">
        <path d="M0 1645
                 C120 1612, 208 1636, 314 1600
                 C432 1560, 520 1622, 632 1588
                 C760 1550, 878 1600, 1080 1546
                 L1080 1920 L0 1920Z"
              fill="#5c4a3d"/>
        <path d="M0 1705
                 C110 1660, 230 1718, 354 1685
                 C470 1655, 600 1728, 720 1682
                 C844 1636, 934 1686, 1080 1655
                 L1080 1920 L0 1920Z"
              fill="#7a6553"/>
        <path d="M0 1768
                 C164 1732, 272 1768, 408 1738
                 C570 1702, 690 1788, 842 1746
                 C938 1720, 998 1736, 1080 1720
                 L1080 1920 L0 1920Z"
              fill="#a28568"/>
      </g>

      <g opacity=".38" stroke-linecap="round">
        <line x1="150" y1="1320" x2="250" y2="1260" stroke="rgba(248,198,90,.35)" stroke-width="3"/>
        <line x1="830" y1="1220" x2="940" y2="1178" stroke="rgba(248,198,90,.32)" stroke-width="3"/>
        <line x1="210" y1="910" x2="314" y2="862" stroke="rgba(110,231,255,.28)" stroke-width="2"/>
        <line x1="770" y1="980" x2="882" y2="934" stroke="rgba(110,231,255,.22)" stroke-width="2"/>
      </g>

      <rect width="1080" height="1920" filter="url(#grainy)" opacity=".28"></rect>
    </svg>

    <canvas id="canvas" width="1080" height="1920"></canvas>

    <div class="overlay skyGlow"></div>
    <div class="overlay vignette"></div>
    <div class="overlay scan"></div>
    <div class="decoFrame"></div>

    <img id="guinea-pig" src="img/guineapig.85f9b815.png" alt="" />
    <div class="date">2026-04-02</div>
  </div>

<script>
(() => {
  const dateSeed = "2026-04-02";
  let seed = 0;
  for (let i = 0; i < dateSeed.length; i++) seed = (seed * 131 + dateSeed.charCodeAt(i)) >>> 0;
  function rand() {
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >> 17; seed >>>= 0;
    seed ^= seed << 5;  seed >>>= 0;
    return (seed >>> 0) / 4294967296;
  }

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let w = canvas.width, h = canvas.height;
  const stars = [];
  const arcs = [];
  const ringNodes = [];

  for (let i = 0; i < 160; i++) {
    stars.push({
      x: rand() * w,
      y: rand() * (h * 0.62),
      r: rand() * 2.1 + 0.4,
      a: rand() * Math.PI * 2,
      s: rand() * 0.012 + 0.003,
      hue: rand() < 0.22 ? 42 : (rand() < 0.5 ? 190 : 0)
    });
  }

  for (let i = 0; i < 12; i++) {
    arcs.push({
      cx: 540 + (rand() - 0.5) * 160,
      cy: 860 + (rand() - 0.5) * 90,
      rx: 170 + i * 34 + rand() * 18,
      ry: 58 + i * 12 + rand() * 10,
      rot: (rand() - 0.5) * 0.22,
      span: 1.2 + rand() * 1.3,
      phase: rand() * Math.PI * 2,
      alpha: 0.05 + rand() * 0.06,
      color: rand() < 0.5 ? '248,198,90' : '110,231,255'
    });
  }

  for (let i = 0; i < 18; i++) {
    ringNodes.push({
      t: rand() * Math.PI * 2,
      speed: 0.0012 + rand() * 0.0015,
      rx: 250 + rand() * 180,
      ry: 80 + rand() * 70,
      size: 2 + rand() * 5,
      color: rand() < 0.6 ? '248,239,214' : '110,231,255'
    });
  }

  function drawMoonDust(time){
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const grad = ctx.createLinearGradient(0, 1500, 0, h);
    grad.addColorStop(0, 'rgba(255,160,90,0)');
    grad.addColorStop(.3, 'rgba(245,186,109,0.06)');
    grad.addColorStop(1, 'rgba(255,236,210,0.12)');
    ctx.fillStyle = grad;

    for(let y = 1500; y < h; y += 24){
      const wave = Math.sin(y * 0.01 + time * 0.0003) * 18;
      ctx.beginPath();
      ctx.moveTo(0, y + wave);
      for(let x = 0; x <= w; x += 90){
        const yy = y + Math.sin(x * 0.01 + y * 0.009 + time * 0.00025) * 12;
        ctx.lineTo(x, yy);
      }
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.globalAlpha = 0.03;
      ctx.fill();
    }
    ctx.restore();
  }

  function drawStars(time){
    for(const s of stars){
      const pulse = 0.55 + 0.45 * Math.sin(time * s.s + s.a);
      ctx.beginPath();
      ctx.fillStyle = s.hue === 42
        ? `rgba(248,198,90,${0.18 + pulse * 0.5})`
        : s.hue === 190
        ? `rgba(110,231,255,${0.12 + pulse * 0.42})`
        : `rgba(255,245,230,${0.2 + pulse * 0.55})`;
      ctx.arc(s.x, s.y, s.r * (0.7 + pulse * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawOrbits(time){
    ctx.save();
    ctx.translate(540, 830);
    for(const a of arcs){
      ctx.save();
      ctx.rotate(a.rot + Math.sin(time * 0.00008 + a.phase) * 0.05);
      ctx.beginPath();
      ctx.ellipse(
        a.cx - 540,
        a.cy - 830,
        a.rx,
        a.ry,
        0,
        -a.span + Math.sin(time * 0.0002 + a.phase) * 0.1,
        a.span + Math.sin(time * 0.00022 + a.phase) * 0.1
      );
      ctx.strokeStyle = `rgba(${a.color},${a.alpha})`;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    for(const n of ringNodes){
      n.t += n.speed;
      const x = Math.cos(n.t) * n.rx;
      const y = Math.sin(n.t) * n.ry;
      ctx.beginPath();
      ctx.fillStyle = `rgba(${n.color},0.75)`;
      ctx.arc(x, y, n.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = `rgba(${n.color},0.1)`;
      ctx.arc(x, y, n.size * 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawRays(time){
    ctx.save();
    ctx.translate(540, 510);
    const count = 22;
    for(let i=0;i<count;i++){
      const ang = (-Math.PI/2) + (i/count) * Math.PI * 2;
      const len = 220 + (i % 3) * 80 + Math.sin(time * 0.00015 + i) * 18;
      const inner = 80;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang-0.03)*inner, Math.sin(ang-0.03)*inner);
      ctx.lineTo(Math.cos(ang)*len, Math.sin(ang)*len);
      ctx.lineTo(Math.cos(ang+0.03)*inner, Math.sin(ang+0.03)*inner);
      ctx.closePath();
      ctx.fillStyle = i % 2
        ? 'rgba(248,198,90,0.08)'
        : 'rgba(255,90,54,0.06)';
      ctx.fill();
    }
    ctx.restore();
  }

  function draw(){
    const time = performance.now();
    ctx.clearRect(0,0,w,h);
    drawStars(time);
    drawRays(time);
    drawOrbits(time);
    drawMoonDust(time);

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
