<title>2026-04-08</title>
<style>
  :root{
    --bg:#070814;
    --ink:#05060d;
    --gold:#f2b63d;
    --amber:#ff8a1f;
    --coral:#ff5d6c;
    --magenta:#d43cff;
    --violet:#6f47ff;
    --cyan:#15d8ff;
    --teal:#00bfa6;
    --lime:#b9ff36;
    --cream:#f9f1d9;
    --red:#ff3131;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 50%, #0d1231 0%, #070814 45%, #03040a 100%);
    font-family: system-ui, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7777778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,175,48,.14), transparent 20%),
      radial-gradient(circle at 85% 25%, rgba(33,216,255,.18), transparent 22%),
      radial-gradient(circle at 10% 82%, rgba(212,60,255,.18), transparent 25%),
      linear-gradient(180deg, #120d26 0%, #090b18 38%, #05060d 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 30px 80px rgba(0,0,0,.55);
  }

  #background-video{
    position:absolute;
    inset:8% 10% 14% 10%;
    width:80%;
    height:62%;
    object-fit:cover;
    opacity:.82;
    filter:saturate(1.3) contrast(1.08) hue-rotate(-8deg) brightness(1.03);
    border-radius:44% 39% 46% 35% / 26% 31% 47% 39%;
    transform:translateZ(0) scale(1.04);
    mix-blend-mode:screen;
    box-shadow:
      0 0 0 2px rgba(255,190,70,.35),
      0 0 40px rgba(255,122,0,.2),
      0 0 90px rgba(0,214,255,.18);
    animation: videoBreath 18s ease-in-out infinite alternate;
  }
  @keyframes videoBreath{
    0%{transform:scale(1.02) rotate(-1.2deg); border-radius:44% 39% 46% 35% / 26% 31% 47% 39%}
    100%{transform:scale(1.09) rotate(1.4deg); border-radius:39% 46% 36% 44% / 33% 29% 42% 45%}
  }

  .layer{position:absolute; inset:0; pointer-events:none}
  .grain{
    opacity:.14;
    mix-blend-mode:soft-light;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.9) 0 1px, transparent 1.3px),
      radial-gradient(circle at 80% 30%, rgba(255,255,255,.8) 0 1px, transparent 1.2px),
      radial-gradient(circle at 40% 80%, rgba(255,255,255,.8) 0 1px, transparent 1.2px),
      radial-gradient(circle at 70% 70%, rgba(255,255,255,.75) 0 1px, transparent 1.2px);
    background-size:13px 13px, 17px 17px, 19px 19px, 23px 23px;
    animation: grainShift 7s steps(7) infinite;
  }
  @keyframes grainShift{
    0%{transform:translate(0,0)}
    25%{transform:translate(-1%,.5%)}
    50%{transform:translate(.6%,-.4%)}
    75%{transform:translate(-.4%,.9%)}
    100%{transform:translate(0,0)}
  }

  .scan{
    opacity:.12;
    background:
      repeating-linear-gradient(180deg,
      rgba(255,255,255,.14) 0 1px,
      transparent 1px 5px);
    mix-blend-mode:overlay;
  }

  #rings, #constellation, #glyphs, #maskSvg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }

  .halo{
    position:absolute;
    left:50%;
    top:34%;
    width:72%;
    height:72%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
      radial-gradient(circle, rgba(255,206,91,.38) 0 12%, rgba(255,149,34,.15) 20%, rgba(0,0,0,0) 56%),
      radial-gradient(circle, rgba(21,216,255,.16) 0 18%, rgba(0,0,0,0) 58%);
    filter:blur(18px);
    mix-blend-mode:screen;
    animation: haloTurn 24s linear infinite;
  }
  @keyframes haloTurn{
    from{transform:translate(-50%,-50%) rotate(0deg) scale(1)}
    to{transform:translate(-50%,-50%) rotate(360deg) scale(1.06)}
  }

  .sunburst{
    position:absolute;
    left:50%;
    top:35%;
    width:86%;
    height:86%;
    transform:translate(-50%,-50%);
    opacity:.7;
    filter:drop-shadow(0 0 16px rgba(255,178,54,.18));
    animation: spinSlow 48s linear infinite;
  }
  @keyframes spinSlow{to{transform:translate(-50%,-50%) rotate(360deg)}}

  .panel{
    position:absolute;
    border:2px solid rgba(255,204,94,.75);
    background:
      linear-gradient(135deg, rgba(255,180,60,.08), rgba(255,255,255,0) 45%),
      rgba(7,8,20,.08);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.03),
      0 0 26px rgba(255,160,20,.06);
    backdrop-filter: blur(1px);
  }
  .p1{left:-8%; top:58%; width:52%; height:23%; transform:rotate(-12deg); animation: panelA 17s ease-in-out infinite alternate}
  .p2{right:-6%; top:60%; width:58%; height:20%; transform:rotate(11deg); border-color:rgba(21,216,255,.6); animation: panelB 22s ease-in-out infinite alternate}
  .p3{left:8%; top:76%; width:36%; height:13%; transform:rotate(7deg); border-color:rgba(255,93,108,.62); animation: panelC 15s ease-in-out infinite alternate}
  .p4{right:10%; top:11%; width:28%; height:13%; transform:rotate(-18deg); border-color:rgba(185,255,54,.55); animation: panelD 19s ease-in-out infinite alternate}
  @keyframes panelA{from{transform:rotate(-12deg) translateY(0)}to{transform:rotate(-9deg) translateY(-1.3%)}}
  @keyframes panelB{from{transform:rotate(11deg) translateY(0)}to{transform:rotate(13deg) translateY(1.2%)}}
  @keyframes panelC{from{transform:rotate(7deg) scale(1)}to{transform:rotate(5deg) scale(1.03)}}
  @keyframes panelD{from{transform:rotate(-18deg)}to{transform:rotate(-14deg) translateY(.8%)}}

  .beads{
    position:absolute;
    inset:0;
    overflow:hidden;
  }
  .beads i{
    position:absolute;
    width:18px;height:18px;border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #fff8, transparent 30%), var(--c);
    box-shadow:0 0 0 2px rgba(0,0,0,.25), 0 0 15px color-mix(in srgb, var(--c) 70%, transparent);
    opacity:.9;
    animation: beadPulse var(--d) ease-in-out infinite;
  }
  @keyframes beadPulse{
    0%,100%{transform:scale(.85)}
    50%{transform:scale(1.12)}
  }

  .date{
    position:absolute;
    right:18px;
    bottom:12px;
    color:rgba(255,244,220,.62);
    font-size:12px;
    letter-spacing:.22em;
    opacity:.5;
    z-index:20;
    text-transform:uppercase;
  }

  #guinea-pig{
    position:absolute;
    width:17px;
    height:auto;
    left:14px;
    bottom:184px;
    opacity:.62;
    filter:saturate(.9) brightness(.88);
    z-index:8;
    transform:rotate(-4deg);
  }

  .vignette{
    background:
      radial-gradient(circle at 50% 40%, transparent 48%, rgba(0,0,0,.12) 72%, rgba(0,0,0,.42) 100%);
  }

  .edgeGlow{
    background:
      linear-gradient(90deg, rgba(255,170,50,.18), transparent 9%, transparent 91%, rgba(0,220,255,.12)),
      linear-gradient(180deg, rgba(212,60,255,.14), transparent 10%, transparent 90%, rgba(255,90,90,.12));
    mix-blend-mode:screen;
    opacity:.5;
  }
</style>

<script>
(() => {
  const seedStr = "2026-04-08-afrofuturism-video";
  let h = 2166136261 >>> 0;
  for (let i = 0; i < seedStr.length; i++) {
    h ^= seedStr.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  function rand() {
    h += 0x6D2B79F5;
    let t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  const frame = document.getElementById('frame');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const beads = document.getElementById('beads');
  const constellation = document.getElementById('constellation-group');

  function resize() {
    const r = frame.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(r.width * dpr);
    canvas.height = Math.floor(r.height * dpr);
    canvas.style.width = r.width + 'px';
    canvas.style.height = r.height + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    W = r.width; H = r.height;
    buildConstellation();
  }

  let W = 0, H = 0;

  const palette = ["#ffb431","#15d8ff","#ff5d6c","#d43cff","#b9ff36","#f9f1d9","#ff8a1f"];
  const orbiters = [];
  for(let i=0;i<18;i++){
    orbiters.push({
      a: 120 + rand()*310,
      b: 80 + rand()*250,
      speed: 0.00012 + rand()*0.00036,
      phase: rand()*Math.PI*2,
      r: 5 + rand()*11,
      color: palette[(i + Math.floor(rand()*palette.length)) % palette.length],
      yOff: -60 + rand()*260
    });
  }

  for(let i=0;i<26;i++){
    const dot = document.createElement('i');
    const c = palette[Math.floor(rand()*palette.length)];
    dot.style.setProperty('--c', c);
    dot.style.setProperty('--d', (4 + rand()*8).toFixed(2) + 's');
    dot.style.left = (8 + rand()*84) + '%';
    dot.style.top = (10 + rand()*80) + '%';
    dot.style.width = dot.style.height = (8 + rand()*16) + 'px';
    dot.style.opacity = 0.5 + rand()*0.45;
    beads.appendChild(dot);
  }

  function buildConstellation(){
    constellation.innerHTML = '';
    const nodes = [];
    for(let i=0;i<34;i++){
      const x = 120 + rand()*840;
      const y = 190 + rand()*1380;
      nodes.push({x,y});
    }
    for(let i=0;i<nodes.length;i++){
      const a = nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.hypot(dx,dy);
        if(dist < 170 && rand() > 0.56){
          const line = document.createElementNS('http://www.w3.org/2000/svg','line');
          line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
          line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
          line.setAttribute('stroke', rand() > .5 ? 'rgba(255,190,61,.28)' : 'rgba(21,216,255,.2)');
          line.setAttribute('stroke-width', 1 + rand()*2);
          constellation.appendChild(line);
        }
      }
    }
    nodes.forEach((n,i)=>{
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx', n.x); c.setAttribute('cy', n.y);
      c.setAttribute('r', 2 + rand()*5);
      c.setAttribute('fill', palette[i % palette.length]);
      c.setAttribute('opacity', .85);
      constellation.appendChild(c);
    });
  }

  function draw(t){
    ctx.clearRect(0,0,W,H);

    const cx = W*0.5, cy = H*0.355;

    const grad = ctx.createRadialGradient(cx, cy, 20, cx, cy, W*0.42);
    grad.addColorStop(0, 'rgba(255,196,91,0.12)');
    grad.addColorStop(0.25, 'rgba(255,106,0,0.08)');
    grad.addColorStop(0.5, 'rgba(21,216,255,0.06)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    for(let band=0; band<5; band++){
      const y = H*(0.57 + band*0.07);
      const amp = 22 + band*10;
      const thick = 10 + band*6;
      ctx.beginPath();
      for(let x=-40; x<=W+40; x+=14){
        const wave = Math.sin(x*0.012 + t*0.0005 + band*0.8) * amp;
        const wave2 = Math.cos(x*0.007 - t*0.00035 + band) * amp*0.35;
        const py = y + wave + wave2;
        if(x===-40) ctx.moveTo(x,py); else ctx.lineTo(x,py);
      }
      ctx.strokeStyle = band%2===0 ? `rgba(255,180,60,${0.18-band*0.02})` : `rgba(21,216,255,${0.14-band*0.018})`;
      ctx.lineWidth = thick;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    orbiters.forEach((o,idx)=>{
      const ang = t*o.speed + o.phase;
      const x = cx + Math.cos(ang) * o.a * 0.55;
      const y = cy + Math.sin(ang*1.07) * o.b * 0.42 + o.yOff*0.14;
      ctx.beginPath();
      ctx.arc(x,y,o.r,0,Math.PI*2);
      const g = ctx.createRadialGradient(x-o.r*.3,y-o.r*.3,1,x,y,o.r*2.2);
      g.addColorStop(0,'rgba(255,255,255,.95)');
      const hex = o.color;
      const rgb = hexToRgb(hex);
      g.addColorStop(.25, `rgba(${rgb.r},${rgb.g},${rgb.b},.95)`);
      g.addColorStop(1, `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
      ctx.fillStyle = g;
      ctx.fill();

      if(idx < orbiters.length-1){
        const n = orbiters[idx+1];
        const a2 = t*n.speed + n.phase;
        const x2 = cx + Math.cos(a2) * n.a * 0.55;
        const y2 = cy + Math.sin(a2*1.07) * n.b * 0.42 + n.yOff*0.14;
        ctx.strokeStyle = idx%2 ? 'rgba(255,190,61,.12)' : 'rgba(21,216,255,.10)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke();
      }
    });

    const cols = 9, rows = 14;
    const cellW = W/cols, cellH = H/rows;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        if(((r+c)%3===0 && rand()>.38) || (r%4===0 && c%2===0)){
          const x = c*cellW + cellW*0.18;
          const y = r*cellH + cellH*0.12;
          const w = cellW*0.64;
          const h = cellH*0.5;
          const pulse = 0.5 + 0.5*Math.sin(t*0.001 + r*0.6 + c*0.4);
          ctx.strokeStyle = c%2===0 ? `rgba(255,180,60,${0.04 + pulse*0.08})` : `rgba(212,60,255,${0.03 + pulse*0.06})`;
          ctx.lineWidth = 1.2;
          ctx.strokeRect(x,y,w,h);
        }
      }
    }

    requestAnimationFrame(draw);
  }

  function hexToRgb(hex){
    const h = hex.replace('#','');
    return {
      r: parseInt(h.substring(0,2),16),
      g: parseInt(h.substring(2,4),16),
      b: parseInt(h.substring(4,6),16)
    };
  }

  window.addEventListener('resize', resize, {passive:true});
  resize();
  requestAnimationFrame(draw);

  if (window.AudioContext || window.webkitAudioContext) {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctxA = new AC();
    const master = ctxA.createGain();
    master.gain.value = 0.014;
    master.connect(ctxA.destination);

    const now = ctxA.currentTime;
    const freqs = [97.5, 146.25, 195, 292.5];
    freqs.forEach((f,i)=>{
      const o = ctxA.createOscillator();
      const g = ctxA.createGain();
      const lfo = ctxA.createOscillator();
      const lfoG = ctxA.createGain();
      o.type = i%2 ? 'triangle' : 'sine';
      o.frequency.value = f;
      g.gain.value = 0.001 + i*0.0007;
      lfo.type = 'sine';
      lfo.frequency.value = 0.015 + i*0.008;
      lfoG.gain.value = 0.0014 + i*0.0006;
      lfo.connect(lfoG);
      lfoG.connect(g.gain);
      o.connect(g);
      g.connect(master);
      o.start(now);
      lfo.start(now);
    });

    const noiseBuffer = ctxA.createBuffer(1, ctxA.sampleRate * 2, ctxA.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1)*0.18;
    const noise = ctxA.createBufferSource();
    noise.buffer = noiseBuffer;
    noise.loop = true;
    const filter = ctxA.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 820;
    filter.Q.value = 0.5;
    const ng = ctxA.createGain();
    ng.gain.value = 0.0025;
    noise.connect(filter);
    filter.connect(ng);
    ng.connect(master);
    noise.start();

    document.addEventListener('visibilitychange', ()=>{
      if(document.hidden && ctxA.state === 'running') ctxA.suspend();
      else if(!document.hidden && ctxA.state !== 'running') ctxA.resume();
    });
  }
})();
</script>
