<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026-03-25</title>
<style>
  :root{
    --bg:#f4e8cf;
    --paper:#efe1c2;
    --ink:#191512;
    --spray-red:#ff4b2b;
    --spray-pink:#ff4fb3;
    --spray-yellow:#ffd44a;
    --spray-cyan:#2fd6ff;
    --spray-green:#62ff7a;
    --spray-violet:#7d54ff;
    --spray-black:#101010;
    --spray-white:#fff6ea;
    --rust:#b85b27;
    --shadow:rgba(0,0,0,.22);
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(circle at 20% 15%, #fff2cf 0%, #f0dfba 28%, #d9c199 55%, #b59673 100%);
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  body{
    display:grid;
    place-items:center;
  }

  #stage{
    width:min(100vw, calc(100vh * 9 / 16));
    aspect-ratio:9/16;
    position:relative;
    overflow:hidden;
    background:
      linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.05)),
      linear-gradient(135deg, #e8d5b2 0%, #f0dfbe 25%, #c6a47d 62%, #8a6d51 100%);
    box-shadow:0 30px 80px rgba(0,0,0,.35);
  }

  .layer{position:absolute; inset:0; pointer-events:none}
  canvas, svg{display:block; width:100%; height:100%}

  /* paper/poster strata */
  .poster{
    position:absolute;
    background:var(--paper);
    box-shadow:
      0 10px 20px rgba(0,0,0,.18),
      inset 0 0 0 1px rgba(80,50,20,.08);
    filter:saturate(1.05) contrast(1.03);
    transform-origin:center;
  }
  .poster::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,.45), transparent 36%),
      radial-gradient(circle at 84% 78%, rgba(90,40,0,.08), transparent 30%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.02) 0 2px, rgba(255,255,255,.015) 2px 4px);
    mix-blend-mode:multiply;
    opacity:.8;
  }
  .tear-top{
    clip-path:polygon(0 6%, 4% 4%, 8% 7%, 12% 3%, 17% 8%, 23% 4%, 28% 7%, 34% 2%, 39% 8%, 45% 4%, 51% 7%, 56% 3%, 61% 8%, 68% 4%, 74% 7%, 80% 3%, 86% 8%, 92% 4%, 100% 7%, 100% 100%, 0 100%);
  }
  .tear-side{
    clip-path:polygon(0 0, 100% 0, 100% 100%, 96% 98%, 98% 93%, 94% 89%, 99% 84%, 95% 78%, 98% 71%, 94% 66%, 99% 59%, 95% 53%, 98% 46%, 94% 41%, 99% 34%, 95% 28%, 98% 20%, 94% 13%, 100% 6%, 96% 0, 0 0);
  }

  #p1{left:5%; top:8%; width:54%; height:28%; transform:rotate(-6deg); opacity:.9}
  #p2{right:7%; top:16%; width:46%; height:21%; transform:rotate(7deg); opacity:.87}
  #p3{left:12%; bottom:20%; width:72%; height:23%; transform:rotate(-3deg); opacity:.86}
  #p4{right:-3%; bottom:6%; width:36%; height:19%; transform:rotate(11deg); opacity:.8}
  #p5{left:-4%; top:47%; width:30%; height:14%; transform:rotate(-14deg); opacity:.78}

  /* major images */
  #art-image{
    position:absolute;
    left:8%;
    top:41%;
    width:84%;
    height:36%;
    object-fit:cover;
    opacity:.97;
    border:10px solid rgba(255,246,234,.9);
    box-shadow:
      0 18px 45px rgba(0,0,0,.28),
      inset 0 0 0 2px rgba(0,0,0,.08);
    clip-path:polygon(5% 0, 100% 4%, 96% 100%, 0 97%);
    transform:rotate(-2.5deg);
    filter:saturate(1.1) contrast(1.12) sepia(.03);
    z-index:8;
    animation: artShift 34s ease-in-out infinite alternate;
  }

  #portrait-image{
    position:absolute;
    right:9%;
    top:13%;
    width:40%;
    height:33%;
    object-fit:cover;
    opacity:.9;
    clip-path:polygon(10% 4%, 96% 0, 100% 95%, 7% 100%, 0 24%);
    transform:rotate(6deg);
    filter: contrast(1.18) saturate(.9) grayscale(.16) hue-rotate(-8deg);
    mix-blend-mode:multiply;
    z-index:7;
    box-shadow:
      0 12px 30px rgba(0,0,0,.22),
      inset 0 0 0 8px rgba(244,232,207,.65);
    animation: portraitBreath 22s ease-in-out infinite;
  }

  /* framing paint slashes */
  .slash{
    position:absolute;
    filter: blur(.2px);
    transform-origin:center;
    z-index:9;
    opacity:.95;
  }
  .slash::before,.slash::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:40% 60% 55% 45% / 50% 45% 55% 50%;
  }
  .slash::before{
    background:var(--c);
    box-shadow:0 0 0 2px rgba(0,0,0,.08);
  }
  .slash::after{
    inset:8% 3% 14% 7%;
    background:linear-gradient(90deg, rgba(255,255,255,.28), transparent 26%, rgba(0,0,0,.12) 88%);
    mix-blend-mode:overlay;
    opacity:.8;
  }
  .drip{
    position:absolute;
    width:10px;
    background:linear-gradient(180deg, var(--c), rgba(0,0,0,.08));
    border-radius:0 0 8px 8px;
    transform-origin:top center;
    z-index:9;
    opacity:.92;
  }

  /* tags */
  .tag{
    position:absolute;
    color:transparent;
    -webkit-text-stroke: 3px var(--c);
    font-weight:900;
    font-style:italic;
    letter-spacing:.03em;
    transform-origin:center;
    opacity:.78;
    z-index:10;
    user-select:none;
    mix-blend-mode:multiply;
    filter: drop-shadow(0 2px 0 rgba(255,255,255,.15));
  }
  .tag.fill{
    color:var(--c);
    -webkit-text-stroke: 1px rgba(20,10,8,.38);
    opacity:.2;
    mix-blend-mode:screen;
  }

  .sticker{
    position:absolute;
    z-index:10;
    display:grid;
    place-items:center;
    color:#1a1715;
    font-weight:900;
    border-radius:50%;
    box-shadow:0 10px 18px rgba(0,0,0,.14);
    animation: stickerSpin 40s ease-in-out infinite alternate;
  }

  .sticker.small{font-size:24px}
  .sticker.big{font-size:34px}

  /* halftone / grime / scan */
  #grime, #paintCanvas{
    position:absolute; inset:0; z-index:3;
  }
  #paintCanvas{z-index:11; mix-blend-mode:multiply; opacity:.8}
  #grime{z-index:12; opacity:.4; mix-blend-mode:multiply}

  .mist{
    position:absolute;
    inset:-10%;
    z-index:6;
    background:
      radial-gradient(circle at 22% 34%, rgba(255,76,43,.18), transparent 18%),
      radial-gradient(circle at 78% 26%, rgba(47,214,255,.14), transparent 22%),
      radial-gradient(circle at 50% 72%, rgba(255,79,179,.16), transparent 19%),
      radial-gradient(circle at 68% 58%, rgba(255,212,74,.18), transparent 20%);
    filter:blur(35px) saturate(1.2);
    animation: mistShift 28s ease-in-out infinite alternate;
  }

  .tape{
    position:absolute;
    background:rgba(240,220,165,.42);
    border:1px solid rgba(140,120,80,.16);
    backdrop-filter: blur(.3px);
    z-index:13;
    box-shadow:0 5px 8px rgba(0,0,0,.07);
  }

  .date{
    position:absolute;
    right:16px;
    bottom:12px;
    font-size:14px;
    color:rgba(20,16,14,.45);
    letter-spacing:.18em;
    z-index:30;
  }

  #guinea-pig{
    position:absolute;
    width:17px;
    height:auto;
    left:19px;
    bottom:171px;
    opacity:.58;
    z-index:14;
    transform:rotate(-8deg);
    filter:saturate(.8) contrast(.95);
  }

  @keyframes artShift{
    0%{transform:rotate(-2.5deg) scale(1) translateY(0)}
    50%{transform:rotate(-1.2deg) scale(1.016) translateY(-8px)}
    100%{transform:rotate(-3.2deg) scale(1.008) translateY(6px)}
  }
  @keyframes portraitBreath{
    0%{transform:rotate(6deg) translate(0,0) scale(1)}
    50%{transform:rotate(4deg) translate(-6px,5px) scale(1.02)}
    100%{transform:rotate(7deg) translate(4px,-4px) scale(.995)}
  }
  @keyframes mistShift{
    0%{transform:translate(-2%, -1%) scale(1)}
    50%{transform:translate(2%, 1%) scale(1.04)}
    100%{transform:translate(-1%, 2%) scale(1.02)}
  }
  @keyframes stickerSpin{
    0%{transform:rotate(-9deg) scale(1)}
    100%{transform:rotate(8deg) scale(1.03)}
  }
  @keyframes swayA{
    0%,100%{transform:translateY(0) rotate(var(--r))}
    50%{transform:translateY(8px) rotate(calc(var(--r) + 2deg))}
  }
  @keyframes swayB{
    0%,100%{transform:translateY(0) rotate(var(--r))}
    50%{transform:translateY(-6px) rotate(calc(var(--r) - 2deg))}
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="layer">
      <div id="p1" class="poster tear-top"></div>
      <div id="p2" class="poster tear-side"></div>
      <div id="p3" class="poster tear-top"></div>
      <div id="p4" class="poster tear-side"></div>
      <div id="p5" class="poster tear-top"></div>
    </div>

    <canvas id="bgCanvas" class="layer"></canvas>
    <div class="mist"></div>

    <img id="portrait-image" src="portrait.png" alt="">
    <img id="art-image" src="art.png" alt="">

    <svg class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="none" style="z-index:9">
      <defs>
        <filter id="sprayBlur">
          <feGaussianBlur stdDeviation="2.4"/>
        </filter>
        <filter id="soft">
          <feGaussianBlur stdDeviation="1.2"/>
        </filter>
      </defs>

      <path d="M80 300 C240 210, 410 220, 540 260 S 820 350, 990 290"
            fill="none" stroke="#101010" stroke-width="26" stroke-linecap="round"
            opacity=".16" filter="url(#soft)"/>
      <path d="M70 310 C250 215, 418 224, 544 268 S 812 352, 1000 298"
            fill="none" stroke="#ff4b2b" stroke-width="18" stroke-linecap="round"
            opacity=".88"/>
      <path d="M118 322 C278 252, 454 258, 587 282 S 835 360, 950 334"
            fill="none" stroke="#ffd44a" stroke-width="8" stroke-linecap="round"
            opacity=".72"/>

      <path d="M118 1500 C360 1430, 520 1452, 788 1490 S 938 1562, 1000 1540"
            fill="none" stroke="#2fd6ff" stroke-width="22" stroke-linecap="round"
            opacity=".82"/>
      <path d="M90 1478 C340 1396, 560 1410, 832 1456"
            fill="none" stroke="#101010" stroke-width="30" stroke-linecap="round"
            opacity=".14" filter="url(#soft)"/>

      <g opacity=".9">
        <ellipse cx="240" cy="520" rx="132" ry="34" fill="#ff4fb3" transform="rotate(-20 240 520)"/>
        <ellipse cx="842" cy="1108" rx="155" ry="42" fill="#62ff7a" transform="rotate(13 842 1108)"/>
        <ellipse cx="326" cy="1260" rx="120" ry="28" fill="#ffd44a" transform="rotate(8 326 1260)"/>
      </g>

      <g opacity=".5" filter="url(#sprayBlur)">
        <circle cx="183" cy="514" r="28" fill="#ff4fb3"/>
        <circle cx="878" cy="1104" r="35" fill="#62ff7a"/>
        <circle cx="360" cy="1266" r="26" fill="#ffd44a"/>
      </g>

      <g opacity=".4">
        <rect x="44" y="58" width="244" height="24" rx="8" fill="#101010" transform="rotate(-12 44 58)"/>
        <rect x="812" y="172" width="220" height="18" rx="8" fill="#ff4b2b" transform="rotate(14 812 172)"/>
        <rect x="760" y="1802" width="250" height="22" rx="9" fill="#2fd6ff" transform="rotate(-9 760 1802)"/>
      </g>
    </svg>

    <div class="slash" style="--c:var(--spray-red); left:7%; top:29%; width:31%; height:5.6%; transform:rotate(-12deg); animation:swayA 18s ease-in-out infinite; --r:-12deg;"></div>
    <div class="slash" style="--c:var(--spray-yellow); left:56%; top:70%; width:28%; height:5.2%; transform:rotate(9deg); animation:swayB 20s ease-in-out infinite; --r:9deg;"></div>
    <div class="slash" style="--c:var(--spray-cyan); left:64%; top:9%; width:22%; height:4.6%; transform:rotate(22deg); animation:swayA 17s ease-in-out infinite; --r:22deg;"></div>
    <div class="slash" style="--c:var(--spray-pink); left:19%; top:76%; width:23%; height:4.8%; transform:rotate(-18deg); animation:swayB 24s ease-in-out infinite; --r:-18deg;"></div>

    <div class="drip" style="--c:var(--spray-red); left:26.2%; top:34%; height:118px;"></div>
    <div class="drip" style="--c:var(--spray-red); left:28.4%; top:34.3%; height:66px; width:8px;"></div>
    <div class="drip" style="--c:var(--spray-cyan); left:75.5%; top:13.2%; height:74px; width:8px;"></div>
    <div class="drip" style="--c:var(--spray-yellow); left:73.4%; top:75%; height:102px;"></div>
    <div class="drip" style="--c:var(--spray-pink); left:33%; top:80.2%; height:58px; width:7px;"></div>

    <div class="tag" style="--c:#101010; left:8%; top:7%; font-size:104px; transform:rotate(-11deg);">SNR</div>
    <div class="tag fill" style="--c:#ff4fb3; left:7.8%; top:7.6%; font-size:104px; transform:rotate(-11deg);">SNR</div>

    <div class="tag" style="--c:#2fd6ff; right:8%; top:33%; font-size:80px; transform:rotate(8deg);">KID</div>
    <div class="tag" style="--c:#ff4b2b; left:13%; bottom:8%; font-size:116px; transform:rotate(-5deg); opacity:.65;">VOID</div>

    <div class="sticker big" style="left:6%; top:58%; width:112px; height:112px; background:#ffd44a; transform:rotate(-14deg); z-index:12;">!</div>
    <div class="sticker small" style="right:12%; top:58%; width:74px; height:74px; background:#ff4fb3; color:#fff6ea; z-index:12;">★</div>

    <div class="tape" style="left:17%; top:39.2%; width:72px; height:26px; transform:rotate(-19deg);"></div>
    <div class="tape" style="right:13%; top:40.1%; width:82px; height:28px; transform:rotate(16deg);"></div>
    <div class="tape" style="left:68%; top:11.4%; width:76px; height:24px; transform:rotate(24deg);"></div>

    <canvas id="paintCanvas"></canvas>
    <canvas id="grime"></canvas>

    <img id="guinea-pig" src="guineapig.png" alt="">

    <div class="date">2026-03-25</div>
  </div>

<script>
(() => {
  const dateSeed = "2026-03-25";
  function hashString(str){
    let h = 2166136261 >>> 0;
    for(let i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
  }
  const rand = mulberry32(hashString(dateSeed));

  const stage = document.getElementById('stage');
  const bgCanvas = document.getElementById('bgCanvas');
  const paintCanvas = document.getElementById('paintCanvas');
  const grimeCanvas = document.getElementById('grime');

  const bgx = bgCanvas.getContext('2d');
  const ptx = paintCanvas.getContext('2d');
  const gtx = grimeCanvas.getContext('2d');

  let w=1080,h=1920,dpr=1;

  const palette = ['#ff4b2b','#ff4fb3','#ffd44a','#2fd6ff','#62ff7a','#101010','#fff6ea'];

  function resize(){
    const rect = stage.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    w = Math.round(rect.width);
    h = Math.round(rect.height);
    [bgCanvas, paintCanvas, grimeCanvas].forEach(c=>{
      c.width = Math.round(w*dpr);
      c.height = Math.round(h*dpr);
      c.style.width = w+'px';
      c.style.height = h+'px';
    });
    [bgx, ptx, gtx].forEach(ctx=>ctx.setTransform(dpr,0,0,dpr,0,0));
    renderStatic();
  }

  function drawWall(ctx){
    ctx.clearRect(0,0,w,h);

    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'#ead7b2');
    grad.addColorStop(.3,'#e2cca5');
    grad.addColorStop(.65,'#b99168');
    grad.addColorStop(1,'#7b5b45');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);

    for(let i=0;i<18;i++){
      let y = (i/17)*h + (rand()-0.5)*10;
      ctx.strokeStyle = `rgba(90,60,35,${0.08 + rand()*0.08})`;
      ctx.lineWidth = 1 + rand()*2;
      ctx.beginPath();
      ctx.moveTo(0,y);
      ctx.lineTo(w,y + (rand()-0.5)*12);
      ctx.stroke();
    }

    for(let i=0;i<9;i++){
      const x = rand()*w;
      const crackH = 120 + rand()*420;
      const y = rand()*h;
      ctx.strokeStyle = `rgba(50,35,25,${0.08+rand()*0.08})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x,y);
      let cx=x, cy=y;
      for(let s=0;s<8;s++){
        cx += (rand()-.5)*35;
        cy += crackH/8;
        ctx.lineTo(cx,cy);
      }
      ctx.stroke();
    }

    for(let i=0;i<420;i++){
      ctx.fillStyle = `rgba(255,255,255,${0.02 + rand()*0.03})`;
      const x = rand()*w, y = rand()*h;
      const r = rand()*1.8;
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fill();
    }
  }

  function splatter(ctx, cx, cy, baseR, color, count){
    ctx.save();
    ctx.fillStyle = color;
    for(let i=0;i<count;i++){
      const a = rand()*Math.PI*2;
      const rr = baseR*(0.3 + rand()*2.8);
      const x = cx + Math.cos(a)*rr;
      const y = cy + Math.sin(a)*rr*0.65;
      const r = Math.max(.8, baseR*(0.05 + rand()*0.18));
      ctx.globalAlpha = 0.08 + rand()*0.22;
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function renderStatic(){
    drawWall(bgx);

    const sprays = [
      [w*0.18,h*0.18,110,'#ff4b2b'],
      [w*0.82,h*0.22,95,'#2fd6ff'],
      [w*0.30,h*0.78,120,'#ff4fb3'],
      [w*0.72,h*0.72,130,'#ffd44a'],
      [w*0.50,h*0.53,170,'#101010']
    ];
    sprays.forEach(s => splatter(bgx, s[0], s[1], s[2], s[3], 240));

    gtx.clearRect(0,0,w,h);
    const img = gtx.createImageData(w, h);
    const data = img.data;
    for(let i=0;i<data.length;i+=4){
      const n = rand()*255;
      data[i] = 90 + n*.2;
      data[i+1] = 70 + n*.16;
      data[i+2] = 40 + n*.1;
      data[i+3] = 12 + rand()*18;
    }
    gtx.putImageData(img,0,0);

    gtx.globalCompositeOperation = 'multiply';
    for(let i=0;i<30;i++){
      const x = rand()*w, y = rand()*h;
      const rw = 90 + rand()*240, rh = 18 + rand()*80;
      gtx.fillStyle = `rgba(0,0,0,${0.02+rand()*0.04})`;
      gtx.save();
      gtx.translate(x,y);
      gtx.rotate((rand()-.5)*0.5);
      gtx.fillRect(-rw/2,-rh/2,rw,rh);
      gtx.restore();
    }
    gtx.globalCompositeOperation = 'source-over';
  }

  const strokes = [];
  for(let i=0;i<8;i++){
    strokes.push({
      color: palette[(i*2 + 1) % palette.length],
      y: h*(0.12 + i*0.1) + (rand()-0.5)*70,
      amp: 18 + rand()*26,
      width: 10 + rand()*26,
      speed: 0.0001 + rand()*0.00018,
      phase: rand()*Math.PI*2,
      alpha: 0.18 + rand()*0.22,
      x1: rand()*w*0.2,
      x2: w - rand()*w*0.1
    });
  }

  function brushStroke(ctx, t, s){
    ctx.save();
    ctx.strokeStyle = s.color;
    ctx.globalAlpha = s.alpha;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = s.width;
    ctx.beginPath();
    const steps = 18;
    for(let i=0;i<=steps;i++){
      const p = i/steps;
      const x = s.x1 + (s.x2 - s.x1)*p;
      const y = s.y + Math.sin(p*5.3 + t*s.speed + s.phase) * s.amp + Math.sin(p*11 + t*s.speed*1.7)*5;
      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.stroke();

    for(let i=0;i<8;i++){
      const p = rand();
      const x = s.x1 + (s.x2 - s.x1)*p;
      const y = s.y + Math.sin(p*5.3 + t*s.speed + s.phase) * s.amp;
      ctx.beginPath();
      ctx.arc(x + (rand()-.5)*14, y + (rand()-.5)*10, 1 + rand()*3.5, 0, Math.PI*2);
      ctx.fillStyle = s.color;
      ctx.globalAlpha = s.alpha * 0.32;
      ctx.fill();
    }
    ctx.restore();
  }

  function animate(t){
    ptx.clearRect(0,0,w,h);

    ptx.globalCompositeOperation = 'source-over';
    for(const s of strokes) brushStroke(ptx, t, s);

    ptx.globalCompositeOperation = 'multiply';
    for(let i=0;i<5;i++){
      const y = h*(0.28 + i*0.14) + Math.sin(t*0.00015 + i)*12;
      const g = ptx.createLinearGradient(0,y-22,w,y+22);
      g.addColorStop(0,'rgba(0,0,0,0)');
      g.addColorStop(.25,'rgba(0,0,0,.04)');
      g.addColorStop(.5,'rgba(255,255,255,.02)');
      g.addColorStop(.75,'rgba(0,0,0,.05)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      ptx.fillStyle = g;
      ptx.fillRect(0,y-26,w,52);
    }

    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize, {passive:true});
  resize();
  requestAnimationFrame(animate);

  // subtle ambient audio
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (AudioContext) {
    const ctx = new AudioContext();
    const start = () => {
      if (ctx.state === 'suspended') ctx.resume();

      const master = ctx.createGain();
      master.gain.value = 0.018;
      master.connect(ctx.destination);

      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 180;
      hp.Q.value = 0.7;
      hp.connect(master);

      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const osc3 = ctx.createOscillator();
      osc1.type = 'triangle';
      osc2.type = 'sawtooth';
      osc3.type = 'sine';

      osc1.frequency.value = 54;
      osc2.frequency.value = 81;
      osc3.frequency.value = 162;

      const g1 = ctx.createGain(), g2 = ctx.createGain(), g3 = ctx.createGain();
      g1.gain.value = 0.012;
      g2.gain.value = 0.006;
      g3.gain.value = 0.004;

      osc1.connect(g1).connect(hp);
      osc2.connect(g2).connect(hp);
      osc3.connect(g3).connect(hp);

      const lfo = ctx.createOscillator();
      const lfoG = ctx.createGain();
      lfo.type = 'sine';
      lfo.frequency.value = 0.021;
      lfoG.gain.value = 7;
      lfo.connect(lfoG);
      lfoG.connect(osc2.frequency);

      const lfo2 = ctx.createOscillator();
      const lfo2G = ctx.createGain();
      lfo2.type = 'sine';
      lfo2.frequency.value = 0.013;
      lfo2G.gain.value = 5;
      lfo2.connect(lfo2G);
      lfo2G.connect(osc1.frequency);

      const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for(let i=0;i<ch.length;i++) ch[i] = (Math.random()*2-1) * 0.55;

      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuf;
      noise.loop = true;

      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 2400;
      bp.Q.value = 0.7;

      const ng = ctx.createGain();
      ng.gain.value = 0.0028;

      noise.connect(bp).connect(ng).connect(master);

      osc1.start();
      osc2.start();
      osc3.start();
      lfo.start();
      lfo2.start();
      noise.start();

      document.removeEventListener('visibilitychange', start);
    };
    setTimeout(start, 80);
  }
})();
</script>
