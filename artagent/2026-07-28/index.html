<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026-07-28</title>
<style>
  :root{
    --bg:#07090f;
    --ink:#e6edf7;
    --date:#cfd7e6;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:#0a0d15;
  }

  /* immersive field */
  #field, #veil, #grain, #scan, #under, #front, #date, #art-image, #guinea-pig, svg{
    position:absolute;
    inset:0;
  }

  #field{
    background:
      radial-gradient(130% 90% at 20% 18%, rgba(255,120,70,0.22), transparent 42%),
      radial-gradient(110% 90% at 78% 26%, rgba(70,255,210,0.20), transparent 40%),
      radial-gradient(120% 100% at 44% 72%, rgba(110,90,255,0.24), transparent 46%),
      linear-gradient(180deg, #151822 0%, #0d101a 100%);
    filter:saturate(1.15) contrast(1.08);
    animation: fieldBreathe 26s ease-in-out infinite;
  }

  #veil{
    pointer-events:none;
    background:
      radial-gradient(85% 60% at 50% 50%, rgba(255,255,255,0.05), rgba(255,255,255,0.0) 58%),
      linear-gradient(135deg, rgba(255,255,255,0.045), rgba(255,255,255,0) 35%, rgba(255,255,255,0.03) 68%, rgba(255,255,255,0) 100%);
    mix-blend-mode:soft-light;
    animation: veilShift 32s ease-in-out infinite;
  }

  #grain{
    pointer-events:none;
    opacity:.14;
    mix-blend-mode:soft-light;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 4px);
    transform:scale(1.2);
    animation: grainMove 9s steps(6,end) infinite;
  }

  #scan{
    pointer-events:none;
    opacity:.12;
    background:
      linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.02) 30%, transparent 70%),
      repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 8px, rgba(255,255,255,0.012) 8px 9px);
    mix-blend-mode:screen;
    animation: scanDrift 20s linear infinite;
  }

  /* image as horizon stratum */
  #art-image{
    inset:auto 9% 56% 9%;
    width:82%;
    height:23%;
    object-fit:cover;
    object-position:center;
    opacity:.96;
    z-index:3;
    filter:
      hue-rotate(142deg)
      saturate(1.45)
      contrast(1.12)
      brightness(1.02)
      sepia(.1)
      drop-shadow(0 14px 24px rgba(0,0,0,.34))
      drop-shadow(0 0 18px rgba(150,220,255,.10));
    transform-origin:center center;
    animation: imageGlide 30s ease-in-out infinite;
    mask-image:
      linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.95) 14%, rgba(0,0,0,1) 86%, rgba(0,0,0,0) 100%),
      linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0) 100%);
    -webkit-mask-image:
      linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.95) 14%, rgba(0,0,0,1) 86%, rgba(0,0,0,0) 100%),
      linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0) 100%);
  }

  #under{
    z-index:2;
    pointer-events:none;
  }

  #front{
    z-index:5;
    pointer-events:none;
  }

  svg{
    width:100%;
    height:100%;
    z-index:4;
    pointer-events:none;
  }

  .slowA{ animation: swellA 28s ease-in-out infinite; transform-origin:center;}
  .slowB{ animation: swellB 34s ease-in-out infinite; transform-origin:center;}
  .slowC{ animation: shiftHue 24s ease-in-out infinite; transform-origin:center;}
  .rise1{ animation: rise1 26s ease-in-out infinite; transform-origin:center bottom;}
  .rise2{ animation: rise2 31s ease-in-out infinite; transform-origin:center bottom;}
  .rise3{ animation: rise3 37s ease-in-out infinite; transform-origin:center bottom;}
  .shear1{ animation: shear1 23s ease-in-out infinite; transform-origin:center;}
  .shear2{ animation: shear2 29s ease-in-out infinite; transform-origin:center;}
  .blinkless{ animation: densityShift 18s ease-in-out infinite; }

  #date{
    inset:auto 18px 12px auto;
    z-index:9;
    color:var(--date);
    opacity:.48;
    font-size:13px;
    letter-spacing:.16em;
    text-transform:none;
    width:auto;
    height:auto;
    mix-blend-mode:screen;
  }

  #guinea-pig{
    z-index:8;
    width:18px;
    height:18px;
    left:92px;
    bottom:182px;
    opacity:.58;
    object-fit:contain;
    filter:hue-rotate(155deg) saturate(.5) brightness(.88) contrast(1.1);
    transform:rotate(-8deg);
    clip-path:inset(2px 0 0 0);
  }

  @keyframes fieldBreathe{
    0%,100%{filter:hue-rotate(0deg) saturate(1.15) contrast(1.08); transform:scale(1.02)}
    25%{filter:hue-rotate(24deg) saturate(1.28) contrast(1.12); transform:scale(1.035)}
    50%{filter:hue-rotate(-18deg) saturate(1.2) contrast(1.06); transform:scale(1.025)}
    75%{filter:hue-rotate(36deg) saturate(1.3) contrast(1.1); transform:scale(1.04)}
  }
  @keyframes veilShift{
    0%,100%{transform:translate3d(-1.5%,0,0) scale(1.04); opacity:.95}
    50%{transform:translate3d(1.5%,-1%,0) scale(1.08); opacity:.7}
  }
  @keyframes grainMove{
    0%{transform:translate(0,0) scale(1.2)}
    25%{transform:translate(-0.6%,0.3%) scale(1.2)}
    50%{transform:translate(0.5%,-0.3%) scale(1.2)}
    75%{transform:translate(-0.3%,0.5%) scale(1.2)}
    100%{transform:translate(0,0) scale(1.2)}
  }
  @keyframes scanDrift{
    from{transform:translateY(-3%)}
    to{transform:translateY(3%)}
  }
  @keyframes imageGlide{
    0%,100%{transform:translateY(0px) scale(1.02)}
    50%{transform:translateY(8px) scale(1.035)}
  }
  @keyframes swellA{
    0%,100%{transform:scale(1) rotate(0deg)}
    50%{transform:scale(1.04) rotate(1.2deg)}
  }
  @keyframes swellB{
    0%,100%{transform:scale(1.02) translateY(0)}
    50%{transform:scale(.985) translateY(10px)}
  }
  @keyframes shiftHue{
    0%,100%{filter:hue-rotate(0deg) saturate(1)}
    50%{filter:hue-rotate(28deg) saturate(1.15)}
  }
  @keyframes rise1{
    0%,100%{transform:translateY(0) skewX(0deg)}
    50%{transform:translateY(-14px) skewX(-1deg)}
  }
  @keyframes rise2{
    0%,100%{transform:translateY(0) skewX(0deg)}
    50%{transform:translateY(18px) skewX(1.2deg)}
  }
  @keyframes rise3{
    0%,100%{transform:translateY(0) scaleX(1)}
    50%{transform:translateY(-9px) scaleX(1.03)}
  }
  @keyframes shear1{
    0%,100%{transform:skewY(0deg) translateX(0)}
    50%{transform:skewY(1deg) translateX(-5px)}
  }
  @keyframes shear2{
    0%,100%{transform:skewY(0deg) translateX(0)}
    50%{transform:skewY(-1deg) translateX(4px)}
  }
  @keyframes densityShift{
    0%,100%{opacity:.74}
    50%{opacity:.92}
  }
</style>
</head>
<body>
<div id="frame">
  <canvas id="field"></canvas>
  <div id="veil"></div>

  <svg viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#72ffe1" stop-opacity="0.22"/>

      </linearGradient>

      </linearGradient>
      <linearGradient id="gC" x1="0" y1="0" x2="1" y2="0">

      <path d="M0,860 L120,824 L220,846 L338,800 L460,842 L590,788 L726,824 L830,780 L960,824 L1080,804 L1080,1060 L0,1060 Z"
            fill="url(#gA)"/>
      <path d="M0,928 L90,904 L184,918 L276,896 L360,910 L458,880 L560,900 L648,886 L770,924 L892,894 L980,908 L1080,892 L1080,1100 L0,1100 Z"
            fill="#0d1118" opacity="0.72"/>
      <rect x="120" y="770" width="95" height="230" fill="#93ffe4" opacity="0.16" transform="skewX(-18)"/>
      <rect x="270" y="790" width="42" height="190" fill="#ffffff" opacity="0.09" transform="skewX(-18)"/>
      <rect x="722" y="760" width="130" height="250" fill="#ff9664" opacity="0.14" transform="skewX(14)"/>
      <rect x="860" y="796" width="56" height="170" fill="#b2dbff" opacity="0.11" transform="skewX(12)"/>
    </g>

    <g class="slowC" opacity="0.6" mask="url(#hazeFade)">
      <ellipse cx="510" cy="625" rx="400" ry="124" fill="#e9fbff" opacity="0.16" filter="url(#blur2)"/>
      <ellipse cx="590" cy="650" rx="360" ry="108" fill="#6de9ff" opacity="0.08" filter="url(#blur2)"/>
    </g>

    <!-- front silhouettes occupying opposite third -->
    <g class="rise1">
      <path d="M0,1510 L0,1920 L1080,1920 L1080,1642
               L1002,1610 L960,1460 L898,1500 L852,1338 L780,1384 L736,1184
               L662,1268 L614,1042 L552,1122 L512,914 L462,1000 L420,842
               L370,932 L322,882 L286,958 L242,936 L208,1016 L154,994 L122,1106
               L80,1098 L54,1220 L0,1510 Z"
            fill="#0a0d13" opacity="0.97"/>
      <path d="M0,1580 L74,1516 L116,1350 L160,1366 L188,1240 L226,1250 L260,1110 L300,1122
               L344,948 L390,1010 L444,864 L494,936 L548,736 L602,874 L662,982
               L726,1124 L778,1062 L826,1246 L886,1206 L932,1446 L998,1414 L1080,1546
               L1080,1920 L0,1920 Z"
            fill="rgba(17,24,34,0.6)"/>
    </g>

    <g class="rise2 blinkless" opacity="0.92">
      <path d="M0,1710 L0,1920 L1080,1920 L1080,1808
               L1030,1778 L980,1738 L934,1748 L884,1658 L836,1668 L792,1568
               L728,1598 L694,1506 L648,1520 L612,1422 L574,1444 L536,1354
               L498,1390 L448,1308 L396,1360 L352,1302 L300,1396 L250,1382
               L198,1474 L146,1450 L100,1564 L52,1562 L0,1710 Z"
            fill="#08131a"/>
      <path d="M0,1766 L58,1738 L106,1710 L156,1718 L212,1636 L256,1650 L314,1550 L366,1582
               L422,1488 L480,1510 L548,1388 L614,1458 L690,1360 L748,1462 L826,1400
               L896,1536 L978,1518 L1080,1630 L1080,1920 L0,1920 Z"
            fill="#10363f" opacity="0.26"/>

    <!-- image-breaking foreground bars/islands -->
    <g class="shear1" opacity="0.92">
      <path d="M128,1014 L242,982 L272,1126 L146,1148 Z" fill="#09131b"/>
      <path d="M796,960 L940,930 L974,1080 L822,1106 Z" fill="#09131b"/>
      <rect x="494" y="866" width="76" height="326" fill="#081119" transform="skewX(-10)"/>
      <rect x="570" y="892" width="26" height="292" fill="#d6fbff" opacity="0.14" transform="skewX(-10)"/>

    <!-- subtle alien chromatic slits -->
    <g class="shear2" mask="url(#fadeEdges)">
      <rect x="84" y="286" width="16" height="540" rx="8" fill="#87ffe0" opacity="0.18" filter="url(#soft)"/>

      <rect x="514" y="118" width="44" height="312" rx="22" fill="#e1f6ff" opacity="0.1" filter="url(#soft)"/>

    <!-- lower immersive sheet -->
    <g class="rise3">
      <path d="M0,1486 C0,1486 224,1408 386,1468 C540,1526 646,1424 792,1458 C934,1492 1080,1438 1080,1438 L1080,1920 L0,1920 Z"
            fill="url(#gA)" opacity="0.12"/>
      <path d="M0,1616 C164,1570 230,1608 338,1630 C454,1654 572,1588 700,1614 C846,1644 972,1612 1080,1578 L1080,1920 L0,1920 Z"
            fill="#73f8de" opacity="0.08" filter="url(#blur1)"/>

  </svg>

  <div id="under"></div>
  <img id="art-image" src="art.png" alt="" />
  <div id="front"></div>
  <div id="grain"></div>
  <div id="scan"></div>
  <img id="guinea-pig" src="guineapig.png" alt="" />
  <div id="date">2026-07-28</div>
</div>

<script>
(() => {
  const seedStr = "2026-07-28";
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = (seed * 131 + seedStr.charCodeAt(i)) >>> 0;
  function rnd() {
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >> 17; seed >>>= 0;
    seed ^= seed << 5; seed >>>= 0;
    return (seed >>> 0) / 4294967296;
  }

  const canvas = document.getElementById('field');
  const frame = document.getElementById('frame');
  const ctx = canvas.getContext('2d');

  let w = 1080, h = 1920, t0 = performance.now();

  const nodes = [];
  const cols = [
    [255,111,74],
    [112,255,224],
    [109,87,255],
    [238,248,255],
    [255,183,83]
  ];

  for(let i=0;i<8;i++){
    nodes.push({
      x: rnd()*w,
      y: rnd()*h,
      r: 220 + rnd()*420,
      vx: (rnd()-.5)*0.22,
      vy: (rnd()-.5)*0.22,
      c1: cols[(i+Math.floor(rnd()*cols.length))%cols.length],
      c2: cols[(i+2)%cols.length],
      p: rnd()*Math.PI*2,
      f: 0.2 + rnd()*0.35
    });
  }

  function resize(){
    const rect = frame.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
  resize();
  addEventListener('resize', resize);

  function draw(now){
    const cw = canvas.width, ch = canvas.height;
    const sx = cw / w, sy = ch / h;
    const t = (now - t0) * 0.001;

    ctx.clearRect(0,0,cw,ch);

    // alien but coherent colour-field logic: no discrete objects, only interacting chromatic masses
    const hueDrift = Math.sin(t*0.07)*18 + Math.cos(t*0.11)*14;

    const bg = ctx.createLinearGradient(0,0,0,ch);
    bg.addColorStop(0, `hsl(${214 + hueDrift}, 24%, 12%)`);
    bg.addColorStop(0.5, `hsl(${232 + hueDrift*0.4}, 28%, 10%)`);
    bg.addColorStop(1, `hsl(${198 - hueDrift*0.6}, 30%, 8%)`);
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,cw,ch);

    ctx.globalCompositeOperation = 'screen';
    for(let i=0;i<nodes.length;i++){
      const n = nodes[i];
      const px = (n.x + Math.sin(t*n.f + n.p)*110 + Math.cos(t*n.f*0.47 + n.p)*55) * sx;
      const py = (n.y + Math.cos(t*n.f*0.86 + n.p)*160 + Math.sin(t*n.f*0.31 + n.p)*48) * sy;
      const rr = n.r * (0.9 + Math.sin(t*n.f*0.5 + n.p)*0.08) * (sx*0.65 + sy*0.35);

      const g = ctx.createRadialGradient(px, py, rr*0.08, px, py, rr);
      const a1 = 0.15 + 0.06*Math.sin(t*0.23 + i);
      const a2 = 0.08 + 0.04*Math.cos(t*0.17 + i*0.8);

      g.addColorStop(0, `rgba(${n.c1[0]},${n.c1[1]},${n.c1[2]},${a1})`);
      g.addColorStop(0.36, `rgba(${n.c2[0]},${n.c2[1]},${n.c2[2]},${a2})`);
      g.addColorStop(0.74, `rgba(${n.c1[0]},${n.c1[1]},${n.c1[2]},0.03)`);
      g.addColorStop(1, `rgba(${n.c2[0]},${n.c2[1]},${n.c2[2]},0)`);
      ctx.fillStyle = g;
      ctx.fillRect(px-rr, py-rr, rr*2, rr*2);
    }

    // horizon infusion for image integration
    const horizonY = ch * 0.42;
    const hg = ctx.createLinearGradient(0, horizonY - ch*0.08, 0, horizonY + ch*0.12);
    hg.addColorStop(0, 'rgba(225,248,255,0)');
    hg.addColorStop(0.42, 'rgba(225,248,255,0.12)');
    hg.addColorStop(0.5, 'rgba(255,167,102,0.08)');
    hg.addColorStop(0.62, 'rgba(109,87,255,0.06)');
    hg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, horizonY - ch*0.16, cw, ch*0.32);

    // subtle pixel-grain shimmer blocks, not floating rectangles but full-field matrix
    const cell = Math.max(6, Math.floor(cw/90));
    ctx.globalCompositeOperation = 'soft-light';
    for(let y=0; y<ch; y+=cell){
      const band = 0.018 + 0.012*Math.sin(t*0.3 + y*0.01);
      for(let x=0; x<cw; x+=cell){
        const v = (Math.sin(x*0.021 + t*0.2) + Math.cos(y*0.017 - t*0.16) + Math.sin((x+y)*0.009 + t*0.1))*0.333;
        const a = Math.max(0, band * (0.5 + v));
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fillRect(x,y,cell,cell);
      }
    }

    ctx.globalCompositeOperation = 'multiply';
    const vign = ctx.createRadialGradient(cw*0.5, ch*0.48, ch*0.18, cw*0.5, ch*0.48, ch*0.88);
    vign.addColorStop(0, 'rgba(0,0,0,0)');
    vign.addColorStop(1, 'rgba(0,0,0,0.22)');
    ctx.fillStyle = vign;
    ctx.fillRect(0,0,cw,ch);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  if (window.self === window.top) {
    try{
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const ac = new AudioContext();
      const master = ac.createGain();
      master.gain.value = 0.012;
      master.connect(ac.destination);

      const lp = ac.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 880;
      lp.Q.value = 0.3;
      lp.connect(master);

      const hp = ac.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = 110;
      hp.Q.value = 0.2;
      hp.connect(lp);

      const o1 = ac.createOscillator();
      const o2 = ac.createOscillator();
      const o3 = ac.createOscillator();
      o1.type = "triangle";
      o2.type = "sine";
      o3.type = "sawtooth";
      o1.frequency.value = 110;
      o2.frequency.value = 164.81;
      o3.frequency.value = 220;

      const g1 = ac.createGain(), g2 = ac.createGain(), g3 = ac.createGain();
      g1.gain.value = 0.35; g2.gain.value = 0.18; g3.gain.value = 0.05;

      o1.connect(g1).connect(hp);
      o2.connect(g2).connect(hp);
      o3.connect(g3).connect(hp);

      const lfo = ac.createOscillator();
      const lfoG = ac.createGain();
      lfo.type = "sine";
      lfo.frequency.value = 0.021;
      lfoG.gain.value = 80;
      lfo.connect(lfoG).connect(lp.frequency);

      const trem = ac.createOscillator();
      const tremG = ac.createGain();
      trem.type = "sine";
      trem.frequency.value = 0.037;
      tremG.gain.value = 0.003;
      trem.connect(tremG).connect(master.gain);

      o1.start(); o2.start(); o3.start(); lfo.start(); trem.start();

      const base = ac.currentTime;
      function schedule(){
        const t = ac.currentTime;
        const step = 14;
        o1.frequency.linearRampToValueAtTime(110 + 8*Math.sin(t*0.11), t + step);
        o2.frequency.linearRampToValueAtTime(164.81 + 14*Math.sin(t*0.07 + 1.3), t + step);
        o3.frequency.linearRampToValueAtTime(220 + 10*Math.cos(t*0.05 + 0.8), t + step);
        g2.gain.linearRampToValueAtTime(0.14 + 0.05*(0.5+0.5*Math.sin(t*0.09)), t + step);
        lp.frequency.linearRampToValueAtTime(640 + 180*(0.5+0.5*Math.sin(t*0.06)), t + step);
      }
      schedule();
      setInterval(schedule, 12000);
    }catch(e){}
  }
})();
</script>
