<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Generative Art 2026-05-01</title>
<style>
  :root{
    --bg:#f3efe4;
    --paper:#f7f3e8;
    --black:#101010;
    --red:#d1181f;
    --blue:#0d57b8;
    --yellow:#f3c317;
    --white:#f6f4ee;
    --line:14px;
    --seed:20260501;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    background:#d9d4c7;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    width:min(100vw,56.25vh);
    height:min(100vh,177.777vw);
    aspect-ratio:9/16;
    position:relative;
    overflow:hidden;
    background:var(--paper);
    box-shadow:0 0 0 1px rgba(0,0,0,.05), 0 40px 120px rgba(0,0,0,.16);
  }

  /* Background fields */
  .field{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 16%, rgba(0,0,0,.03) 100%);
    pointer-events:none;
  }
  .papergrain{
    position:absolute; inset:0;
    opacity:.08;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,.15) 0 1px, transparent 1.2px),
      radial-gradient(circle at 70% 60%, rgba(0,0,0,.12) 0 1px, transparent 1.2px),
      radial-gradient(circle at 40% 80%, rgba(0,0,0,.12) 0 1px, transparent 1.2px);
    background-size: 12px 12px, 15px 15px, 17px 17px;
    mix-blend-mode:multiply;
    pointer-events:none;
  }

  /* Static de stijl planes */
  .plane{position:absolute}
  .white{background:var(--white)}
  .red{background:var(--red)}
  .blue{background:var(--blue)}
  .yellow{background:var(--yellow)}
  .black{background:var(--black)}

  .gridline{
    position:absolute;
    background:var(--black);
    z-index:12;
  }

  /* central art image integration */
  #art-wrap{
    position:absolute;
    left:19%;
    top:24%;
    width:62%;
    height:34%;
    z-index:4;
    overflow:hidden;
    border:var(--line) solid var(--black);
    background:var(--white);
    animation:artFloat 28s ease-in-out infinite;
  }
  #art-image{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.96;
    display:block;
    filter: saturate(1.05) contrast(1.03);
    transform:scale(1.07) translateY(-1%);
    animation:artDrift 36s ease-in-out infinite;
  }
  #art-wrap::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(90deg, transparent 0 31%, var(--black) 31% 33%, transparent 33% 62%, var(--black) 62% 64%, transparent 64%),
      linear-gradient(180deg, transparent 0 38%, var(--black) 38% 40%, transparent 40% 71%, var(--black) 71% 73%, transparent 73%);
    mix-blend-mode:multiply;
    opacity:.85;
    pointer-events:none;
  }
  #art-wrap::after{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(0deg, rgba(255,255,255,.0), rgba(255,255,255,.08)),
      linear-gradient(90deg, rgba(255,255,255,.0) 0 25%, rgba(255,255,255,.12) 35%, rgba(255,255,255,.0) 52%, rgba(255,255,255,.08) 68%, rgba(255,255,255,0) 100%);
    pointer-events:none;
  }

  /* butterfly svg layer */
  #svgLayer{
    position:absolute; inset:0;
    z-index:9;
    overflow:visible;
  }
  .butterfly{
    transform-box:fill-box;
    transform-origin:center;
  }
  .bf-body{fill:var(--black)}
  .bf-red{fill:var(--red)}
  .bf-blue{fill:var(--blue)}
  .bf-yellow{fill:var(--yellow)}
  .bf-white{fill:var(--white)}
  .wingStroke{stroke:var(--black);stroke-width:7;vector-effect:non-scaling-stroke}
  .shadow{
    fill:rgba(0,0,0,.11);
  }

  /* foreground blocks masking landing zones */
  #maskBlocks{
    position:absolute; inset:0;
    z-index:11;
    pointer-events:none;
  }

  /* subtle veil to soften any edge endings */
  .edgefade{
    position:absolute; inset:-2%;
    z-index:30;
    pointer-events:none;
    background:
      linear-gradient(180deg, rgba(243,239,228,.95) 0%, rgba(243,239,228,0) 8%, rgba(243,239,228,0) 92%, rgba(243,239,228,.9) 100%),
      linear-gradient(90deg, rgba(243,239,228,.95) 0%, rgba(243,239,228,0) 7%, rgba(243,239,228,0) 93%, rgba(243,239,228,.9) 100%);
    mix-blend-mode:normal;
  }

  #date{
    position:absolute;
    right:20px;
    bottom:18px;
    z-index:50;
    font-size:14px;
    letter-spacing:.12em;
    color:rgba(0,0,0,.45);
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:8px;
    bottom:207px;
    opacity:.58;
    z-index:10;
    filter:saturate(.85) contrast(.95);
  }

  @keyframes artFloat{
    0%,100%{transform:translateY(0px)}
    50%{transform:translateY(-10px)}
  }
  @keyframes artDrift{
    0%,100%{transform:scale(1.07) translateY(-1%) translateX(0%)}
    50%{transform:scale(1.11) translateY(-3%) translateX(1.2%)}
  }

  #canvasLayer{
    position:absolute; inset:0;
    z-index:6;
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="frame">
  <div class="plane white" style="left:0;top:0;width:100%;height:100%"></div>
  <div class="plane red" style="left:0;top:0;width:27%;height:13%"></div>
  <div class="plane blue" style="right:0;top:0;width:23%;height:18%"></div>
  <div class="plane yellow" style="left:0;bottom:0;width:20%;height:19%"></div>
  <div class="plane red" style="right:0;bottom:0;width:26%;height:14%"></div>
  <div class="plane blue" style="left:0;top:55%;width:10%;height:20%"></div>
  <div class="plane yellow" style="right:15%;top:38%;width:12%;height:10%"></div>
  <div class="plane white" style="left:29%;top:8%;width:38%;height:13%"></div>
  <div class="plane white" style="left:11%;top:69%;width:49%;height:12%"></div>

  <div id="art-wrap">
    <img id="art-image" src="art.png" alt="">
  </div>

  <!-- de stijl grid -->
  <div class="gridline" style="left:0;top:13%;width:100%;height:var(--line)"></div>
  <div class="gridline" style="left:0;top:21%;width:100%;height:var(--line)"></div>
  <div class="gridline" style="left:0;top:58%;width:100%;height:var(--line)"></div>
  <div class="gridline" style="left:0;top:81%;width:100%;height:var(--line)"></div>
  <div class="gridline" style="left:10%;top:0;width:var(--line);height:100%"></div>
  <div class="gridline" style="left:28%;top:0;width:var(--line);height:100%"></div>
  <div class="gridline" style="left:67%;top:0;width:var(--line);height:100%"></div>
  <div class="gridline" style="left:84%;top:0;width:var(--line);height:100%"></div>

  <canvas id="canvasLayer" width="1080" height="1920"></canvas>

  <svg id="svgLayer" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
    <g id="butterflyShadows"></g>
    <g id="butterflies"></g>
  </svg>

  <div id="maskBlocks">
    <div class="plane white" style="left:0;top:86%;width:36%;height:14%"></div>
    <div class="plane white" style="left:72%;top:17%;width:12%;height:16%"></div>
    <div class="plane white" style="left:67%;top:48%;width:17%;height:10%"></div>
    <div class="plane white" style="left:10%;top:21%;width:18%;height:11%"></div>
    <div class="plane white" style="left:28%;top:13%;width:39%;height:8%"></div>
  </div>

  <div class="field"></div>
  <div class="papergrain"></div>
  <img id="guinea-pig" src="guineapig.png" alt="">
  <div class="edgefade"></div>
  <div id="date">2026-05-01</div>
</div>

<script>
(() => {
  const seed = 20260501;
  function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
  const rand = mulberry32(seed);

  const svgNS = "http://www.w3.org/2000/svg";
  const butterfliesG = document.getElementById('butterflies');
  const shadowsG = document.getElementById('butterflyShadows');
  const frame = document.getElementById('frame');
  const canvas = document.getElementById('canvasLayer');
  const ctx = canvas.getContext('2d');

  const W = 1080, H = 1920;

  const landingStrips = [
    {x1:40, x2:250, y:1650},
    {x1:305, x2:655, y:398},
    {x1:730, x2:1035, y:1120},
    {x1:735, x2:1035, y:160},
    {x1:130, x2:270, y:515}
  ];

  function createButterflyDef(i){
    const scale = 0.55 + rand()*0.95;
    const wingW = 34 + rand()*26;
    const wingH = 48 + rand()*26;
    const bottomW = wingW * (0.74 + rand()*0.18);
    const bottomH = wingH * (0.62 + rand()*0.18);
    const palette = [
      ['bf-red','bf-white'],
      ['bf-blue','bf-white'],
      ['bf-yellow','bf-white'],
      ['bf-red','bf-blue'],
      ['bf-yellow','bf-red'],
      ['bf-blue','bf-yellow']
    ][Math.floor(rand()*6)];

    const g = document.createElementNS(svgNS,'g');
    g.setAttribute('class','butterfly');

    const shadow = document.createElementNS(svgNS,'ellipse');
    shadow.setAttribute('class','shadow');
    shadow.setAttribute('rx', String(wingW*0.9));
    shadow.setAttribute('ry', String(wingH*0.22));
    shadow.setAttribute('cx', '0');
    shadow.setAttribute('cy', String(wingH*1.35));
    shadowsG.appendChild(shadow);

    function wing(side, yTop, w, h, cls){
      const r = document.createElementNS(svgNS,'rect');
      r.setAttribute('x', side < 0 ? String(-w) : '0');
      r.setAttribute('y', String(yTop));
      r.setAttribute('width', String(w));
      r.setAttribute('height', String(h));
      r.setAttribute('class', cls+' wingStroke');
      return r;
    }

    g.appendChild(wing(-1,-hUnit(wingH,0.9),wingW,wingH,palette[0]));
    g.appendChild(wing(1,-hUnit(wingH,0.9),wingW,wingH,palette[1]));
    g.appendChild(wing(-1,8,bottomW,bottomH,palette[1]));
    g.appendChild(wing(1,8,bottomW,bottomH,palette[0]));

    const body = document.createElementNS(svgNS,'rect');
    body.setAttribute('x','-8');
    body.setAttribute('y', String(-wingH*0.8));
    body.setAttribute('width','16');
    body.setAttribute('height', String(wingH*1.6));
    body.setAttribute('rx','6');
    body.setAttribute('class','bf-body');
    g.appendChild(body);

    butterfliesG.appendChild(g);

    return {
      g, shadow, scale,
      wingW, wingH,
      flapPhase: rand()*Math.PI*2,
      flapSpeed: 0.9 + rand()*1.4,
      travelPhase: rand()*Math.PI*2,
      waveBand: Math.floor(rand()*4),
      landStrip: Math.floor(rand()*landingStrips.length),
      linger: rand()*1,
      landBias: rand(),
      x0: -120 - rand()*500,
      y0: 180 + rand()*1450,
      speed: 18 + rand()*30,
      drift: 35 + rand()*110,
      tilt: -18 + rand()*36,
      z: 0.35 + rand()*0.9,
      styleIndex: i
    };
  }
  function hUnit(v,m){ return v*m; }

  const butterflies = Array.from({length:34}, (_,i)=>createButterflyDef(i));

  function drawCanvas(t){
    ctx.clearRect(0,0,W,H);

    // subtle animated de stijl emphasis blocks / aura around image
    const pulse = 0.5 + 0.5*Math.sin(t*0.00022);
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#d1181f';
    ctx.fillRect(212, 402, 24, 662);
    ctx.fillStyle = '#0d57b8';
    ctx.fillRect(816, 0, 18, 1510);
    ctx.fillStyle = '#f3c317';
    ctx.fillRect(0, 1100, 108, 300);
    ctx.restore();

    // structural moving crossbars, slow and minimal
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#101010';
    const yA = 1090 + Math.sin(t*0.00018)*24;
    ctx.fillRect(294, yA, 426, 10);
    const xA = 709 + Math.sin(t*0.00016 + 1.3)*20;
    ctx.fillRect(xA, 410, 10, 690);
    ctx.restore();

    // soft block shadows around art image
    ctx.save();
    ctx.globalAlpha = 0.08 + pulse*0.04;
    const grad = ctx.createLinearGradient(180,420,860,1120);
    grad.addColorStop(0,'rgba(0,0,0,0)');
    grad.addColorStop(0.5,'rgba(0,0,0,0.6)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(170,390,730,740);
    ctx.restore();

    // landing bars: make "occasionally landing" visible as architectural ledges
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = '#101010';
    landingStrips.forEach((s, idx)=>{
      const off = Math.sin(t*0.00022 + idx*0.7)*3;
      ctx.fillRect(s.x1, s.y+18+off, s.x2-s.x1, 8);
    });
    ctx.restore();
  }

  function animate(ts){
    drawCanvas(ts);

    const t = ts * 0.001;
    butterflies.forEach((b,i)=>{
      const wave = (t * (0.12 + b.speed*0.0022)) + b.waveBand*0.9 + b.travelPhase;
      let x = ((b.x0 + (t * b.speed * 48 * b.z)) % (W + 680)) - 260;
      let y = b.y0
        + Math.sin(wave*1.25) * (60 + b.drift*0.34)
        + Math.cos(wave*0.55 + i*0.3) * (28 + b.drift*0.12);

      const migrationPulse = 0.5 + 0.5*Math.sin(t*0.11 + i*0.27);
      const shouldLand = migrationPulse > 0.83 + b.landBias*0.08;
      if(shouldLand){
        const s = landingStrips[b.landStrip];
        const mix = 0.78 + 0.22*Math.sin(t*0.25 + i);
        x = x*(1-mix) + (s.x1 + (s.x2-s.x1)*(0.15 + 0.7*((i*0.137)%1)))*mix;
        y = y*(1-mix) + s.y*mix;
      }

      const flap = shouldLand
        ? 0.18 + 0.08*Math.sin(t*4 + b.flapPhase)
        : 0.55 + 0.45*Math.sin(t*(5.2+b.flapSpeed) + b.flapPhase);

      const leftRot = -55*flap;
      const rightRot = 55*flap;
      const travelTilt = b.tilt + Math.sin(t*0.9 + i)*4;

      const children = b.g.children;
      children[0].setAttribute('transform', `rotate(${leftRot} -6 -12)`);
      children[1].setAttribute('transform', `rotate(${rightRot} 6 -12)`);
      children[2].setAttribute('transform', `rotate(${-leftRot*0.65} -6 20)`);
      children[3].setAttribute('transform', `rotate(${-rightRot*0.65} 6 20)`);

      b.g.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${travelTilt.toFixed(2)}) scale(${b.scale.toFixed(3)})`);
      b.shadow.setAttribute('transform', `translate(${(x+8).toFixed(2)} ${(y+8).toFixed(2)}) scale(${(b.scale*(0.7+0.3*(1-flap))).toFixed(3)} 1)`);

      b.shadow.style.opacity = shouldLand ? 0.16 : 0.08;
    });
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  if (window.self === window.top) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      const actx = new AudioContext();
      const master = actx.createGain();
      master.gain.value = 0.018;
      master.connect(actx.destination);

      const now = actx.currentTime;
      const freqs = [146.83, 220.0, 293.66];
      freqs.forEach((f, idx) => {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        const lfo = actx.createOscillator();
        const lfoGain = actx.createGain();
        osc.type = idx===1 ? 'triangle' : 'sine';
        osc.frequency.value = f;
        gain.gain.value = 0.005 + idx*0.002;
        lfo.type = 'sine';
        lfo.frequency.value = 0.03 + idx*0.013;
        lfoGain.gain.value = 2 + idx*1.7;
        lfo.connect(lfoGain).connect(osc.frequency);
        osc.connect(gain).connect(master);
        osc.start(now);
        lfo.start(now);
      });
      const noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for(let i=0;i<ch.length;i++) ch[i] = (rand()*2-1) * 0.25;
      const noise = actx.createBufferSource();
      noise.buffer = noiseBuf;
      noise.loop = true;
      const bp = actx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 780;
      bp.Q.value = 0.6;
      const ng = actx.createGain();
      ng.gain.value = 0.0035;
      noise.connect(bp).connect(ng).connect(master);
      noise.start(now);

      const resume = () => { if (actx.state !== 'running') actx.resume(); };
      resume();
      setTimeout(resume, 400);
      setTimeout(resume, 1400);
    }
  }
})();
</script>
</body>
</html>
