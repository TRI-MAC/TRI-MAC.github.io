<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generative Bauhaus 2026-04-04</title>
<style>
  :root{
    --bg:#f3efe2;
    --paper:#f0ead8;
    --black:#101010;
    --red:#d62828;
    --blue:#1d4ed8;
    --yellow:#f3c623;
    --cream:#f7f1df;
    --line:#161616;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#d8d2c3;
    font-family:Arial, Helvetica, sans-serif;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #frame{
    position:relative;
    width:min(100vw, calc(100vh * 1080 / 1920));
    aspect-ratio:9 / 16;
    height:auto;
    background:var(--paper);
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.08), 0 28px 80px rgba(0,0,0,.18);
  }

  .layer{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  #background-video{
    position:absolute;
    left:15%;
    top:19%;
    width:70%;
    height:39%;
    object-fit:cover;
    opacity:.8;
    border-radius:0;
    filter:saturate(1.05) contrast(1.03) brightness(1.03);
    z-index:2;
    box-shadow:
      0 0 0 10px var(--line),
      0 0 0 28px var(--cream);
    animation:videoShift 32s ease-in-out infinite alternate;
  }

  @keyframes videoShift{
    0%{transform:translateY(0px) scale(1);}
    100%{transform:translateY(-18px) scale(1.03);}
  }

  .paper-grid{
    z-index:1;
    opacity:.16;
    background:
      linear-gradient(to right, rgba(0,0,0,.08) 1px, transparent 1px) 0 0/120px 120px,
      linear-gradient(to bottom, rgba(0,0,0,.08) 1px, transparent 1px) 0 0/120px 120px;
  }

  .shape{
    position:absolute;
    z-index:3;
    transform-origin:center;
  }

  .bar-black-top{
    left:0; top:0; width:100%; height:7.8%;
    background:var(--black);
  }
  .bar-red-left{
    left:0; top:0; width:12%; height:100%;
    background:var(--red);
  }
  .bar-blue-right{
    right:0; top:46%; width:11%; height:54%;
    background:var(--blue);
  }
  .bar-yellow-bottom{
    left:12%; bottom:0; width:77%; height:8.4%;
    background:var(--yellow);
  }

  .circle-yellow{
    width:290px; height:290px; border-radius:50%;
    right:-58px; top:76px;
    background:var(--yellow);
    animation:slowOrbit1 26s ease-in-out infinite alternate;
  }

  .circle-red{
    width:220px; height:220px; border-radius:50%;
    left:-72px; top:520px;
    background:var(--red);
    animation:slowOrbit2 28s ease-in-out infinite alternate;
  }

  .circle-blue-cut{
    width:340px; height:340px; border-radius:50%;
    right:-120px; bottom:220px;
    background:var(--blue);
    animation:slowOrbit3 30s ease-in-out infinite alternate;
  }

  .rect-cream{
    left:11.6%; top:10%;
    width:26%; height:16%;
    background:rgba(247,241,223,.95);
    box-shadow:0 0 0 8px var(--line);
    animation:slidePanel 24s ease-in-out infinite alternate;
  }

  .rect-blue{
    left:9.2%; top:64%;
    width:31%; height:15%;
    background:var(--blue);
    box-shadow:0 0 0 8px var(--line);
    animation:slidePanelB 20s ease-in-out infinite alternate;
  }

  .rect-red{
    right:10.5%; top:63%;
    width:22%; height:12%;
    background:var(--red);
    box-shadow:0 0 0 8px var(--line);
    animation:slidePanelC 23s ease-in-out infinite alternate;
  }

  .rect-yellow{
    left:43%; top:80%;
    width:21%; height:8%;
    background:var(--yellow);
    box-shadow:0 0 0 8px var(--line);
    animation:slidePanelD 18s ease-in-out infinite alternate;
  }

  .thin-rule{
    position:absolute;
    background:var(--line);
    z-index:4;
  }
  .rule1{left:12%; top:26%; width:76%; height:8px;}
  .rule2{left:38%; top:8%; width:8px; height:84%;}
  .rule3{left:12%; top:58%; width:76%; height:8px;}
  .rule4{left:67%; top:26%; width:8px; height:54%;}
  .rule5{left:12%; top:79%; width:55%; height:8px;}

  .mask-panel{
    position:absolute;
    z-index:5;
    background:var(--paper);
    opacity:.95;
    animation:maskMove 34s ease-in-out infinite alternate;
  }
  .mask-a{left:15%; top:19%; width:12%; height:39%;}
  .mask-b{right:15%; top:19%; width:9%; height:39%;}
  .mask-c{left:42%; top:42%; width:43%; height:8%; opacity:.92;}
  .mask-d{left:27%; top:19%; width:6%; height:14%; opacity:.93;}

  .svg-wrap{
    z-index:6;
    opacity:.95;
  }

  #accentCanvas{
    z-index:7;
    opacity:.8;
    mix-blend-mode:multiply;
  }

  .grain{
    z-index:8;
    opacity:.08;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,.25) 0 1px, transparent 1.2px),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,.22) 0 1px, transparent 1.2px),
      radial-gradient(circle at 60% 20%, rgba(0,0,0,.18) 0 1px, transparent 1.2px),
      radial-gradient(circle at 35% 80%, rgba(0,0,0,.18) 0 1px, transparent 1.2px);
    background-size:17px 17px, 23px 23px, 19px 19px, 29px 29px;
    animation:grainShift 2.8s steps(3) infinite;
  }

  #dateStamp{
    position:absolute;
    right:20px;
    bottom:16px;
    z-index:20;
    color:rgba(0,0,0,.45);
    font-size:14px;
    letter-spacing:.12em;
    font-weight:700;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:10px;
    top:1888px;
    opacity:.58;
    z-index:9;
    filter:brightness(.78) saturate(.9);
    transform:rotate(-5deg);
  }

  @keyframes slowOrbit1{
    0%{transform:translate(0,0) scale(1);}
    100%{transform:translate(-24px,22px) scale(1.06);}
  }
  @keyframes slowOrbit2{
    0%{transform:translate(0,0) scale(1);}
    100%{transform:translate(28px,-14px) scale(.94);}
  }
  @keyframes slowOrbit3{
    0%{transform:translate(0,0) scale(1);}
    100%{transform:translate(-26px,18px) scale(1.05);}
  }
  @keyframes slidePanel{
    0%{transform:translateX(0)}
    100%{transform:translateX(24px)}
  }
  @keyframes slidePanelB{
    0%{transform:translateX(0) translateY(0)}
    100%{transform:translateX(18px) translateY(-10px)}
  }
  @keyframes slidePanelC{
    0%{transform:translateX(0)}
    100%{transform:translateX(-16px)}
  }
  @keyframes slidePanelD{
    0%{transform:scaleX(1)}
    100%{transform:scaleX(1.12)}
  }
  @keyframes maskMove{
    0%{transform:translateX(0)}
    100%{transform:translateX(18px)}
  }
  @keyframes grainShift{
    0%{transform:translate(0,0)}
    100%{transform:translate(1px,-1px)}
  }
</style>
</head>
<body>
  <div id="frame">
    <div class="layer paper-grid"></div>

    <div class="shape bar-black-top"></div>
    <div class="shape bar-red-left"></div>
    <div class="shape bar-blue-right"></div>
    <div class="shape bar-yellow-bottom"></div>

    <div class="shape circle-yellow"></div>
    <div class="shape circle-red"></div>
    <div class="shape circle-blue-cut"></div>

    <div class="shape rect-cream"></div>
    <div class="shape rect-blue"></div>
    <div class="shape rect-red"></div>
    <div class="shape rect-yellow"></div>

    <video id="background-video" src="background.mp4" autoplay loop muted playsinline></video>

    <div class="thin-rule rule1"></div>
    <div class="thin-rule rule2"></div>
    <div class="thin-rule rule3"></div>
    <div class="thin-rule rule4"></div>
    <div class="thin-rule rule5"></div>

    <div class="mask-panel mask-a"></div>
    <div class="mask-panel mask-b"></div>
    <div class="mask-panel mask-c"></div>
    <div class="mask-panel mask-d"></div>

    <svg class="layer svg-wrap" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <rect x="126" y="172" width="828" height="1348" fill="none" stroke="#141414" stroke-width="10"/>
      <rect x="402" y="504" width="364" height="364" fill="none" stroke="#141414" stroke-width="16"/>
      <circle cx="764" cy="286" r="74" fill="none" stroke="#141414" stroke-width="12"/>
      <circle cx="228" cy="632" r="58" fill="none" stroke="#141414" stroke-width="12"/>
      <rect x="128" y="1222" width="292" height="222" fill="none" stroke="#141414" stroke-width="10"/>
      <rect x="742" y="1210" width="214" height="168" fill="none" stroke="#141414" stroke-width="10"/>
      <line x1="128" y1="1116" x2="952" y2="1116" stroke="#141414" stroke-width="9"/>
      <line x1="726" y1="172" x2="726" y2="1520" stroke="#141414" stroke-width="9"/>
    </svg>

    <canvas id="accentCanvas" class="layer"></canvas>
    <div class="layer grain"></div>

    <img id="guinea-pig" src="guineapig.png" alt="" />
    <div id="dateStamp">2026-04-04</div>
  </div>

<script>
(() => {
  const dateSeed = "2026-04-04";
  function hashString(str){
    let h = 2166136261 >>> 0;
    for(let i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
  }
  const rand = mulberry32(hashString(dateSeed + "-bauhaus-video"));

  const frame = document.getElementById('frame');
  const canvas = document.getElementById('accentCanvas');
  const ctx = canvas.getContext('2d');

  function resize(){
    const rect = frame.getBoundingClientRect();
    canvas.width = Math.floor(rect.width * devicePixelRatio);
    canvas.height = Math.floor(rect.height * devicePixelRatio);
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  resize();
  addEventListener('resize', resize);

  const rays = [];
  for(let i=0;i<18;i++){
    rays.push({
      x: 756 + (rand()-0.5)*40,
      y: 286 + (rand()-0.5)*40,
      len: 120 + rand()*180,
      w: 8 + rand()*18,
      a: (-1.5 + i * (3.0/18)) + rand()*0.06,
      phase: rand()*Math.PI*2,
      color: i%3===0 ? '#d62828' : i%3===1 ? '#1d4ed8' : '#f3c623'
    });
  }

  const blocks = [];
  for(let i=0;i<8;i++){
    blocks.push({
      x: 150 + i*95 + rand()*30,
      y: 1460 + (i%2)*36 + rand()*18,
      w: 48 + rand()*80,
      h: 18 + rand()*28,
      color: i%3===0 ? '#101010' : i%3===1 ? '#d62828' : '#1d4ed8'
    });
  }

  function draw(t){
    t *= 0.001;
    const w = canvas.width / devicePixelRatio;
    const h = canvas.height / devicePixelRatio;
    ctx.clearRect(0,0,w,h);

    for(const r of rays){
      const pulse = 0.92 + Math.sin(t*0.28 + r.phase) * 0.08;
      ctx.save();
      ctx.translate(r.x, r.y);
      ctx.rotate(r.a + Math.sin(t*0.16 + r.phase) * 0.04);
      ctx.fillStyle = r.color;
      ctx.globalAlpha = 0.24;
      ctx.beginPath();
      ctx.rect(0, -r.w/2, r.len * pulse, r.w);
      ctx.fill();
      ctx.restore();
    }

    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = '#101010';
    ctx.lineWidth = 6;
    for(let i=0;i<5;i++){
      const y = 360 + i*118 + Math.sin(t*0.2 + i)*8;
      ctx.beginPath();
      ctx.moveTo(142, y);
      ctx.lineTo(286, y);
      ctx.stroke();
    }

    blocks.forEach((b, i) => {
      ctx.fillStyle = b.color;
      ctx.globalAlpha = 0.22;
      const shift = Math.sin(t*0.35 + i*0.7) * 14;
      ctx.fillRect(b.x + shift, b.y, b.w, b.h);
    });

    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#f3c623';
    ctx.fillRect(412, 516 + Math.sin(t*0.22)*8, 120, 340);
    ctx.fillStyle = '#d62828';
    ctx.fillRect(548, 516, 94, 340);
    ctx.fillStyle = '#1d4ed8';
    ctx.fillRect(654, 516 - Math.sin(t*0.22)*8, 96, 340);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  if (window.AudioContext || window.webkitAudioContext){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const audio = new Ctx();
    const master = audio.createGain();
    master.gain.value = 0.00001;
    master.connect(audio.destination);

    const osc1 = audio.createOscillator();
    const osc2 = audio.createOscillator();
    const lfo = audio.createOscillator();
    const lfoGain = audio.createGain();

    osc1.type = 'sine';
    osc2.type = 'triangle';
    osc1.frequency.value = 110;
    osc2.frequency.value = 164.81;
    lfo.frequency.value = 0.07;
    lfoGain.gain.value = 4;

    lfo.connect(lfoGain);
    lfoGain.connect(osc2.frequency);
    osc1.connect(master);
    osc2.connect(master);

    const startAudio = () => {
      if(audio.state === 'suspended') audio.resume().catch(()=>{});
      try{
        osc1.start();
        osc2.start();
        lfo.start();
      }catch(e){}
      removeEventListener('visibilitychange', startAudio);
    };
    addEventListener('visibilitychange', startAudio, {once:true});
    startAudio();
  }
})();
</script>
</body>
</html>
