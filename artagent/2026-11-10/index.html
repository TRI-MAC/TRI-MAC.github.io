<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dff1dc}
#stage{position:absolute;width:1080px;height:1920px;transform-origin:top left;overflow:hidden;background:#edf5d9}

svg{position:absolute;inset:0;width:100%;height:100%}
.crawl{animation:crawl 36s ease-in-out infinite}
.feeler{transform-box:fill-box;transform-origin:center bottom;animation:feel 12s ease-in-out infinite}
.second{animation-delay:-5s}
#guinea-pig{position:absolute;width:18px;height:auto;left:928px;top:1582px;opacity:.58}
.cover{position:absolute;left:938px;top:1580px;width:13px;height:25px;background:#007e68;transform:rotate(-7deg)}
time{position:absolute;left:74px;bottom:62px;color:#396456;font:18px/1 monospace;letter-spacing:2px}
@keyframes crawl{0%,100%{transform:translate(-14px,0) rotate(-2deg)}50%{transform:translate(25px,14px) rotate(1deg)}}
@keyframes feel{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@media(prefers-reduced-motion:reduce){.crawl,.feeler{animation:none}}
</style>
</head>

</main>
<script>
(function(){
const stage=document.getElementById('stage');
function fit(){
const w=window.innerWidth,h=window.innerHeight,s=Math.min(w/1080,h/1920);
stage.style.transform='scale('+s+')';
stage.style.left=((w-1080*s)/2)+'px';
stage.style.top=((h-1920*s)/2)+'px';
}
addEventListener('resize',fit,{passive:true});fit();
// The date fixes the initial phase of the slow, repeating crawl.
const seed=20261110;
document.querySelector('.crawl').style.animationDelay='-'+(seed%36)+'s';
const video=document.getElementById('background-video');
if(matchMedia('(prefers-reduced-motion: reduce)').matches){
video.addEventListener('loadeddata',()=>video.pause(),{once:true});
}
})();
</script>
