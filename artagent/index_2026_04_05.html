<!DOCTYPE html>

<title>2026-04-05</title>
<style>
  :root{
    --bg:#f2ead0;
    --red:#d53a2f;
    --gold:#e2a926;
    --blue:#124d8f;
    --teal:#0f8c7f;
    --green:#2c8a43;
    --black:#111111;
    --cream:#f7f0dc;
    --white:#fff9ee;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#0f0f0f;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  .frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(100vh,177.777vw);
    aspect-ratio:9/16;
    overflow:hidden;
    background:var(--bg);
    box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 24px 80px rgba(0,0,0,.45);
  }
  .layer{position:absolute; inset:0}
  #paint{
    width:100%;
    height:100%;
    display:block;
  }

  .bgBlocks{
    background:
      linear-gradient(90deg, transparent 0 6%, rgba(0,0,0,.06) 6% 6.8%, transparent 6.8% 16%, rgba(0,0,0,.06) 16% 16.8%, transparent 16.8% 31%, rgba(0,0,0,.05) 31% 31.7%, transparent 31.7% 54%, rgba(0,0,0,.06) 54% 54.8%, transparent 54.8% 79%, rgba(0,0,0,.05) 79% 79.8%, transparent 79.8% 100%),
      linear-gradient(180deg, transparent 0 8%, rgba(0,0,0,.05) 8% 8.8%, transparent 8.8% 18%, rgba(0,0,0,.06) 18% 18.9%, transparent 18.9% 33%, rgba(0,0,0,.05) 33% 33.8%, transparent 33.8% 47%, rgba(0,0,0,.06) 47% 47.9%, transparent 47.9% 63%, rgba(0,0,0,.05) 63% 63.8%, transparent 63.8% 82%, rgba(0,0,0,.06) 82% 82.8%, transparent 82.8% 100%),
      linear-gradient(180deg,#f7f0dc 0%,#eedcaa 100%);
    opacity:.95;
  }

  .beadCurtain{
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 8px 8px, rgba(255,255,255,.22) 0 1.6px, transparent 1.7px),
      radial-gradient(circle at 28px 28px, rgba(0,0,0,.08) 0 1.4px, transparent 1.5px);
    background-size:36px 36px, 56px 56px;
    mix-blend-mode:multiply;
    opacity:.23;
    animation: shimmer 18s ease-in-out infinite;
  }

  .portraitWrap{
    position:absolute;
    left:11%;
    right:11%;
    top:15%;
    bottom:19%;
    display:grid;
    place-items:center;
    pointer-events:none;
  }

  .portraitHalo{
    position:absolute;
    width:78%;
    aspect-ratio:1/1.18;
    background:
      radial-gradient(circle at 50% 42%, rgba(226,169,38,.78), rgba(226,169,38,.16) 46%, transparent 66%),
      radial-gradient(circle at 50% 50%, rgba(213,58,47,.22), transparent 62%);
    filter:blur(14px);
    transform:translateY(-2%);
    animation: haloPulse 14s ease-in-out infinite;
  }

  #portrait-image{
    position:relative;
    width:82%;
    max-height:100%;
    object-fit:cover;
    z-index:2;
    filter:saturate(1.12) contrast(1.04) sepia(.16);
    opacity:.96;
    mix-blend-mode:multiply;
    clip-path:polygon(11% 5%, 89% 5%, 96% 16%, 96% 86%, 87% 95%, 13% 95%, 4% 85%, 4% 17%);
    transform:scale(1.06);
    box-shadow:
      0 0 0 12px var(--black),
      0 0 0 24px var(--cream),
      0 0 0 34px var(--red),
      0 0 0 46px var(--gold),
      0 0 0 58px var(--blue);
  }

  .portraitMask{
    position:absolute;
    inset:0;
    z-index:3;
    background:
      linear-gradient(90deg, rgba(17,17,17,.95) 0 7%, transparent 7% 93%, rgba(17,17,17,.95) 93% 100%),
      linear-gradient(180deg, rgba(247,240,220,.76) 0 5%, transparent 5% 95%, rgba(17,17,17,.38) 95% 100%);
    mix-blend-mode:multiply;
    pointer-events:none;
  }

  svg.overlay{
    position:absolute;
    inset:0;
    z-index:4;
    overflow:visible;
  }

  .date{
    position:absolute;
    right:20px;
    bottom:16px;
    font-size:15px;
    letter-spacing:.18em;
    color:rgba(17,17,17,.48);
    z-index:10;
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    width:17px;
    height:auto;
    left:10px;
    bottom:292px;
    opacity:.58;
    z-index:3;
    filter:saturate(.9) contrast(.98) brightness(.88);
    transform:rotate(-7deg);
  }

  .vignette{
    background:
      linear-gradient(180deg, rgba(255,255,255,.08), transparent 14%, transparent 86%, rgba(0,0,0,.08)),
      radial-gradient(circle at 50% 50%, transparent 58%, rgba(0,0,0,.12) 100%);
    mix-blend-mode:multiply;
    pointer-events:none;
  }

  @keyframes haloPulse{
    0%,100%{transform:translateY(-2%) scale(1); filter:blur(14px)}
    50%{transform:translateY(-1%) scale(1.06); filter:blur(18px)}
  }
  @keyframes shimmer{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
  }
</style>
</head>
<body>

<script>
(() => {
  const dateSeed = "2026-04-05";
  function xmur3(str){
    let h = 1779033703 ^ str.length;
    for(let i=0;i<str.length;i++){
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = h << 13 | h >>> 19;
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }
  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const seed = xmur3(dateSeed)();
  const rand = mulberry32(seed);

  const canvas = document.getElementById('paint');
  const ctx = canvas.getContext('2d');
  const frame = document.querySelector('.frame');

  const palette = ["#d53a2f","#124d8f","#e2a926","#2c8a43","#111111","#f7f0dc","#0f8c7f"];
  const symbols = [];

  function resize(){
    const rect = frame.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    buildSymbols(rect.width, rect.height);
  }

  function buildSymbols(w,h){
    symbols.length = 0;
    const cols = 5;
    const rows = 8;
    const marginX = 80;
    const marginY = 170;
    const cellW = (w - marginX*2)/cols;
    const cellH = (h - marginY*2)/rows;
    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        if ((x===2 && y>=1 && y<=5) || (x===1 && y>=2 && y<=4) || (x===3 && y>=2 && y<=4)) continue;
        const cx = marginX + cellW*(x+.5) + (rand()-.5)*18;
        const cy = marginY + cellH*(y+.5) + (rand()-.5)*18;
        const type = Math.floor(rand()*4);
        const s = 18 + rand()*26;
        const phase = rand()*Math.PI*2;
        const color = palette[Math.floor(rand()*5)];
        symbols.push({cx,cy,type,s,phase,color});
      }
    }
  }

  function drawMotif(m, t){
    const pulse = 1 + Math.sin(t*0.00035 + m.phase)*0.08;
    const rot = Math.sin(t*0.00018 + m.phase)*0.25;
    ctx.save();
    ctx.translate(m.cx, m.cy);
    ctx.rotate(rot);
    ctx.scale(pulse,pulse);
    ctx.lineWidth = 8;
    ctx.lineJoin = "miter";
    ctx.strokeStyle = "#111111";
    if(m.type===0){
      ctx.fillStyle = m.color;
      ctx.beginPath();
      ctx.moveTo(0,-m.s);
      ctx.lineTo(m.s,0);
      ctx.lineTo(0,m.s);
      ctx.lineTo(-m.s,0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#f7f0dc";
      ctx.fillRect(-m.s*0.18,-m.s*0.18,m.s*0.36,m.s*0.36);
    } else if(m.type===1){
      ctx.fillStyle = m.color;
      ctx.fillRect(-m.s,-m.s,m.s*2,m.s*2);
      ctx.strokeRect(-m.s,-m.s,m.s*2,m.s*2);
      ctx.fillStyle = "#f7f0dc";
      ctx.fillRect(-m.s*0.6,-m.s*0.18,m.s*1.2,m.s*0.36);
      ctx.fillRect(-m.s*0.18,-m.s*0.6,m.s*0.36,m.s*1.2);
    } else if(m.type===2){
      ctx.fillStyle = m.color;
      ctx.beginPath();
      for(let i=0;i<3;i++){
        const a = -Math.PI/2 + i*Math.PI*2/3;
        ctx.lineTo(Math.cos(a)*m.s, Math.sin(a)*m.s);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#f7f0dc";
      ctx.beginPath();
      ctx.arc(0,0,m.s*0.24,0,Math.PI*2);
      ctx.fill();
    } else {
      ctx.strokeStyle = "#111111";
      ctx.fillStyle = m.color;
      ctx.beginPath();
      ctx.arc(0,0,m.s*0.78,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#f7f0dc";
      ctx.fillRect(-m.s*1.2,-m.s*0.16,m.s*2.4,m.s*0.32);
      ctx.fillRect(-m.s*0.16,-m.s*1.2,m.s*0.32,m.s*2.4);
    }
    ctx.restore();
  }

  function drawBands(w,h,t){
    const shift = Math.sin(t*0.00014)*18;
    ctx.save();
    ctx.globalAlpha = 0.92;
    for(let i=0;i<7;i++){
      const y = 250 + i*210 + (i%2?shift:-shift)*0.35;
      const x = i%2===0 ? -120 : w-380;
      const skew = i%2===0 ? 1 : -1;
      ctx.save();
      ctx.translate(x, y);
      ctx.transform(1,0,skew*0.25,1,0,0);
      ctx.fillStyle = i%4===0 ? "#d53a2f" : i%4===1 ? "#124d8f" : i%4===2 ? "#e2a926" : "#2c8a43";
      ctx.fillRect(0,0,340,90);
      ctx.fillStyle = "#111111";
      for(let k=0;k<5;k++){
        ctx.fillRect(20 + k*62, 12, 18, 66);
      }
      ctx.fillStyle = "#f7f0dc";
      for(let k=0;k<4;k++){
        ctx.fillRect(48 + k*62, 12, 10, 66);
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawCenterPanels(w,h,t){
    const oy = Math.sin(t*0.00022)*14;
    ctx.save();
    ctx.translate(w/2,h/2 + oy);
    for(let i=0;i<4;i++){
      const s = 430 - i*76 + Math.sin(t*0.0003 + i)*6;
      ctx.fillStyle = i%2===0 ? "rgba(247,240,220,0.82)" : "rgba(17,17,17,0.08)";
      ctx.strokeStyle = i===0 ? "#111111" : i===1 ? "#d53a2f" : i===2 ? "#124d8f" : "#e2a926";
      ctx.lineWidth = i===0 ? 18 : 12;
      ctx.beginPath();
      ctx.moveTo(0,-s);
      ctx.lineTo(s*0.78,0);
      ctx.lineTo(0,s);
      ctx.lineTo(-s*0.78,0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  function render(t){
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0,0,w,h);

    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,"rgba(255,248,232,0.16)");
    grad.addColorStop(0.5,"rgba(226,169,38,0.05)");
    grad.addColorStop(1,"rgba(17,17,17,0.04)");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);

    drawBands(w,h,t);
    drawCenterPanels(w,h,t);

    ctx.globalAlpha = 0.9;
    for(const m of symbols) drawMotif(m,t);

    ctx.globalAlpha = 0.12;
    for(let i=0;i<22;i++){
      const yy = 140 + i*74 + Math.sin(t*0.00025 + i)*6;
      ctx.fillStyle = i%2 ? "#111111" : "#f7f0dc";
      ctx.fillRect(0, yy, w, 6);
    }

    requestAnimationFrame(render);
  }

  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(render);

  const ringA = document.getElementById('ringA');
  const starRays = document.getElementById('starRays');
  const diamondNest = document.getElementById('diamondNest');
  const adinkra = document.getElementById('adinkraMarks');

  function animateSvg(ms){
    const a = Math.sin(ms*0.00018);
    const b = Math.sin(ms*0.00012 + 1.3);
    ringA.setAttribute('transform', `rotate(${a*10}) scale(${1+b*0.012})`);
    starRays.setAttribute('transform', `rotate(${b*14}) scale(${1+a*0.02})`);
    diamondNest.setAttribute('transform', `scale(${1+a*0.015} ${1-a*0.012}) rotate(${b*6})`);
    adinkra.setAttribute('transform', `rotate(${a*-8}) scale(${1+b*0.018})`);
    requestAnimationFrame(animateSvg);
  }
  requestAnimationFrame(animateSvg);
})();
</script>
</body>
