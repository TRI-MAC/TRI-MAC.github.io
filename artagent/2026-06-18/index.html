<style>
  :root{
    --bg1:#d7d2c4;
    --bg2:#a6b0ac;
    --mist:#d8ddd3;
    --ink:#14181a;
    --ink2:#23292b;
    --teal:#5e7776;
    --deepteal:#314648;
    --slate:#6e7774;
    --brown:#5c5249;
    --mud:#7b6d60;
    --paper:#ede7d8;
    --neon:#8fb8bb;
    --dullred:#7d433f;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#111;
    overflow:hidden;
    font-family: Georgia, "Times New Roman", serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      linear-gradient(180deg, #d5d0c1 0%, #a1aba8 18%, #66706f 52%, #4a4f4e 76%, #272c2e 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 18px 60px rgba(0,0,0,.5);
  }

  .layer, canvas, svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  #bgWash{
    background:
      radial-gradient(120% 45% at 50% 0%, rgba(255,248,230,.35) 0%, rgba(255,248,230,.08) 35%, rgba(0,0,0,0) 68%),
      linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.05)),
      linear-gradient(180deg, #d4cfbf 0%, #b5beb7 22%, #7d8783 48%, #58615f 69%, #2c3134 100%);
    filter:saturate(.9) contrast(1.03);
  }

  #sunDisc{
    position:absolute;
    width:42vmin;height:42vmin;
    left:50%; top:11%;
    transform:translateX(-50%);
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(240,236,221,.75) 0%, rgba(230,228,212,.48) 42%, rgba(210,216,211,.18) 62%, rgba(210,216,211,0) 76%);
    opacity:.72;
    filter:blur(2px);
    animation:breathe 20s ease-in-out infinite;
  }

  #mistBands{
    mix-blend-mode:screen;
    opacity:.6;
    mask-image:linear-gradient(180deg, rgba(0,0,0,.15), #000 20%, #000 85%, rgba(0,0,0,0));
  }
  .mist{
    position:absolute;
    left:-8%;
    width:116%;
    height:12%;
    border-radius:50%;
    background:linear-gradient(90deg, rgba(240,242,235,0), rgba(240,242,235,.16) 18%, rgba(238,240,235,.28) 50%, rgba(240,242,235,.14) 78%, rgba(240,242,235,0));
    filter:blur(16px);
    animation:mistDrift linear infinite;
  }
  .mist:nth-child(1){top:18%; animation-duration:31s;}
  .mist:nth-child(2){top:34%; animation-duration:42s; opacity:.7;}
  .mist:nth-child(3){top:56%; animation-duration:36s; opacity:.55;}
  .mist:nth-child(4){top:73%; animation-duration:47s; opacity:.45;}

  @keyframes mistDrift{
    0%{transform:translateX(-2%) scaleX(1)}
    50%{transform:translateX(2%) scaleX(1.04)}
    100%{transform:translateX(-2%) scaleX(1)}
  }
  @keyframes breathe{
    0%,100%{transform:translateX(-50%) scale(1); opacity:.68}
    50%{transform:translateX(-50%) scale(1.04); opacity:.78}
  }

  #citySVG{
    opacity:.98;
  }

  .pulseSlow{ animation:pulseSlow 18s ease-in-out infinite; transform-origin:center; }
  @keyframes pulseSlow{
    0%,100%{opacity:.9}
    50%{opacity:1}
  }

  #kanjiGlow{
    opacity:.22;
    filter:blur(.5px);
    animation:glowShift 24s ease-in-out infinite;
  }
  @keyframes glowShift{
    0%,100%{opacity:.16}
    50%{opacity:.28}
  }

  #canalGlow{
    mix-blend-mode:screen;
    opacity:.38;
    filter:blur(10px);
    animation:waterGlow 14s ease-in-out infinite;
  }
  @keyframes waterGlow{
    0%,100%{transform:translateY(0) scaleX(1)}
    50%{transform:translateY(0.4%) scaleX(1.02)}
  }

  #woodgrain{
    opacity:.12;
    mix-blend-mode:multiply;
  }

  #rainCanvas{
    opacity:.55;
    mix-blend-mode:multiply;
  }

  #waterCanvas{
    opacity:.9;
  }

  #dripCanvas{
    opacity:.48;
  }

  #vignette{
    background:
      radial-gradient(120% 85% at 50% 45%, rgba(0,0,0,0) 48%, rgba(0,0,0,.12) 72%, rgba(0,0,0,.32) 100%);
    pointer-events:none;
  }

  #date{
    position:absolute;
    right:18px;
    bottom:12px;
    color:rgba(245,242,230,.55);
    font-size:13px;
    letter-spacing:.08em;
    z-index:20;
    text-shadow:0 1px 0 rgba(0,0,0,.25);
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:90px;
    bottom:198px;
    opacity:.6;
    filter:saturate(.4) brightness(.72) contrast(1.05);
    z-index:9;
    transform:rotate(-4deg);
  }
</style>

<script>
(() => {
  const seedStr = "2026-06-18";
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = (seed * 131 + seedStr.charCodeAt(i)) >>> 0;
  function rand() {
    seed = (1664525 * seed + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  const frame = document.getElementById('frame');
  const rainCanvas = document.getElementById('rainCanvas');
  const waterCanvas = document.getElementById('waterCanvas');
  const dripCanvas = document.getElementById('dripCanvas');
  const rctx = rainCanvas.getContext('2d');
  const wctx = waterCanvas.getContext('2d');
  const dctx = dripCanvas.getContext('2d');

  let W = 1080, H = 1920, DPR = Math.min(2, window.devicePixelRatio || 1);

  function resizeCanvas(c, ctx){
    const rect = frame.getBoundingClientRect();
    c.width = rect.width * DPR;
    c.height = rect.height * DPR;
    c.style.width = rect.width + 'px';
    c.style.height = rect.height + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    return rect;
  }

  function resize(){
    const rectR = resizeCanvas(rainCanvas, rctx);
    resizeCanvas(waterCanvas, wctx);
    resizeCanvas(dripCanvas, dctx);
    W = rectR.width;
    H = rectR.height;
    initScene();
  }

  const rain = [];
  const drips = [];
  const reflBands = [];

  function initScene(){
    rain.length = 0;
    drips.length = 0;
    reflBands.length = 0;

    const rainCount = 220;
    for(let i=0;i<rainCount;i++){
      rain.push({
        x: rand()*W,
        y: rand()*H,
        len: 8 + rand()*24,
        speed: 260 + rand()*340,
        sway: 0.2 + rand()*0.8,
        a: 0.08 + rand()*0.12
      });
    }

    const dripXs = [108, 258, 430, 610, 888];
    for(let i=0;i<dripXs.length;i++){
      drips.push({
        x: dripXs[i] * (W/1080),
        y0: (1020 + i*30) * (H/1920),
        phase: rand()*Math.PI*2,
        len: 80 + rand()*140
      });
    }

    for(let i=0;i<9;i++){
      reflBands.push({
        x: rand()*W,
        y: H*(0.75 + rand()*0.2),
        w: 40 + rand()*180,
        h: 2 + rand()*7,
        hue: i%3===0 ? '143,184,186' : (i%3===1 ? '157,136,122' : '119,132,131'),
        phase: rand()*Math.PI*2
      });
    }
  }

  function drawRain(t){
    rctx.clearRect(0,0,W,H);
    rctx.lineWidth = 1;
    for(const p of rain){
      const yy = (p.y + (t*0.001*p.speed)) % (H + 40) - 20;
      const dx = p.len * 0.18;
      rctx.strokeStyle = `rgba(28,36,38,${p.a})`;
      rctx.beginPath();
      rctx.moveTo(p.x, yy);
      rctx.lineTo(p.x - dx, yy + p.len);
      rctx.stroke();
    }
  }

  function drawWater(t){
    wctx.clearRect(0,0,W,H);
    const canalTop = H*0.73;

    const grad = wctx.createLinearGradient(0, canalTop, 0, H);
    grad.addColorStop(0, 'rgba(82,93,92,0.05)');
    grad.addColorStop(1, 'rgba(15,19,22,0.22)');
    wctx.fillStyle = grad;
    wctx.fillRect(0, canalTop, W, H-canalTop);

    for(let i=0;i<18;i++){
      const y = canalTop + i*(H-canalTop)/18;
      const phase = t*0.00055 + i*0.43;
      const amp = 2 + i*0.16;
      wctx.fillStyle = i%2===0 ? 'rgba(205,214,210,0.045)' : 'rgba(39,50,52,0.05)';
      for(let x=0;x<W;x+=28){
        const h = 1.5 + Math.sin(x*0.02 + phase)*amp*0.12;
        wctx.fillRect(x, y + Math.sin(x*0.015 + phase)*amp, 22, h);
      }
    }

    for(const b of reflBands){
      const sway = Math.sin(t*0.0008 + b.phase) * 10;
      const shimmer = 0.08 + (Math.sin(t*0.0012 + b.phase)+1)*0.04;
      wctx.fillStyle = `rgba(${b.hue},${shimmer})`;
      wctx.fillRect(b.x + sway, b.y, b.w, b.h);
      wctx.fillStyle = `rgba(${b.hue},${shimmer*0.5})`;
      wctx.fillRect(b.x + sway*0.7, b.y+8, b.w*0.7, b.h);
    }

    wctx.fillStyle = 'rgba(218,224,217,0.06)';
    wctx.beginPath();
    wctx.moveTo(0, canalTop+8);
    wctx.lineTo(W, canalTop-42);
    wctx.lineTo(W, canalTop-35);
    wctx.lineTo(0, canalTop+15);
    wctx.closePath();
    wctx.fill();
  }

  function drawDrips(t){
    dctx.clearRect(0,0,W,H);
    dctx.lineCap = 'round';

    for(const d of drips){
      const cyc = (Math.sin(t*0.00075 + d.phase)+1)/2;
      const stretch = d.len * (0.25 + cyc*0.75);
      const x = d.x + Math.sin(t*0.00042 + d.phase)*2.5;
      const y1 = d.y0;
      const y2 = y1 + stretch;

      dctx.strokeStyle = 'rgba(180,194,190,0.08)';
      dctx.lineWidth = 2;
      dctx.beginPath();
      dctx.moveTo(x, y1);
      dctx.lineTo(x, y2);
      dctx.stroke();

      dctx.fillStyle = 'rgba(200,214,210,0.12)';
      dctx.beginPath();
      dctx.ellipse(x, y2+3, 2.6, 4.6, 0, 0, Math.PI*2);
      dctx.fill();

      const ripY = H*0.77 + ((y2/H)*40);
      dctx.strokeStyle = 'rgba(180,200,198,0.08)';
      dctx.lineWidth = 1.4;
      dctx.beginPath();
      dctx.ellipse(x + Math.sin(t*0.0005 + d.phase)*18, ripY, 8 + cyc*8, 2.4 + cyc*1.2, 0, 0, Math.PI*2);
      dctx.stroke();
    }
  }

  function frameLoop(t){
    drawWater(t);
    drawRain(t);
    drawDrips(t);
    requestAnimationFrame(frameLoop);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frameLoop);

  if (window.self === window.top) {
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0.018;
      master.connect(ctx.destination);

      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 120;
      hp.Q.value = 0.7;

      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 900;
      lp.Q.value = 0.4;

      const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1)*0.6;

      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuf;
      noise.loop = true;

      const noiseGain = ctx.createGain();
      noiseGain.gain.value = 0.22;

      noise.connect(lp);
      lp.connect(noiseGain);
      noiseGain.connect(master);
      noise.start();

      const hum1 = ctx.createOscillator();
      hum1.type = 'triangle';
      hum1.frequency.value = 46.5;
      const hum1Gain = ctx.createGain();
      hum1Gain.gain.value = 0.012;
      hum1.connect(hp);
      hp.connect(hum1Gain);
      hum1Gain.connect(master);
      hum1.start();

      const hum2 = ctx.createOscillator();
      hum2.type = 'sine';
      hum2.frequency.value = 92.7;
      const hum2Gain = ctx.createGain();
      hum2Gain.gain.value = 0.004;
      hum2.connect(hum2Gain);
      hum2Gain.connect(master);
      hum2.start();

      function modulate(){
        const now = ctx.currentTime;
        lp.frequency.linearRampToValueAtTime(700 + Math.random()*280, now + 8);
        noiseGain.gain.linearRampToValueAtTime(0.18 + Math.random()*0.08, now + 8);
        hum1Gain.gain.linearRampToValueAtTime(0.009 + Math.random()*0.007, now + 8);
        hum2Gain.gain.linearRampToValueAtTime(0.003 + Math.random()*0.003, now + 8);
      }
      setInterval(modulate, 8000);

      const resume = () => { if (ctx.state !== 'running') ctx.resume(); };
      window.addEventListener('load', resume, {once:true});
      setTimeout(resume, 300);
    }catch(e){}
  }
})();
</script>
</body>
</html>
