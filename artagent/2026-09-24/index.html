<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>2026-09-24</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f6e7c8}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:top left;overflow:hidden;background:#f6e7c8}
#scene-image{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;animation:drift 60s ease-in-out infinite}
@keyframes drift{0%,100%{transform:scale(1.02)}50%{transform:scale(1.045)}}
.band{position:absolute;opacity:.82;border-radius:999px}
#b1{left:-200px;top:180px;width:1500px;height:70px;background:#e8431f;transform:rotate(-14deg)}
#b2{left:-200px;top:1500px;width:1500px;height:90px;background:#1f9e6b;transform:rotate(9deg)}
#b3{left:-100px;top:1760px;width:1400px;height:44px;background:#f2b705;transform:rotate(-5deg)}
.band i{position:absolute;inset:0;border-radius:999px;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.35) 60px 80px);animation:slide 20s linear infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-140px)}}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px}
#date{position:absolute;right:28px;bottom:22px;font:22px monospace;color:#3a2410;opacity:.45}
#guinea-pig{position:absolute;left:14px;top:1872px;width:16px;opacity:.5}
</style></head><body>
<div id="stage">
<img id="scene-image" src="scene.png" alt="Afrofuturist garden scene with an invented figure">
<div class="band" id="b1"><i></i></div>
<div class="band" id="b2"><i></i></div>
<div class="band" id="b3"><i></i></div>
<canvas id="c" width="540" height="960"></canvas>
<img id="guinea-pig" src="guineapig.png" alt="">
<div id="date">2026-09-24</div>
</div>
<script>
const st=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);st.style.transform=`translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
let seed=20260924;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const cv=document.getElementById('c'),x=cv.getContext('2d');
const flowers=[[90,300,'#e8431f'],[450,420,'#2b59c3'],[120,700,'#f2b705'],[430,820,'#1f9e6b']];
const cols=['#2b59c3','#e8431f','#1f9e6b'];
const birds=cols.map((c,i)=>({x:270,y:300+i*200,tx:0,ty:0,t:0,c,f:i}));
birds.forEach(b=>pick(b));
function pick(b){b.f=(b.f+1+Math.floor(R()*3))%4;const f=flowers[b.f];b.tx=f[0]+(f[0]<270?40:-40);b.ty=f[1]-10;b.t=0}
function flower(f,now){x.save();x.translate(f[0],f[1]);x.rotate(now*.0002);x.fillStyle=f[2];
for(let i=0;i<8;i++){x.rotate(Math.PI/4);x.beginPath();x.moveTo(0,0);x.lineTo(10,-28);x.lineTo(0,-40);x.lineTo(-10,-28);x.fill()}
x.fillStyle='#fff3d6';x.beginPath();x.arc(0,0,11,0,7);x.fill();x.fillStyle='#3a2410';x.beginPath();x.arc(0,0,5,0,7);x.fill();x.restore()}
function bird(b,now){const d=b.tx<b.x?-1:1;x.save();x.translate(b.x,b.y);x.scale(d,1);
const w=Math.sin(now*.09)*0.5;x.globalAlpha=.35;x.fillStyle='#fff3d6';
for(const a of[-0.6+w,0.6-w]){x.beginPath();x.ellipse(-2,-6,20,6,a-1.2,0,7);x.fill()}
x.globalAlpha=1;x.fillStyle=b.c;x.beginPath();x.ellipse(0,0,14,8,-.3,0,7);x.fill();
x.fillStyle='#f2b705';x.beginPath();x.moveTo(-12,2);x.lineTo(-26,12);x.lineTo(-10,8);x.fill();
x.fillStyle='#3a2410';x.fillRect(12,-7,18,2.5);x.fillStyle='#fff3d6';x.beginPath();x.arc(8,-4,2.2,0,7);x.fill();x.restore()}
function loop(now){x.clearRect(0,0,540,960);flowers.forEach(f=>flower(f,now));
birds.forEach((b,i)=>{b.t++;const dx=b.tx-b.x,dy=b.ty-b.y,dist=Math.hypot(dx,dy);
if(dist>4){const k=dist>60?.12:.03;b.x+=dx*k;b.y+=dy*k}
b.y+=Math.sin(now*.003+i)*.4;if(b.t>180+i*40)pick(b)});
birds.forEach(b=>bird(b,now));requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if(window.self===window.top){addEventListener('load',()=>{try{const a=new AudioContext();const g=a.createGain();g.gain.value=.02;g.connect(a.destination);[220,330].forEach(f=>{const o=a.createOscillator();o.frequency.value=f;o.connect(g);o.start()})}catch(e){}})}
</script></body></html>
