<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<meta charset="utf-8">
<title>2026-11-07</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#141a2e}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:top left;background:#1b2340}
canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#moon{position:absolute;left:640px;top:250px;width:260px;height:260px;border-radius:50%;background:#e9dcc0;animation:m 40s ease-in-out infinite}
@keyframes m{0%,100%{transform:translateY(0)}50%{transform:translateY(30px)}}
#date{position:absolute;right:40px;bottom:30px;font:22px serif;color:#e9dcc0;opacity:.35;letter-spacing:4px}
</style></head><body>
<div id="stage"><div id="moon"></div><canvas id="c" width="540" height="960"></canvas><div id="date">2026-11-07</div></div>
<script>
const st=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);st.style.transform=`scale(${s})`;st.style.left=(innerWidth-1080*s)/2+'px';st.style.top=(innerHeight-1920*s)/2+'px'}
addEventListener('resize',fit);fit();
let seed=20261107;function R(){seed=(seed*16807)%2147483647;return seed/2147483647}
// tower: stacked floors, each with pagoda roof, offset impossibly; grows, holds, dissolves, regrows
const floors=[];let x=270,w=150;
for(let i=0;i<13;i++){x+=(R()-.5)*70;x=Math.max(130,Math.min(410,x));w=Math.max(60,w*(.9+R()*.12));floors.push({x,w,h:34+R()*16,s:R()>.5?1:-1})}
const c=document.getElementById('c'),g=c.getContext('2d');
const T=36;
function roof(cx,y,w,s,col){g.fillStyle=col;g.beginPath();g.moveTo(cx-w*.8,y+4*s);g.lineTo(cx-w*.45,y-12);g.lineTo(cx+w*.45,y-12);g.lineTo(cx+w*.8,y-4*s);g.lineTo(cx+w*.55,y);g.lineTo(cx-w*.55,y);g.closePath();g.fill()}
function draw(t){
 const p=(t/1000%T)/T;g.clearRect(0,0,540,960);
 // ground band: ink water
 g.fillStyle='#2b3a5e';g.fillRect(0,860,540,100);
 let grow=p<.6?p/.6*floors.length:floors.length;
 let y=860;
 for(let i=0;i<floors.length;i++){
  const f=floors[i];let k=Math.min(1,Math.max(0,grow-i));
  let fade=p>.85?1-(p-.85)/.15:1;if(k<=0)break;
  // joints slip and re-register
  const slip=Math.sin(t/3000+i*1.3)*6*(1-Math.min(1,Math.abs(Math.sin(t/7000))*1.4));
  const cx=f.x+slip,h=f.h*k;
  g.globalAlpha=fade*Math.min(1,k*1.5);
  g.fillStyle='#b8342a';g.fillRect(cx-f.w/2,y-h,f.w,h);
  g.fillStyle='#e9dcc0';for(let j=-1;j<=1;j++)g.fillRect(cx+j*f.w/3-5,y-h+8,10,Math.max(0,h-14));
  // reflection
  g.globalAlpha=fade*.25*k;g.fillStyle='#b8342a';g.fillRect(cx-f.w/2,860+(860-y),f.w,h*.6);
  g.globalAlpha=fade*Math.min(1,k*1.5);
  y-=h;roof(cx,y,f.w,f.s,'#0f1426');y-=10;
 }
 g.globalAlpha=1;
 // hidden guinea pig at waterline under first floor shadow
 g.fillStyle='#24304f';g.beginPath();g.ellipse(floors[0].x-f0off,866,5,3,0,0,7);g.fill();g.fillRect(floors[0].x-f0off+3,864,2,2);
 requestAnimationFrame(draw)}
const f0off=floors[0].w/2+14;
requestAnimationFrame(draw);
if(window.self===window.top){try{const a=new AudioContext(),o=a.createOscillator(),gn=a.createGain();o.frequency.value=98;gn.gain.value=.02;o.connect(gn).connect(a.destination);o.start()}catch(e){}}
</script></body></html>
