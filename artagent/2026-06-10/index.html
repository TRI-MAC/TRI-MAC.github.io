<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026-06-10 — Hall of Fame</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    #hof-badge {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.75);
      font-family: 'Georgia', serif;
      font-size: 11px;
      line-height: 1.4;
      padding: 7px 11px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9999;
      text-align: right;
      backdrop-filter: blur(4px);
      letter-spacing: 0.04em;
    }
    #hof-badge .label {
      display: block;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.7;
      margin-bottom: 2px;
    }
    #hof-date {
      position: fixed;
      bottom: 10px;
      right: 10px;
      color: rgba(255, 255, 255, 0.3);
      font-family: monospace;
      font-size: 10px;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <iframe src="https://tri-mac.github.io/artagent/2026-04-02/" allowfullscreen></iframe>
  <div id="hof-badge">
    <span class="label">Hall of Fame</span>
    2026-04-02
  </div>
  <div id="hof-date">2026-06-10</div>
</body>
</html>
