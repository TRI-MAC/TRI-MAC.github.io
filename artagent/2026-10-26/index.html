<!DOCTYPE html>
<html><head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;background:#f3ead6}
#stage{position:absolute;width:1080px;height:1920px;transform-origin:top left;background:#f6efdc;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#d{position:absolute;right:40px;bottom:30px;font:22px monospace;color:#2a2a2a;opacity:.45}
</style></head><body>
<div id="stage"><canvas id="c" width="540" height="960"></canvas><div id="d">2026-10-26</div></div>
<script>
const st=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);st.style.transform=`scale(${s})`;st.style.left=(innerWidth-1080*s)/2+'px';st.style.top=(innerHeight-1920*s)/2+'px'}
addEventListener('resize',fit);fit();
// Idea: "Folded weather" — a sheet of paper-coloured bands that fold along hinge lines; each fold reveals the hue printed on its back.
let seed=20261026;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const c=document.getElementById('c'),x=c.getContext('2d');
const fronts=['#f6efdc'],backs=['#e8412b','#1f8a5b','#2a5bd7','#f2a516','#e8578f'];
const N=9,bands=[];
for(let i=0;i<N;i++)bands.push({y:120+i*80,h:80,col:backs[Math.floor(R()*5)],ph:R()*6.28,dir:R()<.5?-1:1,sp:.15+R()*.12});
function draw(t){
x.fillStyle='#f6efdc';x.fillRect(0,0,540,960);
bands.forEach((b,i)=>{
 const f=(Math.sin(t*b.sp+b.ph)*.5+.5); // fold amount 0..1
 const w=440,x0=50;const hinge=x0+w*(b.dir>0?0.35+i%3*.1:0.65-i%3*.1);
 // flat part
 x.fillStyle='#ece2c9';x.fillRect(x0,b.y,w,b.h-6);
 // folded flap: from hinge to edge, rotated over hinge
 const flapW=b.dir>0?(x0+w-hinge):(hinge-x0);
 const proj=Math.cos(f*Math.PI)*flapW;
 const showBack=proj<0;
 const sk=Math.sin(f*Math.PI)*22;
 const ex=hinge+b.dir*proj;
 x.fillStyle='#f6efdc';
 x.fillRect(Math.min(hinge,b.dir>0?x0+w:x0),b.y,Math.abs(b.dir>0?x0+w-hinge:hinge-x0),b.h-6);
 x.beginPath();x.moveTo(hinge,b.y);x.lineTo(ex,b.y-sk);x.lineTo(ex,b.y+b.h-6+sk*.3);x.lineTo(hinge,b.y+b.h-6);x.closePath();
 x.fillStyle=showBack?b.col:'#fbf7ea';x.fill();
 x.strokeStyle='#222';x.lineWidth=2;x.stroke();
 x.fillStyle='#222';x.fillRect(hinge-1,b.y,2,b.h-6);
});
// tiny guinea pig tucked under bottom band edge
x.globalAlpha=.35;x.fillStyle='#b9a27a';x.beginPath();x.ellipse(478,836,5,3,0,0,7);x.fill();x.beginPath();x.arc(483,835,2,0,7);x.fill();x.globalAlpha=1;
}
function loop(ts){draw(ts/1000);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
