<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generative Artwork</title>
<style>
  :root{
    --bg:#0b0710;
    --paper:#16101d;
    --ink:#f05a28;
    --ink2:#f4c430;
    --ink3:#0f86ff;
    --ink4:#e31b6d;
    --ink5:#f7f0d8;
    --shadow:#050308;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#05040a;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7778vw,100vh);
    aspect-ratio:9/16;
    background:
      radial-gradient(circle at 25% 12%, rgba(240,90,40,.10), transparent 28%),
      radial-gradient(circle at 74% 18%, rgba(244,196,48,.09), transparent 22%),
      radial-gradient(circle at 65% 74%, rgba(15,134,255,.08), transparent 30%),
      linear-gradient(180deg, #110b16 0%, #09060d 100%);
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 40px 100px rgba(0,0,0,.55);
  }

  #underpaint, #paint, #grain{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
  }

  #stamp-layer{
    position:absolute; inset:0;
    padding:56px 54px 70px;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-auto-rows:1fr;
    gap:18px;
    z-index:5;
  }

  .stamp{
    position:relative;
    border-radius:8px;
    overflow:hidden;
    box-shadow:
      0 10px 24px rgba(0,0,0,.25),
      inset 0 0 0 1px rgba(255,255,255,.14);
    background:#1c1422;
    transform:scale(.82);
    opacity:0;
    filter:saturate(1.15) contrast(1.05);
    animation: populate 1200ms cubic-bezier(.2,.8,.2,1) forwards;
  }

  .stamp::before{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(90deg,
        transparent 0 6px,
        rgba(255,240,210,.85) 6px 7.4px,
        transparent 7.4px calc(100% / 14)
      );
    mix-blend-mode:overlay;
    opacity:.14;
    pointer-events:none;
  }

  .stamp::after{
    content:"";
    position:absolute; inset:6px;
    border:1px dashed rgba(255,245,220,.3);
    border-radius:4px;
    pointer-events:none;
    opacity:.7;
  }

  .perforation{
    position:absolute; inset:0;
    pointer-events:none;
    background:
      radial-gradient(circle at left center, transparent 0 8px, rgba(0,0,0,.35) 8.5px 9.5px, transparent 10px) left center/100% 14px repeat-y,
      radial-gradient(circle at right center, transparent 0 8px, rgba(0,0,0,.35) 8.5px 9.5px, transparent 10px) right center/100% 14px repeat-y,
      radial-gradient(circle at center top, transparent 0 8px, rgba(0,0,0,.35) 8.5px 9.5px, transparent 10px) center top/14px 100% repeat-x,
      radial-gradient(circle at center bottom, transparent 0 8px, rgba(0,0,0,.35) 8.5px 9.5px, transparent 10px) center bottom/14px 100% repeat-x;
    opacity:.45;
  }

  .stamp canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
  }

  .stamp .postal{
    position:absolute;
    right:10px;
    top:10px;
    width:44px;
    height:44px;
    border:1px solid rgba(255,248,230,.45);
    border-radius:50%;
    opacity:.22;
    transform:rotate(-9deg);
  }

  .stamp .postal::before,
  .stamp .postal::after{
    content:"";
    position:absolute;
    left:7px; right:7px;
    height:1px;
    background:rgba(255,248,230,.45);
  }
  .stamp .postal::before{top:16px}
  .stamp .postal::after{top:25px}

  .stamp .burst{
    position:absolute;
    inset:auto auto 10px 10px;
    width:60px;
    height:60px;
    opacity:.12;
    filter:blur(.2px);
  }

  .stamp .burst svg{width:100%;height:100%}

  .stamp.alive{
    animation:
      populate 1200ms cubic-bezier(.2,.8,.2,1) forwards,
      breathe 12s ease-in-out infinite;
  }

  #wash{
    position:absolute; inset:-8%;
    z-index:4;
    background:
      radial-gradient(circle at 22% 30%, rgba(227,27,109,.11), transparent 20%),
      radial-gradient(circle at 73% 42%, rgba(240,90,40,.11), transparent 24%),
      radial-gradient(circle at 40% 80%, rgba(244,196,48,.10), transparent 22%);
    mix-blend-mode:screen;
    filter:blur(22px);
    animation: washShift 28s ease-in-out infinite alternate;
    pointer-events:none;
  }

  #scribble-svg{
    position:absolute; inset:0;
    z-index:6;
    pointer-events:none;
    opacity:.42;
  }

  #date{
    position:absolute;
    right:12px;
    bottom:10px;
    z-index:20;
    color:rgba(255,245,230,.48);
    font-size:12px;
    letter-spacing:.12em;
    text-transform:none;
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:58px;
    bottom:104px;
    z-index:7;
    opacity:.56;
    filter:saturate(.9) contrast(.95) brightness(.78);
    transform:rotate(-5deg);
  }

  @keyframes populate{
    0%{opacity:0; transform:translateY(24px) scale(.72) rotate(-2.5deg); filter:blur(6px) saturate(.8)}
    100%{opacity:1; transform:translateY(0) scale(1) rotate(0deg); filter:blur(0) saturate(1.1)}
  }
  @keyframes breathe{
    0%,100%{transform:scale(1) rotate(0deg)}
    50%{transform:scale(1.018) rotate(.25deg)}
  }
  @keyframes washShift{
    0%{transform:translate3d(-1.5%, -1%, 0) scale(1)}
    100%{transform:translate3d(1.5%, 1%, 0) scale(1.04)}
  }
</style>
</head>
<body>
  <div id="frame">
    <canvas id="underpaint" width="1080" height="1920"></canvas>
    <div id="wash"></div>
    <div id="stamp-layer"></div>
    <svg id="scribble-svg" viewBox="0 0 1080 1920" preserveAspectRatio="none"></svg>
    <canvas id="paint" width="1080" height="1920"></canvas>
    <canvas id="grain" width="1080" height="1920"></canvas>
    <img id="guinea-pig" src="guineapig.png" alt="">
    <div id="date">2026-04-10</div>
  </div>

<script>
(() => {
  const DATE = "2026-04-10";
  const W = 1080, H = 1920;

  function xmur3(str){
    let h = 1779033703 ^ str.length;
    for(let i=0;i<str.length;i++){
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = h << 13 | h >>> 19;
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    }
  }
  function sfc32(a,b,c,d){
    return function(){
      a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
      let t = (a + b) | 0;
      a = b ^ b >>> 9;
      b = c + (c << 3) | 0;
      c = (c << 21 | c >>> 11);
      d = d + 1 | 0;
      t = t + d | 0;
      c = c + t | 0;
      return (t >>> 0) / 4294967296;
    }
  }
  const seed = xmur3(DATE + "-abstract-expressionist-stamps");
  const rand = sfc32(seed(), seed(), seed(), seed());
  const rnd = (a=1,b=0)=> b + rand()*(a-b);
  const pick = arr => arr[Math.floor(rand()*arr.length)];

  const palette = [
    "#f05a28", "#f4c430", "#e31b6d", "#0f86ff", "#f7f0d8",
    "#18101f", "#8b1e3f", "#ff7f11", "#203a8f", "#f25f5c"
  ];

  function drawBackground(){
    const c = document.getElementById('underpaint');
    const ctx = c.getContext('2d');

    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#120a16");
    g.addColorStop(.55,"#0a0710");
    g.addColorStop(1,"#050309");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    for(let i=0;i<20;i++){
      const x = rnd(W), y = rnd(H);
      const r = rnd(360,120);
      const rg = ctx.createRadialGradient(x,y,0,x,y,r);
      const col = pick(["rgba(240,90,40,.14)","rgba(244,196,48,.10)","rgba(15,134,255,.11)","rgba(227,27,109,.10)"]);
      rg.addColorStop(0,col);
      rg.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fill();
    }

    ctx.globalAlpha = .10;
    for(let i=0;i<14;i++){
      ctx.save();
      ctx.translate(rnd(W), rnd(H));
      ctx.rotate(rnd(Math.PI));
      ctx.fillStyle = pick(["#f05a28","#e31b6d","#0f86ff","#f4c430"]);
      ctx.fillRect(-rnd(200,80), -rnd(800,220), rnd(450,130), rnd(70,18));
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function makeStampCanvas(canvas, index){
    const ctx = canvas.getContext('2d');
    const w = canvas.width = 230;
    const h = canvas.height = 310;

    const bg1 = pick(["#221523","#1a1020","#19111a","#231719"]);
    const bg2 = pick(["#3b1a28","#14243f","#4e220f","#3d1230","#2f2510"]);
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,bg1);
    g.addColorStop(1,bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    for(let k=0;k<3;k++){
      const rg = ctx.createRadialGradient(rnd(w),rnd(h),0,rnd(w),rnd(h),rnd(160,80));
      rg.addColorStop(0,pick(["rgba(244,196,48,.22)","rgba(240,90,40,.22)","rgba(227,27,109,.22)","rgba(15,134,255,.18)"]));
      rg.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle = rg;
      ctx.fillRect(0,0,w,h);
    }

    for(let p=0;p<14;p++){
      ctx.save();
      ctx.translate(rnd(w), rnd(h));
      ctx.rotate(rnd(Math.PI*2));
      ctx.globalAlpha = rnd(.35,.08);
      ctx.fillStyle = pick(palette);
      const ww = rnd(120,28), hh = rnd(46,8);
      ctx.fillRect(-ww/2,-hh/2,ww,hh);
      ctx.restore();
    }

    for(let p=0;p<9;p++){
      ctx.save();
      ctx.translate(rnd(w), rnd(h));
      ctx.rotate(rnd(Math.PI*2));
      ctx.strokeStyle = pick(["rgba(247,240,216,.75)","rgba(244,196,48,.8)","rgba(240,90,40,.8)","rgba(15,134,255,.75)"]);
      ctx.lineWidth = rnd(16,5);
      ctx.lineCap = "round";
      ctx.globalAlpha = rnd(.95,.35);
      ctx.beginPath();
      const len = rnd(120,45);
      ctx.moveTo(-len*0.6, -rnd(20));
      ctx.bezierCurveTo(-len*0.2, rnd(50,-50), len*0.15, rnd(50,-50), len*0.6, rnd(18,-18));
      ctx.stroke();
      ctx.restore();
    }

    for(let c=0;c<5;c++){
      ctx.save();
      ctx.translate(rnd(w), rnd(h));
      ctx.rotate(rnd(Math.PI*2));
      ctx.globalAlpha = rnd(.7,.25);
      ctx.fillStyle = pick(["#f4c430","#f7f0d8","#e31b6d","#0f86ff"]);
      const sides = [3,4,5][Math.floor(rnd(3))];
      const radius = rnd(54,18);
      ctx.beginPath();
      for(let i=0;i<sides;i++){
        const a = i/sides*Math.PI*2;
        const px = Math.cos(a)*radius*(i%2?0.8:1);
        const py = Math.sin(a)*radius;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    ctx.globalAlpha = .17;
    for(let i=0;i<120;i++){
      ctx.fillStyle = i%4===0 ? "#f7f0d8" : pick(["#f05a28","#e31b6d","#0f86ff","#f4c430"]);
      ctx.fillRect(rnd(w), rnd(h), rnd(4,1), rnd(4,1));
    }
    ctx.globalAlpha = 1;

    ctx.strokeStyle = "rgba(255,245,220,.18)";
    ctx.lineWidth = 1;
    ctx.strokeRect(7.5,7.5,w-15,h-15);
  }

  function buildStamp(index){
    const stamp = document.createElement('div');
    stamp.className = 'stamp alive';
    stamp.style.animationDelay = `${index * 0.65}s, ${2 + index * 0.09}s`;

    const canvas = document.createElement('canvas');
    makeStampCanvas(canvas, index);
    stamp.appendChild(canvas);

    const perf = document.createElement('div');
    perf.className = 'perforation';
    stamp.appendChild(perf);

    const postal = document.createElement('div');
    postal.className = 'postal';
    stamp.appendChild(postal);

    const burst = document.createElement('div');
    burst.className = 'burst';
    burst.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">
      <g stroke="rgba(255,245,220,.85)" stroke-width="2.6" stroke-linecap="round">
        ${Array.from({length:12},(_,i)=>{
          const a = i*Math.PI*2/12, x1=50+Math.cos(a)*12, y1=50+Math.sin(a)*12, x2=50+Math.cos(a)*38, y2=50+Math.sin(a)*38;
          return `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"/>`
        }).join('')}
      </g>
    </svg>`;
    stamp.appendChild(burst);
    return stamp;
  }

  function populateStamps(){
    const layer = document.getElementById('stamp-layer');
    const total = 24;
    for(let i=0;i<total;i++){
      const s = buildStamp(i);
      if(rand() < .28) s.style.transform = `scale(1) rotate(${rnd(1.4,-1.4).toFixed(2)}deg)`;
      layer.appendChild(s);
    }
  }

  function drawScribbles(){
    const svg = document.getElementById('scribble-svg');
    const colors = ["rgba(244,196,48,.42)","rgba(240,90,40,.38)","rgba(247,240,216,.28)","rgba(15,134,255,.26)"];
    const paths = [];
    for(let i=0;i<7;i++){
      let x = rnd(120,960), y = rnd(100,1820);
      let d = `M ${x.toFixed(1)} ${y.toFixed(1)} `;
      for(let j=0;j<5;j++){
        const x1 = x + rnd(180,-180), y1 = y + rnd(180,-180);
        const x2 = x1 + rnd(180,-180), y2 = y1 + rnd(180,-180);
        const x3 = x2 + rnd(160,-160), y3 = y2 + rnd(160,-160);
        d += `C ${x1.toFixed(1)} ${y1.toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}, ${x3.toFixed(1)} ${y3.toFixed(1)} `;
        x = x3; y = y3;
      }
      paths.push(`<path d="${d}" fill="none" stroke="${pick(colors)}" stroke-width="${rnd(18,7).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round" opacity="${rnd(.55,.18).toFixed(2)}">
        <animate attributeName="stroke-dasharray" values="0 1800;500 1300;0 1800" dur="${rnd(28,18).toFixed(1)}s" repeatCount="indefinite"/>
        <animate attributeName="stroke-dashoffset" values="0;-240;0" dur="${rnd(30,20).toFixed(1)}s" repeatCount="indefinite"/>
      </path>`);
    }
    svg.innerHTML = paths.join('');
  }

  function drawTopPaint(){
    const c = document.getElementById('paint');
    const ctx = c.getContext('2d');

    function pass(t){
      ctx.clearRect(0,0,W,H);
      ctx.globalCompositeOperation = "source-over";

      for(let i=0;i<10;i++){
        ctx.save();
        const yy = 220 + i*155 + Math.sin(t*0.00018 + i)*22;
        ctx.translate(W/2 + Math.sin(t*0.00013 + i*0.7)*65, yy);
        ctx.rotate(Math.sin(t*0.00009 + i*0.4)*0.08 + i*0.08);
        const lg = ctx.createLinearGradient(-320,0,320,0);
        lg.addColorStop(0, "rgba(247,240,216,0)");
        lg.addColorStop(.2, pick(["rgba(240,90,40,.12)","rgba(244,196,48,.10)","rgba(15,134,255,.11)","rgba(227,27,109,.11)"]));
        lg.addColorStop(.5, "rgba(247,240,216,.10)");
        lg.addColorStop(.8, pick(["rgba(240,90,40,.12)","rgba(244,196,48,.10)","rgba(15,134,255,.11)","rgba(227,27,109,.11)"]));
        lg.addColorStop(1, "rgba(247,240,216,0)");
        ctx.fillStyle = lg;
        ctx.fillRect(-340, -26, 680, 52);
        ctx.restore();
      }

      ctx.globalCompositeOperation = "lighter";
      for(let i=0;i<8;i++){
        const x = (i%2? .22:.78)*W + Math.sin(t*0.00015+i)*120;
        const y = (i/8)*H + 180 + Math.cos(t*0.00011+i*2)*90;
        const rg = ctx.createRadialGradient(x,y,0,x,y,160);
        rg.addColorStop(0,pick(["rgba(244,196,48,.10)","rgba(240,90,40,.08)","rgba(227,27,109,.08)"]));
        rg.addColorStop(1,"rgba(0,0,0,0)");
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.arc(x,y,160,0,Math.PI*2);
        ctx.fill();
      }

      requestAnimationFrame(pass);
    }
    requestAnimationFrame(pass);
  }

  function drawGrain(){
    const c = document.getElementById('grain');
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(W,H);
    const data = img.data;
    for(let i=0;i<data.length;i+=4){
      const v = Math.floor(rand()*255);
      data[i]=data[i+1]=data[i+2]=v;
      data[i+3]=16;
    }
    ctx.putImageData(img,0,0);
    c.style.mixBlendMode = "soft-light";
    c.style.opacity = ".22";
  }

  drawBackground();
  populateStamps();
  drawScribbles();
  drawTopPaint();
  drawGrain();
})();
</script>
</body>
</html>
