<!DOCTYPE html>
<html><head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#efe9dc}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:top left;background:linear-gradient(#f4efe4,#ece3d2 70%,#f0d9c6);overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%}
#sun{position:absolute;left:690px;top:330px;width:150px;height:150px;border-radius:50%;background:#e2502c;animation:s 40s ease-in-out infinite}
@keyframes s{50%{transform:translateY(24px)}}
#date{position:absolute;right:46px;bottom:40px;font:16px/1 Helvetica,Arial,sans-serif;letter-spacing:3px;color:#1c2530;opacity:.35}
#guinea-pig{position:absolute;left:30px;bottom:24px;width:14px;opacity:.3}
</style></head><body>
<div id="stage"><div id="sun"></div><canvas id="c" width="540" height="960"></canvas>
<img id="guinea-pig" src="guineapig.png" alt=""><div id="date">2026.11.28</div></div>
<script>
const st=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);st.style.transform=`translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
let seed=20261128;const R=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=540,H=960,N=420,B=[];
for(let i=0;i<N;i++)B.push({x:200+R()*140,y:380+R()*120,vx:R()-.5,vy:R()-.5});
let t=0,last=performance.now(),acc=0;
function step(){t+=1/60;
const cx=270+150*Math.sin(t*.11)+60*Math.sin(t*.29),cy=430+170*Math.sin(t*.07+1)+50*Math.cos(t*.23);
const cell={};for(const b of B){const k=(b.x/30|0)+','+(b.y/30|0);(cell[k]||(cell[k]=[])).push(b)}
for(const b of B){let ax=0,ay=0,cx2=0,cy2=0,sx=0,sy=0,n=0;const gx=b.x/30|0,gy=b.y/30|0;
for(let i=-1;i<2;i++)for(let j=-1;j<2;j++){const c=cell[(gx+i)+','+(gy+j)];if(!c)continue;
for(const o of c){if(o===b)continue;const dx=o.x-b.x,dy=o.y-b.y,d=dx*dx+dy*dy;if(d<900){n++;ax+=o.vx;ay+=o.vy;cx2+=o.x;cy2+=o.y;if(d<40){sx-=dx/(d+1);sy-=dy/(d+1)}}}}
if(n){b.vx+=(ax/n-b.vx)*.06+(cx2/n-b.x)*.002;b.vy+=(ay/n-b.vy)*.06+(cy2/n-b.y)*.002}
b.vx+=sx*.6+(cx-b.x)*.0009;b.vy+=sy*.6+(cy-b.y)*.0009;
const v=Math.hypot(b.vx,b.vy),m=Math.min(2.4,Math.max(1.3,v));b.vx*=m/v;b.vy*=m/v;b.x+=b.vx;b.y+=b.vy}}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#1c2530';
for(const b of B){const a=Math.atan2(b.vy,b.vx),f=Math.sin(t*14+b.x)*.9;x.save();x.translate(b.x,b.y);x.rotate(a);
x.beginPath();x.moveTo(2.2,0);x.lineTo(-1.5,-2.6*f-.6);x.lineTo(-.6,0);x.lineTo(-1.5,2.6*f+.6);x.closePath();x.fill();x.restore()}}
function loop(n){acc+=n-last;last=n;let k=0;while(acc>=16.67&&k<2){step();acc-=16.67;k++}if(k==2)acc=0;draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if(window.self===window.top){addEventListener('load',()=>{try{const a=new AudioContext(),g=a.createGain();g.gain.value=.02;g.connect(a.destination);[110,164.8].forEach(f=>{const o=a.createOscillator();o.frequency.value=f;o.connect(g);o.start()})}catch(e){}})}
</script></body></html>
