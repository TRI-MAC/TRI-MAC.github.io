<div id="stage">

<g transform="translate(1012,1828)" opacity=".55"><ellipse cx="0" cy="0" rx="9" ry="6" fill="#6e4628"/><circle cx="7" cy="-2" r="4" fill="#6e4628"/><circle cx="9" cy="-3" r="1" fill="#2a1a10"/></g>

</div>
<script>
const st=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);st.style.transform=`scale(${s})`;st.style.left=(innerWidth-1080*s)/2+'px';st.style.top=(innerHeight-1920*s)/2+'px'}
addEventListener('resize',fit);fit();
// Idea: a mid-century "kidney" table seen from above — its shadow pools slide as the sun crosses; where shadow and table overlap, colour inverts to teal.
let seed=20261119;function r(){seed=(seed*16807)%2147483647;return seed/2147483647}
const c=document.getElementById('c'),x=c.getContext('2d');
const blobs=[];for(let i=0;i<3;i++)blobs.push({cx:120+r()*300,cy:200+i*260+r()*80,a:90+r()*60,b:50+r()*40,p:r()*6});
function kidney(b,dx,dy){x.beginPath();for(let t=0;t<=6.3;t+=.1){const k=1-.35*Math.cos(t*2+b.p);x.lineTo(b.cx+dx+Math.cos(t)*b.a*k,b.cy+dy+Math.sin(t)*b.b*k)}x.closePath()}
function f(ms){const t=ms/1000,sun=Math.sin(t*2*Math.PI/40);
x.clearRect(0,0,540,960);
x.fillStyle='#d4a22c';x.fillRect(0,0,540,140);x.fillRect(0,820,540,140);
x.fillStyle='#4a7d78';x.fillRect(0,140,30,680);x.fillRect(510,140,30,680);
blobs.forEach((b,i)=>{const dx=sun*60,dy=30+Math.cos(t*.15+i)*10;
x.fillStyle='rgba(59,42,30,.45)';kidney(b,dx,dy);x.fill();
x.fillStyle=['#d4a22c','#a8432a','#e8d6b0'][i];kidney(b,0,0);x.fill();
x.save();kidney(b,0,0);x.clip();x.fillStyle='#2f6f6a';kidney(b,dx,dy);x.fill();x.restore();
x.strokeStyle='#3b2a1e';x.lineWidth=5;for(const s of[-1,1]){x.beginPath();x.moveTo(b.cx+s*b.a*.5,b.cy+b.b*.6);x.lineTo(b.cx+s*b.a*.7+dx*.3,b.cy+b.b+40);x.stroke()}});
x.fillStyle='#3b2a1e';for(let i=0;i<9;i++){x.beginPath();x.arc(60+i*52,70,10+5*Math.sin(t*.3+i),0,7);x.fill()}
requestAnimationFrame(f)}requestAnimationFrame(f);
if(window.self===window.top){addEventListener('load',()=>{try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=110;g.gain.value=.02;o.connect(g).connect(a.destination);o.start()}catch(e){}})}
</script></body></html>
