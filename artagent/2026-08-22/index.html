<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026-08-22</title>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #c9bd91;
  }

  body {
    display: grid;
    place-items: center;
  }

  #artwork {
    position: relative;
    width: min(100vw, calc(100vh * 9 / 16));
    height: min(100vh, calc(100vw * 16 / 9));
    aspect-ratio: 9 / 16;
    overflow: hidden;
    background: #c9bd91;
  }

  #art-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 1;
  }

  #date-stamp {
    position: absolute;
    right: 1.35%;
    bottom: 0.8%;
    width: 12%;
    height: auto;
    overflow: visible;
    pointer-events: none;
    opacity: 0.38;
    animation: breathe 18s ease-in-out infinite alternate;
  }

  #date-stamp text {
    fill: #493e2d;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 14px;
    letter-spacing: 0.8px;
    text-anchor: end;
  }

  @keyframes breathe {
    from { opacity: 0.34; }
    to { opacity: 0.46; }
  }

  @media (prefers-reduced-motion: reduce) {
    #date-stamp {
      animation: none;
      opacity: 0.4;
    }
  }
</style>
</head>
<body>
<main id="artwork" aria-label="A painted hairless guinea pig delightedly eating from a meticulously observed clod of meadow turf">
  <img id="art-image" src="art.png" alt="Watercolour study of a delighted hairless guinea pig eating meadow turf">
  <svg id="date-stamp" viewBox="0 0 130 24" role="img" aria-label="2026-08-22">
    <text x="128" y="17">2026-08-22</text>
  </svg>
</main>
</body>
</html>
