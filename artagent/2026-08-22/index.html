<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title></title>
<style>
  :root {
    --portrait-cycle: 22s;
    --light-cycle: 26s;
    --phase: -8s;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #3b292b;
  }

  body {
    display: grid;
    place-items: center;
    font-family: Arial, Helvetica, sans-serif;
  }

  #artwork {
    position: relative;
    width: min(100vw, 56.25vh);
    aspect-ratio: 9 / 16;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(circle at 50% 39%, #a97972 0%, #76504e 38%, #3b292b 78%, #251d20 100%);
  }

  #background-video {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
    opacity: 1;
    background: #76504e;
  }

  #portrait-light {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #soft-focus {
    transform-box: fill-box;
    transform-origin: center;
    animation: focusBreath var(--portrait-cycle) ease-in-out infinite;
  }

  #left-light {
    transform-box: fill-box;
    transform-origin: 35% 45%;
    animation: leftLight var(--light-cycle) ease-in-out infinite;
    animation-delay: var(--phase);
  }

  #right-light {
    transform-box: fill-box;
    transform-origin: 65% 45%;
    animation: rightLight var(--light-cycle) ease-in-out infinite;
    animation-delay: calc(var(--phase) * 0.6);
  }

  #lower-warmth {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: lowerBreath var(--portrait-cycle) ease-in-out infinite;
    animation-delay: calc(var(--phase) * 0.35);
  }

  #edge-depth {
    animation: depthPulse var(--light-cycle) ease-in-out infinite;
  }

  @keyframes focusBreath {
    0%, 100% {
      transform: scale(0.985);
      opacity: 0.76;
    }
    50% {
      transform: scale(1.025);
      opacity: 1;
    }
  }

  @keyframes leftLight {
    0%, 100% {
      transform: translate3d(-1.2%, 0, 0) scale(1);
      opacity: 0.7;
    }
    50% {
      transform: translate3d(1.2%, -0.5%, 0) scale(1.025);
      opacity: 1;
    }
  }

  @keyframes rightLight {
    0%, 100% {
      transform: translate3d(1%, 0.4%, 0) scale(1.02);
      opacity: 0.82;
    }
    50% {
      transform: translate3d(-1.1%, -0.4%, 0) scale(0.99);
      opacity: 1;
    }
  }

  @keyframes lowerBreath {
    0%, 100% {
      transform: translate3d(0, 1%, 0) scaleX(1.02) scaleY(0.98);
      opacity: 0.74;
    }
    50% {
      transform: translate3d(0, -0.8%, 0) scaleX(0.98) scaleY(1.025);
      opacity: 1;
    }
  }

  @keyframes depthPulse {
    0%, 100% { opacity: 0.86; }
    50% { opacity: 1; }
  }

  #date-stamp {
    position: absolute;
    z-index: 3;
    right: 2.4%;
    bottom: 1.5%;
    color: rgba(255, 239, 223, 0.54);
    font-size: clamp(8px, 1.05vw, 12px);
    line-height: 1;
    font-weight: 500;
    letter-spacing: 0.13em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(31, 20, 22, 0.55);
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    #portrait-light g {
      animation: none !important;
    }
  }
</style>
</head>
<body>
<main id="artwork" aria-label="Portrait study of Pickles, a hairless guinea pig">
  <video
    id="background-video"
    src="background.mp4"
    autoplay
    loop
    muted
    playsinline
    preload="auto"
    aria-label="Pickles, a hairless guinea pig">
  </video>

  <svg id="portrait-light" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <radialGradient id="focusGlow" cx="50%" cy="40%" r="57%">
        <stop offset="0%" stop-color="#ffe0ca" stop-opacity="0.19"/>
        <stop offset="34%" stop-color="#e8ad98" stop-opacity="0.09"/>
        <stop offset="72%" stop-color="#a66f6d" stop-opacity="0.025"/>
        <stop offset="100%" stop-color="#7d5052" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="leftWash" x1="0%" y1="25%" x2="100%" y2="70%">
        <stop offset="0%" stop-color="#4a3438" stop-opacity="0.32"/>
        <stop offset="56%" stop-color="#7d5554" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#ba8278" stop-opacity="0"/>
      </linearGradient>

      <linearGradient id="rightWash" x1="100%" y1="22%" x2="0%" y2="72%">
        <stop offset="0%" stop-color="#2e272b" stop-opacity="0.29"/>
        <stop offset="58%" stop-color="#69494c" stop-opacity="0.07"/>
        <stop offset="100%" stop-color="#ad756e" stop-opacity="0"/>
      </linearGradient>

      <radialGradient id="lowerGlow" cx="50%" cy="92%" r="60%">
        <stop offset="0%" stop-color="#e99b88" stop-opacity="0.19"/>
        <stop offset="52%" stop-color="#b76f68" stop-opacity="0.07"/>
        <stop offset="100%" stop-color="#6e4549" stop-opacity="0"/>
      </radialGradient>

      <radialGradient id="edgeShade" cx="50%" cy="43%" r="77%">
        <stop offset="0%" stop-color="#211a1d" stop-opacity="0"/>
        <stop offset="59%" stop-color="#211a1d" stop-opacity="0"/>
        <stop offset="82%" stop-color="#211a1d" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#171316" stop-opacity="0.35"/>
      </radialGradient>

      <linearGradient id="upperCream" x1="50%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%" stop-color="#ffe5cc" stop-opacity="0.12"/>
        <stop offset="62%" stop-color="#e7b9a2" stop-opacity="0.025"/>
        <stop offset="100%" stop-color="#c58e83" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <g id="soft-focus">
      <ellipse cx="540" cy="760" rx="500" ry="790" fill="url(#focusGlow)"/>
      <path d="M155 0H925L828 525L540 690L252 525Z" fill="url(#upperCream)" opacity="0.72"/>
    </g>

    <g id="left-light">
      <path d="M0 0H310L470 590L355 1210L0 1590Z" fill="url(#leftWash)"/>
    </g>

    <g id="right-light">
      <path d="M1080 0H780L625 610L735 1240L1080 1575Z" fill="url(#rightWash)"/>
    </g>

    <g id="lower-warmth">
      <ellipse cx="540" cy="1710" rx="570" ry="640" fill="url(#lowerGlow)"/>
    </g>

    <g id="edge-depth">
      <rect width="1080" height="1920" fill="url(#edgeShade)"/>
    </g>
  </svg>

  <time id="date-stamp" datetime="2026-08-22">2026-08-22</time>
</main>

<script>
(() => {
  const dateSeed = 20260822;
  const portraitCycle = 18 + (dateSeed % 9);
  const lightCycle = 24 + (Math.floor(dateSeed / 10) % 8);
  const phase = -(dateSeed % 13);

  document.documentElement.style.setProperty("--portrait-cycle", portraitCycle + "s");
  document.documentElement.style.setProperty("--light-cycle", lightCycle + "s");
  document.documentElement.style.setProperty("--phase", phase + "s");

  const video = document.getElementById("background-video");
  video.muted = true;
  video.defaultMuted = true;

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  if (reducedMotion.matches) {
    video.addEventListener("loadeddata", () => {
      video.currentTime = Math.min(0.5, video.duration || 0.5);
      video.pause();
    }, { once: true });
  } else {
    const attemptPlayback = () => {
      const promise = video.play();
      if (promise && typeof promise.catch === "function") {
        promise.catch(() => {});
      }
    };
    if (video.readyState >= 2) attemptPlayback();
    else video.addEventListener("canplay", attemptPlayback, { once: true });
  }
})();
</script>
</body>
</html>
