<style>
  :root {
    color-scheme: light;
    background: #6f4f50;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 42%, #d8b29f 0 20%, #aa7772 54%, #664849 100%);
  }

  #artwork {
    position: relative;
    width: min(100vw, 56.25vh);
    height: min(177.7777778vw, 100vh);
    aspect-ratio: 9 / 16;
    overflow: hidden;
    isolation: isolate;
    background: #bd8b7f;
  }

  #atmosphere,
  #portrait {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #atmosphere {
    z-index: 0;
  }

  #portrait {
    z-index: 1;
  }

  #body-breath {
    transform-box: fill-box;
    transform-origin: 47% 62%;
    animation: breathe 8s ease-in-out infinite;
  }

  #chest-light {
    transform-box: fill-box;
    transform-origin: center;
    animation: chestLight 8s ease-in-out infinite;
  }

  #ear-left,
  #ear-right {
    transform-box: fill-box;
    transform-origin: 50% 18%;
    animation: earListen 12s ease-in-out infinite;
  }

  #ear-right {
    animation-delay: -5.8s;
  }

  #nose {
    transform-box: fill-box;
    transform-origin: center;
    animation: noseBreath 5s ease-in-out infinite;
  }

  #whiskers-left {
    transform-box: fill-box;
    transform-origin: 100% 50%;
    animation: whiskerLeft 7s ease-in-out infinite;
  }

  #whiskers-right {
    transform-box: fill-box;
    transform-origin: 0 50%;
    animation: whiskerRight 7s ease-in-out infinite;
  }

  #eye-glints {
    animation: glint 10s ease-in-out infinite;
  }

  #date {
    position: absolute;
    z-index: 2;
    right: 3.1%;
    bottom: 1.8%;
    color: rgba(255, 241, 227, 0.58);
    font: 500 clamp(8px, 1.35vw, 14px)/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.16em;
    pointer-events: none;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(1.009, 1.018); }
  }

  @keyframes chestLight {
    0%, 100% { opacity: 0.52; transform: scale(0.99); }
    50% { opacity: 0.7; transform: scale(1.025); }
  }

  @keyframes earListen {
    0%, 35%, 100% { transform: rotate(0deg); }
    48% { transform: rotate(-1.8deg); }
    60% { transform: rotate(0.8deg); }
  }

  @keyframes noseBreath {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.025); }
  }

  @keyframes whiskerLeft {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-1.2deg); }
  }

  @keyframes whiskerRight {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(1.2deg); }
  }

  @keyframes glint {
    0%, 100% { opacity: 0.88; }
    50% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    #body-breath,
    #chest-light,
    #ear-left,
    #ear-right,
    #nose,
    #whiskers-left,
    #whiskers-right,
    #eye-glints {
      animation: none;
    }
  }
</style>

<script>
(() => {
  const canvas = document.getElementById('atmosphere');
  const ctx = canvas.getContext('2d', { alpha: false });
  const w = canvas.width;
  const h = canvas.height;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw(time) {
    const t = reduced ? 0 : time * 0.00008;
    const driftX = Math.sin(t * Math.PI * 2) * 9;
    const driftY = Math.cos(t * Math.PI * 2) * 7;

    const base = ctx.createLinearGradient(0, 0, w, h);
    base.addColorStop(0, '#d1a18e');
    base.addColorStop(0.36, '#b77e76');
    base.addColorStop(0.72, '#8b5d60');
    base.addColorStop(1, '#62464c');
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, w, h);

    const upperLight = ctx.createRadialGradient(
      148 + driftX, 188 + driftY, 8,
      148 + driftX, 188 + driftY, 220
    );
    upperLight.addColorStop(0, 'rgba(255,224,199,0.48)');
    upperLight.addColorStop(0.48, 'rgba(232,177,153,0.22)');
    upperLight.addColorStop(1, 'rgba(164,100,99,0)');
    ctx.fillStyle = upperLight;
    ctx.fillRect(0, 0, w, h);

    const subjectLight = ctx.createRadialGradient(
      176 - driftX * 0.35, 379, 18,
      176 - driftX * 0.35, 379, 190
    );
    subjectLight.addColorStop(0, 'rgba(255,218,192,0.22)');
    subjectLight.addColorStop(0.6, 'rgba(224,158,141,0.11)');
    subjectLight.addColorStop(1, 'rgba(105,67,73,0)');
    ctx.fillStyle = subjectLight;
    ctx.fillRect(0, 150, w, 440);

    const lower = ctx.createLinearGradient(0, 360, 0, h);
    lower.addColorStop(0, 'rgba(73,48,54,0)');
    lower.addColorStop(1, 'rgba(62,43,49,0.5)');
    ctx.fillStyle = lower;
    ctx.fillRect(0, 360, w, h - 360);

    if (!reduced) requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>
