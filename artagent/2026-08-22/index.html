<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="utf-8">
<title>Pickles</title>
<style>
  html,body{margin:0;padding:0;background:#e8dccb;overflow:hidden;height:100%;}
  body{display:flex;align-items:center;justify-content:center;}
  #stage{
    position:relative;
    width:1080px;height:1920px;
    max-width:100vw;max-height:100vh;
    aspect-ratio:1080/1920;
    background:#f0e4d2;
    overflow:hidden;
  }
  @media (max-aspect-ratio:1080/1920){ #stage{width:100vw;height:auto;} }
  @media (min-aspect-ratio:1080/1920){ #stage{height:100vh;width:auto;} }

  /* ---- warm painted ground, continuing the video's palette outward ---- */
  #ground{
    position:absolute;inset:0;
    background:
      radial-gradient(120% 70% at 50% 34%, #f7ecd9 0%, #e9d6bb 42%, #cdb193 74%, #a98a6d 100%),
      linear-gradient(#e9d6bb,#c9a988);
  }
  #ground2{
    position:absolute;inset:0;
    background:
      radial-gradient(58% 34% at 50% 41%, rgba(255,247,232,.55) 0%, rgba(255,247,232,0) 70%),
      linear-gradient(to top, rgba(126,96,74,.55) 0%, rgba(126,96,74,0) 38%);
  }

  /* ---- straw-bedding bands behind the video ---- */
  #strawBack{position:absolute;left:-6%;right:-6%;bottom:-4%;height:46%;}

  /* ---- the video: full-bleed, unfiltered, prominent ---- */
  #background-video{
    position:absolute;
    left:50%;top:47%;
    width:104%;
    transform:translate(-50%,-50%);
    opacity:0.97;
    object-fit:cover;
    height:74%;
  }

  /* soft feathered edge so the video rectangle dissolves into the painted ground */
  #feather{
    position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
    width:106%;height:76%;
    pointer-events:none;
    background:
      radial-gradient(74% 62% at 50% 50%, rgba(233,214,187,0) 52%, rgba(233,214,187,.55) 78%, rgba(214,188,157,.96) 100%);
  }

  /* single blended overlay: paper grain + warm bloom, ONE blend pass */
  #grade{
    position:absolute;inset:0;
    mix-blend-mode:soft-light;
    opacity:.55;
    background:
      radial-gradient(70% 46% at 50% 44%, rgba(255,240,214,.85) 0%, rgba(255,240,214,0) 68%),
      repeating-linear-gradient(102deg, rgba(120,84,58,.16) 0 2px, rgba(255,255,255,0) 2px 5px),
      linear-gradient(to bottom, rgba(90,64,48,.30), rgba(255,236,206,.10) 45%, rgba(78,54,40,.34));
  }

  /* ---- straw strokes in front, breaking the video's lower edge ---- */
  #strawFront{position:absolute;left:-6%;right:-6%;bottom:-3%;height:34%;}

  #dust{position:absolute;inset:0;width:100%;height:100%;}

  #date{
    position:absolute;right:26px;bottom:20px;
    font:400 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.20em;
    color:#4a3324;opacity:.42;
    z-index:40;
  }

  /* very slow breathing of the whole warm light, transform/opacity only */
  @keyframes bloom{0%{opacity:.40}50%{opacity:.62}100%{opacity:.40}}
  #ground2{animation:bloom 19s ease-in-out infinite;}
  @keyframes drift{0%{transform:translate(-50%,-50%) scale(1.000)}50%{transform:translate(-50%,-50%) scale(1.012)}100%{transform:translate(-50%,-50%) scale(1.000)}}
  #background-video{animation:drift 38s ease-in-out infinite;}
</style>
</head>
<body>
<div id="stage">
  <div id="ground"></div>

  <!-- straw bedding behind -->
  <svg id="strawBack" viewBox="0 0 1200 900" preserveAspectRatio="none" aria-hidden="true">
    <g id="strawBackG"></g>
  </svg>

  <video id="background-video" src="background.mp4" autoplay loop muted playsinline></video>

  <div id="feather"></div>
  <div id="ground2"></div>

  <!-- straw bedding in front, overlapping the video edge -->
  <svg id="strawFront" viewBox="0 0 1200 700" preserveAspectRatio="none" aria-hidden="true">
    <g id="strawFrontG"></g>
  </svg>

  <canvas id="dust" width="540" height="960"></canvas>
  <div id="grade"></div>
  <div id="date">2026 · 08 · 22</div>
</div>

<script>
(function(){
  /* ---------- date seed ---------- */
  var SEED = 2026*10000 + 8*100 + 22;
  var s = SEED % 2147483647;
  function rnd(){ s = (s*16807) % 2147483647; return (s-1)/2147483646; }
  function rr(a,b){ return a + (b-a)*rnd(); }

  /* ---------- straw bedding: solid tapered blades, no wispy squiggles ---------- */
  var strawPal = ['#d9b478','#c99a55','#e6c98f','#b3803f','#efdcae','#a86f39'];

  function blade(cx, cy, len, ang, w, col, op){
    // solid tapered quad — a flat straw, not a line
    var dx = Math.cos(ang), dy = Math.sin(ang);
    var px = -dy, py = dx;
    var x1 = cx + px*w, y1 = cy + py*w;
    var x2 = cx - px*w, y2 = cy - py*w;
    var tw = w*0.22;
    var x3 = cx + dx*len - px*tw, y3 = cy + dy*len - py*tw;
    var x4 = cx + dx*len + px*tw, y4 = cy + dy*len + py*tw;
    return '<polygon points="'+x1.toFixed(1)+','+y1.toFixed(1)+' '+x2.toFixed(1)+','+y2.toFixed(1)+' '
      +x3.toFixed(1)+','+y3.toFixed(1)+' '+x4.toFixed(1)+','+y4.toFixed(1)+'" fill="'+col+'" opacity="'+op.toFixed(2)+'"/>';
  }

  function bed(count, h, spanY, opMin, opMax, lenMin, lenMax){
    var out = '';
    for(var i=0;i<count;i++){
      var cx = rr(-40,1240);
      var cy = rr(spanY[0]*h, spanY[1]*h);
      var ang = rr(-0.34, 0.34) + (rnd()<0.5 ? Math.PI : 0);
      var len = rr(lenMin, lenMax);
      var w = rr(4, 11);
      var col = strawPal[(i*7+3) % strawPal.length];
      out += blade(cx, cy, len, ang, w, col, rr(opMin,opMax));
    }
    return out;
  }

  document.getElementById('strawBackG').innerHTML  = bed(150, 900, [0.02,1.0], 0.45, 0.9, 90, 260);
  document.getElementById('strawFrontG').innerHTML = bed(120, 700, [0.00,1.0], 0.62, 1.0, 110, 300);

  /* ---------- warm dust motes in the light, low-res canvas ---------- */
  var c = document.getElementById('dust'), ctx = c.getContext('2d');
  var W = c.width, H = c.height;
  var motes = [];
  for(var i=0;i<48;i++){
    motes.push({
      x: rr(0,W), y: rr(0,H),
      r: rr(1.1, 3.6),
      vy: rr(-5.5,-1.4),
      vx: rr(-2.2,2.2),
      ph: rr(0,6.283),
      a: rr(0.18,0.5)
    });
  }
  var last = performance.now(), acc = 0, STEP = 1/60;

  function step(){
    for(var i=0;i<motes.length;i++){
      var m = motes[i];
      m.ph += STEP*1.1;
      m.y += m.vy*STEP*10;
      m.x += (m.vx + Math.sin(m.ph)*2.4)*STEP*10;
      if(m.y < -12){ m.y = H+10; m.x = rr(0,W); }
      if(m.x < -14) m.x = W+12;
      if(m.x > W+14) m.x = -12;
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';
    for(var i=0;i<motes.length;i++){
      var m = motes[i];
      var glow = 0.62 + 0.38*Math.sin(m.ph*1.7);
      var g = ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r*4.2);
      g.addColorStop(0,'rgba(255,241,214,'+(m.a*glow).toFixed(3)+')');
      g.addColorStop(1,'rgba(255,224,178,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r*4.2,0,6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(255,248,228,'+(m.a*0.7*glow).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r*0.7,0,6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function loop(t){
    var dt = (t-last)/1000; last = t;
    if(dt > 0.25) dt = 0.25;
    acc += dt;
    var n = 0;
    while(acc >= STEP && n < 2){ step(); acc -= STEP; n++; }
    if(acc > STEP) acc = 0;
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- quiet ambient tone, only when not embedded ---------- */
  if (window.self === window.top){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC){
        var ac = new AC();
        var master = ac.createGain(); master.gain.value = 0.0; master.connect(ac.destination);
        var lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520; lp.Q.value=0.6; lp.connect(master);
        var base = [110.0, 164.8, 220.0, 247.0];
        base.forEach(function(f,i){
          var o = ac.createOscillator(); o.type = i%2 ? 'sine' : 'triangle'; o.frequency.value = f;
          var g = ac.createGain(); g.gain.value = 0.05/(i+1);
          var lfo = ac.createOscillator(); lfo.frequency.value = 0.045 + i*0.017;
          var lg = ac.createGain(); lg.gain.value = 0.028/(i+1);
          lfo.connect(lg); lg.connect(g.gain); lfo.start();
          o.connect(g); g.connect(lp); o.start();
        });
        master.gain.linearRampToValueAtTime(0.10, ac.currentTime + 8);
        var resume = function(){ if(ac.state==='suspended') ac.resume(); };
        document.addEventListener('visibilitychange', resume);
        setTimeout(resume, 400);
      }
    }catch(e){}
  }
})();
</script>
</body>
</html>
