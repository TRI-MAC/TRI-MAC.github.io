<html lang="en">
<head>

<title>2026-06-02</title>
<style>
  :root{
    --bg:#f7e9c8;
    --paper:#fff5d6;
    --ink:#0c0c0f;
    --red:#ff2b2b;
    --blue:#0057ff;
    --yellow:#ffd21f;
    --cyan:#17d5ff;
    --shadow:rgba(0,0,0,.22);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:
      radial-gradient(circle at 20% 15%, #fff8e7 0%, #f4ddb3 35%, #ebc989 70%, #d9a04b 100%);
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 35%, rgba(255,245,220,.85), rgba(247,233,200,.95) 45%, rgba(234,204,133,1) 100%);
    box-shadow:0 24px 60px rgba(0,0,0,.28);
  }

  /* Pop-art paper field */
  #paperDots{
    position:absolute; inset:0;
    background:
      radial-gradient(circle, rgba(10,10,10,.16) 0 1.2px, transparent 1.3px) 0 0/18px 18px,
      linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,0));
    opacity:.42;
    mix-blend-mode:multiply;
    pointer-events:none;
  }

  /* Explosive comic shapes behind record */
  .burst{
    position:absolute;
    inset:-8%;
    pointer-events:none;
    filter: drop-shadow(0 8px 0 rgba(0,0,0,.22));
    opacity:.95;
    animation: slowSpin 44s linear infinite;
  }
  .burst svg{width:100%;height:100%}
  .burst2{
    position:absolute;
    inset:7% 9% auto 9%;
    height:48%;
    opacity:.7;
    animation: breathe 14s ease-in-out infinite;
    pointer-events:none;
  }
  .burst2 svg{width:100%;height:100%}

  /* Record world */
  #recordWrap{
    position:absolute;
    left:50%;
    top:56%;
    width:92%;
    aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  #record{
    position:absolute;
    inset:0;
    border-radius:50%;
    animation: spin 26s linear infinite;
    filter: drop-shadow(0 24px 30px rgba(0,0,0,.35));
  }

  /* Grooves canvas */
  #grooveCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border-radius:50%;
  }

  /* video revealed in grooves */
  #videoMask{
    position:absolute;
    inset:0;
    border-radius:50%;
    overflow:hidden;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 0 10%, #000 10.6% 100%);
            mask-image: radial-gradient(circle at 50% 50%, transparent 0 10%, #000 10.6% 100%);
  }
  #background-video{
    position:absolute;
    left:50%; top:50%;
    width:120%;
    height:120%;
    object-fit:cover;
    transform:translate(-50%,-50%);
    opacity:.88;
    filter:saturate(1.7) contrast(1.2) hue-rotate(-8deg);
  }

  #discOverlay{
    position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, transparent 0 10.2%, rgba(255,255,255,.08) 10.3% 12%, transparent 12.1% 100%),
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.22), transparent 24%),
      radial-gradient(circle at 50% 50%, transparent 52%, rgba(255,255,255,.06) 70%, rgba(0,0,0,.16) 100%);
    mix-blend-mode:screen;
  }

  #label{
    position:absolute;
    left:50%; top:50%;
    width:30%;
    height:30%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #fff4cb 0 14%, #111 14.2% 17%, #ffeb62 17.2% 58%, #ff2b2b 58.2% 75%, #0057ff 75.2% 100%);
    border:8px solid #111;
    box-shadow: inset 0 0 0 10px rgba(255,255,255,.18);
  }
  #label::before{
    content:"";
    position:absolute;
    inset:15%;
    border-radius:50%;
    background:
      radial-gradient(circle, rgba(255,255,255,.24) 0 34%, transparent 35%),
      radial-gradient(circle, #111 0 9%, transparent 9.2%);
  }
  #label::after{
    content:"";
    position:absolute;
    inset:10%;
    border-radius:50%;
    background:
      radial-gradient(circle, transparent 0 12%, rgba(0,0,0,.85) 12.3% 13.4%, transparent 13.7%),
      radial-gradient(circle at 50% 50%, transparent 0 46%, rgba(17,17,17,.24) 46.2% 47.2%, transparent 47.5%);
    opacity:.55;
  }

  /* Tonearm */
  #tonearm{
    position:absolute;
    right:6.4%;
    top:18%;
    width:46%;
    height:10%;
    transform-origin:90% 18%;
    animation: armSweep 26s linear infinite;
    z-index:12;
    filter: drop-shadow(0 10px 8px rgba(0,0,0,.25));
  }
  #tonearm .pivot{
    position:absolute;
    right:0; top:0;
    width:16%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 35%, #fff, #e6e6e6 24%, #9ea3a8 25%, #6a6f76 70%, #2b2f35 100%);
    border:5px solid #111;
  }
  #tonearm .bar{
    position:absolute;
    right:10%;
    top:18%;
    width:78%;
    height:22%;
    background:linear-gradient(180deg, #f9f9f9, #bfc5cc 45%, #5c636d 46%, #d7dde2 100%);
    border:4px solid #111;
    border-radius:18px;
    transform-origin:right center;
  }
  #tonearm .head{
    position:absolute;
    left:2%;
    top:6%;
    width:18%;
    height:44%;
    background:var(--red);
    border:4px solid #111;
    transform:rotate(-14deg);
  }
  #tonearm .needle{
    position:absolute;
    left:0%;
    top:47%;
    width:13%;
    height:4px;
    background:#111;
    transform:rotate(28deg);
    transform-origin:left center;
  }

  /* reveal wedge from tonearm */
  #reveal{
    position:absolute;
    inset:0;
    border-radius:50%;
    opacity:.82;
    animation: spin 26s linear infinite;
    mix-blend-mode:screen;
    pointer-events:none;
  }

  /* foreground comic rings */
  .ring{
    position:absolute;
    border-radius:50%;
    border:10px solid #111;
    opacity:.85;
    pointer-events:none;
  }
  .ring.r1{
    width:112%; height:112%;
    left:-6%; top:-6%;
    border-color:#111 transparent #111 transparent;
    opacity:.22;
    animation: slowSpinRev 48s linear infinite;
    mask-image: radial-gradient(circle, transparent 75%, #000 88%, transparent 100%);
    -webkit-mask-image: radial-gradient(circle, transparent 75%, #000 88%, transparent 100%);
  }
  .ring.r2{
    width:82%; height:82%;
    left:9%; top:9%;
    border-width:14px;
    border-color:transparent #ff2b2b transparent #0057ff;
    opacity:.24;
    animation: slowSpin 30s linear infinite;
    mask-image: radial-gradient(circle, transparent 72%, #000 84%, transparent 100%);
    -webkit-mask-image: radial-gradient(circle, transparent 72%, #000 84%, transparent 100%);
  }

  /* Koi icons around record */
  #koiLayer{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:9;
    animation: counterSpin 26s linear infinite;
  }
  .koi{
    position:absolute;
    width:120px;
    height:56px;
    transform-origin:center;
    opacity:.96;
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.18));
  }
  .koi svg{width:100%;height:100%;overflow:visible}
  .koi .body{stroke:#111;stroke-width:5}
  .koi .spot{stroke:#111;stroke-width:4}
  .koi .eye{fill:#111}

  /* comic words reduced to abstract bars to avoid text */
  .popBar{
    position:absolute;
    height:20px;
    border:4px solid #111;
    background:var(--yellow);
    box-shadow:8px 8px 0 rgba(0,0,0,.18);
    transform:skewX(-18deg);
    opacity:.95;
    pointer-events:none;
  }
  .popBar.b1{width:170px;left:8%;top:17%;background:var(--red);animation:breathe 9s ease-in-out infinite}
  .popBar.b2{width:110px;right:12%;top:30%;background:var(--cyan);animation:breathe 11s ease-in-out infinite reverse}
  .popBar.b3{width:140px;left:9%;bottom:25%;background:var(--blue);animation:breathe 10s ease-in-out infinite}
  .popBar.b4{width:88px;right:15%;bottom:18%;background:var(--yellow);animation:breathe 13s ease-in-out infinite reverse}

  /* date */
  #date{
    position:absolute;
    right:18px;
    bottom:12px;
    color:rgba(0,0,0,.48);
    font-size:16px;
    letter-spacing:2px;
    z-index:40;
    user-select:none;
  }

  /* hidden guinea pig */
  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    right:29px;
    top:300px;
    opacity:.62;
    z-index:5;
    filter:saturate(.9) contrast(1.05);
    transform:rotate(7deg);
  }

  /* edge feather */
  #edgeFade{
    position:absolute; inset:0; pointer-events:none; z-index:50;
    box-shadow: inset 0 0 110px rgba(247,233,200,.88);
  }

  @keyframes spin { from {transform:rotate(0deg)} to {transform:rotate(360deg)} }
  @keyframes counterSpin { from {transform:rotate(0deg)} to {transform:rotate(-360deg)} }
  @keyframes slowSpin { from {transform:rotate(0deg)} to {transform:rotate(360deg)} }
  @keyframes slowSpinRev { from {transform:rotate(0deg)} to {transform:rotate(-360deg)} }
  @keyframes breathe {
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.03)}
  }
  @keyframes armSweep {
    0%{transform:rotate(-18deg)}
    50%{transform:rotate(10deg)}
    100%{transform:rotate(-18deg)}
  }
</style>
</head>

<script>
(() => {
  const dateSeed = "2026-06-02";
  let seed = 0;
  for (let i = 0; i < dateSeed.length; i++) seed = (seed * 131 + dateSeed.charCodeAt(i)) >>> 0;
  function rand() {
    seed = (1664525 * seed + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  const canvas = document.getElementById('grooveCanvas');
  const ctx = canvas.getContext('2d');
  const reveal = document.getElementById('reveal');
  const arm = document.getElementById('tonearm');
  const video = document.getElementById('background-video');
  const wrap = document.getElementById('recordWrap');

  function resizeCanvas(){
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    drawStatic();
  }

  let halftoneLayer;
  function makeHalftonePattern(size=1200){
    const off = document.createElement('canvas');
    off.width = off.height = size;
    const c = off.getContext('2d');

    c.fillStyle = '#0f0f12';
    c.beginPath();
    c.arc(size/2, size/2, size*0.495, 0, Math.PI*2);
    c.fill();

    for (let r = size*0.125; r < size*0.485; r += size*0.014) {
      c.strokeStyle = `rgba(255,255,255,${0.02 + ((r/size)%0.02)})`;
      c.lineWidth = Math.max(1, size*0.00125);
      c.beginPath();
      c.arc(size/2, size/2, r, 0, Math.PI*2);
      c.stroke();
    }

    const rings = 18;
    for (let i=0;i<rings;i++){
      const rr0 = size*(0.14 + i*0.018);
      const rr1 = rr0 + size*0.015;
      const color = i%4===0 ? '#ff2b2b' : i%4===1 ? '#0057ff' : i%4===2 ? '#ffd21f' : '#17d5ff';

      const cells = 42 + i*5;
      for(let j=0;j<cells;j++){
        const a = (j/cells)*Math.PI*2 + (i%2)*0.04;
        const rr = (rr0+rr1)/2;
        const x = size/2 + Math.cos(a)*rr;
        const y = size/2 + Math.sin(a)*rr;
        const dot = (i%3===0 ? 5.8 : i%3===1 ? 4.4 : 3.4) + (j%3)*0.8;
        c.fillStyle = color;
        c.beginPath();
        c.arc(x,y,dot,0,Math.PI*2);
        c.fill();
      }
    }

    c.globalCompositeOperation = 'multiply';
    for(let k=0;k<6;k++){
      const rr = size*(0.18 + k*0.045);
      c.strokeStyle = ['#ff2b2b','#0057ff','#ffd21f','#17d5ff','#ff2b2b','#0057ff'][k];
      c.lineWidth = size*0.012;
      c.beginPath();
      c.arc(size/2,size/2,rr,Math.PI*(0.10+k*0.13),Math.PI*(0.55+k*0.13));
      c.stroke();
    }
    c.globalCompositeOperation = 'source-over';

    return off;
  }

  function drawStatic(){
    const w = canvas.clientWidth || 800;
    const h = canvas.clientHeight || 800;
    ctx.clearRect(0,0,w,h);

    const cx = w/2, cy = h/2;
    const R = Math.min(w,h)*0.495;

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.clip();

    const bg = ctx.createRadialGradient(cx-w*0.18, cy-h*0.2, R*0.1, cx, cy, R);
    bg.addColorStop(0, '#25262c');
    bg.addColorStop(0.45, '#101014');
    bg.addColorStop(1, '#000000');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,w,h);

    ctx.globalAlpha = 0.22;
    const cell = 18;
    for(let y=0;y<h;y+=cell){
      for(let x=0;x<w;x+=cell){
        const dx=x-cx, dy=y-cy;
        const d=Math.hypot(dx,dy);
        if(d < R*0.96 && d > R*0.16){
          const rr = 0.9 + ((x+y)%5)*0.25;
          ctx.fillStyle = ((x/cell + y/cell)%2<1) ? '#fff' : '#111';
          ctx.beginPath();
          ctx.arc(x,y,rr,0,Math.PI*2);
          ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;

    if(!halftoneLayer) halftoneLayer = makeHalftonePattern(1200);
    ctx.globalAlpha = 0.95;
    ctx.drawImage(halftoneLayer,0,0,w,h);
    ctx.globalAlpha = 1;

    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    for (let r = R*0.19; r < R*0.98; r += R*0.0165) {
      ctx.lineWidth = Math.max(1, R*0.0018);
      ctx.beginPath();
      ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.stroke();
    }

    for (let i=0;i<12;i++){
      const r0 = R*(0.22+i*0.055);
      const a0 = i*0.41 + rand()*0.3;
      const a1 = a0 + 0.42 + rand()*0.18;
      ctx.lineWidth = R*0.018;
      ctx.lineCap = 'round';
      ctx.strokeStyle = ['#ff2b2b','#0057ff','#ffd21f','#17d5ff'][i%4];
      ctx.globalAlpha = 0.78;
      ctx.beginPath();
      ctx.arc(cx,cy,r0,a0,a1);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function updateReveal(time){
    const r = wrap.getBoundingClientRect();
    const rec = document.getElementById('record').getBoundingClientRect();
    const armRect = arm.getBoundingClientRect();

    const pivotX = armRect.right - armRect.width*0.08 - rec.left;
    const pivotY = armRect.top + armRect.height*0.18 - rec.top;

    const cx = rec.width/2;
    const cy = rec.height/2;
    const angle = Math.atan2(pivotY-cy,pivotX-cx) + Math.PI;
    const sweep = 0.38;
    const deg = angle * 180 / Math.PI;

    reveal.style.background =
      `conic-gradient(from ${deg-sweep*180/Math.PI}deg at 50% 50%,
        rgba(255,255,255,0) 0deg,
        rgba(255,255,255,0) ${0}deg,
        rgba(255,255,255,0.00) 0deg,
        rgba(255,255,255,0.00) ${0}deg,
        rgba(255,255,255,0.04) ${0}deg,
        rgba(255,255,255,0.16) ${sweep*90/Math.PI}deg,
        rgba(255,255,255,0.00) ${sweep*180/Math.PI}deg,
        rgba(255,255,255,0.00) 360deg)`;
  }

  function animate(t){
    updateReveal(t*0.001);
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resizeCanvas);
  video.addEventListener('loadeddata', resizeCanvas);
  resizeCanvas();
  requestAnimationFrame(animate);

  if (window.self === window.top) {
    try{
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const master = audioCtx.createGain();
      master.gain.value = 0.016;
      master.connect(audioCtx.destination);

      const low = audioCtx.createOscillator();
      low.type = 'sawtooth';
      low.frequency.value = 55;
      const lowGain = audioCtx.createGain();
      lowGain.gain.value = 0.02;

      const mid = audioCtx.createOscillator();
      mid.type = 'triangle';
      mid.frequency.value = 220;
      const midGain = audioCtx.createGain();
      midGain.gain.value = 0.008;

      const lfo = audioCtx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.08;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 14;
      lfo.connect(lfoGain);
      lfoGain.connect(mid.frequency);

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 800;
      filter.Q.value = 0.6;

      const noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*0.18;
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuf;
      noise.loop = true;
      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = 1800;
      noiseFilter.Q.value = 0.8;
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.value = 0.0035;

      low.connect(lowGain); lowGain.connect(filter);
      mid.connect(midGain); midGain.connect(filter);
      noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(filter);
      filter.connect(master);

      low.start();
      mid.start();
      lfo.start();
      noise.start();

      function audioLoop(){
        const now = audioCtx.currentTime;
        const seq = [220,247,196,165,220,262,196,147];
        const idx = Math.floor((now/3.25)%seq.length);
        mid.frequency.cancelScheduledValues(now);
        mid.frequency.linearRampToValueAtTime(seq[idx], now+2.4);
        filter.frequency.cancelScheduledValues(now);
        filter.frequency.linearRampToValueAtTime(560 + (idx%4)*150, now+2.8);
        lowGain.gain.cancelScheduledValues(now);
        lowGain.gain.linearRampToValueAtTime(0.016 + (idx%3)*0.003, now+2.8);
      }
      setInterval(audioLoop, 3000);

      const unlock = () => {
        if (audioCtx.state !== 'running') audioCtx.resume();
      };
      document.addEventListener('visibilitychange', unlock);
      unlock();
    }catch(e){}
  }
})();
</script>
