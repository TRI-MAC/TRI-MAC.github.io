<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta charset="utf-8">
<title>2026-10-25</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#284b79}
#stage{position:absolute;width:1080px;height:1920px;overflow:hidden;background:#285d88;transform-origin:top left}
#background-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.78}
.water{position:absolute;inset:0;background:rgba(38,83,137,.15);pointer-events:none}
svg{position:absolute;inset:0;width:100%;height:100%}
.pulse{transform-box:fill-box;transform-origin:50% 16%;animation:pulse 11s ease-in-out infinite}
.second{animation-delay:-4s;animation-duration:13s}
.third{animation-delay:-7s;animation-duration:15s}
@keyframes pulse{
0%,100%{transform:scale(1,1)}
48%{transform:scale(.91,1.045)}
}
#guinea-pig{position:absolute;left:1034px;bottom:67px;width:17px;height:auto;opacity:.54;clip-path:inset(0 0 22% 0)}
.date{position:absolute;left:45px;bottom:34px;color:#c5d5d8;font:17px monospace;letter-spacing:2px;opacity:.65}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<main id="stage" aria-label="Three translucent jellyfish, rendered as luminous painted forms, descending through cobalt water.">
<video id="background-video" src="background.mp4" autoplay loop muted playsinline aria-hidden="true"></video>
<div class="water"></div>
<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

<stop offset="1" stop-color="#8edbdc" stop-opacity="0"/>
</linearGradient>

<stop stop-color="#eff3bd" stop-opacity=".1"/>
<stop offset=".4" stop-color="#f5dbc3" stop-opacity=".9"/>
<stop offset="1" stop-color="#a1f0e0" stop-opacity=".2"/>

<g id="jelly">

</g>

</g>
</defs>
<g id="drift-a"><g transform="translate(663 735) rotate(-11) scale(1.62)"><g class="pulse"><use href="#jelly"/></g></g></g>
<g id="drift-b"><g transform="translate(242 265) rotate(14) scale(.68)"><g class="pulse second" opacity=".73"><use href="#jelly"/></g></g></g>
<g id="drift-c"><g transform="translate(263 1470) rotate(8) scale(.48)"><g class="pulse third" opacity=".6"><use href="#jelly"/></g></g></g>
</svg>
<img id="guinea-pig" src="guineapig.png" alt="">
<div class="date">2026-10-25</div>
</main>
<script>
(()=>{
const stage=document.getElementById('stage');
function fit(){
const w=innerWidth,h=innerHeight,s=Math.min(w/1080,h/1920);
stage.style.transform=`translate(${(w-1080*s)/2}px,${(h-1920*s)/2}px) scale(${s})`;
}
addEventListener('resize',fit);fit();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const groups=['drift-a','drift-b','drift-c'].map(id=>document.getElementById(id));
const seed=20261025;
const phase=(seed%97)/97*Math.PI*2;
if(!reduced){
const start=performance.now();
function frame(now){
const t=(now-start)/1000;
groups.forEach((g,i)=>{
const p=t*(Math.PI*2/(54+i*9))+phase+i*1.8;
const y=65*Math.sin(p),x=13*Math.sin(p+1.1);
g.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)})`);
});
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
})();
</script>
</body>
</html>
