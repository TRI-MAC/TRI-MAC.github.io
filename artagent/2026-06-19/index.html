<!DOCTYPE html>
<html lang="en">
<head>

<title>2026-06-19</title>
<style>
  :root{
    --bg:#04152d;
    --bg2:#08264c;
    --cyan:#86f7ff;
    --cyan2:#54d7f2;
    --ink:#0a1a33;
    --gold:#d7b866;
    --gold2:#f2e2a4;
    --parch:#ccecff;
    --deep:#02101f;
    --line:rgba(134,247,255,.68);
    --lineSoft:rgba(134,247,255,.18);
    --glow:rgba(134,247,255,.22);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Georgia, "Times New Roman", serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 14%, rgba(215,184,102,.15), transparent 28%),
      linear-gradient(180deg, #0a2a59 0%, #04152d 34%, #031124 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px rgba(0,0,0,.55);
  }

  /* background video */
  #background-video{
    position:absolute;
    inset:8% 12% 16% 12%;
    width:76%;
    height:58%;
    object-fit:cover;
    opacity:.78;
    filter:saturate(.6) hue-rotate(165deg) contrast(1.15) brightness(.95);
    mix-blend-mode:screen;
    border-radius:2px;
    clip-path:polygon(2% 0, 98% 0, 100% 8%, 100% 92%, 98% 100%, 2% 100%, 0 92%, 0 8%);
    box-shadow:
      0 0 0 1px rgba(134,247,255,.4),
      0 0 28px rgba(134,247,255,.15),
      inset 0 0 40px rgba(4,21,45,.35);
    animation:plateDrift 30s ease-in-out infinite;
  }

  /* portrait */
  #portrait-image{
    position:absolute;
    left:18%;
    bottom:9%;
    width:47%;
    height:auto;
    z-index:11;
    filter:
      saturate(.72)
      contrast(1.06)
      brightness(.98)
      hue-rotate(175deg)
      drop-shadow(0 18px 28px rgba(0,0,0,.42))
      drop-shadow(0 0 12px rgba(134,247,255,.1));
    opacity:.98;
    transform-origin:50% 90%;
    animation:portraitBreath 18s ease-in-out infinite;
  }

  /* architectural field */
  .layer{position:absolute; inset:0; pointer-events:none;}
  #blueprint{
    z-index:3;
    opacity:.96;
  }
  #illumination{
    z-index:18;
  }
  #foreground{
    z-index:14;
  }
  #mist{
    z-index:12;
    background:
      radial-gradient(circle at 50% 66%, rgba(134,247,255,.09), transparent 28%),
      radial-gradient(circle at 40% 86%, rgba(215,184,102,.08), transparent 20%),
      linear-gradient(180deg, transparent 0%, rgba(3,17,36,.0) 45%, rgba(3,17,36,.25) 100%);
    mix-blend-mode:screen;
    animation:mistShift 24s ease-in-out infinite;
  }

  /* decorative manuscript border */
  .border{
    position:absolute;
    inset:14px;
    z-index:30;
    border:1px solid rgba(215,184,102,.5);
    box-shadow:
      inset 0 0 0 1px rgba(215,184,102,.18),
      0 0 28px rgba(215,184,102,.06);
    mask-image:linear-gradient(180deg, transparent 0%, black 5%, black 95%, transparent 100%);
  }
  .corner{
    position:absolute;
    width:170px;
    height:170px;
    opacity:.9;
    filter:drop-shadow(0 0 8px rgba(215,184,102,.12));
  }
  .tl{left:12px;top:12px}
  .tr{right:12px;top:12px;transform:scaleX(-1)}
  .bl{left:12px;bottom:12px;transform:scaleY(-1)}
  .br{right:12px;bottom:12px;transform:scale(-1)}
  .midOrn{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:300px;height:42px;
    opacity:.85;
  }
  .topOrn{top:20px}
  .botOrn{bottom:20px}

  /* date only */
  #date{
    position:absolute;
    right:26px;
    bottom:18px;
    z-index:40;
    font-size:14px;
    letter-spacing:.12em;
    color:rgba(215,226,255,.56);
    text-shadow:0 0 8px rgba(134,247,255,.12);
    user-select:none;
  }

  /* hidden guinea pig */
  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:94px;
    bottom:137px;
    z-index:16;
    opacity:.58;
    filter:saturate(.6) hue-rotate(170deg) brightness(.8) contrast(1.05);
    transform:rotate(-8deg);
  }

  /* scan + vellum texture */
  #texture{
    z-index:25;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.024) 0 1px, transparent 1px 4px),
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.04), transparent 18%),
      radial-gradient(circle at 80% 65%, rgba(255,255,255,.03), transparent 22%);
    mix-blend-mode:soft-light;
    opacity:.55;
  }

  @keyframes plateDrift{
    0%,100%{transform:translateY(0px) scale(1.02)}
    50%{transform:translateY(-10px) scale(1.035)}
  }
  @keyframes portraitBreath{
    0%,100%{transform:translateY(0px) scale(1)}
    50%{transform:translateY(-5px) scale(1.012)}
  }
  @keyframes mistShift{
    0%,100%{transform:translateX(0px) translateY(0px)}
    50%{transform:translateX(8px) translateY(-6px)}
  }
  @keyframes rotateSlow{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
  }
  @keyframes pulseSlow{
    0%,100%{opacity:.62}
    50%{opacity:.9}
  }
  canvas,svg{display:block}
</style>
</head>

<script>
(function(){
  const seedStr = "2026-06-19";
  let seed = 0;
  for(let i=0;i<seedStr.length;i++) seed = (seed * 131 + seedStr.charCodeAt(i)) >>> 0;
  function rand(){
    seed = (1664525 * seed + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  const canvas = document.getElementById('blueprint');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;

  const stars = [];
  for(let i=0;i<90;i++){
    stars.push({
      x: rand()*w,
      y: rand()*h,
      r: rand()*1.7 + 0.4,
      a: rand()*0.5 + 0.15
    });
  }

  const rings = [];
  for(let i=0;i<8;i++){
    rings.push({
      x: 540 + (rand()-.5)*110,
      y: 760 + (rand()-.5)*110,
      r: 55 + i*26,
      speed: (rand()*0.4 + 0.15) * (i%2?1:-1),
      phase: rand()*Math.PI*2
    });
  }

  const planBands = [];
  for(let i=0;i<22;i++){
    const y = 340 + i*58 + (rand()-.5)*10;
    planBands.push({
      y,
      x1: 140 + rand()*120,
      x2: 760 + rand()*170,
      phase: rand()*Math.PI*2
    });
  }

  function polygon(cx, cy, r, sides, rot){
    ctx.beginPath();
    for(let i=0;i<sides;i++){
      const a = rot + i*Math.PI*2/sides;
      const x = cx + Math.cos(a)*r;
      const y = cy + Math.sin(a)*r;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
  }

  function drawKnotBand(y, t){
    const cell = 108;
    ctx.save();
    ctx.translate(0,y);
    ctx.strokeStyle = 'rgba(215,184,102,0.62)';
    ctx.lineWidth = 3;
    for(let i=-1;i<12;i++){
      const x = i*cell + ((t*8)%cell);
      ctx.beginPath();
      ctx.moveTo(x+8, 18);
      ctx.lineTo(x+54, 54);
      ctx.lineTo(x+100, 18);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x+8, 90);
      ctx.lineTo(x+54, 54);
      ctx.lineTo(x+100, 90);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(134,247,255,0.26)';
      ctx.beginPath();
      ctx.rect(x+28, 28, 52, 52);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(215,184,102,0.62)';
    }
    ctx.restore();
  }

  function draw(){
    const now = performance.now()*0.001;
    ctx.clearRect(0,0,w,h);

    // architectural blueprint haze
    const g = ctx.createRadialGradient(540, 760, 80, 540, 760, 660);
    g.addColorStop(0,'rgba(134,247,255,0.09)');
    g.addColorStop(0.5,'rgba(134,247,255,0.03)');
    g.addColorStop(1,'rgba(134,247,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    // subtle star-like measurement specks
    for(const s of stars){
      const aa = s.a * (0.75 + 0.25*Math.sin(now*0.6 + s.x*0.01));
      ctx.fillStyle = `rgba(184,251,255,${aa})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }

    // manuscript blueprint grid
    ctx.strokeStyle = 'rgba(134,247,255,0.08)';
    ctx.lineWidth = 1;
    for(let x=72;x<w;x+=72){
      ctx.beginPath(); ctx.moveTo(x,110); ctx.lineTo(x,h-110); ctx.stroke();
    }
    for(let y=110;y<h;y+=72){
      ctx.beginPath(); ctx.moveTo(72,y); ctx.lineTo(w-72,y); ctx.stroke();
    }

    // facade measuring bands
    for(let i=0;i<planBands.length;i++){
      const b = planBands[i];
      const off = Math.sin(now*0.25 + b.phase) * 10;
      ctx.strokeStyle = i%3===0 ? 'rgba(215,184,102,0.16)' : 'rgba(134,247,255,0.14)';
      ctx.lineWidth = i%3===0 ? 1.4 : 1;
      ctx.beginPath();
      ctx.moveTo(b.x1, b.y + off);
      ctx.lineTo(b.x2, b.y + off);
      ctx.stroke();
    }

    // large radial blueprint rings
    ctx.save();
    ctx.translate(540,760);
    for(let i=0;i<rings.length;i++){
      const rr = rings[i].r + Math.sin(now*0.4 + rings[i].phase)*3.5;
      ctx.strokeStyle = i%2===0 ? 'rgba(134,247,255,0.22)' : 'rgba(215,184,102,0.2)';
      ctx.lineWidth = i%3===0 ? 2.2 : 1.2;
      ctx.beginPath();
      ctx.arc(0,0,rr,0,Math.PI*2);
      ctx.stroke();

      const rot = now * 0.03 * rings[i].speed + rings[i].phase;
      ctx.save();
      ctx.rotate(rot);
      polygon(0,0,rr*0.72,4,Math.PI/4);
      ctx.strokeStyle = 'rgba(134,247,255,0.17)';
      ctx.lineWidth = 1.3;
      ctx.stroke();
      ctx.restore();
    }

    // starburst compass
    for(let i=0;i<16;i++){
      const a = i*Math.PI/8 + now*0.01;
      const r1 = 30, r2 = 144;
      ctx.strokeStyle = i%2===0 ? 'rgba(215,184,102,0.38)' : 'rgba(134,247,255,0.26)';
      ctx.lineWidth = i%4===0 ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1);
      ctx.lineTo(Math.cos(a)*r2, Math.sin(a)*r2);
      ctx.stroke();
    }
    ctx.restore();

    // lower plinth shadow
    const pg = ctx.createLinearGradient(230,1450,230,1760);
    pg.addColorStop(0,'rgba(0,0,0,0)');
    pg.addColorStop(1,'rgba(0,0,0,0.26)');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.moveTo(100,1600); ctx.lineTo(830,1452); ctx.lineTo(1010,1555); ctx.lineTo(240,1730); ctx.closePath();
    ctx.fill();

    // knot bands
    drawKnotBand(154);
    drawKnotBand(1668);

    // tiny measurement ticks
    ctx.strokeStyle = 'rgba(134,247,255,0.32)';
    ctx.lineWidth = 1;
    for(let y=280;y<1500;y+=120){
      ctx.beginPath();
      ctx.moveTo(84,y); ctx.lineTo(104,y);
      ctx.moveTo(976,y); ctx.lineTo(996,y);
      ctx.stroke();
    }

    requestAnimationFrame(draw);
  }
  draw();

  if (window.self === window.top) {
    try{
      const actx = new (window.AudioContext || window.webkitAudioContext)();
      const master = actx.createGain();
      master.gain.value = 0.018;
      master.connect(actx.destination);

      const o1 = actx.createOscillator();
      const o2 = actx.createOscillator();
      const o3 = actx.createOscillator();
      o1.type='sine'; o2.type='triangle'; o3.type='sine';
      o1.frequency.value = 155.56;
      o2.frequency.value = 233.08;
      o3.frequency.value = 311.13;

      const g1 = actx.createGain(), g2 = actx.createGain(), g3 = actx.createGain();
      g1.gain.value = 0.18; g2.gain.value = 0.08; g3.gain.value = 0.05;

      const filter = actx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 820;
      filter.Q.value = 0.4;

      const lfo = actx.createOscillator();
      const lfoGain = actx.createGain();
      lfo.type = 'sine';
      lfo.frequency.value = 0.035;
      lfoGain.gain.value = 120;
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      o1.connect(g1); o2.connect(g2); o3.connect(g3);
      g1.connect(filter); g2.connect(filter); g3.connect(filter);
      filter.connect(master);

      o1.start(); o2.start(); o3.start(); lfo.start();

      function drift(){
        const t = actx.currentTime;
        o1.frequency.linearRampToValueAtTime(155.56 + Math.sin(t*0.18)*3, t+6);
        o2.frequency.linearRampToValueAtTime(233.08 + Math.sin(t*0.11+1)*2.5, t+6);
        o3.frequency.linearRampToValueAtTime(311.13 + Math.sin(t*0.09+2)*4, t+6);
        g2.gain.linearRampToValueAtTime(0.05 + (0.04*(0.5+0.5*Math.sin(t*0.13))), t+6);
        g3.gain.linearRampToValueAtTime(0.03 + (0.03*(0.5+0.5*Math.sin(t*0.17))), t+6);
        setTimeout(drift, 5000);
      }
      if(actx.state === 'suspended'){
        const resume = ()=>actx.resume().catch(()=>{});
        document.addEventListener('visibilitychange', resume, {once:true});
        setTimeout(resume, 300);
      }
      drift();
    }catch(e){}
  }
})();
</script>
