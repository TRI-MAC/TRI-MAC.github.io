<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026-03-28</title>
<style>
  :root{
    --bg:#03060b;
    --bg2:#06111f;
    --cyan:#6ef7ff;
    --cyan2:#1dd7ff;
    --blue:#3d7cff;
    --mag:#ff4fd8;
    --vio:#8a6bff;
    --lime:#9aff6b;
    --amber:#ffb454;
    --line:rgba(110,247,255,0.18);
    --soft:rgba(110,247,255,0.08);
    --grid:rgba(80,180,255,0.10);
    --scan:rgba(255,255,255,0.045);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(circle at 50% 20%, #0a1830 0%, #060c17 35%, #02040a 75%, #000 100%);
    overflow:hidden;
    font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw, calc(100vh * 1080 / 1920));
    aspect-ratio:9/16;
    background:
      radial-gradient(circle at 50% 42%, rgba(23,122,255,0.16), transparent 26%),
      radial-gradient(circle at 68% 28%, rgba(255,79,216,0.10), transparent 20%),
      radial-gradient(circle at 24% 76%, rgba(110,247,255,0.08), transparent 18%),
      linear-gradient(180deg, #02050c 0%, #05101c 45%, #02050d 100%);
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(120,190,255,0.13),
      0 0 60px rgba(30,90,255,0.14),
      inset 0 0 120px rgba(0,0,0,0.5);
  }

  #glow{
    position:absolute; inset:-10%;
    background:
      radial-gradient(circle at 50% 36%, rgba(61,124,255,0.16), transparent 22%),
      radial-gradient(circle at 58% 48%, rgba(255,79,216,0.09), transparent 14%),
      radial-gradient(circle at 42% 52%, rgba(110,247,255,0.08), transparent 12%);
    filter:blur(40px);
    animation: breathe 18s ease-in-out infinite;
    pointer-events:none;
  }

  #gridPerspective{
    position:absolute;
    left:-5%; right:-5%; bottom:-8%;
    height:52%;
    transform-origin:center bottom;
    transform:perspective(900px) rotateX(77deg);
    background:
      repeating-linear-gradient(90deg,
        transparent 0 46px,
        rgba(93,190,255,0.16) 46px 48px),
      repeating-linear-gradient(0deg,
        transparent 0 44px,
        rgba(93,190,255,0.14) 44px 46px);
    opacity:.48;
    filter:drop-shadow(0 0 10px rgba(58,176,255,0.25));
    mask-image:linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,.9) 45%, rgba(0,0,0,0) 100%);
    animation: gridPulse 24s ease-in-out infinite;
  }

  #rings{
    position:absolute; inset:0;
    pointer-events:none;
    opacity:.95;
  }

  .halo{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(120,210,255,0.22);
    box-shadow:
      0 0 14px rgba(90,210,255,0.10),
      inset 0 0 20px rgba(100,200,255,0.05);
    mix-blend-mode:screen;
  }
  .halo.h1{ width:540px; height:540px; left:270px; top:420px; animation: spinSlow 36s linear infinite; }
  .halo.h2{ width:690px; height:690px; left:195px; top:345px; border-style:dashed; animation: spinReverse 52s linear infinite; opacity:.5; }
  .halo.h3{ width:420px; height:420px; left:330px; top:480px; border-color:rgba(255,79,216,0.18); animation: pulseScale 15s ease-in-out infinite; }

  .arc{
    position:absolute;
    border-radius:50%;
    border:3px solid transparent;
    filter:drop-shadow(0 0 8px currentColor);
    opacity:.78;
  }
  .a1{
    width:620px;height:620px;left:230px;top:380px;
    border-top-color:var(--cyan);
    border-left-color:rgba(110,247,255,0.15);
    transform:rotate(24deg);
    color:var(--cyan);
    animation: spinSlow 28s linear infinite;
  }
  .a2{
    width:470px;height:470px;left:305px;top:455px;
    border-right-color:var(--mag);
    border-bottom-color:rgba(255,79,216,0.12);
    transform:rotate(-20deg);
    color:var(--mag);
    animation: spinReverse 22s linear infinite;
  }
  .a3{
    width:780px;height:780px;left:150px;top:300px;
    border-left-color:var(--blue);
    color:var(--blue);
    opacity:.4;
    animation: spinSlow 70s linear infinite;
  }

  #svgOverlay{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
  }

  .hud-line{
    stroke:rgba(110,247,255,0.45);
    stroke-width:1.2;
    fill:none;
    filter:drop-shadow(0 0 4px rgba(110,247,255,0.35));
  }
  .hud-soft{
    stroke:rgba(110,247,255,0.16);
    stroke-width:1;
    fill:none;
  }
  .hud-mag{
    stroke:rgba(255,79,216,0.35);
    stroke-width:1.1;
    fill:none;
    filter:drop-shadow(0 0 5px rgba(255,79,216,0.22));
  }
  .hud-fill{
    fill:rgba(110,247,255,0.055);
    stroke:rgba(110,247,255,0.22);
    stroke-width:1;
  }

  .panel{
    position:absolute;
    border:1px solid rgba(110,247,255,0.18);
    background:linear-gradient(180deg, rgba(8,20,34,0.42), rgba(4,10,18,0.16));
    box-shadow:
      inset 0 0 30px rgba(80,170,255,0.04),
      0 0 16px rgba(80,170,255,0.05);
    backdrop-filter: blur(2px);
  }

  #panelTop{
    left:90px; top:110px; width:440px; height:170px;
    clip-path:polygon(0 0, 90% 0, 100% 28%, 100% 100%, 0 100%);
    animation: panelShift 19s ease-in-out infinite;
  }
  #panelSide{
    right:100px; top:210px; width:210px; height:560px;
    clip-path:polygon(0 0, 100% 0, 100% 88%, 78% 100%, 0 100%);
    animation: panelShift2 23s ease-in-out infinite;
  }
  #panelBottom{
    left:120px; bottom:140px; width:300px; height:120px;
    clip-path:polygon(0 0, 100% 0, 86% 100%, 0 100%);
    animation: panelShift3 17s ease-in-out infinite;
  }

  .ticks{
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(90deg,
        rgba(110,247,255,0.0) 0 22px,
        rgba(110,247,255,0.2) 22px 23px,
        rgba(110,247,255,0.0) 23px 32px);
    opacity:.22;
    mix-blend-mode:screen;
  }

  #beam{
    position:absolute;
    left:50%; top:220px;
    width:2px; height:1020px;
    transform:translateX(-50%);
    background:linear-gradient(180deg,
      rgba(110,247,255,0) 0%,
      rgba(110,247,255,0.75) 12%,
      rgba(255,79,216,0.26) 50%,
      rgba(110,247,255,0.82) 88%,
      rgba(110,247,255,0) 100%);
    box-shadow:
      0 0 14px rgba(110,247,255,0.55),
      0 0 32px rgba(110,247,255,0.25);
    opacity:.58;
    animation: beamPulse 11s ease-in-out infinite;
  }

  #beamCore{
    position:absolute;
    left:50%; top:360px;
    width:180px; height:760px;
    transform:translateX(-50%);
    background:
      linear-gradient(180deg,
        rgba(110,247,255,0) 0%,
        rgba(110,247,255,0.04) 12%,
        rgba(110,247,255,0.11) 50%,
        rgba(255,79,216,0.07) 76%,
        rgba(110,247,255,0) 100%);
    filter:blur(20px);
    opacity:.8;
    animation: beamBreath 13s ease-in-out infinite;
  }

  #canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    mix-blend-mode:screen;
    opacity:.9;
  }

  #noise{
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(180deg,
        transparent 0 3px,
        rgba(255,255,255,0.018) 3px 4px),
      repeating-linear-gradient(90deg,
        rgba(255,255,255,0.0) 0 2px,
        rgba(255,255,255,0.01) 2px 3px,
        rgba(0,0,0,0.0) 3px 6px);
    opacity:.45;
    mix-blend-mode:screen;
    animation: scanDrift 8s linear infinite;
    pointer-events:none;
  }

  #vignette{
    position:absolute; inset:0;
    box-shadow:
      inset 0 0 180px rgba(0,0,0,0.45),
      inset 0 0 260px rgba(0,0,0,0.75);
    pointer-events:none;
  }

  #date{
    position:absolute;
    right:22px; bottom:18px;
    color:rgba(190,230,255,0.55);
    font-size:13px;
    letter-spacing:.18em;
    opacity:.72;
    text-shadow:0 0 6px rgba(110,247,255,0.25);
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    left:97px;
    bottom:171px;
    opacity:0.58;
    filter:brightness(0.78) saturate(0.85) hue-rotate(165deg);
    transform:rotate(-8deg);
    z-index:3;
  }

  @keyframes spinSlow{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
  }
  @keyframes spinReverse{
    from{transform:rotate(360deg)}
    to{transform:rotate(0deg)}
  }
  @keyframes pulseScale{
    0%,100%{transform:scale(0.98)}
    50%{transform:scale(1.03)}
  }
  @keyframes breathe{
    0%,100%{transform:scale(1) translateY(0)}
    50%{transform:scale(1.04) translateY(-12px)}
  }
  @keyframes beamPulse{
    0%,100%{opacity:.42}
    50%{opacity:.78}
  }
  @keyframes beamBreath{
    0%,100%{transform:translateX(-50%) scaleY(.96)}
    50%{transform:translateX(-50%) scaleY(1.03)}
  }
  @keyframes gridPulse{
    0%,100%{opacity:.38}
    50%{opacity:.56}
  }
  @keyframes panelShift{
    0%,100%{transform:translateY(0) scaleX(1)}
    50%{transform:translateY(8px) scaleX(1.015)}
  }
  @keyframes panelShift2{
    0%,100%{transform:translateX(0)}
    50%{transform:translateX(-10px)}
  }
  @keyframes panelShift3{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-7px)}
  }
  @keyframes scanDrift{
    from{transform:translateY(0)}
    to{transform:translateY(4px)}
  }
</style>
</head>
<body>
  <div id="frame">
    <div id="glow"></div>
    <div id="gridPerspective"></div>

    <div id="beamCore"></div>
    <div id="beam"></div>

    <div id="rings">
      <div class="halo h1"></div>
      <div class="halo h2"></div>
      <div class="halo h3"></div>
      <div class="arc a1"></div>
      <div class="arc a2"></div>
      <div class="arc a3"></div>
    </div>

    <div id="panelTop" class="panel"><div class="ticks"></div></div>
    <div id="panelSide" class="panel"><div class="ticks"></div></div>
    <div id="panelBottom" class="panel"><div class="ticks"></div></div>

    <svg id="svgOverlay" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="rgba(110,247,255,0)" />
          <stop offset="50%" stop-color="rgba(110,247,255,1)" />
          <stop offset="100%" stop-color="rgba(110,247,255,0)" />
        </linearGradient>
      </defs>

      <path class="hud-soft" d="M90 280 H520" />
      <path class="hud-soft" d="M750 760 H980" />
      <path class="hud-soft" d="M120 1540 H420" />
      <path class="hud-soft" d="M650 1320 H960" />

      <path class="hud-line" d="M126 184 L438 184 L486 232 L486 255" />
      <path class="hud-line" d="M874 280 L948 280 L948 694 L900 742" />
      <path class="hud-line" d="M170 1650 L330 1650 L392 1588" />
      <path class="hud-mag" d="M694 1248 L910 1248 L954 1204" />

      <rect class="hud-fill" x="140" y="140" width="280" height="70" rx="4"/>
      <rect class="hud-fill" x="790" y="1110" width="170" height="52" rx="4"/>
      <rect class="hud-fill" x="150" y="1470" width="210" height="60" rx="4"/>

      <circle class="hud-soft" cx="540" cy="690" r="320"/>
      <circle class="hud-soft" cx="540" cy="690" r="240"/>
      <circle class="hud-line" cx="540" cy="690" r="145"/>
      <circle class="hud-mag" cx="540" cy="690" r="92"/>

      <path class="hud-line" d="M540 335 V460" />
      <path class="hud-line" d="M540 920 V1040" />
      <path class="hud-line" d="M185 690 H310" />
      <path class="hud-line" d="M770 690 H895" />

      <polygon class="hud-fill" points="480,570 600,570 660,690 600,810 480,810 420,690"/>
      <polygon class="hud-soft" points="510,600 570,600 610,690 570,780 510,780 470,690"/>

      <path class="hud-mag" d="M440 1120 C510 1090, 570 1090, 640 1120" />
      <path class="hud-line" d="M405 1160 H675" />
      <path class="hud-soft" d="M458 1195 H622" />

      <g opacity="0.75">
        <path class="hud-line" d="M836 338 l70 0 l0 18 l-70 0 z" />
        <path class="hud-line" d="M836 376 l92 0 l0 18 l-92 0 z" />
        <path class="hud-line" d="M836 414 l58 0 l0 18 l-58 0 z" />
      </g>

      <g opacity="0.65">
        <path class="hud-line" d="M164 1524 l124 0 l0 12 l-124 0 z" />
        <path class="hud-line" d="M164 1550 l78 0 l0 12 l-78 0 z" />
      </g>
    </svg>

    <canvas id="canvas" width="1080" height="1920"></canvas>
    <div id="noise"></div>
    <img id="guinea-pig" src="guineapig.png" alt="">
    <div id="vignette"></div>
    <div id="date">2026-03-28</div>
  </div>

<script>
(function(){
  const dateSeed = "2026-03-28";
  function hashString(str){
    let h = 2166136261 >>> 0;
    for(let i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
  }
  const rand = mulberry32(hashString(dateSeed));

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const W = 1080, H = 1920;
  canvas.width = W; canvas.height = H;

  const palette = [
    [110,247,255],
    [61,124,255],
    [255,79,216],
    [138,107,255],
    [154,255,107],
    [255,180,84]
  ];

  const nodes = [];
  const nodeCount = 56;
  for(let i=0;i<nodeCount;i++){
    const ring = i % 3;
    const baseR = ring===0 ? 110 + rand()*70 : ring===1 ? 190 + rand()*85 : 285 + rand()*100;
    const angle = rand() * Math.PI * 2;
    const speed = (ring===0?0.00022:ring===1?0.00014:0.00009) * (0.8 + rand()*0.6);
    const size = ring===0 ? 2 + rand()*2 : 1.5 + rand()*2;
    const c = palette[(i + Math.floor(rand()*palette.length)) % palette.length];
    nodes.push({
      baseR, angle, speed, size, ring, c,
      wobble: 20 + rand()*60,
      wobbleSpeed: 0.00025 + rand()*0.0005,
      phase: rand()*Math.PI*2
    });
  }

  const streams = [];
  for(let i=0;i<12;i++){
    streams.push({
      x: 120 + i*72 + rand()*18,
      y: rand()*H,
      len: 140 + rand()*240,
      speed: 0.55 + rand()*0.65,
      alpha: 0.03 + rand()*0.05
    });
  }

  const bars = [];
  for(let i=0;i<40;i++){
    bars.push({
      x: 110 + i*22,
      h: 18 + rand()*110,
      phase: rand()*Math.PI*2,
      speed: 0.001 + rand()*0.002
    });
  }

  function drawBackgroundBands(t){
    const y1 = 250 + Math.sin(t*0.00018)*18;
    const y2 = 1320 + Math.sin(t*0.00015 + 0.6)*25;

    let g = ctx.createLinearGradient(0,y1,W,y1+220);
    g.addColorStop(0,'rgba(110,247,255,0)');
    g.addColorStop(0.5,'rgba(110,247,255,0.08)');
    g.addColorStop(1,'rgba(110,247,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,y1-80,W,240);

    let g2 = ctx.createLinearGradient(0,y2,W,y2+180);
    g2.addColorStop(0,'rgba(255,79,216,0)');
    g2.addColorStop(0.5,'rgba(255,79,216,0.05)');
    g2.addColorStop(1,'rgba(255,79,216,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0,y2-50,W,200);
  }

  function drawStreams(t){
    ctx.save();
    for(const s of streams){
      const yy = (s.y + t*s.speed*0.08) % (H + s.len) - s.len;
      const grad = ctx.createLinearGradient(s.x, yy, s.x, yy + s.len);
      grad.addColorStop(0, 'rgba(110,247,255,0)');
      grad.addColorStop(0.35, `rgba(110,247,255,${s.alpha})`);
      grad.addColorStop(0.55, `rgba(255,79,216,${s.alpha*0.8})`);
      grad.addColorStop(1, 'rgba(110,247,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(s.x, yy);
      ctx.lineTo(s.x, yy + s.len);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawNetwork(t){
    const cx = W/2, cy = 690;
    const pts = [];
    for(const n of nodes){
      const a = n.angle + t*n.speed;
      const r = n.baseR + Math.sin(t*n.wobbleSpeed + n.phase) * n.wobble;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r * 0.73;
      pts.push({x,y,n});
    }

    ctx.save();
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const dx = pts[i].x - pts[j].x;
        const dy = pts[i].y - pts[j].y;
        const d = Math.hypot(dx,dy);
        if(d < 150){
          const a = (1 - d/150) * 0.16;
          const grad = ctx.createLinearGradient(pts[i].x, pts[i].y, pts[j].x, pts[j].y);
          grad.addColorStop(0, `rgba(${pts[i].n.c[0]},${pts[i].n.c[1]},${pts[i].n.c[2]},${a})`);
          grad.addColorStop(1, `rgba(${pts[j].n.c[0]},${pts[j].n.c[1]},${pts[j].n.c[2]},${a*0.8})`);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.stroke();
        }
      }
    }

    for(const p of pts){
      const rr = p.n.size + Math.sin(t*0.002 + p.n.phase)*0.4;
      const glow = rr*5;
      const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,glow);
      grad.addColorStop(0, `rgba(${p.n.c[0]},${p.n.c[1]},${p.n.c[2]},0.95)`);
      grad.addColorStop(0.28, `rgba(${p.n.c[0]},${p.n.c[1]},${p.n.c[2]},0.35)`);
      grad.addColorStop(1, `rgba(${p.n.c[0]},${p.n.c[1]},${p.n.c[2]},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x,p.y,glow,0,Math.PI*2);
      ctx.fill();

      ctx.fillStyle = `rgba(${p.n.c[0]},${p.n.c[1]},${p.n.c[2]},0.95)`;
      ctx.beginPath();
      ctx.arc(p.x,p.y,rr,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawEqualizer(t){
    const baseX = 170, baseY = 189;
    ctx.save();
    for(let i=0;i<bars.length;i++){
      const b = bars[i];
      const v = (Math.sin(t*b.speed + b.phase)*0.5 + 0.5);
      const hh = 8 + b.h * v;
      const x = baseX + i*7.1;
      const grad = ctx.createLinearGradient(x, baseY+48, x, baseY+48-hh);
      grad.addColorStop(0,'rgba(61,124,255,0.18)');
      grad.addColorStop(1, i%7===0 ? 'rgba(255,79,216,0.75)' : 'rgba(110,247,255,0.85)');
      ctx.fillStyle = grad;
      ctx.fillRect(x, baseY+48-hh, 4, hh);
    }
    ctx.restore();
  }

  function drawWavePanels(t){
    function wave(x,y,w,h,colorA,colorB,phase){
      ctx.save();
      ctx.beginPath();
      ctx.rect(x,y,w,h);
      ctx.clip();
      ctx.lineWidth = 1.2;
      for(let k=0;k<7;k++){
        ctx.beginPath();
        for(let i=0;i<=w;i+=8){
          const py = y + h*0.2 + k*12 + Math.sin((i*0.022) + t*0.0013 + phase + k*0.45) * (6 + k*0.6);
          if(i===0) ctx.moveTo(x+i, py);
          else ctx.lineTo(x+i, py);
        }
        const a = 0.1 + k*0.022;
        ctx.strokeStyle = k%3===0 ? colorB.replace('ALPHA', a.toFixed(3)) : colorA.replace('ALPHA', a.toFixed(3));
        ctx.stroke();
      }
      ctx.restore();
    }
    wave(816, 318, 108, 122, 'rgba(110,247,255,ALPHA)', 'rgba(255,79,216,ALPHA)', 0.2);
    wave(162, 1490, 150, 48, 'rgba(110,247,255,ALPHA)', 'rgba(61,124,255,ALPHA)', 1.4);
    wave(804, 1120, 134, 36, 'rgba(110,247,255,ALPHA)', 'rgba(255,79,216,ALPHA)', 2.1);
  }

  function drawTarget(t){
    const x = 540, y = 690;
    ctx.save();
    ctx.strokeStyle = 'rgba(110,247,255,0.24)';
    ctx.lineWidth = 1;
    for(let i=0;i<5;i++){
      const r = 35 + i*26 + Math.sin(t*0.001 + i)*2;
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.stroke();
    }
    const rot = t*0.00025;
    for(let i=0;i<4;i++){
      const a = rot + i*Math.PI/2;
      ctx.strokeStyle = i%2===0 ? 'rgba(110,247,255,0.45)' : 'rgba(255,79,216,0.26)';
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a)*108, y + Math.sin(a)*108);
      ctx.lineTo(x + Math.cos(a)*168, y + Math.sin(a)*168);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCornerMarks(t){
    ctx.save();
    ctx.strokeStyle = 'rgba(110,247,255,0.24)';
    ctx.lineWidth = 1.2;
    const pulse = 0.7 + 0.3*Math.sin(t*0.0014);
    ctx.globalAlpha = pulse;
    const marks = [
      [76,76,84],[920,76,-84],[76,1764,84],[920,1764,-84]
    ];
    marks.forEach(m=>{
      const x=m[0], y=m[1], s=m[2];
      ctx.beginPath();
      ctx.moveTo(x,y+40); ctx.lineTo(x,y); ctx.lineTo(x+Math.sign(s)*40,y);
      ctx.stroke();
    });
    ctx.restore();
  }

  function render(t){
    ctx.clearRect(0,0,W,H);
    drawBackgroundBands(t);
    drawStreams(t);
    drawNetwork(t);
    drawTarget(t);
    drawEqualizer(t);
    drawWavePanels(t);
    drawCornerMarks(t);

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const grad = ctx.createRadialGradient(540,690,0,540,690,420);
    grad.addColorStop(0,'rgba(110,247,255,0.03)');
    grad.addColorStop(0.5,'rgba(61,124,255,0.035)');
    grad.addColorStop(1,'rgba(110,247,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(120,250,840,900);
    ctx.restore();

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
