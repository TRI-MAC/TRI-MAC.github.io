<title>2026-07-05</title>
<style>
  :root{
    --bg0:#120f17;
    --bg1:#1e2030;
    --bg2:#2d4b57;
    --bg3:#7b5f62;
    --sun1:#ff6aa6;
    --sun2:#ff9f7a;
    --sun3:#ffd16a;
    --neonCyan:#70f0ff;
    --neonMag:#ff57bf;
    --neonLav:#b38cff;
    --teal:#4c8087;
    --concrete:#4d4b54;
    --rust:#7f5f55;
    --ink:#0b0d12;
    --gold:#ffd6a2;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:
      radial-gradient(circle at 50% 20%, rgba(255,116,165,.08), transparent 30%),
      linear-gradient(180deg,#0a0b11 0%, #11111a 35%, #171827 60%, #0d0f16 100%);
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #frame{
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      linear-gradient(180deg, #3e4967 0%, #5b6584 7%, #7b6881 16%, #d36b89 28%, #f8927d 38%, #f6be72 46%, #6b5667 47%, #352d3c 56%, #1b2232 68%, #0d121d 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 30px 80px rgba(0,0,0,.55);
  }
  #frame::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(255,255,255,.12), transparent 18%),
      linear-gradient(0deg, rgba(0,0,0,.35), transparent 20%),
      radial-gradient(circle at 50% 30%, rgba(255,166,116,.12), transparent 28%),
      repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 1px, rgba(0,0,0,0) 1px 4px);
    mix-blend-mode:screen;
    opacity:.7;
    pointer-events:none;
  }
  #frame::after{
    content:"";
    position:absolute; inset:-5%;
    background:
      radial-gradient(circle at 50% 45%, transparent 55%, rgba(0,0,0,.22) 82%, rgba(0,0,0,.52) 100%);
    pointer-events:none;
  }

  .layer{position:absolute; inset:0; pointer-events:none;}
  #background-video{
    position:absolute;
    left:15%;
    top:23%;
    width:70%;
    height:50%;
    object-fit:cover;
    opacity:.82;
    filter:saturate(1.15) contrast(1.06) brightness(.9) hue-rotate(318deg);
    mix-blend-mode:screen;
    clip-path:polygon(6% 0,94% 0,100% 11%,100% 89%,94% 100%,6% 100%,0 89%,0 11%);
    transform-origin:center;
    animation: videoBreath 32s ease-in-out infinite;
    box-shadow:
      0 0 0 1px rgba(255,155,195,.3),
      0 0 30px rgba(255,111,174,.18),
      0 0 80px rgba(111,240,255,.09);
  }
  @keyframes videoBreath{
    0%,100%{transform:scale(1.02) translateY(0)}
    50%{transform:scale(1.06) translateY(-1.2%)}
  }

  .skyGlow{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 32%, rgba(255,229,148,.8) 0 6%, rgba(255,176,124,.7) 6% 12%, rgba(255,104,157,.45) 12% 18%, rgba(255,77,150,.12) 18% 26%, transparent 26%),
      linear-gradient(180deg, rgba(255,155,170,.18) 0 26%, transparent 30%);
    opacity:.9;
    animation: glowPulse 18s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{transform:scale(1); opacity:.82}
    50%{transform:scale(1.03); opacity:.96}
  }

  .sunRings{
    position:absolute;
    left:50%; top:32%;
    width:54%;
    height:54%;
    transform:translate(-50%,-50%);
    opacity:.58;
    filter:blur(.15px);
    mask-image:radial-gradient(circle, rgba(0,0,0,1) 0 57%, rgba(0,0,0,.7) 72%, transparent 96%);
    animation: ringShift 36s linear infinite;
  }
  @keyframes ringShift{
    from{transform:translate(-50%,-50%) rotate(0deg)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
  }

  .gridPlane{
    position:absolute;
    left:-8%; right:-8%; bottom:-4%;
    height:40%;
    transform:perspective(600px) rotateX(72deg);
    transform-origin:center bottom;
    background:
      repeating-linear-gradient(90deg, rgba(112,240,255,.44) 0 2px, transparent 2px 8.5%),
      repeating-linear-gradient(180deg, rgba(112,240,255,.36) 0 2px, transparent 2px 10%);
    opacity:.48;
    filter:drop-shadow(0 0 10px rgba(112,240,255,.18));
    animation:gridHum 20s ease-in-out infinite;
  }
  @keyframes gridHum{
    0%,100%{opacity:.42; transform:perspective(600px) rotateX(72deg) translateY(0)}
    50%{opacity:.56; transform:perspective(600px) rotateX(72deg) translateY(1%)}
  }

  svg{display:block;width:100%;height:100%}

  #citySvg{
    position:absolute; inset:0;
    opacity:1;
  }

  .canalFog{
    position:absolute;
    left:0; right:0; bottom:18%;
    height:20%;
    background:
      linear-gradient(180deg, rgba(99,196,209,.04), rgba(33,59,67,.18) 42%, rgba(10,17,24,.45)),
      radial-gradient(circle at 30% 40%, rgba(255,120,168,.08), transparent 20%),
      radial-gradient(circle at 75% 45%, rgba(112,240,255,.08), transparent 18%);
    filter:blur(10px);
    opacity:.9;
    animation:fogSlide 26s ease-in-out infinite;
  }
  @keyframes fogSlide{
    0%,100%{transform:translateX(-1%)}
    50%{transform:translateX(1.5%)}
  }

  .vhs{
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.03) 0 1px, rgba(0,0,0,0) 1px 3px),
      linear-gradient(90deg, rgba(255,0,140,.03), transparent 18%, transparent 82%, rgba(0,255,255,.03));
    mix-blend-mode:screen;
    opacity:.55;
    animation:vhsDrift 12s steps(4,end) infinite;
  }
  @keyframes vhsDrift{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(.5px)}
    50%{transform:translateX(-.8px)}
    75%{transform:translateX(.3px)}
  }

  .edgeShade{
    position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(5,8,12,.46), transparent 11%, transparent 89%, rgba(5,8,12,.5)),
      linear-gradient(180deg, rgba(5,8,12,.14), transparent 10%, transparent 88%, rgba(5,8,12,.46));
    pointer-events:none;
  }

  .date{
    position:absolute;
    right:18px;
    bottom:12px;
    font-size:14px;
    letter-spacing:.18em;
    color:rgba(212,231,245,.48);
    text-transform:uppercase;
    z-index:20;
  }

  #guinea-pig{
    position:absolute;
    width:17px;
    height:auto;
    left:87px;
    bottom:363px;
    opacity:.58;
    filter:saturate(.7) brightness(.85) hue-rotate(170deg);
    z-index:12;
    transform:scaleX(-1);
  }

  #signs{
    position:absolute; inset:0;
    mix-blend-mode:screen;
    opacity:.72;
    animation:signBreath 14s ease-in-out infinite;
  }
  @keyframes signBreath{
    0%,100%{opacity:.6}
    50%{opacity:.78}
  }

  canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
  }
</style>

<script>
(() => {
  const seedStr = "2026-07-05";
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = (seed * 131 + seedStr.charCodeAt(i)) >>> 0;
  function rand(){
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >> 17; seed >>>= 0;
    seed ^= seed << 5;  seed >>>= 0;
    return (seed >>> 0) / 4294967296;
  }

  const back = document.getElementById('backCanvas');
  const front = document.getElementById('frontCanvas');
  const bctx = back.getContext('2d');
  const fctx = front.getContext('2d');
  const W = back.width, H = back.height;

  const rainCols = [];
  for(let i=0;i<36;i++){
    rainCols.push({
      x: 90 + rand()*900,
      y: 760 + rand()*420,
      len: 90 + rand()*170,
      speed: .4 + rand()*.45,
      alpha: .05 + rand()*.08,
      cyan: rand()>.5
    });
  }

  const drips = [];
  for(let i=0;i<14;i++){
    drips.push({
      x: [214,597,775,201,528,742,880][i % 7] + (rand()*10-5),
      top: 900 + rand()*180,
      phase: rand()*Math.PI*2,
      size: 2 + rand()*5
    });
  }

  const windows = [];
  const towers = [
    {x:30,y:760,w:120,h:410},
    {x:230,y:800,w:84,h:220},
    {x:414,y:715,w:270,h:290},
    {x:782,y:748,w:70,h:180}
  ];
  towers.forEach(t=>{
    const cols = Math.max(2, Math.floor(t.w/24));
    const rows = Math.max(4, Math.floor(t.h/34));
    for(let cx=0; cx<cols; cx++){
      for(let ry=0; ry<rows; ry++){
        if(rand()>.42){
          windows.push({
            x:t.x + 8 + cx*(t.w-16)/cols,
            y:t.y + 10 + ry*(t.h-20)/rows,
            w:8 + rand()*9,
            h:14 + rand()*15,
            hue: rand()>.52 ? 'cyan' : 'mag',
            pulse: rand()*Math.PI*2
          });
        }
      }
    }
  });

  const noise = document.createElement('canvas');
  noise.width = W; noise.height = H;
  const nctx = noise.getContext('2d');
  const img = nctx.createImageData(W,H);
  for(let i=0;i<img.data.length;i+=4){
    const v = 18 + rand()*34;
    img.data[i] = v;
    img.data[i+1] = v;
    img.data[i+2] = v + rand()*10;
    img.data[i+3] = 20 + rand()*18;
  }
  nctx.putImageData(img,0,0);

  function drawBack(t){
    bctx.clearRect(0,0,W,H);

    bctx.globalAlpha = .16;
    bctx.drawImage(noise,0,0);
    bctx.globalAlpha = 1;

    for(const w of windows){
      const a = .18 + .16*(.5 + .5*Math.sin(t*0.00035 + w.pulse));
      bctx.fillStyle = w.hue === 'cyan' ? `rgba(112,240,255,${a})` : `rgba(255,110,182,${a})`;
      bctx.fillRect(w.x,w.y,w.w,w.h);
    }

    for(const r of rainCols){
      const off = (t*0.03*r.speed) % 200;
      bctx.strokeStyle = r.cyan ? `rgba(112,240,255,${r.alpha})` : `rgba(255,145,190,${r.alpha*.8})`;
      bctx.lineWidth = 2;
      bctx.beginPath();
      bctx.moveTo(r.x, r.y + off);
      bctx.lineTo(r.x-8, r.y + off + r.len);
      bctx.stroke();
      bctx.beginPath();
      bctx.moveTo(r.x, r.y - 220 + off);
      bctx.lineTo(r.x-8, r.y - 220 + off + r.len);
      bctx.stroke();
    }

    const shimmerY = 1300;
    for(let i=0;i<12;i++){
      const x = 110 + i*78 + Math.sin(t*0.00045+i)*8;
      const ww = 24 + (i%3)*10;
      const hh = 170 + (i%4)*18;
      const grad = bctx.createLinearGradient(x, shimmerY, x, shimmerY+hh);
      grad.addColorStop(0, i%2 ? 'rgba(255,126,182,.18)' : 'rgba(112,240,255,.18)');
      grad.addColorStop(1, 'rgba(112,240,255,0)');
      bctx.fillStyle = grad;
      bctx.fillRect(x, shimmerY, ww, hh);
    }
  }

  function drawFront(t){
    fctx.clearRect(0,0,W,H);

    fctx.save();
    fctx.globalCompositeOperation = 'screen';
    for(const d of drips){
      const swing = Math.sin(t*0.0011 + d.phase);
      const y = d.top + 36 + (swing*16+16);
      const x = d.x + Math.sin(t*0.0008 + d.phase)*3;
      const grad = fctx.createLinearGradient(x,y-18,x,y+20);
      grad.addColorStop(0,'rgba(210,250,255,0)');
      grad.addColorStop(.55,'rgba(170,245,255,.33)');
      grad.addColorStop(1,'rgba(255,125,188,0)');
      fctx.fillStyle = grad;
      fctx.fillRect(x-1.5, y-18, 3, 30);

      fctx.beginPath();
      fctx.fillStyle = d.phase > 3 ? 'rgba(255,128,185,.35)' : 'rgba(120,242,255,.32)';
      fctx.arc(x, y+18, d.size, 0, Math.PI*2);
      fctx.fill();
    }
    fctx.restore();

    fctx.save();
    fctx.globalCompositeOperation = 'screen';
    let rise = Math.sin(t*0.0002)*5;
    const bands = [
      {y:1215+rise,c:'rgba(112,240,255,.09)',h:7},
      {y:1238+rise*.7,c:'rgba(255,118,176,.08)',h:4},
      {y:1266+rise*.5,c:'rgba(112,240,255,.06)',h:3},
    ];
    bands.forEach(b=>{
      fctx.fillStyle = b.c;
      fctx.fillRect(0,b.y,W,b.h);
    });
    fctx.restore();

    fctx.save();
    fctx.fillStyle = 'rgba(0,0,0,.22)';
    fctx.beginPath();
    fctx.moveTo(0,1162); fctx.lineTo(365,1162); fctx.lineTo(312,1600); fctx.lineTo(0,1600); fctx.closePath();
    fctx.fill();
    fctx.beginPath();
    fctx.moveTo(715,1162); fctx.lineTo(W,1162); fctx.lineTo(W,1600); fctx.lineTo(768,1600); fctx.closePath();
    fctx.fill();
    fctx.restore();
  }

  function frame(t){
    drawBack(t);
    drawFront(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if (window.self === window.top) {
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain();
      master.gain.value = 0.016;
      master.connect(ctx.destination);

      const low = ctx.createOscillator();
      low.type = 'sawtooth';
      low.frequency.value = 44;

      const lowGain = ctx.createGain();
      lowGain.gain.value = 0.018;

      const high = ctx.createOscillator();
      high.type = 'triangle';
      high.frequency.value = 176;

      const highGain = ctx.createGain();
      highGain.gain.value = 0.005;

      const lfo = ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.047;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 8;

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 420;
      filter.Q.value = 0.7;

      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      low.connect(lowGain).connect(filter);
      high.connect(highGain).connect(filter);
      filter.connect(master);

      low.start();
      high.start();
      lfo.start();

      const now = ctx.currentTime;
      high.frequency.setValueAtTime(176, now);
      high.frequency.linearRampToValueAtTime(132, now + 18);
      high.frequency.linearRampToValueAtTime(176, now + 36);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) master.gain.value = 0.0;
        else master.gain.value = 0.016;
      });
    }catch(e){}
  }
})();
</script>
