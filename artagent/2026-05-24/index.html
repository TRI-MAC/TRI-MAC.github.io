<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>2026-05-24</title>
<style>
  :root{
    --bg0:#09051a;
    --bg1:#140a2f;
    --bg2:#22094f;
    --violet:#8e5cff;
    --magenta:#ff4fcf;
    --pink:#ff7fc7;
    --cyan:#67f2ff;
    --teal:#44d7d2;
    --sun1:#ff7f4d;
    --sun2:#ffd36b;
    --grid:#7cc8ff;
    --white:#f7f0ff;
    --ink:#07030f;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 84%, rgba(255,131,77,.22), transparent 26%),
      radial-gradient(90% 50% at 50% 62%, rgba(255,72,197,.18), transparent 42%),
      linear-gradient(180deg, #2a0f57 0%, #120726 40%, #090312 100%);
    box-shadow:0 0 40px rgba(0,0,0,.5);
  }

  #bg-gradient{
    position:absolute; inset:0;
    background:
      radial-gradient(60% 38% at 50% 32%, rgba(255,132,214,.12), transparent 60%),
      radial-gradient(45% 22% at 50% 72%, rgba(255,156,76,.18), transparent 62%),
      linear-gradient(180deg, #33105f 0%, #180831 36%, #0a0416 100%);
    animation: hueDrift 24s ease-in-out infinite;
    filter:saturate(1.15);
  }

  #vignette{
    position:absolute; inset:-8%;
    background:
      radial-gradient(80% 120% at 50% 45%, transparent 56%, rgba(0,0,0,.18) 72%, rgba(0,0,0,.58) 100%);
    pointer-events:none;
  }

  #sun{
    position:absolute;
    width:72%;
    aspect-ratio:1/1;
    left:14%;
    top:10.8%;
    border-radius:50%;
    background:
      linear-gradient(180deg, rgba(255,225,122,.98) 0%, rgba(255,150,84,.98) 55%, rgba(255,88,154,.98) 100%);
    box-shadow:
      0 0 40px rgba(255,153,93,.22),
      0 0 130px rgba(255,90,186,.16);
    opacity:.95;
    filter:saturate(1.1);
    animation:sunBreathe 18s ease-in-out infinite;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0 78%, transparent 95%);
            mask-image: radial-gradient(circle at 50% 50%, #000 0 78%, transparent 95%);
  }
  #sun::before{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    background:
      repeating-linear-gradient(
        180deg,
        rgba(20,7,38,0) 0 4.8%,
        rgba(20,7,38,.9) 4.8% 6.7%
      );
    mix-blend-mode:multiply;
    opacity:.72;
  }
  #sun::after{
    content:"";
    position:absolute; inset:-7%;
    border-radius:50%;
    background:
      radial-gradient(circle, rgba(255,182,100,.18), transparent 58%);
    filter:blur(18px);
    z-index:-1;
  }

  #horizonGlow{
    position:absolute;
    left:0; right:0;
    top:49.4%;
    height:10%;
    background:linear-gradient(180deg, rgba(255,124,89,.16), rgba(255,124,89,0));
    filter:blur(8px);
  }

  #gridWrap{
    position:absolute;
    left:-10%;
    right:-10%;
    bottom:-3%;
    height:44%;
    perspective:900px;
    pointer-events:none;
    opacity:.92;
    -webkit-mask-image:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.55) 15%, #000 36%, #000 100%);
            mask-image:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.55) 15%, #000 36%, #000 100%);
  }
  #grid{
    position:absolute;
    left:0; right:0; top:-16%; bottom:-38%;
    transform-origin:center top;
    transform:rotateX(72deg);
    background:
      repeating-linear-gradient(90deg,
        rgba(111,228,255,.9) 0 2px,
        transparent 2px 8.333%),
      repeating-linear-gradient(180deg,
        rgba(111,228,255,.72) 0 2px,
        transparent 2px 9.1%);
    filter:
      drop-shadow(0 0 6px rgba(101,244,255,.55))
      drop-shadow(0 0 14px rgba(141,92,255,.22));
    opacity:.8;
    animation:gridShift 20s linear infinite;
  }

  #moire{
    position:absolute; inset:-8%;
    opacity:.17;
    mix-blend-mode:screen;
    background:
      repeating-radial-gradient(circle at 50% 34%,
        rgba(255,255,255,.95) 0 2px,
        rgba(0,0,0,0) 2px 10px),
      repeating-linear-gradient(90deg,
        rgba(103,242,255,.65) 0 1px,
        transparent 1px 7px);
    transform:scale(1.08) rotate(-4deg);
    filter:blur(.15px);
    animation:moireShiftA 19s ease-in-out infinite;
    -webkit-mask-image:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,.9) 0 58%, rgba(0,0,0,.4) 72%, transparent 92%);
            mask-image:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,.9) 0 58%, rgba(0,0,0,.4) 72%, transparent 92%);
  }
  #moire2{
    position:absolute; inset:-12%;
    opacity:.12;
    mix-blend-mode:overlay;
    background:
      repeating-linear-gradient(0deg,
        rgba(255,90,200,.7) 0 1px,
        transparent 1px 8px),
      repeating-radial-gradient(circle at 50% 34%,
        rgba(255,247,255,.7) 0 1.7px,
        transparent 1.7px 13px);
    transform:scale(1.15) rotate(2deg);
    animation:moireShiftB 23s ease-in-out infinite;
    -webkit-mask-image:radial-gradient(ellipse at 50% 40%, rgba(0,0,0,.75) 0 62%, transparent 96%);
            mask-image:radial-gradient(ellipse at 50% 40%, rgba(0,0,0,.75) 0 62%, transparent 96%);
  }

  svg#architecture{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    opacity:.85;
  }

  #particleCanvas, #fxCanvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
  }
  #particleCanvas{
    mix-blend-mode:screen;
    opacity:.95;
  }
  #fxCanvas{
    pointer-events:none;
    opacity:.45;
  }

  #scanlines{
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      180deg,
      rgba(255,255,255,.04) 0 1px,
      rgba(0,0,0,0) 1px 4px
    );
    opacity:.18;
    mix-blend-mode:soft-light;
    pointer-events:none;
  }

  #noise{
    position:absolute; inset:0;
    opacity:.08;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.65) 0 .6px, transparent .8px),
      radial-gradient(circle at 72% 38%, rgba(255,255,255,.4) 0 .7px, transparent .9px),
      radial-gradient(circle at 38% 81%, rgba(255,255,255,.45) 0 .5px, transparent .8px),
      radial-gradient(circle at 82% 72%, rgba(255,255,255,.35) 0 .6px, transparent .8px);
    background-size: 7px 7px, 9px 9px, 11px 11px, 13px 13px;
    animation:noiseShift 0.9s steps(2,end) infinite;
    mix-blend-mode:screen;
    pointer-events:none;
  }

  #bands{
    position:absolute; inset:0;
    pointer-events:none;
    opacity:.5;
  }
  .band{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    border:2px solid rgba(125,230,255,.65);
    border-radius:50%;
    filter:drop-shadow(0 0 8px rgba(103,242,255,.18));
    -webkit-mask-image:radial-gradient(circle, #000 60%, transparent 100%);
            mask-image:radial-gradient(circle, #000 60%, transparent 100%);
  }
  .b1{ top:16%; width:88%; height:28%; animation:ringFloat 14s ease-in-out infinite; opacity:.28;}
  .b2{ top:20%; width:72%; height:22%; animation:ringFloat 18s ease-in-out infinite reverse; opacity:.22;}
  .b3{ top:25%; width:56%; height:16%; animation:ringFloat 16s ease-in-out infinite; opacity:.18;}

  #date{
    position:absolute;
    right:24px;
    bottom:18px;
    color:rgba(245,240,255,.6);
    font-size:15px;
    letter-spacing:.18em;
    text-transform:uppercase;
    z-index:20;
    text-shadow:0 0 8px rgba(0,0,0,.45);
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    width:18px;
    height:auto;
    right:12px;
    bottom:74px;
    opacity:.58;
    filter:saturate(.8) hue-rotate(292deg) brightness(.82) contrast(1.08) drop-shadow(0 0 1px rgba(255,170,220,.15));
    transform:rotate(-8deg);
    z-index:6;
  }

  @keyframes hueDrift{
    0%,100%{filter:hue-rotate(0deg) saturate(1.15)}
    50%{filter:hue-rotate(12deg) saturate(1.28)}
  }
  @keyframes sunBreathe{
    0%,100%{transform:scale(1) translateY(0)}
    50%{transform:scale(1.02) translateY(6px)}
  }
  @keyframes gridShift{
    0%{transform:rotateX(72deg) translateY(0)}
    100%{transform:rotateX(72deg) translateY(32px)}
  }
  @keyframes moireShiftA{
    0%,100%{transform:scale(1.08) rotate(-4deg)}
    50%{transform:scale(1.11) rotate(-2deg)}
  }
  @keyframes moireShiftB{
    0%,100%{transform:scale(1.15) rotate(2deg) translateY(0)}
    50%{transform:scale(1.12) rotate(5deg) translateY(-6px)}
  }
  @keyframes noiseShift{
    0%{transform:translate(0,0)}
    50%{transform:translate(-1px,1px)}
    100%{transform:translate(1px,-1px)}
  }
  @keyframes ringFloat{
    0%,100%{transform:translateX(-50%) scale(1)}
    50%{transform:translateX(-50%) scale(1.03)}
  }
</style>
</head>
<body>
<div id="frame">
  <div id="bg-gradient"></div>
  <div id="sun"></div>
  <div id="moire"></div>
  <div id="moire2"></div>
  <div id="horizonGlow"></div>

  <div id="gridWrap"><div id="grid"></div></div>

  <svg id="architecture" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="archGlow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#71f0ff" stop-opacity="0.0"/>
        <stop offset="50%" stop-color="#71f0ff" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#ff68d0" stop-opacity="0.15"/>
      </linearGradient>
      <linearGradient id="towerFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#130722" stop-opacity="0.05"/>
        <stop offset="100%" stop-color="#05020a" stop-opacity="0.9"/>
      </linearGradient>
    </defs>

    <g opacity="0.78">
      <polygon points="100,1400 215,1160 330,1400" fill="url(#towerFill)"/>
      <polygon points="750,1400 860,1120 980,1400" fill="url(#towerFill)"/>
      <rect x="458" y="980" width="164" height="420" fill="url(#towerFill)"/>
      <polygon points="540,835 640,980 440,980" fill="rgba(12,6,21,0.88)"/>
    </g>

    <g fill="none" stroke="url(#archGlow)" stroke-width="4" opacity="0.7">
      <line x1="540" y1="850" x2="540" y2="1500"/>
      <line x1="458" y1="980" x2="458" y2="1500"/>
      <line x1="622" y1="980" x2="622" y2="1500"/>
      <line x1="156" y1="1400" x2="156" y2="1680"/>
      <line x1="274" y1="1400" x2="274" y2="1680"/>
      <line x1="806" y1="1400" x2="806" y2="1680"/>
      <line x1="924" y1="1400" x2="924" y2="1680"/>
    </g>

    <g opacity="0.35">
      <rect x="446" y="1002" width="12" height="350" fill="#69ebff"/>
      <rect x="622" y="1002" width="12" height="350" fill="#69ebff"/>
      <rect x="534" y="1002" width="12" height="350" fill="#ffd172"/>
    </g>

    <g opacity="0.7" fill="#09030f">
      <rect x="0" y="1468" width="1080" height="452"/>
      <polygon points="0,1512 200,1454 354,1512 510,1430 660,1512 794,1458 950,1512 1080,1468 1080,1920 0,1920"/>
    </g>
  </svg>

  <canvas id="particleCanvas" width="1080" height="1920"></canvas>
  <canvas id="fxCanvas" width="1080" height="1920"></canvas>

  <div id="bands">
    <div class="band b1"></div>
    <div class="band b2"></div>
    <div class="band b3"></div>
  </div>

  <div id="scanlines"></div>
  <div id="noise"></div>
  <div id="vignette"></div>

  <img id="guinea-pig" src="guineapig.png" alt="" />
  <div id="date">2026-05-24</div>
</div>

<script>
(() => {
  const DATE_STR = "2026-05-24";
  function hashString(str){
    let h = 2166136261 >>> 0;
    for(let i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
  }
  const seed = hashString(DATE_STR + "-opart-vaporwave-cosmos");
  const rand = mulberry32(seed);

  const frame = document.getElementById('frame');
  const canvas = document.getElementById('particleCanvas');
  const fx = document.getElementById('fxCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const fctx = fx.getContext('2d', { alpha: true });

  let w = 1080, h = 1920, dpr = 1;
  function resize(){
    const rect = frame.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    fx.width = rect.width * dpr;
    fx.height = rect.height * dpr;
    canvas.style.width = fx.style.width = rect.width + 'px';
    canvas.style.height = fx.style.height = rect.height + 'px';
    w = rect.width;
    h = rect.height;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    fctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  addEventListener('resize', resize);

  const sun = { x: 0.5, y: 0.34 };
  const lanes = [];
  const laneCount = 6;
  for(let i=0;i<laneCount;i++){
    lanes.push({
      r: 70 + i * 44 + rand() * 16,
      speed: (0.00045 + i * 0.00007) * (rand() > .5 ? 1 : -1),
      phase: rand() * Math.PI * 2
    });
  }

  const palette = [
    [255,110,205],
    [102,242,255],
    [255,211,107],
    [150,109,255],
    [255,129,77]
  ];

  const particles = [];
  const PCOUNT = 2200;
  for(let i=0;i<PCOUNT;i++){
    const lane = lanes[i % laneCount];
    const a = rand() * Math.PI * 2;
    const rr = lane.r * (0.6 + rand()*1.5);
    const cx = w * sun.x;
    const cy = h * sun.y;
    const x = cx + Math.cos(a) * rr;
    const y = cy + Math.sin(a) * rr * 0.72;
    const pcol = palette[(i + Math.floor(rand()*palette.length)) % palette.length];
    particles.push({
      x, y,
      vx:(rand()-0.5)*0.25,
      vy:(rand()-0.5)*0.25,
      hue: pcol,
      lane: i % laneCount,
      phase: rand() * Math.PI * 2,
      size: 0.7 + rand()*1.55,
      alpha: 0.20 + rand()*0.55
    });
  }

  const attractors = [
    {x:0.5, y:0.34, mass: 1.28},
    {x:0.28, y:0.59, mass: 0.36},
    {x:0.72, y:0.61, mass: 0.34},
    {x:0.5, y:0.81, mass:-0.18}
  ];

  function drawFX(t){
    fctx.clearRect(0,0,w,h);

    const cx = w*0.5, cy = h*0.34;
    const time = t*0.0002;

    for(let k=0;k<4;k++){
      const rad = w*(0.16 + k*0.055 + 0.01*Math.sin(time*6 + k));
      fctx.beginPath();
      fctx.ellipse(cx, cy, rad, rad*0.56, 0, 0, Math.PI*2);
      fctx.strokeStyle = k % 2
        ? `rgba(255,120,200,${0.06-k*0.008})`
        : `rgba(110,240,255,${0.08-k*0.01})`;
      fctx.lineWidth = 2 + k*0.4;
      fctx.stroke();
    }

    const bars = 18;
    for(let i=0;i<bars;i++){
      const yy = h*(0.17 + i*0.0215);
      const wob = Math.sin(time*9 + i*0.7)*8;
      fctx.fillStyle = i%2
        ? 'rgba(255,93,188,0.05)'
        : 'rgba(118,236,255,0.04)';
      fctx.fillRect(w*0.23, yy + wob, w*0.54, 1.5);
    }

    const grd = fctx.createLinearGradient(0,h*0.64,0,h);
    grd.addColorStop(0,'rgba(255,115,98,0)');
    grd.addColorStop(1,'rgba(255,76,168,0.12)');
    fctx.fillStyle = grd;
    fctx.fillRect(0,h*0.62,w,h*0.38);
  }

  let last = performance.now();
  function animate(now){
    const dt = Math.min(32, now - last);
    last = now;

    ctx.fillStyle = 'rgba(5,2,12,0.085)';
    ctx.fillRect(0,0,w,h);

    const time = now * 0.001;
    const centerX = w * sun.x;
    const centerY = h * sun.y;

    attractors[0].x = 0.5 + Math.sin(time * 0.09) * 0.015;
    attractors[0].y = 0.34 + Math.cos(time * 0.08) * 0.008;
    attractors[1].x = 0.27 + Math.sin(time * 0.22) * 0.015;
    attractors[2].x = 0.73 + Math.cos(time * 0.22) * 0.015;

    for(let i=0;i<particles.length;i++){
      const p = particles[i];
      let ax = 0, ay = 0;

      for(let j=0;j<attractors.length;j++){
        const a = attractors[j];
        const tx = w*a.x;
        const ty = h*a.y;
        let dx = tx - p.x;
        let dy = ty - p.y;
        let d2 = dx*dx + dy*dy + 120;
        let inv = 1 / Math.sqrt(d2);
        let force = a.mass / d2;
        ax += dx * force * 4200;
        ay += dy * force * 4200;
      }

      const lane = lanes[p.lane];
      const ang = Math.atan2((p.y-centerY)/0.72, (p.x-centerX));
      const tangent = ang + Math.PI/2;
      ax += Math.cos(tangent + lane.phase + time*lane.speed*16) * 0.012;
      ay += Math.sin(tangent + lane.phase + time*lane.speed*16) * 0.012;

      const osc = Math.sin(time*0.8 + p.phase) * 0.018;
      ax += Math.cos(ang*3 + p.phase) * osc;
      ay += Math.sin(ang*2 + p.phase) * osc * 0.8;

      p.vx = (p.vx + ax) * 0.985;
      p.vy = (p.vy + ay) * 0.985;
      p.x += p.vx * (dt * 0.06);
      p.y += p.vy * (dt * 0.06);

      if (p.x < -40 || p.x > w+40 || p.y < -40 || p.y > h+40){
        const aa = rand()*Math.PI*2;
        const rr = lane.r * (0.8 + rand()*1.4);
        p.x = centerX + Math.cos(aa) * rr;
        p.y = centerY + Math.sin(aa) * rr * 0.72;
        p.vx = (rand()-0.5)*0.2;
        p.vy = (rand()-0.5)*0.2;
      }

      const tw = 0.75 + 0.25*Math.sin(time*1.4 + p.phase);
      const c = p.hue;
      ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${p.alpha*tw})`;
      const size = p.size * (0.75 + 0.45*Math.sin(time*0.6 + p.phase));
      ctx.fillRect(p.x, p.y, size, size);

      if(i % 28 === 0){
        ctx.beginPath();
        ctx.arc(p.x, p.y, size*2.2, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${0.04*tw})`;
        ctx.fill();
      }
    }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(let r=0;r<3;r++){
      ctx.beginPath();
      const rr = w*(0.1 + r*0.04 + 0.005*Math.sin(time + r));
      ctx.ellipse(centerX, centerY, rr, rr*0.56, 0, 0, Math.PI*2);
      ctx.strokeStyle = r===1 ? 'rgba(255,115,190,0.05)' : 'rgba(110,240,255,0.05)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    ctx.restore();

    drawFX(now);
    requestAnimationFrame(animate);
  }

  ctx.fillStyle = '#05020c';
  ctx.fillRect(0,0,w,h);
  requestAnimationFrame(animate);

  if (window.self === window.top) {
    try{
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const master = audioCtx.createGain();
      master.gain.value = 0.018;
      master.connect(audioCtx.destination);

      const tones = [110, 146.83, 196, 220.0];
      tones.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filt = audioCtx.createBiquadFilter();
        osc.type = i % 2 ? 'triangle' : 'sine';
        osc.frequency.value = f;
        filt.type = 'lowpass';
        filt.frequency.value = 500 + i*180;
        gain.gain.value = 0.0;
        osc.connect(filt);
        filt.connect(gain);
        gain.connect(master);
        osc.start();

        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.type = 'sine';
        lfo.frequency.value = 0.018 + i*0.007;
        lfoGain.gain.value = 0.018 + i*0.006;
        lfo.connect(lfoGain);
        lfoGain.connect(gain.gain);
        lfo.start();
      });
    }catch(e){}
  }
