<script>
(function(){
const stage=document.getElementById('stage');
function fit(){
 const w=window.innerWidth,h=window.innerHeight;
 const s=Math.min(w/1080,h/1920);
 stage.style.transform='scale('+s+')';
 stage.style.left=((w-1080*s)/2)+'px';
 stage.style.top=((h-1920*s)/2)+'px';
}
fit();
window.addEventListener('resize',fit,{passive:true});
const seed=20261106;
document.querySelectorAll('.slide-a,.slide-b,.slide-c').forEach(function(el,i){
 el.style.animationDelay='-'+((seed%19+i*3.7)%24)+'s';
});
})();
