<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>2026-10-04</title>
<style>
html,body{margin:0;height:100%;background:#efe3cc;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:top left;background:#f1e4cb;overflow:hidden}
#art-image{position:absolute;left:90px;top:1180px;width:900px;height:600px;object-fit:cover;filter:sepia(.25) saturate(1.1) contrast(1.05);box-shadow:0 18px 30px rgba(90,50,20,.25)}
#loom{position:absolute;left:0;top:0;width:1080px;height:1920px}
#date{position:absolute;right:40px;bottom:40px;font:16px Georgia,serif;color:#6b3d22;opacity:.45;letter-spacing:3px}
#guinea-pig{position:absolute;left:96px;top:1764px;width:15px;opacity:.5}
.rot{animation:sp 40s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sp{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
</style></head><body>
<div id="stage">
<svg id="loom" viewBox="0 0 1080 1920"><g id="tiles"></g><g id="front"></g></svg>
<img id="art-image" src="art.png" alt="">
<img id="guinea-pig" src="guineapig.png" alt="">
<svg style="position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none" viewBox="0 0 1080 1920"><g id="over"></g></svg>
<div id="date">2026·10·04</div>
</div>
<script>
const st=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);st.style.transform=`translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
let seed=20261004;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const NS='http://www.w3.org/2000/svg';
const pal=['#b5452a','#2f9e9a','#d99a3c','#5a2e1c'];
const g=document.getElementById('tiles'),ov=document.getElementById('over');
const S=120,cols=7,rows=8,ox=540-S*cols/2,oy=110;const tiles=[];
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
 const d=Math.abs(c-3)+Math.abs(r-3.5);
 if(d>5.5)continue;
 const x=ox+c*S,y=oy+r*S,w=document.createElementNS(NS,'g');
 // stepped diamond (woven terrace) tile: interlocking triangles
 const k=(c+r)%2;
 const p=document.createElementNS(NS,'polygon');
 const h=S/2;
 p.setAttribute('points',k?`${x},${y} ${x+S},${y} ${x+h},${y+h}`:`${x},${y+S} ${x+S},${y+S} ${x+h},${y+h}`);
 const q=document.createElementNS(NS,'polygon');
 q.setAttribute('points',`${x+h},${y+h-30} ${x+h+30},${y+h} ${x+h},${y+h+30} ${x+h-30},${y+h}`);
 q.setAttribute('class','rot');q.style.animationDelay=(-d*3)+'s';
 w.append(p,q);g.append(w);tiles.push({p,q,d,ph:R()*6});
}
// woven bands crossing the image edge (in front)
[[1150,'#b5452a'],[1810,'#2f9e9a']].forEach(([y,c])=>{
 for(let i=0;i<18;i++){const t=document.createElementNS(NS,'polygon');const x=i*60;
 t.setAttribute('points',`${x},${y} ${x+30},${y-22} ${x+60},${y} ${x+30},${y+22}`);
 t.setAttribute('fill',i%2?c:'#5a2e1c');ov.append(t)}});
function f(t){t/=1000;
 tiles.forEach(o=>{const a=(Math.sin(t*0.12-o.d*0.6+o.ph*0.1)+1)/2;
  const i=Math.floor(a*2.999);o.p.setAttribute('fill',pal[i]);o.p.style.opacity=.85;
  o.q.setAttribute('fill',pal[(i+1)%3]);});
 requestAnimationFrame(f)}
requestAnimationFrame(f);
</script></body></html>
