<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026-03-26</title>
<style>
  :root{
    --bg:#f6e61b;
    --red:#f23b2f;
    --blue:#1060ff;
    --cyan:#21d4ff;
    --cream:#fff6da;
    --black:#0a0a0d;
    --pink:#ff5db1;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family: Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }

  #frame{
    position:relative;
    width:min(100vw, calc(100vh * 1080 / 1920));
    height:min(100vh, calc(100vw * 1920 / 1080));
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.35), transparent 14%),
      linear-gradient(180deg, #ffe83b 0%, #ffd81a 28%, #f04c31 28.4%, #f04c31 55%, #0e5cff 55.5%, #0e5cff 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 30px 90px rgba(0,0,0,.45);
  }

  .layer{position:absolute; inset:0;}

  #background-video{
    position:absolute;
    left:14%;
    top:17%;
    width:72%;
    height:42%;
    object-fit:cover;
    opacity:.82;
    border:10px solid var(--black);
    border-radius:28px;
    filter:saturate(1.4) contrast(1.12) brightness(1.02);
    box-shadow:
      0 0 0 7px var(--cream),
      0 0 0 18px var(--black),
      18px 18px 0 0 rgba(10,10,13,.95);
    z-index:6;
    animation: panelPulse 20s ease-in-out infinite, panelTilt 28s ease-in-out infinite;
  }

  .burst{
    position:absolute;
    inset:-15% -10% auto -10%;
    height:58%;
    background:
      conic-gradient(from 0deg,
      rgba(255,232,59,.0) 0 4deg,
      rgba(255,232,59,.95) 4deg 8deg,
      rgba(255,232,59,.0) 8deg 12deg,
      rgba(255,232,59,.95) 12deg 16deg,
      rgba(255,232,59,.0) 16deg 20deg,
      rgba(255,232,59,.95) 20deg 24deg,
      rgba(255,232,59,.0) 24deg 28deg,
      rgba(255,232,59,.95) 28deg 32deg,
      rgba(255,232,59,.0) 32deg 36deg,
      rgba(255,232,59,.95) 36deg 40deg,
      rgba(255,232,59,.0) 40deg 44deg,
      rgba(255,232,59,.95) 44deg 48deg,
      rgba(255,232,59,.0) 48deg 52deg,
      rgba(255,232,59,.95) 52deg 56deg,
      rgba(255,232,59,.0) 56deg 60deg,
      rgba(255,232,59,.95) 60deg 64deg,
      rgba(255,232,59,.0) 64deg 68deg,
      rgba(255,232,59,.95) 68deg 72deg,
      rgba(255,232,59,.0) 72deg 76deg,
      rgba(255,232,59,.95) 76deg 80deg,
      rgba(255,232,59,.0) 80deg 84deg,
      rgba(255,232,59,.95) 84deg 88deg,
      rgba(255,232,59,.0) 88deg 92deg,
      rgba(255,232,59,.95) 92deg 96deg,
      rgba(255,232,59,.0) 96deg 100deg,
      rgba(255,232,59,.95) 100deg 104deg,
      rgba(255,232,59,.0) 104deg 108deg,
      rgba(255,232,59,.95) 108deg 112deg,
      rgba(255,232,59,.0) 112deg 116deg,
      rgba(255,232,59,.95) 116deg 120deg,
      rgba(255,232,59,.0) 120deg 124deg,
      rgba(255,232,59,.95) 124deg 128deg,
      rgba(255,232,59,.0) 128deg 132deg,
      rgba(255,232,59,.95) 132deg 136deg,
      rgba(255,232,59,.0) 136deg 140deg,
      rgba(255,232,59,.95) 140deg 144deg,
      rgba(255,232,59,.0) 144deg 148deg,
      rgba(255,232,59,.95) 148deg 152deg,
      rgba(255,232,59,.0) 152deg 156deg,
      rgba(255,232,59,.95) 156deg 160deg,
      rgba(255,232,59,.0) 160deg 164deg,
      rgba(255,232,59,.95) 164deg 168deg,
      rgba(255,232,59,.0) 168deg 172deg,
      rgba(255,232,59,.95) 172deg 176deg,
      rgba(255,232,59,.0) 176deg 180deg,
      rgba(255,232,59,.95) 180deg 184deg,
      rgba(255,232,59,.0) 184deg 188deg,
      rgba(255,232,59,.95) 188deg 192deg,
      rgba(255,232,59,.0) 192deg 196deg,
      rgba(255,232,59,.95) 196deg 200deg,
      rgba(255,232,59,.0) 200deg 204deg,
      rgba(255,232,59,.95) 204deg 208deg,
      rgba(255,232,59,.0) 208deg 212deg,
      rgba(255,232,59,.95) 212deg 216deg,
      rgba(255,232,59,.0) 216deg 220deg,
      rgba(255,232,59,.95) 220deg 224deg,
      rgba(255,232,59,.0) 224deg 228deg,
      rgba(255,232,59,.95) 228deg 232deg,
      rgba(255,232,59,.0) 232deg 236deg,
      rgba(255,232,59,.95) 236deg 240deg,
      rgba(255,232,59,.0) 240deg 244deg,
      rgba(255,232,59,.95) 244deg 248deg,
      rgba(255,232,59,.0) 248deg 252deg,
      rgba(255,232,59,.95) 252deg 256deg,
      rgba(255,232,59,.0) 256deg 260deg,
      rgba(255,232,59,.95) 260deg 264deg,
      rgba(255,232,59,.0) 264deg 268deg,
      rgba(255,232,59,.95) 268deg 272deg,
      rgba(255,232,59,.0) 272deg 276deg,
      rgba(255,232,59,.95) 276deg 280deg,
      rgba(255,232,59,.0) 280deg 284deg,
      rgba(255,232,59,.95) 284deg 288deg,
      rgba(255,232,59,.0) 288deg 292deg,
      rgba(255,232,59,.95) 292deg 296deg,
      rgba(255,232,59,.0) 296deg 300deg,
      rgba(255,232,59,.95) 300deg 304deg,
      rgba(255,232,59,.0) 304deg 308deg,
      rgba(255,232,59,.95) 308deg 312deg,
      rgba(255,232,59,.0) 312deg 316deg,
      rgba(255,232,59,.95) 316deg 320deg,
      rgba(255,232,59,.0) 320deg 324deg,
      rgba(255,232,59,.95) 324deg 328deg,
      rgba(255,232,59,.0) 328deg 332deg,
      rgba(255,232,59,.95) 332deg 336deg,
      rgba(255,232,59,.0) 336deg 340deg,
      rgba(255,232,59,.95) 340deg 344deg,
      rgba(255,232,59,.0) 344deg 348deg,
      rgba(255,232,59,.95) 348deg 352deg,
      rgba(255,232,59,.0) 352deg 356deg,
      rgba(255,232,59,.95) 356deg 360deg);
    transform-origin:50% 55%;
    animation: slowSpin 42s linear infinite;
    opacity:.95;
    z-index:1;
  }

  .bubble{
    position:absolute;
    border:10px solid var(--black);
    background:var(--cream);
    border-radius:50px;
    box-shadow:14px 14px 0 rgba(10,10,13,.95);
    z-index:8;
  }
  .bubble::before{
    content:"";
    position:absolute;
    width:44px;height:44px;
    background:var(--cream);
    border-left:10px solid var(--black);
    border-bottom:10px solid var(--black);
    bottom:-22px;
    left:18%;
    transform:skewX(-24deg) rotate(14deg);
  }
  .bubble.top{
    left:7%;
    top:6%;
    width:42%;
    height:11%;
    animation: bubbleBob 18s ease-in-out infinite;
  }
  .bubble.bottom{
    right:8%;
    bottom:15%;
    width:48%;
    height:12%;
    border-radius:46px;
    animation: bubbleBob2 22s ease-in-out infinite;
  }
  .bubble.bottom::before{
    left:auto;
    right:16%;
    bottom:-19px;
    transform:skewX(20deg) rotate(70deg);
  }

  .caption-bar{
    position:absolute;
    left:8%;
    right:8%;
    top:63%;
    height:8%;
    background:var(--cream);
    border:10px solid var(--black);
    box-shadow:16px 16px 0 rgba(10,10,13,.98);
    z-index:7;
    overflow:hidden;
  }
  .caption-bar::before,
  .caption-bar::after{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(90deg,
        transparent 0 28px,
        rgba(10,10,13,.12) 28px 32px,
        transparent 32px 60px);
    opacity:.6;
    transform:translateX(0);
    animation: stripeShift 16s linear infinite;
  }
  .caption-bar::after{
    background:
      linear-gradient(90deg, rgba(255,93,177,.12), transparent 30%, transparent 70%, rgba(33,212,255,.12));
    animation:none;
  }

  .shape{
    position:absolute;
    border:10px solid var(--black);
    z-index:5;
  }
  .shape.red{
    width:25%;
    height:14%;
    right:-3%;
    top:47%;
    background:var(--red);
    border-radius:58% 42% 44% 56% / 53% 45% 55% 47%;
    transform:rotate(-12deg);
    animation: blob1 19s ease-in-out infinite;
  }
  .shape.blue{
    width:22%;
    height:12%;
    left:-4%;
    bottom:26%;
    background:var(--cyan);
    border-radius:55% 45% 58% 42% / 41% 59% 43% 57%;
    transform:rotate(10deg);
    animation: blob2 17s ease-in-out infinite;
  }
  .shape.dot{
    width:13%;
    height:7%;
    left:12%;
    top:52%;
    background:var(--pink);
    border-radius:999px;
    animation: dotPulse 12s ease-in-out infinite;
  }

  .diagonal{
    position:absolute;
    left:-10%;
    top:71%;
    width:130%;
    height:8%;
    background:
      repeating-linear-gradient(-12deg,
        var(--cream) 0 18px,
        var(--black) 18px 31px);
    border-top:10px solid var(--black);
    border-bottom:10px solid var(--black);
    transform:rotate(-5deg);
    z-index:4;
    animation: bandShift 20s ease-in-out infinite;
  }

  .cutout{
    position:absolute;
    inset:0;
    z-index:9;
    pointer-events:none;
    background:
      radial-gradient(circle at 82% 21%, rgba(255,255,255,.22) 0 2%, transparent 2.2% 100%),
      radial-gradient(circle at 82% 21%, rgba(255,255,255,.22) 0 6%, transparent 6.3% 100%),
      radial-gradient(circle at 82% 21%, rgba(255,255,255,.18) 0 10%, transparent 10.3% 100%);
    mix-blend-mode:screen;
    opacity:.7;
    animation: shine 14s ease-in-out infinite;
  }

  #dotsCanvas{
    position:absolute;
    inset:0;
    z-index:3;
    opacity:.72;
  }

  #inkCanvas{
    position:absolute;
    inset:0;
    z-index:10;
    opacity:.9;
    mix-blend-mode:multiply;
  }

  .print{
    position:absolute;
    inset:0;
    z-index:11;
    pointer-events:none;
    background:
      linear-gradient(transparent 0%, rgba(255,255,255,.03) 50%, transparent 100%),
      repeating-linear-gradient(0deg, rgba(10,10,13,.04) 0 2px, transparent 2px 5px);
    opacity:.55;
  }

  .frame-strokes{
    position:absolute;
    inset:14px;
    border:4px solid rgba(10,10,13,.2);
    z-index:12;
    pointer-events:none;
  }

  #date{
    position:absolute;
    right:20px;
    bottom:16px;
    color:rgba(255,255,255,.58);
    font-size:17px;
    letter-spacing:.08em;
    z-index:20;
    text-shadow:0 1px 0 rgba(0,0,0,.25);
  }

  #guinea-pig{
    position:absolute;
    width:17px;
    height:auto;
    right:10px;
    top:1026px;
    opacity:.56;
    z-index:13;
    filter:brightness(.7) saturate(.95);
    transform:rotate(-5deg);
  }

  @keyframes slowSpin{
    from{transform:rotate(0deg) scale(1.02)}
    50%{transform:rotate(3deg) scale(1)}
    to{transform:rotate(0deg) scale(1.02)}
  }
  @keyframes panelPulse{
    0%,100%{transform:scale(1) translateY(0)}
    50%{transform:scale(1.018) translateY(-8px)}
  }
  @keyframes panelTilt{
    0%,100%{border-radius:28px}
    50%{border-radius:36px 24px 32px 26px}
  }
  @keyframes bubbleBob{
    0%,100%{transform:translateY(0) rotate(-2deg)}
    50%{transform:translateY(8px) rotate(1deg)}
  }
  @keyframes bubbleBob2{
    0%,100%{transform:translateY(0) rotate(1deg)}
    50%{transform:translateY(-8px) rotate(-1deg)}
  }
  @keyframes blob1{
    0%,100%{transform:rotate(-12deg) scale(1)}
    50%{transform:rotate(-5deg) scale(1.08)}
  }
  @keyframes blob2{
    0%,100%{transform:rotate(10deg) scale(1)}
    50%{transform:rotate(2deg) scale(.92)}
  }
  @keyframes dotPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.16)}
  }
  @keyframes stripeShift{
    from{transform:translateX(0)}
    to{transform:translateX(60px)}
  }
  @keyframes bandShift{
    0%,100%{transform:rotate(-5deg) translateY(0)}
    50%{transform:rotate(-3deg) translateY(-6px)}
  }
  @keyframes shine{
    0%,100%{opacity:.58; transform:translateX(0)}
    50%{opacity:.82; transform:translateX(8px)}
  }
</style>
</head>
<body>
  <div id="frame">
    <div class="burst layer"></div>
    <canvas id="dotsCanvas" width="1080" height="1920" aria-hidden="true"></canvas>

    <div class="bubble top"></div>

    <video id="background-video" src="background.mp4" autoplay loop muted playsinline></video>

    <div class="shape red"></div>
    <div class="shape blue"></div>
    <div class="shape dot"></div>

    <div class="caption-bar"></div>
    <div class="diagonal"></div>
    <div class="bubble bottom"></div>

    <div class="cutout"></div>
    <canvas id="inkCanvas" width="1080" height="1920" aria-hidden="true"></canvas>
    <div class="print"></div>
    <div class="frame-strokes"></div>

    <img id="guinea-pig" src="guineapig.png" alt="" />

    <div id="date">2026-03-26</div>
  </div>

<script>
(() => {
  const seedString = "2026-03-26";
  let seed = 0;
  for (let i = 0; i < seedString.length; i++) seed = (seed * 131 + seedString.charCodeAt(i)) >>> 0;
  function rand() {
    seed = (1664525 * seed + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  const dotsCanvas = document.getElementById('dotsCanvas');
  const dctx = dotsCanvas.getContext('2d');
  const inkCanvas = document.getElementById('inkCanvas');
  const ictx = inkCanvas.getContext('2d');

  const palette = ["#f23b2f", "#1060ff", "#21d4ff", "#ff5db1", "#fff6da", "#f6e61b"];
  const black = "#0a0a0d";

  const dotBands = [];
  const bandCount = 7;
  for (let i = 0; i < bandCount; i++) {
    dotBands.push({
      y: 120 + i * 250 + rand() * 40,
      h: 160 + rand() * 90,
      angle: (rand() - 0.5) * 0.25,
      color: palette[Math.floor(rand() * 4)],
      density: 16 + Math.floor(rand() * 10),
      scale: 0.7 + rand() * 1.3,
      phase: rand() * Math.PI * 2
    });
  }

  const stickers = [];
  for (let i = 0; i < 14; i++) {
    stickers.push({
      x: 80 + rand() * 920,
      y: 120 + rand() * 1600,
      w: 40 + rand() * 160,
      h: 22 + rand() * 80,
      r: rand() * Math.PI,
      color: palette[Math.floor(rand() * 5)],
      type: rand() > 0.5 ? "oval" : "burst",
      phase: rand() * Math.PI * 2
    });
  }

  function drawHalftoneBand(b, t) {
    const spacing = b.density;
    dctx.save();
    dctx.translate(540, b.y + Math.sin(t * 0.00035 + b.phase) * 20);
    dctx.rotate(b.angle + Math.sin(t * 0.0002 + b.phase) * 0.03);
    dctx.translate(-540, -b.y);

    const y0 = b.y - b.h / 2;
    const y1 = b.y + b.h / 2;
    for (let y = y0; y < y1; y += spacing) {
      for (let x = -40; x < 1120; x += spacing) {
        const dx = x - 540;
        const dy = y - b.y;
        const falloff = Math.max(0, 1 - Math.abs(dy) / (b.h * 0.55));
        const radius = (spacing * 0.13 + spacing * 0.38 * falloff * b.scale) * (0.82 + 0.18*Math.sin((x+y)*0.02 + t*0.001 + b.phase));
        if (radius < 0.8) continue;
        dctx.beginPath();
        dctx.fillStyle = b.color;
        dctx.arc(x + ((Math.floor(y/spacing)%2)*spacing*0.25), y, radius, 0, Math.PI * 2);
        dctx.fill();
      }
    }
    dctx.restore();
  }

  function drawSticker(s, t) {
    const drift = Math.sin(t * 0.0004 + s.phase) * 5;
    dctx.save();
    dctx.translate(s.x, s.y + drift);
    dctx.rotate(s.r + Math.sin(t*0.00025+s.phase)*0.05);
    dctx.fillStyle = s.color;
    dctx.strokeStyle = black;
    dctx.lineWidth = 8;

    if (s.type === "oval") {
      dctx.beginPath();
      dctx.ellipse(0, 0, s.w/2, s.h/2, 0, 0, Math.PI * 2);
      dctx.fill();
      dctx.stroke();
    } else {
      const spikes = 14;
      dctx.beginPath();
      for (let i = 0; i < spikes * 2; i++) {
        const a = (i / (spikes * 2)) * Math.PI * 2;
        const rr = i % 2 === 0 ? s.w * 0.28 : s.w * 0.5;
        const xx = Math.cos(a) * rr;
        const yy = Math.sin(a) * rr * (s.h / s.w) * 1.3;
        if (i === 0) dctx.moveTo(xx, yy);
        else dctx.lineTo(xx, yy);
      }
      dctx.closePath();
      dctx.fill();
      dctx.stroke();
    }
    dctx.restore();
  }

  function drawInk(t) {
    ictx.clearRect(0,0,1080,1920);

    ictx.lineCap = "round";
    ictx.lineJoin = "round";

    for (let i = 0; i < 6; i++) {
      const baseY = 250 + i * 290;
      const amp = 18 + i * 3;
      ictx.strokeStyle = "rgba(10,10,13,0.22)";
      ictx.lineWidth = 5 + (i % 3);
      ictx.beginPath();
      for (let x = -20; x <= 1100; x += 20) {
        const y = baseY + Math.sin(x * 0.015 + i + t * 0.00045) * amp + Math.cos(x * 0.006 + i * 3) * 12;
        if (x === -20) ictx.moveTo(x, y);
        else ictx.lineTo(x, y);
      }
      ictx.stroke();
    }

    for (let i = 0; i < 12; i++) {
      const x = 70 + i * 85 + Math.sin(t * 0.0002 + i) * 10;
      const y = 1040 + Math.cos(i*0.7 + t*0.00035) * 16;
      ictx.strokeStyle = "rgba(10,10,13,0.18)";
      ictx.lineWidth = 7;
      ictx.beginPath();
      ictx.moveTo(x, y);
      ictx.quadraticCurveTo(x + 10, y + 30, x - 12, y + 66);
      ictx.stroke();
    }

    ictx.fillStyle = "rgba(255,255,255,0.08)";
    ictx.beginPath();
    ictx.arc(877, 402, 120 + Math.sin(t*0.0005)*8, 0, Math.PI*2);
    ictx.fill();
  }

  function frame(t) {
    dctx.clearRect(0,0,1080,1920);
    for (const b of dotBands) drawHalftoneBand(b, t);
    for (const s of stickers) drawSticker(s, t);
    drawInk(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const video = document.getElementById('background-video');
  video.play().catch(()=>{});
})();
</script>
</body>
