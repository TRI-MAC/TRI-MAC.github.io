<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400; url=../">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>2026-06-05</title>
<style>
  :root{
    --bg:#f3eee3;
    --ink:#111111;
    --red:#d72c1f;
    --blue:#1847d6;
    --yellow:#f2c318;
    --off:#e6dfd0;
    --shadow:#221c18;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#0d0d0d;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7777778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:var(--bg);
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 30px 80px rgba(0,0,0,.45);
  }

  .layer{
    position:absolute; inset:0;
    pointer-events:none;
  }

  #bg{
    background:
      radial-gradient(120% 80% at 50% 10%, rgba(255,255,255,.45), transparent 60%),
      linear-gradient(180deg, #f6f1e7 0%, #efe7d7 46%, #eadfcb 70%, #e3d8c3 100%);
  }

  #terrainCanvas, #grainCanvas{
    width:100%; height:100%; display:block;
  }

  #art-image{
    position:absolute;
    left:10%;
    top:21%;
    width:80%;
    height:28%;
    object-fit:cover;
    opacity:.96;
    filter:saturate(0.72) contrast(1.18) brightness(1.02) sepia(.08) hue-rotate(-8deg);
    transform-origin:center center;
    animation:imageDrift 28s ease-in-out infinite;
    box-shadow:
      0 18px 40px rgba(0,0,0,.16),
      0 0 0 2px rgba(17,17,17,.06);
    z-index:3;
  }

  #image-haze{
    position:absolute;
    left:4%;
    top:16%;
    width:92%;
    height:40%;
    z-index:2;
    background:
      radial-gradient(80% 55% at 48% 45%, rgba(255,255,255,.26), rgba(255,255,255,0) 72%),
      linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0));
    filter:blur(12px);
    opacity:.65;
  }

  #supra-svg{
    z-index:4;
  }

  #foreground{
    z-index:5;
  }

  #maskFadeTop, #maskFadeBottom{
    position:absolute; left:0; width:100%; pointer-events:none; z-index:8;
  }
  #maskFadeTop{
    top:0; height:18%;
    background:linear-gradient(180deg, rgba(243,238,227,.95), rgba(243,238,227,0));
  }
  #maskFadeBottom{
    bottom:0; height:18%;
    background:linear-gradient(0deg, rgba(227,216,195,.98), rgba(227,216,195,0));
  }

  #date{
    position:absolute;
    right:18px;
    bottom:16px;
    z-index:20;
    font-size:14px;
    letter-spacing:.08em;
    color:rgba(17,17,17,.45);
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    width:16px;
    height:auto;
    left:84%;
    bottom:14.2%;
    opacity:.62;
    filter:saturate(.55) contrast(.9) brightness(.78);
    z-index:7;
  }

  .floatA{ animation:floatA 22s ease-in-out infinite; transform-origin:center; }
  .floatB{ animation:floatB 31s ease-in-out infinite; transform-origin:center; }
  .spinSlow{ animation:spinSlow 42s linear infinite; transform-origin:center; }
  .scalePulse{ animation:scalePulse 18s ease-in-out infinite; transform-origin:center; }
  .terrainShift{ animation:terrainShift 26s ease-in-out infinite; transform-origin:center; }

  @keyframes imageDrift{
    0%,100%{ transform:translateY(0px) scale(1.015); }
    50%{ transform:translateY(-10px) scale(1.03); }
  }
  @keyframes floatA{
    0%,100%{ transform:translate(0px,0px) rotate(0deg); }
    50%{ transform:translate(0px,-18px) rotate(2deg); }
  }
  @keyframes floatB{
    0%,100%{ transform:translate(0px,0px) rotate(0deg); }
    50%{ transform:translate(0px,14px) rotate(-3deg); }
  }
  @keyframes spinSlow{
    0%{ transform:rotate(0deg); }
    100%{ transform:rotate(360deg); }
  }
  @keyframes scalePulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.06); }
  }
  @keyframes terrainShift{
    0%,100%{ transform:translateY(0px) scaleY(1); }
    50%{ transform:translateY(-10px) scaleY(1.02); }
  }
</style>
</head>
<body>
  <div id="frame">
    <div id="bg" class="layer"></div>
    <canvas id="terrainCanvas" class="layer"></canvas>
    <div id="image-haze" class="layer"></div>
    <img id="art-image" src="art.png" alt="" />

    <svg id="supra-svg" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="blackFade" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#121212" stop-opacity="1"/>
          <stop offset="100%" stop-color="#26201a" stop-opacity=".92"/>
        </linearGradient>
        <linearGradient id="redPlane" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e23924"/>
          <stop offset="100%" stop-color="#b91910"/>
        </linearGradient>
        <linearGradient id="bluePlane" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2f63ff"/>
          <stop offset="100%" stop-color="#1437aa"/>
        </linearGradient>
        <radialGradient id="sunDisc" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff4bf" stop-opacity=".95"/>
          <stop offset="58%" stop-color="#f2c318" stop-opacity=".92"/>
          <stop offset="100%" stop-color="#f2c318" stop-opacity="0"/>
        </radialGradient>
        <filter id="softBlur">
          <feGaussianBlur stdDeviation="12"/>
        </filter>
        <filter id="grainy">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer>
            <feFuncA type="table" tableValues="0 0 .02 .05"/>
          </feComponentTransfer>
        </filter>
      </defs>

      <g opacity=".9">
        <circle cx="780" cy="315" r="155" fill="url(#sunDisc)" class="scalePulse"/>
        <circle cx="780" cy="315" r="84" fill="#f2c318" opacity=".85"/>
      </g>

      <g class="floatA" opacity=".98">
        <polygon points="775,132 935,450 615,450" fill="url(#redPlane)"/>
      </g>

      <g class="floatB" opacity=".95">
        <rect x="146" y="462" width="290" height="78" fill="#111111" transform="rotate(-16 291 501)"/>
      </g>

      <g class="floatA" opacity=".88">
        <rect x="778" y="590" width="204" height="204" fill="url(#bluePlane)" transform="rotate(22 880 692)"/>
      </g>

      <g class="spinSlow" opacity=".88">
        <rect x="232" y="262" width="150" height="150" fill="#f2c318" transform="rotate(45 307 337)"/>
      </g>

      <g opacity=".25" filter="url(#softBlur)">
        <polygon points="80,1160 580,980 970,1250 120,1350" fill="#ffffff"/>
      </g>

      <g opacity=".35">
        <rect x="-40" y="800" width="1160" height="8" fill="#111111"/>
      </g>

      <g opacity=".14" filter="url(#grainy)">
        <rect x="0" y="0" width="1080" height="1920" fill="#000"/>
      </g>
    </svg>

    <svg id="foreground" class="layer" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="fgBlack" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#171717"/>
          <stop offset="100%" stop-color="#090909"/>
        </linearGradient>
        <linearGradient id="fgRed" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#aa1d18"/>
          <stop offset="100%" stop-color="#e23924"/>
        </linearGradient>
      </defs>

      <g class="terrainShift">
        <polygon points="0,1420 152,1368 278,1408 430,1328 598,1396 732,1310 902,1376 1080,1302 1080,1920 0,1920" fill="url(#fgBlack)"/>
        <polygon points="0,1534 138,1496 248,1538 420,1460 600,1520 748,1464 886,1518 1080,1474 1080,1920 0,1920" fill="#d9d0be" opacity=".09"/>
      </g>

      <g class="floatB">
        <polygon points="120,1500 210,1390 290,1500" fill="#f2c318" opacity=".95"/>
        <polygon points="272,1500 362,1378 442,1500" fill="#d72c1f" opacity=".98"/>
        <polygon points="452,1500 560,1356 650,1500" fill="#111111" opacity=".98"/>
      </g>

      <g class="floatA">
        <rect x="708" y="1470" width="242" height="76" fill="#111111" transform="rotate(-11 829 1508)"/>
        <rect x="744" y="1548" width="174" height="54" fill="#1847d6" transform="rotate(-11 831 1575)"/>
      </g>

      <g opacity=".22">
        <polygon points="0,1288 1080,1148 1080,1208 0,1342" fill="#ffffff"/>
      </g>
    </svg>

    <canvas id="grainCanvas" class="layer"></canvas>

    <img id="guinea-pig" src="guineapig.png" alt="" />

    <div id="maskFadeTop"></div>
    <div id="maskFadeBottom"></div>
    <div id="date">2026-06-05</div>
  </div>

<script>
(() => {
  const seedStr = "2026-06-05";
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = (seed * 131 + seedStr.charCodeAt(i)) >>> 0;
  function rand() {
    seed = (1664525 * seed + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  const frame = document.getElementById('frame');
  const terrainCanvas = document.getElementById('terrainCanvas');
  const grainCanvas = document.getElementById('grainCanvas');
  const tctx = terrainCanvas.getContext('2d');
  const gctx = grainCanvas.getContext('2d');

  function resize() {
    const r = frame.getBoundingClientRect();
    terrainCanvas.width = 1080;
    terrainCanvas.height = 1920;
    grainCanvas.width = 1080;
    grainCanvas.height = 1920;
    drawStaticGrain();
  }

  function fade(t){ return t*t*t*(t*(t*6-15)+10); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  const p = new Uint8Array(512);
  const perm = new Uint8Array(256);
  for(let i=0;i<256;i++) perm[i]=i;
  for(let i=255;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    const tmp = perm[i]; perm[i]=perm[j]; perm[j]=tmp;
  }
  for(let i=0;i<512;i++) p[i]=perm[i&255];

  function grad(hash,x,y){
    switch(hash & 7){
      case 0:return x+y;
      case 1:return -x+y;
      case 2:return x-y;
      case 3:return -x-y;
      case 4:return x;
      case 5:return -x;
      case 6:return y;
      default:return -y;
    }
  }
  function noise2(x,y){
    const X = Math.floor(x) & 255;
    const Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = fade(x), v = fade(y);
    const aa = p[p[X]+Y], ab = p[p[X]+Y+1], ba = p[p[X+1]+Y], bb = p[p[X+1]+Y+1];
    return lerp(
      lerp(grad(aa,x,y), grad(ba,x-1,y), u),
      lerp(grad(ab,x,y-1), grad(bb,x-1,y-1), u),
      v
    );
  }
  function fbm(x,y,oct=5){
    let v=0, a=.5, f=1;
    for(let i=0;i<oct;i++){
      v += a*noise2(x*f,y*f);
      f *= 2;
      a *= .5;
    }
    return v;
  }

  function drawStaticGrain(){
    gctx.clearRect(0,0,1080,1920);
    const img = gctx.createImageData(1080,1920);
    for(let i=0;i<img.data.length;i+=4){
      const n = 220 + Math.floor(rand()*35);
      img.data[i]=n; img.data[i+1]=n-2; img.data[i+2]=n-6; img.data[i+3]=18;
    }
    gctx.putImageData(img,0,0);
  }

  function draw(t){
    tctx.clearRect(0,0,1080,1920);

    const time = t * 0.00008;
    const horizonY = 1120;

    const skyGrad = tctx.createLinearGradient(0,0,0,1920);
    skyGrad.addColorStop(0,'rgba(246,241,231,0)');
    skyGrad.addColorStop(.52,'rgba(255,255,255,.04)');
    skyGrad.addColorStop(1,'rgba(0,0,0,0)');
    tctx.fillStyle = skyGrad;
    tctx.fillRect(0,0,1080,1920);

    // Upper noise landscape bands integrated with horizon image region
    for(let band=0; band<5; band++){
      const yBase = 760 + band*75;
      tctx.beginPath();
      tctx.moveTo(0, yBase);
      for(let x=0; x<=1080; x+=8){
        const n = fbm(x*0.003 + band*11.7, time + band*0.27, 5);
        const y = yBase + n*90 - band*10;
        tctx.lineTo(x,y);
      }
      tctx.lineTo(1080, yBase+220);
      tctx.lineTo(0, yBase+220);
      tctx.closePath();
      const colors = [
        'rgba(17,17,17,0.12)',
        'rgba(24,71,214,0.14)',
        'rgba(215,44,31,0.11)',
        'rgba(17,17,17,0.10)',
        'rgba(242,195,24,0.08)'
      ];
      tctx.fillStyle = colors[band];
      tctx.fill();
    }

    // Suprematist terrain planes using noise as sculptor
    const palettes = ['#111111','#d72c1f','#1847d6','#f2c318'];
    for(let layer=0; layer<4; layer++){
      const y0 = horizonY + 120 + layer*115;
      tctx.beginPath();
      tctx.moveTo(0,1920);
      for(let x=0; x<=1080; x+=10){
        const n = fbm(x*0.0024 + layer*15.1, time*0.8 + 20 + layer*0.4, 6);
        const terrace = Math.round((n*0.5 + 0.5)*5)/5;
        const y = y0 + terrace*150 + Math.sin(x*0.01 + layer)*18;
        tctx.lineTo(x,y);
      }
      tctx.lineTo(1080,1920);
      tctx.closePath();
      tctx.fillStyle = palettes[layer];
      tctx.globalAlpha = layer===3 ? .92 : .88;
      tctx.fill();
    }
    tctx.globalAlpha = 1;

    // Hard-edged foreground accents anchored to terrain
    for(let i=0;i<9;i++){
      const x = 70 + i*110 + Math.sin(time*5+i)*14;
      const y = 1320 + (i%3)*42 + Math.cos(time*4+i)*10;
      const h = 80 + (i%4)*38;
      const w = 40 + (i%3)*18;
      tctx.fillStyle = i%4===0 ? '#111111' : (i%4===1 ? '#d72c1f' : (i%4===2 ? '#1847d6' : '#f2c318'));
      tctx.beginPath();
      tctx.moveTo(x, y+h);
      tctx.lineTo(x+w*0.5, y);
      tctx.lineTo(x+w, y+h);
      tctx.closePath();
      tctx.fill();
    }

    // Black structural bar crossing image edge to break rectangle
    tctx.save();
    tctx.translate(540, 980 + Math.sin(time*8)*8);
    tctx.rotate(-0.08);
    tctx.fillStyle = 'rgba(17,17,17,.82)';
    tctx.fillRect(-380,-20,760,40);
    tctx.restore();

    requestAnimationFrame(draw);
  }

  resize();
  requestAnimationFrame(draw);
  window.addEventListener('resize', resize);

  if (window.self === window.top) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      const ctx = new AudioCtx();
      const master = ctx.createGain();
      master.gain.value = 0.022;
      master.connect(ctx.destination);

      const now = ctx.currentTime;

      function makeDrone(freq, type, gainVal, panVal){
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;

        osc.type = type;
        osc.frequency.value = freq;

        filter.type = 'lowpass';
        filter.frequency.value = 680;
        filter.Q.value = 0.6;

        gain.gain.value = gainVal;

        osc.connect(filter);
        filter.connect(gain);
        if(pan){
          gain.connect(pan);
          pan.pan.value = panVal;
          pan.connect(master);
        }else{
          gain.connect(master);
        }

        osc.start();

        return {osc,gain,filter,pan};
      }

      const a = makeDrone(82.41, 'sine', 0.26, -0.25);
      const b = makeDrone(123.47, 'triangle', 0.12, 0.18);
      const c = makeDrone(164.81, 'sine', 0.08, 0.05);

      function modulate(){
        const t = ctx.currentTime;
        [a,b,c].forEach((d, i) => {
          const g = 0.05 + (i===0?0.03:0.02) * (0.5 + 0.5*Math.sin(t*(0.11+i*0.03) + i));
          d.gain.gain.cancelScheduledValues(t);
          d.gain.gain.linearRampToValueAtTime(g, t + 4.5);
          d.filter.frequency.cancelScheduledValues(t);
          d.filter.frequency.linearRampToValueAtTime(420 + 260*(0.5+0.5*Math.sin(t*0.07+i*1.2)), t + 4.5);
        });
        setTimeout(modulate, 3800);
      }

      const buffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i] = (rand()*2-1)*0.22;
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;

      const nFilter = ctx.createBiquadFilter();
      nFilter.type = 'bandpass';
      nFilter.frequency.value = 420;
      nFilter.Q.value = 0.7;

      const nGain = ctx.createGain();
      nGain.gain.value = 0.0065;

      noise.connect(nFilter);
      nFilter.connect(nGain);
      nGain.connect(master);
      noise.start(now);

      if (ctx.state === 'suspended') {
        const resume = () => ctx.resume().catch(()=>{});
        document.addEventListener('visibilitychange', resume, {once:true});
        setTimeout(resume, 400);
      }
      modulate();
    }
  }
})();
</script>
</body>
</html>
