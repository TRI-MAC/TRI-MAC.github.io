<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026-04-14</title>
<style>
  :root{
    --bg1:#120d08;
    --bg2:#2a1b10;
    --stone:#6b5440;
    --ochre:#b8742a;
    --ochre2:#d79a41;
    --ember:#f0c56a;
    --char:#17110d;
    --chalk:#d9c7a4;
    --blood:#7c3422;
    --dust:#9d7852;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#050403;
    overflow:hidden;
    font-family: Georgia, serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #viewport{
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    aspect-ratio:9/16;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 18%, rgba(241,188,101,.18), transparent 30%),
      radial-gradient(circle at 50% 42%, rgba(128,72,27,.14), transparent 45%),
      linear-gradient(180deg, #2f2318 0%, #1c140f 45%, #120d09 100%);
    box-shadow:0 0 0 1px rgba(255,230,180,.05), 0 30px 80px rgba(0,0,0,.65);
  }

  #stoneTexture, #lightCanvas, #windowCanvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
  }
  #lightCanvas{ mix-blend-mode:screen; opacity:.9; }
  #windowCanvas{ opacity:.97; }

  .vignette{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,.12) 70%, rgba(0,0,0,.42) 100%),
      linear-gradient(180deg, rgba(0,0,0,.06), transparent 14%, transparent 86%, rgba(0,0,0,.16));
    pointer-events:none;
  }

  .dust{
    position:absolute; inset:-10%;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,230,170,.045) 0 2px, transparent 3px),
      radial-gradient(circle at 70% 55%, rgba(255,220,150,.03) 0 1.6px, transparent 2.8px),
      radial-gradient(circle at 40% 80%, rgba(255,220,150,.035) 0 1.8px, transparent 3px),
      radial-gradient(circle at 80% 20%, rgba(255,240,180,.03) 0 1.4px, transparent 2.4px);
    background-size: 290px 290px, 360px 360px, 420px 420px, 310px 310px;
    opacity:.45;
    animation:dustShift 38s ease-in-out infinite alternate;
    mix-blend-mode:screen;
    pointer-events:none;
  }

  #art-image{
    position:absolute;
    width:40%;
    left:30%;
    top:58%;
    transform:translateY(-50%) scale(1.02) rotate(-2deg);
    opacity:.96;
    filter:sepia(.82) saturate(.9) contrast(1.12) brightness(.86) drop-shadow(0 10px 20px rgba(0,0,0,.35));
    clip-path:ellipse(44% 37% at 50% 50%);
    mix-blend-mode:normal;
    animation:artifactBreath 24s ease-in-out infinite;
  }

  .artifactHalo{
    position:absolute;
    left:22%;
    top:45%;
    width:56%;
    height:34%;
    border-radius:50%;
    background:
      radial-gradient(ellipse at center, rgba(236,184,95,.18) 0%, rgba(180,113,39,.12) 34%, rgba(75,38,15,.05) 52%, transparent 74%);
    filter:blur(14px);
    opacity:.85;
    animation:haloShift 18s ease-in-out infinite alternate;
    pointer-events:none;
  }

  .groundShadow{
    position:absolute;
    left:12%;
    right:12%;
    bottom:18%;
    height:15%;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.48), rgba(0,0,0,.18) 45%, transparent 72%);
    filter:blur(12px);
    opacity:.75;
    pointer-events:none;
  }

  svg#overlays{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
  }

  .breathSlow{ animation:breathSlow 19s ease-in-out infinite; transform-origin:center; }
  .breathSlow2{ animation:breathSlow2 27s ease-in-out infinite; transform-origin:center; }
  .flickerSoft{ animation:flickerSoft 11s ease-in-out infinite; }

  .date{
    position:absolute;
    right:18px;
    bottom:14px;
    font-size:14px;
    color:rgba(230,205,160,.5);
    letter-spacing:.08em;
    user-select:none;
    pointer-events:none;
    text-shadow:0 1px 0 rgba(0,0,0,.35);
  }

  #guinea-pig{
    position:absolute;
    width:17px;
    height:auto;
    left:105px;
    bottom:222px;
    opacity:.58;
    filter:sepia(.8) saturate(.75) brightness(.82) contrast(1.02);
    transform:rotate(-8deg);
    z-index:8;
  }

  @keyframes artifactBreath{
    0%,100%{ transform:translateY(-50%) scale(1.02) rotate(-2deg); }
    50%{ transform:translateY(-49%) scale(1.055) rotate(-1deg); }
  }
  @keyframes haloShift{
    0%,100%{ transform:scale(1) translateY(0); opacity:.72; }
    50%{ transform:scale(1.06) translateY(-1.2%); opacity:.92; }
  }
  @keyframes breathSlow{
    0%,100%{ transform:scale(1) rotate(0deg); opacity:.85; }
    50%{ transform:scale(1.03) rotate(.8deg); opacity:1; }
  }
  @keyframes breathSlow2{
    0%,100%{ transform:scale(1) rotate(0deg); opacity:.75; }
    50%{ transform:scale(.985) rotate(-.7deg); opacity:.95; }
  }
  @keyframes flickerSoft{
    0%,100%{ opacity:.7; }
    25%{ opacity:.82; }
    50%{ opacity:.9; }
    75%{ opacity:.78; }
  }
  @keyframes dustShift{
    0%{ transform:translate3d(-1.2%, -0.6%, 0) scale(1); }
    100%{ transform:translate3d(1.4%, 1.1%, 0) scale(1.03); }
  }
</style>
</head>
<body>
  <div id="viewport">
    <canvas id="stoneTexture" width="1080" height="1920"></canvas>
    <div class="artifactHalo"></div>
    <img id="art-image" src="art.png" alt="" />
    <div class="groundShadow"></div>
    <canvas id="lightCanvas" width="1080" height="1920"></canvas>
    <canvas id="windowCanvas" width="1080" height="1920"></canvas>

    <svg id="overlays" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="softBlur"><feGaussianBlur stdDeviation="10"/></filter>
        <filter id="grainy">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="14" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0"/>
          <feComponentTransfer>
            <feFuncA type="table" tableValues="0 0 .05 .08"/>
          </feComponentTransfer>
        </filter>
        <radialGradient id="archFade" cx="50%" cy="43%" r="60%">
          <stop offset="0%" stop-color="rgba(255,220,160,0.2)"/>
          <stop offset="55%" stop-color="rgba(130,80,30,0.08)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
        </radialGradient>
        <linearGradient id="wallShade" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#3d2d20"/>
          <stop offset="30%" stop-color="#2b1f16"/>
          <stop offset="70%" stop-color="#1d1510"/>
          <stop offset="100%" stop-color="#120d09"/>
        </linearGradient>
      </defs>

      <rect x="0" y="0" width="1080" height="1920" fill="transparent"></rect>

      <path class="breathSlow2" d="M170 1750 L230 1430 L330 1200 L430 1045 L520 980 L615 1010 L705 1128 L790 1335 L860 1710"
            fill="none" stroke="#21160f" stroke-width="105" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
      <path class="breathSlow2" d="M120 1760 L190 1530 L265 1320 L305 1200 L270 1100 L185 1000 L130 920"
            fill="none" stroke="#20150f" stroke-width="82" stroke-linecap="round" stroke-linejoin="round" opacity=".52"/>
      <path class="breathSlow2" d="M960 1760 L900 1525 L835 1310 L790 1175 L815 1075 L900 1000 L960 935"
            fill="none" stroke="#20150f" stroke-width="88" stroke-linecap="round" stroke-linejoin="round" opacity=".54"/>

      <ellipse cx="540" cy="770" rx="360" ry="360" fill="url(#archFade)" filter="url(#softBlur)" opacity=".7"/>
      <path d="M180 1780 Q540 1620 900 1780 L900 1920 L180 1920 Z" fill="url(#wallShade)" opacity=".9"/>

      <g opacity=".18" filter="url(#grainy)">
        <rect x="0" y="0" width="1080" height="1920" fill="#fff"/>
      </g>

      <g class="flickerSoft" opacity=".3">
        <ellipse cx="540" cy="760" rx="300" ry="210" fill="#f1bc62" filter="url(#softBlur)"/>
      </g>

      <g class="breathSlow" opacity=".5">
        <path d="M275 1428
                 C340 1390, 405 1386, 472 1404
                 C545 1424, 618 1431, 690 1418
                 C747 1407, 799 1412, 845 1440
                 C768 1470, 671 1484, 576 1488
                 C458 1493, 349 1477, 275 1428Z"
              fill="#6a4427"/>
      </g>

      <g opacity=".22" class="breathSlow2">
        <path d="M338 1446
                 C384 1425, 433 1420, 485 1431
                 C540 1444, 598 1449, 655 1440
                 C699 1432, 742 1438, 784 1456
                 C720 1474, 637 1484, 556 1485
                 C462 1486, 385 1475, 338 1446Z"
              fill="#c18637"/>
      </g>
    </svg>

    <div class="dust"></div>
    <img id="guinea-pig" src="guineapig.png" alt="" />
    <div class="vignette"></div>
    <div class="date">2026-04-14</div>
  </div>

<script>
(() => {
  const dateSeed = "2026-04-14";
  let seed = 0;
  for (let i = 0; i < dateSeed.length; i++) seed = (seed * 131 + dateSeed.charCodeAt(i)) >>> 0;
  function rnd() {
    seed = (1664525 * seed + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  const stone = document.getElementById('stoneTexture');
  const sctx = stone.getContext('2d');
  const light = document.getElementById('lightCanvas');
  const lctx = light.getContext('2d');
  const win = document.getElementById('windowCanvas');
  const wctx = win.getContext('2d');

  const W = 1080, H = 1920;
  const CX = 540, CY = 760, R = 310;

  function drawStone() {
    sctx.clearRect(0,0,W,H);

    const bg = sctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#3a2b1e');
    bg.addColorStop(.25,'#2b2017');
    bg.addColorStop(.65,'#1b1410');
    bg.addColorStop(1,'#100c09');
    sctx.fillStyle = bg;
    sctx.fillRect(0,0,W,H);

    for(let i=0;i<1600;i++){
      const x=rnd()*W, y=rnd()*H;
      const r= rnd()*3 + .5;
      const a= rnd()*0.06;
      sctx.fillStyle = `rgba(${120+rnd()*90|0},${90+rnd()*70|0},${60+rnd()*45|0},${a})`;
      sctx.beginPath();
      sctx.arc(x,y,r,0,Math.PI*2);
      sctx.fill();
    }

    for(let i=0;i<46;i++){
      const y = i*(H/45) + (rnd()*28-14);
      const h = 20 + rnd()*50;
      const g = sctx.createLinearGradient(0,y,0,y+h);
      g.addColorStop(0,`rgba(255,220,170,${0.012+rnd()*0.01})`);
      g.addColorStop(.5,`rgba(90,60,35,${0.04+rnd()*0.03})`);
      g.addColorStop(1,`rgba(0,0,0,0)`);
      sctx.fillStyle = g;
      sctx.fillRect(0,y,W,h);
    }

    for(let i=0;i<70;i++){
      const x=rnd()*W, y=rnd()*H;
      const rw = 80+rnd()*220, rh = 20+rnd()*70;
      sctx.save();
      sctx.translate(x,y);
      sctx.rotate((rnd()-.5)*0.2);
      sctx.fillStyle = `rgba(15,10,8,${0.04+rnd()*0.04})`;
      sctx.fillRect(-rw/2,-rh/2,rw,rh);
      sctx.restore();
    }

    const mask = sctx.createRadialGradient(CX,CY,160,CX,CY,800);
    mask.addColorStop(0,'rgba(255,220,180,0.03)');
    mask.addColorStop(1,'rgba(0,0,0,0.24)');
    sctx.fillStyle = mask;
    sctx.fillRect(0,0,W,H);
  }

  const panes = [];
  function buildRoseGeometry() {
    panes.length = 0;
    const colors = ['#d28e39','#b66729','#f0c56a','#7d3424','#e0b45c','#8f5b2e','#c67d2f','#d7a04d'];

    // center core
    panes.push({
      type:'circle',
      x:CX, y:CY, r:42,
      fill:colors[2], delay:0
    });

    const ringConfig = [
      {count:8, r1:60, r2:112, delay:20},
      {count:12, r1:118, r2:186, delay:120},
      {count:16, r1:192, r2:260, delay:260},
      {count:24, r1:266, r2:308, delay:440}
    ];

    ringConfig.forEach((cfg, ri) => {
      for(let i=0;i<cfg.count;i++){
        const a0 = (Math.PI*2/cfg.count)*i - Math.PI/2;
        const a1 = (Math.PI*2/cfg.count)*(i+1) - Math.PI/2;
        const jm = (rnd()-.5)*0.03;
        const color = colors[(i+ri*2 + (rnd()*colors.length|0)) % colors.length];
        panes.push({
          type:'wedge',
          cx:CX, cy:CY,
          a0:a0+jm, a1:a1-jm,
          r0:cfg.r1, r1:cfg.r2,
          fill:color,
          delay:cfg.delay + i*8
        });
      }
    });

    // petal medallions
    for(let i=0;i<8;i++){
      const a = i*Math.PI/4 - Math.PI/2;
      const px = CX + Math.cos(a)*152;
      const py = CY + Math.sin(a)*152;
      panes.push({
        type:'petal',
        x:px, y:py, a, rx:36, ry:66,
        fill: colors[(i+3)%colors.length],
        delay: 160 + i*10
      });
    }

    // outer crown triangles
    for(let i=0;i<12;i++){
      const a = i*(Math.PI*2/12)-Math.PI/2;
      const mid = a + Math.PI/12;
      const p1 = polar(CX,CY,310,a);
      const p2 = polar(CX,CY,310,a+Math.PI/6);
      const p3 = polar(CX,CY,360,mid);
      panes.push({
        type:'poly',
        pts:[p1,p2,p3],
        fill: colors[(i+5)%colors.length],
        delay: 520 + i*10
      });
    }

    // hand stencils around lower region
    for(let i=0;i<7;i++){
      panes.push({
        type:'hand',
        x: 180 + i*120 + (i%2)*20,
        y: 1260 + (i%3)*38,
        s: .72 + rnd()*0.12,
        fill: i%2 ? '#2e2016' : '#cc9a58',
        delay: 360 + i*18,
        flip: i%2 ? -1 : 1
      });
    }

    // animal silhouettes along the base
    const animals = [
      {x:250,y:1470,s:1.0,kind:'ibex',delay:610},
      {x:545,y:1500,s:1.18,kind:'bison',delay:660},
      {x:810,y:1465,s:0.96,kind:'deer',delay:710}
    ];
    animals.forEach(a => panes.push({type:'animal',...a,fill:'#271a12'}));

    panes.sort((a,b)=>a.delay-b.delay);
  }

  function polar(cx,cy,r,a){ return {x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r}; }

  function paintPane(ctx, pane, t){
    const p = Math.max(0, Math.min(1, (t - pane.delay)/90));
    if (p <= 0) return;
    const ease = p<1 ? (1 - Math.pow(1-p, 3)) : 1;

    ctx.save();
    ctx.globalAlpha = 0.15 + ease*0.85;

    if (pane.type === 'circle'){
      ctx.fillStyle = pane.fill;
      ctx.beginPath();
      ctx.arc(pane.x,pane.y,pane.r*ease,0,Math.PI*2);
      ctx.fill();
      leadCircle(ctx, pane.x,pane.y,pane.r);
    }

    if (pane.type === 'wedge'){
      ctx.fillStyle = pane.fill;
      ctx.beginPath();
      ctx.arc(pane.cx,pane.cy,pane.r1*ease,pane.a0,pane.a1);
      ctx.arc(pane.cx,pane.cy,pane.r0*ease,pane.a1,pane.a0,true);
      ctx.closePath();
      ctx.fill();
      leadWedge(ctx,pane);
    }

    if (pane.type === 'petal'){
      ctx.translate(pane.x,pane.y);
      ctx.rotate(pane.a);
      ctx.scale(ease,ease);
      ctx.fillStyle = pane.fill;
      ctx.beginPath();
      ctx.ellipse(0,0,pane.rx,pane.ry,0,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#23170f';
      ctx.lineWidth = 9;
      ctx.stroke();
    }

    if (pane.type === 'poly'){
      ctx.fillStyle = pane.fill;
      const cx = (pane.pts[0].x + pane.pts[1].x + pane.pts[2].x)/3;
      const cy = (pane.pts[0].y + pane.pts[1].y + pane.pts[2].y)/3;
      ctx.beginPath();
      pane.pts.forEach((pt,i)=>{
        const x = cx + (pt.x-cx)*ease;
        const y = cy + (pt.y-cy)*ease;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#24170f';
      ctx.lineWidth = 9;
      ctx.stroke();
    }

    if (pane.type === 'hand'){
      drawHand(ctx, pane.x, pane.y, pane.s*ease, pane.fill, pane.flip);
    }

    if (pane.type === 'animal'){
      drawAnimal(ctx, pane.kind, pane.x, pane.y, pane.s*ease, pane.fill);
    }

    ctx.restore();
  }

  function leadCircle(ctx,x,y,r){
    ctx.save();
    ctx.strokeStyle = '#24170f';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  function leadWedge(ctx,p){
    ctx.save();
    ctx.strokeStyle = '#24170f';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(p.cx,p.cy,p.r1,p.a0,p.a1);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(p.cx,p.cy,p.r0,p.a0,p.a1);
    ctx.stroke();
    let A = polar(p.cx,p.cy,p.r0,p.a0), B = polar(p.cx,p.cy,p.r1,p.a0);
    let C = polar(p.cx,p.cy,p.r0,p.a1), D = polar(p.cx,p.cy,p.r1,p.a1);
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(C.x,C.y); ctx.lineTo(D.x,D.y); ctx.stroke();
    ctx.restore();
  }

  function drawHand(ctx,x,y,s,fill,flip=1){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(s*flip,s);
    ctx.fillStyle = fill;
    ctx.globalAlpha *= 0.72;
    ctx.beginPath();
    ctx.ellipse(0,18,34,48,0,0,Math.PI*2);
    ctx.fill();
    const fingerX = [-26,-12,3,18,31];
    const fingerH = [62,74,76,69,52];
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.roundRect(fingerX[i]-8,-fingerH[i]+8,16,fingerH[i],8);
      ctx.fill();
    }
    ctx.clearRect(-7,45,14,22);
    ctx.restore();
  }

  function drawAnimal(ctx,kind,x,y,s,fill){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(s,s);
    ctx.fillStyle = fill;
    ctx.globalAlpha *= 0.88;
    ctx.beginPath();
    if(kind==='bison'){
      ctx.moveTo(-84,8); ctx.lineTo(-48,-26); ctx.lineTo(6,-52); ctx.lineTo60,-38);
      ctx.lineTo86,-8); ctx.lineTo74,18); ctx.lineTo48,22); ctx.lineTo18,48);
      ctx.lineTo(-38,42); ctx.lineTo(-82,24); ctx.closePath();
      ctx.fill();
      leg(ctx,-48,22,12,58); leg(ctx,-10,28,12,68); leg(ctx,28,25,12,64); leg(ctx,58,16,11,55);
      horn(ctx,64,-26,18,-22); horn(ctx,42,-34,18,-15);
    } else if(kind==='ibex'){
      ctx.moveTo(-72,10); ctx.lineTo(-38,-28); ctx.lineTo14,-40); ctx.lineTo58,-20);
      ctx.lineTo76,0); ctx.lineTo58,20); ctx.lineTo18,28); ctx.lineTo-26,22; ctx.closePath(); ctx.fill();
      leg(ctx,-42,20,10,62); leg(ctx,-8,22,10,70); leg(ctx,25,16,10,62); leg(ctx,53,8,9,53);
      ctx.beginPath(); ctx.arc(52,-46,32,Math.PI*0.2,Math.PI*1.2,true); ctx.fill();
    } else if(kind==='deer'){
      ctx.moveTo(-70,8); ctx.lineTo(-36,-24); ctx.lineTo20,-30); ctx.lineTo68,-10);
      ctx.lineTo82,8); ctx.lineTo58,22); ctx.lineTo0,26); ctx.lineTo-48,20; ctx.closePath(); ctx.fill();
      leg(ctx,-36,18,8,66); leg(ctx,-2,20,8,74); leg(ctx,28,18,8,68); leg(ctx,56,10,8,58);
      ctx.beginPath();
      ctx.fillRect(60,-60,6,42); ctx.fillRect(70,-56,6,38);
      ctx.fillRect(60,-60,24,6); ctx.fillRect(68,-42,18,6);
      ctx.fill();
    }
    ctx.restore();

    function leg(ctx,x,y,w,h){ ctx.fillRect(x,y,w,h); }
    function horn(ctx,x,y,w,h){ ctx.fillRect(x,y,w,h); }
  }

  function drawLight(t){
    lctx.clearRect(0,0,W,H);
    const pulse = 0.5 + 0.5*Math.sin(t*0.00022);

    lctx.save();
    lctx.globalCompositeOperation = 'screen';

    panes.forEach((pane, idx) => {
      const p = Math.max(0, Math.min(1, (t*0.05 - pane.delay)/90));
      if (p <= 0) return;
      const a = 0.04 + p*0.12 + pulse*0.03;

      if (pane.type === 'wedge' || pane.type === 'circle' || pane.type === 'petal' || pane.type === 'poly'){
        let gx = CX, gy = CY + 240;
        const grad = lctx.createRadialGradient(gx, gy, 20, gx, gy, 760);
        grad.addColorStop(0, `rgba(255,220,140,${a*0.9})`);
        grad.addColorStop(.35, `rgba(244,176,82,${a*0.55})`);
        grad.addColorStop(1, `rgba(244,176,82,0)`);
        lctx.fillStyle = grad;

        if (pane.type === 'circle'){
          lctx.beginPath(); lctx.arc(pane.x,pane.y,pane.r*1.8,0,Math.PI*2); lctx.fill();
        } else if (pane.type === 'petal'){
          lctx.save();
          lctx.translate(pane.x,pane.y);
          lctx.rotate(pane.a);
          lctx.beginPath();
          lctx.ellipse(0,0,pane.rx*2.2,pane.ry*2.1,0,0,Math.PI*2);
          lctx.fill();
          lctx.restore();
        } else if (pane.type === 'poly'){
          lctx.beginPath();
          pane.pts.forEach((pt,i)=> i?lctx.lineTo(pt.x,pt.y):lctx.moveTo(pt.x,pt.y));
          lctx.closePath();
          lctx.fill();
        } else {
          lctx.beginPath();
          lctx.arc(pane.cx,pane.cy,pane.r1+50,pane.a0,pane.a1);
          lctx.arc(pane.cx,pane.cy,pane.r0-10,pane.a1,pane.a0,true);
          lctx.closePath();
          lctx.fill();
        }
      }
    });

    const streamCount = 8;
    for(let i=0;i<streamCount;i++){
      const angle = -1.1 + i*(2.2/(streamCount-1));
      const len = 1050;
      const width = 85 + 28*Math.sin(t*0.0002 + i);
      const sx = CX + Math.cos(angle)*110;
      const sy = CY + Math.sin(angle)*110;
      const ex = sx + Math.cos(angle+Math.PI/2)*0 + (i-3.5)*8;
      const ey = sy + 800 + i*35;

      lctx.save();
      lctx.translate(sx,sy);
      lctx.rotate(angle*0.08 + 1.55);
      const g = lctx.createLinearGradient(0,0,0,len);
      g.addColorStop(0,`rgba(255,223,154,${0.09 + pulse*0.04})`);
      g.addColorStop(.25,`rgba(224,150,65,${0.065 + pulse*0.025})`);
      g.addColorStop(1,'rgba(224,150,65,0)');
      lctx.fillStyle = g;
      lctx.beginPath();
      lctx.moveTo(-width/2,0);
      lctx.lineTo(width/2,0);
      lctx.lineTo(width*1.8,len);
      lctx.lineTo(-width*1.8,len);
      lctx.closePath();
      lctx.fill();
      lctx.restore();
    }

    lctx.restore();
  }

  function drawWindow(t){
    wctx.clearRect(0,0,W,H);
    const tt = t*0.05;

    // stone arch
    const archGrad = wctx.createLinearGradient(0,280,0,1320);
    archGrad.addColorStop(0,'#5a4330');
    archGrad.addColorStop(.5,'#35271b');
    archGrad.addColorStop(1,'#1d1510');

    wctx.fillStyle = archGrad;
    wctx.beginPath();
    wctx.moveTo(180,1280);
    wctx.lineTo(180,760);
    wctx.arc(CX,CY,360,Math.PI,0,false);
    wctx.lineTo(900,1280);
    wctx.lineTo(810,1280);
    wctx.lineTo(810,820);
    wctx.arc(CX,CY,270,0,Math.PI,true);
    wctx.lineTo(270,1280);
    wctx.closePath();
    wctx.fill();

    // subtle soot
    for(let i=0;i<22;i++){
      wctx.fillStyle = `rgba(0,0,0,${0.02+rnd()*0.012})`;
      wctx.beginPath();
      wctx.ellipse(540+(rnd()-.5)*620, 820+rnd()*600, 30+rnd()*150, 14+rnd()*80, rnd()*Math.PI, 0, Math.PI*2);
      wctx.fill();
    }

    panes.forEach(p => paintPane(wctx, p, tt));

    // lead framework circles
    [56,114,188,262,312].forEach(r=>{
      wctx.strokeStyle = '#24170f';
      wctx.lineWidth = r===312 ? 12 : 8;
      wctx.beginPath();
      wctx.arc(CX,CY,r,0,Math.PI*2);
      wctx.stroke();
    });

    for(let i=0;i<24;i++){
      const a = i*Math.PI*2/24 - Math.PI/2;
      const p1 = polar(CX,CY,42,a);
      const p2 = polar(CX,CY,312,a);
      wctx.strokeStyle = 'rgba(33,22,15,0.9)';
      wctx.lineWidth = 5 + (i%3===0?2:0);
      wctx.beginPath();
      wctx.moveTo(p1.x,p1.y);
      wctx.lineTo(p2.x,p2.y);
      wctx.stroke();
    }

    // cracked stone hints
    wctx.strokeStyle = 'rgba(0,0,0,0.18)';
    wctx.lineWidth = 3;
    const crackSets = [
      [[245,545],[220,620],[228,700],[210,788]],
      [[835,560],[864,650],[850,740],[872,820]],
      [[535,1140],[518,1210],[540,1300]]
    ];
    crackSets.forEach(seg=>{
      wctx.beginPath();
      seg.forEach((p,i)=> i?wctx.lineTo(p[0],p[1]):wctx.moveTo(p[0],p[1]));
      wctx.stroke();
    });
  }

  function ambientAudio(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      const ctx = new AC();
      const now = ctx.currentTime;

      const master = ctx.createGain();
      master.gain.value = 0.013;
      master.connect(ctx.destination);

      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const osc3 = ctx.createOscillator();
      const trem = ctx.createOscillator();
      const tremGain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc1.type = 'triangle';
      osc2.type = 'sine';
      osc3.type = 'sine';
      osc1.frequency.value = 73.42;
      osc2.frequency.value = 110.0;
      osc3.frequency.value = 146.84;
      trem.frequency.value = 0.047;

      tremGain.gain.value = 0.008;
      trem.connect(tremGain.gain);

      const g1 = ctx.createGain(), g2 = ctx.createGain(), g3 = ctx.createGain();
      g1.gain.value = 0.18; g2.gain.value = 0.08; g3.gain.value = 0.04;

      filter.type = 'lowpass';
      filter.frequency.value = 520;
      filter.Q.value = 0.7;

      osc1.connect(g1); osc2.connect(g2); osc3.connect(g3);
      g1.connect(filter); g2.connect(filter); g3.connect(filter);
      filter.connect(master);
      tremGain.connect(master.gain);

      osc1.start(now); osc2.start(now); osc3.start(now); trem.start(now);

      setInterval(()=>{
        const t = ctx.currentTime;
        osc2.frequency.linearRampToValueAtTime([98,110,123.47][Math.floor(rnd()*3)], t+8);
        osc3.frequency.linearRampToValueAtTime([146.84,164.81,130.81][Math.floor(rnd()*3)], t+10);
        filter.frequency.linearRampToValueAtTime(420 + rnd()*180, t+12);
      }, 12000);

      const resume = () => {
        if (ctx.state !== 'running') ctx.resume();
        window.removeEventListener('pointerdown', resume);
        window.removeEventListener('keydown', resume);
      };
      window.addEventListener('pointerdown', resume, {once:true});
      window.addEventListener('keydown', resume, {once:true});
    }catch(e){}
  }

  drawStone();
  buildRoseGeometry();
  ambientAudio();

  let start = performance.now();
  function frame(now){
    const t = now - start;
    drawLight(t);
    drawWindow(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
