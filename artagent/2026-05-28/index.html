<style>
  :root{
    --bg0:#05060a;
    --bg1:#0e1020;
    --ink:#d8e6ff;
    --acid:#8cff5f;
    --violet:#7d4dff;
    --ember:#ff6f3c;
    --cyan:#4bf2ff;
    --sand:#f0ddb8;
    --rose:#ff4ea3;
    --shadow:#020308;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:
      radial-gradient(circle at 50% 40%, #1a1b2b 0%, #0b0c12 46%, #020307 100%);
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  #frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 52% 49%, rgba(31,45,91,.55), rgba(10,10,20,.7) 28%, rgba(3,4,8,.96) 72%),
      linear-gradient(180deg,#111522 0%, #07090f 100%);
    box-shadow:0 0 40px rgba(0,0,0,.45);
    isolation:isolate;
  }

  #background-video{
    position:absolute;
    inset:10% 8% 14% 18%;
    width:56%;
    height:54%;
    object-fit:cover;
    opacity:.84;
    filter:saturate(1.35) contrast(1.15) hue-rotate(-10deg) brightness(.88);
    transform:rotate(-7deg) scale(1.08);
    border-radius:42% 51% 44% 48% / 36% 50% 39% 57%;
    mix-blend-mode:screen;
    z-index:2;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.05),
      0 0 50px rgba(76,242,255,.12),
      0 0 120px rgba(125,77,255,.12);
    animation: videoBreath 34s ease-in-out infinite;
  }

  @keyframes videoBreath{
    0%,100%{transform:rotate(-7deg) scale(1.08) translate(0,0)}
    50%{transform:rotate(-4deg) scale(1.13) translate(1.2%, -0.8%)}
  }

  .layer{position:absolute; inset:0; pointer-events:none}

  #bgCanvas{
    position:absolute; inset:0; width:100%; height:100%; z-index:0;
  }
  #ringCanvas{
    position:absolute; inset:0; width:100%; height:100%; z-index:5;
    mix-blend-mode:screen;
  }

  #svgLayer{z-index:3; overflow:visible}
  #frontSvg{z-index:8; overflow:visible}

  .coreGlow{
    position:absolute;
    left:50%; top:50%;
    width:76%;
    height:76%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
      radial-gradient(circle,
        rgba(255,255,255,.08) 0%,
        rgba(76,242,255,.1) 12%,
        rgba(125,77,255,.1) 24%,
        rgba(255,111,60,.08) 34%,
        rgba(0,0,0,0) 62%);
    filter:blur(18px);
    opacity:.85;
    z-index:1;
    animation: inhale 28s ease-in-out infinite;
  }

  .axisVeil{
    position:absolute;
    inset:-12%;
    background:
      conic-gradient(from 0deg,
        rgba(255,255,255,.02) 0deg,
        rgba(255,255,255,0) 36deg,
        rgba(76,242,255,.04) 70deg,
        rgba(255,255,255,0) 120deg,
        rgba(255,111,60,.05) 182deg,
        rgba(255,255,255,0) 240deg,
        rgba(140,255,95,.04) 298deg,
        rgba(255,255,255,0) 360deg);
    filter:blur(8px);
    opacity:.4;
    z-index:1;
    animation: turnSlow 80s linear infinite;
  }

  @keyframes inhale{
    0%,100%{transform:translate(-50%,-50%) scale(.96)}
    50%{transform:translate(-50%,-50%) scale(1.04)}
  }
  @keyframes turnSlow{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
  }

  #portrait-shadow{
    position:absolute;
    left:57%;
    top:61%;
    width:27%;
    height:9%;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.45) 0%, rgba(0,0,0,.2) 42%, rgba(0,0,0,0) 75%);
    transform:translate(-50%,-50%) rotate(-8deg) scale(1.2,.86);
    filter:blur(14px);
    z-index:4;
    opacity:.9;
  }

  #portrait-echoes{
    position:absolute;
    inset:0;
    z-index:4;
    opacity:.9;
  }

  #portrait-image{
    position:absolute;
    left:61%;
    top:55%;
    width:36%;
    height:auto;
    z-index:6;
    transform:translate(-50%,-50%);
    filter:
      saturate(1.1)
      contrast(1.05)
      hue-rotate(-8deg)
      drop-shadow(0 18px 24px rgba(0,0,0,.38))
      drop-shadow(0 0 16px rgba(76,242,255,.18))
      drop-shadow(0 0 30px rgba(255,111,60,.08));
    animation: portraitStill 23s ease-in-out infinite;
  }

  @keyframes portraitStill{
    0%,100%{transform:translate(-50%,-50%) scale(1) rotate(-1.2deg)}
    50%{transform:translate(-49.2%,-50.8%) scale(1.014) rotate(.6deg)}
  }

  .occlusion{
    position:absolute;
    z-index:7;
    filter:blur(.2px);
    opacity:.95;
  }

  .occlusion.a{
    left:46%;
    top:53%;
    width:18%;
    height:34%;
    background:
      linear-gradient(180deg, rgba(10,10,20,0) 0%, rgba(11,16,34,.55) 18%, rgba(32,225,255,.12) 32%, rgba(8,10,18,.86) 60%, rgba(4,4,8,0) 100%);
    clip-path:polygon(28% 0%, 100% 8%, 84% 100%, 0% 88%);
    transform:rotate(13deg);
  }
  .occlusion.b{
    left:65%;
    top:35%;
    width:12%;
    height:20%;
    background:
      linear-gradient(180deg, rgba(255,255,255,.08), rgba(125,77,255,.18), rgba(0,0,0,0));
    clip-path:polygon(50% 0%, 100% 26%, 74% 100%, 14% 84%, 0% 28%);
    transform:rotate(18deg);
    opacity:.7;
  }
  .occlusion.c{
    left:57%;
    top:69%;
    width:24%;
    height:9%;
    background:
      linear-gradient(90deg, rgba(0,0,0,0), rgba(255,111,60,.18), rgba(76,242,255,.16), rgba(0,0,0,0));
    clip-path:polygon(0% 43%, 16% 18%, 50% 34%, 86% 2%, 100% 56%, 72% 100%, 22% 74%);
    transform:rotate(-7deg);
    filter:blur(1px);
  }

  #grain{
    position:absolute; inset:0; z-index:9; opacity:.12;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.4) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.2) 0 1px, transparent 1px 5px);
    mix-blend-mode:soft-light;
    transform:scale(1.2);
  }

  #vignette{
    position:absolute; inset:0; z-index:10;
    background:
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 48%, rgba(0,0,0,.14) 70%, rgba(0,0,0,.48) 100%);
  }

  #date{
    position:absolute;
    right:18px;
    bottom:14px;
    z-index:12;
    color:rgba(230,240,255,.55);
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    user-select:none;
  }

  #guinea-pig{
    position:absolute;
    left:16px;
    top:1772px;
    width:18px;
    height:auto;
    z-index:11;
    opacity:.62;
    filter:saturate(.9) brightness(.84) drop-shadow(0 1px 1px rgba(0,0,0,.3));
    transform:rotate(-6deg);
  }

  .edgeFade{
    position:absolute; inset:-2%; z-index:11; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(5,6,10,.96) 0%, rgba(5,6,10,0) 8%, rgba(5,6,10,0) 92%, rgba(5,6,10,.98) 100%),
      linear-gradient(90deg, rgba(5,6,10,.96) 0%, rgba(5,6,10,0) 8%, rgba(5,6,10,0) 92%, rgba(5,6,10,.98) 100%);
    mix-blend-mode:normal;
    opacity:.46;
  }
</style>

<script>
(() => {
  const dateSeed = 20260528;
  function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
  const rand = mulberry32(dateSeed);

  const bg = document.getElementById('bgCanvas');
  const ctx = bg.getContext('2d');
  const ring = document.getElementById('ringCanvas');
  const rctx = ring.getContext('2d');

  const W = bg.width, H = bg.height;
  const cx = 540, cy = 960;

  const shards = [];
  for(let i=0;i<22;i++){
    const a = (Math.PI*2/22)*i + rand()*0.18;
    const dist = 170 + i*22 + rand()*40;
    const len = 80 + rand()*210;
    const wid = 18 + rand()*48;
    const tilt = (rand()-.5)*0.4;
    const hue = [18, 191, 259, 101, 38][i%5];
    shards.push({a,dist,len,wid,tilt,hue,phase:rand()*Math.PI*2});
  }

  const bands = [];
  for(let i=0;i<14;i++){
    bands.push({
      r:110+i*58 + rand()*20,
      thickness:8 + rand()*26,
      segments:6 + Math.floor(rand()*5),
      speed:.00008 + rand()*0.00018,
      phase:rand()*Math.PI*2,
      hue:[18,191,259,101,38][i%5],
      alpha:.08 + rand()*.17
    });
  }

  function poly(ctx, pts){
    ctx.beginPath();
    ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.closePath();
  }

  function drawBackground(t){
    ctx.clearRect(0,0,W,H);

    const g = ctx.createRadialGradient(cx,cy,80,cx,cy,980);
    g.addColorStop(0,'rgba(28,34,82,0.34)');
    g.addColorStop(.18,'rgba(14,18,36,0.22)');
    g.addColorStop(.48,'rgba(8,10,18,0.12)');
    g.addColorStop(1,'rgba(2,3,7,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    for(let i=0;i<8;i++){
      const rr = 160 + i*120;
      const alpha = 0.022 + i*0.003;
      ctx.beginPath();
      ctx.arc(cx,cy,rr,0,Math.PI*2);
      ctx.lineWidth = 80 - i*7;
      ctx.strokeStyle = `rgba(${i%2?85:255},${i%3?120:240},${i%2?255:110},${alpha})`;
      ctx.stroke();
    }

    shards.forEach((s,idx)=>{
      const pulse = Math.sin(t*0.00055 + s.phase);
      const r = s.dist + pulse*18;
      const a = s.a + Math.sin(t*0.0002 + idx)*0.03;
      const x = cx + Math.cos(a)*r;
      const y = cy + Math.sin(a)*r*1.42;
      const dirx = Math.cos(a + s.tilt), diry = Math.sin(a + s.tilt)*1.3;
      const nx = -diry, ny = dirx;
      const l = s.len*(0.9 + 0.16*Math.sin(t*0.0004 + idx));
      const w = s.wid*(0.95 + 0.14*Math.cos(t*0.0005 + idx*1.3));
      const pts = [
        [x-dirx*l*0.5 + nx*w*0.5, y-diry*l*0.5 + ny*w*0.5],
        [x+dirx*l*0.42 + nx*w*0.22, y+diry*l*0.42 + ny*w*0.22],
        [x+dirx*l*0.5 - nx*w*0.48, y+diry*l*0.5 - ny*w*0.48],
        [x-dirx*l*0.36 - nx*w*0.18, y-diry*l*0.36 - ny*w*0.18]
      ];
      poly(ctx, pts);
      const grad = ctx.createLinearGradient(pts[0][0],pts[0][1],pts[2][0],pts[2][1]);
      const col1 = s.hue===191 ? '75,242,255' : s.hue===259 ? '125,77,255' : s.hue===101 ? '140,255,95' : s.hue===38 ? '240,221,184' : '255,111,60';
      grad.addColorStop(0,`rgba(${col1},0.0)`);
      grad.addColorStop(.28,`rgba(${col1},${0.08 + idx*0.002})`);
      grad.addColorStop(.6,'rgba(255,255,255,0.12)');
      grad.addColorStop(1,`rgba(${col1},0.0)`);
      ctx.fillStyle = grad;
      ctx.fill();
    });

    for(let i=0;i<90;i++){
      const ang = (i/90)*Math.PI*2 + Math.sin(t*0.00008 + i)*0.02;
      const r0 = 130 + (i%9)*7;
      const r1 = 760 + (i%11)*22;
      const x0 = cx + Math.cos(ang)*r0;
      const y0 = cy + Math.sin(ang)*r0*1.5;
      const x1 = cx + Math.cos(ang)*r1;
      const y1 = cy + Math.sin(ang)*r1*1.48;
      const grad = ctx.createLinearGradient(x0,y0,x1,y1);
      grad.addColorStop(0,'rgba(255,255,255,0.00)');
      grad.addColorStop(.45, i%3===0 ? 'rgba(76,242,255,0.05)' : i%3===1 ? 'rgba(255,111,60,0.04)' : 'rgba(125,77,255,0.045)');
      grad.addColorStop(1,'rgba(255,255,255,0.00)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2 + (i%5===0 ? 2 : 0);
      ctx.beginPath();
      ctx.moveTo(x0,y0);
      ctx.lineTo(x1,y1);
      ctx.stroke();
    }
  }

  function drawRings(t){
    rctx.clearRect(0,0,W,H);
    rctx.lineCap = 'butt';

    bands.forEach((b, bi)=>{
      const rot = t*b.speed + b.phase;
      const seg = (Math.PI*2)/b.segments;
      for(let i=0;i<b.segments;i++){
        const start = rot + i*seg + 0.08*Math.sin(t*0.0003 + i + bi);
        const span = seg*(0.45 + 0.2*Math.sin(t*0.0004 + bi*0.8 + i));
        const r = b.r + 7*Math.sin(t*0.00045 + bi*1.4);
        const grad = rctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
        const c = b.hue===191 ? '76,242,255' : b.hue===259 ? '125,77,255' : b.hue===101 ? '140,255,95' : b.hue===38 ? '240,221,184' : '255,111,60';
        grad.addColorStop(0,`rgba(${c},0)`);
        grad.addColorStop(.5,`rgba(${c},${b.alpha})`);
        grad.addColorStop(1,`rgba(${c},0)`);
        rctx.strokeStyle = grad;
        rctx.lineWidth = b.thickness;
        rctx.beginPath();
        rctx.ellipse(cx,cy,r,r*1.44,0,start,start+span);
        rctx.stroke();
      }
    });

    for(let i=0;i<6;i++){
      const rr = 220 + i*110 + Math.sin(t*0.0003+i)*10;
      rctx.beginPath();
      rctx.ellipse(cx,cy,rr,rr*1.37,0,0,Math.PI*2);
      rctx.lineWidth = 1.4;
      rctx.strokeStyle = i%2===0 ? 'rgba(255,255,255,0.08)' : 'rgba(255,111,60,0.06)';
      rctx.stroke();
    }

    for(let i=0;i<28;i++){
      const a = (i/28)*Math.PI*2 + t*0.00005*(i%2?1:-1);
      const rr = 320 + (i%7)*62;
      const x = cx + Math.cos(a)*rr;
      const y = cy + Math.sin(a)*rr*1.42;
      const sz = 9 + (i%4)*5;
      rctx.save();
      rctx.translate(x,y);
      rctx.rotate(a + Math.sin(t*0.0004+i)*0.5);
      const g = rctx.createLinearGradient(-sz,0,sz,0);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(.5, i%3===0 ? 'rgba(76,242,255,0.26)' : i%3===1 ? 'rgba(255,111,60,0.22)' : 'rgba(255,255,255,0.18)');
      g.addColorStop(1,'rgba(255,255,255,0)');
      rctx.fillStyle = g;
      rctx.beginPath();
      rctx.moveTo(0,-sz*1.2);
      rctx.lineTo(sz*1.45,0);
      rctx.lineTo(0,sz*1.2);
      rctx.lineTo(-sz*1.1,0);
      rctx.closePath();
      rctx.fill();
      rctx.restore();
    }
  }

  function animate(t){
    drawBackground(t);
    drawRings(t);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  if (window.self === window.top) {
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ac = new AudioCtx();
      const master = ac.createGain();
      master.gain.value = 0.018;
      master.connect(ac.destination);

      const osc1 = ac.createOscillator();
      const osc2 = ac.createOscillator();
      const osc3 = ac.createOscillator();
      const lfo = ac.createOscillator();
      const lfoGain = ac.createGain();
      const filter = ac.createBiquadFilter();

      osc1.type = 'triangle';
      osc2.type = 'sine';
      osc3.type = 'sawtooth';
      osc1.frequency.value = 73.42;
      osc2.frequency.value = 110.0;
      osc3.frequency.value = 146.84;

      filter.type = 'lowpass';
      filter.frequency.value = 700;
      filter.Q.value = 0.6;

      lfo.type = 'sine';
      lfo.frequency.value = 0.031;
      lfoGain.gain.value = 18;
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      const g1 = ac.createGain(), g2 = ac.createGain(), g3 = ac.createGain();
      g1.gain.value = .38; g2.gain.value = .16; g3.gain.value = .08;

      osc1.connect(g1).connect(filter);
      osc2.connect(g2).connect(filter);
      osc3.connect(g3).connect(filter);
      filter.connect(master);

      const now = ac.currentTime;
      osc1.start(now); osc2.start(now); osc3.start(now); lfo.start(now);

      setInterval(()=>{
        const t = ac.currentTime;
        const roots = [73.42,82.41,92.50,98.00];
        const r = roots[(Math.floor((Date.now()/7000)) + 2) % roots.length];
        osc1.frequency.linearRampToValueAtTime(r, t+3.8);
        osc2.frequency.linearRampToValueAtTime(r*1.5, t+4.1);
        osc3.frequency.linearRampToValueAtTime(r*2, t+4.4);
        master.gain.linearRampToValueAtTime(0.015 + 0.005*Math.sin(Date.now()*0.0002), t+4.2);
      }, 4200);

      const resume = ()=>{ if(ac.state!=='running') ac.resume(); };
      window.addEventListener('load', resume, {once:true});
    }catch(e){}
  }
})();
</script>
