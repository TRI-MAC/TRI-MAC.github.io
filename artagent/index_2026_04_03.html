<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="14400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>2026-04-03</title>
<style>
  :root{
    --bg:#ead7b3;
    --paper:#f3e4c8;
    --mustard:#d6a326;
    --rust:#b85e2f;
    --teal:#3f8f8a;
    --deepteal:#205f63;
    --olive:#7d7a48;
    --charcoal:#2c2924;
    --cream:#f7eedc;
    --sun:#efb84d;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#cdb58a;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
  }
  body{
    display:grid;
    place-items:center;
  }
  .frame{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.777778vw,100vh);
    aspect-ratio:9/16;
    overflow:hidden;
    background:
      radial-gradient(circle at 20% 18%, rgba(255,246,220,.8), transparent 18%),
      radial-gradient(circle at 78% 14%, rgba(214,163,38,.16), transparent 20%),
      linear-gradient(180deg, #efdfbe 0%, #e9d3aa 45%, #d8c092 100%);
    box-shadow:0 20px 60px rgba(0,0,0,.28);
  }

  .grain, .vignette, .overlay, .date, .sunburst, .svg-layer, #background-video, canvas, .shapes, .arch-wrap, .grid, #guinea-pig{
    position:absolute;
    inset:0;
  }

  #background-video{
    width:74%;
    height:46%;
    object-fit:cover;
    left:13%;
    top:27%;
    inset:auto;
    border-radius:48% 52% 44% 56% / 38% 46% 54% 62%;
    opacity:.82;
    filter:saturate(1.08) sepia(.12) contrast(1.03) brightness(1.02);
    box-shadow:
      0 0 0 18px rgba(247,238,220,.23),
      0 0 0 44px rgba(63,143,138,.09),
      0 28px 60px rgba(73,50,23,.22);
    animation: videoMorph 36s ease-in-out infinite alternate, videoDrift 42s ease-in-out infinite alternate;
    z-index:4;
  }

  @keyframes videoMorph{
    0%{border-radius:48% 52% 44% 56% / 38% 46% 54% 62%}
    50%{border-radius:56% 44% 58% 42% / 44% 58% 42% 56%}
    100%{border-radius:40% 60% 48% 52% / 60% 40% 60% 40%}
  }
  @keyframes videoDrift{
    0%{transform:translate(-1.2%, -0.8%) scale(1.02) rotate(-1.5deg)}
    100%{transform:translate(1.4%, 1%) scale(1.07) rotate(1.4deg)}
  }

  .sunburst{
    z-index:1;
    opacity:.38;
    background:
      conic-gradient(from -22deg at 50% 38%,
      rgba(214,163,38,0) 0deg 8deg,
      rgba(214,163,38,.28) 8deg 11deg,
      rgba(214,163,38,0) 11deg 22deg,
      rgba(184,94,47,.18) 22deg 25deg,
      rgba(214,163,38,0) 25deg 38deg,
      rgba(214,163,38,.22) 38deg 41deg,
      rgba(214,163,38,0) 41deg 52deg,
      rgba(63,143,138,.16) 52deg 55deg,
      rgba(214,163,38,0) 55deg 68deg,
      rgba(214,163,38,.26) 68deg 71deg,
      rgba(214,163,38,0) 71deg 360deg);
    animation: rotateSlow 70s linear infinite;
    mix-blend-mode:multiply;
  }

  .grid{
    z-index:2;
    opacity:.18;
    background:
      linear-gradient(90deg, transparent 0 11%, rgba(44,41,36,.09) 11% 11.35%, transparent 11.35% 100%),
      linear-gradient(transparent 0 8.2%, rgba(44,41,36,.08) 8.2% 8.5%, transparent 8.5% 100%);
    background-size:100% 100%, 100% 10.4%;
    transform:skewY(-8deg) translateY(4%);
    animation: gridShift 38s ease-in-out infinite alternate;
    mix-blend-mode:multiply;
  }
  @keyframes gridShift{
    0%{transform:skewY(-8deg) translateY(4%) scaleY(1)}
    100%{transform:skewY(-6deg) translateY(1%) scaleY(1.04)}
  }

  .arch-wrap{
    z-index:5;
    pointer-events:none;
  }
  .arch{
    position:absolute;
    border-radius:999px 999px 0 0;
    bottom:0;
    transform-origin:50% 100%;
    animation: sway 24s ease-in-out infinite alternate;
  }
  .arch.a1{
    left:-4%;
    width:38%;
    height:28%;
    background:rgba(63,143,138,.92);
    border-top-left-radius:220px;
    border-top-right-radius:220px;
    clip-path:inset(0 0 0 0 round 220px 220px 0 0);
    transform:rotate(-7deg);
    box-shadow: inset 0 0 0 2px rgba(247,238,220,.18);
  }
  .arch.a2{
    right:2%;
    width:28%;
    height:36%;
    background:rgba(214,163,38,.9);
    transform:rotate(6deg);
  }
  .arch.a3{
    left:26%;
    width:22%;
    height:19%;
    background:rgba(184,94,47,.84);
    transform:rotate(-1deg);
  }
  .arch.a4{
    right:23%;
    width:14%;
    height:15%;
    background:rgba(247,238,220,.62);
    transform:rotate(2deg);
    box-shadow:0 0 0 2px rgba(44,41,36,.08) inset;
  }
  @keyframes sway{
    0%{filter:hue-rotate(0deg); transform:translateY(0) rotate(var(--r,0deg))}
    100%{filter:hue-rotate(5deg); transform:translateY(-1.5%) rotate(calc(var(--r,0deg) + 2deg))}
  }

  .shapes{
    z-index:6;
    pointer-events:none;
  }
  .shape{
    position:absolute;
    transform-origin:center;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
    animation-direction:alternate;
  }
  .disc{
    border-radius:50%;
    mix-blend-mode:multiply;
  }
  .d1{
    width:170px;height:170px;left:11%;top:10%;
    background:rgba(239,184,77,.7);
    animation-name:pulse1;
    animation-duration:18s;
  }
  .d2{
    width:112px;height:112px;right:10%;top:20%;
    background:rgba(63,143,138,.52);
    animation-name:pulse2;
    animation-duration:23s;
  }
  .d3{
    width:76px;height:76px;left:14%;top:61%;
    background:rgba(247,238,220,.66);
    box-shadow:0 0 0 10px rgba(184,94,47,.08);
    animation-name:pulse3;
    animation-duration:20s;
  }
  .boomerang{
    width:250px;height:90px;
    border-radius:100px;
    background:transparent;
    border:26px solid rgba(32,95,99,.76);
    border-left-color:transparent;
    border-bottom-color:transparent;
    transform:rotate(28deg);
    left:56%;top:59%;
    animation: arcMove 28s ease-in-out infinite alternate;
  }
  .band{
    width:56%;height:5.8%;
    left:22%;top:51%;
    border-radius:999px;
    background:linear-gradient(90deg, rgba(184,94,47,.0), rgba(184,94,47,.82) 18%, rgba(247,238,220,.4) 55%, rgba(184,94,47,0) 100%);
    transform:rotate(-11deg);
    filter:blur(.2px);
    animation: bandSlide 16s ease-in-out infinite alternate;
  }
  .slab{
    width:26%;height:8.5%;
    left:8%;top:46%;
    background:rgba(44,41,36,.86);
    border-radius:4px;
    transform:rotate(-32deg);
    animation: slabRock 19s ease-in-out infinite alternate;
  }
  .slab.s2{
    left:auto; right:8%; top:43%;
    width:19%; height:7%;
    background:rgba(214,163,38,.88);
    transform:rotate(26deg);
    animation-duration:21s;
  }
  @keyframes pulse1{from{transform:scale(.95) translateY(0)}to{transform:scale(1.08) translateY(8px)}}
  @keyframes pulse2{from{transform:scale(1) translateX(-2px)}to{transform:scale(1.15) translateX(7px)}}
  @keyframes pulse3{from{transform:scale(.94)}to{transform:scale(1.12)}}
  @keyframes arcMove{from{transform:translate(-8px,4px) rotate(24deg)}to{transform:translate(12px,-6px) rotate(34deg)}}
  @keyframes bandSlide{from{transform:rotate(-13deg) scaleX(.96)}to{transform:rotate(-8deg) scaleX(1.03)}}
  @keyframes slabRock{from{transform:rotate(-32deg) translateY(0)}to{transform:rotate(-27deg) translateY(-5px)}}
  @keyframes rotateSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

  .svg-layer{
    z-index:7;
    pointer-events:none;
    opacity:.9;
  }

  canvas{
    z-index:3;
    width:100%;
    height:100%;
    mix-blend-mode:multiply;
    opacity:.42;
  }

  .overlay{
    z-index:8;
    background:
      radial-gradient(ellipse at 50% 32%, rgba(247,238,220,.0) 0 20%, rgba(247,238,220,.08) 40%, rgba(125,122,72,.1) 66%, rgba(44,41,36,.16) 100%),
      linear-gradient(180deg, rgba(247,238,220,.17), rgba(247,238,220,0) 18%, rgba(44,41,36,0) 74%, rgba(44,41,36,.12));
    mix-blend-mode:multiply;
  }

  .grain{
    z-index:9;
    opacity:.13;
    background-image:
      radial-gradient(rgba(44,41,36,.9) .7px, transparent .8px),
      radial-gradient(rgba(255,255,255,.7) .6px, transparent .8px);
    background-size:11px 11px, 13px 13px;
    background-position:0 0, 4px 7px;
    mix-blend-mode:soft-light;
    animation: grainDrift 9s steps(6) infinite;
  }
  @keyframes grainDrift{
    0%{transform:translate(0,0)}
    100%{transform:translate(6px,-4px)}
  }

  .vignette{
    z-index:10;
    pointer-events:none;
    box-shadow:inset 0 0 180px rgba(90,58,20,.18), inset 0 0 34px rgba(44,41,36,.08);
  }

  .date{
    z-index:11;
    inset:auto 18px 14px auto;
    width:auto;height:auto;
    color:rgba(44,41,36,.48);
    font-size:12px;
    letter-spacing:.18em;
    text-transform:none;
    mix-blend-mode:multiply;
  }

  #guinea-pig{
    z-index:8;
    inset:auto auto 86px 13px;
    width:18px;
    height:auto;
    opacity:.58;
    filter:sepia(.35) saturate(.7) brightness(.82);
    transform:rotate(-6deg);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="sunburst"></div>
    <div class="grid"></div>
    <canvas id="paint"></canvas>

    <video id="background-video" src="video/background.66a79ca1.mp4" autoplay loop muted playsinline></video>

    <div class="arch-wrap">
      <div class="arch a1" style="--r:-7deg"></div>
      <div class="arch a2" style="--r:6deg"></div>
      <div class="arch a3" style="--r:-1deg"></div>
      <div class="arch a4" style="--r:2deg"></div>
    </div>

    <div class="shapes">
      <div class="shape disc d1"></div>
      <div class="shape disc d2"></div>
      <div class="shape disc d3"></div>
      <div class="shape boomerang"></div>
      <div class="shape band"></div>
      <div class="shape slab"></div>
      <div class="shape slab s2"></div>
    </div>

    <svg class="svg-layer" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="tealFade" x1="0" x2="1">
          <stop offset="0" stop-color="#3f8f8a" stop-opacity="0"/>
          <stop offset=".5" stop-color="#3f8f8a" stop-opacity=".85"/>
          <stop offset="1" stop-color="#3f8f8a" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="rustFade" x1="0" x2="1">
          <stop offset="0" stop-color="#b85e2f" stop-opacity="0"/>
          <stop offset=".45" stop-color="#b85e2f" stop-opacity=".7"/>
          <stop offset="1" stop-color="#b85e2f" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <g opacity=".88" style="animation: rotateSlow 120s linear infinite; transform-origin:540px 720px;">
        <path d="M165 357 C 318 247, 478 238, 650 296 C 814 352, 894 468, 904 620"
              fill="none" stroke="#2c2924" stroke-opacity=".38" stroke-width="20" stroke-linecap="round"/>
        <path d="M907 608 C 882 787, 798 914, 654 982 C 502 1054, 352 1042, 226 949"
              fill="none" stroke="url(#tealFade)" stroke-width="36" stroke-linecap="round"/>
      </g>

      <g opacity=".85">
        <ellipse cx="540" cy="713" rx="385" ry="474" fill="none" stroke="#f7eedc" stroke-opacity=".52" stroke-width="10"/>
        <ellipse cx="540" cy="713" rx="425" ry="514" fill="none" stroke="#b85e2f" stroke-opacity=".18" stroke-width="20" stroke-dasharray="2 34" />
      </g>

      <g opacity=".78" style="animation: svgShift 27s ease-in-out infinite alternate; transform-origin:540px 960px;">
        <path d="M115 1270 Q 366 1172 537 1268 T 969 1263" fill="none" stroke="url(#rustFade)" stroke-width="34" stroke-linecap="round"/>
        <path d="M163 1362 Q 406 1300 553 1372 T 931 1368" fill="none" stroke="#205f63" stroke-opacity=".36" stroke-width="16" stroke-linecap="round"/>
      </g>

      <g opacity=".7">
        <circle cx="195" cy="302" r="24" fill="#2c2924"/>
        <circle cx="880" cy="438" r="15" fill="#d6a326"/>
        <rect x="182" y="1110" width="134" height="20" rx="4" fill="#2c2924" transform="rotate(-34 249 1120)"/>
        <rect x="790" y="1048" width="92" height="17" rx="4" fill="#f7eedc" fill-opacity=".9" transform="rotate(28 836 1056)"/>
      </g>

      <style>
        @keyframes svgShift{
          from{transform:translateY(0) scaleX(1)}
          to{transform:translateY(-14px) scaleX(1.03)}
        }
      </style>
    </svg>

    <img id="guinea-pig" src="img/guineapig.66a79ca1.png" alt="">

    <div class="overlay"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="date">2026-04-03</div>
  </div>

<script>
(function(){
  const seedStr = "2026-04-03";
  let h = 2166136261 >>> 0;
  for(let i=0;i<seedStr.length;i++){
    h ^= seedStr.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  function rand(){
    h += 0x6D2B79F5;
    let t = h;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }

  const canvas = document.getElementById('paint');
  const ctx = canvas.getContext('2d');
  const frame = document.querySelector('.frame');

  function resize(){
    const rect = frame.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  const blobs = [];
  for(let i=0;i<11;i++){
    blobs.push({
      x: rand()*1080,
      y: rand()*1920,
      r: 90 + rand()*220,
      sx: .85 + rand()*.45,
      sy: .7 + rand()*.65,
      rot: rand()*Math.PI*2,
      sp: .0008 + rand()*.0015,
      phase: rand()*Math.PI*2,
      color: [
        'rgba(63,143,138,0.10)',
        'rgba(214,163,38,0.10)',
        'rgba(184,94,47,0.08)',
        'rgba(247,238,220,0.10)',
        'rgba(44,41,36,0.05)'
      ][i%5]
    });
  }

  function drawBlob(b,t){
    ctx.save();
    ctx.translate(b.x*(frame.clientWidth/1080), b.y*(frame.clientHeight/1920));
    ctx.rotate(b.rot + Math.sin(t*b.sp + b.phase)*0.35);
    const scale = frame.clientWidth/1080;
    ctx.scale(b.sx*scale, b.sy*(frame.clientHeight/1920));
    ctx.fillStyle = b.color;
    ctx.beginPath();
    const rr = b.r;
    for(let a=0;a<=Math.PI*2+.15;a+=Math.PI/6){
      const mod = 1 + 0.18*Math.sin(a*3 + t*0.0012 + b.phase) + 0.1*Math.cos(a*5 - t*0.0009);
      const x = Math.cos(a)*rr*mod;
      const y = Math.sin(a)*rr*(0.92 + 0.15*Math.sin(a*2+b.phase))*mod;
      if(a===0) ctx.moveTo(x,y);
      else ctx.quadraticCurveTo(x*1.06,y*1.06,x,y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawSpecks(t){
    const w = frame.clientWidth, h = frame.clientHeight;
    for(let i=0;i<28;i++){
      const x = (i*93.7 + 60 + Math.sin(t*0.0002+i)*20) % w;
      const y = (i*141.3 + 120 + Math.cos(t*0.00018+i*2)*16) % h;
      ctx.fillStyle = i%3===0 ? 'rgba(44,41,36,.08)' : i%3===1 ? 'rgba(214,163,38,.10)' : 'rgba(63,143,138,.08)';
      ctx.beginPath();
      ctx.arc(x,y,1.2 + (i%4)*0.5,0,Math.PI*2);
      ctx.fill();
    }
  }

  function draw(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(const b of blobs) drawBlob(b,t);
    drawSpecks(t);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const master = audioCtx.createGain();
  master.gain.value = 0.012;
  master.connect(audioCtx.destination);

  const freqs = [146.83, 220, 277.18];
  freqs.forEach((f,i)=>{
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const lfo = audioCtx.createOscillator();
    const lfoG = audioCtx.createGain();
    o.type = i===0 ? 'sine' : i===1 ? 'triangle' : 'sawtooth';
    o.frequency.value = f * (1 + i*0.002);
    g.gain.value = 0.0038 + i*0.0018;
    lfo.frequency.value = 0.02 + i*0.013;
    lfoG.gain.value = 0.002 + i*0.0012;
    lfo.connect(lfoG).connect(g.gain);
    o.connect(g).connect(master);
    o.start();
    lfo.start();
  });

  const noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (rand()*2-1)*0.18;
  const noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const nf = audioCtx.createBiquadFilter();
  nf.type = 'lowpass';
  nf.frequency.value = 420;
  const ng = audioCtx.createGain();
  ng.gain.value = 0.0022;
  noise.connect(nf).connect(ng).connect(master);
  noise.start();

  if(audioCtx.state === 'suspended'){
    const resume = () => audioCtx.resume().catch(()=>{});
    setTimeout(resume, 400);
  }
})();
</script>
</body>
</html>
