<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benchmarks — Requisite Variety</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="../nav.js"></script>
  <style>
    .bench-hero {
      position: relative;
      z-index: 1;
      padding: 72px 24px 40px;
    }
    .bench-hero-inner {
      max-width: var(--max-width);
      margin: 0 auto;
    }
    .bench-hero h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .bench-hero p {
      font-size: 1.05rem;
      color: var(--color-text-muted);
      max-width: 640px;
      line-height: 1.7;
    }
    .bench-section {
      position: relative;
      z-index: 1;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px 64px;
    }
    .bench-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr));
      gap: 24px;
    }
    .bench-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 28px;
      min-width: 0;
    }
    .bench-card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .bench-card h3 a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .bench-card h3 a:hover {
      border-bottom-color: var(--color-primary);
    }
    .bench-card .bench-desc {
      font-size: 0.85rem;
      color: var(--color-text-muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .bench-card .bench-sub {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-primary);
      margin-bottom: 14px;
      font-weight: 500;
    }
    /* Leaderboard table */
    .bench-table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 14px;
    }
    .bench-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      line-height: 1.4;
    }
    .bench-table thead th {
      text-align: left;
      font-weight: 600;
      color: var(--color-text-muted);
      padding: 6px 10px;
      border-bottom: 2px solid var(--color-border);
      white-space: nowrap;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .bench-table tbody tr:nth-child(even) {
      background: var(--color-surface-alt);
    }
    .bench-table tbody tr:hover {
      background: var(--color-glow);
    }
    .bench-table td {
      padding: 7px 10px;
      white-space: nowrap;
    }
    .bench-table td:first-child {
      font-weight: 600;
      color: var(--color-text-muted);
      width: 36px;
    }
    .bench-table td:last-child {
      font-weight: 600;
    }
    .bench-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--color-text-muted);
      gap: 12px;
    }
    .bench-meta a {
      color: var(--color-primary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .bench-meta a:hover {
      border-bottom-color: var(--color-primary);
    }
    .bench-fallback {
      padding: 32px 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--color-text-muted);
    }
    .bench-fallback a {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 500;
    }
    /* Separator */
    .bench-sep {
      max-width: var(--max-width);
      margin: 0 auto 40px;
      padding: 0 24px;
      height: 1px;
      background: var(--color-border);
    }
    .bench-note {
      position: relative;
      z-index: 1;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px 48px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-text-muted);
      line-height: 1.6;
    }
    @media (max-width: 768px) {
      .bench-grid {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 520px) {
      .bench-grid {
        grid-template-columns: 1fr;
      }
      .bench-card { padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- ───── Circuit SVG Background ───── -->
  <svg class="circuit-bg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.8" fill="var(--color-circuit)"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#dot-grid)"/>
    <line class="trace trace-v1" x1="15%" y1="0" x2="15%" y2="100%"/>
    <line class="trace trace-v2" x1="85%" y1="0" x2="85%" y2="100%"/>
  </svg>

  <!-- ───── Hero ───── -->
  <section class="bench-hero">
    <div class="bench-hero-inner">
      <h1>HCAI Leaderboards</h1>
      <p>LLM leaderboards relevant to decision making, perspective taking, empathy, creativity, and other concerns relevant to HCAI. Updated nightly.</p>
    </div>
  </section>

  <div class="bench-sep"></div>

  <!-- ───── Leaderboard Cards ───── -->
  <section class="bench-section">
    <div id="bench-cards" class="bench-grid"></div>
  </section>

  <p class="bench-note" id="bench-note"></p>

  <script>
    // ── Fallback definitions (shown if JSON fetch fails) ──
    const FALLBACK = [
      { name: 'ConfidenceBench', description: 'Live benchmark for calibrated confidence that penalizes overconfident mistakes rather than rewarding accuracy alone.', url: 'https://confidencebench.com/' },
      { name: 'EQ-Bench 3', description: 'Live emotional-intelligence benchmark built around challenging role-plays and analysis tasks that emphasize empathy, social skill, insight, and audience/context tailoring.', url: 'https://eqbench.com/' },
      { name: 'EmpathyBench', description: 'Live empathy leaderboard that aggregates RMET, EQ, and IRI-style evaluations into a single emotional-intelligence ranking.', url: 'https://www.empathybench.com/' },
      { name: 'AbsenceBench', description: 'Live benchmark for detecting missing information and absent context, which is directly useful for caveating and "what\'s missing?" reasoning.', url: 'https://absencebench.github.io/#leaderboard' },
      { name: 'DesignArena', description: 'Crowdsourced live design benchmark where human pairwise votes continuously update rankings across UI, web, visualization, and related creative/design tasks.', url: 'https://www.designarena.ai/leaderboard' }
    ];

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function renderCard(bench) {
      const card = document.createElement('div');
      card.className = 'bench-card';

      // Title
      const h3 = document.createElement('h3');
      const a = document.createElement('a');
      a.href = bench.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = bench.name;
      h3.appendChild(a);
      card.appendChild(h3);

      // Description
      const desc = document.createElement('p');
      desc.className = 'bench-desc';
      desc.textContent = bench.description;
      card.appendChild(desc);

      // Sub-leaderboard label (for DesignArena)
      if (bench.sub_leaderboard) {
        const sub = document.createElement('div');
        sub.className = 'bench-sub';
        sub.textContent = '\u25B8 ' + bench.sub_leaderboard;
        card.appendChild(sub);
      }

      // Table (if rows exist)
      if (bench.columns && bench.rows && bench.rows.length > 0) {
        const wrap = document.createElement('div');
        wrap.className = 'bench-table-wrap';
        const table = document.createElement('table');
        table.className = 'bench-table';

        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        bench.columns.forEach(function(col) {
          const th = document.createElement('th');
          th.textContent = col;
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        bench.rows.forEach(function(row) {
          const tr = document.createElement('tr');
          row.forEach(function(cell) {
            const td = document.createElement('td');
            td.textContent = cell;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        wrap.appendChild(table);
        card.appendChild(wrap);
      } else {
        const fb = document.createElement('div');
        fb.className = 'bench-fallback';
        fb.innerHTML = 'Data unavailable &mdash; <a href="' + escapeHtml(bench.url) + '" target="_blank" rel="noopener">visit site &rarr;</a>';
        card.appendChild(fb);
      }

      // Meta line
      const meta = document.createElement('div');
      meta.className = 'bench-meta';
      meta.innerHTML = '<a href="' + escapeHtml(bench.url) + '" target="_blank" rel="noopener">Source &rarr;</a>';
      card.appendChild(meta);

      return card;
    }

    function renderAll(data) {
      const container = document.getElementById('bench-cards');
      const note = document.getElementById('bench-note');
      container.innerHTML = '';

      if (data && data.benchmarks) {
        data.benchmarks.forEach(function(b) { container.appendChild(renderCard(b)); });
        if (data.updated) {
          const d = new Date(data.updated);
          note.textContent = 'Last updated: ' + d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) + '. Data sourced from each benchmark\u2019s public leaderboard.';
        }
      } else {
        FALLBACK.forEach(function(b) { container.appendChild(renderCard(b)); });
        note.textContent = 'Leaderboard data could not be loaded. Visit each source site for current rankings.';
      }
    }

    fetch('benchmarks-data.json')
      .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data) { renderAll(data); })
      .catch(function() { renderAll(null); });
  </script>

</body>
</html>
