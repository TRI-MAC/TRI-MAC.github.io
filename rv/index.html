<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requisite Variety — TRI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ───── Circuit SVG Background ───── -->
  <svg class="circuit-bg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.8" fill="var(--color-circuit)"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#dot-grid)"/>
    <!-- Horizontal trace -->
    <line class="trace trace-h1" x1="0" y1="160" x2="100%" y2="160"/>
    <line class="trace trace-h2" x1="0" y1="480" x2="100%" y2="480"/>
    <!-- Vertical trace -->
    <line class="trace trace-v1" x1="25%" y1="0" x2="25%" y2="100%"/>
    <line class="trace trace-v2" x1="75%" y1="0" x2="75%" y2="100%"/>
    <!-- Node dots at intersections -->
    <circle class="node-dot" cx="25%" cy="160" r="3"/>
    <circle class="node-dot" cx="75%" cy="160" r="3"/>
    <circle class="node-dot" cx="25%" cy="480" r="3"/>
    <circle class="node-dot" cx="75%" cy="480" r="3"/>
  </svg>

  <!-- ───── Header ───── -->
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo-link">
        <img src="tri_mark.png" alt="TRI" class="logo-img">
        <span class="logo-text">
          <span class="logo-tri">Requisite Variety</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html" class="nav-link active">Blog</a>
        <a href="benchmarks.html" class="nav-link">Benchmarks</a>
        <a href="#" class="nav-link">Archive</a>
        <a href="#" class="nav-link">About</a>
      </nav>
    </div>
  </header>

  <!-- ───── Content Grid ───── -->
  <main class="content-grid-section">
    <div class="content-grid">

      <!-- Row 1, Cols 1-2: Featured (latest) Post -->
      <a class="featured-post" id="featured-post" href="#">
        <div class="featured-text">
          <h2 class="featured-title">Welcome to Requisite Variety</h2>
          <p class="featured-excerpt">New posts will appear here.</p>
          <span class="featured-cta">Read <span class="arrow">&rarr;</span></span>
        </div>
        <div class="featured-art" id="featured-art"></div>
      </a>

      <!-- Row 1, Col 3: Art Agent (unchanged) -->
      <aside class="artagent-callout">
        <div class="artagent-header">
          <span class="artagent-label">AI Art Agent</span>
          <span class="artagent-date" id="artagent-date">Today</span>
        </div>
        <a href="https://tri-mac.github.io/artagent/" id="artagent-link" target="_blank" rel="noopener" style="display:block;">
          <iframe src="https://tri-mac.github.io/artagent/" id="artagent-frame" class="artagent-iframe" title="AI Art Agent" loading="lazy" allow="autoplay 'none'" sandbox="allow-scripts allow-same-origin" style="pointer-events:none;"></iframe>
        </a>
        <div class="artagent-nav">
          <button class="artagent-btn" id="artagent-prev" title="Previous day">&lt;</button>
          <button class="artagent-btn" id="artagent-next" title="Next day">&gt;</button>
          <button class="artagent-btn" id="artagent-today" title="Today">&gt;&gt;</button>
        </div>
      </aside>

      <!-- Row 2, Col 1: AI Post -->
      <div class="ai-post-section">
        <div class="ai-post-header">
          <span class="ai-label">AI Reporter</span>
          <span class="ai-post-date" id="ai-post-date"></span>
        </div>
        <a class="callout-card callout-card--ai" id="ai-post-callout" href="#">
          <div class="callout-placeholder"><p>AI-generated posts will appear here.</p></div>
        </a>
        <div class="ai-post-nav">
          <button class="artagent-btn" id="ai-post-prev" title="Previous post">&lt;</button>
          <button class="artagent-btn" id="ai-post-next" title="Next post">&gt;</button>
          <button class="artagent-btn" id="ai-post-latest" title="Latest">&gt;&gt;</button>
        </div>
      </div>

      <!-- Row 2, Cols 2-3: Recent HCAI Papers -->
      <div class="papers-section">
        <span class="papers-label">Recent HCAI Papers</span>
        <div class="papers-inner">
          <a class="callout-card callout-card--in-section" id="paper-callout-1" href="#"></a>
          <a class="callout-card callout-card--in-section" id="paper-callout-2" href="#"></a>
        </div>
        <div class="papers-nav">
          <button class="artagent-btn" id="papers-prev" title="Previous papers">&lt;</button>
          <button class="artagent-btn" id="papers-next" title="Next papers">&gt;</button>
        </div>
      </div>

      <!-- Row 3: 2nd, 3rd, 4th most recent posts -->
      <a class="callout-card" id="post-callout-2" href="#">
        <div class="callout-placeholder"><p>Archival posts will appear here.</p></div>
      </a>
      <a class="callout-card" id="post-callout-3" href="#" style="display:none;"></a>
      <a class="callout-card" id="post-callout-4" href="#" style="display:none;"></a>

    </div>
  </main>

  <!-- ───── Footer ───── -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="tri_mark.png" alt="TRI" style="width:24px;height:24px;">
        <span>requisite variety</span>
        <span class="footer-dot">&middot;</span>
        <span>2026</span>
      </div>
      <div class="footer-links">
        <a href="#">GitHub</a>
        <a href="#">RSS</a>
      </div>
    </div>
    <div class="footer-circuit" aria-hidden="true">
      <svg width="100%" height="2">
        <line x1="0" y1="1" x2="100%" y2="1" stroke="var(--color-border)" stroke-width="1" stroke-dasharray="8 4"/>
      </svg>
    </div>
  </footer>

  <!-- ───── Art Agent Navigation ───── -->
  <script>
    (function() {
      var base = 'https://tri-mac.github.io/artagent/';
      var frame = document.getElementById('artagent-frame');
      var linkEl = document.getElementById('artagent-link');
      var dateEl = document.getElementById('artagent-date');
      var prevBtn = document.getElementById('artagent-prev');
      var nextBtn = document.getElementById('artagent-next');
      var todayBtn = document.getElementById('artagent-today');

      var today = new Date();
      today.setHours(0,0,0,0);
      var current = new Date(today);

      function fmt(d) {
        var y = d.getFullYear();
        var m = String(d.getMonth()+1).padStart(2,'0');
        var day = String(d.getDate()).padStart(2,'0');
        return { y: y, m: m, day: day, file: 'index_'+y+'_'+m+'_'+day+'.html', label: y+'.'+m+'.'+day };
      }

      function isToday(d) {
        return d.getTime() === today.getTime();
      }

      function fileUrl(d) {
        if (isToday(d)) return base;
        return base + fmt(d).file;
      }

      function checkExists(d) {
        if (isToday(d)) return Promise.resolve(true);
        return fetch(fileUrl(d), { method: 'HEAD' })
          .then(function(r) { return r.ok; })
          .catch(function() { return false; });
      }

      function updateDisplay() {
        dateEl.textContent = isToday(current) ? 'Today' : fmt(current).label;
        todayBtn.classList.toggle('artagent-btn-disabled', isToday(current));
        todayBtn.disabled = isToday(current);

        var prev = new Date(current);
        prev.setDate(prev.getDate() - 1);
        checkExists(prev).then(function(ok) {
          prevBtn.classList.toggle('artagent-btn-disabled', !ok);
          prevBtn.disabled = !ok;
        });

        var next = new Date(current);
        next.setDate(next.getDate() + 1);
        if (next > today) {
          nextBtn.classList.add('artagent-btn-disabled');
          nextBtn.disabled = true;
        } else {
          checkExists(next).then(function(ok) {
            nextBtn.classList.toggle('artagent-btn-disabled', !ok);
            nextBtn.disabled = !ok;
          });
        }
      }

      function navigate(d) {
        current = d;
        frame.src = fileUrl(d);
        linkEl.href = fileUrl(d);
        updateDisplay();
      }

      prevBtn.addEventListener('click', function() {
        var d = new Date(current);
        d.setDate(d.getDate() - 1);
        navigate(d);
      });

      nextBtn.addEventListener('click', function() {
        var d = new Date(current);
        d.setDate(d.getDate() + 1);
        navigate(d);
      });

      todayBtn.addEventListener('click', function() {
        navigate(new Date(today));
      });

      updateDisplay();
    })();
  </script>

  <!-- ───── Dynamic Content Loader ───── -->
  <script>
    (async function() {

      /* ── Helpers ── */

      function escapeHtml(str) {
        var d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      }

      // Fetch an HTML page and extract title, first image, and first paragraph
      async function parsePostHTML(basePath) {
        try {
          var res = await fetch(basePath + '/index.html');
          if (!res.ok) return null;
          var html = await res.text();
          var doc = new DOMParser().parseFromString(html, 'text/html');

          var titleEl = doc.querySelector('h1') || doc.querySelector('title');
          var title = titleEl ? titleEl.textContent.trim() : 'Untitled';

          var imgEl = doc.querySelector('.post-hero-image img, .post-body img, article img');
          var image = null;
          if (imgEl) {
            image = imgEl.getAttribute('src');
            if (image && !image.startsWith('http')) {
              image = basePath + '/' + image;
            }
          }

          var paragraphs = doc.querySelectorAll('article p, .post-content p, main p, p');
          var excerpt = '';
          for (var i = 0; i < paragraphs.length; i++) {
            var text = paragraphs[i].textContent.trim();
            if (text.length > 30) { excerpt = text; break; }
          }
          if (excerpt.length > 200) excerpt = excerpt.substring(0, 197) + '\u2026';

          return { title: title, image: image, excerpt: excerpt };
        } catch(e) {
          return null;
        }
      }

      // Build callout inner HTML: headline, then art with overlay text
      function buildCalloutInner(title, imgSrc, excerpt) {
        return '<h3 class="callout-headline">' + escapeHtml(title) + '</h3>'
          + '<div class="callout-art-wrapper">'
          + (imgSrc
              ? '<img class="callout-art" src="' + escapeHtml(imgSrc) + '" alt="">'
              : '<div class="callout-art-placeholder"></div>')
          + '<p class="callout-overlay-text">' + escapeHtml(excerpt) + '</p>'
          + '</div>';
      }

      /* ── Fetch manifests ── */

      var results = await Promise.all([
        fetch('posts/index.json').then(function(r) { return r.ok ? r.json() : []; }).catch(function() { return []; }),
        fetch('ai-posts/index.json').then(function(r) { return r.ok ? r.json() : []; }).catch(function() { return []; }),
        fetch('papers/index.json').then(function(r) { return r.ok ? r.json() : []; }).catch(function() { return []; })
      ]);

      var posts   = results[0].sort(function(a, b) { return new Date(b.added) - new Date(a.added); });
      var aiPosts = results[1].sort(function(a, b) { return new Date(b.added) - new Date(a.added); });
      var papers  = results[2].sort(function(a, b) { return new Date(b.added) - new Date(a.added); });

      /* ── Row 1: Featured Post (latest from posts/) ── */

      var featuredEl = document.getElementById('featured-post');
      if (posts.length > 0) {
        var latest = posts[0];
        var parsed = await parsePostHTML('posts/' + latest.slug);
        if (parsed) {
          featuredEl.href = 'posts/' + latest.slug + '/index.html';
          var artHtml = '';
          if (parsed.image) {
            artHtml = '<div class="featured-art"><img src="' + escapeHtml(parsed.image) + '" alt=""></div>';
          }
          featuredEl.innerHTML =
            '<div class="featured-text">'
            + '<h2 class="featured-title">' + escapeHtml(parsed.title) + '</h2>'
            + '<p class="featured-excerpt">' + escapeHtml(parsed.excerpt) + '</p>'
            + '<span class="featured-cta">Read <span class="arrow">\u2192</span></span>'
            + '</div>'
            + artHtml;
        }
      }

      /* ── Row 2 Col 1: AI Post (paginated with nav) ── */

      var aiPostEl = document.getElementById('ai-post-callout');
      var aiDateEl = document.getElementById('ai-post-date');
      var aiPostIdx = 0;

      async function renderAiPost() {
        if (aiPosts.length === 0) return;
        var ai = aiPosts[aiPostIdx];
        var aiParsed = await parsePostHTML('ai-posts/' + ai.slug);
        if (aiParsed) {
          aiPostEl.href = 'ai-posts/' + ai.slug + '/index.html';
          aiPostEl.innerHTML = buildCalloutInner(aiParsed.title, aiParsed.image, aiParsed.excerpt);
        }
        aiDateEl.textContent = ai.added ? ai.added.substring(0, 10) : '';

        var prevBtn = document.getElementById('ai-post-prev');
        var nextBtn = document.getElementById('ai-post-next');
        var latestBtn = document.getElementById('ai-post-latest');
        prevBtn.disabled = aiPostIdx >= aiPosts.length - 1;
        prevBtn.classList.toggle('artagent-btn-disabled', prevBtn.disabled);
        nextBtn.disabled = aiPostIdx <= 0;
        nextBtn.classList.toggle('artagent-btn-disabled', nextBtn.disabled);
        latestBtn.disabled = aiPostIdx === 0;
        latestBtn.classList.toggle('artagent-btn-disabled', latestBtn.disabled);
      }

      document.getElementById('ai-post-prev').addEventListener('click', function() {
        if (aiPostIdx < aiPosts.length - 1) { aiPostIdx++; renderAiPost(); }
      });
      document.getElementById('ai-post-next').addEventListener('click', function() {
        if (aiPostIdx > 0) { aiPostIdx--; renderAiPost(); }
      });
      document.getElementById('ai-post-latest').addEventListener('click', function() {
        if (aiPostIdx !== 0) { aiPostIdx = 0; renderAiPost(); }
      });

      await renderAiPost();

      /* ── Row 2 Cols 2-3: Papers (paginated, 2 at a time) ── */

      var papersPage = 0;
      var papersPerPage = 2;

      function renderPapersPage() {
        var pagePapers = papers.slice(papersPage, papersPage + papersPerPage);
        for (var pi = 0; pi < papersPerPage; pi++) {
          var pEl = document.getElementById('paper-callout-' + (pi + 1));
          if (!pEl) continue;
          if (pi < pagePapers.length) {
            var paper = pagePapers[pi];
            var paperImg = 'papers/' + paper.slug + '/' + (paper.image || 'image.png');
            var paperExcerpt = paper.abstract || '';
            if (paperExcerpt.length > 150) paperExcerpt = paperExcerpt.substring(0, 147) + '\u2026';
            pEl.href = 'papers/' + paper.slug + '/index.html';
            pEl.innerHTML = buildCalloutInner(paper.title, paperImg, paperExcerpt);
            pEl.style.display = '';
          } else {
            pEl.innerHTML = '';
            pEl.style.display = 'none';
          }
        }
        var prevBtn = document.getElementById('papers-prev');
        var nextBtn = document.getElementById('papers-next');
        prevBtn.disabled = papersPage === 0;
        prevBtn.classList.toggle('artagent-btn-disabled', papersPage === 0);
        var maxStart = papers.length - papersPerPage;
        nextBtn.disabled = papersPage >= maxStart;
        nextBtn.classList.toggle('artagent-btn-disabled', papersPage >= maxStart);
      }

      document.getElementById('papers-prev').addEventListener('click', function() {
        if (papersPage > 0) { papersPage--; renderPapersPage(); }
      });
      document.getElementById('papers-next').addEventListener('click', function() {
        var maxStart = papers.length - papersPerPage;
        if (papersPage < maxStart) { papersPage++; renderPapersPage(); }
      });

      renderPapersPage();

      /* ── Row 3: Older posts (2nd, 3rd, 4th most recent) ── */

      var olderPosts = posts.slice(1, 4);
      if (olderPosts.length > 0) {
        for (var oi = 0; oi < 3; oi++) {
          var cellEl = document.getElementById('post-callout-' + (oi + 2));
          if (oi < olderPosts.length) {
            var olderParsed = await parsePostHTML('posts/' + olderPosts[oi].slug);
            if (olderParsed) {
              cellEl.href = 'posts/' + olderPosts[oi].slug + '/index.html';
              cellEl.innerHTML = buildCalloutInner(olderParsed.title, olderParsed.image, olderParsed.excerpt);
              cellEl.style.display = '';
            }
          }
        }
      }

    })();
  </script>

</body>
</html>
